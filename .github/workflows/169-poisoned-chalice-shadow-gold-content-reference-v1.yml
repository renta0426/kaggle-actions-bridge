name: Poisoned Chalice Gold content-reference calibration v1

on:
  push:
    branches: [main]
    paths:
      - requests/poisoned-chalice-shadow-gold-content-reference-v1.json
      - scripts/poisoned_chalice_shadow_gold_content_reference_v1.py
      - materialized/poisoned-chalice-shadow-gold-content-reference-v1/**
      - .github/workflows/169-poisoned-chalice-shadow-gold-content-reference-v1.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-shadow-gold-content-reference-v1.json
      - scripts/poisoned_chalice_shadow_gold_content_reference_v1.py
      - materialized/poisoned-chalice-shadow-gold-content-reference-v1/**
      - .github/workflows/169-poisoned-chalice-shadow-gold-content-reference-v1.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-shadow-gold-content-reference-v1.json
  LAUNCHER_PATH: scripts/poisoned_chalice_shadow_gold_content_reference_v1.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_KERNEL: renta0426/shadow-gold-content-reference-v1
  TARGET_COMPETITION: poisoned-chalice-icse27
  MAX_ACTIVE_REMOTE_RUNS: "2"

jobs:
  validate:
    name: Validate Gold content-reference bundle without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact request, snapshots, and final Notebook
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          import hashlib, json, pathlib, ssl, sys, time, urllib.request
          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          ctx = ssl.create_default_context()
          expected = {
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/controlled_transfer.py": (65536,"09b04c10d934654044817bb9b36fd7358a2aa942"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/shadow_gold_corpus.py": (32768,"241e3481f7dc56f5fc7495436f3cfc33274a0823"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/shadow_gold_kaggle.py": (65536,"e68eb320605a943bb7d46b0e9ce51bb06142ffef"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/shadow_gold_transfer.py": (65536,"1ee969fe852f8a18d00a5c0249f4a8a90d61338a"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/shadow_protocol.py": (65536,"1c47b80696050aa2e5e7c62384617df61ecb80da"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/shadow_scoring.py": (65536,"6bc2b55bec2a32cbb3b0cfe870e426f80260730d"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/shadow_training.py": (65536,"2fe3cf2079659ae10e1ebe0d5973f3ce96c26a03"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/shadow_training_dual_gpu.py": (65536,"c75a5963fa930916024cb16b4fbf562ba4afa818"),
              "materialized/poisoned-chalice-shadow-gold-v1/poisoned_chalice/stage2_api.py": (65536,"16578d3e01b6471e5bfb2b04cebb99e1b3126c7c"),
              "materialized/poisoned-chalice-shadow-gold-v2/poisoned_chalice/shadow_gold_kaggle_v2.py": (32768,"df6e67f7d0e67d2585fd6226b9d2592223f808d2"),
              "materialized/poisoned-chalice-shadow-gold-positive-control-v1/poisoned_chalice/shadow_gold_positive_control.py": (65536,"8b14ba725a939b8a7c21aff93f70165c304fde79"),
              "materialized/poisoned-chalice-shadow-gold-positive-control-v1/shadow_gold_positive_control_v1.json": (32768,"424fe2674daebc1bba51b560d9ad057dff2b82c2"),
              "materialized/poisoned-chalice-shadow-gold-positive-control-v2/poisoned_chalice/shadow_gold_positive_control_v2.py": (32768,"374a6197b4238f4ea7279b27f08edb2a6f366e50"),
              "materialized/poisoned-chalice-shadow-gold-content-reference-v1/poisoned_chalice/shadow_gold_content_reference.py": (65536,"433258dfdb1c10b88062c05ea946579383471638"),
              "materialized/poisoned-chalice-shadow-gold-content-reference-v1/shadow_gold_content_reference_v1.json": (32768,"3bad0da78840ffb8e3ca72addc45101114fe7761"),
          }
          def fetch(path, maximum):
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
                      with urllib.request.urlopen(req,timeout=30,context=ctx) as response:
                          data=response.read(maximum+1)
                      if len(data)>maximum: raise SystemExit(f"file too large: {path}")
                      dst=root/path; dst.parent.mkdir(parents=True,exist_ok=True); dst.write_bytes(data); return data
                  except Exception as exc:
                      last=exc
                      if attempt<2: time.sleep(attempt+1)
              raise SystemExit(f"read-only bridge fetch failed: {path}: {last}")
          def git_blob(data): return hashlib.sha1(b"blob "+str(len(data)).encode()+b"\0"+data).hexdigest()
          request=json.loads(fetch("requests/poisoned-chalice-shadow-gold-content-reference-v1.json",65536))
          launcher=fetch("scripts/poisoned_chalice_shadow_gold_content_reference_v1.py",262144)
          exact={
              "request_id":"20260906-poisoned-chalice-shadow-gold-content-reference-v1-001",
              "parent_request_id":"20260906-poisoned-chalice-shadow-gold-generic-aggregation-v1-001",
              "competition":"poisoned-chalice-icse27",
              "operation":"kernel_run",
              "target":"renta0426/shadow-gold-content-reference-v1",
              "launcher_path":"scripts/poisoned_chalice_shadow_gold_content_reference_v1.py",
              "research_commit":"d9e1b66d65c7b38a9367aef538b3997cc2d713dc",
              "generic_aggregation_result_commit":"0a773f252cd89de50eb9ff9b67a94ed2e9baf426",
              "probe_local_result_commit":"844d83992ff364ee7bc43ae3560fb06540e2bd99",
              "execution_id":"shadow-gold-content-reference-v1",
              "automatic_compute_retries":0,
              "enable_internet":False,
              "competition_submission":False,
          }
          for key,value in exact.items():
              if request.get(key)!=value: raise SystemExit(f"content-reference request changed: {key}")
          if git_blob(launcher)!=request.get("launcher_blob_sha"): raise SystemExit("content-reference launcher blob mismatch")
          items=request.get("materialized_files") or []
          observed={item.get("bridge_path"):(int(item.get("max_bytes",-1)),item.get("git_blob_sha")) for item in items}
          if observed!=expected or len(items)!=15: raise SystemExit("content-reference snapshot contract changed")
          for path,(maximum,blob) in expected.items():
              if git_blob(fetch(path,maximum))!=blob: raise SystemExit(f"content-reference snapshot mismatch: {path}")
          resource=request.get("resource") or {}
          if resource.get("accelerator")!="gpu" or resource.get("machine_shape")!="NvidiaTeslaT4" or resource.get("expected_visible_gpu_count")!=2 or resource.get("max_active_runs")!=2: raise SystemExit("content-reference resource contract changed")
          if resource.get("hard_timeout_minutes")!=120 or float(resource.get("min_remaining_quota_hours",-1))!=1.0: raise SystemExit("content-reference timeout/quota changed")
          if request.get("persistent_outputs")!=["content_reference_selected.json","content_reference_metrics.json","content_reference_predictions.jsonl","content_reference_runtime_manifest.json"]: raise SystemExit("content-reference output allowlist changed")
          clean=request.get("clean_room") or {}
          for key in ("reference_fit_uses_labels","reference_uses_benchmark_id","probe_boundary_used","probe_text_used","probe_local_score_used_as_candidate","benchmark_id_used_as_model_input","evaluation_labels_passed_to_training_children","pretrained_weights_used","protected_job_private_repository_access","external_model_holdout_consumed","fourth_external_holdout_consumed"):
              if clean.get(key) is not False: raise SystemExit(f"content-reference clean-room guard changed: {key}")
          if clean.get("reference_leave_one_file_out") is not True or clean.get("features_sealed_before_label_reveal") is not True or clean.get("competition_rows_used")!=0 or clean.get("external_rows_used")!=0: raise SystemExit("content-reference label/reference boundary changed")
          science=request.get("scientific_contract") or {}
          frozen={
              "training_unchanged_from_positive_control_v2":True,"exposure_repeats":16,"training_sequences":81920,"optimizer_steps_per_architecture":1280,
              "reference_version":"loo-byte-ngram-difficulty-v1","reference_ngram_order":5,"reference_max_context_bytes":4,"reference_additive_alpha":0.5,"reference_minimum_context_count":4,
              "candidate_count":7,"selection_architecture":"left","blind_transfer_architecture":"right","baseline_candidate":"loss_max",
              "minimum_holdout_auc_each_architecture":0.56,"minimum_auc_gain_vs_baseline_each_architecture":0.03,"minimum_tpr_at_1pct_fpr_each_architecture":0.015,
              "reference_only_auc_lower_bound":0.45,"reference_only_auc_upper_bound":0.55,"all_conditions_required":True,
              "failed_gate_is_valid_scientific_result_not_runtime_failure":True,"stage2_v3_selection_allowed":False,"competition_feature_promotion_allowed":False,
          }
          for key,value in frozen.items():
              if science.get(key)!=value: raise SystemExit(f"content-reference scientific contract changed: {key}")
          print("SHADOW_GOLD_CONTENT_REF_V1_EXACT_REQUEST PASS snapshots=15 candidates=7 training_changed=0 loo=1 probe_boundary=0 outputs=4 private_repo_access=0")
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" --static --launcher "${workdir}/${LAUNCHER_PATH}"
          python3 "${workdir}/${LAUNCHER_PATH}" --materialize --snapshot-root "${workdir}" --kernel-dir "${workdir}/kernel"
          python3 - "${workdir}/kernel" <<'PY'
          import ast,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); notebook=json.loads((root/'shadow-gold-content-reference-v1.ipynb').read_text()); metadata=json.loads((root/'kernel-metadata.json').read_text())
          code=''.join(notebook['cells'][1]['source']); compile(code,'shadow-gold-content-reference-v1.ipynb','exec'); tree=ast.parse(code)
          for marker in ('d9e1b66d65c7b38a9367aef538b3997cc2d713dc','run_content_reference_benchmark','reference_leave_one_file_out','known_probe_boundary_used','content_reference_metrics.json'): assert marker in code
          calls=[n for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name) and n.func.id=='run_content_reference_benchmark']; assert len(calls)==1
          assert metadata.get('id')=='renta0426/shadow-gold-content-reference-v1' and metadata.get('title')=='Gold content-reference calibration v1'
          assert metadata.get('enable_gpu') is True and metadata.get('enable_tpu') is False and metadata.get('enable_internet') is False and metadata.get('machine_shape')=='NvidiaTeslaT4'
          assert metadata.get('dataset_sources')==[] and metadata.get('kernel_sources')==[] and metadata.get('competition_sources')==[] and metadata.get('model_sources')==[]
          print('SHADOW_GOLD_CONTENT_REF_V1_VALIDATE PASS gpu=2 steps=1280 eval=5120 candidates=7 loo=1 outputs=4')
          PY

  launch:
    name: Launch Gold content-reference T4 x2 calibration
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/169-poisoned-chalice-shadow-gold-content-reference-v1.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" && -z "${RESEARCH_REPO_READ_TOKEN-}" ]]
          echo "SHADOW_GOLD_CONTENT_REF_V1_PROTECTED_BOUNDARY PASS max_active=2 private_repo_access=0"

      - name: Materialize exact public bundle and locked Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; kernel_dir="${workdir}/kernel"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"; echo "KERNEL_DIR=${kernel_dir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}/repo" <<'PY'
          import io,os,pathlib,ssl,sys,tarfile,urllib.request
          sha,target_value=sys.argv[1:]; target=pathlib.Path(target_value); target.mkdir(parents=True)
          url=f"https://api.github.com/repos/{os.environ['EXPECTED_REPOSITORY']}/tarball/{sha}"
          req=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge/1'})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response: archive=response.read(25_000_001)
          if len(archive)>25_000_000: raise SystemExit('bridge commit archive exceeds byte budget')
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as tf:
              members=tf.getmembers(); prefixes={m.name.split('/',1)[0] for m in members if m.name}
              if len(prefixes)!=1: raise SystemExit('unexpected archive layout')
              prefix=next(iter(prefixes))+'/'
              for member in members:
                  if not member.isfile(): continue
                  if not member.name.startswith(prefix): raise SystemExit('unexpected archive member')
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit('unsafe archive path')
                  data=tf.extractfile(member).read(); out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY
          repo="${workdir}/repo"
          python3 - "${repo}/${REQUEST_PATH}" "${repo}/${LAUNCHER_PATH}" <<'PY'
          import hashlib,json,pathlib,sys
          request_path,launcher_path=map(pathlib.Path,sys.argv[1:]); request=json.loads(request_path.read_text()); launcher=launcher_path.read_bytes()
          blob=hashlib.sha1(b'blob '+str(len(launcher)).encode()+b'\0'+launcher).hexdigest()
          if blob!=request.get('launcher_blob_sha'): raise SystemExit('protected launcher blob mismatch')
          if request.get('target')!='renta0426/shadow-gold-content-reference-v1' or request.get('research_commit')!='d9e1b66d65c7b38a9367aef538b3997cc2d713dc': raise SystemExit('protected request identity changed')
          if len(request.get('materialized_files') or [])!=15 or request.get('automatic_compute_retries')!=0 or request.get('competition_submission') is not False: raise SystemExit('protected request contract changed')
          print('SHADOW_GOLD_CONTENT_REF_V1_PROTECTED_MATERIAL PASS snapshots=15 private_repo_access=0')
          PY
          python3 "${repo}/${LAUNCHER_PATH}" --static --launcher "${repo}/${LAUNCHER_PATH}"
          python3 "${repo}/${LAUNCHER_PATH}" --materialize --snapshot-root "${repo}" --kernel-dir "${kernel_dir}"
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${repo}/${LOCK_PATH}" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "KAGGLE_BIN=${workdir}/kaggle-venv/bin/kaggle" >> "${GITHUB_ENV}"
          echo "LAUNCHER_RUNTIME=${repo}/${LAUNCHER_PATH}" >> "${GITHUB_ENV}"
          echo "SHADOW_GOLD_CONTENT_REF_V1_CLIENT PASS"

      - name: Confirm current Kaggle policy pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl,time,urllib.request
          ctx=ssl.create_default_context()
          for url in ('https://www.kaggle.com/terms','https://www.kaggle.com/aup','https://www.kaggle.com/community-guidelines','https://www.kaggle.com/docs/api','https://www.kaggle.com/docs/notebooks'):
              last=None
              for attempt in range(3):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge/1'})
                      with urllib.request.urlopen(req,timeout=30,context=ctx) as response:
                          if response.status!=200 or not response.read(65536): raise RuntimeError('empty response')
                      break
                  except Exception as exc:
                      last=exc
                      if attempt==2: raise SystemExit(f'official Kaggle page unavailable: {url}: {last}')
                      time.sleep(attempt+1)
          print('SHADOW_GOLD_CONTENT_REF_V1_POLICY PASS')
          PY

      - name: Admit one of two GPU slots and launch exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -z "${RESEARCH_REPO_READ_TOKEN-}" && -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${KAGGLE_BIN%/kaggle}/python" - <<'PY'
          import os,re
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate(); target=os.environ['TARGET_KERNEL']; max_active=int(os.environ['MAX_ACTIVE_REMOTE_RUNS'])
          pages=api.competition_list_pages(os.environ['TARGET_COMPETITION']) or []; content={}
          for page in pages:
              data=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(data.get('name') or '').strip().lower()
              if name: content[name]=str(data.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in name for name in content): raise SystemExit('live competition pages unavailable')
          plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',content['evaluation'].replace(r'\%','%'))).casefold()
          if not all(token in plain for token in ('auc','novelty','1%','false-positive')): raise SystemExit('evaluation contract changed')
          visible=api.kernels_list(user='renta0426',search='shadow-gold-content-reference-v1',page_size=20) or []
          if any(str(getattr(item,'ref',''))==target for item in visible): raise SystemExit('content-reference target already exists')
          quota=api.quota_view(); gpu=getattr(quota,'gpu_quota',None); used=getattr(gpu,'time_used',None); total=getattr(gpu,'total_time_allowed',None)
          if used is None or total is None: raise SystemExit('GPU quota unavailable')
          remaining=max(0.0,(total-used).total_seconds()/3600.0)
          if remaining<1.0: raise SystemExit(f'insufficient GPU quota: {remaining:.2f}h')
          recent=(api.kernels_list(user='renta0426',sort_by='dateRun',page_size=25) or [])[:25]; active=0; unknown=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref: continue
              try: status=str(getattr(api.kernels_status(ref),'status','')).upper()
              except Exception: unknown+=1; continue
              if any(token in status for token in ('RUNNING','QUEUED','PENDING')): active+=1
          if unknown: raise SystemExit(f'conservative admission refused: active={active} unknown={unknown} max_active={max_active}')
          if active>=max_active: raise SystemExit(f'concurrency admission refused: active={active} max_active={max_active}')
          print(f'SHADOW_GOLD_CONTENT_REF_V1_LIVE_PREFLIGHT PASS quota={remaining:.2f} active={active} max_active={max_active} unknown=0')
          PY
          "${KAGGLE_BIN%/kaggle}/python" "${LAUNCHER_RUNTIME}" --execute --kaggle-bin "${KAGGLE_BIN}" --kernel-dir "${KERNEL_DIR}"

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "SHADOW_GOLD_CONTENT_REF_V1_CLEANUP PASS retention_days=0"
