name: CMI-Flu B2 taskwise compact CPU launch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/98-cmi-flu-b2-launch.yml
      - requests/cmi-flu-b2-launch-v1.json
      - payloads/cmi-flu-b2-001/**
      - requirements/kaggle-2.2.4.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false
  queue: max

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b2-launch-v1.json
  PAYLOAD_DIR: payloads/cmi-flu-b2-001
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-b2-taskwise-compact-20260903-001
  TARGET_SLUG: cmi-flu-b2-taskwise-compact-20260903-001
  REQUESTED_ACCELERATOR: cpu
  EXPECTED_SOURCE_SHA256: a039b56868e5f9e2f10ae8016466a02fe4a6e5342854487ca6c6a198a21abd5e

jobs:
  validate:
    name: Validate immutable B2 request and single-file payload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Reconstruct, verify, compile, and self-test B2 source
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, ssl, sys, urllib.request

          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"

          def read(path: str, limit: int) -> bytes:
              request = urllib.request.Request(base + path, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          request = json.loads(read(os.environ["REQUEST_PATH"], 32768))
          payload = request.get("payload", {})
          expected = {
              "schema_version": 1,
              "request_id": "20260903-cmi-flu-b2-001",
              "competition": os.environ["TARGET_COMPETITION"],
              "operation": "kernel_run",
              "target": os.environ["TARGET_KERNEL"],
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f"request identity mismatch: {key}")
          if request.get("resource") != {
              "accelerator": "cpu",
              "expected_runtime_minutes": 120,
              "hard_timeout_minutes": 240,
              "max_active_runs": 1,
          }:
              raise SystemExit("B2 resource contract mismatch")
          if request.get("automatic_compute_retries") != 0 or request.get("enable_internet") is not False:
              raise SystemExit("B2 retry/internet contract mismatch")
          if request.get("side_effects") != ["create one private Notebook version and start one CPU run"]:
              raise SystemExit("B2 side-effect allowlist mismatch")
          if payload.get("part_count") != 20 or payload.get("size_bytes") != 92839:
              raise SystemExit("B2 payload count/size contract mismatch")
          if payload.get("source_sha256") != os.environ["EXPECTED_SOURCE_SHA256"]:
              raise SystemExit("B2 request source SHA mismatch")
          if payload.get("source_commit") != "1596ba5b7ab2369c0b70c9da178aec1d71c80658":
              raise SystemExit("B2 source commit mismatch")
          if payload.get("merged_cmi_commit") != "1503f5989feb00313f2851602e2c4eda8685000a":
              raise SystemExit("B2 merged CMI commit mismatch")
          if payload.get("package_zip_sha256") != "390a84bfc4393960ad1dfeab6a92a56cc8db57b1ae7c8063d8c2bf8b072b8ce0":
              raise SystemExit("B2 package ZIP SHA mismatch")

          parts = [
              read(f"{os.environ['PAYLOAD_DIR']}/part-{index:02d}", 5000)
              for index in range(20)
          ]
          source = b"".join(parts)
          if len(source) != 92839:
              raise SystemExit(f"B2 reconstructed size mismatch: {len(source)}")
          digest = hashlib.sha256(source).hexdigest()
          if digest != os.environ["EXPECTED_SOURCE_SHA256"]:
              raise SystemExit(f"B2 reconstructed SHA mismatch: {digest}")
          sums = read(f"{os.environ['PAYLOAD_DIR']}/SHA256SUMS", 512).decode("utf-8")
          if sums != f"{digest}  run_b2_kaggle_bundle.py\n":
              raise SystemExit("B2 SHA256SUMS mismatch")

          replacement = payload.get("replacement", {})
          text = source.decode("utf-8")
          old = replacement.get("old")
          new = replacement.get("new")
          count = replacement.get("count")
          if not isinstance(old, str) or not isinstance(new, str) or count != 1 or text.count(old) != 1:
              raise SystemExit("B2 request replacement contract mismatch")
          text = text.replace(old, new)
          if "__REQUEST_ID__" in text:
              raise SystemExit("B2 request placeholder remains")
          compile(text, "script.py", "exec")
          (root / "script.py").write_text(text, encoding="utf-8")

          lock = read(os.environ["LOCK_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          print(f"CMI_FLU_B2_SOURCE_STATIC PASS bytes={len(source)} sha256={digest}")
          PY
          python3 "${workdir}/script.py" --self-test

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

  launch:
    name: Admit or launch exactly one B2 CPU run
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/98-cmi-flu-b2-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_CMI_FLU_B2_BOUNDARY PASS"

      - name: Prepare locked Kaggle CLI and exact B2 script
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, ssl, sys, urllib.request

          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"

          def read(path: str, limit: int) -> bytes:
              request = urllib.request.Request(base + path, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          request = json.loads(read(os.environ["REQUEST_PATH"], 32768))
          payload = request["payload"]
          if request["request_id"] != "20260903-cmi-flu-b2-001" or request["target"] != os.environ["TARGET_KERNEL"]:
              raise SystemExit("B2 request identity mismatch")
          if payload["source_sha256"] != os.environ["EXPECTED_SOURCE_SHA256"]:
              raise SystemExit("B2 request SHA mismatch")
          source = b"".join(
              read(f"{os.environ['PAYLOAD_DIR']}/part-{index:02d}", 5000)
              for index in range(payload["part_count"])
          )
          if len(source) != payload["size_bytes"] or hashlib.sha256(source).hexdigest() != payload["source_sha256"]:
              raise SystemExit("B2 reconstructed source mismatch")
          text = source.decode("utf-8")
          replacement = payload["replacement"]
          if text.count(replacement["old"]) != replacement["count"]:
              raise SystemExit("B2 replacement occurrence mismatch")
          text = text.replace(replacement["old"], replacement["new"])
          compile(text, "script.py", "exec")
          (root / "script.py").write_text(text, encoding="utf-8")

          lock = read(os.environ["LOCK_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          print(f"CMI_FLU_B2_SCRIPT_READY sha256={hashlib.sha256(text.encode()).hexdigest()} bytes={len(text.encode())}")
          PY
          python3 "${workdir}/script.py" --self-test
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Fetch live Competition rules and determine CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live Competition policy pages unavailable")
          plain = lambda value: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", value)).casefold()
          rules = plain(content["rules"])
          evaluation = plain(content["evaluation"])
          data_text = " ".join(plain(content[name]) for name in content if "data" in name)
          if not all(term in rules for term in (
              "maximum of five (5) submissions per day",
              "maximum team size is five (5)",
              "data security",
              "external data and tools",
          )):
              raise SystemExit("live Competition rules differ from approved guardrails")
          if not all(term in evaluation for term in ("mean spearman correlation", "40 donors", "-99")):
              raise SystemExit("live Competition evaluation differs from approved guardrails")
          if "sample_submission_part1.csv" not in data_text or "investigations_260821.tsv" not in data_text:
              raise SystemExit("live Competition data description differs from expected inputs")

          target = os.environ["TARGET_KERNEL"]
          existing = api.kernels_list(user="renta0426", search=os.environ["TARGET_SLUG"], page_size=5) or []
          if target in {str(getattr(item, "ref", "")) for item in existing}:
              raise SystemExit("target kernel already exists; duplicate refused")

          active_refs = []
          recent = api.kernels_list(user="renta0426", sort_by="dateRun", page_size=15) or []
          for item in recent[:15]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              try:
                  status = str(getattr(api.kernels_status(ref), "status", "")).upper()
              except Exception:
                  continue
              if any(token in status for token in ("RUNNING", "QUEUED", "PENDING")):
                  active_refs.append(ref)

          active_by_resource = {"cpu": [], "gpu": [], "tpu": [], "unknown": []}
          if len(active_refs) > 5:
              active_by_resource["unknown"].extend(active_refs)
          else:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      resource = "unknown"
                      try:
                          owner, slug = ref.split("/", 1)
                          request = ApiGetKernelRequest()
                          request.user_name = owner
                          request.kernel_slug = slug
                          details = client.kernels.kernels_api_client.get_kernel(request)
                          metadata = getattr(details, "metadata", None)
                          if metadata is not None:
                              if bool(getattr(metadata, "enable_tpu", False)):
                                  resource = "tpu"
                              elif bool(getattr(metadata, "enable_gpu", False)):
                                  resource = "gpu"
                              else:
                                  resource = "cpu"
                      except Exception:
                          resource = "unknown"
                      active_by_resource[resource].append(ref)

          same_class = len(active_by_resource["cpu"])
          unknown = len(active_by_resource["unknown"])
          can_launch = same_class + unknown < 1
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"can_launch={'true' if can_launch else 'false'}\n")
          counts = {key: len(value) for key, value in active_by_resource.items()}
          if can_launch:
              print(
                  "LIVE_RULE_PREFLIGHT PASS "
                  f"pages={len(content)} requested=cpu active_cpu={counts['cpu']} "
                  f"active_gpu={counts['gpu']} active_tpu={counts['tpu']} "
                  f"active_unknown={counts['unknown']} internet=false"
              )
          else:
              print(
                  "CMI_FLU_B2_DEFERRED "
                  f"same_class={same_class} unknown={unknown} "
                  f"nonblocking_gpu={counts['gpu']} nonblocking_tpu={counts['tpu']} "
                  "side_effect=false request_unexecuted=true"
              )
          PY

      - name: Record deferred admission
        if: steps.admission.outputs.can_launch != 'true'
        shell: bash
        run: |
          echo 'B2 CPU request was not executed; manually dispatch the same immutable workflow after the blocking CPU/unknown run ends.'

      - name: Materialize one Python file and push one private CPU run
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"
          mkdir -p "${kernel_dir}"
          cp "${WORKDIR}/script.py" "${kernel_dir}/script.py"
          "${WORKDIR}/venv/bin/python" - "${kernel_dir}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = {
              "id": os.environ["TARGET_KERNEL"],
              "title": "CMI Flu B2 Taskwise Compact 20260903 001",
              "code_file": "script.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "",
              "dataset_sources": [],
              "competition_sources": [os.environ["TARGET_COMPETITION"]],
              "kernel_sources": [],
              "model_sources": [],
          }
          (root / "kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          [[ "$(find "${kernel_dir}" -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 1 ]]
          [[ -f "${kernel_dir}/script.py" && ! -L "${kernel_dir}/script.py" ]]
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 14400 \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo 'ERROR: Kaggle B2 kernel push/run failed; response suppressed'
            exit 1
          fi
          echo "CMI_FLU_B2_LAUNCH PASS request_id=20260903-cmi-flu-b2-001 target=${TARGET_KERNEL} accelerator=cpu internet=false automatic_compute_retries=0 timeout=14400"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'Runner-local CMI-Flu B2 source and token-adjacent files removed'
