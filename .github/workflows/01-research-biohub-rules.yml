name: Research Biohub competition rules

on:
  push:
    branches:
      - research/biohub-resource-rules
    paths:
      - .github/workflows/01-research-biohub-rules.yml

permissions: {}

concurrency:
  group: research-biohub-resource-rules
  cancel-in-progress: true

jobs:
  fetch-rules:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch public competition rules page API
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://www.kaggle.com/api/v1/competitions/biohub-cell-tracking-during-development/pages"
          url = base + "?" + urllib.parse.urlencode({"pageName": "rules"})
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "kaggle-actions-bridge-rules-research/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  raw = response.read(2_000_001)
                  print(f"HTTP_STATUS={response.status}")
                  print(f"CONTENT_TYPE={response.headers.get('Content-Type', '')}")
          except urllib.error.HTTPError as exc:
              raw = exc.read(2_000_001)
              print(f"HTTP_STATUS={exc.code}")
              print(f"CONTENT_TYPE={exc.headers.get('Content-Type', '')}")
          if len(raw) > 2_000_000:
              raise SystemExit("rules response exceeded 2 MB")
          print(f"RESPONSE_BYTES={len(raw)}")
          text = raw.decode("utf-8", errors="replace")
          try:
              data = json.loads(text)
          except json.JSONDecodeError:
              print("JSON_PARSE=FAIL")
              print("RESPONSE_PREVIEW_BEGIN")
              print(text[:5000])
              print("RESPONSE_PREVIEW_END")
              raise SystemExit(1)
          print("JSON_PARSE=PASS")
          print("TOP_LEVEL_TYPE=" + type(data).__name__)
          if isinstance(data, dict):
              print("TOP_LEVEL_KEYS=" + ",".join(sorted(data)))
              pages = data.get("pages") or data.get("competitionPages") or data.get("items") or []
          elif isinstance(data, list):
              pages = data
          else:
              pages = []
          print(f"PAGE_COUNT={len(pages) if isinstance(pages, list) else -1}")
          print("RULES_JSON_BEGIN")
          print(json.dumps(data, ensure_ascii=False, indent=2))
          print("RULES_JSON_END")
          PY
