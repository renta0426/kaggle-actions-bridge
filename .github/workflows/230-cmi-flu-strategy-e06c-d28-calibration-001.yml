name: CMI-Flu strategy E06c D28 calibration CPU 001 argv-repaired

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/230-cmi-flu-strategy-e06c-d28-calibration-001.yml
      - .github/workflows/229-cmi-flu-strategy-e06c-d28-calibration-001.yml
      - requests/cmi-flu-strategy-e06c-d28-calibration-001.json
      - payloads/cmi-flu-strategy-e06c-d28-calibration-001/**
      - scripts/cmi_flu_strategy_e06c_prepare.py
      - scripts/cmi_flu_strategy_e06c_prepare_v2.py
      - scripts/cmi_flu_strategy_e06c_execute.py
      - scripts/cmi_flu_strategy_e06c_sanitize.py
      - scripts/test_cmi_e06c_runtime_contract.py
  pull_request:
    paths:
      - .github/workflows/230-cmi-flu-strategy-e06c-d28-calibration-001.yml
      - .github/workflows/229-cmi-flu-strategy-e06c-d28-calibration-001.yml
      - requests/cmi-flu-strategy-e06c-d28-calibration-001.json
      - payloads/cmi-flu-strategy-e06c-d28-calibration-001/**
      - scripts/cmi_flu_strategy_e06c_prepare.py
      - scripts/cmi_flu_strategy_e06c_prepare_v2.py
      - scripts/cmi_flu_strategy_e06c_execute.py
      - scripts/cmi_flu_strategy_e06c_sanitize.py
      - scripts/test_cmi_e06c_runtime_contract.py

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260909-cmi-flu-strategy-e06c-d28-calibration-001
  SCIENCE_COMMIT: 044d28e3c7e9ab23fa531f57479b03e2437bb1cb
  E06C_BLOB: 90c6e3e2791cc2089d8666f4c8672a47953f5e12
  E06C_SYNTHETIC_BLOB: a8590ff167327e7cec0e293afeb95b8439f9c6fe
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E06c argv-repaired prewrite lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e06c-argv-repair/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(45_000_001)
          if len(data)>45_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Verify exact science relay and unchanged request
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          def git_blob(path):
              data=path.read_bytes(); return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert git_blob(root/'payloads/cmi-flu-strategy-e06c-d28-calibration-001/strategy_e06c.py')=='90c6e3e2791cc2089d8666f4c8672a47953f5e12'
          assert git_blob(root/'payloads/cmi-flu-strategy-e06c-d28-calibration-001/strategy_e06c_synthetic.py')=='a8590ff167327e7cec0e293afeb95b8439f9c6fe'
          r=json.loads((root/'requests/cmi-flu-strategy-e06c-d28-calibration-001.json').read_text())
          assert r['request_id']=='20260909-cmi-flu-strategy-e06c-d28-calibration-001'
          assert r['target']=='renta0426/cmi-flu-e06c-d28-calibration-20260909-001'
          assert r['science_source_commit']=='044d28e3c7e9ab23fa531f57479b03e2437bb1cb'
          assert r['expected_kernel_version']==1 and r['enable_internet'] is False
          assert r['competition_submission_attempted'] is False and r['leaderboard_used_for_selection'] is False and r['automatic_compute_retries']==0
          PY

      - name: Build exact runtime and validate executor argv before any credential
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_prepare_v2.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06c_runtime_contract.py" --runtime "${WORKDIR}/runtime.py"
          python3 -m venv "${WORKDIR}/argv-venv"
          "${WORKDIR}/argv-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/argv-venv/bin/python" -m pip check >/dev/null
          help_text="$(PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/argv-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_execute.py" --help)"
          grep -F -- '--runtime' <<<"${help_text}" >/dev/null
          grep -F -- '--bridge-root' <<<"${help_text}" >/dev/null
          grep -F -- '--output-dir' <<<"${help_text}" >/dev/null
          ! grep -F -- '--reference-dir' <<<"${help_text}" >/dev/null
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_prepare_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_sanitize.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06c_runtime_contract.py"
          ! grep -R -E 'kaggle[[:space:]]+competitions[[:space:]]+submit|competition_submit\(' \
            "${WORKDIR}/runtime.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_"* >/dev/null
          grep -F 'Path("/tmp")' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'cmi-flu-e05-locked-references' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F '/kaggle/working/.e05-locked-references' "${WORKDIR}/runtime.py" >/dev/null
          echo CMI_FLU_E06C_ARGV_REPAIR_VALIDATE_PASS

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one argv-repaired private CPU E06c and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/230-cmi-flu-strategy-e06c-d28-calibration-001.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e06c-argv-repair/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(45_000_001)
          if len(data)>45_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Check current public Kaggle policy pages
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/kaggle_policy_preflight.py"

      - name: Build exact E06c runtime and locked references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_prepare_v2.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06c_runtime_contract.py" --runtime "${WORKDIR}/runtime.py"

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run one approved E06c CPU kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --bridge-root "${WORKDIR}/bridge" \
            --output-dir "${WORKDIR}/output"

      - name: Validate aggregate-only E06c result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06c_sanitize.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
