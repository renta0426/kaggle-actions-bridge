name: CMI-Flu fixed source archive probe

on:
  push:
    paths:
      - .github/workflows/75-cmi-flu-source-archive-probe.yml

permissions: {}

concurrency:
  group: cmi-flu-source-archive-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify fixed public GitHub archive without credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import io
          import pathlib
          import ssl
          import tarfile
          import urllib.parse
          import urllib.request

          commit = "1e075cfa565698f708e872d22be629f97704a24f"
          url = (
              "https://api.github.com/repos/renta0426/"
              "CMI-Flu-Invited-Prediction-Challenge/tarball/" + commit
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "kaggle-actions-bridge-cmi-flu-source-probe/1",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
              if response.status != 200:
                  raise SystemExit(f"archive HTTP status={response.status}")
              final = urllib.parse.urlparse(response.geturl())
              if final.scheme != "https" or final.hostname != "codeload.github.com":
                  raise SystemExit("unexpected GitHub archive redirect target")
              data = response.read(20_000_001)
          if not data or len(data) > 20_000_000:
              raise SystemExit("archive compressed size outside fixed budget")

          digest = hashlib.sha256(data).hexdigest()
          required = {
              "AGENTS.MD",
              "README.md",
              "pyproject.toml",
              "configs/baseline_b01_anchor.yaml",
              "src/cmi_flu/runner.py",
              "src/cmi_flu/audit.py",
          }
          seen: set[str] = set()
          roots: set[str] = set()
          total_size = 0
          regular_files = 0
          with tarfile.open(fileobj=io.BytesIO(data), mode="r:gz") as archive:
              for member in archive.getmembers():
                  path = pathlib.PurePosixPath(member.name)
                  if path.is_absolute() or ".." in path.parts or not path.parts:
                      raise SystemExit("unsafe archive member path")
                  roots.add(path.parts[0])
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit("unsupported archive member type")
                  if member.isfile():
                      regular_files += 1
                      total_size += int(member.size)
                      if total_size > 50_000_000:
                          raise SystemExit("archive expanded size outside fixed budget")
                      relative = "/".join(path.parts[1:])
                      seen.add(relative)
          if len(roots) != 1:
              raise SystemExit("archive must contain exactly one top-level root")
          root = next(iter(roots))
          if not root.startswith("renta0426-CMI-Flu-Invited-Prediction-Challenge-"):
              raise SystemExit(f"unexpected archive root: {root}")
          missing = sorted(required - seen)
          if missing:
              raise SystemExit(f"archive missing required public source paths: {missing}")
          print(
              "CMI_SOURCE_ARCHIVE "
              f"sha256={digest} compressed_bytes={len(data)} "
              f"expanded_bytes={total_size} files={regular_files} root={root}"
          )
          PY
