name: CMI-Flu Strategy-v2 E12a-v2 portfolio reconciliation repair 002

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-repair-002.yml
      - requests/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.json
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_synthetic.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_portfolio_reconciliation.json
      - scripts/cmi_flu_strategy_e12a_v2_prepare.py
      - scripts/cmi_flu_strategy_e12a_v2_prepare_v2.py
      - scripts/cmi_flu_strategy_e12a_v2_execute.py
      - scripts/cmi_flu_strategy_e12a_v2_sanitize.py
      - scripts/cmi_flu_strategy_e12a_v2_ci.py
      - docs/cmi-flu-e12a-v2-portfolio-reconciliation-001.md
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-repair-002.yml
      - requests/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.json
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_synthetic.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_portfolio_reconciliation.json
      - scripts/cmi_flu_strategy_e12a_v2_prepare.py
      - scripts/cmi_flu_strategy_e12a_v2_prepare_v2.py
      - scripts/cmi_flu_strategy_e12a_v2_execute.py
      - scripts/cmi_flu_strategy_e12a_v2_sanitize.py
      - scripts/cmi_flu_strategy_e12a_v2_ci.py
      - docs/cmi-flu-e12a-v2-portfolio-reconciliation-001.md

permissions: {}

concurrency:
  group: cmi-flu-e12a-v2-portfolio-reconciliation-repair-002-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260911-cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001
  TARGET_KERNEL: renta0426/cmi-flu-e12a-v2-portfolio-reconcile-20260911-001
  SCIENCE_COMMIT: e6e05e578f172ce710bc0f1da55acdf290e83dd9
  E12A_V2_BLOB: 0c4c970c8bacfed61bfbb9587e0a0bfdec7903d9
  CI_BLOB: c3916ad01f393931f26a5b4704c57c9ba8e321d3
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate corrected E12a-v2 terminal regression without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a-v2-repair/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Verify CI source identity and run full secret-free regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_ci.py" "${CI_BLOB}" <<'PY'
          import hashlib,pathlib,sys
          path=pathlib.Path(sys.argv[1]); want=sys.argv[2]
          data=path.read_bytes()
          got=hashlib.sha1(b'blob '+str(len(data)).encode('ascii')+b'\0'+data).hexdigest()
          if got!=want: raise SystemExit(f'E12a-v2 CI blob mismatch:{got}')
          PY
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_ci.py" \
            --repository-root "${WORKDIR}/bridge" \
            --workdir "${WORKDIR}/e12a-v2-ci"

      - name: Validate locked Kaggle client without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one corrected private CPU E12a-v2 reconciliation and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Enforce protected corrected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-repair-002.yml@refs/heads/main" ]]

      - name: Materialize approved bridge commit and re-run secret-free contract checks
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a-v2-protected/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e12a_v2_ci.py" \
            --repository-root "${workdir}/bridge" \
            --workdir "${workdir}/e12a-v2-ci"
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e12a_v2_prepare_v2.py" \
            --repository-root "${workdir}/bridge" \
            --output "${workdir}/runtime.py"
          python3 "${workdir}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${workdir}/runtime.py")" -lt 900000 ]]
          ! grep -F "len(result['tasks'])" "${workdir}/runtime.py" >/dev/null
          ! grep -F 'renta0426/cmi-flu-e12a-final-reproduction-20260910-001' "${workdir}/runtime.py" >/dev/null
          echo 'CMI_FLU_E12A_V2_PROTECTED_PREFLIGHT PASS write=false compute=false terminal_path=true'

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Run one approved E12a-v2 CPU operation and recover current aggregate output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --output-dir "${WORKDIR}/result"

      - name: Validate and print aggregate-safe E12a-v2 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_sanitize.py" --input-dir "${WORKDIR}/result"
          python3 - "${WORKDIR}/result/metrics.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1],encoding='utf-8'))
          safe={
              'experiment':result['experiment'],
              'all_supervised_tasks_reproduced':result['all_supervised_tasks_reproduced'],
              'corrected_task':result['corrected_task'],
              'final_task13':result['frozen_portfolio']['Task1.3'],
              'task13_gain_vs_stale_e01_control':result['task13_strict_anchor_gain_vs_e01_control'],
              'next_step':result['next_step'],
              'competition_submission_attempted':result['competition_submission_attempted'],
          }
          print('CMI_FLU_E12A_V2_RESULT '+json.dumps(safe,sort_keys=True))
          for row in result['supervised_reproduction']:
              print('CMI_FLU_E12A_V2_TASK '+json.dumps({
                  'task':row['task'],
                  'incumbent':row['incumbent'],
                  'observed':row['observed_study_equal_spearman'],
                  'absolute_deviation':row['absolute_deviation'],
                  'reproduced':row['reproduced'],
              },sort_keys=True))
          PY

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
