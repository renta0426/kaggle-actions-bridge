name: Poisoned Chalice Stage1 length-interaction SHA-bound submission

on:
  pull_request:
    paths:
      - scripts/validate_poisoned_chalice_stage1_length_interaction_output.py
      - .github/workflows/132-poisoned-chalice-stage1-length-submit.yml
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-stage1-length-submit-v1.json

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-length-submit-v1.json
  VERIFIER_PATH: scripts/validate_poisoned_chalice_stage1_length_interaction_output.py
  VERIFIER_BLOB_SHA: 296912b1cd6f157e326782a9985d021614878fd5
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  TARGET_KERNEL: renta0426/stage1-length-interactions-v1
  EXPECTED_KERNEL_VERSION: "1"
  SUBMISSION_MESSAGE: Stage1 frozen plus_length_interactions; no Public-LB tuning

jobs:
  validate:
    name: Validate frozen SHA-bound submission contract without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free boundary and fetch exact commit
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY RESEARCH_REPO_READ_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${source_sha}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          echo 'STAGE1_LENGTH_SUBMIT_SECRET_FREE_BOUNDARY PASS'

      - name: Validate verifier and optional immutable request
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          python3 - "${repo}" "${EVENT_NAME}" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import re
          import sys

          root = pathlib.Path(sys.argv[1])
          event_name = sys.argv[2]
          verifier = root / "scripts/validate_poisoned_chalice_stage1_length_interaction_output.py"
          data = verifier.read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          if blob != "296912b1cd6f157e326782a9985d021614878fd5":
              raise SystemExit("length verifier Git blob changed")
          compile(data, str(verifier), "exec")
          if event_name == "push":
              request = json.loads((root / "requests/poisoned-chalice-stage1-length-submit-v1.json").read_text())
              fixed = {
                  "schema_version": 1,
                  "request_id": "20260904-poisoned-chalice-stage1-length-submit-001",
                  "parent_status_request_id": "20260904-poisoned-chalice-stage1-length-status-001",
                  "parent_run_request_id": "20260903-poisoned-chalice-stage1-length-interactions-run-001",
                  "competition": "poisoned-chalice-icse27",
                  "operation": "competition_submit",
                  "target_kernel": "renta0426/stage1-length-interactions-v1",
                  "expected_kernel_version": 1,
                  "submission_file": "submission.csv",
                  "submission_message": "Stage1 frozen plus_length_interactions; no Public-LB tuning",
                  "verifier_path": "scripts/validate_poisoned_chalice_stage1_length_interaction_output.py",
                  "verifier_blob_sha": "296912b1cd6f157e326782a9985d021614878fd5",
                  "submission_call_limit": 1,
                  "side_effects": ["create one competition submission"],
                  "automatic_submission_retries": 0,
                  "select_as_final": False,
                  "public_leaderboard_tuning_used": False,
              }
              for key, value in fixed.items():
                  if request.get(key) != value:
                      raise SystemExit(f"length submission request mismatch: {key}")
              if set(request) != set(fixed) | {"submission_sha256"}:
                  raise SystemExit("length submission request contains unknown fields")
              if not re.fullmatch(r"[0-9a-f]{64}", str(request.get("submission_sha256") or "")):
                  raise SystemExit("length submission SHA-256 is malformed")
          print("STAGE1_LENGTH_SUBMIT_STATIC PASS calls=1 retries=0 final_selection=false")
          PY
          rm -rf "${WORKDIR}"

  submit:
    name: Reverify approved bytes and submit exactly once
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Enforce protected one-submission boundary and fetch exact main commit
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/132-poisoned-chalice-stage1-length-submit.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${EVENT_SHA}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          echo 'PROTECTED_STAGE1_LENGTH_SUBMISSION_BOUNDARY PASS max_calls=1 retries=0'

      - name: Prepare request, verifier, and SHA-locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          python3 - "${repo}" "${GITHUB_ENV}" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          github_env = pathlib.Path(sys.argv[2])
          verifier = root / "scripts/validate_poisoned_chalice_stage1_length_interaction_output.py"
          data = verifier.read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          if blob != "296912b1cd6f157e326782a9985d021614878fd5":
              raise SystemExit("length verifier Git blob changed")
          compile(data, str(verifier), "exec")
          request = json.loads((root / "requests/poisoned-chalice-stage1-length-submit-v1.json").read_text())
          with github_env.open("a", encoding="utf-8") as handle:
              handle.write(f"EXPECTED_SUBMISSION_SHA256={request['submission_sha256']}\n")
          PY
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${repo}/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'STAGE1_LENGTH_SUBMISSION_CLIENT PASS kaggle=2.2.4'

      - name: Confirm current Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms", "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines", "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Recheck live competition contract and completed private CPU version 1
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api = KaggleApi()
          api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition policy pages unavailable")
          evaluation = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["evaluation"].replace(r"\%", "%"))).casefold()
          if not all(term in evaluation for term in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("live evaluation contract mismatch")
          status = str(getattr(api.kernels_status(os.environ["TARGET_KERNEL"]), "status", "")).upper()
          if "COMPLETE" not in status:
              raise SystemExit(f"length-interaction kernel is not complete: {status}")
          with api.build_kaggle_client() as client:
              request = ApiGetKernelRequest()
              request.user_name = "renta0426"
              request.kernel_slug = "stage1-length-interactions-v1"
              details = client.kernels.kernels_api_client.get_kernel(request)
          metadata = details.metadata
          if int(metadata.current_version_number) != int(os.environ["EXPECTED_KERNEL_VERSION"]):
              raise SystemExit("length-interaction kernel version changed")
          if not bool(metadata.is_private) or bool(metadata.enable_gpu) or bool(metadata.enable_tpu) or bool(metadata.enable_internet):
              raise SystemExit("length-interaction kernel execution contract changed")
          print(f"STAGE1_LENGTH_SUBMISSION_PREFLIGHT PASS status={status} version={metadata.current_version_number}")
          PY

      - name: Download and reverify SHA-bound submission bytes
        id: output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          output_dir="${WORKDIR}/output"
          mkdir -p "${output_dir}"
          "${WORKDIR}/venv/bin/kaggle" kernels output "${TARGET_KERNEL}" \
            -p "${output_dir}" -q -o --page-size 50 \
            --file-pattern '^(run_manifest\.json|submission\.csv|feature_schema\.json|source_shards\.json)$'
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/repo/${VERIFIER_PATH}" \
            --output-dir "${output_dir}" \
            --expected-sha256 "${EXPECTED_SUBMISSION_SHA256}" \
            --github-output "${GITHUB_OUTPUT}"
          echo 'STAGE1_LENGTH_SUBMISSION_BYTES_VERIFIED PASS'

      - name: Submit exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          VERIFIED_SUBMISSION_PATH: ${{ steps.output.outputs.submission_path }}
        run: |
          set -euo pipefail
          [[ -n "${VERIFIED_SUBMISSION_PATH}" && -f "${VERIFIED_SUBMISSION_PATH}" ]]
          "${WORKDIR}/venv/bin/kaggle" competitions submit \
            -c "${TARGET_COMPETITION}" \
            -f "${VERIFIED_SUBMISSION_PATH}" \
            -m "${SUBMISSION_MESSAGE}"
          echo 'STAGE1_LENGTH_COMPETITION_SUBMISSION PASS calls=1 retries=0 final_selection=false'

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'STAGE1_LENGTH_SUBMISSION_RUNNER_MATERIAL_REMOVED'
