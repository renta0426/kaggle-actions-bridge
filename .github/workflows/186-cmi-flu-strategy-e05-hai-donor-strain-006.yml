name: CMI-Flu strategy E05 HAI donor strain CPU 006

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/186-cmi-flu-strategy-e05-hai-donor-strain-006.yml
      - requests/cmi-flu-strategy-e05-hai-donor-strain-006.json
      - payloads/cmi-flu-strategy-e05-hai-donor-strain-006/hai_transfer_v2.py
      - payloads/cmi-flu-strategy-e05-hai-donor-strain-006/strategy_e05_v3.py
      - scripts/cmi_flu_strategy_e05_prepare_v5.py
      - scripts/cmi_flu_strategy_e05_execute_v5.py
      - scripts/cmi_flu_strategy_e05_sanitize_v5.py
      - scripts/cmi_flu_e05_safe_failure_site.py
      - scripts/test_cmi_e05_v5_binding_lifecycle.py
      - scripts/test_cmi_e05_v5_real_reference.py
      - scripts/test_cmi_e05_v5_safe_failure_site.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_current_output_read.py
      - scripts/cmi_flu_strategy_e05_execute_v2.py
      - scripts/test_kaggle_exact_identity_eventual.py
      - scripts/cmi_flu_inspect_locked_hai_reference_schema.py
      - .github/workflows/184-cmi-flu-e05-contract-site-diagnostic-005.yml
  pull_request:
    paths:
      - .github/workflows/186-cmi-flu-strategy-e05-hai-donor-strain-006.yml
      - requests/cmi-flu-strategy-e05-hai-donor-strain-006.json
      - payloads/cmi-flu-strategy-e05-hai-donor-strain-006/hai_transfer_v2.py
      - payloads/cmi-flu-strategy-e05-hai-donor-strain-006/strategy_e05_v3.py
      - scripts/cmi_flu_strategy_e05_prepare_v5.py
      - scripts/cmi_flu_strategy_e05_execute_v5.py
      - scripts/cmi_flu_strategy_e05_sanitize_v5.py
      - scripts/cmi_flu_e05_safe_failure_site.py
      - scripts/test_cmi_e05_v5_binding_lifecycle.py
      - scripts/test_cmi_e05_v5_real_reference.py
      - scripts/test_cmi_e05_v5_safe_failure_site.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_current_output_read.py
      - scripts/cmi_flu_strategy_e05_execute_v2.py
      - scripts/test_kaggle_exact_identity_eventual.py
      - scripts/cmi_flu_inspect_locked_hai_reference_schema.py
      - .github/workflows/184-cmi-flu-e05-contract-site-diagnostic-005.yml

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260907-cmi-flu-strategy-e05-hai-donor-strain-006
  SCIENCE_COMMIT: 8209ee237dace5ee383d7983d3d56f2e845dfdca
  E05_BLOB: 78cde9e3a6b6e3b332352218c4b4545f769aa6c4
  E05_V2_BLOB: 50951807d28418bb50f4e9dba656fa2b3e4d86ff
  E05_V3_BLOB: 129a4a5713a758d58adbb02489105e17a1c13922
  HAI_TRANSFER_BLOB: b671d8bf7f10bebbd65aca2a5bad42e267ee78d5
  HAI_TRANSFER_V2_BLOB: ebf4110df4ab49d726d80af03c1203f93e9c89c0
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E05 006 against exact real reference before approval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e05-006/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Install modeling dependencies and fetch locked references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"

      - name: Execute full real-reference and model preflight ladder
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_prepare_v5.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e05_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_v5_binding_lifecycle.py" --runtime "${WORKDIR}/script.py" --output-dir "${WORKDIR}/synthetic-lifecycle"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_v4_donor_identity.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_v5_real_reference.py" --runtime "${WORKDIR}/script.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_frozen_runtime.py" --runtime "${WORKDIR}/script.py" --output-dir "${WORKDIR}/synthetic-model"
          test -f "${WORKDIR}/synthetic-model/release-receipt.json"
          grep -F '"model_executed": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          grep -F '"result_validated": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          grep -F '"all_final_files_saved": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          grep -F '"cleanup_completed": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_sanitize_v5.py" --input-dir "${WORKDIR}/synthetic-lifecycle"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_v5_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/test_kaggle_exact_identity_eventual.py"
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_prepare_v5.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_execute_v5.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_sanitize_v5.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e05_safe_failure_site.py"
          ! grep -F 'kaggle competitions submit' "${WORKDIR}/script.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_execute_v5.py" >/dev/null
          echo CMI_FLU_E05_V5_PREFLIGHT_PASS

      - name: Validate request and retired workflow guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/requests/cmi-flu-strategy-e05-hai-donor-strain-006.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          expected={
            'request_id':'20260907-cmi-flu-strategy-e05-hai-donor-strain-006',
            'target':'renta0426/cmi-flu-e05-hai-donor-strain-20260907-006',
            'science_source_commit':'8209ee237dace5ee383d7983d3d56f2e845dfdca',
            'strategy_e05_blob_sha':'78cde9e3a6b6e3b332352218c4b4545f769aa6c4',
            'strategy_e05_v2_blob_sha':'50951807d28418bb50f4e9dba656fa2b3e4d86ff',
            'strategy_e05_v3_blob_sha':'129a4a5713a758d58adbb02489105e17a1c13922',
            'hai_transfer_v2_blob_sha':'ebf4110df4ab49d726d80af03c1203f93e9c89c0',
            'locked_strain_sequence_header':['Virus','Sequence','Status_of_sequence'],
            'expected_kernel_version':1,
            'enable_internet':False,
            'competition_submission_attempted':False,
            'leaderboard_used_for_selection':False,
            'automatic_compute_retries':0,
          }
          for k,v in expected.items():
            if r.get(k)!=v:raise SystemExit(f'request mismatch:{k}')
          e=r.get('repair_evidence',{})
          if e.get('persistent_error_code')!='74bf25be40ca17429601' or e.get('locked_reference_schema_run_id')!=34126163522:raise SystemExit('repair evidence mismatch')
          p=r.get('postwrite_identity_reconciliation',{})
          if p.get('identity_authority')!='exact_GetKernel_only' or p.get('transient_retry_http_status')!=[403,404] or p.get('write_retry') is not False or p.get('rate_limit_429_retry') is not False:raise SystemExit('postwrite recurrence guard mismatch')
          PY
          for n in 163 164 174 175 176 177 178 179 180 181 182 183 184; do
            f=$(find "${WORKDIR}/bridge/.github/workflows" -maxdepth 1 -type f -name "${n}-*" | head -1)
            [[ -n "$f" ]]
            ! grep -Eq '^[[:space:]]+push:|^[[:space:]]+pull_request:|environment:|KAGGLE_API_TOKEN|group:[[:space:]]+kaggle-resource' "$f"
            grep -Eq 'Retired|RETIRED|retired' "$f"
          done

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  launch:
    name: Run one repaired private CPU E05 006
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/186-cmi-flu-strategy-e05-hai-donor-strain-006.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e05-006/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Fetch references and build exact E05 006 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_prepare_v5.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e05_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_v5_real_reference.py" --runtime "${WORKDIR}/script.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_v5_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          echo "E05_V5_RUNTIME_SHA256=$(sha256sum "${WORKDIR}/script.py" | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run approved E05 006 CPU kernel and read aggregate output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "CMI_FLU_E05_V5_APPROVED_RUNTIME sha256=${E05_V5_RUNTIME_SHA256}"
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_execute_v5.py" --runtime "${WORKDIR}/script.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"

      - name: Validate aggregate-only result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_sanitize_v5.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
