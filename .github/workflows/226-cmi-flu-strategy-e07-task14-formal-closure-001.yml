name: CMI-Flu strategy E07 Task1.4 formal closure CPU 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/226-cmi-flu-strategy-e07-task14-formal-closure-001.yml
      - requests/cmi-flu-strategy-e07-task14-formal-closure-001.json
      - payloads/cmi-flu-strategy-e07-task14-formal-closure-001/**
      - scripts/cmi_flu_strategy_e07_prepare.py
      - scripts/cmi_flu_strategy_e07_prepare_v2.py
      - scripts/cmi_flu_strategy_e07_execute.py
      - scripts/cmi_flu_strategy_e07_sanitize.py
  pull_request:
    paths:
      - .github/workflows/226-cmi-flu-strategy-e07-task14-formal-closure-001.yml
      - requests/cmi-flu-strategy-e07-task14-formal-closure-001.json
      - payloads/cmi-flu-strategy-e07-task14-formal-closure-001/**
      - scripts/cmi_flu_strategy_e07_prepare.py
      - scripts/cmi_flu_strategy_e07_prepare_v2.py
      - scripts/cmi_flu_strategy_e07_execute.py
      - scripts/cmi_flu_strategy_e07_sanitize.py

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260909-cmi-flu-strategy-e07-task14-formal-closure-001
  SCIENCE_COMMIT: a6cdc7c43bc487d88e9c15f2c63565ff8c702dac
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate exact E07 runtime on synthetic data
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done
      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e07-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
      - name: Install E07 synthetic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 >/dev/null
      - name: Build exact runtime and execute synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_prepare_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_sanitize.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_prepare_v2.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          test ! -e "${WORKDIR}/synthetic"
          python3 "${WORKDIR}/runtime.py" --synthetic --output-dir "${WORKDIR}/synthetic"
          python3 - "${WORKDIR}/synthetic" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          assert sorted(p.name for p in root.iterdir())==['bridge-result.json','metrics.json','summary.md']
          b=json.loads((root/'bridge-result.json').read_text()); m=json.loads((root/'metrics.json').read_text())
          assert b['synthetic'] is True and b['science_commit']=='a6cdc7c43bc487d88e9c15f2c63565ff8c702dac'
          assert b['strategy_e07_blob_sha']=='44ebdd2a1dc9ceeb771eaeb295c74545eb3cc1a4'
          assert b['strategy_e07_synthetic_blob_sha']=='b8971d05d0d1f094b03f861ec3438c6f17c8587a'
          assert b['aliases_blob_sha']=='5b9930c8e26f2b462ee8ce64fdfbdb76df2d1af3'
          assert b['contracts_blob_sha']=='6e2791e526255d9c534e71c9c0886f0c300df7bd'
          assert b['targets_blob_sha']=='154681d9a51e36abd635b596c6d8f7cee22c2d96'
          assert m['experiment']=='strategy_v2_e07_task14_formal_closure' and m['task']=='Task1.4'
          assert m['real_contract'] is None and m['public_training_aim_rows']==0 and m['outcomes_accessed'] is False
          assert m['aim_audit']['prevacc_arithmetic_mean_check']['all_within_tolerance'] is True
          assert m['aim_audit']['negative_control']['candidate_names']==['DMSO']
          assert m['aim_audit']['negative_control']['sensitivity_available'] is True
          assert m['vdj_applicability']['external_tcr_teacher_applicable'] is False
          assert m['vdj_applicability']['generic_clonality_used_as_teacher'] is False
          assert m['hla_applicability']['hla_correction_applicable'] is False
          assert m['decision']['recommended_task14_predictor']=='raw_pre_vacc_conserved_anchor'
          assert m['decision']['incumbent_changed'] is False and m['decision']['public_probe_authorized'] is False
          text=(root/'metrics.json').read_text()
          for token in ('"participant_id"','"subject"','"barcode"','"contig_id"','"cdr3"','SYN_ONLY_E07_'): assert token not in text
          PY
          ! grep -R -E 'kaggle[[:space:]]+competitions[[:space:]]+submit|competition_submit\(' \
            "${WORKDIR}/runtime.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_"* >/dev/null
          echo CMI_FLU_E07_VALIDATE_PASS
      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one private CPU E07 and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/226-cmi-flu-strategy-e07-task14-formal-closure-001.yml@refs/heads/main" ]]
      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e07-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
      - name: Install E07 builder dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 >/dev/null
      - name: Build exact science runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_prepare_v2.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"
      - name: Run one approved E07 CPU kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_execute.py" --runtime "${WORKDIR}/runtime.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"
      - name: Validate aggregate-only E07 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e07_sanitize.py" --input-dir "${WORKDIR}/output"
      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
