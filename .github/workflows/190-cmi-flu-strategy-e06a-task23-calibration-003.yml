name: CMI-Flu strategy E06a Task2.3 calibration CPU 003

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/190-cmi-flu-strategy-e06a-task23-calibration-003.yml
      - .github/workflows/189-cmi-flu-strategy-e06a-task23-calibration-002.yml
      - requests/cmi-flu-strategy-e06a-task23-calibration-003.json
      - scripts/cmi_flu_strategy_e06a_prepare_v3.py
      - scripts/cmi_flu_strategy_e06a_execute_v3.py
      - scripts/cmi_flu_strategy_e06a_sanitize_v3.py
      - scripts/test_cmi_e06a_v3_nonpromotion_contract.py
      - scripts/test_cmi_e06a_v3_sanitizer_nonpromotion.py
      - scripts/test_cmi_e06a_v3_executor_contract.py
      - scripts/test_cmi_e06a_frozen_runtime_v2.py
      - scripts/test_cmi_e06a_real_reference.py
      - scripts/cmi_flu_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_watcher_contract.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_current_output_read.py
      - scripts/test_kaggle_exact_identity_eventual.py
      - scripts/cmi_flu_inspect_locked_hai_reference_schema.py
  pull_request:
    paths:
      - .github/workflows/190-cmi-flu-strategy-e06a-task23-calibration-003.yml
      - .github/workflows/189-cmi-flu-strategy-e06a-task23-calibration-002.yml
      - requests/cmi-flu-strategy-e06a-task23-calibration-003.json
      - scripts/cmi_flu_strategy_e06a_prepare_v3.py
      - scripts/cmi_flu_strategy_e06a_execute_v3.py
      - scripts/cmi_flu_strategy_e06a_sanitize_v3.py
      - scripts/test_cmi_e06a_v3_nonpromotion_contract.py
      - scripts/test_cmi_e06a_v3_sanitizer_nonpromotion.py
      - scripts/test_cmi_e06a_v3_executor_contract.py
      - scripts/test_cmi_e06a_frozen_runtime_v2.py
      - scripts/test_cmi_e06a_real_reference.py
      - scripts/cmi_flu_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_watcher_contract.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_current_output_read.py
      - scripts/test_kaggle_exact_identity_eventual.py
      - scripts/cmi_flu_inspect_locked_hai_reference_schema.py

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260908-cmi-flu-strategy-e06a-task23-calibration-003
  SCIENCE_COMMIT: c968d00eb209e55e53b88643d99382ad6915c87e
  E06_BLOB: dd5b5ed12e7667e527c97a99e86b8821e68e6442
  E06_V2_BLOB: 270a9616c4ab4726cac72e220f86c071161765dc
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E06a 003 candidate-level non-promotion contract before approval
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e06a-003/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Install modeling dependencies and fetch locked references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"

      - name: Execute exact E06a 003 preflight ladder
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_prepare_v3.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e06a_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_real_reference.py" --runtime "${WORKDIR}/script.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_frozen_runtime_v2.py" --runtime "${WORKDIR}/script.py" --output-dir "${WORKDIR}/synthetic-model"
          test -f "${WORKDIR}/synthetic-model/receipt/release-receipt.json"
          grep -F '"model_executed": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"nested_calibration_executed": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"panel_overlap_filter_executed": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"result_validated": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"all_final_files_saved": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"cleanup_completed": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_nonpromotion_contract.py" --runtime "${WORKDIR}/script.py" --metrics "${WORKDIR}/synthetic-model/metrics.json"
          mkdir "${WORKDIR}/synthetic-safe"
          cp "${WORKDIR}/synthetic-model/bridge-result.json" "${WORKDIR}/synthetic-model/metrics.json" "${WORKDIR}/synthetic-model/summary.md" "${WORKDIR}/synthetic-safe/"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_sanitize_v3.py" --input-dir "${WORKDIR}/synthetic-safe"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_sanitizer_nonpromotion.py" --source-dir "${WORKDIR}/synthetic-model" --sanitizer "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_sanitize_v3.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_watcher_contract.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_executor_contract.py"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/test_kaggle_exact_identity_eventual.py"
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_prepare_v3.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_execute_v3.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_sanitize_v3.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_nonpromotion_contract.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_sanitizer_nonpromotion.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_executor_contract.py"
          ! grep -F 'kaggle competitions submit' "${WORKDIR}/script.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_execute_v3.py" >/dev/null
          echo CMI_FLU_E06A_V3_PREFLIGHT_PASS

      - name: Validate repaired request and retired workflow guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/requests/cmi-flu-strategy-e06a-task23-calibration-003.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          expected={
            'schema_version':1,
            'request_id':'20260908-cmi-flu-strategy-e06a-task23-calibration-003',
            'competition':'cmi-flu-first-prediction-challenge',
            'operation':'kernel_run_and_current_output_read',
            'target':'renta0426/cmi-flu-e06a-task23-calibration-20260908-003',
            'science_source_commit':'c968d00eb209e55e53b88643d99382ad6915c87e',
            'science_transport':'agent_relay_existing_exact_blobs',
            'strategy_e06_blob_sha':'dd5b5ed12e7667e527c97a99e86b8821e68e6442',
            'strategy_e06_v2_blob_sha':'270a9616c4ab4726cac72e220f86c071161765dc',
            'repair_of_request_id':'20260908-cmi-flu-strategy-e06a-task23-calibration-002',
            'expected_kernel_version':1,
            'enable_internet':False,
            'competition_submission_attempted':False,
            'leaderboard_used_for_selection':False,
            'automatic_compute_retries':0,
          }
          for k,v in expected.items():
            if r.get(k)!=v:raise SystemExit(f'E06a 003 request mismatch:{k}')
          e=r.get('repair_evidence',{})
          repair_expected={
            'failed_bridge_run_id':34173710311,
            'failed_bridge_job_id':101898943714,
            'write_cli_return_code':0,
            'exact_identity_confirmed':True,
            'remote_terminal_state':'ERROR',
            'exception_type':'BridgeContractError',
            'error_code':'a8830755700c8452f0fe',
            'safe_site':'runtime.validate_result',
            'decoded_error':'e06a_held_study_rank_changed:b21_reference:positive_affine',
            'uploaded_notebook_log_sha256':'5e0d78a81e49490d86dd6ec7844729acb0014611a32c73a88e49321291fa34da',
          }
          for k,v in repair_expected.items():
            if e.get(k)!=v:raise SystemExit(f'E06a 003 repair evidence mismatch:{k}')
          c=r.get('calibration_contract',{})
          if c.get('rank_preservation_required_for_promotion') is not True or c.get('zero_panel_overlap_studies_scored_as_task23_proxy') is not False or c.get('minimum_calibrator_panel_overlap_studies')!=2:raise SystemExit('E06a 003 calibration contract mismatch')
          v=r.get('validator_contract',{})
          if v!={'candidate_rank_preservation_is_result_not_transport_invariant':True,'non_rank_preserving_candidate_requires_promotion_false':True,'selected_candidate_requires_promotion_true':True,'all_predeclared_candidates_are_serialized':True}:raise SystemExit('E06a 003 validator contract mismatch')
          resource=r.get('resource',{}); api=r.get('api_budget',{}); watcher=r.get('watcher_contract',{})
          if resource!={'accelerator':'cpu','expected_runtime_minutes':90,'hard_timeout_minutes':120,'max_active_runs':1}:raise SystemExit('E06a 003 resource mismatch')
          if api!={'max_calls':150,'poll_interval_seconds':120,'max_polls':65,'max_pages':2}:raise SystemExit('E06a 003 API budget mismatch')
          if watcher!={'watch_horizon_minutes':130,'actions_job_timeout_minutes':150,'poll_exhaustion_is_remote_failure':False,'write_retry_on_watch_expiry':False,'recovery_after_watch_expiry':'current_version_read_only'}:raise SystemExit('E06a 003 watcher mismatch')
          if r.get('allowed_output_paths')!=['bridge-result.json','metrics.json','summary.md']:raise SystemExit('E06a 003 output allowlist mismatch')
          PY
          for n in 163 164 174 175 176 177 178 179 180 181 182 183 184 186 187 188 189; do
            f=$(find "${WORKDIR}/bridge/.github/workflows" -maxdepth 1 -type f -name "${n}-*" | head -1)
            [[ -n "$f" ]]
            ! grep -Eq '^[[:space:]]+push:|^[[:space:]]+pull_request:|environment:|KAGGLE_API_TOKEN|group:[[:space:]]+kaggle-resource' "$f"
            grep -Eq 'Retired|RETIRED|retired' "$f"
          done

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  launch:
    name: Run one repaired private CPU E06a Task2.3 calibration 003
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/190-cmi-flu-strategy-e06a-task23-calibration-003.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e06a-003/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Rebuild exact E06a 003 runtime and recurrence tests
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_prepare_v3.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e06a_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_real_reference.py" --runtime "${WORKDIR}/script.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_frozen_runtime_v2.py" --runtime "${WORKDIR}/script.py" --output-dir "${WORKDIR}/protected-synthetic"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_nonpromotion_contract.py" --runtime "${WORKDIR}/script.py" --metrics "${WORKDIR}/protected-synthetic/metrics.json"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_sanitizer_nonpromotion.py" --source-dir "${WORKDIR}/protected-synthetic" --sanitizer "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_sanitize_v3.py"
          rm -rf "${WORKDIR}/protected-synthetic"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06a_v3_executor_contract.py"
          echo "E06A_V3_RUNTIME_SHA256=$(sha256sum "${WORKDIR}/script.py" | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run approved E06a 003 CPU kernel and read aggregate output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "CMI_FLU_E06A_V3_APPROVED_RUNTIME sha256=${E06A_V3_RUNTIME_SHA256}"
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_execute_v3.py" --runtime "${WORKDIR}/script.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"

      - name: Validate aggregate-only E06a 003 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06a_sanitize_v3.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
