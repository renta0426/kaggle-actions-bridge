name: CMI-Flu B1 standalone CPU kernel launch v2

on:
  push:
    branches:
      - main
    paths:
      - requests/cmi-flu-b1-launch-v2.json

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b1-launch-v2.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-b1-anchor-20260902-002
  KERNEL_SOURCE_PATH: scripts/cmi_flu_b1_kernel_v2.py

jobs:
  validate:
    name: Validate B1 v2 request without secrets
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate immutable request and standalone source
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AZURE_CLIENT_SECRET GOOGLE_APPLICATION_CREDENTIALS; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

          python3 - <<'PY'
          from __future__ import annotations
          import ast
          import hashlib
          import json
          import os
          import re
          import ssl
          import urllib.request
          from urllib.parse import urlparse

          repo = os.environ["EXPECTED_REPOSITORY"]
          sha = os.environ["EVENT_SHA_VALUE"]
          base = f"https://raw.githubusercontent.com/{repo}/{sha}/"

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def fetch(path: str, limit: int) -> bytes:
              url = base + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected raw source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"source too large: {path}")
              return data

          request = json.loads(fetch(os.environ["REQUEST_PATH"], 32768))
          expected_fields = {
              "schema_version", "request_id", "parent_request_id", "competition",
              "operation", "target", "kernel_source_path", "kernel_source_blob_sha",
              "source_repository", "source_commit", "implementation", "resource",
              "api_budget", "side_effects", "automatic_compute_retries",
              "enable_internet", "rules_checked_at_utc",
          }
          if set(request) != expected_fields:
              raise SystemExit("request schema differs from v2 allowlist")
          expected = {
              "schema_version": 2,
              "request_id": "20260902-cmi-flu-b1-002",
              "parent_request_id": "20260902-cmi-flu-b1-001",
              "competition": os.environ["TARGET_COMPETITION"],
              "operation": "kernel_run",
              "target": os.environ["TARGET_KERNEL"],
              "kernel_source_path": os.environ["KERNEL_SOURCE_PATH"],
              "source_repository": "renta0426/CMI-Flu-Invited-Prediction-Challenge",
              "source_commit": "1e075cfa565698f708e872d22be629f97704a24f",
              "implementation": "standalone_equivalent",
              "resource": {
                  "accelerator": "cpu",
                  "expected_runtime_minutes": 15,
                  "hard_timeout_minutes": 30,
                  "max_active_runs": 1,
              },
              "api_budget": {
                  "max_calls": 20,
                  "poll_interval_seconds": 300,
                  "max_pages": 2,
              },
              "side_effects": ["create one private notebook version and start one CPU run"],
              "automatic_compute_retries": 0,
              "enable_internet": False,
          }
          for key, value in expected.items():
              if request[key] != value:
                  raise SystemExit(f"request field mismatch: {key}")
          if not re.fullmatch(r"2026-09-02T\d{2}:\d{2}:\d{2}Z", request["rules_checked_at_utc"]):
              raise SystemExit("rules timestamp format mismatch")

          source = fetch(request["kernel_source_path"], 96_000)
          blob = hashlib.sha1(b"blob " + str(len(source)).encode() + b"\0" + source).hexdigest()
          if blob != request["kernel_source_blob_sha"]:
              raise SystemExit("standalone kernel blob mismatch")
          source_text = source.decode("utf-8")
          compile(source_text, request["kernel_source_path"], "exec")
          tree = ast.parse(source_text)
          forbidden_imports = {"requests", "httpx", "socket", "subprocess", "urllib.request"}
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module)
          if imports & forbidden_imports:
              raise SystemExit(f"standalone kernel contains forbidden network/process imports: {sorted(imports & forbidden_imports)}")
          if "https://" in source_text or "http://" in source_text or "git " in source_text:
              raise SystemExit("standalone kernel contains unexpected external-network/process literal")
          print("CMI-Flu B1 v2 request/source validation: PASS")
          PY

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("Current Kaggle policy/API page reachability: PASS")
          PY

  launch:
    name: Live preflight and launch one standalone CPU run
    needs: validate
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/76-cmi-flu-b1-v2-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "Protected CMI-Flu B1 v2 launch boundary: PASS"

      - name: Prepare SHA-256 locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          lock_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA_VALUE}/${LOCK_RELATIVE_PATH}"
          python3 - "${lock_url}" "${workdir}/kaggle.lock" <<'PY'
          import re, ssl, sys, urllib.request
          from urllib.parse import urlparse
          url, output = sys.argv[1:]
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
              raise SystemExit("unexpected lock origin")
          with urllib.request.urlopen(url, timeout=30, context=ssl.create_default_context()) as response:
              data = response.read(65537)
          if len(data) > 65536:
              raise SystemExit("lock too large")
          text = data.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          open(output, "w", encoding="utf-8").write(text)
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version >/dev/null

      - name: Live Competition preflight and account concurrency guard
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import hashlib, os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          competition = os.environ["TARGET_COMPETITION"]
          target = os.environ["TARGET_KERNEL"]
          pages = api.competition_list_pages(competition) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in n for n in content):
              raise SystemExit("required live Competition pages unavailable")
          def plain(value: str) -> str:
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", value)).casefold()
          rules = plain(content["rules"])
          evaluation = plain(content["evaluation"])
          data_text = " ".join(plain(content[n]) for n in content if "data" in n)
          if not all(term in rules for term in (
              "maximum of five (5) submissions per day",
              "maximum team size is five (5)", "data security", "external data and tools",
          )):
              raise SystemExit("live Competition rules differ from approved guardrails")
          if not all(term in evaluation for term in ("mean spearman correlation", "40 donors", "-99")):
              raise SystemExit("live Competition evaluation differs from approved guardrails")
          if "sample_submission_part1.csv" not in data_text or "investigations_260821.tsv" not in data_text:
              raise SystemExit("live Competition data description differs from expected inputs")
          for name in ("rules", "evaluation", *sorted(n for n in content if "data" in n)):
              print(f"LIVE_PAGE_HASH name={name} sha256={hashlib.sha256(content[name].encode()).hexdigest()}")

          existing = api.kernels_list(user="renta0426", search="cmi-flu-b1-anchor-20260902-002", page_size=5) or []
          if target in {str(getattr(item, "ref", "")) for item in existing}:
              raise SystemExit("target kernel already exists; duplicate request refused")
          recent = api.kernels_list(user="renta0426", sort_by="dateRun", page_size=5) or []
          active = []
          for item in recent[:5]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              status = str(getattr(api.kernels_status(ref), "status", "")).upper()
              if "RUNNING" in status or "QUEUED" in status:
                  active.append(ref)
          if active:
              raise SystemExit(f"another Kaggle kernel is active; count={len(active)}")
          print(f"LIVE_RULE_PREFLIGHT PASS pages={len(content)} active=0 accelerator=cpu internet=false")
          PY

      - name: Materialize fixed private CPU kernel and push once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"
          mkdir -p "${kernel_dir}"
          python3 - "${kernel_dir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, ssl, urllib.request
          output = pathlib.Path(__import__('sys').argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA_VALUE']}/"
          def fetch(path: str, limit: int) -> bytes:
              with urllib.request.urlopen(base + path, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit("source exceeds fixed byte budget")
              return data
          request = json.loads(fetch(os.environ["REQUEST_PATH"], 32768))
          source = fetch(request["kernel_source_path"], 96000)
          blob = hashlib.sha1(b"blob " + str(len(source)).encode() + b"\0" + source).hexdigest()
          if blob != request["kernel_source_blob_sha"]:
              raise SystemExit("kernel source blob mismatch during materialization")
          (output / "cmi_flu_b1_kernel_v2.py").write_bytes(source)
          metadata = {
              "id": os.environ["TARGET_KERNEL"],
              "title": "CMI Flu B1 Anchor Standalone 20260902 002",
              "code_file": "cmi_flu_b1_kernel_v2.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "",
              "dataset_sources": [],
              "competition_sources": [os.environ["TARGET_COMPETITION"]],
              "kernel_sources": [],
              "model_sources": [],
          }
          (output / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 1800 \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: Kaggle kernel push/run failed; response suppressed"
            exit 1
          fi
          echo "KERNEL_LAUNCH PASS request_id=20260902-cmi-flu-b1-002 target=${TARGET_KERNEL} accelerator=cpu internet=false automatic_retries=0 timeout=1800"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "Runner-local CMI-Flu B1 v2 content removed"
