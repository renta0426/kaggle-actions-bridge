name: Poisoned Chalice P1-03 post-5k runtime import repair v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-post-5k-runtime-import-repair-v2.yml
      - requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-runtime-repair-v2.json
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-post-5k-runtime-import-repair-v2.yml
      - requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-runtime-repair-v2.json

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-runtime-repair-v2.json
  PARENT_REQUEST_PATH: requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json
  OLD_RUNTIME_PATH: materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/run_p1_03_post_5k_development_audit_v1.py
  BUILDER_PATH: materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/build_p1_03_post_5k_development_audit_notebook_v1.py
  CONFIG_PATH: materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/configs/p1_03_post_5k_development_audit_v1_20260910.json
  IDENTITY_PATH: scripts/kaggle_exact_identity.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET: renta0426/poisoned-chalice-p1-03-post-5k-dev-audit-v1
  TITLE: Poisoned Chalice P1-03 Post-5K Dev Audit V1
  SCIENCE_COMMIT: 7c16edd388165955a0aeed1e4eed69e0b06a136c
  OLD_RUNTIME_BLOB: 76e09a937c0b257787bec7269716ff8cb7cb1e6d
  NEW_RUNTIME_BLOB: 3d0a45b20c93554e293b4db9c243cd1133f1fef9
  BUILDER_BLOB: e9272cbee32d03f52dff758f0b87079c3f9bbfa2
  CONFIG_BLOB: 322487c8f0a932160ab825775ca80687ce295579

jobs:
  validate:
    name: Validate exact runtime-only repair without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce secret-free repair boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: $name"; exit 1; }
          done
          source_sha="$EVENT_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then source_sha="$PR_HEAD_SHA"; fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$workdir/kernel" >> "$GITHUB_ENV"
          echo "RESEARCH_DIR=$workdir/research" >> "$GITHUB_ENV"

      - name: Fetch exact bridge bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_SHA" "$WORKDIR" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]
          root=pathlib.Path(root_value)
          files={
            'requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-runtime-repair-v2.json':65536,
            'requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json':65536,
            'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/run_p1_03_post_5k_development_audit_v1.py':131072,
            'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/build_p1_03_post_5k_development_audit_notebook_v1.py':131072,
            'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/configs/p1_03_post_5k_development_audit_v1_20260910.json':65536,
            'scripts/kaggle_exact_identity.py':65536,
            'requirements/kaggle-2.2.4.lock':65536,
          }
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for path,maximum in files.items():
              url=f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}'
              req=urllib.request.Request(url,headers={'User-Agent':'p1-03-post5k-runtime-repair-v2/1'})
              with opener.open(req,timeout=30) as response:data=response.read(maximum+1)
              if not data or len(data)>maximum:raise SystemExit(f'bridge source byte budget failed:{path}')
              name={
                'requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-runtime-repair-v2.json':'request.json',
                'requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json':'parent.json',
                'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/run_p1_03_post_5k_development_audit_v1.py':'old_runtime.py',
                'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/build_p1_03_post_5k_development_audit_notebook_v1.py':'builder.py',
                'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/configs/p1_03_post_5k_development_audit_v1_20260910.json':'config.json',
                'scripts/kaggle_exact_identity.py':'kaggle_exact_identity.py',
                'requirements/kaggle-2.2.4.lock':'kaggle-2.2.4.lock',
              }[path]
              out=root/name; out.write_bytes(data)
              if name.endswith('.py'):compile(data,path,'exec')
          PY

      - name: Prove request and runtime repair are exact
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$WORKDIR" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          request=json.loads((root/'request.json').read_text()); parent=json.loads((root/'parent.json').read_text())
          if request['request_id']!='20260910-poisoned-chalice-p1-03-post-5k-dev-audit-v1-003':raise SystemExit('request id changed')
          if request['parent_request_id']!=parent['request_id']:raise SystemExit('parent request mismatch')
          if request['target']!=parent['target'] or request['title']!=parent['title']:raise SystemExit('transport target/title changed')
          if request['expected_current_version_before_write']!=1 or request['expected_version_after_write']!=2:raise SystemExit('version repair contract changed')
          if request['research_commit']!='7c16edd388165955a0aeed1e4eed69e0b06a136c':raise SystemExit('science commit changed')
          equal_keys=('competition','inputs','resource','persistent_outputs','automatic_compute_retries','enable_internet','competition_submission','select_as_final','clean_room','scientific_contract')
          for key in equal_keys:
              if request[key]!=parent[key]:raise SystemExit(f'scientific/request field changed:{key}')
          if request['automatic_compute_retries']!=0 or request['competition_submission'] is not False or request['resource']['accelerator']!='cpu':raise SystemExit('resource/write contract changed')
          files={x['path']:x['git_blob_sha'] for x in request['research_files']}
          expected={
            'scripts/run_p1_03_post_5k_development_audit_v1.py':'3d0a45b20c93554e293b4db9c243cd1133f1fef9',
            'scripts/build_p1_03_post_5k_development_audit_notebook_v1.py':'e9272cbee32d03f52dff758f0b87079c3f9bbfa2',
            'configs/p1_03_post_5k_development_audit_v1_20260910.json':'322487c8f0a932160ab825775ca80687ce295579',
          }
          if files!=expected:raise SystemExit('science blob contract changed')
          repair=request['runtime_repair']
          required={
            'kind':'single_import_location_fix','failed_target_version':1,'required_failed_status_before_write':'ERROR',
            'previous_launch_workflow_run':34475469934,'previous_launch_job':102865147273,
            'previous_write_observed':True,'previous_compute_started':True,'previous_result_valid':False,
            'uploaded_log_sha256':'9a7aae26dd04b2dce15905f98eefac9606a01c7709fb617ec660f77c8608c52b',
            'failure_class':'ImportError','failure_symbol':'FeatureUnion',
            'old_import_module':'sklearn.feature_extraction.text','new_import_module':'sklearn.pipeline',
            'old_runtime_git_blob_sha':'76e09a937c0b257787bec7269716ff8cb7cb1e6d',
            'new_runtime_git_blob_sha':'3d0a45b20c93554e293b4db9c243cd1133f1fef9',
            'builder_changed':False,'config_changed':False,'science_formulas_changed':False,'clean_room_changed':False,
            'fresh_holdout_consumed':False,'automatic_retry':False,
          }
          if repair!=required:raise SystemExit('runtime repair provenance changed')
          def git_blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          old=(root/'old_runtime.py').read_bytes(); builder=(root/'builder.py').read_bytes(); config=(root/'config.json').read_bytes()
          if git_blob(old)!='76e09a937c0b257787bec7269716ff8cb7cb1e6d':raise SystemExit('old runtime snapshot changed')
          if git_blob(builder)!='e9272cbee32d03f52dff758f0b87079c3f9bbfa2':raise SystemExit('builder snapshot changed')
          if git_blob(config)!='322487c8f0a932160ab825775ca80687ce295579':raise SystemExit('config snapshot changed')
          old_text=old.decode('utf-8')
          needle='    from sklearn.feature_extraction.text import FeatureUnion, HashingVectorizer\n    from sklearn.linear_model import LogisticRegression\n'
          replacement='    from sklearn.feature_extraction.text import HashingVectorizer\n    from sklearn.linear_model import LogisticRegression\n    from sklearn.pipeline import FeatureUnion\n'
          if old_text.count(needle)!=1:raise SystemExit('old runtime import provenance mismatch')
          new_text=old_text.replace(needle,replacement)
          new=new_text.encode('utf-8')
          if git_blob(new)!='3d0a45b20c93554e293b4db9c243cd1133f1fef9':raise SystemExit('patched runtime does not equal merged science blob')
          (root/'new_runtime.py').write_bytes(new)
          compile(new,'run_p1_03_post_5k_development_audit_v1.py','exec')
          print('P1_03_RUNTIME_REPAIR_BLOB_GATE PASS old=76e09a9 new=3d0a45b science=7c16edd formulas_changed=0 write_calls=0')
          PY

      - name: Exercise C1 path under exact scikit-learn 1.8.0
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORKDIR/smoke-venv"
          "$WORKDIR/smoke-venv/bin/python" -m pip install --disable-pip-version-check --no-input numpy==2.4.2 pandas==3.0.1 scipy==1.17.1 scikit-learn==1.8.0 >/dev/null
          "$WORKDIR/smoke-venv/bin/python" - "$WORKDIR/new_runtime.py" <<'PY'
          import importlib.util,sys
          import numpy as np
          import pandas as pd
          path=sys.argv[1]
          spec=importlib.util.spec_from_file_location('audit_runtime',path); module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          frame=pd.DataFrame({'content':['alpha zero common token','beta one common token','gamma zero common token','delta one common token','epsilon zero common token','zeta one common token','eta zero common token','theta one common token'],'label':[0,1,0,1,0,1,0,1]})
          splits=[(np.array([0,1,2,3]),np.array([4,5,6,7])),(np.array([4,5,6,7]),np.array([0,1,2,3]))]
          pred=module.ngram_control_oof(frame,splits)
          assert pred.shape==(8,) and np.isfinite(pred).all() and ((pred>=0)&(pred<=1)).all()
          import sklearn
          assert sklearn.__version__=='1.8.0'
          print('P1_03_RUNTIME_REPAIR_C1_SMOKE PASS sklearn=1.8.0 rows=8 folds=2 write_calls=0')
          PY

      - name: Build repaired Notebook from exact science blobs
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORKDIR/venv"
          "$WORKDIR/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "$WORKDIR/kaggle-2.2.4.lock" >/dev/null
          "$WORKDIR/venv/bin/python" -m pip check >/dev/null
          "$WORKDIR/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          mkdir -p "$RESEARCH_DIR/scripts" "$RESEARCH_DIR/configs"
          cp "$WORKDIR/new_runtime.py" "$RESEARCH_DIR/scripts/run_p1_03_post_5k_development_audit_v1.py"
          cp "$WORKDIR/builder.py" "$RESEARCH_DIR/scripts/build_p1_03_post_5k_development_audit_notebook_v1.py"
          cp "$WORKDIR/config.json" "$RESEARCH_DIR/configs/p1_03_post_5k_development_audit_v1_20260910.json"
          (cd "$RESEARCH_DIR" && "$WORKDIR/venv/bin/python" scripts/build_p1_03_post_5k_development_audit_notebook_v1.py >/dev/null)
          generated="$RESEARCH_DIR/notebooks/experiments/poisoned-chalice-p1-03-post-5k-development-audit-v1"
          mkdir -p "$KERNEL_DIR"
          cp "$generated/kernel-metadata.json" "$KERNEL_DIR/kernel-metadata.json"
          cp "$generated/poisoned-chalice-p1-03-post-5k-development-audit-v1.ipynb" "$KERNEL_DIR/poisoned-chalice-p1-03-post-5k-development-audit-v1.ipynb"
          "$WORKDIR/venv/bin/python" - "$WORKDIR/request.json" "$KERNEL_DIR" <<'PY'
          import hashlib,json,pathlib,sys
          request=json.load(open(sys.argv[1])); kernel=pathlib.Path(sys.argv[2]); meta_path=kernel/'kernel-metadata.json'; meta=json.loads(meta_path.read_text())
          code_path=kernel/meta['code_file']; notebook_before=hashlib.sha256(code_path.read_bytes()).hexdigest()
          if meta['id']!='renta0426/poisoned-chalice-p1-03-post-5k-development-audit-v1':raise SystemExit('builder target provenance changed')
          meta['id']=request['target']; meta['title']=request['title']; meta_path.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          if hashlib.sha256(code_path.read_bytes()).hexdigest()!=notebook_before:raise SystemExit('transport metadata edit changed Notebook bytes')
          if meta['is_private'] is not True or meta['enable_gpu'] is not False or meta['enable_tpu'] is not False or meta['enable_internet'] is not True:raise SystemExit('execution metadata changed')
          nb=json.loads(code_path.read_text()); code='\n'.join(str(c.get('source','')) for c in nb['cells'])
          required=['3d0a45b20c93554e293b4db9c243cd1133f1fef9','from sklearn.pipeline import FeatureUnion','C1_hashed_char_token_ngram','P1_03_POST_5K_DEVELOPMENT_AUDIT COMPLETE']
          for marker in required:
              if marker not in code:raise SystemExit(f'generated Notebook missing marker:{marker}')
          for marker in ('submission.csv','competition_submit(','kaggle competitions submit','AutoModelForCausalLM'):
              if marker in code:raise SystemExit(f'forbidden capability in Notebook:{marker}')
          print(f'P1_03_RUNTIME_REPAIR_NOTEBOOK_GATE PASS notebook_sha256={notebook_before} target={request["target"]} expected_version=2 write_calls=0')
          PY

      - name: Cleanup validation material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"

  launch:
    name: Launch approved P1-03 runtime repair as version 2 exactly once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected repair boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$EVENT_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-p1-03-post-5k-runtime-import-repair-v2.yml@refs/heads/main" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          echo "P1_03_RUNTIME_REPAIR_BOUNDARY PASS target_version_before=1 target_version_after=2 cpu=1 retries=0 submissions=0"

      - name: Fetch exact bundle and build repaired Notebook
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$workdir/kernel" >> "$GITHUB_ENV"
          echo "RESEARCH_DIR=$workdir/research" >> "$GITHUB_ENV"
          python3 - "$EVENT_SHA" "$workdir" <<'PY'
          import hashlib,pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value)
          files={
            'requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-runtime-repair-v2.json':'request.json',
            'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/run_p1_03_post_5k_development_audit_v1.py':'old_runtime.py',
            'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/exact/build_p1_03_post_5k_development_audit_notebook_v1.py':'builder.py',
            'materialized/poisoned-chalice-p1-03-post-5k-development-audit-v1/configs/p1_03_post_5k_development_audit_v1_20260910.json':'config.json',
            'scripts/kaggle_exact_identity.py':'kaggle_exact_identity.py',
            'requirements/kaggle-2.2.4.lock':'kaggle-2.2.4.lock',
          }
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for path,name in files.items():
              req=urllib.request.Request(f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}',headers={'User-Agent':'p1-03-runtime-repair-v2-launch/1'})
              with opener.open(req,timeout=30) as response:data=response.read(131073)
              if not data or len(data)>131072:raise SystemExit(f'bridge source byte budget failed:{path}')
              (root/name).write_bytes(data)
          def git_blob(data):return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          old=(root/'old_runtime.py').read_bytes()
          if git_blob(old)!='76e09a937c0b257787bec7269716ff8cb7cb1e6d':raise SystemExit('old runtime snapshot changed')
          needle=b'    from sklearn.feature_extraction.text import FeatureUnion, HashingVectorizer\n    from sklearn.linear_model import LogisticRegression\n'
          replacement=b'    from sklearn.feature_extraction.text import HashingVectorizer\n    from sklearn.linear_model import LogisticRegression\n    from sklearn.pipeline import FeatureUnion\n'
          if old.count(needle)!=1:raise SystemExit('old runtime repair locus changed')
          new=old.replace(needle,replacement)
          if git_blob(new)!='3d0a45b20c93554e293b4db9c243cd1133f1fef9':raise SystemExit('patched runtime science blob mismatch')
          (root/'new_runtime.py').write_bytes(new); compile(new,'run_p1_03_post_5k_development_audit_v1.py','exec')
          PY
          python3 -m venv "$workdir/venv"
          "$workdir/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "$workdir/kaggle-2.2.4.lock" >/dev/null
          "$workdir/venv/bin/python" -m pip check >/dev/null
          "$workdir/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          mkdir -p "$workdir/research/scripts" "$workdir/research/configs" "$workdir/kernel"
          cp "$workdir/new_runtime.py" "$workdir/research/scripts/run_p1_03_post_5k_development_audit_v1.py"
          cp "$workdir/builder.py" "$workdir/research/scripts/build_p1_03_post_5k_development_audit_notebook_v1.py"
          cp "$workdir/config.json" "$workdir/research/configs/p1_03_post_5k_development_audit_v1_20260910.json"
          (cd "$workdir/research" && "$workdir/venv/bin/python" scripts/build_p1_03_post_5k_development_audit_notebook_v1.py >/dev/null)
          generated="$workdir/research/notebooks/experiments/poisoned-chalice-p1-03-post-5k-development-audit-v1"
          cp "$generated/kernel-metadata.json" "$workdir/kernel/kernel-metadata.json"
          cp "$generated/poisoned-chalice-p1-03-post-5k-development-audit-v1.ipynb" "$workdir/kernel/poisoned-chalice-p1-03-post-5k-development-audit-v1.ipynb"
          "$workdir/venv/bin/python" - "$workdir/request.json" "$workdir/kernel" <<'PY'
          import json,pathlib,sys
          request=json.load(open(sys.argv[1])); kernel=pathlib.Path(sys.argv[2]); meta_path=kernel/'kernel-metadata.json'; meta=json.loads(meta_path.read_text())
          meta['id']=request['target']; meta['title']=request['title']; meta_path.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          if meta['is_private'] is not True or meta['enable_gpu'] is not False or meta['enable_tpu'] is not False or meta['enable_internet'] is not True:raise SystemExit('execution metadata changed')
          if request['research_commit']!='7c16edd388165955a0aeed1e4eed69e0b06a136c' or request['expected_current_version_before_write']!=1 or request['expected_version_after_write']!=2:raise SystemExit('version/science contract changed')
          PY

      - name: Live exact version-1 failure and resource preflight
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/request.json" <<'PY'
          import json,re,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,status_name,verify_current
          request=json.load(open(sys.argv[1])); api=KaggleApi(); api.authenticate(); target=request['target']
          if request['request_id']!='20260910-poisoned-chalice-p1-03-post-5k-dev-audit-v1-003':raise SystemExit('request id changed')
          if target!='renta0426/poisoned-chalice-p1-03-post-5k-dev-audit-v1' or request['expected_current_version_before_write']!=1 or request['expected_version_after_write']!=2:raise SystemExit('target/version contract changed')
          if request['resource']['accelerator']!='cpu' or request['automatic_compute_retries']!=0 or request['competition_submission'] is not False:raise SystemExit('resource/write contract changed')
          pages=api.competition_list_pages(request['competition']) or []; content={}
          for page in pages:
              data=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(data.get('name') or '').strip().lower()
              if name:content[name]=str(data.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in name for name in content):raise SystemExit('live competition contract pages unavailable')
          plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',content['evaluation'].replace(r'\%','%'))).casefold()
          if not all(token in plain for token in ('auc','novelty','1%','false-positive')):raise SystemExit('live evaluation contract changed')
          for source in request['inputs']['kernels']:
              if verify_current(api,source['ref'],int(source['version']),allow_failed=False,cpu=False)!='COMPLETE':raise SystemExit('kernel input not complete')
          dataset_payload=json.loads(api.dataset_status(request['inputs']['dataset']['ref'],format='json(current_version_number)'))
          observed=dataset_payload.get('current_version_number')
          if observed is None or int(observed)!=int(request['inputs']['dataset']['version']):raise SystemExit(f'dataset current version mismatch:{observed!r}')
          meta=exact_metadata(api,target)
          if getattr(meta,'ref',None)!=target or int(getattr(meta,'current_version_number',0))!=1:raise SystemExit('current target is not exact version 1')
          if getattr(meta,'is_private',None) is not True or getattr(meta,'enable_gpu',None) is not False or getattr(meta,'enable_tpu',None) is not False or getattr(meta,'enable_internet',None) is not True:raise SystemExit('current target metadata mismatch')
          state=status_name(getattr(api.kernels_status(target),'status',None))
          if state!='ERROR':raise SystemExit(f'version 1 is not failed ERROR state:{state}')
          recent=(api.kernels_list(user='renta0426',sort_by='dateRun',page_size=25) or [])[:25]; cpu_active=0; active_total=0; unknown=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:s=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if s not in ACTIVE:continue
              active_total+=1
              try:m=exact_metadata(api,ref); gpu=getattr(m,'enable_gpu',None); tpu=getattr(m,'enable_tpu',None)
              except Exception:unknown+=1;continue
              if type(gpu) is not bool or type(tpu) is not bool:unknown+=1;continue
              if gpu is False and tpu is False:cpu_active+=1
          if unknown:raise SystemExit(f'CPU admission refused:unknown_active_classification={unknown}')
          if cpu_active>=int(request['resource']['max_active_runs']):raise SystemExit(f'CPU concurrency admission refused:cpu_active={cpu_active}')
          print(f'P1_03_RUNTIME_REPAIR_PREFLIGHT PASS current_version=1 current_state=ERROR cpu_active={cpu_active} active_total={active_total} dataset_version={observed} write_calls=0')
          PY

      - name: Recheck and perform exactly one version-2 SaveKernel call
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/request.json" "$KERNEL_DIR" <<'PY'
          import hashlib,json,pathlib,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,exact_metadata_eventually,safe_exception,status_name
          request=json.load(open(sys.argv[1])); kernel=pathlib.Path(sys.argv[2]); target=request['target']; api=KaggleApi(); api.authenticate()
          meta_json=json.loads((kernel/'kernel-metadata.json').read_text())
          if meta_json['id']!=target or meta_json['title']!=request['title'] or meta_json['is_private'] is not True or meta_json['enable_gpu'] is not False or meta_json['enable_tpu'] is not False or meta_json['enable_internet'] is not True:raise SystemExit('pre-write materialized metadata mismatch')
          # Write-immediate target/version/status recheck.
          before=exact_metadata(api,target)
          if int(getattr(before,'current_version_number',0))!=1:raise SystemExit('pre-write current version is not 1')
          if status_name(getattr(api.kernels_status(target),'status',None))!='ERROR':raise SystemExit('pre-write version 1 is no longer ERROR')
          # Write-immediate CPU admission recheck.
          recent=(api.kernels_list(user='renta0426',sort_by='dateRun',page_size=25) or [])[:25]; cpu_active=0; unknown=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:s=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if s not in ACTIVE:continue
              try:m=exact_metadata(api,ref); gpu=getattr(m,'enable_gpu',None); tpu=getattr(m,'enable_tpu',None)
              except Exception:unknown+=1;continue
              if type(gpu) is not bool or type(tpu) is not bool:unknown+=1;continue
              if gpu is False and tpu is False:cpu_active+=1
          if unknown or cpu_active>=int(request['resource']['max_active_runs']):raise SystemExit(f'pre-write CPU admission refused:cpu_active={cpu_active} unknown={unknown}')
          # Exactly one resource-creating call. No retry loop.
          response=None; failure=None
          try:
              response=api.kernels_push(str(kernel))
          except Exception as exc:
              failure=('exception',safe_exception(exc))
          else:
              error=str(getattr(response,'error','') or '')
              if error:failure=('response_error',{'error_sha256':hashlib.sha256(error.encode()).hexdigest(),'http_status':None})
          # Read-only reconciliation of that single write attempt.
          try:after=exact_metadata_eventually(api,target,attempts=6,delay_seconds=2.0)
          except Exception as exc:
              info=safe_exception(exc)
              raise SystemExit(f"version-2 reconciliation failed:http={info.get('http_status')} error_sha256={info.get('error_sha256')} write_calls=1")
          version=int(getattr(after,'current_version_number',0))
          if version!=2:
              detail=failure[0] if failure else 'none'
              raise SystemExit(f'one-shot SaveKernel did not produce exact version 2:observed={version} failure_return={detail} write_calls=1')
          if getattr(after,'ref',None)!=target or getattr(after,'is_private',None) is not True or getattr(after,'enable_gpu',None) is not False or getattr(after,'enable_tpu',None) is not False or getattr(after,'enable_internet',None) is not True:raise SystemExit('post-write version-2 metadata mismatch')
          state=status_name(getattr(api.kernels_status(target),'status',None))
          if state not in ACTIVE|{'COMPLETE','ERROR','CANCELLED','CANCELED'}:raise SystemExit('post-write version-2 state unknown')
          failure_kind=failure[0] if failure else 'none'
          print(f'P1_03_RUNTIME_REPAIR_SAVE PASS target={target} version=2 cpu=1 private=1 state={state} write_calls=1 failure_return={failure_kind} retries=0 submissions=0')
          PY

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
          echo "P1_03_RUNTIME_REPAIR_CLEANUP PASS retention_days=0"
