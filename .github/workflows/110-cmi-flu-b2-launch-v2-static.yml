name: CMI-Flu B2 request 002 static validation

on:
  push:
    branches:
      - fix/cmi-flu-b2-recursive-mount-002
    paths:
      - requests/cmi-flu-b2-launch-v2.json
      - scripts/cmi_flu_b2_patch_v2.py
      - .github/workflows/109-cmi-flu-b2-launch-v2.yml
      - .github/workflows/110-cmi-flu-b2-launch-v2-static.yml
  pull_request:
    branches:
      - main
    paths:
      - requests/cmi-flu-b2-launch-v2.json
      - scripts/cmi_flu_b2_patch_v2.py
      - .github/workflows/109-cmi-flu-b2-launch-v2.yml
      - .github/workflows/110-cmi-flu-b2-launch-v2-static.yml

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate request, patch, and launch boundary without credentials
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import ast, hashlib, json, os, pathlib, ssl, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"
          def read(path: str, limit: int) -> bytes:
              req = urllib.request.Request(base + path, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data
          request_bytes = read("requests/cmi-flu-b2-launch-v2.json", 32768)
          patcher = read("scripts/cmi_flu_b2_patch_v2.py", 32768)
          launch = read(".github/workflows/109-cmi-flu-b2-launch-v2.yml", 65536).decode("utf-8")
          source = b"".join(read(f"payloads/cmi-flu-b2-001/part-{i:02d}", 5000) for i in range(20))
          request = json.loads(request_bytes)
          if request.get("request_id") != "20260903-cmi-flu-b2-002" or request.get("parent_request_id") != "20260903-cmi-flu-b2-001":
              raise SystemExit("B2 request 002 identity mismatch")
          if request.get("target") != "renta0426/cmi-flu-b2-taskwise-compact-20260903-002":
              raise SystemExit("B2 request 002 target mismatch")
          if hashlib.sha256(source).hexdigest() != "a039b56868e5f9e2f10ae8016466a02fe4a6e5342854487ca6c6a198a21abd5e" or len(source) != 92839:
              raise SystemExit("B2 request 002 base source mismatch")
          compile(patcher.decode("utf-8"), "patch.py", "exec")
          (root / "source.py").write_bytes(source)
          (root / "request.json").write_bytes(request_bytes)
          (root / "patch.py").write_bytes(patcher)
          required = (
              "permissions: {}",
              "group: kaggle-resource-global",
              "queue: max",
              "environment: kaggle-readonry",
              "TARGET_KERNEL: renta0426/cmi-flu-b2-taskwise-compact-20260903-002",
              "competition_sources",
              "enable_gpu\": False",
              "enable_tpu\": False",
              "enable_internet\": False",
              "CMI_FLU_B2_002_LAUNCH PASS",
              "automatic_compute_retries=0",
          )
          for token in required:
              if token not in launch:
                  raise SystemExit(f"B2 request 002 launch guard missing: {token}")
          if launch.count('"${WORKDIR}/venv/bin/kaggle" kernels push') != 1:
              raise SystemExit("B2 request 002 must contain exactly one executable kernels push")
          for forbidden in ("competitions submit", "kernels delete", "datasets create", "models create", "upload-artifact", "actions/cache"):
              if forbidden in launch.lower():
                  raise SystemExit(f"forbidden B2 request 002 capability present: {forbidden}")
          tree = ast.parse(patcher.decode("utf-8"))
          imports = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split(".", 1)[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split(".", 1)[0])
          if imports - {"__future__", "argparse", "ast", "hashlib", "json", "pathlib"}:
              raise SystemExit(f"unexpected patcher imports: {sorted(imports)}")
          PY
          python3 "${workdir}/patch.py" --source "${workdir}/source.py" --request "${workdir}/request.json" --output "${workdir}/script.py"
          python3 -m py_compile "${workdir}/script.py"
          python3 "${workdir}/script.py" --self-test
          grep -F 'rglob("sample_submission_part1.csv")' "${workdir}/script.py" >/dev/null
          echo 'CMI_FLU_B2_002_STATIC PASS'
