name: Poisoned Chalice Stage1 verified submission

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-stage1-raw-fim-submit-v1.json

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-raw-fim-submit-v1.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  TARGET_KERNEL: renta0426/stage1-raw-fim-submission-v1

jobs:
  submit:
    name: Verify frozen output and submit exactly once
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/76-poisoned-chalice-stage1-raw-fim-submit.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "Protected Poisoned Chalice submission boundary: PASS"

      - name: Validate fixed submission request and prepare locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          request_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA_VALUE}/${REQUEST_PATH}"
          lock_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA_VALUE}/${LOCK_RELATIVE_PATH}"
          python3 - "${request_url}" "${lock_url}" "${workdir}/kaggle.lock" <<'PY'
          from __future__ import annotations
          import json
          import re
          import ssl
          import sys
          import urllib.request
          from urllib.parse import urlparse

          request_url, lock_url, lock_output = sys.argv[1:]
          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(url: str, limit: int) -> bytes:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected raw source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit("input exceeds fixed byte budget")
              return data

          request = json.loads(read(request_url, 16384))
          expected_fields = {
              "schema_version", "request_id", "parent_status_request_id", "competition",
              "operation", "target", "submission_file", "submission_sha256",
              "submission_message", "api_budget", "side_effects", "automatic_submission_retries",
          }
          if set(request) != expected_fields:
              raise SystemExit("submission request schema differs from fixed allowlist")
          if request["schema_version"] != 1:
              raise SystemExit("unsupported submission request schema")
          if request["request_id"] != "20260902-poisoned-chalice-stage1-raw-fim-submit-001":
              raise SystemExit("unexpected submission request id")
          if request["parent_status_request_id"] != "20260902-poisoned-chalice-stage1-raw-fim-status-001":
              raise SystemExit("unexpected parent status request")
          if request["competition"] != "poisoned-chalice-icse27":
              raise SystemExit("competition mismatch")
          if request["operation"] != "competition_submit":
              raise SystemExit("operation mismatch")
          if request["target"] != "renta0426/stage1-raw-fim-submission-v1":
              raise SystemExit("target mismatch")
          if request["submission_file"] != "submission.csv":
              raise SystemExit("submission file mismatch")
          if not re.fullmatch(r"[0-9a-f]{64}", str(request["submission_sha256"])):
              raise SystemExit("invalid frozen submission SHA-256")
          expected_message = "Stage1 raw_plus_fim frozen 10k OOF AUC 0.664524; no Public-LB tuning"
          if request["submission_message"] != expected_message:
              raise SystemExit("submission message mismatch")
          if request["api_budget"] != {"max_calls": 10, "max_pages": 1}:
              raise SystemExit("submission API budget mismatch")
          if request["side_effects"] != ["submit one verified submission.csv to poisoned-chalice-icse27"]:
              raise SystemExit("submission side-effect allowlist mismatch")
          if request["automatic_submission_retries"] != 0:
              raise SystemExit("automatic submission retries are prohibited")

          data = read(lock_url, 65536)
          text = data.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          open(lock_output, "w", encoding="utf-8").write(text)
          (open("/tmp/frozen-submission-sha256", "w", encoding="utf-8")).write(request["submission_sha256"])
          print("Fixed Poisoned Chalice submission request: PASS")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps \
            --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null

      - name: Recheck live rules, submission allowance, and completed kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os
          import re
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi()
          api.authenticate()
          competition = os.environ["TARGET_COMPETITION"]
          pages = api.competition_list_pages(competition) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition policy pages unavailable")
          rules = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["rules"])).casefold()
          conflicts = (
              "submissions are not allowed",
              "submissions are closed",
          )
          if any(phrase in rules for phrase in conflicts):
              raise SystemExit("live Competition rules indicate submission is unavailable")

          limits = api.competition_get_submission_limits(competition)
          allowed = int(getattr(limits, "num_allowed_now", 0) or 0)
          today = int(getattr(limits, "num_today", 0) or 0)
          total = int(getattr(limits, "num_total", 0) or 0)
          if allowed < 1:
              raise SystemExit("no Kaggle submission allowance remains at execution time")

          status = api.kernels_status(os.environ["TARGET_KERNEL"])
          value = str(getattr(status, "status", status)).upper()
          if "COMPLETE" not in value:
              raise SystemExit("target Kaggle kernel is not COMPLETE")
          print(f"SUBMISSION_PREFLIGHT PASS today={today} total={total} allowed_now={allowed}")
          PY

      - name: Download and revalidate the exact frozen submission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          output_dir="${WORKDIR}/output"
          mkdir -p "${output_dir}"
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels output "${TARGET_KERNEL}" \
            -p "${output_dir}" -q -o --page-size 50 \
            --file-pattern '^(run_manifest\.json|submission\.csv)$' \
            >"${WORKDIR}/output.stdout" 2>"${WORKDIR}/output.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/output.stdout" "${WORKDIR}/output.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: bounded Kaggle output download failed; response suppressed"
            exit 1
          fi

          "${WORKDIR}/venv/bin/python" - "${output_dir}" <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import json
          import math
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          files = [path for path in root.rglob("*") if path.is_file()]
          if {path.name for path in files} != {"run_manifest.json", "submission.csv"}:
              raise SystemExit("output file allowlist mismatch")
          manifest_path = next(path for path in files if path.name == "run_manifest.json")
          submission_path = next(path for path in files if path.name == "submission.csv")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("status") != "complete" or manifest.get("method") != "raw_plus_fim":
              raise SystemExit("kernel manifest status/method mismatch")
          if manifest.get("core_commit") != "bcf6d44db86fdda4ac9dd07b2d0172de471ab67a":
              raise SystemExit("kernel core commit mismatch")
          if manifest.get("train_rows") != 10000 or manifest.get("validation_rows") != 5000:
              raise SystemExit("kernel row counts mismatch")
          if manifest.get("hidden_validation_labels_used") is not False:
              raise SystemExit("hidden validation label guard failed")
          if manifest.get("public_leaderboard_tuning_used") is not False:
              raise SystemExit("Public-LB tuning guard failed")
          if manifest.get("validation_labels_used_for_fit_or_feature_selection") is not False:
              raise SystemExit("validation-label fit guard failed")
          counts = manifest.get("feature_counts") or {}
          if counts.get("base") != 113 or counts.get("structure_raw") != 50 or counts.get("fim") != 11 or counts.get("total") != 174:
              raise SystemExit("feature count mismatch")
          auc = float((manifest.get("reproduced_oof") or {}).get("auc", float("nan")))
          if not math.isfinite(auc) or abs(auc - 0.664524) > 0.002:
              raise SystemExit("frozen OOF reproduction gate failed")

          digest = hashlib.sha256(submission_path.read_bytes()).hexdigest()
          expected_digest = pathlib.Path("/tmp/frozen-submission-sha256").read_text(encoding="utf-8")
          if digest != expected_digest or digest != manifest.get("submission_sha256"):
              raise SystemExit("submission SHA-256 differs from frozen request/manifest")
          with submission_path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              if reader.fieldnames != ["sample_id", "membership_score"]:
                  raise SystemExit("submission header mismatch")
              rows = list(reader)
          if len(rows) != 5000 or len({row["sample_id"] for row in rows}) != 5000:
              raise SystemExit("submission sample coverage mismatch")
          if not all(math.isfinite(float(row["membership_score"])) for row in rows):
              raise SystemExit("submission contains non-finite score")
          print(f"FROZEN_SUBMISSION_VERIFIED sha256={digest} rows=5000 oof_auc={auc:.6f}")
          PY

      - name: Submit exactly once with no automatic retry
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" - "${WORKDIR}/output" <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import ssl
          import urllib.request
          from kaggle.api.kaggle_api_extended import KaggleApi

          root = pathlib.Path(__import__("sys").argv[1])
          submission_path = next(root.rglob("submission.csv"))
          request_url = (
              f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/"
              f"{os.environ['GITHUB_SHA']}/{os.environ['REQUEST_PATH']}"
          )
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          with opener.open(request_url, timeout=30) as response:
              request = json.loads(response.read(16384))

          api = KaggleApi()
          api.authenticate()
          response = api.competition_submit(
              str(submission_path),
              request["submission_message"],
              os.environ["TARGET_COMPETITION"],
              quiet=True,
          )
          message = str(getattr(response, "message", "") or "")
          if "could not submit" in message.casefold():
              raise SystemExit("Kaggle rejected submission; automatic retry disabled")
          print(
              "COMPETITION_SUBMISSION_ACCEPTED "
              f"request_id={request['request_id']} competition={os.environ['TARGET_COMPETITION']} "
              f"sha256={request['submission_sha256']} automatic_retries=0"
          )
          PY

      - name: Cleanup runner-local output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/frozen-submission-sha256
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then
            rm -rf "${WORKDIR}"
          fi
          echo "Runner-local Kaggle output removed"
