name: Poisoned Chalice P1-03 SERSEM cache readout

on:
  pull_request:
    paths:
      - requests/poisoned-chalice-p1-03-sersem-cache-readout-v1.json
      - scripts/poisoned_chalice_sersem_cache_readout.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_policy_preflight.py
      - requirements/kaggle-2.2.4.lock
      - .github/workflows/227-poisoned-chalice-p1-03-sersem-cache-readout.yml
  push:
    branches: [main]
    paths:
      - requests/poisoned-chalice-p1-03-sersem-cache-readout-v1.json
      - scripts/poisoned_chalice_sersem_cache_readout.py
      - .github/workflows/227-poisoned-chalice-p1-03-sersem-cache-readout.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-p1-03-sersem-cache-readout-v1.json
  SCRIPT_PATH: scripts/poisoned_chalice_sersem_cache_readout.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  SCIENCE_COMMIT: fa717668f471f6389c4b810742e88480dbe40180
  SCIENCE_SERSEM_BLOB: 19ed17386589cb0f3b38164dba82c660f3ff721b
  SCIENCE_EVALUATION_BLOB: cb3afd4f3e3ecafe0e0677eda4fda30e93b04ba8

jobs:
  validate:
    name: Validate aggregate-only SERSEM readout contract
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce credential-free source boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "SOURCE_SHA=${source_sha}" >> "${GITHUB_ENV}"
          mkdir -p "${workdir}/bridge" "${workdir}/science"

      - name: Materialize exact bridge and science sources
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${SOURCE_SHA}" "${WORKDIR}" <<'PY'
          import hashlib,pathlib,ssl,sys,urllib.request
          bridge_sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          ctx = ssl.create_default_context()
          bridge_files = {
              "requests/poisoned-chalice-p1-03-sersem-cache-readout-v1.json": 32768,
              "scripts/poisoned_chalice_sersem_cache_readout.py": 131072,
              "scripts/kaggle_policy_preflight.py": 65536,
          }
          for rel, maximum in bridge_files.items():
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{bridge_sha}/{rel}"
              req=urllib.request.Request(url,headers={"User-Agent":"p1-03-sersem-cache-readout/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
              if not data or len(data)>maximum: raise SystemExit(f"bridge_source_contract_failed path={rel}")
              path=root/"bridge"/pathlib.Path(rel).name; path.write_bytes(data)
              if path.suffix==".py": compile(data,str(path),"exec")
          science={
              "sersem.py": ("src/poisoned_chalice/sersem.py", "19ed17386589cb0f3b38164dba82c660f3ff721b", 65536),
              "evaluation.py": ("src/poisoned_chalice/evaluation.py", "cb3afd4f3e3ecafe0e0677eda4fda30e93b04ba8", 65536),
          }
          for name,(rel,expected_blob,maximum) in science.items():
              url=f"https://raw.githubusercontent.com/renta0426/The-Poisoned-Chalice-of-LLM-Evaluation/fa717668f471f6389c4b810742e88480dbe40180/{rel}"
              req=urllib.request.Request(url,headers={"User-Agent":"p1-03-sersem-cache-readout/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
              if not data or len(data)>maximum: raise SystemExit(f"science_source_contract_failed path={rel}")
              git_blob=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if git_blob != expected_blob: raise SystemExit(f"science_blob_mismatch path={rel}")
              path=root/"science"/name; path.write_bytes(data); compile(data,str(path),"exec")
          print("P1_03_SERSEM_MATERIALIZE PASS bridge_files=3 science_files=2 private_repo_access=0")
          PY
          python3 "${WORKDIR}/bridge/kaggle_policy_preflight.py"

      - name: Validate exact request and runner self-test
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/poisoned-chalice-p1-03-sersem-cache-readout-v1.json" <<'PY'
          import json,sys
          request=json.load(open(sys.argv[1],encoding="utf-8"))
          expected_sources=[
              {"target":"renta0426/starter-plus-10k-v2","expected_current_version":1,"required_terminal_status":"ERROR","shard_start":0,"shard_stop":24},
              {"target":"renta0426/starter-plus-10k-v2-continuation","expected_current_version":1,"required_terminal_status":"COMPLETE","shard_start":24,"shard_stop":40},
          ]
          if request.get("schema_version")!=1 or request.get("operation")!="kernel_current_output_aggregate": raise SystemExit("request_header_mismatch")
          if request.get("science_commit")!="fa717668f471f6389c4b810742e88480dbe40180": raise SystemExit("science_commit_mismatch")
          if request.get("cache_sources")!=expected_sources: raise SystemExit("cache_source_mismatch")
          if request.get("side_effects")!=[] or request.get("automatic_compute_retries")!=0: raise SystemExit("side_effect_contract_mismatch")
          if request.get("protected_job_private_repository_access") is not False or request.get("kaggle_compute") is not False: raise SystemExit("execution_boundary_mismatch")
          if request["download_contract"].get("persist_raw_cache") is not False or request["download_contract"].get("aggregate_only") is not True: raise SystemExit("output_hygiene_mismatch")
          if request["scientific_contract"].get("comparison") != ["zsigmoid_window_mean","sersem_output_windowed_formula_faithful","sersem_max_context_union_variant"]: raise SystemExit("comparison_changed")
          print("P1_03_SERSEM_REQUEST PASS side_effects=0 compute=0 exact_sources=2 shards=40")
          PY
          python3 "${WORKDIR}/bridge/poisoned_chalice_sersem_cache_readout.py" --self-test

      - name: Cleanup validation material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi

  readout:
    name: Read exact current cache shards and aggregate SERSEM metrics
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/227-poisoned-chalice-p1-03-sersem-cache-readout.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "forbidden credential variable: ${name}"; exit 1; }
          done
          echo "P1_03_SERSEM_BOUNDARY PASS side_effects=0 kaggle_compute=0 private_repo_access=0 automatic_retries=0"

      - name: Materialize immutable public sources
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/p1-03-sersem-cache-readout"
          [[ ! -e "${workdir}" ]]
          mkdir -p "${workdir}/bridge" "${workdir}/science"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import hashlib,pathlib,ssl,sys,urllib.request
          bridge_sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value); ctx=ssl.create_default_context()
          bridge_files={
              "requests/poisoned-chalice-p1-03-sersem-cache-readout-v1.json":32768,
              "scripts/poisoned_chalice_sersem_cache_readout.py":131072,
              "scripts/kaggle_exact_identity.py":65536,
              "scripts/kaggle_policy_preflight.py":65536,
              "requirements/kaggle-2.2.4.lock":262144,
          }
          for rel,maximum in bridge_files.items():
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{bridge_sha}/{rel}"
              req=urllib.request.Request(url,headers={"User-Agent":"p1-03-sersem-cache-readout/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
              if not data or len(data)>maximum: raise SystemExit(f"bridge_source_contract_failed path={rel}")
              path=root/"bridge"/pathlib.Path(rel).name; path.write_bytes(data)
              if path.suffix==".py": compile(data,str(path),"exec")
          science={
              "sersem.py":("src/poisoned_chalice/sersem.py","19ed17386589cb0f3b38164dba82c660f3ff721b",65536),
              "evaluation.py":("src/poisoned_chalice/evaluation.py","cb3afd4f3e3ecafe0e0677eda4fda30e93b04ba8",65536),
          }
          for name,(rel,expected_blob,maximum) in science.items():
              url=f"https://raw.githubusercontent.com/renta0426/The-Poisoned-Chalice-of-LLM-Evaluation/fa717668f471f6389c4b810742e88480dbe40180/{rel}"
              req=urllib.request.Request(url,headers={"User-Agent":"p1-03-sersem-cache-readout/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
              if not data or len(data)>maximum: raise SystemExit(f"science_source_contract_failed path={rel}")
              observed=hashlib.sha1(f"blob {len(data)}\0".encode()+data).hexdigest()
              if observed!=expected_blob: raise SystemExit(f"science_blob_mismatch path={rel}")
              path=root/"science"/name; path.write_bytes(data); compile(data,str(path),"exec")
          print("P1_03_SERSEM_PROTECTED_MATERIALIZE PASS private_repo_access=0")
          PY
          python3 "${workdir}/bridge/kaggle_policy_preflight.py"

      - name: Prepare locked Kaggle client and pinned CPU evaluator
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/kaggle-2.2.4.lock" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          python3 -m venv "${WORKDIR}/eval-venv"
          "${WORKDIR}/eval-venv/bin/pip" install --disable-pip-version-check --no-input \
            numpy==2.4.2 pandas==3.0.1 scipy==1.17.1 scikit-learn==1.8.0 \
            datasets==4.6.1 pyarrow==23.0.1 transformers==5.0.0 \
            tree-sitter==0.20.4 tree-sitter-languages==1.10.2 \
            flake8==7.3.0 pyenchant==3.3.0 >/dev/null
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libenchant-2-2 hunspell-en-us >/dev/null
          PATH="${WORKDIR}/eval-venv/bin:${PATH}" "${WORKDIR}/eval-venv/bin/python" - <<'PY'
          import enchant
          from tree_sitter_languages import get_parser
          for language in ("go","java","python","ruby","rust"): get_parser(language)
          enchant.Dict("en_US")
          import transformers
          if transformers.__version__ != "5.0.0": raise SystemExit("transformers_version_mismatch")
          print("P1_03_SERSEM_EVAL_ENV PASS parsers=5 enchant=en_US transformers=5.0.0")
          PY
          "${WORKDIR}/eval-venv/bin/python" "${WORKDIR}/bridge/poisoned_chalice_sersem_cache_readout.py" --self-test

      - name: Prove exact current versions and terminal states before output read
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          mkdir -p "${HOME}/.kaggle"; umask 077; printf '%s' "${KAGGLE_API_TOKEN}" > "${HOME}/.kaggle/access_token"; unset KAGGLE_API_TOKEN
          PYTHONPATH="${WORKDIR}/bridge" "${WORKDIR}/kaggle-venv/bin/python" - "${WORKDIR}/bridge/poisoned-chalice-p1-03-sersem-cache-readout-v1.json" <<'PY'
          import json,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import exact_metadata_eventually,validate_metadata,status_name
          request=json.load(open(sys.argv[1],encoding="utf-8")); api=KaggleApi(); api.authenticate()
          states=[]
          for item in request["cache_sources"]:
              metadata=exact_metadata_eventually(api,item["target"],attempts=6,delay_seconds=2.0)
              validate_metadata(metadata,item["target"],int(item["expected_current_version"]))
              state=status_name(getattr(api.kernels_status(item["target"]),"status",None))
              if state != item["required_terminal_status"]: raise SystemExit("required_terminal_status_mismatch")
              states.append(state)
          print(f"P1_03_SERSEM_PREIDENTITY PASS sources=2 states={','.join(states)} current_versions=1,1")
          PY

      - name: Download allowlisted token shards incrementally and aggregate predictors
        shell: bash
        run: |
          set -euo pipefail
          output="${WORKDIR}/aggregate.json"
          PATH="${WORKDIR}/eval-venv/bin:${WORKDIR}/kaggle-venv/bin:${PATH}" \
          "${WORKDIR}/eval-venv/bin/python" "${WORKDIR}/bridge/poisoned_chalice_sersem_cache_readout.py" \
            --request "${WORKDIR}/bridge/poisoned-chalice-p1-03-sersem-cache-readout-v1.json" \
            --kaggle-cli "${WORKDIR}/kaggle-venv/bin/kaggle" \
            --science-dir "${WORKDIR}/science" \
            --output-json "${output}"
          [[ -s "${output}" ]]
          python3 - "${output}" <<'PY'
          import json,sys
          data=json.load(open(sys.argv[1],encoding="utf-8"))
          raw=json.dumps(data,sort_keys=True)
          forbidden=("sample_id","content","prediction_rows","source_text","raw_cache")
          if any(token in raw for token in forbidden): raise SystemExit("aggregate_output_hygiene_failed")
          if data.get("samples")!=10000 or data.get("new_model_forward") is not False: raise SystemExit("aggregate_result_contract_failed")
          print(json.dumps(data,sort_keys=True,separators=(",",":")))
          PY

      - name: Re-prove exact current versions after output read
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge" "${WORKDIR}/kaggle-venv/bin/python" - "${WORKDIR}/bridge/poisoned-chalice-p1-03-sersem-cache-readout-v1.json" <<'PY'
          import json,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import exact_metadata_eventually,validate_metadata,status_name
          request=json.load(open(sys.argv[1],encoding="utf-8")); api=KaggleApi(); api.authenticate()
          for item in request["cache_sources"]:
              metadata=exact_metadata_eventually(api,item["target"],attempts=6,delay_seconds=2.0)
              validate_metadata(metadata,item["target"],int(item["expected_current_version"]))
              state=status_name(getattr(api.kernels_status(item["target"]),"status",None))
              if state != item["required_terminal_status"]: raise SystemExit("postread_terminal_status_mismatch")
          print("P1_03_SERSEM_POSTIDENTITY PASS sources=2 versions_unchanged=1")
          PY

      - name: Cleanup raw and credential material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${HOME}/.kaggle/access_token" "${HOME}/.kaggle/kaggle.json" || true
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "P1_03_SERSEM_CLEANUP PASS raw_cache_persisted=0 aggregate_artifact_uploaded=0"
