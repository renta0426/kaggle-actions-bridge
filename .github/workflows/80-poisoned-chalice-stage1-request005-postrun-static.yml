name: Poisoned Chalice Stage1 request005 postrun static validation

on:
  pull_request:
    paths:
      - .github/workflows/80-poisoned-chalice-stage1-request005-postrun-static.yml
      - .github/workflows/81-poisoned-chalice-stage1-request005-status.yml
      - .github/workflows/82-poisoned-chalice-stage1-request005-submit.yml
      - requests/poisoned-chalice-stage1-request005-status-v1.json
      - requests/poisoned-chalice-stage1-request005-submit-v1.json

permissions: {}

concurrency:
  group: poisoned-chalice-stage1-request005-postrun-static-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Validate request005 status and submission boundaries
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Fetch exact PR-head workflows without credentials and validate
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "${HEAD_REPO}" == "renta0426/kaggle-actions-bridge" ]]
          python3 - <<'PY'
          from __future__ import annotations
          import os
          import ssl
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          repository = os.environ["HEAD_REPO"]
          sha = os.environ["HEAD_SHA"]
          root = f"https://raw.githubusercontent.com/{repository}/{sha}/"
          files = {
              "status": ".github/workflows/81-poisoned-chalice-stage1-request005-status.yml",
              "submit": ".github/workflows/82-poisoned-chalice-stage1-request005-submit.yml",
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def fetch(path: str, limit: int = 131072) -> str:
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"workflow exceeds fixed byte budget: {path}")
              return data.decode("utf-8")

          workflows = {name: fetch(path) for name, path in files.items()}
          common_required = (
              "permissions: {}",
              "runs-on: ubuntu-24.04",
              "environment: kaggle-readonry",
              "github.repository == 'renta0426/kaggle-actions-bridge'",
              "github.actor_id == '71638068'",
              "requirements/kaggle-2.2.4.lock",
              "EXPECTED_KERNEL_VERSION: \"2\"",
              "renta0426/stage1-raw-fim-submission-v1",
              "Poisoned-Chalice/ICSE-2027-public",
              "2ed5468723efa5457a3665782c6979ea4dbac7c2",
              "733247c55e3f73af49ce8e9c7949bf14af205928",
              "hidden_validation_labels_used",
              "public_leaderboard_tuning_used",
              "validation_labels_used_for_fit_or_feature_selection",
          )
          forbidden_common = (
              "pull_request_target:",
              "workflow_run:",
              "repository_dispatch:",
              "issue_comment:",
              "runs-on: self-hosted",
              "actions/checkout@",
              "set -x",
              "curl ",
              "wget ",
              "eval ",
              "kaggle datasets create",
              "kaggle datasets version",
              "kaggle kernels delete",
              "kaggle models",
          )
          for name, text in workflows.items():
              for required in common_required:
                  if required not in text:
                      raise SystemExit(f"{name} workflow missing invariant: {required}")
              for forbidden in forbidden_common:
                  if forbidden in text:
                      raise SystemExit(f"{name} workflow contains forbidden construct: {forbidden}")
              if text.count("environment: kaggle-readonry") != 1:
                  raise SystemExit(f"{name} workflow must contain exactly one protected job")

          status = workflows["status"]
          for required in (
              "requests/poisoned-chalice-stage1-request005-status-v1.json",
              "20260903-poisoned-chalice-stage1-request005-status-001",
              "20260902-poisoned-chalice-stage1-raw-fim-005",
              '"operation": "kernel_status_output"',
              '"expected_kernel_version": 2',
              '"side_effects": []',
              "--file-pattern '^(run_manifest\\.json|submission\\.csv)$'",
              "POISONED_CHALICE_REQUEST005_OUTPUT_VERIFIED",
          ):
              if required not in status:
                  raise SystemExit(f"status workflow missing fixed contract: {required}")
          for forbidden in (
              "competition_submit(",
              "kernels push",
              "kernels delete",
              "upload-artifact",
              "actions/cache",
          ):
              if forbidden in status:
                  raise SystemExit(f"status workflow is not read-only: {forbidden}")

          submit = workflows["submit"]
          for required in (
              "requests/poisoned-chalice-stage1-request005-submit-v1.json",
              "20260903-poisoned-chalice-stage1-request005-submit-001",
              "20260903-poisoned-chalice-stage1-request005-status-001",
              "20260902-poisoned-chalice-stage1-raw-fim-005",
              '"operation": "competition_submit"',
              '"expected_kernel_version"] != 2',
              '"automatic_submission_retries"] != 0',
              "Stage1 raw_plus_fim frozen 10k OOF AUC 0.664524; no Public-LB tuning",
              "REQUEST005_FROZEN_SUBMISSION_VERIFIED",
              "api.competition_submit(",
          ):
              if required not in submit:
                  raise SystemExit(f"submit workflow missing fixed contract: {required}")
          if submit.count("api.competition_submit(") != 1:
              raise SystemExit("submit workflow must contain exactly one submission call")
          for forbidden in (
              "kernels push",
              "kernels delete",
              "competition_submit_cli",
              "upload-artifact",
              "actions/cache",
          ):
              if forbidden in submit:
                  raise SystemExit(f"submit workflow contains forbidden side effect: {forbidden}")

          print("POISONED_CHALICE_REQUEST005_POSTRUN_STATIC PASS")
          PY
