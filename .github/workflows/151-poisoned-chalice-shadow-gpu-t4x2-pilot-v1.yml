name: Poisoned Chalice controlled shadow GPU T4 x2 pilot v1

on:
  push:
    branches: [main]
    paths:
      - requests/poisoned-chalice-shadow-gpu-t4x2-pilot-v1.json
      - scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v1.py
      - scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v2.py
      - materialized/poisoned-chalice-shadow-gpu-t4x2-pilot-v1/**
      - .github/workflows/151-poisoned-chalice-shadow-gpu-t4x2-pilot-v1.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-shadow-gpu-t4x2-pilot-v1.json
      - scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v1.py
      - scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v2.py
      - materialized/poisoned-chalice-shadow-gpu-t4x2-pilot-v1/**
      - .github/workflows/151-poisoned-chalice-shadow-gpu-t4x2-pilot-v1.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-shadow-gpu-t4x2-pilot-v1.json
  LAUNCHER_PATH: scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v2.py
  BASE_LAUNCHER_PATH: scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v1.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_KERNEL: renta0426/shadow-gpu-t4x2-pilot-v1
  TARGET_COMPETITION: poisoned-chalice-icse27

jobs:
  validate:
    name: Validate controlled shadow T4 x2 pilot without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact GPU bundle and generated Notebook
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          import hashlib, json, pathlib, ssl, sys, time, urllib.request
          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-shadow-gpu-t4x2-pilot-v1.json": 32768,
              "scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v2.py": 262144,
              "scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v1.py": 262144,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_protocol.py": 131072,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_training.py": 131072,
              "materialized/poisoned-chalice-shadow-gpu-t4x2-pilot-v1/poisoned_chalice/shadow_training_dual_gpu.py": 65536,
              "materialized/poisoned-chalice-shadow-gpu-t4x2-pilot-v1/shadow_gpu_t4x2_pilot_v1.json": 32768,
          }
          context = ssl.create_default_context()
          def fetch(path, maximum):
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"kaggle-actions-bridge/1"})
                      with urllib.request.urlopen(req, timeout=30, context=context) as response:
                          data = response.read(maximum + 1)
                      if len(data) > maximum:
                          raise SystemExit(f"file too large: {path}")
                      return data
                  except Exception as exc:
                      last = exc
                      if attempt < 2:
                          time.sleep(attempt + 1)
              raise SystemExit(f"read-only bridge fetch failed: {path}: {last}")
          for path, maximum in files.items():
              data = fetch(path, maximum)
              dst = root / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
          request = json.loads((root / "requests/poisoned-chalice-shadow-gpu-t4x2-pilot-v1.json").read_text())
          exact = {
              "request_id": "20260904-poisoned-chalice-shadow-gpu-t4x2-pilot-v1-001",
              "parent_request_id": "20260904-poisoned-chalice-shadow-tpu-pilot-v6-001",
              "competition": "poisoned-chalice-icse27",
              "operation": "kernel_run",
              "target": "renta0426/shadow-gpu-t4x2-pilot-v1",
              "launcher_path": "scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v2.py",
              "research_commit": "251e9f0b7063dc2288a4fa258b9a314963f6ad19",
              "automatic_compute_retries": 0,
              "enable_internet": False,
              "competition_submission": False,
          }
          for key, value in exact.items():
              if request.get(key) != value:
                  raise SystemExit(f"request contract changed: {key}")
          resource = request.get("resource") or {}
          if resource.get("accelerator") != "gpu" or resource.get("machine_shape") != "NvidiaTeslaT4":
              raise SystemExit("GPU resource contract changed")
          if resource.get("expected_visible_gpu_count") != 2 or resource.get("max_active_runs") != 1:
              raise SystemExit("GPU count/concurrency contract changed")
          if float(resource.get("min_remaining_quota_hours", -1)) != 1.0:
              raise SystemExit("GPU quota floor changed")
          contract = request.get("pilot_contract") or {}
          if contract.get("transition_from") != "shadow-tpu-pilot-v6":
              raise SystemExit("GPU transition parent changed")
          if contract.get("backend") != "cuda" or contract.get("expected_gpu_count") != 2:
              raise SystemExit("CUDA pilot contract changed")
          if contract.get("architecture_gpu_assignment") != {"left": 0, "right": 1}:
              raise SystemExit("GPU assignment changed")
          if contract.get("per_architecture_world_size") != 1:
              raise SystemExit("per-architecture world size changed")
          if any(contract.get(key) is not False for key in ("distributed_training", "ddp_used", "nccl_used")):
              raise SystemExit("distributed GPU training became enabled")
          if contract.get("run_architectures_concurrently") is not True:
              raise SystemExit("GPU concurrency contract changed")
          if contract.get("synthetic_training_rows") != 128 or contract.get("max_sequence_tokens") != 256:
              raise SystemExit("synthetic protocol dimensions changed")
          if contract.get("seed") != 2027 or contract.get("global_batch_size") != 64:
              raise SystemExit("synthetic protocol seed/batch changed")
          if contract.get("max_steps_per_architecture") != 2 or float(contract.get("checkpoint_reload_atol", -1)) != 1e-5:
              raise SystemExit("GPU step/fidelity gate changed")
          if contract.get("stage2_v3_selection_allowed") is not False:
              raise SystemExit("scientific guard changed")
          if request.get("clean_room", {}).get("protected_job_private_repository_access") is not False:
              raise SystemExit("private repository boundary changed")
          if len(request.get("materialized_files", [])) != 4:
              raise SystemExit("GPU snapshot count changed")
          for path_key, blob_key in (
              ("launcher_path", "launcher_blob_sha"),
              ("base_launcher_path", "base_launcher_blob_sha"),
          ):
              data = (root / request[path_key]).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != request[blob_key]:
                  raise SystemExit(f"launcher blob mismatch: {path_key}")
          for item in request["materialized_files"]:
              data = (root / item["bridge_path"]).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != item["git_blob_sha"] or len(data) > int(item["max_bytes"]):
                  raise SystemExit(f"snapshot mismatch: {item['bridge_path']}")
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" --static --launcher "${workdir}/${LAUNCHER_PATH}"
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --materialize \
            --base-launcher "${workdir}/${BASE_LAUNCHER_PATH}" \
            --snapshot-root "${workdir}" \
            --kernel-dir "${workdir}/kernel"
          python3 - "${workdir}/kernel" <<'PY'
          import ast, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          notebook = json.loads((root / "shadow-gpu-t4x2-pilot-v1.ipynb").read_text())
          metadata = json.loads((root / "kernel-metadata.json").read_text())
          code = "".join(notebook["cells"][1]["source"])
          compile(code, "shadow-gpu-t4x2-pilot-v1.ipynb", "exec")
          tree = ast.parse(code)
          assert "251e9f0b7063dc2288a4fa258b9a314963f6ad19" in code
          assert "shadow-gpt2-byte-5m" in code and "shadow-llama-byte-5m" in code
          assert "run_dual_gpu_shadow" in code and "expected_gpu_count=2" in code
          assert "required_gpu_name_fragment='T4'" in code
          assert "os.environ['PYTHONPATH']" in code
          assert "checkpoint_reload_atol=1e-5" in code
          assert "torch_xla" not in code and "torch.distributed" not in code and "torchrun" not in code
          calls = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == "run_dual_gpu_shadow"]
          assert len(calls) == 1
          expected = {
              "id": "renta0426/shadow-gpu-t4x2-pilot-v1",
              "code_file": "shadow-gpu-t4x2-pilot-v1.ipynb",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "NvidiaTeslaT4",
              "dataset_sources": [],
              "kernel_sources": [],
              "competition_sources": [],
              "model_sources": [],
          }
          for key, value in expected.items():
              assert metadata.get(key) == value, (key, metadata.get(key), value)
          print("SHADOW_GPU_T4X2_NOTEBOOK_VALIDATE PASS gpu=2 tpu_layers=0 ddp=0")
          PY

  launch:
    name: Launch exactly one controlled shadow T4 x2 pilot
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/151-poisoned-chalice-shadow-gpu-t4x2-pilot-v1.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" && -z "${RESEARCH_REPO_READ_TOKEN-}" ]]
          echo "SHADOW_GPU_T4X2_PROTECTED_BOUNDARY PASS private_repo_access=0"

      - name: Materialize approved public GPU bundle and Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          kernel_dir="${workdir}/kernel"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${kernel_dir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import hashlib, json, pathlib, re, ssl, sys, time, urllib.request
          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          request_path = "requests/poisoned-chalice-shadow-gpu-t4x2-pilot-v1.json"
          fixed = {
              request_path: 32768,
              "scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v2.py": 262144,
              "scripts/poisoned_chalice_shadow_gpu_t4x2_pilot_v1.py": 262144,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_protocol.py": 131072,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_training.py": 131072,
              "materialized/poisoned-chalice-shadow-gpu-t4x2-pilot-v1/poisoned_chalice/shadow_training_dual_gpu.py": 65536,
              "materialized/poisoned-chalice-shadow-gpu-t4x2-pilot-v1/shadow_gpu_t4x2_pilot_v1.json": 32768,
              "requirements/kaggle-2.2.4.lock": 65536,
          }
          ctx = ssl.create_default_context()
          for path, maximum in fixed.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"kaggle-actions-bridge/1"})
                      with urllib.request.urlopen(req, timeout=30, context=ctx) as response:
                          data = response.read(maximum + 1)
                      if len(data) > maximum:
                          raise SystemExit(f"file too large: {path}")
                      break
                  except Exception as exc:
                      last = exc
                      if attempt == 2:
                          raise SystemExit(f"read-only fetch failed: {path}: {last}")
                      time.sleep(attempt + 1)
              dst = root / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
          request = json.loads((root / request_path).read_text())
          if request.get("request_id") != "20260904-poisoned-chalice-shadow-gpu-t4x2-pilot-v1-001":
              raise SystemExit("request identity changed")
          if request.get("target") != "renta0426/shadow-gpu-t4x2-pilot-v1":
              raise SystemExit("target changed")
          if request.get("research_commit") != "251e9f0b7063dc2288a4fa258b9a314963f6ad19":
              raise SystemExit("research commit changed")
          if request.get("automatic_compute_retries") != 0 or request.get("competition_submission") is not False:
              raise SystemExit("retry/submission guard changed")
          for path_key, blob_key in (("launcher_path", "launcher_blob_sha"), ("base_launcher_path", "base_launcher_blob_sha")):
              data = (root / request[path_key]).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != request[blob_key]:
                  raise SystemExit(f"launcher blob mismatch: {path_key}")
          for item in request["materialized_files"]:
              data = (root / item["bridge_path"]).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != item["git_blob_sha"] or len(data) > int(item["max_bytes"]):
                  raise SystemExit(f"snapshot mismatch: {item['bridge_path']}")
          lock = (root / "requirements/kaggle-2.2.4.lock").read_text()
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" --static --launcher "${workdir}/${LAUNCHER_PATH}"
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --materialize \
            --base-launcher "${workdir}/${BASE_LAUNCHER_PATH}" \
            --snapshot-root "${workdir}" \
            --kernel-dir "${kernel_dir}"
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/${LOCK_PATH}" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "SHADOW_GPU_T4X2_CLIENT PASS private_repo_access=0"

      - name: Confirm current Kaggle policy pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, time, urllib.request
          ctx = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              last = None
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={"User-Agent":"kaggle-actions-bridge/1"})
                      with urllib.request.urlopen(req, timeout=30, context=ctx) as response:
                          if response.status != 200 or not response.read(65536):
                              raise RuntimeError("empty response")
                      break
                  except Exception as exc:
                      last = exc
                      if attempt == 2:
                          raise SystemExit(f"official Kaggle page unavailable: {url}: {last}")
                      time.sleep(attempt + 1)
          print("SHADOW_GPU_T4X2_POLICY PASS")
          PY

      - name: Live GPU preflight and launch once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -z "${RESEARCH_REPO_READ_TOKEN-}" && -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi()
          api.authenticate()
          target = os.environ["TARGET_KERNEL"]
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live competition pages unavailable")
          plain = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["evaluation"].replace(r"\%", "%"))).casefold()
          if not all(token in plain for token in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("evaluation contract changed")
          rules_plain = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["rules"])).casefold()
          if "gpu is prohibited" in rules_plain:
              raise SystemExit("GPU prohibited")
          visible = api.kernels_list(user="renta0426", search="shadow-gpu-t4x2-pilot-v1", page_size=20) or []
          if any(str(getattr(item, "ref", "")) == target for item in visible):
              raise SystemExit("target already exists")
          quota = api.quota_view()
          gpu = getattr(quota, "gpu_quota", None)
          used = getattr(gpu, "time_used", None)
          total = getattr(gpu, "total_time_allowed", None)
          if used is None or total is None:
              raise SystemExit("GPU quota unavailable")
          remaining = max(0.0, (total - used).total_seconds() / 3600.0)
          if remaining < 1.0:
              raise SystemExit(f"insufficient GPU quota: {remaining:.2f}h")
          recent = (api.kernels_list(user="renta0426", sort_by="dateRun", page_size=25) or [])[:25]
          active = []
          unknown = 0
          for item in recent:
              ref = str(getattr(item, "ref", "") or "")
              if not ref:
                  continue
              try:
                  status = str(getattr(api.kernels_status(ref), "status", "")).upper()
              except Exception:
                  unknown += 1
                  continue
              if any(token in status for token in ("RUNNING", "QUEUED", "PENDING")):
                  active.append(ref)
          if active or unknown:
              raise SystemExit(f"conservative admission refused: active={len(active)} unknown={unknown}")
          print(f"SHADOW_GPU_T4X2_LIVE_PREFLIGHT PASS quota={remaining:.2f} active=0 unknown=0")
          PY
          "${WORKDIR}/kaggle-venv/bin/python" "${WORKDIR}/${LAUNCHER_PATH}" \
            --execute \
            --base-launcher "${WORKDIR}/${BASE_LAUNCHER_PATH}" \
            --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle" \
            --kernel-dir "${KERNEL_DIR}"

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then
            rm -rf "${WORKDIR}"
          fi
          echo "SHADOW_GPU_T4X2_CLEANUP PASS retention_days=0"
