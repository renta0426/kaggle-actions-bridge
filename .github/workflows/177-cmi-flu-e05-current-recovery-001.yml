name: CMI-Flu E05 current-version read-only recovery 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/177-cmi-flu-e05-current-recovery-001.yml
      - requests/cmi-flu-e05-current-recovery-001.json
      - scripts/cmi_flu_e05_recover.py
  pull_request:
    paths:
      - .github/workflows/177-cmi-flu-e05-current-recovery-001.yml
      - requests/cmi-flu-e05-current-recovery-001.json
      - scripts/cmi_flu_e05_recover.py

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260907-cmi-flu-e05-current-recovery-001
  ORIGINAL_REQUEST_ID: 20260907-cmi-flu-strategy-e05-hai-donor-strain-001
  TARGET_KERNEL: renta0426/cmi-flu-e05-hai-donor-strain-20260907-001
  EXPECTED_VERSION: "1"
  EXPECTED_RUNTIME_SHA256: bb295cce54a89cd2b2181629b1c47f0474e044a250c26a3048fc4f11f435162b
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E05 read-only recovery contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done
      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('unsafe archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive path')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
      - name: Build frozen runtime and validate recovery source
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_prepare.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          test "$(sha256sum "${WORKDIR}/script.py" | awk '{print $1}')" = "${EXPECTED_RUNTIME_SHA256}"
          python3 -m py_compile "${WORKDIR}/bridge/scripts/cmi_flu_e05_recover.py"
          python3 - "${WORKDIR}/bridge/requests/cmi-flu-e05-current-recovery-001.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          expected={
            'request_id':'20260907-cmi-flu-e05-current-recovery-001',
            'original_request_id':'20260907-cmi-flu-strategy-e05-hai-donor-strain-001',
            'operation':'kernel_current_failed_recovery_read',
            'target':'renta0426/cmi-flu-e05-hai-donor-strain-20260907-001',
            'expected_kernel_version':1,
            'expected_runtime_sha256':'bb295cce54a89cd2b2181629b1c47f0474e044a250c26a3048fc4f11f435162b',
            'new_write_attempted':False,
            'new_compute_requested':False,
            'competition_submission_attempted':False,
          }
          for k,v in expected.items():
            if r.get(k)!=v: raise SystemExit(f'request mismatch:{k}')
          PY
          ! grep -Eq 'kernels[[:space:]]+push|competitions[[:space:]]+submit|kernel_push|kernels_push' "${WORKDIR}/bridge/scripts/cmi_flu_e05_recover.py"
          grep -F 'verb not in {"pull", "output"}' "${WORKDIR}/bridge/scripts/cmi_flu_e05_recover.py" >/dev/null
          python3 - "${WORKDIR}/bridge/scripts/cmi_flu_e05_recover.py" <<'PY'
          import importlib.util,sys
          p=sys.argv[1]; spec=importlib.util.spec_from_file_location('recover',p); m=importlib.util.module_from_spec(spec)
          sys.path.insert(0,p.rsplit('/',1)[0]); spec.loader.exec_module(m)
          x='CMI_FLU_E05_FAILED stage=run_e05 exception_type=DataContractError error_code=0123456789abcdef0123'
          assert m.SIG_RE.findall(x)==[('run_e05','DataContractError','0123456789abcdef0123')]
          PY
          echo CMI_FLU_E05_RECOVERY_VALIDATE_PASS
      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  recover:
    name: Read existing E05 version 1 only
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Enforce protected recovery boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/177-cmi-flu-e05-current-recovery-001.yml@refs/heads/main" ]]
      - name: Materialize exact bridge commit and frozen E05 runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefix=next(iter({m.name.split('/',1)[0] for m in files}))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):]); out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e05_prepare.py" --repository-root "${workdir}/bridge" --output "${workdir}/script.py"
          test "$(sha256sum "${workdir}/script.py" | awk '{print $1}')" = "${EXPECTED_RUNTIME_SHA256}"
      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
      - name: Read exact failed current version and sanitize evidence
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e05_recover.py" --runtime "${WORKDIR}/script.py" --output "${WORKDIR}/recovery"
          test -f "${WORKDIR}/recovery/recovery.json"
          grep -F '"new_write_attempted": false' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"new_compute_requested": false' "${WORKDIR}/recovery/recovery.json" >/dev/null
      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
