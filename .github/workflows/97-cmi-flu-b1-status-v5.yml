name: CMI-Flu B1 request 005 status and output verification

on:
  push:
    branches:
      - main
    paths:
      - requests/cmi-flu-b1-status-v5.json
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/97-cmi-flu-b1-status-v5.yml
      - requests/cmi-flu-b1-status-v5.json

permissions: {}

concurrency:
  group: kaggle-read-cmi-flu-b1-005
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b1-status-v5.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_OWNER: renta0426
  TARGET_SLUG: cmi-flu-b1-anchor-single-file-20260902-005
  TARGET_KERNEL: renta0426/cmi-flu-b1-anchor-single-file-20260902-005

jobs:
  static:
    name: Validate request-005 read-only verifier without secrets
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate immutable request and read-only runtime
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "${HEAD_REPO}" == "renta0426/kaggle-actions-bridge" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, ssl, urllib.request

          base = f"https://raw.githubusercontent.com/{os.environ['HEAD_REPO']}/{os.environ['HEAD_SHA']}/"
          def read(path: str, limit: int) -> bytes:
              with urllib.request.urlopen(base + path, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"source exceeds byte budget: {path}")
              return data

          request = json.loads(read("requests/cmi-flu-b1-status-v5.json", 16384))
          expected = {
              "schema_version": 1,
              "request_id": "20260902-cmi-flu-b1-status-005",
              "parent_request_id": "20260902-cmi-flu-b1-005",
              "competition": "cmi-flu-first-prediction-challenge",
              "operation": "private_kernel_status_output_verification",
              "target": "renta0426/cmi-flu-b1-anchor-single-file-20260902-005",
              "api_budget": {"max_calls": 10, "max_pages": 1},
              "side_effects": [],
          }
          if request != expected:
              raise SystemExit("status request differs from exact allowlist")

          workflow = read(".github/workflows/97-cmi-flu-b1-status-v5.yml", 200000).decode("utf-8")
          marker = "\n  verify:\n"
          if marker not in workflow:
              raise SystemExit("runtime job marker missing")
          runtime = workflow.split(marker, 1)[1]
          required = (
              "permissions: {}",
              "environment: kaggle-readonry",
              "ApiGetKernelRequest",
              "ApiListKernelSessionOutputRequest",
              "list_kernel_session_output",
              "CMI_FLU_B1_COMPLETE",
              "CMI_FLU_B1_FAILED",
              "bridge-result.json",
              "bridge-failure.json",
              "submission.csv",
              "allow_redirects=False",
              "submission_sha256",
              "request_unfinished=true",
          )
          for token in required:
              if token not in workflow:
                  raise SystemExit(f"status verifier guard missing: {token}")
          forbidden = (
              "kernels push",
              "competitions submit",
              "kernels delete",
              "datasets create",
              "models create",
              "workflow_run:",
              "pull_request_target:",
          )
          lowered_runtime = runtime.casefold()
          for token in forbidden:
              if token in lowered_runtime:
                  raise SystemExit(f"write or unsafe trigger present in runtime: {token}")
          if "actions/upload-artifact" in lowered_runtime or "actions/cache" in lowered_runtime:
              raise SystemExit("private output must not be persisted as an Actions artifact/cache")
          print("CMI_B1_STATUS_005_STATIC PASS")
          PY

  verify:
    name: Read one private-kernel status/output snapshot for request 005
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" || "${EVENT_NAME_VALUE}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/97-cmi-flu-b1-status-v5.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "PROTECTED_CMI_B1_STATUS_005 PASS"

      - name: Validate exact request and prepare locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import json, os, pathlib, re, ssl, sys, urllib.request

          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA_VALUE']}/"
          def read(path: str, limit: int) -> bytes:
              with urllib.request.urlopen(base + path, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          request = json.loads(read(os.environ["REQUEST_PATH"], 16384))
          expected = {
              "schema_version": 1,
              "request_id": "20260902-cmi-flu-b1-status-005",
              "parent_request_id": "20260902-cmi-flu-b1-005",
              "competition": "cmi-flu-first-prediction-challenge",
              "operation": "private_kernel_status_output_verification",
              "target": "renta0426/cmi-flu-b1-anchor-single-file-20260902-005",
              "api_budget": {"max_calls": 10, "max_pages": 1},
              "side_effects": [],
          }
          if request != expected:
              raise SystemExit("status request differs from exact allowlist")
          lock = read(os.environ["LOCK_RELATIVE_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F "2.2.4" >/dev/null

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Read metadata, terminal markers, and allowlisted output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import os
          import pathlib
          from urllib.parse import urlparse

          import requests
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import (
              ApiGetKernelRequest,
              ApiListKernelSessionOutputRequest,
          )

          owner = os.environ["TARGET_OWNER"]
          slug = os.environ["TARGET_SLUG"]
          target = os.environ["TARGET_KERNEL"]
          root = pathlib.Path(os.environ["WORKDIR"])
          output_dir = root / "output"
          output_dir.mkdir(parents=True, exist_ok=True)

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          names = {
              str((page.to_dict() if hasattr(page, "to_dict") else dict(page)).get("name") or "").strip().lower()
              for page in pages
          }
          if "rules" not in names or "evaluation" not in names or not any("data" in name for name in names):
              raise SystemExit("live Competition policy pages unavailable")

          discovered = api.kernels_list(user=owner, search=slug, page_size=5) or []
          refs = [str(getattr(item, "ref", "")) for item in discovered]
          exact = [ref for ref in refs if ref == target]
          print(f"CMI_B1_005_DISCOVERY exact={len(exact)} candidates={len(refs)}")
          if len(exact) != 1:
              raise SystemExit("exact private kernel was not discoverable once")

          with api.build_kaggle_client() as client:
              get_request = ApiGetKernelRequest()
              get_request.user_name = owner
              get_request.kernel_slug = slug
              kernel = client.kernels.kernels_api_client.get_kernel(get_request)
              metadata = kernel.metadata
              if str(metadata.ref) != target or not bool(metadata.is_private):
                  raise SystemExit("private kernel metadata identity mismatch")
              version = int(metadata.current_version_number or 0)
              if version != 1:
                  raise SystemExit(f"unexpected request-005 kernel version: {version}")
              print("CMI_B1_005_METADATA PASS version=1 is_private=true")

              output_request = ApiListKernelSessionOutputRequest()
              output_request.user_name = owner
              output_request.kernel_slug = slug
              output_request.version_label = str(version)
              output_request.page_size = 20
              response = client.kernels.kernels_api_client.list_kernel_session_output(output_request)

          status_hint = "unavailable"
          try:
              status_hint = str(getattr(api.kernels_status(target), "status", "") or "unknown").casefold()
          except Exception:
              status_hint = "unavailable"
          if len(status_hint) > 80:
              status_hint = "invalid"

          log = str(response.log or "")
          log_bytes = log.encode("utf-8", errors="replace")
          if len(log_bytes) > 2_000_000:
              raise SystemExit("private kernel log exceeds fixed byte budget")
          complete_marker = "CMI_FLU_B1_COMPLETE" in log
          failed_marker = "CMI_FLU_B1_FAILED" in log
          if complete_marker and failed_marker:
              raise SystemExit("private kernel log contains conflicting terminal markers")
          print(
              "CMI_B1_005_LOG "
              f"bytes={len(log_bytes)} sha256={hashlib.sha256(log_bytes).hexdigest()} "
              f"status_hint={status_hint} complete_marker={str(complete_marker).lower()} "
              f"failed_marker={str(failed_marker).lower()}"
          )

          allowed_names = {"bridge-result.json", "bridge-failure.json", "summary.md", "submission.csv"}
          returned = list(response.files or [])
          allowlisted: dict[str, str] = {}
          for item in returned:
              name = pathlib.PurePosixPath(str(item.file_name or "")).name
              if name in allowed_names:
                  if name in allowlisted:
                      raise SystemExit(f"duplicate allowlisted output: {name}")
                  allowlisted[name] = str(item.url or "")
          print(
              "CMI_B1_005_OUTPUT_LIST "
              f"total={len(returned)} allowlisted={','.join(sorted(allowlisted)) or 'none'}"
          )

          limits = {
              "bridge-result.json": 131072,
              "bridge-failure.json": 32768,
              "summary.md": 131072,
              "submission.csv": 131072,
          }
          session = requests.Session()
          session.trust_env = False
          for name, url in allowlisted.items():
              parsed = urlparse(url)
              host = (parsed.hostname or "").casefold()
              host_ok = (
                  host == "storage.googleapis.com"
                  or host.endswith(".storage.googleapis.com")
                  or host.endswith(".googleusercontent.com")
                  or host.endswith(".kaggleusercontent.com")
              )
              if parsed.scheme != "https" or not host_ok:
                  raise SystemExit(f"unexpected signed-output host for {name}")
              downloaded = session.get(url, stream=True, timeout=60, allow_redirects=False)
              if downloaded.status_code != 200:
                  raise SystemExit(f"signed-output download failed for {name}: status={downloaded.status_code}")
              data = downloaded.content
              if len(data) > limits[name]:
                  raise SystemExit(f"allowlisted output exceeds byte budget: {name}")
              (output_dir / name).write_bytes(data)

          files = {path.name: path for path in output_dir.iterdir() if path.is_file()}
          success_set = {"bridge-result.json", "summary.md", "submission.csv"}
          if complete_marker or success_set.issubset(files):
              if set(files) != success_set:
                  raise SystemExit(f"complete B1 output set mismatch: {sorted(files)}")
              meta = json.loads(files["bridge-result.json"].read_text(encoding="utf-8"))
              if meta.get("schema_version") != 2 or meta.get("request_id") != "20260902-cmi-flu-b1-005":
                  raise SystemExit("B1 result identity mismatch")
              if meta.get("competition") != "cmi-flu-first-prediction-challenge":
                  raise SystemExit("B1 result competition mismatch")
              if meta.get("kernel_stage") != "b1_anchor" or meta.get("implementation") != "standalone_equivalent":
                  raise SystemExit("B1 implementation/stage mismatch")
              if meta.get("cmi_commit") != "6362cd8596cd996d13f66615eb1833ad26af1b39":
                  raise SystemExit("CMI source contract mismatch")
              if meta.get("source_blobs", {}).get("run_b1_kaggle_standalone.py") != "7e28ed606f63883f9c2e230dfea1382389dce23b":
                  raise SystemExit("CMI standalone provenance mismatch")
              if meta.get("md5_verified") != {"verified": 28, "skipped_self": 1}:
                  raise SystemExit("Competition MD5 summary mismatch")
              if meta.get("audit_passed") is not True or int(meta.get("submission_rows", 0)) != 40:
                  raise SystemExit("B1 aggregate audit/submission contract failed")

              expected_audits = {
                  "Task1.1": (127, 127, 4),
                  "Task1.2": (81, 81, 3),
                  "Task1.3": (29, 29, 1),
                  "HAI_D28_challenge_overlap": (10617, 2689, 33),
                  "HAI_D28_vaccine_overlap": (1141, 903, 5),
                  "HAI_D365_challenge_overlap": (4878, 914, 8),
              }
              audits = meta.get("audit_checks", {})
              if set(audits) != set(expected_audits):
                  raise SystemExit("B1 audit task set mismatch")
              for audit_name, expected in expected_audits.items():
                  item = audits[audit_name]
                  actual = (int(item["rows"]), int(item["participants"]), int(item["studies"]))
                  if actual != expected or item.get("passed") is not True:
                      raise SystemExit(f"B1 aggregate audit mismatch: {audit_name}")
              if meta.get("derived_panel_sizes") != {"vaccine": 3, "challenge": 12}:
                  raise SystemExit("B1 HAI panel contract mismatch")
              if meta.get("minus99_tasks") != []:
                  raise SystemExit("B1 contains unexpected -99 task")
              expected_tasks = {"Task1.1", "Task1.2", "Task1.3", "Task1.4", "Task2.1", "Task2.2", "Task2.3"}
              unique = meta.get("task_unique_counts", {})
              if set(unique) != expected_tasks or any(int(value) < 2 for value in unique.values()):
                  raise SystemExit("B1 task prediction uniqueness contract failed")

              digest = hashlib.sha256(files["submission.csv"].read_bytes()).hexdigest()
              if digest != meta.get("submission_sha256"):
                  raise SystemExit("B1 submission SHA-256 mismatch")
              with files["submission.csv"].open(newline="", encoding="utf-8") as handle:
                  rows = list(csv.reader(handle))
              expected_header = ["participant_id", "Task1.1", "Task1.2", "Task1.3", "Task1.4", "Task2.1", "Task2.2", "Task2.3"]
              if len(rows) != 41 or rows[0] != expected_header:
                  raise SystemExit("B1 submission shape/header mismatch")
              print(
                  "CMI_B1_005_OUTPUT_VERIFIED "
                  f"submission_sha256={digest} rows=40 "
                  f"direction11={meta.get('task_directions', {}).get('Task1.1')} "
                  f"python={meta.get('python_version')}"
              )
              for audit_name in sorted(audits):
                  item = audits[audit_name]
                  print(
                      "CMI_B1_005_AUDIT "
                      f"name={audit_name} rows={item['rows']} participants={item['participants']} "
                      f"studies={item['studies']} passed={item['passed']}"
                  )
              raise SystemExit(0)

          if failed_marker or "bridge-failure.json" in files:
              if set(files) != {"bridge-failure.json"}:
                  raise SystemExit(f"failed B1 output set mismatch: {sorted(files)}")
              failure = json.loads(files["bridge-failure.json"].read_text(encoding="utf-8"))
              expected_keys = {"schema_version", "request_id", "competition", "cmi_commit", "stage", "exception_type", "error_code"}
              if set(failure) != expected_keys:
                  raise SystemExit("B1 failure manifest schema mismatch")
              if failure.get("request_id") != "20260902-cmi-flu-b1-005" or failure.get("competition") != "cmi-flu-first-prediction-challenge":
                  raise SystemExit("B1 failure manifest identity mismatch")
              safe_stages = {
                  "runtime_packages",
                  "locate_competition_data",
                  "verify_md5",
                  "load_required_tables",
                  "derive_hai_panels",
                  "aggregate_audits",
                  "build_anchor_predictions",
                  "build_submission",
                  "finalize_outputs",
              }
              if failure.get("stage") not in safe_stages:
                  raise SystemExit("B1 failure stage outside allowlist")
              print(
                  "CMI_B1_005_FAILURE "
                  f"stage={failure['stage']} exception_type={failure['exception_type']} "
                  f"error_code={failure['error_code']}"
              )
              raise SystemExit(2)

          terminal_status = any(token in status_hint for token in ("error", "fail", "cancel", "complete"))
          if terminal_status:
              raise SystemExit(f"terminal kernel status without verified terminal output: {status_hint}")
          print(
              "CMI_B1_005_NOT_TERMINAL "
              f"status_hint={status_hint} request_unfinished=true outputs={','.join(sorted(files)) or 'none'}"
          )
          PY

      - name: Cleanup runner-local private output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "Runner-local CMI-Flu request-005 status/output content removed"
