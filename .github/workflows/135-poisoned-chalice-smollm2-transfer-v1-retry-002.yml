name: Poisoned Chalice SmolLM2 transfer v1 operational retry 002

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-smollm2-transfer-v1-retry-002.json
      - scripts/poisoned_chalice_smollm2_retry_v2.py
      - .github/workflows/135-poisoned-chalice-smollm2-transfer-v1-retry-002.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-smollm2-transfer-v1-retry-002.json
      - scripts/poisoned_chalice_smollm2_retry_v2.py
      - .github/workflows/135-poisoned-chalice-smollm2-transfer-v1-retry-002.yml

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-smollm2-transfer-v1-retry-002.json
  COORDINATOR_PATH: scripts/poisoned_chalice_smollm2_retry_v2.py
  COORDINATOR_BLOB_SHA: 921de6c4627454836c0066f535e740ba0655d9d3
  LAUNCHER_PATH: scripts/poisoned_chalice_smollm2_launch_v1.py
  LAUNCHER_BLOB_SHA: 9102feab89f1543c85546d69cd45eb54490cba63
  MATERIALIZER_PATH: scripts/poisoned_chalice_smollm2_private_materializer.py
  MATERIALIZER_BLOB_SHA: 4c561d2cd852cdd8879a35c0fd9dfbb457e6760d
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate frozen SmolLM2 retry 002 without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free boundary and fetch exact source
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${source_sha}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          echo 'SMOLLM2_RETRY_SECRET_FREE_BOUNDARY PASS request=002'

      - name: Verify immutable bridge pins and retry contract
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          python3 - "${repo}" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          pins = {
              "scripts/poisoned_chalice_smollm2_retry_v2.py": "921de6c4627454836c0066f535e740ba0655d9d3",
              "scripts/poisoned_chalice_smollm2_launch_v1.py": "9102feab89f1543c85546d69cd45eb54490cba63",
              "scripts/poisoned_chalice_smollm2_private_materializer.py": "4c561d2cd852cdd8879a35c0fd9dfbb457e6760d",
          }
          for relative, expected in pins.items():
              data = (root / relative).read_bytes()
              observed = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + b"\0" + data
              ).hexdigest()
              if observed != expected:
                  raise SystemExit(f"Git blob mismatch: {relative} {observed}")
              compile(data, relative, "exec")
          PY
          python3 "${repo}/${COORDINATOR_PATH}" \
            --static \
            --request "${repo}/${REQUEST_PATH}" \
            --coordinator "${repo}/${COORDINATOR_PATH}" \
            --launcher "${repo}/${LAUNCHER_PATH}" \
            --materializer "${repo}/${MATERIALIZER_PATH}"
          rm -rf "${WORKDIR}"

  launch:
    name: Materialize frozen source and launch one SmolLM2 T4 retry
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected retry boundary and fetch exact main commit
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/135-poisoned-chalice-smollm2-transfer-v1-retry-002.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${workdir}/kernel" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${EVENT_SHA}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          echo 'PROTECTED_SMOLLM2_RETRY_BOUNDARY PASS request=002 write_calls=1 retries=0'

      - name: Prepare pinned bridge sources and isolated clients
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          python3 - "${repo}" <<'PY'
          import hashlib, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          pins = {
              "scripts/poisoned_chalice_smollm2_retry_v2.py": "921de6c4627454836c0066f535e740ba0655d9d3",
              "scripts/poisoned_chalice_smollm2_launch_v1.py": "9102feab89f1543c85546d69cd45eb54490cba63",
              "scripts/poisoned_chalice_smollm2_private_materializer.py": "4c561d2cd852cdd8879a35c0fd9dfbb457e6760d",
          }
          for relative, expected in pins.items():
              data = (root / relative).read_bytes()
              observed = hashlib.sha1(
                  b"blob " + str(len(data)).encode("ascii") + b"\0" + data
              ).hexdigest()
              if observed != expected:
                  raise SystemExit(f"Git blob mismatch: {relative} {observed}")
              compile(data, relative, "exec")
          PY
          python3 "${repo}/${COORDINATOR_PATH}" \
            --static \
            --request "${repo}/${REQUEST_PATH}" \
            --coordinator "${repo}/${COORDINATOR_PATH}" \
            --launcher "${repo}/${LAUNCHER_PATH}" \
            --materializer "${repo}/${MATERIALIZER_PATH}"
          python3 -m venv "${WORKDIR}/build-venv"
          "${WORKDIR}/build-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            pandas==2.3.2 pyarrow==21.0.0 nbformat==5.10.4 >/dev/null
          "${WORKDIR}/build-venv/bin/python" -m pip check >/dev/null
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${repo}/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'SMOLLM2_RETRY_ISOLATED_CLIENTS PASS'

      - name: Materialize five frozen private research files before Kaggle credentials
        shell: bash
        env:
          RESEARCH_REPO_READ_TOKEN: ${{ secrets.RESEARCH_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${RESEARCH_REPO_READ_TOKEN}" ]] || {
            echo 'RESEARCH_REPO_READ_TOKEN is missing from kaggle-readonry';
            exit 1;
          }
          repo="${WORKDIR}/repo"
          "${WORKDIR}/build-venv/bin/python" "${repo}/${COORDINATOR_PATH}" \
            --materialize \
            --request "${repo}/${REQUEST_PATH}" \
            --coordinator "${repo}/${COORDINATOR_PATH}" \
            --launcher "${repo}/${LAUNCHER_PATH}" \
            --materializer "${repo}/${MATERIALIZER_PATH}" \
            --work-root "${WORKDIR}/private-build" \
            --bundle-root "${KERNEL_DIR}"
          unset RESEARCH_REPO_READ_TOKEN
          echo 'SMOLLM2_RETRY_PRIVATE_SOURCE_READY PASS token_child_inheritance=false'

      - name: Revalidate label-free bundle without credentials
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 "${repo}/${COORDINATOR_PATH}" \
            --validate-bundle \
            --request "${repo}/${REQUEST_PATH}" \
            --coordinator "${repo}/${COORDINATOR_PATH}" \
            --launcher "${repo}/${LAUNCHER_PATH}" \
            --materializer "${repo}/${MATERIALIZER_PATH}" \
            --bundle-root "${KERNEL_DIR}"

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              request = urllib.request.Request(
                  url, headers={"User-Agent": "kaggle-actions-bridge/1"}
              )
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Live-preflight and launch frozen SmolLM2 request 002 exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          repo="${WORKDIR}/repo"
          "${WORKDIR}/kaggle-venv/bin/python" "${repo}/${COORDINATOR_PATH}" \
            --execute \
            --request "${repo}/${REQUEST_PATH}" \
            --coordinator "${repo}/${COORDINATOR_PATH}" \
            --launcher "${repo}/${LAUNCHER_PATH}" \
            --materializer "${repo}/${MATERIALIZER_PATH}" \
            --bundle-root "${KERNEL_DIR}" \
            --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle"

      - name: Cleanup all runner-local private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'SMOLLM2_RETRY_RUNNER_LOCAL_PRIVATE_MATERIAL_REMOVED retention_days=0'
