name: Poisoned Chalice SmolLM2 transfer v1 guarded GPU launch

on:
  push:
    branches:
      - main
      - feature/poisoned-chalice-smollm2-transfer-v1
    paths:
      - requests/poisoned-chalice-smollm2-transfer-v1-launch.json
      - scripts/poisoned_chalice_smollm2_private_materializer.py
      - scripts/poisoned_chalice_smollm2_launch_v1.py
      - .github/workflows/125-poisoned-chalice-smollm2-transfer-v1-launch.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-smollm2-transfer-v1-launch.json
      - scripts/poisoned_chalice_smollm2_private_materializer.py
      - scripts/poisoned_chalice_smollm2_launch_v1.py
      - .github/workflows/125-poisoned-chalice-smollm2-transfer-v1-launch.yml

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-smollm2-transfer-v1-launch.json
  MATERIALIZER_PATH: scripts/poisoned_chalice_smollm2_private_materializer.py
  LAUNCHER_PATH: scripts/poisoned_chalice_smollm2_launch_v1.py
  WORKFLOW_PATH: .github/workflows/125-poisoned-chalice-smollm2-transfer-v1-launch.yml
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate SmolLM2 request 001 without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free GitHub-hosted boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          echo 'SMOLLM2_BRIDGE_SECRET_FREE_BOUNDARY PASS'

      - name: Fetch exact event files and run static validation
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          from __future__ import annotations
          import ast
          import json
          import pathlib
          import ssl
          import sys
          import urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-smollm2-transfer-v1-launch.json": 32768,
              "scripts/poisoned_chalice_smollm2_private_materializer.py": 131072,
              "scripts/poisoned_chalice_smollm2_launch_v1.py": 131072,
          }
          context = ssl.create_default_context()
          for path, limit in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          request = json.loads((root / "requests/poisoned-chalice-smollm2-transfer-v1-launch.json").read_text())
          expected_keys = {
              "schema_version", "request_id", "competition", "operation", "target",
              "private_materializer_path", "private_materializer_blob_sha",
              "launcher_path", "launcher_blob_sha", "research_repository",
              "research_commit", "research_files", "target_model_id",
              "target_model_revision", "resource", "api_budget", "side_effects",
              "automatic_compute_retries", "enable_internet", "competition_submission",
              "select_as_final", "runner_local_private_material_retention_days",
              "clean_room",
          }
          if set(request) != expected_keys:
              raise SystemExit("SmolLM2 request field allowlist changed")
          if request["request_id"] != "20260903-poisoned-chalice-smollm2-transfer-v1-001":
              raise SystemExit("SmolLM2 request ID changed")
          if request["research_commit"] != "253806607ddec32364c89c39dd6f946599085868":
              raise SystemExit("SmolLM2 research commit changed")
          if request["target_model_revision"] != "effd688a12921b4cc83e3312b6feb579f70f9c71":
              raise SystemExit("SmolLM2 target revision changed")

          materializer = (root / "scripts/poisoned_chalice_smollm2_private_materializer.py").read_text()
          tree = ast.parse(materializer)
          if 'TOKEN_ENV = "RESEARCH_REPO_READ_TOKEN"' not in materializer:
              raise SystemExit("private-source token boundary changed")
          if 'token = os.environ.pop(TOKEN_ENV, "")' not in materializer:
              raise SystemExit("private-source token is not removed before build")
          if 'parsed.hostname != "api.github.com"' not in materializer:
              raise SystemExit("private-source API origin guard missing")
          if '"Authorization": f"Bearer {token}"' not in materializer:
              raise SystemExit("private-source authorization header missing")
          if "KAGGLE_API_TOKEN" in materializer or "kernels push" in materializer or "competitions submit" in materializer:
              raise SystemExit("private materializer gained Kaggle capability")
          subprocess_calls = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Call)
              and isinstance(node.func, ast.Attribute)
              and isinstance(node.func.value, ast.Name)
              and node.func.value.id == "subprocess"
              and node.func.attr == "run"
          ]
          if len(subprocess_calls) != 1:
              raise SystemExit("private materializer subprocess count changed")
          print('SMOLLM2_BRIDGE_SOURCE_STATIC PASS private_files=5 kaggle_writes=0')
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --materializer "${workdir}/${MATERIALIZER_PATH}"

  launch:
    name: Materialize private source and launch exactly one SmolLM2 T4 run
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/125-poisoned-chalice-smollm2-transfer-v1-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo 'PROTECTED_SMOLLM2_BOUNDARY PASS request=001 write_calls=1 retries=0'

      - name: Prepare exact bridge sources and isolated clients
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${workdir}/kernel" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import re
          import ssl
          import sys
          import urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-smollm2-transfer-v1-launch.json": 32768,
              "scripts/poisoned_chalice_smollm2_private_materializer.py": 131072,
              "scripts/poisoned_chalice_smollm2_launch_v1.py": 131072,
              "requirements/kaggle-2.2.4.lock": 65536,
          }
          context = ssl.create_default_context()
          for path, limit in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          request = json.loads((root / "requests/poisoned-chalice-smollm2-transfer-v1-launch.json").read_text())
          for path_key, blob_key in (
              ("private_materializer_path", "private_materializer_blob_sha"),
              ("launcher_path", "launcher_blob_sha"),
          ):
              data = (root / request[path_key]).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != request[blob_key]:
                  raise SystemExit(f"bridge Git blob mismatch: {path_key}")
          lock = (root / "requirements/kaggle-2.2.4.lock").read_text(encoding="utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --materializer "${workdir}/${MATERIALIZER_PATH}"

          python3 -m venv "${workdir}/build-venv"
          "${workdir}/build-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            pandas==2.3.2 pyarrow==21.0.0 nbformat==5.10.4 >/dev/null
          "${workdir}/build-venv/bin/python" -m pip check >/dev/null

          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${workdir}/requirements/kaggle-2.2.4.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'SMOLLM2_ISOLATED_CLIENTS PASS'

      - name: Materialize five private research files without Kaggle credentials
        shell: bash
        env:
          RESEARCH_REPO_READ_TOKEN: ${{ secrets.RESEARCH_REPO_READ_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/build-venv/bin/python" "${WORKDIR}/${MATERIALIZER_PATH}" \
            --request "${WORKDIR}/${REQUEST_PATH}" \
            --work-root "${WORKDIR}/private-build" \
            --bundle-root "${KERNEL_DIR}"
          unset RESEARCH_REPO_READ_TOKEN
          echo 'SMOLLM2_PRIVATE_SOURCE_MATERIALIZED PASS files=5 token_child_inheritance=false'

      - name: Revalidate runner-local label-free kernel bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${KERNEL_DIR}" <<'PY'
          from __future__ import annotations
          import ast
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          files = sorted(path.name for path in root.iterdir() if path.is_file())
          if files != ["kernel-metadata.json", "smollm2-transfer-v1.ipynb"]:
              raise SystemExit(f"runner-local SmolLM2 bundle allowlist mismatch: {files}")
          notebook = json.loads((root / "smollm2-transfer-v1.ipynb").read_text(encoding="utf-8"))
          if len(notebook.get("cells", [])) != 8:
              raise SystemExit("runner-local SmolLM2 cell count changed")
          records = None
          for cell in notebook["cells"]:
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              source = "".join(source) if isinstance(source, list) else str(source)
              if "PREDICTION_MANIFEST = pd.DataFrame(" not in source:
                  continue
              for node in ast.parse(source).body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == "PREDICTION_MANIFEST"
                      for target in node.targets
                  ):
                      records = ast.literal_eval(node.value.args[0])
          allowed = {"sample_id", "content_sha256", "language", "sample_index"}
          if not isinstance(records, list) or len(records) != 2000:
              raise SystemExit("runner-local SmolLM2 row count changed")
          if any(set(row) != allowed for row in records):
              raise SystemExit("label or unexpected field crossed runner-local prediction boundary")
          metadata = json.loads((root / "kernel-metadata.json").read_text(encoding="utf-8"))
          if metadata.get("id") != "renta0426/smollm2-transfer-v1":
              raise SystemExit("runner-local target changed")
          if metadata.get("machine_shape") != "NvidiaTeslaT4" or not metadata.get("enable_gpu") or metadata.get("enable_tpu"):
              raise SystemExit("runner-local accelerator contract changed")
          print('SMOLLM2_RUNNER_LOCAL_BUNDLE PASS rows=2000 labels=false')
          PY

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl
          import urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Live-preflight and launch request 001 exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" "${WORKDIR}/${LAUNCHER_PATH}" \
            --execute \
            --request "${WORKDIR}/${REQUEST_PATH}" \
            --launcher "${WORKDIR}/${LAUNCHER_PATH}" \
            --materializer "${WORKDIR}/${MATERIALIZER_PATH}" \
            --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle" \
            --kernel-dir "${KERNEL_DIR}"

      - name: Cleanup all runner-local private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'SMOLLM2_RUNNER_LOCAL_PRIVATE_MATERIAL_REMOVED retention_days=0'
