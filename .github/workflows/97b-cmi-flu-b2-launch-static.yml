name: CMI-Flu B2 launch guardrail validation

on:
  push:
    branches:
      - ops/cmi-flu-b2-001
    paths:
      - .github/workflows/97b-cmi-flu-b2-launch-static.yml
      - .github/workflows/98-cmi-flu-b2-launch.yml
      - requests/cmi-flu-b2-launch-v1.json
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/97b-cmi-flu-b2-launch-static.yml
      - .github/workflows/98-cmi-flu-b2-launch.yml
      - requests/cmi-flu-b2-launch-v1.json

permissions: {}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out secret-free validation tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate protected launch semantics without secrets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import pathlib

          path = pathlib.Path('.github/workflows/98-cmi-flu-b2-launch.yml')
          workflow = path.read_text(encoding='utf-8')
          required = (
              'permissions: {}',
              'group: kaggle-resource-global',
              'queue: max',
              'environment: kaggle-readonry',
              'workflow_dispatch:',
              'TARGET_KERNEL: renta0426/cmi-flu-b2-taskwise-compact-20260903-001',
              'EXPECTED_SOURCE_SHA256: a039b56868e5f9e2f10ae8016466a02fe4a6e5342854487ca6c6a198a21abd5e',
              'REQUESTED_ACCELERATOR: cpu',
              'enable_gpu": False',
              'enable_tpu": False',
              'enable_internet": False',
              'competition_sources": [os.environ["TARGET_COMPETITION"]]',
              'automatic_compute_retries=0',
              '--timeout 14400',
              'CMI_FLU_B2_LAUNCH PASS',
              'CMI_FLU_B2_DEFERRED',
              'target kernel already exists; duplicate refused',
              'maximum of five (5) submissions per day',
              'mean spearman correlation',
              'sample_submission_part1.csv',
          )
          for token in required:
              if token not in workflow:
                  raise SystemExit(f'B2 launch guard missing: {token}')

          forbidden = (
              'competitions submit',
              'kernels delete',
              'datasets create',
              'datasets version',
              'models create',
              'enable_gpu": True',
              'enable_tpu": True',
              'enable_internet": True',
              '--follow',
          )
          lowered = workflow.lower()
          for token in forbidden:
              if token.lower() in lowered:
                  raise SystemExit(f'forbidden B2 launch capability present: {token}')

          executable = [
              line.strip()
              for line in workflow.splitlines()
              if '"${WORKDIR}/venv/bin/kaggle" kernels push ' in line
          ]
          if len(executable) != 1:
              raise SystemExit(f'expected exactly one executable kernels push, found {len(executable)}')
          if workflow.count('KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}') != 2:
              raise SystemExit('Kaggle token must be scoped to exactly the admission and push steps')
          if workflow.count('if: steps.admission.outputs.can_launch == \'true\'') != 1:
              raise SystemExit('Kaggle push must have one admission condition')
          if workflow.count('if: steps.admission.outputs.can_launch != \'true\'') != 1:
              raise SystemExit('deferred admission branch must occur exactly once')
          if 'pull_request:' in workflow:
              raise SystemExit('secret-bearing launch workflow must not run on pull_request')
          print('CMI_FLU_B2_LAUNCH_STATIC PASS')
          PY
