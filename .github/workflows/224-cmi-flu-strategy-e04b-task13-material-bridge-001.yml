name: CMI-Flu strategy E04b Task1.3 material bridge CPU 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/224-cmi-flu-strategy-e04b-task13-material-bridge-001.yml
      - requests/cmi-flu-strategy-e04b-task13-material-bridge-001.json
      - scripts/cmi_flu_strategy_e04b_prepare.py
      - scripts/cmi_flu_strategy_e04b_prepare_v2.py
      - scripts/cmi_flu_strategy_e04b_execute.py
      - scripts/cmi_flu_strategy_e04b_sanitize.py
      - payloads/cmi-flu-strategy-e04b-task13-material-bridge-001/**
  pull_request:
    paths:
      - .github/workflows/224-cmi-flu-strategy-e04b-task13-material-bridge-001.yml
      - requests/cmi-flu-strategy-e04b-task13-material-bridge-001.json
      - scripts/cmi_flu_strategy_e04b_prepare.py
      - scripts/cmi_flu_strategy_e04b_prepare_v2.py
      - scripts/cmi_flu_strategy_e04b_execute.py
      - scripts/cmi_flu_strategy_e04b_sanitize.py
      - payloads/cmi-flu-strategy-e04b-task13-material-bridge-001/**

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260909-cmi-flu-strategy-e04b-task13-material-bridge-001
  SCIENCE_COMMIT: cc51692a66055ed1716fd6d66ac574c4a22f0dcc
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate exact E04b runtime on synthetic data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done
      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e04b-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
      - name: Install E04b synthetic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
      - name: Build exact science runtime and execute synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_prepare_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_sanitize.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_prepare_v2.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          mkdir "${WORKDIR}/synthetic"
          python3 "${WORKDIR}/runtime.py" --synthetic --output-dir "${WORKDIR}/synthetic"
          python3 - "${WORKDIR}/synthetic" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); assert sorted(p.name for p in root.iterdir())==['bridge-result.json','metrics.json','summary.md']
          b=json.loads((root/'bridge-result.json').read_text()); m=json.loads((root/'metrics.json').read_text())
          assert b['synthetic'] is True and b['science_commit']=='cc51692a66055ed1716fd6d66ac574c4a22f0dcc'
          assert b['strategy_e04b_blob_sha']=='72f936a7248dfa17338932077d17fb43123cb056'
          assert b['strategy_e04b_synthetic_blob_sha']=='6f3c081ea47a0562150398ab307ab1a6b4d4c000'
          assert m['experiment']=='strategy_v2_e04b_task13_material_plural_bridge' and m['task']=='Task1.3'
          assert m['ontology_version']=='e04b_task13_material_plural_v1'
          assert m['ontology_change']['changed_rows_by_split']=={'challenge':36,'historical':0}
          assert m['ontology_change']['non_asc_rows_changed']==0
          assert m['measurement_audit']['selected_auxiliary_count']==0
          t=m['e04b_transfer_audit']; assert t['measurement_bridge_recovered'] is True and t['real_preconditions'] is None
          assert t['baseline_compatible_2024UGA_subjects']==15 and t['baseline_compatible_2025LJI_subjects']==12
          assert t['supervised_strict_source_subjects']==[15,15] and t['challenge_correction_rows']==[12,12]
          assert m['e04b_decision']['public_probe_authorized'] is False
          text=(root/'metrics.json').read_text(); assert '"participant_id"' not in text and '"subject_group"' not in text and 'SYN_ONLY_' not in text
          PY
          ! grep -R -E 'kaggle[[:space:]]+competitions[[:space:]]+submit|competition_submit\(' "${WORKDIR}/runtime.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_"* >/dev/null
          echo CMI_FLU_E04B_VALIDATE_PASS
      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  launch:
    name: Run one private CPU E04b and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/224-cmi-flu-strategy-e04b-task13-material-bridge-001.yml@refs/heads/main" ]]
      - name: Materialize exact bridge commit and build runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e04b-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e04b_prepare_v2.py" --repository-root "${workdir}/bridge" --output "${workdir}/runtime.py"
          python3 "${workdir}/runtime.py" --self-test
      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"
      - name: Run one approved E04b CPU kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_execute.py" --runtime "${WORKDIR}/runtime.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"
      - name: Validate aggregate-only E04b result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04b_sanitize.py" --input-dir "${WORKDIR}/output"
      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
