name: Poisoned Chalice Stage1 length-interaction CPU launch

on:
  push:
    branches:
      - main
      - ops/poisoned-chalice-stage1-length-submit-001
    paths:
      - requests/poisoned-chalice-stage1-length-interactions-run-001.json
      - scripts/poisoned_chalice_stage1_length_interaction_builder.py
      - scripts/poisoned_chalice_stage1_length_interaction_launch.py
      - .github/workflows/129-poisoned-chalice-stage1-length-interactions-launch.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-stage1-length-interactions-run-001.json
      - scripts/poisoned_chalice_stage1_length_interaction_builder.py
      - scripts/poisoned_chalice_stage1_length_interaction_launch.py
      - .github/workflows/129-poisoned-chalice-stage1-length-interactions-launch.yml

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-length-interactions-run-001.json
  BUILDER_PATH: scripts/poisoned_chalice_stage1_length_interaction_builder.py
  LAUNCHER_PATH: scripts/poisoned_chalice_stage1_length_interaction_launch.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate frozen Stage1 request 001 without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "pull_request" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY RESEARCH_REPO_READ_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          echo 'STAGE1_LENGTH_INTERACTION_SECRET_FREE_BOUNDARY PASS'

      - name: Fetch exact event sources, validate pins, and build bundle
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-stage1-length-interactions-run-001.json": 32768,
              "scripts/poisoned_chalice_stage1_length_interaction_builder.py": 131072,
              "scripts/poisoned_chalice_stage1_length_interaction_launch.py": 131072,
          }
          context = ssl.create_default_context()
          for path, limit in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          req = json.loads((root / "requests/poisoned-chalice-stage1-length-interactions-run-001.json").read_text())
          for path_key, blob_key in (
              ("builder_script_path", "builder_blob_sha"),
              ("launcher_script_path", "launcher_blob_sha"),
          ):
              data = (root / req[path_key]).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              if blob != req[blob_key]:
                  raise SystemExit(f"Git blob mismatch: {path_key}")
              compile(data, req[path_key], "exec")
          print('STAGE1_LENGTH_INTERACTION_SOURCE_PINS PASS')
          PY

          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --builder "${workdir}/${BUILDER_PATH}"
          mkdir -p "${workdir}/kernel"
          python3 "${workdir}/${BUILDER_PATH}" \
            --output-dir "${workdir}/kernel" \
            --builder-blob-sha a10c7a76be1a4d700d7b1d9846e42348c5711651 >/dev/null
          python3 - "${workdir}/kernel" <<'PY'
          from __future__ import annotations
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if sorted(path.name for path in root.iterdir()) != [
              "kernel-metadata.json", "stage1-length-interactions-v1.ipynb"
          ]:
              raise SystemExit("generated bundle allowlist changed")
          metadata = json.loads((root / "kernel-metadata.json").read_text())
          expected = {
              "id": "renta0426/stage1-length-interactions-v1",
              "enable_gpu": False,
              "enable_tpu": False,
              "enable_internet": False,
              "is_private": True,
              "dataset_sources": ["renta0426/stage1-raw-fim-submission-v1-output"],
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"generated metadata changed: {key}")
          notebook = json.loads((root / "stage1-length-interactions-v1.ipynb").read_text())
          code = "\n".join(
              "".join(cell.get("source", "")) if isinstance(cell.get("source", ""), list)
              else str(cell.get("source", ""))
              for cell in notebook.get("cells", []) if cell.get("cell_type") == "code"
          )
          for marker in (
              'METHOD = "plus_length_interactions_v1"',
              "EXPECTED_MODEL_FEATURES = 523",
              "EXPECTED_OOF_AUC = 0.68013844",
              '"validation_labels_read": False',
              '"validation_membership_read": False',
          ):
              if marker not in code:
                  raise SystemExit(f"generated notebook invariant missing: {marker}")
          for forbidden in ("KAGGLE_API_TOKEN", "competitions submit", "kernels push"):
              if forbidden in code:
                  raise SystemExit(f"generated notebook gained forbidden capability: {forbidden}")
          compile(code, "stage1-length-interactions-v1.ipynb", "exec")
          print('STAGE1_LENGTH_INTERACTION_BUNDLE_STATIC PASS model_features=523 submission_inside=false')
          PY

  launch:
    name: Launch exactly one frozen Stage1 CPU Notebook
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-cpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/129-poisoned-chalice-stage1-length-interactions-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo 'PROTECTED_STAGE1_LENGTH_INTERACTION_BOUNDARY PASS request=001 write_calls=1 retries=0'

      - name: Prepare exact sources, bundle, and isolated Kaggle client before secret exposure
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${workdir}/kernel" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-stage1-length-interactions-run-001.json": 32768,
              "scripts/poisoned_chalice_stage1_length_interaction_builder.py": 131072,
              "scripts/poisoned_chalice_stage1_length_interaction_launch.py": 131072,
              "requirements/kaggle-2.2.4.lock": 65536,
          }
          context = ssl.create_default_context()
          for path, limit in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          req = json.loads((root / "requests/poisoned-chalice-stage1-length-interactions-run-001.json").read_text())
          for path_key, blob_key in (
              ("builder_script_path", "builder_blob_sha"),
              ("launcher_script_path", "launcher_blob_sha"),
          ):
              data = (root / req[path_key]).read_bytes()
              blob = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
              if blob != req[blob_key]:
                  raise SystemExit(f"Git blob mismatch: {path_key}")
          lock = (root / "requirements/kaggle-2.2.4.lock").read_text(encoding="utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          PY

          mkdir -p "${workdir}/kernel"
          python3 "${workdir}/${BUILDER_PATH}" \
            --output-dir "${workdir}/kernel" \
            --builder-blob-sha a10c7a76be1a4d700d7b1d9846e42348c5711651 >/dev/null
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --builder "${workdir}/${BUILDER_PATH}"

          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${workdir}/requirements/kaggle-2.2.4.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'STAGE1_LENGTH_INTERACTION_CLIENTS PASS kaggle=2.2.4'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Live-preflight and push request 001 exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" "${WORKDIR}/${LAUNCHER_PATH}" \
            --execute \
            --request "${WORKDIR}/${REQUEST_PATH}" \
            --launcher "${WORKDIR}/${LAUNCHER_PATH}" \
            --builder "${WORKDIR}/${BUILDER_PATH}" \
            --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle" \
            --kernel-dir "${KERNEL_DIR}"

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'STAGE1_LENGTH_INTERACTION_RUNNER_MATERIAL_REMOVED'
