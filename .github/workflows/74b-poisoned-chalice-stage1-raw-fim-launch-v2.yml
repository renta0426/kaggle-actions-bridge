name: Poisoned Chalice Stage1 raw+FIM private GPU launch v2

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-stage1-raw-fim-launch-v2.json

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-raw-fim-launch-v2.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  TARGET_KERNEL: renta0426/stage1-raw-fim-submission-v1
  SOURCE_BASE_KERNEL: renta0426/starter-plus-10k-v2-continuation
  SOURCE_FIM_KERNEL: renta0426/selective-fim-10k-v1

jobs:
  validate:
    name: Validate fixed request without secrets
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate owner boundary and request lock
        shell: bash
        env:
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, ssl, urllib.request
          from urllib.parse import urlparse

          repo = os.environ["EXPECTED_REPOSITORY"]
          sha = os.environ["EVENT_SHA"]
          base = f"https://raw.githubusercontent.com/{repo}/{sha}/"
          def fetch(path: str, limit: int) -> bytes:
              url = base + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected source origin")
              with urllib.request.urlopen(url, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit("source exceeds fixed byte budget")
              return data

          request = json.loads(fetch(os.environ["REQUEST_PATH"], 32768))
          if request.get("request_id") != "20260902-poisoned-chalice-stage1-raw-fim-003":
              raise SystemExit("request id mismatch")
          if request.get("parent_failed_request_id") != "20260902-poisoned-chalice-stage1-raw-fim-002":
              raise SystemExit("parent request mismatch")
          if request.get("competition") != os.environ["TARGET_COMPETITION"] or request.get("operation") != "kernel_run":
              raise SystemExit("competition/operation mismatch")
          if request.get("target") != os.environ["TARGET_KERNEL"]:
              raise SystemExit("target mismatch")
          if request.get("private_source_kernels") != {
              "base": os.environ["SOURCE_BASE_KERNEL"],
              "fim_structure": os.environ["SOURCE_FIM_KERNEL"],
          }:
              raise SystemExit("source allowlist mismatch")
          if request.get("automatic_compute_retries") != 0:
              raise SystemExit("automatic compute retries must remain zero")
          if request.get("resource") != {
              "accelerator": "gpu",
              "machine_shape": "NvidiaTeslaT4",
              "min_remaining_quota_hours": 5.0,
              "max_active_runs": 1,
          }:
              raise SystemExit("resource lock mismatch")
          builder = fetch(request["builder_path"], 131072)
          blob = hashlib.sha1(b"blob " + str(len(builder)).encode() + b"\0" + builder).hexdigest()
          if blob != request["builder_blob_sha"]:
              raise SystemExit("builder blob mismatch")
          print("REQUEST_003_VALIDATION PASS")
          PY

  launch:
    name: Pull private sources and launch one T4 notebook
    needs: validate
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/74b-poisoned-chalice-stage1-raw-fim-launch-v2.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_LAUNCH_V2_BOUNDARY PASS"

      - name: Prepare hash-locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          lock_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA}/${LOCK_RELATIVE_PATH}"
          python3 - "${lock_url}" "${workdir}/kaggle.lock" <<'PY'
          import re, ssl, sys, urllib.request
          from urllib.parse import urlparse
          url, output = sys.argv[1:]
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
              raise SystemExit("unexpected lock origin")
          with urllib.request.urlopen(url, timeout=30, context=ssl.create_default_context()) as response:
              data = response.read(65537)
          if len(data) > 65536:
              raise SystemExit("lock too large")
          text = data.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          open(output, "w", encoding="utf-8").write(text)
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F "2.2.4" >/dev/null
          echo "LOCKED_KAGGLE_CLI PASS"

      - name: Recheck live rules, quota, sources, and active sessions
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition rules/evaluation unavailable")
          def plain(text: str) -> str:
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", text.replace(r"\%", "%"))).casefold()
          evaluation = plain(content["evaluation"])
          if not all(term in evaluation for term in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("live evaluation contract mismatch")
          rules = plain(content["rules"])
          for phrase in (
              "external data is not allowed", "external data are not allowed",
              "internet access is prohibited", "internet must be disabled",
              "pretrained models are not allowed", "pre-trained models are not allowed",
              "gpu use is prohibited",
          ):
              if phrase in rules:
                  raise SystemExit(f"live rule conflict: {phrase}")

          quota = api.quota_view()
          gpu = getattr(quota, "gpu_quota", None)
          used = getattr(gpu, "time_used", None) if gpu is not None else None
          total = getattr(gpu, "total_time_allowed", None) if gpu is not None else None
          if used is None or total is None:
              raise SystemExit("GPU quota unavailable")
          remaining = max(0.0, (total - used).total_seconds() / 3600.0)
          if remaining < 5.0:
              raise SystemExit(f"insufficient GPU quota: {remaining:.2f}h")

          for ref in (os.environ["SOURCE_BASE_KERNEL"], os.environ["SOURCE_FIM_KERNEL"]):
              state = str(getattr(api.kernels_status(ref), "status", "")).upper()
              if "COMPLETE" not in state:
                  raise SystemExit(f"source kernel not COMPLETE: {ref}")

          target = os.environ["TARGET_KERNEL"]
          existing = api.kernels_list(user="renta0426", search="stage1-raw-fim-submission-v1", page_size=5) or []
          if target in {str(getattr(item, "ref", "")) for item in existing}:
              raise SystemExit("target kernel already exists; duplicate launch refused")
          active = []
          for item in (api.kernels_list(user="renta0426", sort_by="dateRun", page_size=10) or [])[:10]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              state = str(getattr(api.kernels_status(ref), "status", "")).upper()
              if any(token in state for token in ("RUNNING", "QUEUED", "PENDING")):
                  active.append(ref)
          if active:
              raise SystemExit(f"another Kaggle kernel is active; count={len(active)}")
          print(f"LIVE_PREFLIGHT_V2 PASS quota_remaining_hours={remaining:.2f}")
          PY

      - name: Pull the two allowlisted latest private source notebooks
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          base_dir="${WORKDIR}/source-base"
          fim_dir="${WORKDIR}/source-fim"
          mkdir -p "${base_dir}" "${fim_dir}"
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels pull "${SOURCE_BASE_KERNEL}" -p "${base_dir}" -m \
            >"${WORKDIR}/base.stdout" 2>"${WORKDIR}/base.stderr"
          base_rc=$?
          "${WORKDIR}/venv/bin/kaggle" kernels pull "${SOURCE_FIM_KERNEL}" -p "${fim_dir}" -m \
            >"${WORKDIR}/fim.stdout" 2>"${WORKDIR}/fim.stderr"
          fim_rc=$?
          set -e
          rm -f "${WORKDIR}/base.stdout" "${WORKDIR}/base.stderr" "${WORKDIR}/fim.stdout" "${WORKDIR}/fim.stderr"
          if [[ "${base_rc}" -ne 0 || "${fim_rc}" -ne 0 ]]; then
            echo "PRIVATE_SOURCE_PULL FAIL base_rc=${base_rc} fim_rc=${fim_rc} content_logged=false"
            exit 1
          fi
          "${WORKDIR}/venv/bin/python" - "${base_dir}" "${fim_dir}" <<'PY'
          import json, pathlib, sys
          expected = {
              pathlib.Path(sys.argv[1]): "renta0426/starter-plus-10k-v2-continuation",
              pathlib.Path(sys.argv[2]): "renta0426/selective-fim-10k-v1",
          }
          for root, expected_id in expected.items():
              notebooks = list(root.glob("*.ipynb"))
              metadata = list(root.glob("kernel-metadata.json"))
              if len(notebooks) != 1 or len(metadata) != 1:
                  raise SystemExit(f"unexpected source shape: {root.name}")
              if json.loads(metadata[0].read_text(encoding="utf-8")).get("id") != expected_id:
                  raise SystemExit(f"source metadata mismatch: {root.name}")
              notebook = json.loads(notebooks[0].read_text(encoding="utf-8"))
              if notebook.get("nbformat") != 4 or not notebook.get("cells"):
                  raise SystemExit(f"source notebook invalid: {root.name}")
          print("PRIVATE_SOURCE_PULL PASS notebooks=2")
          PY

      - name: Build and verify the self-contained target notebook
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"
          mkdir -p "${kernel_dir}"
          "${WORKDIR}/venv/bin/python" - "${EVENT_SHA}" "${kernel_dir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, ssl, subprocess, sys, urllib.request
          sha, kernel_dir_value = sys.argv[1:]
          kernel_dir = pathlib.Path(kernel_dir_value)
          workdir = pathlib.Path(os.environ["WORKDIR"])
          root = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{sha}/"
          request = json.loads(urllib.request.urlopen(root + os.environ["REQUEST_PATH"], timeout=30, context=ssl.create_default_context()).read(32768))
          builder = urllib.request.urlopen(root + request["builder_path"], timeout=30, context=ssl.create_default_context()).read(131073)
          if len(builder) > 131072:
              raise SystemExit("builder too large")
          blob = hashlib.sha1(b"blob " + str(len(builder)).encode() + b"\0" + builder).hexdigest()
          if blob != request["builder_blob_sha"]:
              raise SystemExit("builder blob mismatch at materialization")
          builder_path = workdir / "builder.py"
          builder_path.write_bytes(builder)
          base = list((workdir / "source-base").glob("*.ipynb"))
          fim = list((workdir / "source-fim").glob("*.ipynb"))
          if len(base) != 1 or len(fim) != 1:
              raise SystemExit("source notebook count mismatch")
          subprocess.run([
              sys.executable, str(builder_path),
              "--base-notebook", str(base[0]),
              "--fim-notebook", str(fim[0]),
              "--output-dir", str(kernel_dir),
          ], check=True, timeout=120, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          notebook_path = kernel_dir / "stage1-raw-fim-submission-v1.ipynb"
          metadata_path = kernel_dir / "kernel-metadata.json"
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          expected = {
              "id": "renta0426/stage1-raw-fim-submission-v1",
              "code_file": "stage1-raw-fim-submission-v1.ipynb",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": True,
              "machine_shape": "NvidiaTeslaT4",
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"target metadata mismatch: {key}")
          text = "\n".join("".join(cell.get("source", [])) if isinstance(cell.get("source"), list) else str(cell.get("source", "")) for cell in notebook.get("cells", []))
          for token in ("raw_plus_fim", "EXPECTED_OOF_AUC = 0.664524", "bigcode/starcoder2-3b", "hidden_validation_labels_used"):
              if token not in text:
                  raise SystemExit(f"target notebook contract missing: {token}")
          print(f"SELF_CONTAINED_TARGET_V2 PASS cells={len(notebook.get('cells', []))} bytes={notebook_path.stat().st_size}")
          PY

      - name: Push the verified private T4 notebook exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${WORKDIR}/kernel" \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "KERNEL_LAUNCH_V2 FAIL response_logged=false automatic_retries=0"
            exit 1
          fi
          echo "KERNEL_LAUNCH_V2 PASS request_id=20260902-poisoned-chalice-stage1-raw-fim-003 target=${TARGET_KERNEL} accelerator=gpu machine=NvidiaTeslaT4 automatic_retries=0"

      - name: Cleanup runner-local private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "RUNNER_LOCAL_PRIVATE_MATERIAL_REMOVED"
