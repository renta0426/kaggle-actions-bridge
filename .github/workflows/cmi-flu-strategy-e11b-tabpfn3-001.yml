name: CMI-Flu strategy E11b Task1.1 TabPFN3 CPU 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e11b-tabpfn3-001.yml
      - requests/cmi-flu-strategy-e11b-tabpfn3-001.json
      - payloads/cmi-flu-strategy-e11b-tabpfn3-001/**
      - scripts/cmi_flu_strategy_e11b_prepare.py
      - scripts/cmi_flu_strategy_e11b_prepare_v2.py
      - scripts/cmi_flu_strategy_e11b_execute.py
      - scripts/cmi_flu_strategy_e11b_sanitize.py
      - scripts/cmi_flu_strategy_e11b_validator_contract_test.py
      - scripts/cmi_flu_strategy_e11b_validator_contract_test_v2.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e11b-tabpfn3-001.yml
      - requests/cmi-flu-strategy-e11b-tabpfn3-001.json
      - payloads/cmi-flu-strategy-e11b-tabpfn3-001/**
      - scripts/cmi_flu_strategy_e11b_prepare.py
      - scripts/cmi_flu_strategy_e11b_prepare_v2.py
      - scripts/cmi_flu_strategy_e11b_execute.py
      - scripts/cmi_flu_strategy_e11b_sanitize.py
      - scripts/cmi_flu_strategy_e11b_validator_contract_test.py
      - scripts/cmi_flu_strategy_e11b_validator_contract_test_v2.py

permissions: {}

concurrency:
  group: cmi-flu-e11b-tabpfn3-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260910-cmi-flu-strategy-e11b-tabpfn3-001
  SCIENCE_COMMIT: 95c692bf2e27f6d07ea31a45fd788293666ea94a
  E11B_BLOB: 8a291ae4952786bf16ee667caa5557599310e3fd
  E11B_SYNTH_BLOB: f25d04d75db584db78d26a232ab84dc5ab1bbf7d
  TARGET_KERNEL: renta0426/cmi-flu-e11b-tabpfn3-20260910-001
  TABPFN_WHEEL_FILENAME: tabpfn-8.5.0-py3-none-any.whl
  TABPFN_WHEEL_SHA256: 4c076a019cfa5520e9c41405cecda845bdd09d909ede4a60c43839bbc83bf7a0
  TABPFN_MODEL_SOURCE: prior-labsai/tabpfn-3/pytorch/default/1
  TABPFN_CHECKPOINT_SHA256: 311ce18d97e9533d8585eaadafe040fbdd8070533209ed8696641dadc97a7301
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate exact E11b relay, wheel, runtime, synthetic and full validator
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY TABPFN_TOKEN HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11b-bridge/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Verify exact science relay and frozen request
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          def git_blob(path):
              data=path.read_bytes(); return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          payload=root/'payloads/cmi-flu-strategy-e11b-tabpfn3-001'
          assert git_blob(payload/'strategy_e11b.py')=='8a291ae4952786bf16ee667caa5557599310e3fd'
          assert git_blob(payload/'strategy_e11b_synthetic.py')=='f25d04d75db584db78d26a232ab84dc5ab1bbf7d'
          request=json.loads((root/'requests/cmi-flu-strategy-e11b-tabpfn3-001.json').read_text())
          assert request['request_id']=='20260910-cmi-flu-strategy-e11b-tabpfn3-001'
          assert request['target']=='renta0426/cmi-flu-e11b-tabpfn3-20260910-001'
          assert request['science_source_commit']=='95c692bf2e27f6d07ea31a45fd788293666ea94a'
          assert request['strategy_e11b_blob_sha']=='8a291ae4952786bf16ee667caa5557599310e3fd'
          assert request['strategy_e11b_synthetic_blob_sha']=='f25d04d75db584db78d26a232ab84dc5ab1bbf7d'
          assert request['resource']=={'accelerator':'cpu','expected_runtime_minutes':30,'hard_timeout_minutes':60,'max_active_runs':1}
          assert request['expected_kernel_version']==1 and request['enable_internet'] is False
          assert request['model_access_preflight']=={
              'required_before_kernel_write':True,
              'official_kaggle_model_source':'prior-labsai/tabpfn-3/pytorch/default/1',
              'failure_classification':'competition_input_model_access_staging',
              'write_on_failure':False,
          }
          ext=request['external_model']
          assert ext['package_version']=='8.5.0'
          assert ext['wheel_sha256']=='4c076a019cfa5520e9c41405cecda845bdd09d909ede4a60c43839bbc83bf7a0'
          assert ext['kaggle_model_source']=='prior-labsai/tabpfn-3/pytorch/default/1'
          assert ext['checkpoint_sha256']=='311ce18d97e9533d8585eaadafe040fbdd8070533209ed8696641dadc97a7301'
          assert ext['project_redistributes_weights'] is False
          c=request['experiment_contract']
          assert c['target_transform']=='log' and c['candidate']=='tabpfn3_default_cpu'
          assert c['tabpfn_params']['n_estimators']==8 and c['tabpfn_params']['device']=='cpu'
          assert c['held_outcomes_used_for_fit'] is False and c['held_outcomes_used_for_scoring'] is False
          assert request['competition_submission_attempted'] is False
          assert request['leaderboard_used_for_selection'] is False
          assert request['automatic_compute_retries']==0
          PY

      - name: Acquire exact public TabPFN wheel and verify identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORKDIR}/wheel"
          python3 -m pip download --disable-pip-version-check --no-input --no-deps --only-binary=:all: --dest "${WORKDIR}/wheel" 'tabpfn==8.5.0' >/dev/null
          python3 - "${WORKDIR}/wheel" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1]); files=[p for p in root.iterdir() if p.is_file()]
          assert len(files)==1,files
          p=files[0]
          assert p.name=='tabpfn-8.5.0-py3-none-any.whl'
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest=='4c076a019cfa5520e9c41405cecda845bdd09d909ede4a60c43839bbc83bf7a0'
          print(f'CMI_FLU_E11B_WHEEL_PASS bytes={p.stat().st_size} sha256={digest}')
          PY

      - name: Build exact E11b runtime and execute synthetic plus full-validator regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_prepare_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_sanitize.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_validator_contract_test.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_validator_contract_test_v2.py"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_prepare_v2.py" \
            --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" \
            --tabpfn-wheel "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          test ! -e "${WORKDIR}/synthetic"
          python3 "${WORKDIR}/runtime.py" --synthetic --output-dir "${WORKDIR}/synthetic"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_validator_contract_test_v2.py" --runtime "${WORKDIR}/runtime.py"
          python3 - "${WORKDIR}/runtime.py" "${WORKDIR}/synthetic" <<'PY'
          import ast,hashlib,json,pathlib,sys
          runtime=pathlib.Path(sys.argv[1]); root=pathlib.Path(sys.argv[2])
          tree=ast.parse(runtime.read_text())
          active=[]
          for node in ast.walk(tree):
              if isinstance(node,ast.Subscript) and isinstance(node.value,ast.Name) and node.value.id=='result' and isinstance(node.slice,ast.Constant) and node.slice.value=='tasks':
                  active.append((node.lineno,node.col_offset))
          assert active==[],active
          assert sorted(p.name for p in root.iterdir())==['bridge-result.json','metrics.json','summary.md']
          b=json.loads((root/'bridge-result.json').read_text()); m=json.loads((root/'metrics.json').read_text())
          assert b['synthetic'] is True and b['science_commit']=='95c692bf2e27f6d07ea31a45fd788293666ea94a'
          assert b['strategy_e11b_blob_sha']=='8a291ae4952786bf16ee667caa5557599310e3fd'
          assert b['strategy_e11b_synthetic_blob_sha']=='f25d04d75db584db78d26a232ab84dc5ab1bbf7d'
          assert b['tabpfn_package_version']=='8.5.0'
          assert b['tabpfn_wheel_sha256']=='4c076a019cfa5520e9c41405cecda845bdd09d909ede4a60c43839bbc83bf7a0'
          assert b['tabpfn_model_source']=='prior-labsai/tabpfn-3/pytorch/default/1'
          assert b['tabpfn_checkpoint_sha256']=='311ce18d97e9533d8585eaadafe040fbdd8070533209ed8696641dadc97a7301'
          assert b['metrics_sha256']==hashlib.sha256((root/'metrics.json').read_bytes()).hexdigest()
          assert m['experiment']=='synthetic_e11b_tabpfn_contract'
          assert m['feasibility_ready'] is True and m['subject_overlap_max']==0
          assert m['all_synthetic_backends'] is True and m['checkpoint_verified_in_synthetic'] is False
          text=(root/'metrics.json').read_text()
          for token in ('"participant_id"','"subject_group"','ROW_','SUB_','"challenge_predictions"'): assert token not in text
          print('CMI_FLU_E11B_ACTIVE_AST_PASS active_tasks=0')
          PY
          ! grep -R -E 'kaggle[[:space:]]+competitions[[:space:]]+submit|competition_submit\(' \
            "${WORKDIR}/runtime.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_prepare_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_sanitize.py" >/dev/null
          grep -F 'prior-labsai/tabpfn-3/pytorch/default/1' "${WORKDIR}/runtime.py" >/dev/null
          echo CMI_FLU_E11B_SECRET_FREE_VALIDATE_PASS

      - name: Validate locked Kaggle CLI model-file and executor surfaces without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/argv-venv"
          "${WORKDIR}/argv-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/argv-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/argv-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          help_text="$("${WORKDIR}/argv-venv/bin/kaggle" models instances versions files --help)"
          grep -F -- '--page-size' <<<"${help_text}" >/dev/null
          exec_help="$(PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/argv-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_execute.py" --help)"
          grep -F -- '--runtime' <<<"${exec_help}" >/dev/null
          grep -F -- '--bridge-root' <<<"${exec_help}" >/dev/null
          grep -F -- '--output-dir' <<<"${exec_help}" >/dev/null
          python3 - "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_execute.py" <<'PY'
          import pathlib,sys
          text=pathlib.Path(sys.argv[1]).read_text()
          assert '"model_sources": [MODEL_SOURCE]' in text
          assert text.index('model_access_preflight()') < text.index('push(api, parsed.runtime.resolve(), work)')
          assert 'kaggle competitions submit' not in text
          print('CMI_FLU_E11B_EXECUTOR_CONTRACT_PASS')
          PY

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one private CPU E11b TabPFN3 and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e11b-tabpfn3-001.yml@refs/heads/main" ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11b-bridge/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Check public policy, acquire wheel, and rebuild exact runtime before credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/kaggle_policy_preflight.py"
          mkdir -p "${WORKDIR}/wheel"
          python3 -m pip download --disable-pip-version-check --no-input --no-deps --only-binary=:all: --dest "${WORKDIR}/wheel" 'tabpfn==8.5.0' >/dev/null
          echo "${TABPFN_WHEEL_SHA256}  ${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" | sha256sum -c -
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_prepare_v2.py" \
            --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" \
            --tabpfn-wheel "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_validator_contract_test_v2.py" --runtime "${WORKDIR}/runtime.py"

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run one approved E11b CPU kernel after read-only model-access preflight
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_execute.py" \
            --runtime "${WORKDIR}/runtime.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"
          unset KAGGLE_API_TOKEN

      - name: Validate aggregate-only E11b result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11b_sanitize.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
