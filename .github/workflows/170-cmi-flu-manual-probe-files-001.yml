name: CMI-Flu manual probe submission files 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/170-cmi-flu-manual-probe-files-001.yml
      - requests/cmi-flu-manual-probe-files-001.json
      - scripts/cmi_flu_manual_probe_files_001.py
  pull_request:
    paths:
      - .github/workflows/170-cmi-flu-manual-probe-files-001.yml
      - requests/cmi-flu-manual-probe-files-001.json
      - scripts/cmi_flu_manual_probe_files_001.py
  workflow_dispatch:

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-manual-probe-files-20260906-001
  TARGET_SLUG: cmi-flu-manual-probe-files-20260906-001
  TARGET_TITLE: CMI Flu Manual Probe Files 20260906 001
  SOURCE_KERNEL: renta0426/cmi-flu-public-probes-20260906-006
  SOURCE_EXPECTED_VERSION: "1"
  EXPECTED_KERNEL_VERSION: "1"
  REQUEST_PATH: requests/cmi-flu-manual-probe-files-001.json
  RUNTIME_PATH: scripts/cmi_flu_manual_probe_files_001.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate manual-submission file Notebook without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "VALIDATE_WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/repo" <<'PY'
          from __future__ import annotations
          import io,os,pathlib,ssl,sys,tarfile,urllib.request
          target=pathlib.Path(sys.argv[1]); target.mkdir(parents=True)
          url=f"https://api.github.com/repos/{os.environ['EXPECTED_REPOSITORY']}/tarball/{os.environ['EVENT_SHA']}"
          req=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge/1'})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              archive=response.read(20_000_001)
          if len(archive)>20_000_000: raise SystemExit('bridge commit archive exceeds byte budget')
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as tf:
              members=tf.getmembers(); prefixes={m.name.split('/',1)[0] for m in members if m.name}
              if len(prefixes)!=1: raise SystemExit('unexpected commit archive layout')
              prefix=next(iter(prefixes))+'/'
              for member in members:
                  if not member.isfile(): continue
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit('unsafe archive path')
                  data=tf.extractfile(member).read(); out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY

      - name: Validate immutable request and runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -W error::SyntaxWarning -m py_compile "${VALIDATE_WORKDIR}/repo/${RUNTIME_PATH}"
          python3 - "${VALIDATE_WORKDIR}/repo/${REQUEST_PATH}" "${VALIDATE_WORKDIR}/repo/${RUNTIME_PATH}" <<'PY'
          import ast,json,pathlib,re,sys
          req=json.loads(pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'))
          source=pathlib.Path(sys.argv[2]).read_text(encoding='utf-8')
          expected_hashes={
            'control-b21-regenerated.csv':'33467e28f68f5b8f2731f3547000edc39af932cac04a233b549b6df67854b037',
            'probe-task13.csv':'6d1bac6f35ccbea549c4b23d71d6d4ddc652bf6577a853019855ea968295a717',
            'probe-task12.csv':'365607d59cd530656b929a1c1c57412cc6d375265a8d1ba10d304c64e012f387',
            'probe-task12-task13.csv':'0d6450453a5c82086372373d1f425229c8b4c3c05764b71f7c98265df4afbfc2'}
          if req.get('request_id')!='20260906-cmi-flu-manual-probe-files-001': raise SystemExit('request identity mismatch')
          if req.get('target')!='renta0426/cmi-flu-manual-probe-files-20260906-001': raise SystemExit('target mismatch')
          if req.get('source_kernel')!='renta0426/cmi-flu-public-probes-20260906-006' or req.get('source_expected_version')!=1: raise SystemExit('source kernel/version mismatch')
          if req.get('source_files')!=expected_hashes: raise SystemExit('source hash map mismatch')
          if req.get('competition_submission_attempted') is not False or req.get('automatic_compute_retries')!=0: raise SystemExit('submission/retry boundary mismatch')
          if req.get('resource')!={'accelerator':'cpu','expected_runtime_minutes':3,'hard_timeout_minutes':20,'max_active_runs':1}: raise SystemExit('resource contract mismatch')
          ast.parse(source)
          for token in ('competition_submit','competitions submit','KAGGLE_API_TOKEN','requests.get(','urllib.request'):
              if token in source: raise SystemExit(f'runtime contains forbidden network/submit token: {token}')
          if 'SOURCE_KERNEL = "renta0426/cmi-flu-public-probes-20260906-006"' not in source: raise SystemExit('runtime source identity missing')
          if 'sample_submission_part1.csv' not in source: raise SystemExit('runtime sample contract missing')
          title='CMI Flu Manual Probe Files 20260906 001'; slug=re.sub(r'[^a-z0-9]+','-',title.lower()).strip('-')
          if slug!='cmi-flu-manual-probe-files-20260906-001' or len(slug)>50 or len(title)>50: raise SystemExit('title/slug contract failed')
          print('CMI_FLU_MANUAL_PROBE_FILES_001_VALIDATE PASS')
          PY

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl,urllib.request
          for url in ('https://www.kaggle.com/terms','https://www.kaggle.com/aup','https://www.kaggle.com/community-guidelines','https://www.kaggle.com/docs/api'):
              req=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge/1'})
              with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as response:
                  if response.status!=200 or not response.read(65536): raise SystemExit(f'official Kaggle page unavailable: {url}')
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          if [[ -n "${VALIDATE_WORKDIR-}" && -d "${VALIDATE_WORKDIR}" ]]; then rm -rf "${VALIDATE_WORKDIR}"; fi

  launch:
    name: Run private manual-submission file Notebook 001
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/170-cmi-flu-manual-probe-files-001.yml@refs/heads/main" ]]
          echo 'PROTECTED_CMI_FLU_MANUAL_PROBE_FILES_001_BOUNDARY PASS'

      - name: Materialize approved bridge commit and locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/repo" <<'PY'
          from __future__ import annotations
          import io,os,pathlib,ssl,sys,tarfile,urllib.request
          target=pathlib.Path(sys.argv[1]); target.mkdir(parents=True)
          url=f"https://api.github.com/repos/{os.environ['EXPECTED_REPOSITORY']}/tarball/{os.environ['EVENT_SHA']}"
          req=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge/1'})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response: archive=response.read(20_000_001)
          if len(archive)>20_000_000: raise SystemExit('bridge commit archive exceeds byte budget')
          with tarfile.open(fileobj=io.BytesIO(archive),mode='r:gz') as tf:
              members=tf.getmembers(); prefixes={m.name.split('/',1)[0] for m in members if m.name}; prefix=next(iter(prefixes))+'/'
              if len(prefixes)!=1: raise SystemExit('unexpected archive layout')
              for member in members:
                  if not member.isfile(): continue
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit('unsafe archive path')
                  data=tf.extractfile(member).read(); out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/repo/${LOCK_PATH}" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Recheck live Competition rules, source version, target freshness, and CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - "${WORKDIR}/admission.txt" <<'PY'
          from __future__ import annotations
          import os,pathlib,re,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          decision=pathlib.Path(sys.argv[1]); api=KaggleApi(); api.authenticate()
          pages=api.competition_list_pages(os.environ['TARGET_COMPETITION']) or []; content={}
          for page in pages:
              d=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(d.get('name') or '').strip().lower()
              if name: content[name]=str(d.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in k for k in content): raise SystemExit('live Competition pages unavailable')
          plain=lambda s: re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s)).casefold()
          rules=plain(content['rules']); evaluation=plain(content['evaluation']); data=' '.join(plain(content[k]) for k in content if 'data' in k)
          if 'maximum of five (5) submissions per day' not in rules: raise SystemExit('live submission limit changed')
          if not all(x in evaluation for x in ('mean spearman correlation','40 donors')): raise SystemExit('live evaluation changed')
          if 'sample_submission_part1.csv' not in data: raise SystemExit('live sample-submission reference unavailable')

          owner,slug=os.environ['SOURCE_KERNEL'].split('/',1); req=ApiGetKernelRequest(); req.user_name=owner; req.kernel_slug=slug
          with api.build_kaggle_client() as client: meta=client.kernels.kernels_api_client.get_kernel(req).metadata
          if str(getattr(meta,'ref',''))!=os.environ['SOURCE_KERNEL'] or not bool(getattr(meta,'is_private',False)): raise SystemExit('source kernel identity/privacy mismatch')
          if int(getattr(meta,'current_version_number',0) or 0)!=int(os.environ['SOURCE_EXPECTED_VERSION']): raise SystemExit('source current version changed')
          status=str(getattr(api.kernels_status(os.environ['SOURCE_KERNEL']),'status','')).upper()
          if 'COMPLETE' not in status: raise SystemExit('source kernel is not complete')

          existing=api.kernels_list(user='renta0426',search=os.environ['TARGET_SLUG'],page_size=5) or []
          if os.environ['TARGET_KERNEL'] in {str(getattr(x,'ref','')) for x in existing}: raise SystemExit('target manual-submission Notebook already exists')
          active_refs=[]
          for item in (api.kernels_list(user='renta0426',sort_by='dateRun',page_size=10) or [])[:10]:
              ref=str(getattr(item,'ref',''))
              if not ref: continue
              try: st=str(getattr(api.kernels_status(ref),'status','')).upper()
              except Exception: continue
              if any(t in st for t in ('RUNNING','QUEUED','PENDING')): active_refs.append(ref)
          active={'cpu':0,'unknown':0}
          if len(active_refs)>5: active['unknown']=len(active_refs)
          else:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      resource='unknown'
                      try:
                          o,s=ref.split('/',1); r=ApiGetKernelRequest(); r.user_name=o; r.kernel_slug=s; m=client.kernels.kernels_api_client.get_kernel(r).metadata
                          resource='cpu' if not bool(getattr(m,'enable_gpu',False)) and not bool(getattr(m,'enable_tpu',False)) else 'other'
                      except Exception: pass
                      if resource in active: active[resource]+=1
          can_launch=active['cpu']+active['unknown']<1
          decision.write_text('launch\n' if can_launch else 'defer\n',encoding='utf-8')
          print(f"CMI_FLU_MANUAL_PROBE_FILES_001_PREFLIGHT source_version=1 source_complete=true active_cpu={active['cpu']} active_unknown={active['unknown']} can_launch={can_launch}")
          PY
          if [[ "$(cat "${WORKDIR}/admission.txt")" == "launch" ]]; then echo 'can_launch=true' >> "${GITHUB_OUTPUT}"; else echo 'can_launch=false' >> "${GITHUB_OUTPUT}"; fi

      - name: Record deferred admission
        if: steps.admission.outputs.can_launch != 'true'
        run: echo 'Manual-submission file request deferred before Kaggle write; fresh approval required for a future run.'

      - name: Push exactly one private CPU manual-submission file Notebook
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          title=os.environ['TARGET_TITLE']; slug=re.sub(r'[^a-z0-9]+','-',title.lower()).strip('-')
          if slug!=os.environ['TARGET_SLUG'] or os.environ['TARGET_KERNEL']!=f"renta0426/{slug}": raise SystemExit('kernel identity mismatch')
          if len(title)>50 or len(slug)>50: raise SystemExit('kernel title/slug too long')
          PY
          kernel_dir="${WORKDIR}/kernel"; mkdir -p "${kernel_dir}"; cp "${WORKDIR}/repo/${RUNTIME_PATH}" "${kernel_dir}/script.py"
          python3 - "${kernel_dir}" <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1]); metadata={
            'id':os.environ['TARGET_KERNEL'],'title':os.environ['TARGET_TITLE'],'code_file':'script.py','language':'python','kernel_type':'script',
            'is_private':True,'enable_gpu':False,'enable_tpu':False,'enable_internet':False,'machine_shape':'',
            'dataset_sources':[],'competition_sources':[os.environ['TARGET_COMPETITION']],
            'kernel_sources':[os.environ['SOURCE_KERNEL']],'model_sources':[]}
          (root/'kernel-metadata.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?; set -e
          if [[ "${rc}" -ne 0 ]]; then
            python3 - "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr" "${rc}" <<'PY'
          import hashlib,pathlib,sys
          out,err,rc=pathlib.Path(sys.argv[1]),pathlib.Path(sys.argv[2]),int(sys.argv[3]); ob=out.read_bytes() if out.exists() else b''; eb=err.read_bytes() if err.exists() else b''
          text=(ob+eb).decode('utf-8','replace').casefold(); category='unknown'
          for name,tokens in (('rate_limit',('429','too many requests','rate limit')),('permission_denied',('permission','forbidden','403')),('bad_request',('bad request','400')),('source_attach',('kernel source','source'))):
              if any(token in text for token in tokens): category=name; break
          print(f"CMI_FLU_MANUAL_PROBE_FILES_001_PUSH_FAILURE rc={rc} category={category} stdout_bytes={len(ob)} stdout_sha256={hashlib.sha256(ob).hexdigest()} stderr_bytes={len(eb)} stderr_sha256={hashlib.sha256(eb).hexdigest()}")
          PY
            rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"; exit 1
          fi
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          echo 'CMI_FLU_MANUAL_PROBE_FILES_001_LAUNCH PASS submission=false automatic_compute_retries=0'

      - name: Wait boundedly for completion
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" - <<'PY'
          import os,time
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate(); target=os.environ['TARGET_KERNEL']; schedule=[15,30,60]; steady=120; hard=1200; max_calls=10; started=time.monotonic()
          for call in range(1,max_calls+1):
              status=str(getattr(api.kernels_status(target),'status','')).upper(); elapsed=int(time.monotonic()-started)
              print(f"CMI_FLU_MANUAL_PROBE_FILES_001_STATUS call={call} elapsed_s={elapsed} status={status or 'UNKNOWN'}")
              if 'COMPLETE' in status: print('CMI_FLU_MANUAL_PROBE_FILES_001_TERMINAL PASS'); break
              if any(t in status for t in ('ERROR','FAIL','CANCEL')): raise SystemExit(f'manual-submission Notebook terminal failure: {status}')
              if elapsed>=hard: raise SystemExit('manual-submission Notebook exceeded hard monitor bound')
              sleep=schedule[call-1] if call<=len(schedule) else steady; time.sleep(min(sleep,max(1,hard-elapsed)))
          else: raise SystemExit('manual-submission Notebook exhausted status-call budget')
          PY

      - name: Read exact current-v1 submission-ready outputs
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PATH: ${{ env.WORKDIR }}/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/repo/scripts/kaggle_current_output_read.py" \
            --kernel "${TARGET_KERNEL}" --expected-version "${EXPECTED_KERNEL_VERSION}" \
            --allow-file submission-control-b21.csv:262144 \
            --allow-file submission-task13-only.csv:262144 \
            --allow-file submission-task12-only.csv:262144 \
            --allow-file submission-task12-task13.csv:262144 \
            --allow-file manual-submission-manifest.json:65536 \
            --output-dir "${WORKDIR}/outputs"

      - name: Validate exact hashes and submission CSV contracts
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/outputs" <<'PY'
          import csv,hashlib,json,math,pathlib,sys
          root=pathlib.Path(sys.argv[1]); manifest=json.loads((root/'manual-submission-manifest.json').read_text(encoding='utf-8'))
          expected={
            'submission-control-b21.csv':'33467e28f68f5b8f2731f3547000edc39af932cac04a233b549b6df67854b037',
            'submission-task13-only.csv':'6d1bac6f35ccbea549c4b23d71d6d4ddc652bf6577a853019855ea968295a717',
            'submission-task12-only.csv':'365607d59cd530656b929a1c1c57412cc6d375265a8d1ba10d304c64e012f387',
            'submission-task12-task13.csv':'0d6450453a5c82086372373d1f425229c8b4c3c05764b71f7c98265df4afbfc2'}
          header=['participant_id','Task1.1','Task1.2','Task1.3','Task1.4','Task2.1','Task2.2','Task2.3']
          if manifest.get('request_id')!='20260906-cmi-flu-manual-probe-files-001' or manifest.get('competition_submission_attempted') is not False: raise SystemExit('manifest identity/submission boundary mismatch')
          if manifest.get('output_sha256')!=expected: raise SystemExit('manifest output hash map mismatch')
          for name,digest in expected.items():
              path=root/name
              if hashlib.sha256(path.read_bytes()).hexdigest()!=digest: raise SystemExit(f'hash mismatch: {name}')
              with path.open('r',encoding='utf-8',newline='') as f:
                  reader=csv.DictReader(f); rows=list(reader); fields=list(reader.fieldnames or [])
              if fields!=header or len(rows)!=40: raise SystemExit(f'CSV shape/header mismatch: {name}')
              ids=[row['participant_id'] for row in rows]
              if len(set(ids))!=40 or any(not x for x in ids): raise SystemExit(f'participant contract mismatch: {name}')
              for task in header[1:]:
                  vals=[float(row[task]) for row in rows]
                  if not all(math.isfinite(v) and v!=-99.0 for v in vals): raise SystemExit(f'value contract mismatch: {name}:{task}')
          print('CMI_FLU_MANUAL_PROBE_FILES_001_RESULT PASS files=4 rows=40 submission_api_called=false')
          PY

      - name: Cleanup runner-local private content
        if: always()
        shell: bash
        run: |
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'Runner-local manual-submission content removed'
