name: Poisoned Chalice Min-K++ paper 10k private compose

on:
  pull_request:
    paths:
      - scripts/compose_private_minkpp_10k.py
      - requirements/kaggle-2.2.4.lock
      - .github/workflows/201-poisoned-chalice-minkpp-paper-10k-private-compose.yml
  push:
    branches: [main]
    paths:
      - scripts/compose_private_minkpp_10k.py
      - requirements/kaggle-2.2.4.lock
      - .github/workflows/201-poisoned-chalice-minkpp-paper-10k-private-compose.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  PILOT_KERNEL: renta0426/poisoned-chalice-minkpp-paper-pilot-500-v1
  STARTER_KERNEL: renta0426/starter-plus-10k-v2
  TARGET_KERNEL: renta0426/poisoned-chalice-minkpp-paper-10k-v1
  COMPOSER_PATH: scripts/compose_private_minkpp_10k.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate private-Kaggle composer without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate public orchestration boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]
          root=pathlib.Path(root_value)
          url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/scripts/compose_private_minkpp_10k.py"
          request=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
          with urllib.request.urlopen(request,timeout=30,context=ssl.create_default_context()) as response:
              data=response.read(131073)
          if not data or len(data)>131072: raise SystemExit("composer byte budget failed")
          path=root/"compose_private_minkpp_10k.py"
          path.write_bytes(data)
          compile(data,str(path),"exec")
          text=data.decode("utf-8")
          forbidden=(
              "RESEARCH_REPOSITORY =",
              "RESEARCH_REPOSITORY:",
              "private_repo_access=1",
              "actions/checkout",
          )
          if any(token in text for token in forbidden):
              raise SystemExit("public composer contains forbidden private-repository transport")
          required=(
              "kaggle kernels pull",
              "private_github_access",
              "FORBIDDEN_SOURCE_FRAGMENTS",
              "run_private_paper_records",
              "same_forward_paper_and_legacy",
          )
          if not all(token in text for token in required):
              raise SystemExit("composer security/science markers missing")
          print("PRIVATE_COMPOSER_STATIC PASS private_repo_access=0 private_source_persisted=0")
          PY
          python3 -m venv "${workdir}/compose-venv"
          "${workdir}/compose-venv/bin/python" -m pip install --disable-pip-version-check --no-input -q 'nbformat==5.10.4'
          "${workdir}/compose-venv/bin/python" "${workdir}/compose_private_minkpp_10k.py" --self-test

  launch:
    name: Launch approved private-Kaggle T4 composition exactly once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/201-poisoned-chalice-minkpp-paper-10k-private-compose.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "forbidden private-repository credential variable: ${name}"; exit 1; }
          done
          echo "MINKPP_10K_BOUNDARY PASS private_repo_access=0 retries=0 submissions=0"

      - name: Prepare public composer and locked Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]
          root=pathlib.Path(root_value)
          ctx=ssl.create_default_context()
          files=(
              ("scripts/compose_private_minkpp_10k.py",131072,"compose_private_minkpp_10k.py"),
              ("requirements/kaggle-2.2.4.lock",262144,"kaggle-2.2.4.lock"),
          )
          for remote,maximum,local in files:
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{remote}"
              request=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request,timeout=30,context=ctx) as response:
                  data=response.read(maximum+1)
              if not data or len(data)>maximum: raise SystemExit(f"public file byte budget failed: {remote}")
              destination=root/local
              destination.write_bytes(data)
              if destination.suffix==".py": compile(data,str(destination),"exec")
          PY
          python3 -m venv "${workdir}/compose-venv"
          "${workdir}/compose-venv/bin/python" -m pip install --disable-pip-version-check --no-input -q 'nbformat==5.10.4'
          "${workdir}/compose-venv/bin/python" "${workdir}/compose_private_minkpp_10k.py" --self-test
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/kaggle-2.2.4.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "MINKPP_10K_PUBLIC_PREP PASS locked_cli=2.2.4 private_repo_access=0"

      - name: Authenticate, preflight, compose in tmp, and push exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          [[ -z "${RESEARCH_REPO_READ_TOKEN-}" && -z "${GH_TOKEN-}" && -z "${GITHUB_PAT-}" && -z "${SSH_PRIVATE_KEY-}" ]]
          mkdir -p "${HOME}/.kaggle"
          umask 077
          printf '%s' "${KAGGLE_API_TOKEN}" > "${HOME}/.kaggle/access_token"
          unset KAGGLE_API_TOKEN
          kaggle_bin="${WORKDIR}/kaggle-venv/bin/kaggle"
          "${kaggle_bin}" kernels list --mine --page-size 1 >/dev/null 2>&1
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate()
          target="renta0426/poisoned-chalice-minkpp-paper-10k-v1"
          slug=target.split("/",1)[1]
          visible=api.kernels_list(user="renta0426",search=slug,page_size=20) or []
          if any(str(getattr(item,"ref","") or "")==target for item in visible):
              raise SystemExit("approved target already exists; refusing overwrite")
          quota=api.quota_view(); gpu=getattr(quota,"gpu_quota",None)
          used=getattr(gpu,"time_used",None); total=getattr(gpu,"total_time_allowed",None)
          if used is None or total is None: raise SystemExit("GPU quota unavailable")
          remaining=max(0.0,(total-used).total_seconds()/3600.0)
          if remaining<2.0: raise SystemExit(f"insufficient GPU quota: remaining={remaining:.2f}h minimum=2.00h")
          recent=(api.kernels_list(user="renta0426",sort_by="dateRun",page_size=25) or [])[:25]
          active=0; unknown=0
          for item in recent:
              ref=str(getattr(item,"ref","") or "")
              if not ref: continue
              try: status=str(getattr(api.kernels_status(ref),"status","")).upper()
              except Exception: unknown+=1; continue
              if any(token in status for token in ("RUNNING","QUEUED","PENDING")): active+=1
          if unknown: raise SystemExit(f"conservative admission refused: unknown_status={unknown}")
          if active>=1: raise SystemExit(f"GPU admission refused: active_kernels={active}")
          print(f"MINKPP_10K_LIVE_PREFLIGHT PASS quota={remaining:.2f}h active=0 target_exists=0")
          PY
          pilot_dir="${WORKDIR}/private-pilot"
          starter_dir="${WORKDIR}/private-starter"
          target_dir="${WORKDIR}/private-target"
          mkdir -p "${pilot_dir}" "${starter_dir}" "${target_dir}"
          if ! "${kaggle_bin}" kernels pull "${PILOT_KERNEL}" -m -p "${pilot_dir}" >/dev/null 2>&1; then
            echo "private pilot Kaggle pull failed"; exit 1
          fi
          if ! "${kaggle_bin}" kernels pull "${STARTER_KERNEL}" -m -p "${starter_dir}" >/dev/null 2>&1; then
            echo "private starter Kaggle pull failed"; exit 1
          fi
          "${WORKDIR}/compose-venv/bin/python" "${WORKDIR}/compose_private_minkpp_10k.py" \
            --pilot-dir "${pilot_dir}" \
            --starter-dir "${starter_dir}" \
            --output-dir "${target_dir}" \
            --target "${TARGET_KERNEL}" \
            --title "Poisoned Chalice MinKPP Paper 10k V1"
          python3 - "${target_dir}" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          metadata=json.loads((root/"kernel-metadata.json").read_text())
          assert metadata["id"]=="renta0426/poisoned-chalice-minkpp-paper-10k-v1"
          assert metadata["is_private"] is True and metadata["enable_gpu"] is True
          assert metadata["enable_tpu"] is False and metadata["enable_internet"] is True
          assert metadata["machine_shape"]=="NvidiaTeslaT4"
          assert not metadata["dataset_sources"] and not metadata["kernel_sources"]
          assert not metadata["competition_sources"] and not metadata["model_sources"]
          notebooks=list(root.glob("*.ipynb")); assert len(notebooks)==1
          notebook=json.loads(notebooks[0].read_text())
          code="\n".join(
              cell.get("source","") if isinstance(cell.get("source",""),str) else "".join(cell.get("source",[]))
              for cell in notebook.get("cells",[]) if cell.get("cell_type")=="code"
          )
          forbidden=(
              "raw.githubusercontent.com",
              "api.github.com/repos/",
              "RESEARCH_REPO_READ_TOKEN",
              "GH_TOKEN",
              "GITHUB_PAT",
              "SSH_PRIVATE_KEY",
              "submission.csv",
              "competitions submit",
          )
          if any(token in code for token in forbidden): raise SystemExit("private target contract contains forbidden transport/side effect")
          required=(
              "same_forward_paper_and_legacy",
              "make_window_records(train_sample.iloc[:8]",
              "run_private_paper_records",
              "stage1-minkpp-paper-10k-v1",
          )
          if not all(token in code for token in required): raise SystemExit("private target scientific contract incomplete")
          print("MINKPP_10K_PRIVATE_BUNDLE PASS private_repo_access=0 source_bodies_logged=0 submission=0")
          PY
          if ! "${kaggle_bin}" kernels push -p "${target_dir}" >/dev/null 2>&1; then
            echo "Kaggle kernel push failed"; exit 1
          fi
          echo "MINKPP_10K_KERNEL_PUSH PASS count=1 retry=0 submission=0 private_repo_access=0"

      - name: Cleanup runner-local private material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${HOME}/.kaggle/access_token" "${HOME}/.kaggle/kaggle.json"
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "MINKPP_10K_CLEANUP PASS retention_days=0 private_source_artifacts=0"
