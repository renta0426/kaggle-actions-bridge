name: Poisoned Chalice Stage1 resumed post-run static validation

on:
  pull_request:
    paths:
      - .github/workflows/85-poisoned-chalice-stage1-resume-postrun-static.yml
      - .github/workflows/86-poisoned-chalice-stage1-resume-status.yml
      - .github/workflows/87-poisoned-chalice-stage1-resume-submit.yml
      - scripts/validate_poisoned_chalice_stage1_resume_output.py
      - requests/poisoned-chalice-stage1-resume-status-v1.json
      - requests/poisoned-chalice-stage1-resume-submit-v1.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/85-poisoned-chalice-stage1-resume-postrun-static.yml
      - .github/workflows/86-poisoned-chalice-stage1-resume-status.yml
      - .github/workflows/87-poisoned-chalice-stage1-resume-submit.yml
      - scripts/validate_poisoned_chalice_stage1_resume_output.py
      - requests/poisoned-chalice-stage1-resume-status-v1.json
      - requests/poisoned-chalice-stage1-resume-submit-v1.json

permissions: {}

concurrency:
  group: poisoned-chalice-stage1-resume-postrun-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Validate read-only output and one-call submission boundaries
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact event files without credentials and validate
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "1354356687" ]]
          [[ "${EVENT_ACTOR}" == "renta0426" ]]
          [[ "${EVENT_ACTOR_ID}" == "71638068" ]]
          [[ "${EVENT_SENDER_ID}" == "71638068" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${PR_HEAD_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
            [[ "${PR_AUTHOR}" == "renta0426" ]]
          elif [[ "${EVENT_NAME}" != "push" ]]; then
            echo "unexpected event: ${EVENT_NAME}"
            exit 1
          fi
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - "${SOURCE_SHA}" <<'PY'
          from __future__ import annotations
          import ast
          import hashlib
          import json
          import pathlib
          import re
          import ssl
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          sha = sys.argv[1]
          required = {
              ".github/workflows/86-poisoned-chalice-stage1-resume-status.yml": 131072,
              ".github/workflows/87-poisoned-chalice-stage1-resume-submit.yml": 131072,
              "scripts/validate_poisoned_chalice_stage1_resume_output.py": 131072,
          }
          optional = {
              "requests/poisoned-chalice-stage1-resume-status-v1.json": 16384,
              "requests/poisoned-chalice-stage1-resume-submit-v1.json": 16384,
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def fetch(path: str, limit: int, missing_ok: bool = False) -> bytes | None:
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected source origin")
              try:
                  with opener.open(url, timeout=30) as response:
                      data = response.read(limit + 1)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise
              if len(data) > limit:
                  raise SystemExit(f"source exceeds byte budget: {path}")
              destination = pathlib.Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              return data

          data = {path: fetch(path, limit) for path, limit in required.items()}
          optional_data = {
              path: fetch(path, limit, missing_ok=True)
              for path, limit in optional.items()
          }
          status = data[".github/workflows/86-poisoned-chalice-stage1-resume-status.yml"].decode()
          submit = data[".github/workflows/87-poisoned-chalice-stage1-resume-submit.yml"].decode()
          verifier = data["scripts/validate_poisoned_chalice_stage1_resume_output.py"]
          ast.parse(verifier.decode(), filename="validate_poisoned_chalice_stage1_resume_output.py")
          verifier_blob = hashlib.sha1(
              b"blob " + str(len(verifier)).encode() + b"\0" + verifier
          ).hexdigest()
          if verifier_blob != "50307d5cc4ce305cda95f69d4dbf354cc9d743a6":
              raise SystemExit("output verifier blob changed")

          common = (
              "permissions: {}",
              "group: kaggle-api-global",
              "cancel-in-progress: false",
              "environment: kaggle-readonry",
              "TARGET_KERNEL: renta0426/stage1-raw-fim-resume-v1",
              'EXPECTED_KERNEL_VERSION: "1"',
              "50307d5cc4ce305cda95f69d4dbf354cc9d743a6",
              "requirements/kaggle-2.2.4.lock",
              "run_manifest\\.json|submission\\.csv|feature_schema\\.json|source_shards\\.json",
              "hidden_validation_labels_used",
              "public_leaderboard_tuning_used",
          )
          for label, source in (("status", status), ("submit", submit)):
              for marker in common:
                  if marker not in source:
                      raise SystemExit(f"{label} workflow missing invariant: {marker}")
              if source.count("environment: kaggle-readonry") != 1:
                  raise SystemExit(f"{label} protected Environment count changed")
              for forbidden in (
                  "workflow_dispatch", "actions/checkout", "actions/upload-artifact",
                  "actions/download-artifact", "actions/cache", "continue-on-error: true",
                  "kernels push", "kernels delete", "kernels cancel",
                  "datasets create", "datasets version",
              ):
                  if forbidden in source:
                      raise SystemExit(f"{label} workflow gained forbidden operation: {forbidden}")
              if re.search(r"^\s*sleep\s+", source, flags=re.MULTILINE):
                  raise SystemExit(f"{label} workflow must not poll")

          if status.count("${{ secrets.KAGGLE_API_TOKEN }}") != 2:
              raise SystemExit("status Kaggle-secret step count changed")
          if submit.count("${{ secrets.KAGGLE_API_TOKEN }}") != 3:
              raise SystemExit("submission Kaggle-secret step count changed")
          if status.count('"${WORKDIR}/venv/bin/kaggle" kernels output') != 1:
              raise SystemExit("status output call count changed")
          if submit.count('"${WORKDIR}/venv/bin/kaggle" kernels output') != 1:
              raise SystemExit("submission output call count changed")
          if "competitions submit" in status:
              raise SystemExit("read-only status workflow gained submission capability")
          if submit.count('"${WORKDIR}/venv/bin/kaggle" competitions submit') != 1:
              raise SystemExit("submission workflow must contain exactly one submission call")
          for marker in (
              "POISONED_CHALICE_STAGE1_RESUME_OUTPUT_VERIFIED",
              "submission_sha256=${{ steps.output.outputs.submission_sha256 }}",
              "side_effects=none",
          ):
              if marker not in status:
                  raise SystemExit(f"status workflow missing marker: {marker}")
          for marker in (
              "STAGE1_RESUME_SHA_BOUND_OUTPUT PASS",
              "STAGE1_RESUME_COMPETITION_SUBMISSION PASS",
              "submit_calls=1 automatic_retries=0 final_selection=false",
              '"submission_call_limit": 1',
              '"automatic_submission_retries": 0',
              '"select_as_final": False',
          ):
              if marker not in submit:
                  raise SystemExit(f"submission workflow missing marker: {marker}")

          status_request = optional_data[
              "requests/poisoned-chalice-stage1-resume-status-v1.json"
          ]
          if status_request is not None:
              payload = json.loads(status_request)
              expected = {
                  "schema_version": 1,
                  "request_id": "20260903-poisoned-chalice-stage1-resume-status-001",
                  "parent_request_id": "20260903-poisoned-chalice-stage1-resume-001",
                  "competition": "poisoned-chalice-icse27",
                  "operation": "kernel_status_output",
                  "target": "renta0426/stage1-raw-fim-resume-v1",
                  "expected_kernel_version": 1,
                  "output_allowlist": [
                      "run_manifest.json", "submission.csv",
                      "feature_schema.json", "source_shards.json",
                  ],
                  "verifier_path": "scripts/validate_poisoned_chalice_stage1_resume_output.py",
                  "verifier_blob_sha": verifier_blob,
                  "api_budget": {"max_calls": 8, "max_pages": 1},
                  "side_effects": [],
              }
              if payload != expected:
                  raise SystemExit("status request differs from exact contract")

          submit_request = optional_data[
              "requests/poisoned-chalice-stage1-resume-submit-v1.json"
          ]
          if submit_request is not None:
              payload = json.loads(submit_request)
              fixed = {
                  "schema_version": 1,
                  "request_id": "20260903-poisoned-chalice-stage1-resume-submit-001",
                  "parent_status_request_id": "20260903-poisoned-chalice-stage1-resume-status-001",
                  "parent_run_request_id": "20260903-poisoned-chalice-stage1-resume-001",
                  "competition": "poisoned-chalice-icse27",
                  "operation": "competition_submit",
                  "target_kernel": "renta0426/stage1-raw-fim-resume-v1",
                  "expected_kernel_version": 1,
                  "submission_file": "submission.csv",
                  "submission_message": "Stage1 raw+structure+FIM cached continuation; OOF AUC 0.6645; no Public-LB tuning",
                  "verifier_path": "scripts/validate_poisoned_chalice_stage1_resume_output.py",
                  "verifier_blob_sha": verifier_blob,
                  "submission_call_limit": 1,
                  "side_effects": ["create one competition submission"],
                  "automatic_submission_retries": 0,
                  "select_as_final": False,
                  "public_leaderboard_tuning_used": False,
              }
              for key, value in fixed.items():
                  if payload.get(key) != value:
                      raise SystemExit(f"submission request mismatch: {key}")
              if set(payload) != set(fixed) | {"submission_sha256"}:
                  raise SystemExit("submission request contains unknown fields")
              if not re.fullmatch(r"[0-9a-f]{64}", str(payload.get("submission_sha256") or "")):
                  raise SystemExit("submission request SHA-256 malformed")

          print(
              "STAGE1_RESUME_POSTRUN_STATIC PASS status_side_effects=none "
              "submission_calls=1 sha_bound=true automatic_retries=0 final_selection=false"
          )
          PY

      - name: Cleanup fetched source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github requests scripts
          echo "STAGE1_RESUME_POSTRUN_STATIC_TEMPORARY_MATERIAL_REMOVED"
