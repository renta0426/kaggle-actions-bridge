name: Poisoned Chalice controlled shadow TPU pilot v1

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-shadow-tpu-pilot-v1.json
      - scripts/poisoned_chalice_shadow_tpu_pilot_v1.py
      - .github/workflows/141-poisoned-chalice-shadow-tpu-pilot-v1.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-shadow-tpu-pilot-v1.json
      - scripts/poisoned_chalice_shadow_tpu_pilot_v1.py
      - .github/workflows/141-poisoned-chalice-shadow-tpu-pilot-v1.yml

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-shadow-tpu-pilot-v1.json
  LAUNCHER_PATH: scripts/poisoned_chalice_shadow_tpu_pilot_v1.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate shadow TPU pilot without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free GitHub-hosted boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          echo 'SHADOW_TPU_SECRET_FREE_BOUNDARY PASS'

      - name: Fetch exact event sources and statically validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import ssl
          import sys
          import urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-shadow-tpu-pilot-v1.json": 32768,
              "scripts/poisoned_chalice_shadow_tpu_pilot_v1.py": 65536,
          }
          context = ssl.create_default_context()
          for path, limit in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          request = json.loads((root / "requests/poisoned-chalice-shadow-tpu-pilot-v1.json").read_text())
          launcher = root / request["launcher_path"]
          data = launcher.read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if blob != request["launcher_blob_sha"]:
              raise SystemExit("bridge launcher Git blob mismatch")
          compile(data, request["launcher_path"], "exec")
          if request["request_id"] != "20260904-poisoned-chalice-shadow-tpu-pilot-v1-001":
              raise SystemExit("request ID changed")
          if request["research_commit"] != "4e221829e37af88553e780488b27730cf167d6f8":
              raise SystemExit("research commit changed")
          if request["resource"] != {
              "accelerator": "tpu",
              "machine_shape": "Tpu1VmV38",
              "expected_runtime_minutes": 20,
              "hard_timeout_minutes": 60,
              "max_active_runs": 1,
              "min_remaining_quota_hours": 1.0,
          }:
              raise SystemExit("TPU resource contract changed")
          if request["automatic_compute_retries"] != 0 or request["competition_submission"]:
              raise SystemExit("one-shot/no-submission contract changed")
          print('SHADOW_TPU_BRIDGE_SOURCE_STATIC PASS write_calls=1 retries=0 submissions=0')
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}"
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --materialize \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --kernel-dir "${workdir}/kernel"
          python3 - "${workdir}/kernel" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          files = sorted(path.name for path in root.iterdir() if path.is_file())
          if files != ["kernel-metadata.json", "shadow-tpu-pilot-v1.ipynb"]:
              raise SystemExit(f"bundle allowlist mismatch: {files}")
          notebook = json.loads((root / "shadow-tpu-pilot-v1.ipynb").read_text())
          code = "".join(notebook["cells"][1]["source"])
          compile(code, "shadow-tpu-pilot-v1.ipynb", "exec")
          metadata = json.loads((root / "kernel-metadata.json").read_text())
          if metadata.get("machine_shape") != "Tpu1VmV38" or metadata.get("enable_gpu") or not metadata.get("enable_tpu") or metadata.get("enable_internet"):
              raise SystemExit("bundle accelerator contract changed")
          print('SHADOW_TPU_BUNDLE_STATIC PASS notebook_compile=true internet=false')
          PY

  launch:
    name: Launch exactly one controlled shadow TPU pilot
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-tpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/141-poisoned-chalice-shadow-tpu-pilot-v1.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo 'PROTECTED_SHADOW_TPU_BOUNDARY PASS request=001 write_calls=1 retries=0'

      - name: Prepare exact sources, kernel bundle, and isolated Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${workdir}/kernel" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import pathlib
          import re
          import ssl
          import sys
          import urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-shadow-tpu-pilot-v1.json": 32768,
              "scripts/poisoned_chalice_shadow_tpu_pilot_v1.py": 65536,
              "requirements/kaggle-2.2.4.lock": 65536,
          }
          context = ssl.create_default_context()
          for path, limit in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          request = json.loads((root / "requests/poisoned-chalice-shadow-tpu-pilot-v1.json").read_text())
          launcher = root / request["launcher_path"]
          data = launcher.read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if blob != request["launcher_blob_sha"]:
              raise SystemExit("bridge launcher Git blob mismatch")
          compile(data, request["launcher_path"], "exec")
          lock = (root / "requirements/kaggle-2.2.4.lock").read_text(encoding="utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}"
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --materialize \
            --request "${workdir}/${REQUEST_PATH}" \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --kernel-dir "${workdir}/kernel"
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${workdir}/requirements/kaggle-2.2.4.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'SHADOW_TPU_ISOLATED_CLIENT PASS'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl
          import urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Live-preflight and launch request 001 exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" "${WORKDIR}/${LAUNCHER_PATH}" \
            --execute \
            --request "${WORKDIR}/${REQUEST_PATH}" \
            --launcher "${WORKDIR}/${LAUNCHER_PATH}" \
            --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle" \
            --kernel-dir "${KERNEL_DIR}"

      - name: Cleanup runner-local public material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'SHADOW_TPU_RUNNER_LOCAL_MATERIAL_REMOVED retention_days=0'
