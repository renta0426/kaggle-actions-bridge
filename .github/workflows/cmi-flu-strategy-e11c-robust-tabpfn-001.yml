name: CMI-Flu strategy E11c Task1.1 robust TabPFN CPU 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e11c-robust-tabpfn-001.yml
      - requests/cmi-flu-strategy-e11c-robust-tabpfn-001.json
      - scripts/cmi_flu_source_attachment_identity.py
      - scripts/cmi_flu_strategy_e11c_prepare.py
      - scripts/cmi_flu_strategy_e11c_execute.py
      - scripts/cmi_flu_strategy_e11c_sanitize.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e11c-robust-tabpfn-001.yml
      - requests/cmi-flu-strategy-e11c-robust-tabpfn-001.json
      - scripts/cmi_flu_source_attachment_identity.py
      - scripts/cmi_flu_strategy_e11c_prepare.py
      - scripts/cmi_flu_strategy_e11c_execute.py
      - scripts/cmi_flu_strategy_e11c_sanitize.py

permissions: {}

concurrency:
  group: cmi-flu-e11c-robust-tabpfn-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260910-cmi-flu-strategy-e11c-robust-tabpfn-001
  SCIENCE_REPOSITORY: renta0426/CMI-Flu-Invited-Prediction-Challenge
  SCIENCE_COMMIT: 0815f4517345e127dbcbcae0f380a54f3a3d15bd
  E11C_BLOB: acf876996b5849f7ba794999d45ecb862d1be507
  E11C_SYNTH_BLOB: 9b94633192b5254a7d1debe8db10606b48104076
  E11B_BLOB: 8a291ae4952786bf16ee667caa5557599310e3fd
  E11B_SYNTH_BLOB: f25d04d75db584db78d26a232ab84dc5ab1bbf7d
  B21_CONFIG_BLOB: 170d3211e2795c0730e481056c7bb068accf97c9
  E11C_CONFIG_BLOB: 3b475f777307238bfcad61c124ab99175207bac2
  TARGET_KERNEL: renta0426/cmi-flu-e11c-robust-tabpfn-20260910-001
  CONSUMED_E11B_TARGET: renta0426/cmi-flu-e11b-tabpfn3-20260910-005
  TABPFN_WHEEL_FILENAME: tabpfn-8.5.0-py3-none-any.whl
  TABPFN_WHEEL_BYTES: "771167"
  TABPFN_WHEEL_SHA256: 4c076a019cfa5520e9c41405cecda845bdd09d909ede4a60c43839bbc83bf7a0
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate frozen E11c science, runtime and audited source identity
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY TABPFN_TOKEN HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge and science commits
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11c-001/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit('bridge archive layout')
              prefix=next(iter(prefixes))+'/'
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if '..' in rel.parts: raise SystemExit('unsafe bridge archive')
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 - "${workdir}/science" "${SCIENCE_REPOSITORY}" "${SCIENCE_COMMIT}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11c-science/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('science archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit('science archive layout')
              prefix=next(iter(prefixes))+'/'
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if '..' in rel.parts: raise SystemExit('unsafe science archive')
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Verify frozen manifest, science blobs and bridge scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" "${WORKDIR}/science" <<'PY'
          import hashlib,json,pathlib,sys
          bridge=pathlib.Path(sys.argv[1]); science=pathlib.Path(sys.argv[2])
          request=json.loads((bridge/'requests/cmi-flu-strategy-e11c-robust-tabpfn-001.json').read_text())
          assert request['request_id']=='20260910-cmi-flu-strategy-e11c-robust-tabpfn-001'
          assert request['parent_request_id']=='20260910-cmi-flu-strategy-e11b-tabpfn3-005'
          assert request['target']=='renta0426/cmi-flu-e11c-robust-tabpfn-20260910-001'
          assert request['target']!='renta0426/cmi-flu-e11b-tabpfn3-20260910-005'
          assert request['science_source_commit']=='0815f4517345e127dbcbcae0f380a54f3a3d15bd'
          assert request['resource']['accelerator']=='cpu'
          assert request['resource']['max_real_tabpfn_fits']==21
          assert request['automatic_compute_retries']==0
          assert request['competition_submission_attempted'] is False
          assert request['leaderboard_used_for_selection'] is False
          repair=request['source_attachment_validator_repair']
          assert repair['rerun_e11b_005'] is False
          assert repair['successful_audit_002_actions_run']==34460007561
          assert repair['successful_audit_002_actions_job']==102815418161
          assert repair['successful_audit_002_exact_reads']==1
          assert repair['observed_model_source']=='prior-labsai/tabpfn-3/PyTorch/default/1'
          assert repair['requested_model_source']=='prior-labsai/tabpfn-3/pytorch/default/1'
          assert repair['observed_competition_source']=='cmi-flu-first-prediction-challenge'
          assert repair['repair_scope']=='casefold_framework_segment_only_owner_model_variant_version_and_competition_strict'
          assert all(repair[key] is False for key in ('audit_write','audit_compute','audit_submission','audit_output_download'))
          expected={
            'src/cmi_flu/strategy_e11c.py':'acf876996b5849f7ba794999d45ecb862d1be507',
            'src/cmi_flu/strategy_e11c_synthetic.py':'9b94633192b5254a7d1debe8db10606b48104076',
            'src/cmi_flu/strategy_e11b.py':'8a291ae4952786bf16ee667caa5557599310e3fd',
            'src/cmi_flu/strategy_e11b_synthetic.py':'f25d04d75db584db78d26a232ab84dc5ab1bbf7d',
            'configs/baseline_b021_robust.yaml':'170d3211e2795c0730e481056c7bb068accf97c9',
            'configs/strategy_e11c_task11_robust_tabpfn.json':'3b475f777307238bfcad61c124ab99175207bac2',
          }
          assert request['science_blobs']==expected
          def git_blob(path):
              data=path.read_bytes()
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for rel,digest in expected.items():
              found=git_blob(science/rel)
              assert found==digest,(rel,found,digest)
          contract=request['experiment_contract']
          assert contract['base_weight']==0.75 and contract['tabpfn_weight']==0.25
          assert contract['eligible_conditions']==['C2','C4']
          assert contract['c3_eligible_for_e12'] is False
          assert contract['source_drop_selection_by_held_score'] is False
          assert contract['dynamic_domain_gate_fitted'] is False
          assert contract['promotion_mean_delta']==0.02
          assert contract['promotion_minimum_study_delta']==-0.1
          assert contract['promotion_expected_required_wins']==3
          assert contract['outer_full_tabpfn_fits']==4
          assert contract['outer_source_drop_tabpfn_fits']==12
          assert contract['max_real_tabpfn_fits_if_final_constructed']==21
          assert contract['public_probe_authorized'] is False
          assert contract['competition_submission_authorized'] is False
          PY
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_source_attachment_identity.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_sanitize.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_source_attachment_identity.py"

      - name: Build exact E11c runtime and run synthetic regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORKDIR}/wheel"
          python3 -m pip download --disable-pip-version-check --no-input --no-deps --only-binary=:all: --dest "${WORKDIR}/wheel" 'tabpfn==8.5.0' >/dev/null
          echo "${TABPFN_WHEEL_SHA256}  ${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" | sha256sum -c -
          [[ "$(stat -c '%s' "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}")" == "${TABPFN_WHEEL_BYTES}" ]]
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_prepare.py" \
            --repository-root "${WORKDIR}/bridge" \
            --science-root "${WORKDIR}/science" \
            --reference-dir "${WORKDIR}/references" \
            --tabpfn-wheel "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" \
            --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${WORKDIR}/runtime.py")" -lt 900000 ]]
          grep -F 'SCIENCE_COMMIT = "0815f4517345e127dbcbcae0f380a54f3a3d15bd"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'E11C_BLOB = "acf876996b5849f7ba794999d45ecb862d1be507"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'TABPFN_WHEEL_B64 = ""' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'pypi_exact_hash_verified' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F '20260910-cmi-flu-strategy-e11b-tabpfn3-005' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'renta0426/cmi-flu-e11b-tabpfn3-20260910-005' "${WORKDIR}/runtime.py" >/dev/null
          python3 "${WORKDIR}/runtime.py" --synthetic --output-dir "${WORKDIR}/synthetic"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_sanitize.py" --input-dir "${WORKDIR}/synthetic" --allow-synthetic

      - name: Validate locked Kaggle API and source identity contract without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" - <<'PY'
          import inspect
          import cmi_flu_source_attachment_identity as identity
          import cmi_flu_strategy_e11c_execute as execute
          expected='prior-labsai/tabpfn-3/pytorch/default/1'
          observed='prior-labsai/tabpfn-3/PyTorch/default/1'
          assert identity.model_source_equivalent(expected,observed)
          for bad in (
              'other/tabpfn-3/PyTorch/default/1',
              'prior-labsai/other/PyTorch/default/1',
              'prior-labsai/tabpfn-3/PyTorch/other/1',
              'prior-labsai/tabpfn-3/PyTorch/default/2',
          ):
              assert not identity.model_source_equivalent(expected,bad)
          class Metadata:
              model_data_sources=[observed]
              competition_data_sources=['cmi-flu-first-prediction-challenge']
          identity.require_exact_source_attachments(Metadata(),expected_model_source=expected,expected_competition_source='cmi-flu-first-prediction-challenge')
          assert 'api.kernels_push(str(kernel_dir))' in inspect.getsource(execute.push)
          assert 'require_exact_source_attachments' in inspect.getsource(execute.push)
          assert execute.TARGET=='renta0426/cmi-flu-e11c-robust-tabpfn-20260910-001'
          assert execute.TARGET!=execute.CONSUMED_E11B_TARGET
          class Item:
              def __init__(self,ref): self.ref=ref
          class EmptyApi:
              def __init__(self): self.calls=[]
              def kernels_list(self,**kwargs): self.calls.append(dict(kwargs)); return []
          empty=EmptyApi(); execute.prewrite_guard(empty)
          assert len(empty.calls)==1
          assert empty.calls[0]['search']=='cmi-flu-e11c-robust-tabpfn-20260910-001'
          class ExistingApi:
              def kernels_list(self,**kwargs): return [Item(execute.TARGET)]
          try:
              execute.prewrite_guard(ExistingApi())
          except RuntimeError as exc:
              assert 'write refused' in str(exc)
          else:
              raise AssertionError('existing E11c target did not fail closed')
          print('CMI_FLU_E11C_SECRET_FREE_TRANSPORT_PASS source_framework_case_only=true fresh_target=true e11b005_rerun=false')
          PY

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one private CPU E11c 001 and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e11c-robust-tabpfn-001.yml@refs/heads/main" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"

      - name: Materialize exact bridge and science commits
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11c-001-run/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit('bridge archive layout')
              prefix=next(iter(prefixes))+'/'
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if '..' in rel.parts: raise SystemExit('unsafe bridge archive')
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 - "${WORKDIR}/science" "${SCIENCE_REPOSITORY}" "${SCIENCE_COMMIT}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11c-science-run/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('science archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit('science archive layout')
              prefix=next(iter(prefixes))+'/'
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if '..' in rel.parts: raise SystemExit('unsafe science archive')
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Verify exact science relay and build runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" "${WORKDIR}/science" <<'PY'
          import hashlib,json,pathlib,sys
          bridge=pathlib.Path(sys.argv[1]); science=pathlib.Path(sys.argv[2])
          request=json.loads((bridge/'requests/cmi-flu-strategy-e11c-robust-tabpfn-001.json').read_text())
          assert request['request_id']=='20260910-cmi-flu-strategy-e11c-robust-tabpfn-001'
          assert request['target']=='renta0426/cmi-flu-e11c-robust-tabpfn-20260910-001'
          assert request['science_source_commit']=='0815f4517345e127dbcbcae0f380a54f3a3d15bd'
          assert request['source_attachment_validator_repair']['rerun_e11b_005'] is False
          expected=request['science_blobs']
          def git_blob(path):
              data=path.read_bytes(); return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for rel,digest in expected.items(): assert git_blob(science/rel)==digest,(rel,git_blob(science/rel),digest)
          PY
          mkdir -p "${WORKDIR}/wheel"
          python3 -m pip download --disable-pip-version-check --no-input --no-deps --only-binary=:all: --dest "${WORKDIR}/wheel" 'tabpfn==8.5.0' >/dev/null
          echo "${TABPFN_WHEEL_SHA256}  ${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" | sha256sum -c -
          [[ "$(stat -c '%s' "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}")" == "${TABPFN_WHEEL_BYTES}" ]]
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_prepare.py" \
            --repository-root "${WORKDIR}/bridge" \
            --science-root "${WORKDIR}/science" \
            --reference-dir "${WORKDIR}/references" \
            --tabpfn-wheel "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" \
            --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${WORKDIR}/runtime.py")" -lt 900000 ]]

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run one approved E11c CPU kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --bridge-root "${WORKDIR}/bridge" \
            --output-dir "${WORKDIR}/output"
          unset KAGGLE_API_TOKEN

      - name: Validate aggregate-only E11c result
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_sanitize.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
