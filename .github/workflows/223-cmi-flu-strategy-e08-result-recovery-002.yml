name: CMI-Flu strategy E08 result recovery 002

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/223-cmi-flu-strategy-e08-result-recovery-002.yml
      - requests/cmi-flu-strategy-e08-result-recovery-002.json
      - scripts/cmi_flu_strategy_e08_recover_current_v2.py
  pull_request:
    paths:
      - .github/workflows/223-cmi-flu-strategy-e08-result-recovery-002.yml
      - requests/cmi-flu-strategy-e08-result-recovery-002.json
      - scripts/cmi_flu_strategy_e08_recover_current_v2.py

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260909-cmi-flu-strategy-e08-result-recovery-002
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E08 output-only recovery 002
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done
      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e08-recovery/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
      - name: Validate recovery 002 contract without Kaggle access
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e08_recover_current_v2.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e08_sanitize_v2.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e08_sanitize_v2.py" --self-test
          python3 - "${WORKDIR}/bridge/requests/cmi-flu-strategy-e08-result-recovery-002.json" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e08_recover_current_v2.py" <<'PY'
          import json,pathlib,sys
          req=json.loads(pathlib.Path(sys.argv[1]).read_text())
          source=pathlib.Path(sys.argv[2]).read_text()
          assert req['request_id']=='20260909-cmi-flu-strategy-e08-result-recovery-002'
          assert req['operation']=='current_output_read' and req['expected_kernel_version']==1
          assert req['resource']['accelerator']=='none' and req['resource']['max_active_runs']==0
          assert req['compute_retry'] is False and req['automatic_compute_retries']==0 and req['side_effects']==[]
          assert req['previous_recovery_run_id']==34294309719
          assert req['failure_classification']=='bridge_runtime_compatibility_local_output_directory_precreated'
          assert req['expected_output_sha256']['metrics.json']=='8f0ac5adf9534fdfa82a76e902365eefdb33f238a75f50c28b963da214053212'
          assert 'if out.exists()' in source
          assert 'out.mkdir(' not in source
          assert 'out.parent.mkdir(' in source
          PY
          ! grep -E 'kernels[[:space:]]+push|kaggle[[:space:]]+competitions[[:space:]]+submit|competition_submit\(' "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e08_recover_current_v2.py" >/dev/null
          echo CMI_FLU_E08_RECOVERY_002_VALIDATE_PASS
      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  recover:
    name: Read existing E08 version 1 output only 002
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected recovery boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/223-cmi-flu-strategy-e08-result-recovery-002.yml@refs/heads/main" ]]
      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e08-recovery/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"
      - name: Recover existing current output without compute
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e08_recover_current_v2.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"
      - name: Validate and emit aggregate E08 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e08_sanitize_v2.py" --input-dir "${WORKDIR}/output"
      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
