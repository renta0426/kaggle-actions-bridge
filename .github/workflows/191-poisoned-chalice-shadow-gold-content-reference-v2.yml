          if any(str(getattr(item,"ref",""))==target for item in visible): raise SystemExit("v2 target already exists")
          quota=api.quota_view(); gpu=getattr(quota,"gpu_quota",None); used=getattr(gpu,"time_used",None); total=getattr(gpu,"total_time_allowed",None)
          if used is None or total is None: raise SystemExit("GPU quota unavailable")
          remaining=max(0.0,(total-used).total_seconds()/3600.0)
          if remaining<1.0: raise SystemExit(f"insufficient GPU quota: {remaining:.2f}h")
          recent=(api.kernels_list(user="renta0426",sort_by="dateRun",page_size=25) or [])[:25]; active=0; unknown=0
          for item in recent:
            ref=str(getattr(item,"ref","") or "")
            if not ref: continue
            try: status=str(getattr(api.kernels_status(ref),"status","")).upper()
            except Exception: unknown+=1; continue
            if any(token in status for token in ("RUNNING","QUEUED","PENDING")): active+=1
          if unknown: raise SystemExit(f"conservative admission refused: active={active} unknown={unknown} max_active={max_active}")
          if active>=max_active: raise SystemExit(f"concurrency admission refused: active={active} max_active={max_active}")
          print(f"SHADOW_GOLD_CONTENT_REF_V2_LIVE_PREFLIGHT PASS quota={remaining:.2f} active={active} max_active={max_active} unknown=0")
          PY
          "${WORKDIR}/kaggle-venv/bin/python" "${WORKDIR}/${LAUNCHER_PATH}" --execute --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle" --kernel-dir "${KERNEL_DIR}"

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "SHADOW_GOLD_CONTENT_REF_V2_CLEANUP PASS retention_days=0"
