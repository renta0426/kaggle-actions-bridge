name: CMI-Flu strategy E10 output recovery 001

on:
  pull_request:
    branches: [main]
    paths:
      - requests/cmi-flu-strategy-e10-output-recovery-001.json
      - scripts/cmi_flu_strategy_e10_output_recovery_sanitize.py
      - .github/workflows/cmi-flu-strategy-e10-output-recovery-001.yml
  push:
    branches: [main]
    paths:
      - requests/cmi-flu-strategy-e10-output-recovery-001.json
      - scripts/cmi_flu_strategy_e10_output_recovery_sanitize.py
      - .github/workflows/cmi-flu-strategy-e10-output-recovery-001.yml

permissions: {}

concurrency:
  group: kaggle-readonly-cmi-flu-e10-output-recovery-001
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-strategy-e10-output-recovery-001.json
  SANITIZER_PATH: scripts/cmi_flu_strategy_e10_output_recovery_sanitize.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  POLICY_PATH: scripts/kaggle_policy_preflight.py
  TARGET_OWNER: renta0426
  TARGET_SLUG: cmi-flu-e10-pooled-domain-correction-20260910-003
  TARGET_KERNEL: renta0426/cmi-flu-e10-pooled-domain-correction-20260910-003

jobs:
  validate:
    name: Validate secret-free E10 output recovery
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate read-only request and sanitizer
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          workdir="$(mktemp -d)"; trap 'rm -rf "${workdir}"' EXIT
          python3 - "${workdir}/repo" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e10-output-recovery/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(60_000_001)
          if len(data)>60_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
          python3 "${workdir}/repo/${POLICY_PATH}"
          python3 - "${workdir}/repo/${REQUEST_PATH}" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          expected={
            'schema_version':1,
            'request_id':'20260910-cmi-flu-strategy-e10-output-recovery-001',
            'parent_request_id':'20260910-cmi-flu-strategy-e10-pooled-domain-correction-003',
            'competition':'cmi-flu-first-prediction-challenge',
            'operation':'kernel_current_output_recovery',
            'target':'renta0426/cmi-flu-e10-pooled-domain-correction-20260910-003',
            'expected_current_version':1,
            'expected_terminal_status':'COMPLETE',
            'science_repository':'renta0426/CMI-Flu-Invited-Prediction-Challenge',
            'science_source_commit':'3a8728879179115487f5ce0ba4a4a0467e1910bb',
            'strategy_e10_blob_sha':'638b09860f85689714cb0b354f4f377a405deeac',
            'strategy_e10_synthetic_blob_sha':'f1f33f3909e64e69fb859d98b4163cdb4860d64d',
            'expected_outputs':{
              'bridge-result.json':{'bytes':1825,'sha256':'382eb3fbea3f7ed191012e12bbd18d20693e634bde55595ea87261478d94f06d'},
              'metrics.json':{'bytes':35262,'sha256':'c0786e8ba1e3098b7b4ca2e9ccb904708deb652452267cae8a038a7c80562d8a'},
              'summary.md':{'bytes':1205,'sha256':'09f0a164bb7bfee9f2d10a0628a8ca1300a81e6c5b70fc7c06d7011a07943b58'},
            },
            'side_effects':[],
            'automatic_compute_retries':0,
            'competition_submission_attempted':False,
            'leaderboard_used_for_selection':False,
            'raw_outputs_persisted':False,
            'publish_only_aggregate_sanitized_result':True,
          }
          assert r==expected
          print('CMI_FLU_E10_OUTPUT_RECOVERY_REQUEST_VALIDATE PASS side_effects=0 retries=0')
          PY
          python3 -m py_compile "${workdir}/repo/${SANITIZER_PATH}"
          PYTHONPATH="${workdir}/repo/scripts" python3 "${workdir}/repo/${SANITIZER_PATH}" --self-test
          ! grep -R -E 'kernels[[:space:]]+push|competition_submit|competitions[[:space:]]+submit' \
            "${workdir}/repo/${REQUEST_PATH}" "${workdir}/repo/${SANITIZER_PATH}" \
            "${workdir}/repo/.github/workflows/cmi-flu-strategy-e10-output-recovery-001.yml" >/dev/null
          echo 'CMI_FLU_E10_OUTPUT_RECOVERY_VALIDATE PASS'

  recover:
    name: Read completed E10-003 output and sanitize once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e10-output-recovery-001.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${EVENT_SHA}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          python3 "${workdir}/repo/${POLICY_PATH}"
          echo 'CMI_FLU_E10_OUTPUT_RECOVERY_BOUNDARY PASS side_effects=0 compute_retries=0'

      - name: Prepare locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/repo/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Fetch exact completed version 1 outputs read-only
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          api=KaggleApi(); api.authenticate()
          target=os.environ['TARGET_KERNEL']
          discovered=api.kernels_list(user=os.environ['TARGET_OWNER'],search=os.environ['TARGET_SLUG'],page_size=10) or []
          refs=[str(getattr(item,'ref','') or '') for item in discovered]
          if refs.count(target)!=1: raise SystemExit(f'exact target mismatch count={refs.count(target)}')
          status=str(getattr(api.kernels_status(target),'status','') or '').upper()
          if 'COMPLETE' not in status: raise SystemExit(f'expected COMPLETE status, got {status}')
          with api.build_kaggle_client() as client:
              req=ApiGetKernelRequest(); req.user_name=os.environ['TARGET_OWNER']; req.kernel_slug=os.environ['TARGET_SLUG']
              metadata=client.kernels.kernels_api_client.get_kernel(req).metadata
          current=int(getattr(metadata,'current_version_number',0) or 0)
          if str(metadata.ref)!=target or not bool(metadata.is_private) or current!=1:
              raise SystemExit(f'exact current identity mismatch current={current}')
          print(f'CMI_FLU_E10_OUTPUT_RECOVERY_STATUS PASS state=complete version={current}')
          PY
          mkdir "${WORKDIR}/output"
          "${WORKDIR}/kaggle-venv/bin/kaggle" kernels output "${TARGET_KERNEL}" -p "${WORKDIR}/output" >"${WORKDIR}/output.stdout" 2>"${WORKDIR}/output.stderr"
          test ! -s "${WORKDIR}/output.stderr"
          rm -f "${WORKDIR}/output.stdout" "${WORKDIR}/output.stderr"
          "${WORKDIR}/kaggle-venv/bin/python" - "${WORKDIR}/output" "${WORKDIR}/repo/${REQUEST_PATH}" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); request=json.load(open(sys.argv[2],encoding='utf-8'))
          expected=request['expected_outputs']; files=sorted(p.name for p in root.iterdir() if p.is_file())
          if files!=sorted(expected): raise SystemExit(f'output file set mismatch:{files}')
          for name,contract in expected.items():
              data=(root/name).read_bytes()
              if len(data)!=contract['bytes'] or hashlib.sha256(data).hexdigest()!=contract['sha256']:
                  raise SystemExit(f'exact output mismatch:{name}')
          print('CMI_FLU_E10_OUTPUT_RECOVERY_HASHES PASS files=3 exact=true')
          PY
          unset KAGGLE_API_TOKEN

      - name: Sanitize recovered aggregate output
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/repo/scripts" python3 "${WORKDIR}/repo/${SANITIZER_PATH}" --input-dir "${WORKDIR}/output"

      - name: Cleanup all recovered output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'CMI_FLU_E10_OUTPUT_RECOVERY_CLEANUP PASS raw_outputs_persisted=false'
