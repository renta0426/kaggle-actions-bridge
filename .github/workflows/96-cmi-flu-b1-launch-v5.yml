name: CMI-Flu B1 single-file CPU launch v5

on:
  push:
    branches:
      - main
    paths:
      - requests/cmi-flu-b1-launch-v5.json
  workflow_dispatch:

permissions: {}

# Serialize bridge admission/write jobs. Remote Kaggle compute can outlive this
# workflow, so the live Kaggle active-kernel check below remains authoritative.
concurrency:
  group: kaggle-resource-global
  queue: max

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b1-launch-v5.json
  SOURCE_PATH: scripts/cmi_flu_b1_kernel_impl.py
  SOURCE_BLOB: 5ef01cf2a7c4a4140bce0210151d407972b9e7f3
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-b1-anchor-single-file-20260902-005

jobs:
  validate:
    name: Validate immutable request 005 and single-file package
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate request, source blob, deterministic patch, and owner boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" || "${EVENT_NAME_VALUE}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - <<'PY'
          from __future__ import annotations
          import ast, hashlib, json, os, ssl, urllib.request

          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA_VALUE']}/"
          def read(path: str, limit: int) -> bytes:
              with urllib.request.urlopen(base + path, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"source exceeds byte budget: {path}")
              return data

          request = json.loads(read(os.environ["REQUEST_PATH"], 32768))
          if request["schema_version"] != 5 or request["request_id"] != "20260902-cmi-flu-b1-005":
              raise SystemExit("request id/schema mismatch")
          if request["parent_request_id"] != "20260902-cmi-flu-b1-004":
              raise SystemExit("parent request mismatch")
          if request["competition"] != os.environ["TARGET_COMPETITION"] or request["target"] != os.environ["TARGET_KERNEL"]:
              raise SystemExit("target mismatch")
          if request["operation"] != "kernel_run":
              raise SystemExit("operation mismatch")
          if request["packaging"] != {"python_files": 1, "code_file": "script.py"}:
              raise SystemExit("packaging mismatch")
          if request["concurrency"] != {"group": "kaggle-resource-global", "queue": "max"}:
              raise SystemExit("concurrency contract mismatch")
          if request["resource"] != {"accelerator": "cpu", "expected_runtime_minutes": 15, "hard_timeout_minutes": 30, "max_active_runs": 1}:
              raise SystemExit("resource mismatch")
          if request["api_budget"] != {"max_calls": 20, "poll_interval_seconds": 300, "max_pages": 2}:
              raise SystemExit("API budget mismatch")
          if request["side_effects"] != ["create one private notebook version and start one CPU run"]:
              raise SystemExit("side effect mismatch")
          if request["automatic_compute_retries"] != 0 or request["enable_internet"] is not False:
              raise SystemExit("retry/internet mismatch")
          source = request["source"]
          if source["path"] != os.environ["SOURCE_PATH"] or source["blob_sha"] != os.environ["SOURCE_BLOB"]:
              raise SystemExit("source allowlist mismatch")
          raw = read(source["path"], 100000)
          blob = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          if blob != source["blob_sha"]:
              raise SystemExit("source blob mismatch")
          text = raw.decode("utf-8")
          replacements = source.get("replacements")
          if not isinstance(replacements, list) or len(replacements) != 4:
              raise SystemExit("replacement manifest mismatch")
          for item in replacements:
              if set(item) != {"old", "new", "count"} or text.count(item["old"]) != item["count"]:
                  raise SystemExit("replacement occurrence mismatch")
              text = text.replace(item["old"], item["new"])
          compile(text, "script.py", "exec")
          imports = set()
          for node in ast.walk(ast.parse(text)):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          if imports & {"requests", "httpx", "socket", "subprocess", "urllib", "cmi_flu_b1_kernel_impl"}:
              raise SystemExit("patched source contains forbidden runtime imports")
          if "import cmi_flu_b1_kernel_impl" in text:
              raise SystemExit("sibling import remains")
          print(f"CMI_B1_005_VALIDATE PASS patched_sha256={hashlib.sha256(text.encode()).hexdigest()}")
          PY

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("Current Kaggle policy/API page reachability: PASS")
          PY

  launch:
    name: Admit or launch exactly one CPU run 005
    needs: validate
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" || "${EVENT_NAME_VALUE}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/96-cmi-flu-b1-launch-v5.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "Protected CMI-Flu request 005 boundary: PASS"

      - name: Prepare locked Kaggle CLI and deterministic single script
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, ssl, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA_VALUE']}/"
          def read(path: str, limit: int) -> bytes:
              with urllib.request.urlopen(base + path, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"source exceeds byte budget: {path}")
              return data
          request = json.loads(read(os.environ["REQUEST_PATH"], 32768))
          source = request["source"]
          raw = read(source["path"], 100000)
          blob = hashlib.sha1(b"blob " + str(len(raw)).encode() + b"\0" + raw).hexdigest()
          if blob != source["blob_sha"] or blob != os.environ["SOURCE_BLOB"]:
              raise SystemExit("source blob mismatch")
          text = raw.decode("utf-8")
          for item in source["replacements"]:
              if text.count(item["old"]) != item["count"]:
                  raise SystemExit("replacement occurrence mismatch")
              text = text.replace(item["old"], item["new"])
          compile(text, "script.py", "exec")
          if "import cmi_flu_b1_kernel_impl" in text:
              raise SystemExit("sibling import remains")
          (root / "script.py").write_text(text, encoding="utf-8")
          lock = read(os.environ["LOCK_RELATIVE_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines) or not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          print(f"PATCHED_SCRIPT sha256={hashlib.sha256(text.encode()).hexdigest()} bytes={len(text.encode())}")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version >/dev/null
          echo "Locked Kaggle CLI and request-005 single script prepared: PASS"

      - name: Fetch live Competition rules and determine admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live Competition policy pages unavailable")
          plain = lambda value: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", value)).casefold()
          rules = plain(content["rules"])
          evaluation = plain(content["evaluation"])
          data_text = " ".join(plain(content[name]) for name in content if "data" in name)
          if not all(term in rules for term in ("maximum of five (5) submissions per day", "maximum team size is five (5)", "data security", "external data and tools")):
              raise SystemExit("live Competition rules differ from approved guardrails")
          if not all(term in evaluation for term in ("mean spearman correlation", "40 donors", "-99")):
              raise SystemExit("live Competition evaluation differs from approved guardrails")
          if "sample_submission_part1.csv" not in data_text or "investigations_260821.tsv" not in data_text:
              raise SystemExit("live Competition data description differs from expected inputs")
          target = os.environ["TARGET_KERNEL"]
          existing = api.kernels_list(user="renta0426", search="cmi-flu-b1-anchor-single-file-20260902-005", page_size=5) or []
          if target in {str(getattr(item, "ref", "")) for item in existing}:
              raise SystemExit("target kernel already exists; duplicate refused")
          recent = api.kernels_list(user="renta0426", sort_by="dateRun", page_size=10) or []
          active = []
          for item in recent[:10]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              status = str(getattr(api.kernels_status(ref), "status", "")).upper()
              if "RUNNING" in status or "QUEUED" in status or "PENDING" in status:
                  active.append(ref)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              if active:
                  handle.write("can_launch=false\n")
              else:
                  handle.write("can_launch=true\n")
          if active:
              print(f"CMI_B1_005_DEFERRED active_count={len(active)} side_effect=false request_unexecuted=true")
          else:
              print(f"LIVE_RULE_PREFLIGHT PASS pages={len(content)} active=0 accelerator=cpu internet=false")
          PY

      - name: Record deferred admission
        if: steps.admission.outputs.can_launch == 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "CMI_B1_005_DEFERRED no Kaggle write occurred; manually dispatch the same immutable request after the active kernel clears and approve the protected Environment again."
          printf '%s\n' '## CMI-Flu B1 request 005 deferred' '' '- Another Kaggle kernel is active.' '- No `kernels push` call was made.' '- Request `20260902-cmi-flu-b1-005` remains unexecuted.' '- Manual redispatch requires a fresh Environment approval.' >> "${GITHUB_STEP_SUMMARY}"

      - name: Materialize exactly one Python file and push once
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"
          mkdir -p "${kernel_dir}"
          cp "${WORKDIR}/script.py" "${kernel_dir}/script.py"
          "${WORKDIR}/venv/bin/python" - "${kernel_dir}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = {
              "id": os.environ["TARGET_KERNEL"],
              "title": "CMI Flu B1 Anchor Single File 20260902 005",
              "code_file": "script.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "",
              "dataset_sources": [],
              "competition_sources": [os.environ["TARGET_COMPETITION"]],
              "kernel_sources": [],
              "model_sources": [],
          }
          (root / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          python_count="$(find "${kernel_dir}" -maxdepth 1 -type f -name '*.py' | wc -l)"
          [[ "${python_count}" -eq 1 ]]
          [[ -f "${kernel_dir}/script.py" && ! -L "${kernel_dir}/script.py" ]]
          [[ ! -e "${kernel_dir}/cmi_flu_b1_kernel_impl.py" ]]
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 1800 >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: Kaggle kernel push/run failed; response suppressed"
            exit 1
          fi
          echo "KERNEL_LAUNCH PASS request_id=20260902-cmi-flu-b1-005 target=${TARGET_KERNEL} accelerator=cpu internet=false python_files=1 automatic_retries=0 timeout=1800"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "Runner-local CMI-Flu request-005 content removed"
