name: Poisoned Chalice P1-03 post-5k transport-name repair v3

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-post-5k-transport-name-repair-v3.yml
      - requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-post-5k-transport-name-repair-v3.yml
      - requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  SOURCE_REQUEST_PATH: requests/poisoned-chalice-p1-03-post-5k-development-audit-v1.json
  REPAIR_REQUEST_PATH: requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json
  LAUNCHER_PATH: runners/poisoned_chalice/p1_03_post_5k_development_audit_v1.py
  IDENTITY_PATH: scripts/kaggle_exact_identity.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  OLD_TARGET: renta0426/poisoned-chalice-p1-03-post-5k-development-audit-v1
  TARGET: renta0426/poisoned-chalice-p1-03-post-5k-dev-audit-v1
  REPAIRED_TITLE: Poisoned Chalice P1-03 Post-5K Dev Audit V1

jobs:
  validate:
    name: Validate metadata-only transport repair without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce secret-free repair boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: $name"; exit 1; }
          done
          source_sha="$EVENT_SHA"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then source_sha="$PR_HEAD_SHA"; fi
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$workdir/kernel" >> "$GITHUB_ENV"

      - name: Fetch exact bridge bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SOURCE_SHA" "$WORKDIR" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]
          root=pathlib.Path(root_value)
          files={
            'requests/poisoned-chalice-p1-03-post-5k-development-audit-v1.json':65536,
            'requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json':65536,
            'runners/poisoned_chalice/p1_03_post_5k_development_audit_v1.py':131072,
            'scripts/kaggle_exact_identity.py':65536,
            'requirements/kaggle-2.2.4.lock':65536,
          }
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for path,maximum in files.items():
              url=f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}'
              req=urllib.request.Request(url,headers={'User-Agent':'p1-03-post5k-transport-repair-v3/1'})
              with opener.open(req,timeout=30) as response:data=response.read(maximum+1)
              if not data or len(data)>maximum:raise SystemExit(f'bridge source byte budget failed:{path}')
              out=root/pathlib.Path(path).name
              out.write_bytes(data)
              if path.endswith('.py'):compile(data,path,'exec')
          PY

      - name: Install locked Kaggle client and materialize frozen science Notebook
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORKDIR/venv"
          "$WORKDIR/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "$WORKDIR/kaggle-2.2.4.lock" >/dev/null
          "$WORKDIR/venv/bin/python" -m pip check >/dev/null
          "$WORKDIR/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          "$WORKDIR/venv/bin/python" "$WORKDIR/p1_03_post_5k_development_audit_v1.py" --static --request "$WORKDIR/poisoned-chalice-p1-03-post-5k-development-audit-v1.json"
          "$WORKDIR/venv/bin/python" "$WORKDIR/p1_03_post_5k_development_audit_v1.py" --materialize --request "$WORKDIR/poisoned-chalice-p1-03-post-5k-development-audit-v1.json" --kernel-dir "$KERNEL_DIR"

      - name: Prove repair changes transport metadata only
        shell: bash
        run: |
          set -euo pipefail
          "$WORKDIR/venv/bin/python" - "$WORKDIR/poisoned-chalice-p1-03-post-5k-development-audit-v1.json" "$WORKDIR/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json" "$KERNEL_DIR" <<'PY'
          import hashlib,json,pathlib,sys
          from slugify import slugify
          source_path,repair_path,kernel_value=sys.argv[1:]
          source=json.load(open(source_path)); repair=json.load(open(repair_path)); kernel=pathlib.Path(kernel_value)
          expected_equal=(
              'schema_version','competition','operation','launcher_path','research_repository','research_commit',
              'research_files','inputs','resource','persistent_outputs','automatic_compute_retries','enable_internet',
              'competition_submission','select_as_final','clean_room','scientific_contract')
          for key in expected_equal:
              if source[key]!=repair[key]:raise SystemExit(f'scientific/request field changed:{key}')
          if source['request_id']!='20260910-poisoned-chalice-p1-03-post-5k-development-audit-v1-001':raise SystemExit('source request id changed')
          if repair['request_id']!='20260910-poisoned-chalice-p1-03-post-5k-dev-audit-v1-002':raise SystemExit('repair request id changed')
          if source['target']!='renta0426/poisoned-chalice-p1-03-post-5k-development-audit-v1':raise SystemExit('source target changed')
          if repair['target']!='renta0426/poisoned-chalice-p1-03-post-5k-dev-audit-v1':raise SystemExit('repair target changed')
          if repair['title']!='Poisoned Chalice P1-03 Post-5K Dev Audit V1':raise SystemExit('repair title changed')
          old_slug=source['target'].split('/',1)[1]; new_slug=repair['target'].split('/',1)[1]
          meta_path=kernel/'kernel-metadata.json'; meta=json.loads(meta_path.read_text())
          old_title=meta['title']; code_path=kernel/meta['code_file']
          if meta['id']!=source['target']:raise SystemExit('materialized source target mismatch')
          if len(old_slug)!=51 or len(old_title)!=51:raise SystemExit('failed transport length provenance changed')
          if len(new_slug)!=43 or len(repair['title'])!=43:raise SystemExit('repaired transport length changed')
          if slugify(old_title)!=old_slug or slugify(repair['title'])!=new_slug:raise SystemExit('title/slug resolution mismatch')
          if len(new_slug)>=len(old_slug) or len(repair['title'])>=len(old_title):raise SystemExit('transport name was not shortened')
          before=hashlib.sha256(code_path.read_bytes()).hexdigest(); original=dict(meta)
          meta['id']=repair['target']; meta['title']=repair['title']
          meta_path.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          after=hashlib.sha256(code_path.read_bytes()).hexdigest()
          if before!=after:raise SystemExit('Notebook body changed during transport repair')
          changed={key for key in set(original)|set(meta) if original.get(key)!=meta.get(key)}
          if changed!={'id','title'}:raise SystemExit(f'unexpected metadata fields changed:{sorted(changed)}')
          if meta['is_private'] is not True or meta['enable_gpu'] is not False or meta['enable_tpu'] is not False or meta['enable_internet'] is not True:raise SystemExit('execution metadata contract changed')
          if meta['dataset_sources']!=['renta0426/stage1-raw-fim-submission-v1-output']:raise SystemExit('dataset source changed')
          if meta['kernel_sources']!=['renta0426/poisoned-chalice-lumia-hidden-state-cache-5000-v1','renta0426/poisoned-chalice-lumia-hidden-state-eval-5000-v1']:raise SystemExit('kernel sources changed')
          tr=repair['transport_repair']
          if tr['kind']!='metadata_name_only' or tr['previous_write_observed'] is not False or tr['previous_compute_started'] is not False or tr['notebook_body_must_remain_byte_identical'] is not True or tr['science_formulas_changed'] is not False:raise SystemExit('transport repair provenance changed')
          print(f'P1_03_TRANSPORT_REPAIR_VALIDATE PASS old_len=51 new_len=43 notebook_sha256={before} metadata_changed=id,title write_calls=0')
          PY

      - name: Verify locked client SaveKernel path without credentials
        shell: bash
        run: |
          set -euo pipefail
          "$WORKDIR/venv/bin/python" - <<'PY'
          import inspect
          from kaggle.api.kaggle_api_extended import KaggleApi
          source=inspect.getsource(KaggleApi.kernels_push)
          for token in ('request.slug = slug','request.new_title','save_kernel(request)'):
              assert token in source, token
          assert callable(getattr(KaggleApi,'dataset_status',None))
          assert callable(getattr(KaggleApi,'kernels_list',None))
          assert callable(getattr(KaggleApi,'kernels_status',None))
          print('P1_03_TRANSPORT_REPAIR_CLIENT_GATE PASS kaggle=2.2.4 write_calls=0')
          PY

      - name: Cleanup validation material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"

  launch:
    name: Launch approved metadata-only transport repair exactly once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$EVENT_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-p1-03-post-5k-transport-name-repair-v3.yml@refs/heads/main" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          echo "P1_03_TRANSPORT_REPAIR_BOUNDARY PASS cpu=1 retries=0 submissions=0"

      - name: Fetch exact bundle and build repaired transport metadata
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"
          echo "SOURCE_SHA=$EVENT_SHA" >> "$GITHUB_ENV"
          echo "KERNEL_DIR=$workdir/kernel" >> "$GITHUB_ENV"
          python3 - "$EVENT_SHA" "$workdir" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value)
          files={
            'requests/poisoned-chalice-p1-03-post-5k-development-audit-v1.json':65536,
            'requests/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json':65536,
            'runners/poisoned_chalice/p1_03_post_5k_development_audit_v1.py':131072,
            'scripts/kaggle_exact_identity.py':65536,
            'requirements/kaggle-2.2.4.lock':65536,
          }
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for path,maximum in files.items():
              url=f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}'
              req=urllib.request.Request(url,headers={'User-Agent':'p1-03-post5k-transport-repair-v3-launch/1'})
              with opener.open(req,timeout=30) as response:data=response.read(maximum+1)
              if not data or len(data)>maximum:raise SystemExit(f'bridge source byte budget failed:{path}')
              out=root/pathlib.Path(path).name; out.write_bytes(data)
              if path.endswith('.py'):compile(data,path,'exec')
          PY
          python3 -m venv "$workdir/venv"
          "$workdir/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "$workdir/kaggle-2.2.4.lock" >/dev/null
          "$workdir/venv/bin/python" -m pip check >/dev/null
          "$workdir/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          "$workdir/venv/bin/python" "$workdir/p1_03_post_5k_development_audit_v1.py" --static --request "$workdir/poisoned-chalice-p1-03-post-5k-development-audit-v1.json"
          "$workdir/venv/bin/python" "$workdir/p1_03_post_5k_development_audit_v1.py" --materialize --request "$workdir/poisoned-chalice-p1-03-post-5k-development-audit-v1.json" --kernel-dir "$workdir/kernel"
          "$workdir/venv/bin/python" - "$workdir/poisoned-chalice-p1-03-post-5k-development-audit-v1.json" "$workdir/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json" "$workdir/kernel" <<'PY'
          import hashlib,json,pathlib,sys
          from slugify import slugify
          source=json.load(open(sys.argv[1])); repair=json.load(open(sys.argv[2])); kernel=pathlib.Path(sys.argv[3])
          equal_keys=('schema_version','competition','operation','launcher_path','research_repository','research_commit','research_files','inputs','resource','persistent_outputs','automatic_compute_retries','enable_internet','competition_submission','select_as_final','clean_room','scientific_contract')
          for key in equal_keys:
              if source[key]!=repair[key]:raise SystemExit(f'scientific/request field changed:{key}')
          meta_path=kernel/'kernel-metadata.json'; meta=json.loads(meta_path.read_text()); old=dict(meta); code=kernel/meta['code_file']
          before=hashlib.sha256(code.read_bytes()).hexdigest()
          if meta['id']!=source['target'] or len(meta['id'].split('/',1)[1])!=51 or len(meta['title'])!=51:raise SystemExit('failed transport provenance mismatch')
          if repair['target']!='renta0426/poisoned-chalice-p1-03-post-5k-dev-audit-v1' or repair['title']!='Poisoned Chalice P1-03 Post-5K Dev Audit V1':raise SystemExit('repaired transport identity mismatch')
          if len(repair['target'].split('/',1)[1])!=43 or len(repair['title'])!=43 or slugify(repair['title'])!=repair['target'].split('/',1)[1]:raise SystemExit('repaired transport length/slug gate failed')
          meta['id']=repair['target']; meta['title']=repair['title']; meta_path.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          after=hashlib.sha256(code.read_bytes()).hexdigest(); changed={k for k in set(old)|set(meta) if old.get(k)!=meta.get(k)}
          if before!=after or changed!={'id','title'}:raise SystemExit('transport repair modified scientific Notebook or extra metadata')
          if meta['is_private'] is not True or meta['enable_gpu'] is not False or meta['enable_tpu'] is not False or meta['enable_internet'] is not True:raise SystemExit('execution metadata contract changed')
          print(f'P1_03_TRANSPORT_REPAIR_MATERIAL PASS notebook_sha256={before} old_len=51 new_len=43 metadata_changed=id,title')
          PY

      - name: Live contract and resource preflight
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json" <<'PY'
          import json,re,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,safe_exception,status_name,verify_current
          request=json.load(open(sys.argv[1])); api=KaggleApi(); api.authenticate()
          if request['request_id']!='20260910-poisoned-chalice-p1-03-post-5k-dev-audit-v1-002':raise SystemExit('repair request id changed')
          if request['target']!='renta0426/poisoned-chalice-p1-03-post-5k-dev-audit-v1' or request['title']!='Poisoned Chalice P1-03 Post-5K Dev Audit V1':raise SystemExit('repair transport identity changed')
          if request['resource']['accelerator']!='cpu' or request['automatic_compute_retries']!=0 or request['competition_submission'] is not False:raise SystemExit('resource/write contract changed')
          pages=api.competition_list_pages(request['competition']) or []; content={}
          for page in pages:
              data=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(data.get('name') or '').strip().lower()
              if name:content[name]=str(data.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in name for name in content):raise SystemExit('live competition contract pages unavailable')
          plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',content['evaluation'].replace(r'\%','%'))).casefold()
          if not all(token in plain for token in ('auc','novelty','1%','false-positive')):raise SystemExit('live evaluation contract changed')
          for source in request['inputs']['kernels']:
              if verify_current(api,source['ref'],int(source['version']),allow_failed=False,cpu=False)!='COMPLETE':raise SystemExit('kernel input not complete')
          dataset_payload=json.loads(api.dataset_status(request['inputs']['dataset']['ref'],format='json(current_version_number)'))
          observed=dataset_payload.get('current_version_number')
          if observed is None or int(observed)!=int(request['inputs']['dataset']['version']):raise SystemExit(f'dataset current version mismatch: observed={observed!r}')
          def require_absent(target):
              owner,slug=target.split('/',1)
              try:exact_metadata(api,target)
              except Exception as exc:
                  http=safe_exception(exc).get('http_status')
                  if http not in (403,404):raise SystemExit(f'target exact create-gate failed: http={http}')
              else:raise SystemExit('target already exists by exact metadata; refusing overwrite')
              visible=api.kernels_list(user=owner,search=slug,page_size=100) or []
              if len(visible)>=100:raise SystemExit('owner-scoped target search saturated')
              if any(str(getattr(x,'ref','') or '')==target for x in visible):raise SystemExit('target already exists by owner exact-ref discovery')
              return http,len(visible)
          old_http,old_rows=require_absent('renta0426/poisoned-chalice-p1-03-post-5k-development-audit-v1')
          new_http,new_rows=require_absent(request['target'])
          recent=(api.kernels_list(user='renta0426',sort_by='dateRun',page_size=25) or [])[:25]
          cpu_active=0; unknown=0; active_total=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:state=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if state not in ACTIVE:continue
              active_total+=1
              try:
                  meta=exact_metadata(api,ref); gpu=getattr(meta,'enable_gpu',None); tpu=getattr(meta,'enable_tpu',None)
                  if type(gpu) is not bool or type(tpu) is not bool:raise RuntimeError('accelerator unknown')
              except Exception:unknown+=1;continue
              if gpu is False and tpu is False:cpu_active+=1
          if unknown:raise SystemExit(f'CPU admission refused: unknown_active_classification={unknown}')
          if cpu_active>=int(request['resource']['max_active_runs']):raise SystemExit(f'CPU concurrency admission refused: cpu_active={cpu_active}')
          print(f'P1_03_TRANSPORT_REPAIR_PREFLIGHT PASS cpu_active={cpu_active} active_total={active_total} dataset_version={observed} old_target_absent=1 new_target_absent=1 old_http={old_http} new_http={new_http} old_rows={old_rows} new_rows={new_rows} write_calls=0')
          PY

      - name: Recheck and perform exactly one SaveKernel call
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/poisoned-chalice-p1-03-post-5k-dev-audit-v1-transport-repair.json" "$KERNEL_DIR" <<'PY'
          import hashlib,json,pathlib,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,exact_metadata_eventually,safe_exception,status_name
          request=json.load(open(sys.argv[1])); kernel_dir=pathlib.Path(sys.argv[2]); target=request['target']; owner,slug=target.split('/',1)
          meta_json=json.loads((kernel_dir/'kernel-metadata.json').read_text())
          if meta_json['id']!=target or meta_json['title']!=request['title'] or meta_json['is_private'] is not True or meta_json['enable_gpu'] is not False or meta_json['enable_tpu'] is not False or meta_json['enable_internet'] is not True:raise SystemExit('pre-write materialized metadata mismatch')
          api=KaggleApi(); api.authenticate()
          # Required write-immediate target absence recheck.
          try:exact_metadata(api,target)
          except Exception as exc:
              http=safe_exception(exc).get('http_status')
              if http not in (403,404):raise SystemExit(f'pre-write exact target check failed:http={http}')
          else:raise SystemExit('pre-write target exists by exact metadata; refusing overwrite')
          visible=api.kernels_list(user=owner,search=slug,page_size=100) or []
          if len(visible)>=100 or any(str(getattr(x,'ref','') or '')==target for x in visible):raise SystemExit('pre-write target absence not proven')
          # Required write-immediate CPU-class admission recheck.
          recent=(api.kernels_list(user=owner,sort_by='dateRun',page_size=25) or [])[:25]; cpu_active=0; unknown=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:state=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if state not in ACTIVE:continue
              try:
                  m=exact_metadata(api,ref); gpu=getattr(m,'enable_gpu',None); tpu=getattr(m,'enable_tpu',None)
                  if type(gpu) is not bool or type(tpu) is not bool:raise RuntimeError('unknown accelerator')
              except Exception:unknown+=1;continue
              if gpu is False and tpu is False:cpu_active+=1
          if unknown or cpu_active>=int(request['resource']['max_active_runs']):raise SystemExit(f'pre-write CPU admission refused:cpu_active={cpu_active} unknown={unknown}')
          # Exactly one resource-creating call. There is no retry loop.
          response=None; failure=None
          try:
              response=api.kernels_push(str(kernel_dir))
          except Exception as exc:
              failure=('exception',safe_exception(exc))
          else:
              error=str(getattr(response,'error','') or '')
              if error:failure=('response_error',{'error_sha256':hashlib.sha256(error.encode()).hexdigest(),'http_status':None})
          # Read-only reconciliation follows the single call regardless of its return path.
          discovered=api.kernels_list(user=owner,search=slug,page_size=100) or []
          exact_visible=any(str(getattr(x,'ref','') or '')==target for x in discovered)
          if failure and not exact_visible:
              kind,info=failure
              raise SystemExit(f"one-shot SaveKernel failed with no target observed: kind={kind} http={info.get('http_status')} error_sha256={info.get('error_sha256')} write_calls=1 write_observed=0 compute_started=0")
          try:
              meta=exact_metadata_eventually(api,target,attempts=6,delay_seconds=2.0)
          except Exception as exc:
              info=safe_exception(exc)
              raise SystemExit(f"SaveKernel reconciliation could not prove exact metadata: exact_visible={int(exact_visible)} http={info.get('http_status')} error_sha256={info.get('error_sha256')} write_calls=1")
          if getattr(meta,'ref',None)!=target or int(getattr(meta,'current_version_number',0))!=1:raise SystemExit('post-write exact target/version mismatch')
          if getattr(meta,'is_private',None) is not True or getattr(meta,'enable_gpu',None) is not False or getattr(meta,'enable_tpu',None) is not False or getattr(meta,'enable_internet',None) is not True:raise SystemExit('post-write execution metadata mismatch')
          state=status_name(getattr(api.kernels_status(target),'status',None))
          if state not in ACTIVE|{'COMPLETE','ERROR','CANCELLED','CANCELED'}:raise SystemExit('post-write unknown state')
          failure_kind=failure[0] if failure else 'none'
          print(f'P1_03_TRANSPORT_REPAIR_SAVE PASS target={target} version=1 cpu=1 private=1 state={state} write_calls=1 failure_return={failure_kind}')
          PY

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
          echo "P1_03_TRANSPORT_REPAIR_CLEANUP PASS retention_days=0"
