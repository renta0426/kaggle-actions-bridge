name: CMI-Flu E11b 005 source metadata read-only audit 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-e11b-005-source-metadata-audit-001.yml
      - requests/cmi-flu-e11b-005-source-metadata-audit-001.json
      - scripts/cmi_flu_e11b_005_source_metadata_audit.py
      - scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-e11b-005-source-metadata-audit-001.yml
      - requests/cmi-flu-e11b-005-source-metadata-audit-001.json
      - scripts/cmi_flu_e11b_005_source_metadata_audit.py
      - scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize.py

permissions: {}

concurrency:
  group: cmi-flu-e11b-005-source-metadata-audit-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260910-cmi-flu-e11b-005-source-metadata-audit-001
  TARGET_KERNEL: renta0426/cmi-flu-e11b-tabpfn3-20260910-005
  EXPECTED_VERSION: "1"
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate read-only metadata audit contract without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY TABPFN_TOKEN HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11b-metadata-audit/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1: raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts: raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Validate frozen audit manifest and source statically
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import ast,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          manifest=json.loads((root/'requests/cmi-flu-e11b-005-source-metadata-audit-001.json').read_text())
          assert manifest['request_id']=='20260910-cmi-flu-e11b-005-source-metadata-audit-001'
          assert manifest['parent_request_id']=='20260910-cmi-flu-strategy-e11b-tabpfn3-005'
          assert manifest['operation']=='kernel_metadata_source_projection_read'
          assert manifest['target']=='renta0426/cmi-flu-e11b-tabpfn3-20260910-005'
          assert manifest['expected_kernel_version']==1
          assert manifest['failed_bridge_run_id']==34448017644
          assert manifest['failed_bridge_job_id']==102777247400
          assert manifest['failed_bridge_commit']=='a4a488df14f1774cc69c98202eeba29442c210a1'
          assert manifest['known_failure']['savekernel_succeeded'] is True
          assert manifest['known_failure']['kernel_version_consumed'] is True
          assert manifest['audit_scope']['validator_repair_authorized_by_this_request'] is False
          assert manifest['new_write_attempted'] is False
          assert manifest['new_compute_requested'] is False
          assert manifest['competition_submission_attempted'] is False
          assert manifest['output_download_requested'] is False
          assert manifest['consumed_target_rerun_authorized'] is False
          assert manifest['automatic_compute_retries']==0
          assert manifest['side_effects']==[]

          source=(root/'scripts/cmi_flu_e11b_005_source_metadata_audit.py').read_text()
          tree=ast.parse(source)
          attrs=[node.func.attr for node in ast.walk(tree) if isinstance(node,ast.Call) and isinstance(node.func,ast.Attribute)]
          assert attrs.count('authenticate')==1
          assert attrs.count('kernel_metadata')==1
          forbidden={
            'kernels_push','kernels_output','kernel_output','competition_submit',
            'competition_submit_new','kernel_pull','kernels_pull','save_kernel',
          }
          assert forbidden.isdisjoint(attrs), sorted(forbidden.intersection(attrs))
          assert 'subprocess' not in {getattr(node,'module',None) for node in ast.walk(tree) if isinstance(node,ast.ImportFrom)}
          assert not any(isinstance(node,ast.Import) and any(alias.name=='subprocess' for alias in node.names) for node in ast.walk(tree))
          PY
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize.py"

      - name: Test audit projection and sanitizer with locked Kaggle API
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit.py" --self-test
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" - "${WORKDIR}/synthetic-output" <<'PY'
          import pathlib,sys
          import cmi_flu_e11b_005_source_metadata_audit as audit
          class Source:
              ref='prior-labsai/tabpfn-3/pytorch/default/1'
              source_type='MODEL'
              version_number=1
          class Metadata:
              ref=audit.TARGET
              current_version_number=1
              is_private=True
              enable_gpu=False
              enable_tpu=False
              enable_internet=True
              model_data_sources=[Source()]
              competition_data_sources=[{'ref': audit.EXPECTED_COMPETITION}]
          payload=audit.build_audit(Metadata())
          audit.validate_audit(payload)
          audit.write_audit(payload,pathlib.Path(sys.argv[1]))
          PY
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize.py" --output-dir "${WORKDIR}/synthetic-output"

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  audit:
    name: Read consumed E11b-005 source metadata only
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce protected read-only execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-e11b-005-source-metadata-audit-001.yml@refs/heads/main" ]]
          [[ "$RUNNER_ENVIRONMENT_VALUE" == "github-hosted" && "$RUNNER_OS_VALUE" == "Linux" && "$RUNNER_ARCH_VALUE" == "X64" ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"

      - name: Materialize exact approved bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11b-metadata-audit/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1: raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts: raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Install locked Kaggle API 2.2.4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Read exact consumed target metadata with no write or compute
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit.py" --output-dir "${WORKDIR}/output"
          unset KAGGLE_API_TOKEN

      - name: Sanitize and expose only the bounded metadata projection
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize.py" --output-dir "${WORKDIR}/output"
          python3 - "${WORKDIR}/output/source-metadata-audit.json" <<'PY'
          import json,pathlib,sys
          payload=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print('CMI_FLU_E11B_005_SOURCE_METADATA_RESULT '+json.dumps(payload,sort_keys=True,separators=(',',':')))
          PY

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
