name: CMI-Flu strategy E09a module teacher applicability CPU 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/240-cmi-flu-strategy-e09a-module-teacher-audit-001.yml
      - requests/cmi-flu-strategy-e09a-module-teacher-audit-001.json
      - payloads/cmi-flu-strategy-e09a-module-teacher-audit-001/**
      - scripts/cmi_flu_strategy_e09a_prepare.py
      - scripts/cmi_flu_strategy_e09a_execute.py
      - scripts/cmi_flu_strategy_e09a_sanitize.py
  pull_request:
    paths:
      - .github/workflows/240-cmi-flu-strategy-e09a-module-teacher-audit-001.yml
      - requests/cmi-flu-strategy-e09a-module-teacher-audit-001.json
      - payloads/cmi-flu-strategy-e09a-module-teacher-audit-001/**
      - scripts/cmi_flu_strategy_e09a_prepare.py
      - scripts/cmi_flu_strategy_e09a_execute.py
      - scripts/cmi_flu_strategy_e09a_sanitize.py

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260909-cmi-flu-strategy-e09a-module-teacher-audit-001
  SCIENCE_COMMIT: 537cc7fbcf668d8729010c8be304c4b1bb9b63a5
  E09A_BLOB: 37270a0a8aafc070d91b5f43fbea3ba169cd61b0
  E09A_SYNTHETIC_BLOB: 231a3739fd6015c61d389cce12ffa1a7aefb3f38
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate exact E09a runtime on synthetic data
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e09a-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(50_000_001)
          if len(data)>50_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Verify exact science relay and request contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          def git_blob(path):
              data=path.read_bytes(); return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          e09a=root/'payloads/cmi-flu-strategy-e09a-module-teacher-audit-001/strategy_e09a.py'
          synth=root/'payloads/cmi-flu-strategy-e09a-module-teacher-audit-001/strategy_e09a_synthetic.py'
          assert git_blob(e09a)=='37270a0a8aafc070d91b5f43fbea3ba169cd61b0'
          assert git_blob(synth)=='231a3739fd6015c61d389cce12ffa1a7aefb3f38'
          r=json.loads((root/'requests/cmi-flu-strategy-e09a-module-teacher-audit-001.json').read_text())
          assert r['request_id']=='20260909-cmi-flu-strategy-e09a-module-teacher-audit-001'
          assert r['target']=='renta0426/cmi-flu-e09a-module-teacher-audit-20260909-001'
          assert r['science_source_commit']=='537cc7fbcf668d8729010c8be304c4b1bb9b63a5'
          assert r['strategy_e09a_blob_sha']=='37270a0a8aafc070d91b5f43fbea3ba169cd61b0'
          assert r['strategy_e09a_synthetic_blob_sha']=='231a3739fd6015c61d389cce12ffa1a7aefb3f38'
          c=r['experiment_contract']
          assert c['direct_tasks']==['Task1.3','Task2.1','Task2.2','Task2.3']
          assert c['historical_serology_outcome_values_read'] is False
          assert c['model_fitting_authorized'] is False and c['module_gene_sets_frozen'] is False
          assert c['public_probe_authorized'] is False
          assert r['resource']=={'accelerator':'cpu','expected_runtime_minutes':90,'hard_timeout_minutes':150,'max_active_runs':1}
          assert r['api_budget']=={'max_calls':100,'poll_interval_seconds':120,'max_polls':80,'max_pages':2}
          assert r['expected_kernel_version']==1 and r['enable_internet'] is False
          assert r['competition_submission_attempted'] is False and r['leaderboard_used_for_selection'] is False and r['automatic_compute_retries']==0
          PY

      - name: Install E09a synthetic dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null

      - name: Build runtime and execute synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_sanitize.py"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_prepare.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          test ! -e "${WORKDIR}/synthetic"
          python3 "${WORKDIR}/runtime.py" --synthetic --output-dir "${WORKDIR}/synthetic"
          python3 - "${WORKDIR}/synthetic" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); assert sorted(p.name for p in root.iterdir())==['bridge-result.json','metrics.json','summary.md']
          b=json.loads((root/'bridge-result.json').read_text()); m=json.loads((root/'metrics.json').read_text())
          assert b['synthetic'] is True and b['science_commit']=='537cc7fbcf668d8729010c8be304c4b1bb9b63a5'
          assert b['strategy_e09a_blob_sha']=='37270a0a8aafc070d91b5f43fbea3ba169cd61b0'
          assert b['strategy_e09a_synthetic_blob_sha']=='231a3739fd6015c61d389cce12ffa1a7aefb3f38'
          assert m['experiment']=='strategy_v2_e09a_module_teacher_applicability_audit'
          assert m['outcome_values_accessed'] is False and m['competition_submission_attempted'] is False
          assert m['challenge_rna']['raw_day0_donors']==5 and m['challenge_rna']['batch_corrected_day0_donors']==4
          assert m['challenge_rna']['batch_corrected_has_negative_values'] is True
          assert m['decision']['e09b_hai_module_data_gate_ready'] is True
          assert m['decision']['task13_rna_module_data_gate_ready'] is False
          assert m['decision']['module_gene_sets_frozen'] is False and m['decision']['model_fitting_authorized_by_e09a'] is False
          for task in ('Task2.1','Task2.2','Task2.3'):
              assert m['task_readiness'][task]['direct_rna_teacher_data_ready'] is True
          text=(root/'metrics.json').read_text()
          for token in ('"participant_id"','"subject_group"','SYN_E09A_','"cdr3"','"sequence_id"'): assert token not in text
          PY
          ! grep -R -E 'kaggle[[:space:]]+competitions[[:space:]]+submit|competition_submit\(' \
            "${WORKDIR}/runtime.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_"* >/dev/null
          grep -F 'Path("/tmp")' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F '/kaggle/working/e09a-runtime' "${WORKDIR}/runtime.py" >/dev/null
          echo CMI_FLU_E09A_SYNTHETIC_PASS

      - name: Validate executor argv without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/argv-venv"
          "${WORKDIR}/argv-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          help=$(PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/argv-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_execute.py" --help)
          grep -F -- '--runtime' <<<"$help" >/dev/null
          grep -F -- '--bridge-root' <<<"$help" >/dev/null
          grep -F -- '--output-dir' <<<"$help" >/dev/null
          ! grep -F -- '--reference-dir' <<<"$help" >/dev/null
          echo CMI_FLU_E09A_EXECUTOR_ARGV_PASS

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one private CPU E09a audit and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/240-cmi-flu-strategy-e09a-module-teacher-audit-001.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e09a-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(50_000_001)
          if len(data)>50_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Check current public Kaggle policy pages
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/kaggle_policy_preflight.py"

      - name: Build exact E09a runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_prepare.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run one approved E09a CPU audit
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --bridge-root "${WORKDIR}/bridge" \
            --output-dir "${WORKDIR}/output"

      - name: Validate aggregate-only E09a result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e09a_sanitize.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
