name: CMI-Flu Strategy-v2 E12a final reproduction CPU 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-final-reproduction-001.yml
      - requests/cmi-flu-strategy-e12a-final-reproduction-001.json
      - payloads/cmi-flu-strategy-e12a-final-reproduction-001/strategy_e12a.py
      - scripts/cmi_flu_strategy_e12a_prepare.py
      - scripts/cmi_flu_strategy_e12a_execute.py
      - scripts/cmi_flu_strategy_e12a_sanitize.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-final-reproduction-001.yml
      - requests/cmi-flu-strategy-e12a-final-reproduction-001.json
      - payloads/cmi-flu-strategy-e12a-final-reproduction-001/strategy_e12a.py
      - scripts/cmi_flu_strategy_e12a_prepare.py
      - scripts/cmi_flu_strategy_e12a_execute.py
      - scripts/cmi_flu_strategy_e12a_sanitize.py

permissions: {}

concurrency:
  group: cmi-flu-e12a-final-reproduction-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260910-cmi-flu-strategy-e12a-final-reproduction-001
  TARGET_KERNEL: renta0426/cmi-flu-e12a-final-reproduction-20260910-001
  SCIENCE_COMMIT: f227694aee240a05de1b4e318a8c17acc2db5651
  E12A_BLOB: 84c9368d520b2b7f88f189d9d9a92a3306e54b0e
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate frozen E12a reproduction without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1: raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts: raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Verify request, exact science relay and Python surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import ast,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); request=json.loads((root/'requests/cmi-flu-strategy-e12a-final-reproduction-001.json').read_text())
          assert request['request_id']=='20260910-cmi-flu-strategy-e12a-final-reproduction-001'
          assert request['science_source_commit']=='f227694aee240a05de1b4e318a8c17acc2db5651'
          assert request['strategy_e12a_blob_sha']=='84c9368d520b2b7f88f189d9d9a92a3306e54b0e'
          assert request['resource']['accelerator']=='cpu' and request['resource']['max_active_runs']==1
          assert request['automatic_compute_retries']==0 and request['competition_submission_attempted'] is False
          data=(root/'payloads/cmi-flu-strategy-e12a-final-reproduction-001/strategy_e12a.py').read_bytes()
          found=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest(); assert found==request['strategy_e12a_blob_sha']
          assert b'REPRODUCTION_ABSOLUTE_TOLERANCE = 2e-6' in data
          for rel in ('scripts/cmi_flu_strategy_e12a_prepare.py','scripts/cmi_flu_strategy_e12a_execute.py','scripts/cmi_flu_strategy_e12a_sanitize.py'):
            source=(root/rel).read_text(); compile(source,rel,'exec')
          execute=ast.parse((root/'scripts/cmi_flu_strategy_e12a_execute.py').read_text())
          calls=[n.func.attr for n in ast.walk(execute) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)]
          assert calls.count('kernels_push')==1
          assert 'competition_submit' not in calls and 'competition_submit_new' not in calls
          PY
          python3 -m py_compile "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_prepare.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_execute.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_sanitize.py"

      - name: Build exact E12a runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_prepare.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${WORKDIR}/runtime.py")" -lt 900000 ]]
          grep -F 'SCIENCE_COMMIT = "f227694aee240a05de1b4e318a8c17acc2db5651"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'E12A_BLOB = "84c9368d520b2b7f88f189d9d9a92a3306e54b0e"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F '# CMI-Flu Strategy-v2 E12a final-system reproduction audit' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'kaggle competitions submit' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'competition_submit' "${WORKDIR}/runtime.py" >/dev/null

      - name: Exercise aggregate sanitizer and stale-summary rejection
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/fixture" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); root.mkdir()
          scores={'Task1.1':0.099707180,'Task1.2':0.527103,'Task1.3':0.106304108,'Task2.1':0.623449,'Task2.2':0.576506,'Task2.3':0.695731}
          portfolio={'Task1.1':'b21_pls_2','Task1.2':'task12_anchor_residual_et_d5_l5_sqrt_lambda0.5','Task1.3':'b21_pls_1','Task1.4':'raw_pre_vacc_conserved_anchor','Task2.1':'b21_et_subtype_d3_l5','Task2.2':'b21_et_subtype_d5_l10','Task2.3':'b21_ridge_exact_a100'}
          rows=[{'task':t,'incumbent':portfolio[t],'expected_study_equal_spearman':v,'observed_study_equal_spearman':v,'deviation':0.0,'absolute_deviation':0.0,'reproduced':True,'undefined_fold_count':0,'constant_fold_count':0} for t,v in scores.items()]
          metrics={'schema_version':1,'experiment':'strategy_v2_e12a_final_system_reproduction','comparison_contract':'paired_subject_purged_v2','supervised_reproduction':rows,'all_supervised_tasks_reproduced':True,'task14_contract':{'incumbent':'raw_pre_vacc_conserved_anchor','supervised_cv_available':False,'outcomes_accessed':False},'e11_task11_candidates_carried':[],'frozen_portfolio':portfolio,'portfolio_task_count':7,'new_model_selection_performed':False,'incumbent_changed':False,'public_probe_authorized':False,'competition_submission_authorized':False,'leaderboard_used_for_selection':False,'competition_submission_attempted':False,'contains_participant_identifiers':False,'contains_row_level_predictions':False,'next_step':'proceed_to_E12b_challenge_prediction_freeze'}
          (root/'metrics.json').write_text(json.dumps(metrics,indent=2,sort_keys=True)+'\n')
          lines=['# CMI-Flu Strategy-v2 E12a final-system reproduction audit','','Aggregate-only reproduction audit; no model selection, Public probe, or Competition submission was performed.','','- science commit: `f227694aee240a05de1b4e318a8c17acc2db5651`','- all supervised tasks reproduced: `true`','- next step: `proceed_to_E12b_challenge_prediction_freeze`','','## Supervised reproduction','']
          for r in rows: lines.append(f"- {r['task']}: incumbent `{r['incumbent']}`, expected={r['expected_study_equal_spearman']:.9f}, observed={r['observed_study_equal_spearman']:.9f}, abs_delta={r['absolute_deviation']:.9g}, reproduced=true")
          lines += ['','## Task1.4','','- incumbent: `raw_pre_vacc_conserved_anchor`','- supervised CV available: `false`','','## Frozen portfolio','']
          for t,n in portfolio.items(): lines.append(f'- {t}: `{n}`')
          (root/'summary.md').write_text('\n'.join(lines)+'\n')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          bridge={'schema_version':1,'request_id':'20260910-cmi-flu-strategy-e12a-final-reproduction-001','target_kernel':'renta0426/cmi-flu-e12a-final-reproduction-20260910-001','science_commit':'f227694aee240a05de1b4e318a8c17acc2db5651','strategy_e12a_blob_sha':'84c9368d520b2b7f88f189d9d9a92a3306e54b0e','metrics_sha256':sha(root/'metrics.json'),'summary_sha256':sha(root/'summary.md'),'competition_submission_attempted':False,'leaderboard_used_for_selection':False,'contains_participant_identifiers':False,'contains_row_level_predictions':False}
          (root/'bridge-result.json').write_text(json.dumps(bridge,indent=2,sort_keys=True)+'\n')
          PY
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_sanitize.py" --input-dir "${WORKDIR}/fixture"
          cp -r "${WORKDIR}/fixture" "${WORKDIR}/badfixture"
          printf '# CMI-Flu strategy E01 paired evaluation\nNone\n' > "${WORKDIR}/badfixture/summary.md"
          python3 - "${WORKDIR}/badfixture" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); p=root/'bridge-result.json'; b=json.loads(p.read_text()); b['summary_sha256']=hashlib.sha256((root/'summary.md').read_bytes()).hexdigest(); p.write_text(json.dumps(b,indent=2,sort_keys=True)+'\n')
          PY
          if python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_sanitize.py" --input-dir "${WORKDIR}/badfixture"; then echo 'stale summary unexpectedly accepted'; exit 1; fi
          echo 'CMI_FLU_E12A_SECRET_FREE_PASS exact_science=true summary_stale_rejected=true write=false compute=false'

      - name: Validate locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one private CPU E12a reproduction and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e12a-final-reproduction-001.yml@refs/heads/main" ]]

      - name: Materialize exact approved bridge commit and runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a-run/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1: raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts: raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_prepare.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "${WORKDIR}/venv/bin" >> "$GITHUB_PATH"

      - name: Run one approved E12a CPU kernel and recover current aggregate output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_execute.py" --runtime "${WORKDIR}/runtime.py" --output-dir "${WORKDIR}/output"
          unset KAGGLE_API_TOKEN

      - name: Validate E12a aggregate and summary contract
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_sanitize.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
