name: Poisoned Chalice Stage1 Track A1 existing-cache length audit

on:
  push:
    branches:
      - main
      - analysis/poisoned-chalice-track-a1-v1
    paths:
      - requests/poisoned-chalice-track-a1-length-audit-v1.json
      - scripts/poisoned_chalice_track_a1_length_audit.py
      - .github/workflows/124-poisoned-chalice-track-a1-length-audit-v1.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-track-a1-length-audit-v1.json
      - scripts/poisoned_chalice_track_a1_length_audit.py
      - .github/workflows/124-poisoned-chalice-track-a1-length-audit-v1.yml

permissions: {}

concurrency:
  group: poisoned-chalice-track-a1-readonly-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-track-a1-length-audit-v1.json
  ANALYZER_PATH: scripts/poisoned_chalice_track_a1_length_audit.py
  WORKFLOW_PATH: .github/workflows/124-poisoned-chalice-track-a1-length-audit-v1.yml
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  SOURCE_DATASET: renta0426/stage1-raw-fim-submission-v1-output

jobs:
  validate:
    name: Validate Track A1 request without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free GitHub-hosted boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY RESEARCH_REPO_READ_TOKEN AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          echo "TRACK_A1_SECRET_FREE_BOUNDARY PASS"

      - name: Fetch exact event files and statically validate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          from __future__ import annotations
          import ast, hashlib, json, pathlib, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          base = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"
          paths = {
              "requests/poisoned-chalice-track-a1-length-audit-v1.json": 32768,
              "scripts/poisoned_chalice_track_a1_length_audit.py": 131072,
              ".github/workflows/124-poisoned-chalice-track-a1-length-audit-v1.yml": 65536,
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )
          for path, limit in paths.items():
              url = base + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)

          request = json.loads((root / paths.keys().__iter__().__next__()).read_text())
          expected = {
              "schema_version": 1,
              "request_id": "20260903-poisoned-chalice-track-a1-length-audit-001",
              "competition": "poisoned-chalice-icse27",
              "operation": "private_dataset_read_cpu_analysis",
              "source_dataset": "renta0426/stage1-raw-fim-submission-v1-output",
              "source_dataset_version": 1,
              "analyzer_path": "scripts/poisoned_chalice_track_a1_length_audit.py",
              "analyzer_blob_sha": "4161063a67f9d464f30e16dcb2dbf9e85a60d14b",
              "analysis_contract": {
                  "train_rows": 10000,
                  "train_shards": 40,
                  "rows_per_shard": 250,
                  "feature_counts": {"base": 113, "structure_raw": 50, "fim": 11, "current_total": 174},
                  "expected_current_oof_auc": 0.664524,
                  "expected_current_oof_auc_tolerance": 0.002,
                  "variants": ["length_only", "raw_fim_current", "raw_fim_no_length", "raw_fim_log_replace", "raw_fim_log_add"],
                  "interaction_search": False,
                  "selection_inputs": ["source_10k_oof", "source_leave_one_language_out", "source_length_holdout", "source_10_seed_repeated_cv"],
              },
              "resource": {"remote_kaggle_compute": False, "runner_compute": "cpu", "max_active_kaggle_runs_blocking": 0},
              "api_budget": {"max_authenticated_calls": 35, "max_recent_kernels_inspected": 25, "max_pages": 2},
              "side_effects": [],
              "automatic_compute_retries": 0,
              "competition_submission": False,
              "public_leaderboard_read_for_selection": False,
              "visible_validation_read": False,
              "private_data_retention_days": 0,
              "public_artifacts": False,
          }
          if request != expected:
              raise SystemExit("Track A1 request differs from exact contract")

          analyzer = (root / request["analyzer_path"]).read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(analyzer)).encode() + b"\0" + analyzer).hexdigest()
          if blob != request["analyzer_blob_sha"]:
              raise SystemExit("Track A1 analyzer Git blob mismatch")
          source = analyzer.decode("utf-8")
          tree = ast.parse(source)
          compile(source, request["analyzer_path"], "exec")
          required_markers = (
              "EXPECTED_BASELINE_AUC = 0.664524",
              '"raw_fim_current"', '"raw_fim_no_length"',
              '"raw_fim_log_replace"', '"raw_fim_log_add"',
              "interaction_search_performed\": False",
              "visible_validation_loaded\": False",
              "public_leaderboard_used\": False",
              "competition_submission_created\": False",
          )
          if any(marker not in source for marker in required_markers):
              raise SystemExit("Track A1 analyzer invariant missing")
          forbidden = (
              "KAGGLE_API_TOKEN", "competitions submit", "kernels push",
              "datasets create", "datasets version", "validation_scores",
          )
          if any(marker in source for marker in forbidden):
              raise SystemExit("Track A1 analyzer gained forbidden capability")
          for node in ast.walk(tree):
              if isinstance(node, ast.Import) and any(alias.name.startswith(("kaggle", "requests", "urllib")) for alias in node.names):
                  raise SystemExit("Track A1 analyzer gained network import")
              if isinstance(node, ast.ImportFrom) and str(node.module or "").startswith(("kaggle", "requests", "urllib")):
                  raise SystemExit("Track A1 analyzer gained network import")
          workflow = (root / ".github/workflows/124-poisoned-chalice-track-a1-length-audit-v1.yml").read_text()
          for marker in (
              "permissions: {}", "environment: kaggle-readonry",
              "poisoned-chalice-track-a1-readonly-", "side_effects",
          ):
              if marker not in workflow and marker != "side_effects":
                  raise SystemExit(f"workflow invariant missing: {marker}")
          for forbidden_marker in (
              "kaggle-resource-global", "kernels push", "competitions submit",
              "datasets create", "datasets version", "actions/upload-artifact",
              "actions/cache", "continue-on-error: true",
          ):
              if forbidden_marker in workflow:
                  raise SystemExit(f"workflow gained forbidden operation: {forbidden_marker}")
          print("TRACK_A1_STATIC PASS variants=5 remote_compute=false side_effects=0")
          PY

  audit:
    name: Read private cached features and run CPU-only Track A1 audit
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/124-poisoned-chalice-track-a1-length-audit-v1.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_TRACK_A1_BOUNDARY PASS remote_compute=false side_effects=0"

      - name: Prepare exact request, analyzer, locked Kaggle CLI, and CPU environment
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          base = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"
          files = {
              "requests/poisoned-chalice-track-a1-length-audit-v1.json": 32768,
              "scripts/poisoned_chalice_track_a1_length_audit.py": 131072,
              "requirements/kaggle-2.2.4.lock": 65536,
          }
          for path, limit in files.items():
              url = base + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          request = json.loads((root / "requests/poisoned-chalice-track-a1-length-audit-v1.json").read_text())
          analyzer = (root / request["analyzer_path"]).read_bytes()
          blob = hashlib.sha1(b"blob " + str(len(analyzer)).encode() + b"\0" + analyzer).hexdigest()
          if blob != request["analyzer_blob_sha"]:
              raise SystemExit("analyzer Git blob mismatch")
          lock = (root / "requirements/kaggle-2.2.4.lock").read_text(encoding="utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          PY
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/requirements/kaggle-2.2.4.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

          python3 -m venv "${workdir}/analysis-venv"
          "${workdir}/analysis-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            numpy==2.3.2 pandas==2.3.2 pyarrow==21.0.0 scikit-learn==1.7.1 >/dev/null
          "${workdir}/analysis-venv/bin/python" -m pip check >/dev/null
          echo "TRACK_A1_CLIENTS PASS kaggle=2.2.4 cpu_analysis=true"

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Read exact private Dataset v1 and run aggregate-only CPU audit
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          dataset_dir="${WORKDIR}/private-dataset"
          output_dir="${WORKDIR}/aggregate-output"
          mkdir -p "${dataset_dir}" "${output_dir}"

          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.datasets.types.dataset_api_service import ApiGetDatasetRequest

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition rules/evaluation unavailable")
          evaluation = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["evaluation"].replace(r"\%", "%"))).casefold()
          if not all(term in evaluation for term in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("live evaluation contract changed")
          rules = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["rules"])).casefold()
          for phrase in (
              "external data is not allowed", "external data are not allowed",
              "internet access is prohibited", "internet must be disabled",
          ):
              if phrase in rules:
                  raise SystemExit(f"live rule conflict: {phrase}")

          with api.build_kaggle_client() as client:
              request = ApiGetDatasetRequest()
              request.owner_slug = "renta0426"
              request.dataset_slug = "stage1-raw-fim-submission-v1-output"
              detail = client.datasets.dataset_api_client.get_dataset(request)
          version = int(getattr(detail, "current_version_number", 0))
          if version != 1 or not bool(getattr(detail, "is_private", False)):
              raise SystemExit(f"source Dataset version/privacy changed: version={version}")

          active = 0
          uncertain = 0
          for item in (api.kernels_list(user="renta0426", sort_by="dateRun", page_size=25) or [])[:25]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              try:
                  state = str(getattr(api.kernels_status(ref), "status", "")).upper()
              except Exception:
                  uncertain += 1
                  continue
              if any(token in state for token in ("RUNNING", "QUEUED", "PENDING")):
                  active += 1
          print(
              "TRACK_A1_LIVE_PREFLIGHT PASS dataset_version=1 private=true "
              f"active_kaggle_runs={active} uncertain_status_reads={uncertain} "
              "remote_compute_blocking=false"
          )
          PY

          set +e
          "${WORKDIR}/kaggle-venv/bin/kaggle" datasets download \
            -d "${SOURCE_DATASET}" -p "${dataset_dir}" --unzip \
            >"${WORKDIR}/dataset.stdout" 2>"${WORKDIR}/dataset.stderr"
          download_rc=$?
          set -e
          rm -f "${WORKDIR}/dataset.stdout" "${WORKDIR}/dataset.stderr"
          if [[ "${download_rc}" -ne 0 ]]; then
            echo "TRACK_A1_DATASET_READ FAIL response_logged=false"
            exit 1
          fi

          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.datasets.types.dataset_api_service import ApiGetDatasetRequest
          api = KaggleApi(); api.authenticate()
          with api.build_kaggle_client() as client:
              request = ApiGetDatasetRequest(); request.owner_slug = "renta0426"; request.dataset_slug = "stage1-raw-fim-submission-v1-output"
              detail = client.datasets.dataset_api_client.get_dataset(request)
          if int(getattr(detail, "current_version_number", 0)) != 1:
              raise SystemExit("source Dataset changed during read")
          print("TRACK_A1_DATASET_READ PASS version=1")
          PY

          "${WORKDIR}/analysis-venv/bin/python" "${WORKDIR}/${ANALYZER_PATH}" \
            --dataset-root "${dataset_dir}" \
            --output-dir "${output_dir}"

          python3 - "${output_dir}" <<'PY'
          from __future__ import annotations
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              "metrics.csv", "language_metrics.csv", "repeated_cv.csv",
              "repeated_cv_summary.csv", "candidate_gates.csv",
              "evaluation_summary.json",
          }
          observed = {path.name for path in root.iterdir() if path.is_file()}
          if observed != expected:
              raise SystemExit("Track A1 aggregate output allowlist changed")
          summary = json.loads((root / "evaluation_summary.json").read_text())
          for key in (
              "visible_validation_loaded", "visible_validation_used",
              "public_leaderboard_used", "competition_submission_created",
              "gpu_or_tpu_compute_used", "interaction_search_performed",
          ):
              if summary.get(key) is not False:
                  raise SystemExit(f"Track A1 boundary changed: {key}")
          if summary.get("train_rows") != 10000 or summary.get("source_dataset_version") != 1:
              raise SystemExit("Track A1 source coverage changed")
          print("TRACK_A1_BOUNDARY PASS private_rows_logged=false artifacts=false submission=false")
          PY

      - name: Cleanup all runner-local private data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "TRACK_A1_PRIVATE_DATA_REMOVED retention_days=0"
