name: CMI-Flu B1 competition submission

on:
  push:
    branches:
      - main
    paths:
      - requests/cmi-flu-b1-submit-v1.json

permissions: {}

concurrency:
  group: kaggle-write-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b1-submit-v1.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-b1-anchor-20260902-001
  SUBMISSION_MESSAGE: "B1 same-readout anchor | request 20260902-cmi-flu-b1-001"

jobs:
  submit:
    name: Verify B1 output and create exactly one Competition submission
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/72-cmi-flu-b1-submit.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "Protected CMI-Flu B1 submission boundary: PASS"

      - name: Validate fixed submission request and prepare locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          request_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA_VALUE}/${REQUEST_PATH}"
          lock_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA_VALUE}/${LOCK_RELATIVE_PATH}"
          python3 - "${request_url}" "${lock_url}" "${workdir}/request.json" "${workdir}/kaggle.lock" <<'PY'
          from __future__ import annotations
          import json
          import re
          import ssl
          import sys
          import urllib.request
          from urllib.parse import urlparse

          request_url, lock_url, request_output, lock_output = sys.argv[1:]

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(url: str, limit: int) -> bytes:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected raw source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit("input exceeds fixed byte budget")
              return data

          raw_request = read(request_url, 16384)
          request = json.loads(raw_request)
          expected_keys = {
              "schema_version", "request_id", "parent_request_id", "status_request_id",
              "competition", "operation", "target_kernel", "output_file",
              "submission_sha256", "message", "api_budget", "side_effects",
              "automatic_compute_retries", "rules_checked_at_utc",
          }
          if set(request) != expected_keys:
              raise SystemExit("submission request fields differ from fixed schema")
          fixed = {
              "schema_version": 1,
              "request_id": "20260902-cmi-flu-b1-submit-001",
              "parent_request_id": "20260902-cmi-flu-b1-001",
              "status_request_id": "20260902-cmi-flu-b1-status-001",
              "competition": "cmi-flu-first-prediction-challenge",
              "operation": "competition_submit",
              "target_kernel": "renta0426/cmi-flu-b1-anchor-20260902-001",
              "output_file": "submission.csv",
              "message": "B1 same-readout anchor | request 20260902-cmi-flu-b1-001",
              "api_budget": {"max_calls": 12, "max_pages": 1},
              "side_effects": ["create one competition submission"],
              "automatic_compute_retries": 0,
          }
          for key, value in fixed.items():
              if request.get(key) != value:
                  raise SystemExit(f"submission request mismatch: {key}")
          if not re.fullmatch(r"[0-9a-f]{64}", str(request["submission_sha256"])):
              raise SystemExit("submission SHA-256 is invalid")
          if not re.fullmatch(r"2026-09-02T\d{2}:\d{2}:\d{2}Z", str(request["rules_checked_at_utc"])):
              raise SystemExit("rules_checked_at_utc is invalid")
          open(request_output, "wb").write(raw_request)

          lock_data = read(lock_url, 65536)
          lock_text = lock_data.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock_text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          open(lock_output, "w", encoding="utf-8").write(lock_text)
          print("Fixed CMI-Flu B1 submission request: PASS")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps \
            --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/python" -c 'import kaggle; assert kaggle.__version__ == "2.2.4"'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl
          import urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("Current Kaggle policy/API page reachability: PASS")
          PY

      - name: Live Competition rule, submission-limit, and idempotency preflight
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import json
          import os
          import re
          from kaggle.api.kaggle_api_extended import KaggleApi

          competition = os.environ["TARGET_COMPETITION"]
          message = os.environ["SUBMISSION_MESSAGE"]
          request = json.load(open(os.path.join(os.environ["WORKDIR"], "request.json"), encoding="utf-8"))
          if request["message"] != message:
              raise SystemExit("request message differs from fixed workflow message")

          api = KaggleApi()
          api.authenticate()
          pages = api.competition_list_pages(competition) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition rules/evaluation unavailable")
          data_pages = [name for name in content if "data" in name]
          if not data_pages:
              raise SystemExit("live Competition data description unavailable")

          def plain(text: str) -> str:
              return re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", text)).casefold()

          rules = plain(content["rules"])
          evaluation = plain(content["evaluation"])
          if "maximum of five (5) submissions per day" not in rules:
              raise SystemExit("live submission limit differs from approved assumption")
          if not all(term in rules for term in ("data security", "external data and tools")):
              raise SystemExit("live Competition rules differ from approved guardrails")
          if not all(term in evaluation for term in ("mean spearman correlation", "40 donors", "-99")):
              raise SystemExit("live Competition evaluation differs from approved guardrails")

          limits = api.competition_get_submission_limits(competition)
          allowed = int(getattr(limits, "num_allowed_now", 0) or 0)
          today = int(getattr(limits, "num_today", 0) or 0)
          total = int(getattr(limits, "num_total", 0) or 0)
          if allowed < 1:
              raise SystemExit("Kaggle reports no submission slot available now")
          if today >= 5:
              raise SystemExit("daily Competition submission limit reached")

          history = api.competition_submissions(competition) or []
          duplicate = False
          for item in history:
              data = item.to_dict() if hasattr(item, "to_dict") else dict(item)
              description = str(data.get("description") or "")
              if description == message:
                  duplicate = True
                  break
          if duplicate:
              raise SystemExit("matching B1 submission already exists; duplicate request refused")
          print(f"SUBMISSION_PREFLIGHT PASS allowed_now={allowed} submissions_today={today} lifetime={total}")
          PY

      - name: Download and verify only the fixed B1 output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          output_dir="${WORKDIR}/output"
          mkdir -p "${output_dir}"
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels output "${TARGET_KERNEL}" \
            -p "${output_dir}" -q -o --page-size 20 \
            --file-pattern '^(bridge-result\.json|submission\.csv)$' \
            >"${WORKDIR}/output.stdout" 2>"${WORKDIR}/output.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/output.stdout" "${WORKDIR}/output.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: bounded B1 output download failed; response suppressed"
            exit 1
          fi

          "${WORKDIR}/venv/bin/python" - "${output_dir}" "${WORKDIR}/request.json" <<'PY'
          from __future__ import annotations
          import csv
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          request = json.load(open(sys.argv[2], encoding="utf-8"))
          files = {path.name for path in root.rglob("*") if path.is_file()}
          if files != {"bridge-result.json", "submission.csv"}:
              raise SystemExit(f"output file allowlist mismatch: {sorted(files)}")
          metadata_path = next(root.rglob("bridge-result.json"))
          submission_path = next(root.rglob("submission.csv"))
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if metadata.get("request_id") != "20260902-cmi-flu-b1-001":
              raise SystemExit("B1 metadata request mismatch")
          if metadata.get("competition") != "cmi-flu-first-prediction-challenge":
              raise SystemExit("B1 metadata competition mismatch")
          if metadata.get("kernel_stage") != "b1_anchor" or metadata.get("audit_passed") is not True:
              raise SystemExit("B1 metadata stage/audit mismatch")
          if metadata.get("submission_rows") != 40 or metadata.get("minus99_tasks") != []:
              raise SystemExit("B1 submission contract metadata mismatch")
          digest = hashlib.sha256(submission_path.read_bytes()).hexdigest()
          if digest != request["submission_sha256"] or digest != metadata.get("submission_sha256"):
              raise SystemExit("B1 submission SHA-256 does not match approved request and kernel metadata")
          with submission_path.open(newline="", encoding="utf-8") as handle:
              rows = list(csv.reader(handle))
          expected_header = [
              "participant_id", "Task1.1", "Task1.2", "Task1.3", "Task1.4",
              "Task2.1", "Task2.2", "Task2.3",
          ]
          if rows[0] != expected_header or len(rows) != 41:
              raise SystemExit("B1 submission CSV shape/header mismatch")
          print(f"B1_SUBMISSION_FILE_VERIFIED sha256={digest} rows=40")
          PY

      - name: Create exactly one Competition submission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          submission="$(find "${WORKDIR}/output" -type f -name submission.csv -print -quit)"
          [[ -n "${submission}" && -f "${submission}" ]]
          set +e
          "${WORKDIR}/venv/bin/kaggle" competitions submit "${TARGET_COMPETITION}" \
            -f "${submission}" -m "${SUBMISSION_MESSAGE}" \
            >"${WORKDIR}/submit.stdout" 2>"${WORKDIR}/submit.stderr"
          rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: Kaggle Competition submission failed; response content suppressed"
            rm -f "${WORKDIR}/submit.stdout" "${WORKDIR}/submit.stderr"
            exit 1
          fi
          ref="$(python3 - "${WORKDIR}/submit.stdout" <<'PY'
          import re, sys
          text = open(sys.argv[1], encoding="utf-8", errors="replace").read()
          match = re.search(r"Submission ref:\s*(\d+)", text)
          print(match.group(1) if match else "")
          PY
          )"
          rm -f "${WORKDIR}/submit.stdout" "${WORKDIR}/submit.stderr"
          if [[ ! "${ref}" =~ ^[0-9]+$ ]]; then
            echo "ERROR: submission succeeded but a numeric submission ref was not returned"
            exit 1
          fi
          echo "COMPETITION_SUBMISSION_CREATED request_id=20260902-cmi-flu-b1-submit-001 submission_ref=${ref} automatic_retries=0"

      - name: Cleanup runner-local Kaggle output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then
            rm -rf "${WORKDIR}"
          fi
          echo "Runner-local B1 output and request content removed"
