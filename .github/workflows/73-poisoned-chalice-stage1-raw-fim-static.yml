name: Poisoned Chalice Stage1 raw+FIM bridge static validation

on:
  pull_request:
    paths:
      - .github/workflows/73-poisoned-chalice-stage1-raw-fim-static.yml
      - .github/workflows/74-poisoned-chalice-stage1-raw-fim-launch.yml
      - .github/workflows/75-poisoned-chalice-stage1-raw-fim-status.yml
      - .github/workflows/76-poisoned-chalice-stage1-raw-fim-submit.yml
      - requests/poisoned-chalice-stage1-raw-fim-*.json

permissions: {}

concurrency:
  group: poisoned-chalice-stage1-static-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  static:
    name: Validate immutable source locks and workflow security
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Fetch exact PR-head files without credentials and validate
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          set -euo pipefail
          [[ "${HEAD_REPO}" == "renta0426/kaggle-actions-bridge" ]]
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import ssl
          import urllib.request
          from urllib.parse import urlparse

          head_repo = os.environ["HEAD_REPO"]
          head_sha = os.environ["HEAD_SHA"]
          bridge_base = f"https://raw.githubusercontent.com/{head_repo}/{head_sha}/"
          files = {
              "request": "requests/poisoned-chalice-stage1-raw-fim-launch-v1.json",
              "launch": ".github/workflows/74-poisoned-chalice-stage1-raw-fim-launch.yml",
              "status": ".github/workflows/75-poisoned-chalice-stage1-raw-fim-status.yml",
              "submit": ".github/workflows/76-poisoned-chalice-stage1-raw-fim-submit.yml",
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def fetch_url(url: str, limit: int = 196608) -> bytes:
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"file too large: {url}")
              return data

          def fetch_bridge(path: str, limit: int = 196608) -> bytes:
              return fetch_url(bridge_base + path, limit)

          request = json.loads(fetch_bridge(files["request"], 32768))
          expected_fields = {
              "schema_version", "request_id", "competition", "operation", "target",
              "kernel_notebook_path", "kernel_notebook_blob_sha",
              "kernel_metadata_path", "kernel_metadata_blob_sha",
              "source_repository", "source_commit", "module_commit",
              "resource", "api_budget", "side_effects", "automatic_compute_retries",
              "enable_internet", "rules_checked_at_utc",
          }
          if set(request) != expected_fields:
              raise SystemExit("launch request schema differs from fixed allowlist")
          if request["schema_version"] != 1:
              raise SystemExit("unsupported launch request schema")
          if request["request_id"] != "20260902-poisoned-chalice-stage1-raw-fim-001":
              raise SystemExit("unexpected launch request id")
          if request["competition"] != "poisoned-chalice-icse27":
              raise SystemExit("competition mismatch")
          if request["operation"] != "kernel_run":
              raise SystemExit("operation mismatch")
          if request["target"] != "renta0426/stage1-raw-fim-submission-v1":
              raise SystemExit("target kernel mismatch")
          if request["source_repository"] != "renta0426/The-Poisoned-Chalice-of-LLM-Evaluation":
              raise SystemExit("source repository mismatch")
          if request["source_commit"] != "28c34307c71db733dab2744ec9ec46549e54d424":
              raise SystemExit("source commit mismatch")
          if request["module_commit"] != "bcf6d44db86fdda4ac9dd07b2d0172de471ab67a":
              raise SystemExit("module commit mismatch")
          if request["resource"] != {
              "accelerator": "gpu",
              "machine_shape": "NvidiaTeslaT4",
              "expected_runtime_minutes": 300,
              "hard_timeout_minutes": 600,
              "max_active_runs": 1,
              "min_remaining_quota_hours": 5.0,
          }:
              raise SystemExit("resource manifest mismatch")
          if request["api_budget"] != {
              "max_calls": 30,
              "poll_interval_seconds": 300,
              "max_pages": 2,
          }:
              raise SystemExit("API budget mismatch")
          if request["side_effects"] != ["create one private notebook version and start one T4 GPU run"]:
              raise SystemExit("side-effect allowlist mismatch")
          if request["automatic_compute_retries"] != 0 or request["enable_internet"] is not True:
              raise SystemExit("retry/internet policy mismatch")

          source_base = (
              f"https://raw.githubusercontent.com/{request['source_repository']}/"
              f"{request['source_commit']}/"
          )
          notebook = fetch_url(source_base + request["kernel_notebook_path"], 262144)
          metadata_raw = fetch_url(source_base + request["kernel_metadata_path"], 32768)
          for label, data, expected in (
              ("notebook", notebook, request["kernel_notebook_blob_sha"]),
              ("metadata", metadata_raw, request["kernel_metadata_blob_sha"]),
          ):
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != expected:
                  raise SystemExit(f"{label} source blob mismatch")

          nb = json.loads(notebook)
          metadata = json.loads(metadata_raw)
          if nb.get("nbformat") != 4:
              raise SystemExit("unexpected notebook format")
          source_text = "\n".join(
              "".join(cell.get("source", [])) if isinstance(cell.get("source"), list)
              else str(cell.get("source", ""))
              for cell in nb.get("cells", [])
          )
          if request["module_commit"] not in source_text:
              raise SystemExit("notebook does not pin expected module commit")
          expected_metadata = {
              "id": request["target"],
              "code_file": "stage1-raw-fim-submission-v1.ipynb",
              "language": "python",
              "kernel_type": "notebook",
              "is_private": True,
              "enable_gpu": True,
              "enable_tpu": False,
              "enable_internet": True,
              "machine_shape": "NvidiaTeslaT4",
          }
          for key, value in expected_metadata.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"kernel metadata mismatch: {key}")

          for name in ("launch", "status", "submit"):
              text = fetch_bridge(files[name]).decode("utf-8")
              for required in (
                  "permissions: {}",
                  "runs-on: ubuntu-24.04",
                  "environment: kaggle-readonry",
              ):
                  if required not in text:
                      raise SystemExit(f"{name} workflow missing security invariant: {required}")
              for forbidden in (
                  "pull_request_target:",
                  "workflow_run:",
                  "repository_dispatch:",
                  "issue_comment:",
                  "runs-on: self-hosted",
                  "set -x",
                  "actions/checkout@",
              ):
                  if forbidden in text:
                      raise SystemExit(f"forbidden workflow construct in {name}: {forbidden}")
          print("Poisoned Chalice Stage1 bridge static validation: PASS")
          PY
