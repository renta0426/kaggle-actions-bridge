name: Dispatch corrected protected CMI-Flu V3-07 H1/H2 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/265-cmi-flu-v3-v07-dispatch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.event.head_commit.message == 'Dispatch corrected protected CMI-Flu V3-07 H1/H2 once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch corrected protected successor workflow containing independent H1/H2 jobs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${REPOSITORY}/actions/workflows/266-cmi-flu-v3-v07-protected-successor.yml/dispatches" -f ref=main
          echo 'Corrected protected V3-07 H1/H2 successor dispatched after a proven before-write CLI PATH failure. Each request still has zero Kaggle writes consumed, one write maximum, zero automatic retries, and remains gated by kaggle-readonry approval.'
