name: Dispatch frozen CMI-Flu V3-07 H1/H2 once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/265-cmi-flu-v3-v07-dispatch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.event.head_commit.message == 'Dispatch frozen CMI-Flu V3-07 H1/H2 once'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch exact H1 and H2 manual workflows
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${REPOSITORY}/actions/workflows/263-cmi-flu-v3-v07-h1-panel-mean-001.yml/dispatches" -f ref=main
          gh api --method POST "/repos/${REPOSITORY}/actions/workflows/264-cmi-flu-v3-v07-h2-retention-001.yml/dispatches" -f ref=main
          echo 'V3-07 H1/H2 dispatch requests accepted; protected jobs still require kaggle-readonry approval.'
