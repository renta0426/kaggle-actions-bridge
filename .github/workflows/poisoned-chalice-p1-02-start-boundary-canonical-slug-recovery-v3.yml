name: Poisoned Chalice P1-02 start-boundary canonical-slug recovery v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3.yml
      - requests/poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3.json
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v3.py
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v1.py
      - scripts/poisoned_chalice_shadow_gold_start_boundary_attribution_v1.py
      - scripts/kaggle_exact_identity.py
  pull_request:
    paths:
      - .github/workflows/poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3.yml
      - requests/poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3.json
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v3.py
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v1.py
      - scripts/poisoned_chalice_shadow_gold_start_boundary_attribution_v1.py
      - scripts/kaggle_exact_identity.py

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260912-poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3-001
  HISTORICAL_DECLARED_TARGET: renta0426/shadow-gold-start-boundary-attribution-v1
  CANONICAL_TARGET: renta0426/gold-start-boundary-attribution-v1
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate P1-02 canonical-slug repair without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable:${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/tarball/{ref}",
              headers={"User-Agent":"poisoned-chalice-p1-02-canonical-recovery-v3/1"},
          )
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(25_000_001)
          if len(data)>25_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[member for member in archive.getmembers() if member.isfile()]
              prefixes={member.name.split("/",1)[0] for member in files}
              if len(prefixes)!=1: raise SystemExit("archive layout")
              prefix=next(iter(prefixes))+"/"
              for member in files:
                  if not member.name.startswith(prefix): raise SystemExit("archive prefix")
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if ".." in rel.parts: raise SystemExit("unsafe archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(member).read())
          PY

      - name: Validate root cause and read-only recovery contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/requests/poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3.json" <<'PY'
          import json,sys
          request=json.load(open(sys.argv[1],encoding="utf-8"))
          assert request["request_id"]=="20260912-poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3-001"
          assert request["predecessor_request_id"]=="20260912-poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2-001"
          assert request["predecessor_run_id"]==34619164085
          assert request["original_request_id"]=="20260906-poisoned-chalice-shadow-gold-start-boundary-attribution-v1-001"
          assert request["original_launch_run_id"]==34038595367
          assert request["operation"]=="kernel_canonical_slug_version1_recovery_read"
          assert request["execution_policy"]=="kaggle_native_capacity_v2"
          assert request["historical_declared_target"]=="renta0426/shadow-gold-start-boundary-attribution-v1"
          assert request["historical_title"]=="Gold start-boundary attribution v1"
          assert request["canonical_target"]=="renta0426/gold-start-boundary-attribution-v1"
          assert request["expected_kernel_version"]==1
          assert request["research_commit"]=="6b6f388627dfcf16ab0140337cabe7e93f4a8891"
          assert request["original_launcher_blob_sha"]=="16cf5028a6d09f2aed4c590b69c42c248365a265"
          assert request["original_launch_commit"]=="0448206e5b4650204e3ec28d10c472bd376d1a0c"
          assert request["expected_prediction_rows"]==2560
          assert request["new_write_attempted"] is False
          assert request["new_compute_requested"] is False
          assert request["competition_submission_attempted"] is False
          assert request["automatic_compute_retries"]==0
          guards=request["fail_closed"]
          for key in (
              "require_historical_title_id_mismatch_proof",
              "require_canonical_target_exactly_from_frozen_title",
              "require_current_version_exactly_1",
              "require_original_notebook_source_identity",
              "require_scientific_outputs_complete",
              "require_frozen_clean_room_guards",
              "refuse_any_write_or_compute_retry",
              "refuse_arbitrary_target_or_version_substitution",
          ):
              assert guards[key] is True
          PY

          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v3.py" \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v1.py" \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_shadow_gold_start_boundary_attribution_v1.py" \
            "${WORKDIR}/bridge/scripts/kaggle_exact_identity.py"

          ! grep -Eq 'kernels_push|kernel_push|competition_submit|"kernels"[[:space:]]*,[[:space:]]*"push"|"competitions"[[:space:]]*,[[:space:]]*"submit"' \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v3.py"

          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 - "${WORKDIR}/bridge" <<'PY'
          import pathlib,sys
          import poisoned_chalice_p1_02_start_boundary_recover_v3 as m

          root=pathlib.Path(sys.argv[1])
          assert m.canonical_slug(m.EXPECTED_TITLE)=="gold-start-boundary-attribution-v1"
          assert m.DECLARED_TARGET=="renta0426/shadow-gold-start-boundary-attribution-v1"
          assert m.TARGET=="renta0426/gold-start-boundary-attribution-v1"
          assert m.DECLARED_TARGET!=m.TARGET
          m._validate_historical_contract(root)

          class Meta:
              ref=m.TARGET
              is_private=True
              current_version_number=1
              title=m.EXPECTED_TITLE
              enable_gpu=True
              enable_tpu=False
              enable_internet=False
          class Status:
              status="COMPLETE"
          class API:
              def kernels_status(self,target):
                  assert target==m.TARGET
                  return Status()
          old=m.exact_metadata
          try:
              m.exact_metadata=lambda api,target: Meta()
              assert m.validate_remote_identity(API())=="COMPLETE"
          finally:
              m.exact_metadata=old
          PY

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  recover:
    name: Read P1-02 version 1 from canonical Kaggle slug
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected recovery boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-p1-02-start-boundary-canonical-slug-recovery-v3.yml@refs/heads/main" ]]
          [[ "$HISTORICAL_DECLARED_TARGET" == "renta0426/shadow-gold-start-boundary-attribution-v1" ]]
          [[ "$CANONICAL_TARGET" == "renta0426/gold-start-boundary-attribution-v1" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"poisoned-chalice-p1-02-canonical-recovery-v3/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(25_000_001)
          if len(data)>25_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[member for member in archive.getmembers() if member.isfile()]
              prefixes={member.name.split("/",1)[0] for member in files}
              if len(prefixes)!=1: raise SystemExit("archive layout")
              prefix=next(iter(prefixes))+"/"
              for member in files:
                  if not member.name.startswith(prefix): raise SystemExit("archive prefix")
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if ".." in rel.parts: raise SystemExit("unsafe archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(member).read())
          PY

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Recover and validate canonical-slug version 1 only
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" \
            "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v3.py" \
            --bridge-root "${WORKDIR}/bridge" \
            --output-dir "${WORKDIR}/recovery"
          test -f "${WORKDIR}/recovery/recovery.json"
          grep -F '"historical_declared_target": "renta0426/shadow-gold-start-boundary-attribution-v1"' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"canonical_target": "renta0426/gold-start-boundary-attribution-v1"' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"version": 1' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"new_write_attempted": false' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"new_compute_requested": false' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"scientific_outputs_validated": true' "${WORKDIR}/recovery/recovery.json" >/dev/null

      - name: Cleanup runner-local recovery content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
