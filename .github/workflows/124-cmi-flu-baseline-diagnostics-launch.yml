name: CMI-Flu baseline diagnostics 001 CPU launch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/124-cmi-flu-baseline-diagnostics-launch.yml
      - requests/cmi-flu-baseline-diagnostics-v1.json
      - scripts/cmi_flu_baseline_diagnostics_builder.py
      - scripts/cmi_flu_b2_patch_v4.py
      - requests/cmi-flu-b2-launch-v4.json
      - payloads/cmi-flu-b2-broad-004/**
      - requirements/kaggle-2.2.4.lock
  pull_request:
    paths:
      - .github/workflows/124-cmi-flu-baseline-diagnostics-launch.yml
      - requests/cmi-flu-baseline-diagnostics-v1.json
      - scripts/cmi_flu_baseline_diagnostics_builder.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false
  queue: max

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-baseline-diagnostics-v1.json
  BUILDER_PATH: scripts/cmi_flu_baseline_diagnostics_builder.py
  BASE_REQUEST_PATH: requests/cmi-flu-b2-launch-v4.json
  BASE_PATCHER_PATH: scripts/cmi_flu_b2_patch_v4.py
  BASE_PAYLOAD_DIR: payloads/cmi-flu-b2-broad-004
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-baseline-diagnostics-20260903-001
  TARGET_SLUG: cmi-flu-baseline-diagnostics-20260903-001
  EXPECTED_BASE_SOURCE_SHA256: 7894a9232e7372950f70a36d35de41bcc8bda90ec4d0320187e82c3b8c76f2db
  EXPECTED_BASE_SOURCE_SIZE: "93363"
  REQUESTED_ACCELERATOR: cpu

jobs:
  validate:
    name: Validate immutable aggregate diagnostics request 001
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Check out exact event commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Reconstruct B2 package and build exact diagnostics script
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EVENT_SHA}" ]]
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, sys

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          root = pathlib.Path(sys.argv[1])

          def read(path: str, limit: int) -> bytes:
              candidate = workspace / path
              if candidate.is_symlink():
                  raise SystemExit(f"symlink input refused: {path}")
              resolved = candidate.resolve()
              if resolved != workspace and workspace not in resolved.parents:
                  raise SystemExit(f"path escapes workspace: {path}")
              if not resolved.is_file():
                  raise SystemExit(f"required input missing: {path}")
              data = resolved.read_bytes()
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          request_bytes = read(os.environ["REQUEST_PATH"], 32768)
          request = json.loads(request_bytes)
          expected_keys = {
              "schema_version", "request_id", "competition", "operation", "target", "purpose",
              "source", "outputs", "resource", "api_budget", "side_effects", "submission_created",
              "submission_attempted", "automatic_compute_retries", "enable_internet", "rules_checked_at_utc",
          }
          if set(request) != expected_keys:
              raise SystemExit("diagnostics request top-level key set mismatch")
          if request["schema_version"] != 1 or request["request_id"] != "20260903-cmi-flu-baseline-diagnostics-001":
              raise SystemExit("diagnostics request identity mismatch")
          if request["competition"] != os.environ["TARGET_COMPETITION"] or request["operation"] != "kernel_run":
              raise SystemExit("diagnostics request competition/operation mismatch")
          if request["target"] != os.environ["TARGET_KERNEL"]:
              raise SystemExit("diagnostics target mismatch")
          if request["purpose"] != "aggregate B1 anchor diagnostics and B2 negative controls; no submission":
              raise SystemExit("diagnostics purpose mismatch")
          if request["outputs"] != ["bridge-result.json", "metrics.json", "summary.md"]:
              raise SystemExit("diagnostics output allowlist mismatch")
          if request["submission_created"] is not False or request["submission_attempted"] is not False:
              raise SystemExit("diagnostics request must forbid submission")
          if request["automatic_compute_retries"] != 0 or request["enable_internet"] is not False:
              raise SystemExit("diagnostics retry/internet contract mismatch")
          if request["resource"] != {"accelerator": "cpu", "expected_runtime_minutes": 60, "hard_timeout_minutes": 180, "max_active_runs": 1}:
              raise SystemExit("diagnostics CPU resource contract mismatch")
          if request["api_budget"] != {"max_calls": 20, "poll_interval_seconds": 900, "max_pages": 2}:
              raise SystemExit("diagnostics API budget mismatch")
          if request["side_effects"] != ["create one private Notebook version and start one CPU run"]:
              raise SystemExit("diagnostics side-effect contract mismatch")

          source_contract = request["source"]
          if set(source_contract) != {
              "builder_path", "builder_blob_sha", "diagnostics_cmi_commit", "diagnostics_blob_sha",
              "negative_controls_blob_sha", "base_b2_request", "base_payload_dir",
              "base_payload_sha256", "base_package_sha256",
          }:
              raise SystemExit("diagnostics source key set mismatch")
          builder = read(os.environ["BUILDER_PATH"], 65536)
          git_blob = hashlib.sha1(b"blob " + str(len(builder)).encode() + b"\0" + builder).hexdigest()
          if git_blob != source_contract["builder_blob_sha"] or source_contract["builder_path"] != os.environ["BUILDER_PATH"]:
              raise SystemExit("diagnostics builder binding mismatch")
          if source_contract["diagnostics_cmi_commit"] != "6cc984f6bd2e8e744795c14d13034def2c5dc9e7":
              raise SystemExit("diagnostics CMI commit mismatch")
          if source_contract["diagnostics_blob_sha"] != "6dd5e9f69095b5db63fded3913f22c0041a30f2a" or source_contract["negative_controls_blob_sha"] != "250d255e9f5e768238143b14b89325f4ccb0f111":
              raise SystemExit("diagnostics implementation blob mismatch")
          if source_contract["base_b2_request"] != "20260903-cmi-flu-b2-004" or source_contract["base_payload_dir"] != os.environ["BASE_PAYLOAD_DIR"]:
              raise SystemExit("base B2 binding mismatch")
          if source_contract["base_payload_sha256"] != os.environ["EXPECTED_BASE_SOURCE_SHA256"] or source_contract["base_package_sha256"] != "48ff4ed2eadec8b059b8d37fb677af1f249b6486bccfbd55dca2274cfc6f3dc3":
              raise SystemExit("base B2 hash binding mismatch")

          source = b"".join(read(f"{os.environ['BASE_PAYLOAD_DIR']}/part-{i:02d}", 5000) for i in range(20))
          digest = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["EXPECTED_BASE_SOURCE_SIZE"]) or digest != os.environ["EXPECTED_BASE_SOURCE_SHA256"]:
              raise SystemExit("base B2 source reconstruction mismatch")
          sums = read(f"{os.environ['BASE_PAYLOAD_DIR']}/SHA256SUMS", 512).decode("utf-8")
          size = read(f"{os.environ['BASE_PAYLOAD_DIR']}/SIZE", 64).decode("utf-8")
          if sums != f"{digest}  run_b2_kaggle_bundle.py\n" or size != f"{len(source)}\n":
              raise SystemExit("base B2 payload manifest mismatch")

          (root / "base-source.py").write_bytes(source)
          (root / "base-request.json").write_bytes(read(os.environ["BASE_REQUEST_PATH"], 32768))
          (root / "base-patch.py").write_bytes(read(os.environ["BASE_PATCHER_PATH"], 32768))
          (root / "builder.py").write_bytes(builder)
          PY
          python3 "${workdir}/base-patch.py" --source "${workdir}/base-source.py" --request "${workdir}/base-request.json" --output "${workdir}/base.py"
          python3 "${workdir}/builder.py" --base-script "${workdir}/base.py" --output "${workdir}/script.py"
          python3 -W error::SyntaxWarning -m py_compile "${workdir}/base-patch.py" "${workdir}/builder.py" "${workdir}/script.py"
          python3 "${workdir}/script.py" --self-test
          echo 'CMI_FLU_BASELINE_DIAGNOSTICS_001_VALIDATE PASS'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

  launch:
    name: Admit or launch exactly one aggregate diagnostics CPU run 001
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/124-cmi-flu-baseline-diagnostics-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo 'PROTECTED_CMI_FLU_BASELINE_DIAGNOSTICS_001_BOUNDARY PASS'

      - name: Check out exact approved main commit without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Prepare locked Kaggle CLI and exact diagnostics script
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${EVENT_SHA}" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, os, pathlib, re, sys

          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          root = pathlib.Path(sys.argv[1])

          def read(path: str, limit: int) -> bytes:
              candidate = workspace / path
              if candidate.is_symlink():
                  raise SystemExit(f"symlink input refused: {path}")
              resolved = candidate.resolve()
              if resolved != workspace and workspace not in resolved.parents:
                  raise SystemExit(f"path escapes workspace: {path}")
              if not resolved.is_file():
                  raise SystemExit(f"required input missing: {path}")
              data = resolved.read_bytes()
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          source = b"".join(read(f"{os.environ['BASE_PAYLOAD_DIR']}/part-{i:02d}", 5000) for i in range(20))
          digest = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["EXPECTED_BASE_SOURCE_SIZE"]) or digest != os.environ["EXPECTED_BASE_SOURCE_SHA256"]:
              raise SystemExit("base B2 source reconstruction mismatch")
          sums = read(f"{os.environ['BASE_PAYLOAD_DIR']}/SHA256SUMS", 512).decode("utf-8")
          size = read(f"{os.environ['BASE_PAYLOAD_DIR']}/SIZE", 64).decode("utf-8")
          if sums != f"{digest}  run_b2_kaggle_bundle.py\n" or size != f"{len(source)}\n":
              raise SystemExit("base B2 payload manifest mismatch")
          (root / "base-source.py").write_bytes(source)
          (root / "base-request.json").write_bytes(read(os.environ["BASE_REQUEST_PATH"], 32768))
          (root / "base-patch.py").write_bytes(read(os.environ["BASE_PATCHER_PATH"], 32768))
          (root / "builder.py").write_bytes(read(os.environ["BUILDER_PATH"], 65536))
          lock = read(os.environ["LOCK_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines) or not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          PY
          python3 "${workdir}/base-patch.py" --source "${workdir}/base-source.py" --request "${workdir}/base-request.json" --output "${workdir}/base.py"
          python3 "${workdir}/builder.py" --base-script "${workdir}/base.py" --output "${workdir}/script.py"
          python3 -W error::SyntaxWarning -m py_compile "${workdir}/script.py"
          python3 "${workdir}/script.py" --self-test
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Fetch live Competition rules and determine CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live Competition policy pages unavailable")
          plain = lambda value: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", value)).casefold()
          rules = plain(content["rules"])
          evaluation = plain(content["evaluation"])
          data_text = " ".join(plain(content[name]) for name in content if "data" in name)
          if not all(term in rules for term in (
              "maximum of five (5) submissions per day",
              "maximum team size is five (5)",
              "data security",
              "external data and tools",
          )):
              raise SystemExit("live Competition rules differ from approved guardrails")
          if not all(term in evaluation for term in ("mean spearman correlation", "40 donors", "-99")):
              raise SystemExit("live Competition evaluation differs from approved guardrails")
          if "sample_submission_part1.csv" not in data_text or "investigations_260821.tsv" not in data_text:
              raise SystemExit("live Competition data description differs from expected inputs")

          target = os.environ["TARGET_KERNEL"]
          existing = api.kernels_list(user="renta0426", search=os.environ["TARGET_SLUG"], page_size=5) or []
          if target in {str(getattr(item, "ref", "")) for item in existing}:
              raise SystemExit("target kernel already exists; duplicate refused")

          active_refs = []
          recent = api.kernels_list(user="renta0426", sort_by="dateRun", page_size=15) or []
          for item in recent[:15]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              try:
                  status = str(getattr(api.kernels_status(ref), "status", "")).upper()
              except Exception:
                  continue
              if any(token in status for token in ("RUNNING", "QUEUED", "PENDING")):
                  active_refs.append(ref)

          active = {"cpu": [], "gpu": [], "tpu": [], "unknown": []}
          if len(active_refs) > 5:
              active["unknown"].extend(active_refs)
          else:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      resource = "unknown"
                      try:
                          owner, slug = ref.split("/", 1)
                          request = ApiGetKernelRequest()
                          request.user_name = owner
                          request.kernel_slug = slug
                          metadata = client.kernels.kernels_api_client.get_kernel(request).metadata
                          if bool(getattr(metadata, "enable_tpu", False)):
                              resource = "tpu"
                          elif bool(getattr(metadata, "enable_gpu", False)):
                              resource = "gpu"
                          else:
                              resource = "cpu"
                      except Exception:
                          resource = "unknown"
                      active[resource].append(ref)

          can_launch = len(active["cpu"]) + len(active["unknown"]) < 1
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"can_launch={'true' if can_launch else 'false'}\n")
          counts = {key: len(value) for key, value in active.items()}
          if can_launch:
              print(
                  "LIVE_RULE_PREFLIGHT PASS "
                  f"pages={len(content)} requested=cpu active_cpu={counts['cpu']} "
                  f"active_gpu={counts['gpu']} active_tpu={counts['tpu']} "
                  f"active_unknown={counts['unknown']} internet=false submission=false"
              )
          else:
              print(
                  "CMI_FLU_BASELINE_DIAGNOSTICS_001_DEFERRED "
                  f"active_cpu={counts['cpu']} active_unknown={counts['unknown']} "
                  f"nonblocking_gpu={counts['gpu']} nonblocking_tpu={counts['tpu']} "
                  "side_effect=false request_unexecuted=true"
              )
          PY

      - name: Record deferred admission
        if: steps.admission.outputs.can_launch != 'true'
        shell: bash
        run: echo 'Diagnostics request 001 deferred before Kaggle write; manually re-dispatch the same immutable workflow after blocking CPU/unknown work ends.'

      - name: Materialize one Python file and push one private CPU diagnostics run
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"
          mkdir -p "${kernel_dir}"
          cp "${WORKDIR}/script.py" "${kernel_dir}/script.py"
          "${WORKDIR}/venv/bin/python" - "${kernel_dir}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = {
              "id": os.environ["TARGET_KERNEL"],
              "title": "CMI Flu Baseline Diagnostics 20260903 001",
              "code_file": "script.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "",
              "dataset_sources": [],
              "competition_sources": [os.environ["TARGET_COMPETITION"]],
              "kernel_sources": [],
              "model_sources": [],
          }
          (root / "kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          [[ "$(find "${kernel_dir}" -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 1 ]]
          [[ -f "${kernel_dir}/script.py" && ! -L "${kernel_dir}/script.py" ]]
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 10800 \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo 'ERROR: Kaggle baseline diagnostics request 001 kernel push/run failed; response suppressed and no retry attempted'
            exit 1
          fi
          echo "KERNEL_LAUNCH PASS request_id=20260903-cmi-flu-baseline-diagnostics-001 target=${TARGET_KERNEL} accelerator=cpu internet=false submission=false automatic_compute_retries=0 timeout=10800"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'Runner-local CMI-Flu baseline diagnostics request 001 content removed'
