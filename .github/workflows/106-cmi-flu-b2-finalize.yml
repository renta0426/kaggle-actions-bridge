name: CMI-Flu B2 finalize, submit, and score

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/106-cmi-flu-b2-finalize.yml
      - requests/cmi-flu-b2-finalize-v1.json
      - scripts/cmi_flu_b2_finalize.py
      - requirements/kaggle-2.2.4.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false
  queue: max

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b2-finalize-v1.json
  SCRIPT_PATH: scripts/cmi_flu_b2_finalize.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  EXPECTED_SCRIPT_SHA256: 35c3ece9abf218f2c0c8d44788081312169ae6f2786ceb1115615e86f8764f02
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge

jobs:
  finalize:
    name: Wait, verify, submit once, and read one Public score
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Enforce protected finalization boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/106-cmi-flu-b2-finalize.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_CMI_FLU_B2_FINALIZE_BOUNDARY PASS"

      - name: Prepare immutable request, finalizer, and locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, ssl, sys, urllib.request

          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"

          def read(path: str, limit: int) -> bytes:
              request = urllib.request.Request(
                  base + path,
                  headers={"User-Agent": "kaggle-actions-bridge/1"},
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30,
                  context=ssl.create_default_context(),
              ) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          request_bytes = read(os.environ["REQUEST_PATH"], 16384)
          script_bytes = read(os.environ["SCRIPT_PATH"], 65536)
          lock_bytes = read(os.environ["LOCK_PATH"], 65536)
          script_digest = hashlib.sha256(script_bytes).hexdigest()
          if script_digest != os.environ["EXPECTED_SCRIPT_SHA256"]:
              raise SystemExit(
                  f"B2 finalizer SHA-256 mismatch: expected={os.environ['EXPECTED_SCRIPT_SHA256']} actual={script_digest}"
              )
          compile(script_bytes.decode("utf-8"), "cmi_flu_b2_finalize.py", "exec")

          request = json.loads(request_bytes)
          if request.get("request_id") != "20260903-cmi-flu-b2-finalize-001":
              raise SystemExit("B2 finalization request identity mismatch")
          if request.get("parent_request_id") != "20260903-cmi-flu-b2-001":
              raise SystemExit("B2 finalization parent request mismatch")
          if request.get("target_kernel") != "renta0426/cmi-flu-b2-taskwise-compact-20260903-001":
              raise SystemExit("B2 finalization target mismatch")
          if request.get("kernel_version") != 1:
              raise SystemExit("B2 finalization kernel version mismatch")
          if request.get("automatic_compute_retries") != 0:
              raise SystemExit("B2 finalization compute retry contract mismatch")
          if request.get("automatic_submission_retries") != 0:
              raise SystemExit("B2 finalization submission retry contract mismatch")
          if request.get("public_score_tuning") is not False:
              raise SystemExit("B2 finalization Public-score tuning must be disabled")
          if request.get("select_final_submission") is not False:
              raise SystemExit("B2 finalization final-selection side effect must be disabled")

          lock = lock_bytes.decode("utf-8")
          pattern = re.compile(
              r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$"
          )
          lines = [
              line.strip()
              for line in lock.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")

          (root / "request.json").write_bytes(request_bytes)
          (root / "finalize.py").write_bytes(script_bytes)
          (root / "kaggle.lock").write_bytes(lock_bytes)
          print(
              "CMI_FLU_B2_FINALIZER_SOURCE PASS "
              f"bytes={len(script_bytes)} sha256={script_digest}"
          )
          PY

          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F "2.2.4" >/dev/null
          "${workdir}/venv/bin/python" - "${workdir}/finalize.py" "${workdir}/request.json" <<'PY'
          from __future__ import annotations
          import importlib.util, pathlib, sys
          script = pathlib.Path(sys.argv[1])
          request = pathlib.Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location("cmi_flu_b2_finalize", script)
          if spec is None or spec.loader is None:
              raise SystemExit("unable to load B2 finalizer")
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          module.validate_request(request)
          print("CMI_FLU_B2_FINALIZER_SELF_TEST PASS")
          PY

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "kaggle-actions-bridge/1"},
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30,
                  context=ssl.create_default_context(),
              ) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Wait for and verify exact private B2 output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/finalize.py" wait-verify \
            --request "${WORKDIR}/request.json" \
            --output-dir "${WORKDIR}/output" \
            --state "${WORKDIR}/state.json"

      - name: Determine idempotent submission action
        id: submit_decision
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/finalize.py" preflight-submit \
            --request "${WORKDIR}/request.json" \
            --state "${WORKDIR}/state.json" \
            --decision "${WORKDIR}/decision.json"

          should_submit="$("${WORKDIR}/venv/bin/python" - "${WORKDIR}/decision.json" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))["should_submit"]
          print("true" if value else "false")
          PY
          )"
          submission_file="$("${WORKDIR}/venv/bin/python" - "${WORKDIR}/state.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["submission_path"])
          PY
          )"
          submission_message="$("${WORKDIR}/venv/bin/python" - "${WORKDIR}/decision.json" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["message"])
          PY
          )"
          {
            echo "should_submit=${should_submit}"
            echo "submission_file=${submission_file}"
            echo "submission_message=${submission_message}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create at most one SHA-bound Competition submission
        if: steps.submit_decision.outputs.should_submit == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          SUBMISSION_FILE: ${{ steps.submit_decision.outputs.submission_file }}
          SUBMISSION_MESSAGE: ${{ steps.submit_decision.outputs.submission_message }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          [[ -f "${SUBMISSION_FILE}" ]]
          set +e
          "${WORKDIR}/venv/bin/kaggle" competitions submit \
            -c "${TARGET_COMPETITION}" \
            -f "${SUBMISSION_FILE}" \
            -m "${SUBMISSION_MESSAGE}" \
            >"${WORKDIR}/submit.stdout" 2>"${WORKDIR}/submit.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/submit.stdout" "${WORKDIR}/submit.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: B2 Competition submission command failed; response suppressed and no retry was attempted"
            exit 1
          fi
          echo "CMI_FLU_B2_SUBMISSION_COMMAND PASS automatic_submission_retries=0"

      - name: Wait for exactly one finite Public score
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/finalize.py" wait-score \
            --request "${WORKDIR}/request.json" \
            --state "${WORKDIR}/state.json" \
            --decision "${WORKDIR}/decision.json"

      - name: Cleanup runner-local private output and credentials-adjacent files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then
            rm -rf "${WORKDIR}"
          fi
          echo "Runner-local CMI-Flu B2 finalization content removed"
