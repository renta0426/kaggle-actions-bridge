name: CMI-Flu E03 Task1.1 optional-view CPU 002 repair launch

on:
  pull_request:
    paths:
      - .github/workflows/225-cmi-flu-strategy-e03-task11-optional-view-repair-launch.yml
      - requests/cmi-flu-strategy-e03-task11-optional-view-fusion-002.json
      - payloads/cmi-flu-strategy-e03-task11-optional-view-001/**
      - payloads/cmi-flu-task11-prior-immunity-001/task11_prior_immunity.py
      - payloads/cmi-flu-strategy-e01-paired-evaluation-001/baseline_b021_robust.yaml
      - scripts/cmi_flu_strategy_e03_prepare.py
      - scripts/cmi_flu_strategy_e03_prepare_v2.py
      - scripts/cmi_flu_strategy_e03_prepare_v5.py
      - scripts/cmi_flu_strategy_e03_prepare_v6.py
      - scripts/cmi_flu_strategy_e03_sanitize.py
      - scripts/cmi_flu_strategy_e03_sanitize_v2.py
      - scripts/test_cmi_e03_runtime_contract.py
      - scripts/test_cmi_e03_runtime_contract_v2.py
      - scripts/test_cmi_e03_repair_identity.py
      - scripts/test_cmi_e03_full_synthetic.py
      - scripts/cmi_flu_strategy_e01_prepare.py
      - scripts/cmi_flu_task11_prior_immunity_prepare.py
      - scripts/cmi_flu_task11_prior_immunity_prepare_v2.py
      - scripts/kaggle_current_output_read.py
      - requirements/kaggle-2.2.4.lock
  push:
    branches: [main]
    paths:
      - .github/workflows/225-cmi-flu-strategy-e03-task11-optional-view-repair-launch.yml
      - requests/cmi-flu-strategy-e03-task11-optional-view-fusion-002.json
      - scripts/cmi_flu_strategy_e03_prepare_v6.py
      - scripts/cmi_flu_strategy_e03_sanitize_v2.py
      - scripts/test_cmi_e03_runtime_contract_v2.py
      - scripts/test_cmi_e03_repair_identity.py

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-e03-task11-optview-20260908-002
  TARGET_SLUG: cmi-flu-e03-task11-optview-20260908-002
  TARGET_TITLE: CMI Flu E03 Task11 Optview 20260908 002
  EXPECTED_KERNEL_VERSION: "1"
  REQUEST_ID: 20260908-cmi-flu-strategy-e03-task11-optional-view-fusion-002
  SCIENCE_COMMIT: 2eaf8fac9a632c67f32c4a0ed37b64eeac571387
  E03_BLOB: e38fe01606dc5653ad3d1542f722726c1374b278
  TASK11_PRIOR_BLOB: 50d9a43604d2b75479b8f873a86a8daf9d5bd7a9
  CONFIG_BLOB: 170d3211e2795c0730e481056c7bb068accf97c9
  FROZEN_B21_PACKAGE_SHA256: 48ff4ed2eadec8b059b8d37fb677af1f249b6486bccfbd55dca2274cfc6f3dc3
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate repaired E03 runtime without secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce secret-free boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
      - name: Materialize exact event commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "VALIDATE_WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target=pathlib.Path(sys.argv[1]); ref=sys.argv[2]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/renta0426/kaggle-actions-bridge/tarball/{ref}",headers={"User-Agent":"cmi-flu-e03-repair-preflight/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:data=response.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit("bridge archive exceeds byte budget")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
            files=[m for m in archive.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit("bridge archive layout invalid")
            prefix=next(iter(prefixes))+'/'
            for member in files:
              rel=pathlib.PurePosixPath(member.name[len(prefix):])
              if not member.name.startswith(prefix) or not rel.parts or '..' in rel.parts:raise SystemExit("unsafe bridge archive")
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.extractfile(member).read())
          PY
      - name: Prove single repair and full production path
        shell: bash
        run: |
          set -euo pipefail
          python3 "${VALIDATE_WORKDIR}/bridge/scripts/test_cmi_e03_repair_identity.py" --repository-root "${VALIDATE_WORKDIR}/bridge"
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 "${VALIDATE_WORKDIR}/bridge/scripts/cmi_flu_strategy_e03_prepare_v6.py" --repository-root "${VALIDATE_WORKDIR}/bridge" --output "${VALIDATE_WORKDIR}/script.py"
          python3 "${VALIDATE_WORKDIR}/script.py" --self-test
          python3 "${VALIDATE_WORKDIR}/bridge/scripts/test_cmi_e03_runtime_contract_v2.py" "${VALIDATE_WORKDIR}/script.py"
          python3 "${VALIDATE_WORKDIR}/bridge/scripts/test_cmi_e03_full_synthetic.py" --runtime "${VALIDATE_WORKDIR}/script.py" --sanitizer "${VALIDATE_WORKDIR}/bridge/scripts/cmi_flu_strategy_e03_sanitize_v2.py"
          ! grep -F 'kaggle competitions submit' "${VALIDATE_WORKDIR}/script.py" >/dev/null
          ! grep -F 'competition_submit(' "${VALIDATE_WORKDIR}/script.py" >/dev/null
          echo 'CMI_FLU_E03_REPAIR_PREFLIGHT PASS single_repair=shorter_kernel_identity'
      - name: Confirm current official Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl,urllib.request
          for url in ('https://www.kaggle.com/terms','https://www.kaggle.com/aup','https://www.kaggle.com/community-guidelines','https://www.kaggle.com/docs/api'):
            req=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge-cmi-e03-repair/1'})
            with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as response:
              if response.status!=200 or not response.read(65536):raise SystemExit('official Kaggle policy page unavailable')
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY
      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${VALIDATE_WORKDIR-}" || ! -d "${VALIDATE_WORKDIR}" ]] || rm -rf "${VALIDATE_WORKDIR}"

  launch:
    name: Run one approved repaired private CPU E03 and read aggregate-safe result
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/225-cmi-flu-strategy-e03-task11-optional-view-repair-launch.yml@refs/heads/main" ]]
          echo 'PROTECTED_CMI_FLU_E03_REPAIR_BOUNDARY PASS'
      - name: Materialize approved commit and repeat full prewrite lifecycle
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target=pathlib.Path(sys.argv[1]); ref=sys.argv[2]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/renta0426/kaggle-actions-bridge/tarball/{ref}",headers={"User-Agent":"cmi-flu-e03-repair-approved/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:data=response.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit("bridge archive exceeds byte budget")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
            files=[m for m in archive.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit("bridge archive layout invalid")
            prefix=next(iter(prefixes))+'/'
            for member in files:
              rel=pathlib.PurePosixPath(member.name[len(prefix):])
              if not member.name.startswith(prefix) or not rel.parts or '..' in rel.parts:raise SystemExit("unsafe bridge archive")
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.extractfile(member).read())
          PY
          python3 "${workdir}/bridge/scripts/test_cmi_e03_repair_identity.py" --repository-root "${workdir}/bridge"
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e03_prepare_v6.py" --repository-root "${workdir}/bridge" --output "${workdir}/script.py"
          python3 "${workdir}/script.py" --self-test
          python3 "${workdir}/bridge/scripts/test_cmi_e03_runtime_contract_v2.py" "${workdir}/script.py"
          python3 "${workdir}/bridge/scripts/test_cmi_e03_full_synthetic.py" --runtime "${workdir}/script.py" --sanitizer "${workdir}/bridge/scripts/cmi_flu_strategy_e03_sanitize_v2.py"
          echo "E03_RUNTIME_SHA256=$(sha256sum "${workdir}/script.py" | awk '{print $1}')" >> "${GITHUB_ENV}"
          echo 'CMI_FLU_E03_REPAIR_PROTECTED_PREWRITE PASS'
      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/${LOCK_PATH}" <<'PY'
          import pathlib,re,sys
          lock=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); pattern=re.compile(r'^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$')
          lines=[line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith('#')]
          if len(lines)!=33 or not all(pattern.fullmatch(line) for line in lines) or not any(line.startswith('kaggle==2.2.4 ') for line in lines):raise SystemExit('Kaggle CLI lock validation failed')
          PY
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
      - name: Recheck live Competition rules and CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - "${WORKDIR}/admission.txt" <<'PY'
          import os,pathlib,re,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          decision=pathlib.Path(sys.argv[1]); api=KaggleApi(); api.authenticate(); pages=api.competition_list_pages(os.environ['TARGET_COMPETITION']) or []; content={}
          for page in pages:
            data=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(data.get('name') or '').strip().lower()
            if name:content[name]=str(data.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in key for key in content):raise SystemExit('live Competition pages unavailable')
          plain=lambda text:re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',text)).casefold(); rules=plain(content['rules']); evaluation=plain(content['evaluation']); data_text=' '.join(plain(content[key]) for key in content if 'data' in key)
          if not all(term in rules for term in ('data security','external data and tools')):raise SystemExit('live Competition rules differ from approved guardrails')
          if not all(term in evaluation for term in ('mean spearman correlation','40 donors','-99')):raise SystemExit('live Competition evaluation differs from approved guardrails')
          if 'sample_submission_part1.csv' not in data_text or 'investigations_260821.tsv' not in data_text:raise SystemExit('live Competition data description differs from approved guardrails')
          existing=api.kernels_list(user='renta0426',search=os.environ['TARGET_SLUG'],page_size=10) or []
          if os.environ['TARGET_KERNEL'] in {str(getattr(item,'ref','')) for item in existing}:raise SystemExit('immutable repaired E03 target already exists; duplicate write refused')
          active_refs=[]
          for item in (api.kernels_list(user='renta0426',sort_by='dateRun',page_size=20) or [])[:20]:
            ref=str(getattr(item,'ref',''))
            if not ref:continue
            try:status=str(getattr(api.kernels_status(ref),'status','')).upper()
            except Exception:active_refs.append((ref,'unknown'));continue
            if any(token in status for token in ('RUNNING','QUEUED','PENDING')):active_refs.append((ref,None))
          active={'cpu':0,'gpu':0,'tpu':0,'unknown':0}
          with api.build_kaggle_client() as client:
            for ref,forced in active_refs:
              if forced=='unknown':active['unknown']+=1;continue
              resource='unknown'
              try:
                owner,slug=ref.split('/',1); request=ApiGetKernelRequest(); request.user_name=owner; request.kernel_slug=slug; metadata=client.kernels.kernels_api_client.get_kernel(request).metadata
                resource='tpu' if bool(getattr(metadata,'enable_tpu',False)) else ('gpu' if bool(getattr(metadata,'enable_gpu',False)) else 'cpu')
              except Exception:resource='unknown'
              active[resource]+=1
          can_launch=(active['cpu']+active['unknown'])<1; decision.write_text('launch\n' if can_launch else 'defer\n',encoding='utf-8')
          print(f"E03_REPAIR_CPU_PREFLIGHT requested=cpu active_cpu={active['cpu']} active_gpu={active['gpu']} active_tpu={active['tpu']} active_unknown={active['unknown']} can_launch={can_launch}")
          PY
          if [[ "$(cat "${WORKDIR}/admission.txt")" == "launch" ]]; then echo 'can_launch=true' >> "${GITHUB_OUTPUT}"; else echo 'can_launch=false' >> "${GITHUB_OUTPUT}"; fi
      - name: Record deferred admission
        if: steps.admission.outputs.can_launch != 'true'
        run: echo 'Repaired E03 deferred before Kaggle write; fresh approval is required for any later run.'
      - name: Push exactly one repaired private competition-attached CPU E03 run
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "CMI_FLU_E03_REPAIR_APPROVED_RUNTIME sha256=${E03_RUNTIME_SHA256}"
          kernel_dir="${WORKDIR}/kernel"; mkdir -p "${kernel_dir}"; cp "${WORKDIR}/script.py" "${kernel_dir}/script.py"
          python3 - "${kernel_dir}" <<'PY'
          import json,os,pathlib,re,sys
          root=pathlib.Path(sys.argv[1]); title=os.environ['TARGET_TITLE']; slug=re.sub(r'[^a-z0-9]+','-',title.lower()).strip('-')
          if slug!=os.environ['TARGET_SLUG'] or os.environ['TARGET_KERNEL']!=f"renta0426/{slug}":raise SystemExit('kernel title/slug contract mismatch')
          if not (5<=len(title)<=48 and 5<=len(slug)<=48):raise SystemExit('kernel identity outside conservative repair length contract')
          metadata={'id':os.environ['TARGET_KERNEL'],'title':title,'code_file':'script.py','language':'python','kernel_type':'script','is_private':True,'enable_gpu':False,'enable_tpu':False,'enable_internet':False,'machine_shape':'','dataset_sources':[],'competition_sources':[os.environ['TARGET_COMPETITION']],'kernel_sources':[],'model_sources':[]}
          (root/'kernel-metadata.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(f'KERNEL_METADATA_E03_REPAIR PASS title_chars={len(title)} slug_chars={len(slug)} cpu=true internet=false private=true submission=false')
          PY
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 4500 >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"; rc=$?
          set -e
          if [[ "${rc}" -ne 0 ]]; then
            python3 - "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr" "${rc}" <<'PY'
          import hashlib,pathlib,sys
          out=pathlib.Path(sys.argv[1]).read_bytes(); err=pathlib.Path(sys.argv[2]).read_bytes(); text=(out+b'\n'+err).decode(errors='replace').casefold(); rc=int(sys.argv[3])
          category='bad_request' if ('400' in text or 'bad request' in text) else ('rate_limit' if ('429' in text or 'too many requests' in text) else ('concurrent_session_limit' if 'session count' in text else ('permission_denied' if ('403' in text or 'forbidden' in text) else 'unknown')))
          print(f'E03_REPAIR_PUSH_FAILURE rc={rc} category={category} stdout_bytes={len(out)} stdout_sha256={hashlib.sha256(out).hexdigest()} stderr_bytes={len(err)} stderr_sha256={hashlib.sha256(err).hexdigest()}')
          PY
            rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"; exit 1
          fi
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          echo 'CMI_FLU_E03_REPAIR_LAUNCH PASS accelerator=cpu internet=false submission=false automatic_compute_retries=0'
      - name: Wait boundedly for terminal E03 status
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" - <<'PY'
          import os,time
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          target=os.environ['TARGET_KERNEL']; expected=int(os.environ['EXPECTED_KERNEL_VERSION']); api=KaggleApi(); api.authenticate(); deadline=time.monotonic()+4500; delays=[60,120,300]; terminal=None
          for attempt in range(1,14):
            status=str(getattr(api.kernels_status(target),'status','')).upper(); print(f'E03_REPAIR_STATUS attempt={attempt}/13 status={status or "UNKNOWN"}')
            if status and not any(token in status for token in ('RUNNING','QUEUED','PENDING')):terminal=status;break
            remaining=deadline-time.monotonic()
            if remaining<=0:break
            delay=delays[attempt-1] if attempt<=len(delays) else 600; time.sleep(min(delay,max(1,remaining)))
          if terminal is None:raise SystemExit('repaired E03 did not reach terminal status inside bounded watch')
          if any(token in terminal for token in ('ERROR','FAIL','CANCEL')):raise SystemExit(f'repaired E03 terminal failure status={terminal}')
          owner,slug=target.split('/',1)
          with api.build_kaggle_client() as client:
            request=ApiGetKernelRequest(); request.user_name=owner; request.kernel_slug=slug; metadata=client.kernels.kernels_api_client.get_kernel(request).metadata
          if str(getattr(metadata,'ref',''))!=target or not bool(getattr(metadata,'is_private',False)):raise SystemExit('terminal repaired E03 identity/privacy mismatch')
          if bool(getattr(metadata,'enable_gpu',False)) or bool(getattr(metadata,'enable_tpu',False)) or bool(getattr(metadata,'enable_internet',False)):raise SystemExit('terminal repaired E03 resource/internet mismatch')
          version=int(getattr(metadata,'current_version_number',0) or 0)
          if version!=expected:raise SystemExit(f'repaired E03 current version mismatch observed={version} expected={expected}')
          print(f'E03_REPAIR_TERMINAL PASS status={terminal} version={version}')
          PY
      - name: Read exact aggregate outputs from current version
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PATH: ${{ env.WORKDIR }}/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/kaggle_current_output_read.py" --kernel "${TARGET_KERNEL}" --expected-version "${EXPECTED_KERNEL_VERSION}" --allow-file bridge-result.json:1048576 --allow-file metrics.json:10485760 --allow-file summary.md:1048576 --output-dir "${WORKDIR}/safe-output"
      - name: Validate and render aggregate-only E03 result
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e03_sanitize_v2.py" --input-dir "${WORKDIR}/safe-output"
      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
          echo 'Runner-local repaired E03 content removed'
