name: CodeParrot frozen full-v1 public CPU evaluation v2

on:
  pull_request:
    paths:
      - requests/poisoned-chalice-codeparrot-full-eval-v1.json
      - scripts/evaluate_codeparrot_frozen_full_public.py
      - scripts/evaluate_codeparrot_frozen_full_public_v2.py
      - scripts/compose_public_codecorpus_cohort.py
      - scripts/kaggle_current_output_read.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_policy_preflight.py
      - requirements/kaggle-2.2.4.lock
      - .github/workflows/214-codeparrot-full-eval-public-v2.yml
  push:
    branches: [main]
    paths:
      - requests/poisoned-chalice-codeparrot-full-eval-v1.json
      - scripts/evaluate_codeparrot_frozen_full_public.py
      - scripts/evaluate_codeparrot_frozen_full_public_v2.py
      - .github/workflows/214-codeparrot-full-eval-public-v2.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET_KERNEL: renta0426/codeparrot-fresh-full-v1
  EXPECTED_VERSION: "1"

jobs:
  validate:
    name: Validate public evaluator v2 without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Materialize public bridge contract
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }; done
          source_sha="${EVENT_SHA}"; if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"; echo "SOURCE_SHA=${source_sha}" >> "${GITHUB_ENV}"; mkdir -p "${workdir}/bridge"
          python3 - "${source_sha}" "${workdir}/bridge" <<'PY'
          import pathlib,ssl,sys,time,urllib.error,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value); ctx=ssl.create_default_context()
          files={
              "requests/poisoned-chalice-codeparrot-full-eval-v1.json":32768,
              "scripts/evaluate_codeparrot_frozen_full_public.py":131072,
              "scripts/evaluate_codeparrot_frozen_full_public_v2.py":65536,
              "scripts/compose_public_codecorpus_cohort.py":131072,
              "scripts/kaggle_current_output_read.py":65536,
              "scripts/kaggle_exact_identity.py":65536,
              "scripts/kaggle_policy_preflight.py":65536,
          }
          for rel,maximum in files.items():
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{rel}"; data=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"codeparrot-public-eval-v2/1"})
                      with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
                      if not data or len(data)>maximum: raise SystemExit(f"bridge_source_contract_failed path={rel}")
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (404,500,502,503,504) or attempt==3: raise SystemExit(f"bridge_source_fetch_failed path={rel} http={exc.code} attempt={attempt}")
                      time.sleep(attempt)
                  except urllib.error.URLError as exc:
                      if attempt==3: raise SystemExit(f"bridge_source_fetch_failed path={rel} transport={type(exc.reason).__name__} attempt={attempt}")
                      time.sleep(attempt)
              path=root/rel.split('/')[-1]; path.write_bytes(data)
              if path.suffix==".py": compile(data,str(path),"exec")
          print("CODEPARROT_PUBLIC_V2_MATERIALIZE PASS files=7 private_repo_access=0")
          PY
          python3 "${workdir}/bridge/kaggle_policy_preflight.py"

      - name: Validate request, source boundary, and cohort parity markers
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/poisoned-chalice-codeparrot-full-eval-v1.json" "${WORKDIR}/bridge/evaluate_codeparrot_frozen_full_public.py" "${WORKDIR}/bridge/evaluate_codeparrot_frozen_full_public_v2.py" "${WORKDIR}/bridge/compose_public_codecorpus_cohort.py" <<'PY'
          import json,pathlib,sys
          request=json.load(open(sys.argv[1],encoding="utf-8")); core=pathlib.Path(sys.argv[2]).read_text(); wrapper=pathlib.Path(sys.argv[3]).read_text(); cohort=pathlib.Path(sys.argv[4]).read_text()
          if request.get("schema_version")!=3 or request.get("expected_current_version")!=1 or request.get("required_terminal_status")!="COMPLETE": raise SystemExit("request_identity_mismatch")
          expected_eval={"entry_point":"scripts/evaluate_codeparrot_frozen_full_public_v2.py","implementation_library":"scripts/evaluate_codeparrot_frozen_full_public.py","cohort_reconstruction_reference":"scripts/compose_public_codecorpus_cohort.py","cohort_reconstruction_source":"public_bridge_frozen_contract","private_research_repository_access":False,"member_dataset":"codeparrot/codeparrot-clean-train","member_revision":"3e6ab65f2864931e041f6a82db9b5a6ec2b71ab4","nonmember_dataset":"codeparrot/codeparrot-clean-valid","nonmember_revision":"4db92d2ec0c1b4c41eeb439cfae16854511d9dcd","train_scan_rows":500000,"rows_per_label":2000}
          if request.get("evaluator")!=expected_eval: raise SystemExit("evaluator_request_mismatch")
          combined=core+wrapper
          if any(token in combined for token in ("The-Poisoned-Chalice-of-LLM-Evaluation","RESEARCH_REPO_READ_TOKEN","GITHUB_PAT","GH_TOKEN","SSH_PRIVATE_KEY","api.github.com/repos/")): raise SystemExit("private_dependency_detected")
          common=("codeparrot/codeparrot-clean-train","3e6ab65f2864931e041f6a82db9b5a6ec2b71ab4","codeparrot/codeparrot-clean-valid","4db92d2ec0c1b4c41eeb439cfae16854511d9dcd","ROWS_PER_LABEL = 2_000","TRAIN_SCAN_ROWS = 500_000")
          if not all(token in core and token in cohort for token in common): raise SystemExit("public_cohort_evaluator_parity_marker_mismatch")
          first=core.index("prediction_only, predictor_sha = seal_label_free_predictors(raw)"); second=core.index("manifest, reconstruction = reconstruct_manifest()")
          if first>=second: raise SystemExit("membership_source_precedes_predictor_seal")
          if not all(token in wrapper for token in ("distinct[\"conservative_empirical\"][\"true_positives\"] == 2","tie_boundary[\"excluded_tie_block_size\"] == 2","stage2_v1_rank_fusion")): raise SystemExit("v2_regression_fixture_missing")
          print("CODEPARROT_PUBLIC_V2_STATIC PASS private_repo_access=0 cohort_parity=1 predictor_seal_before_labels=1")
          PY

      - name: Install pinned CPU dependencies and run authoritative v2 regression
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/eval-venv"
          "${WORKDIR}/eval-venv/bin/pip" install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.3.3 scipy==1.17.0 scikit-learn==1.8.0 datasets==4.8.5 pyarrow==24.0.0 >/dev/null
          cd "${WORKDIR}/bridge"
          "${WORKDIR}/eval-venv/bin/python" evaluate_codeparrot_frozen_full_public_v2.py --self-test
          echo "CODEPARROT_PUBLIC_V2_VALIDATION PASS"

      - name: Cleanup validation material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi

  evaluate:
    name: Read exact output once and run authoritative public v2 evaluation
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected read-only public-source boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/214-codeparrot-full-eval-public-v2.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || { echo "forbidden credential variable: ${name}"; exit 1; }; done
          echo "CODEPARROT_PUBLIC_V2_BOUNDARY PASS private_repo_access=0 kaggle_compute=0 writes=0 download_attempts=1"

      - name: Materialize immutable public sources
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="${RUNNER_TEMP}/codeparrot-public-eval-v2"; [[ ! -e "${workdir}" ]]; mkdir -p "${workdir}/bridge"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}/bridge" <<'PY'
          import pathlib,ssl,sys,time,urllib.error,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value); ctx=ssl.create_default_context()
          files={"requests/poisoned-chalice-codeparrot-full-eval-v1.json":32768,"scripts/evaluate_codeparrot_frozen_full_public.py":131072,"scripts/evaluate_codeparrot_frozen_full_public_v2.py":65536,"scripts/kaggle_current_output_read.py":65536,"scripts/kaggle_exact_identity.py":65536,"scripts/kaggle_policy_preflight.py":65536,"requirements/kaggle-2.2.4.lock":262144}
          for rel,maximum in files.items():
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{rel}"; data=None
              for attempt in range(1,4):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"codeparrot-public-eval-v2/1"})
                      with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
                      if not data or len(data)>maximum: raise SystemExit(f"bridge_source_contract_failed path={rel}")
                      break
                  except urllib.error.HTTPError as exc:
                      if exc.code not in (404,500,502,503,504) or attempt==3: raise SystemExit(f"bridge_source_fetch_failed path={rel} http={exc.code} attempt={attempt}")
                      time.sleep(attempt)
                  except urllib.error.URLError as exc:
                      if attempt==3: raise SystemExit(f"bridge_source_fetch_failed path={rel} transport={type(exc.reason).__name__} attempt={attempt}")
                      time.sleep(attempt)
              path=root/rel.split('/')[-1]; path.write_bytes(data)
              if path.suffix==".py": compile(data,str(path),"exec")
          PY
          python3 "${workdir}/bridge/kaggle_policy_preflight.py"

      - name: Install locked output reader and pinned evaluator dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/kaggle-2.2.4.lock" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          python3 -m venv "${WORKDIR}/eval-venv"
          "${WORKDIR}/eval-venv/bin/pip" install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.3.3 scipy==1.17.0 scikit-learn==1.8.0 datasets==4.8.5 pyarrow==24.0.0 >/dev/null
          cd "${WORKDIR}/bridge"; "${WORKDIR}/eval-venv/bin/python" evaluate_codeparrot_frozen_full_public_v2.py --self-test
          echo "CODEPARROT_PUBLIC_V2_PREP PASS"

      - name: Read exact current output once and verify uploaded identity
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          mkdir -p "${HOME}/.kaggle"; umask 077; printf '%s' "${KAGGLE_API_TOKEN}" > "${HOME}/.kaggle/access_token"; unset KAGGLE_API_TOKEN
          PATH="${WORKDIR}/kaggle-venv/bin:${PATH}" PYTHONPATH="${WORKDIR}/bridge" "${WORKDIR}/kaggle-venv/bin/python" "${WORKDIR}/bridge/kaggle_current_output_read.py" --kernel "${TARGET_KERNEL}" --expected-version "${EXPECTED_VERSION}" --allow-file "full_predictions.parquet:678787" --allow-file "full_manifest.json:1737" --allow-file "full_fidelity.json:1207" --allow-file "full_profile.json:452" --allow-file "__huggingface_repos__.json:428" --output-dir "${WORKDIR}/raw-output"
          "${WORKDIR}/eval-venv/bin/python" - "${WORKDIR}/bridge/poisoned-chalice-codeparrot-full-eval-v1.json" "${WORKDIR}/raw-output" <<'PY'
          import hashlib,json,pathlib,sys
          request=json.load(open(sys.argv[1],encoding="utf-8")); root=pathlib.Path(sys.argv[2]); expected=request["uploaded_result_identity"]["files"]
          if set(p.name for p in root.iterdir() if p.is_file())!=set(expected): raise SystemExit("saved_output_allowlist_mismatch")
          for name,identity in expected.items():
              data=(root/name).read_bytes()
              if len(data)!=identity["bytes"] or hashlib.sha256(data).hexdigest()!=identity["sha256"]: raise SystemExit(f"uploaded_current_identity_mismatch name={name}")
          print("CODEPARROT_CURRENT_OUTPUT_V2 PASS uploaded_match=1 current_version=1 files=5")
          PY
          rm -f "${HOME}/.kaggle/access_token" "${HOME}/.kaggle/kaggle.json"
          echo "CODEPARROT_KAGGLE_CREDENTIAL_REMOVED PASS before_membership_reconstruction=1"

      - name: Run first frozen membership evaluation
        shell: bash
        run: |
          set -euo pipefail
          [[ ! -e "${HOME}/.kaggle/access_token" && ! -e "${HOME}/.kaggle/kaggle.json" ]]
          cd "${WORKDIR}/bridge"
          "${WORKDIR}/eval-venv/bin/python" evaluate_codeparrot_frozen_full_public_v2.py --prediction-dir "${WORKDIR}/raw-output" --output-dir "${WORKDIR}/aggregate-output"

      - name: Audit and emit aggregate-only result
        shell: bash
        run: |
          set -euo pipefail
          "${WORKDIR}/eval-venv/bin/python" - "${WORKDIR}/aggregate-output" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); files=sorted(p.name for p in root.iterdir() if p.is_file())
          if files!=["REPORT.md","evaluation_summary.json"]: raise SystemExit(f"aggregate_file_contract_failed files={files}")
          summary=json.load(open(root/"evaluation_summary.json",encoding="utf-8")); report=(root/"REPORT.md").read_text(encoding="utf-8")
          if summary.get("status")!="complete_fresh_holdout_evaluation" or summary.get("rows")!=4000 or summary.get("members")!=2000 or summary.get("nonmembers")!=2000: raise SystemExit("evaluation_completion_contract_failed")
          if summary.get("codeparrot_consumed_after_first_label_join") is not True or summary.get("result_derived_codeparrot_retuning_authorized") is not False: raise SystemExit("consumed_model_boundary_failed")
          if summary.get("label_join_order")!={"label_free_predictors_sealed_before_membership_source_open":True,"membership_join_performed_once_for_frozen_evaluation":True,"row_level_join_persisted":False}: raise SystemExit("label_join_order_failed")
          clean=summary.get("clean_room",{}); 
          if clean.get("current_competition_rows_used")!=0 or clean.get("public_lb_feedback_used") is not False or summary.get("official_novelty_score_computed") is not False: raise SystemExit("clean_room_boundary_failed")
          if "cp-" in json.dumps(summary,sort_keys=True) or "cp-" in report: raise SystemExit("row_identity_leak")
          metrics=summary["predictor_metrics"]; boot=summary["primary_paired_repository_group_bootstrap"]["conservative_empirical_tpr"]
          headline={"local_64_auc":metrics["local_64"]["auc_roc"],"local_64_tpr_01":metrics["local_64"]["low_fpr"]["0.010"]["conservative_empirical"]["tpr"],"aux_auc":metrics["short_half_local_or_paper_v1"]["auc_roc"],"aux_tpr_01":metrics["short_half_local_or_paper_v1"]["low_fpr"]["0.010"]["conservative_empirical"]["tpr"],"stage2_v1_auc":metrics["stage2_v1_rank_fusion"]["auc_roc"],"bootstrap_tpr_delta_mean":boot["mean"],"bootstrap_tpr_delta_lower95":boot["lower_95"],"bootstrap_tpr_delta_upper95":boot["upper_95"],"promote_aux":summary["promote_short_half_local_or_paper_v1"],"label_free_predictor_sha256":summary["label_free_predictor_sha256"],"evaluation_manifest_sha256":summary["evaluation_manifest_sha256"]}
          print("CODEPARROT_FULL_EVAL_RESULT PASS "+json.dumps(headline,sort_keys=True))
          print("CODEPARROT_FULL_EVAL_SUMMARY_BEGIN"); print(json.dumps(summary,sort_keys=True)); print("CODEPARROT_FULL_EVAL_SUMMARY_END")
          PY

      - name: Cleanup all runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${HOME}/.kaggle/access_token" "${HOME}/.kaggle/kaggle.json"
          workdir="${RUNNER_TEMP}/codeparrot-public-eval-v2"; if [[ -d "${workdir}" ]]; then rm -rf "${workdir}"; fi
          echo "CODEPARROT_PUBLIC_V2_CLEANUP PASS raw_prediction_retained=0 row_label_join_retained=0 credentials_retained=0"
