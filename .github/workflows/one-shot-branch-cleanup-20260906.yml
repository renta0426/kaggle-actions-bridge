name: One-shot merged branch cleanup 20260909

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/one-shot-branch-cleanup-20260906.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Delete superseded P1-03 readout branch and merged stale branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ACTIVE_BRANCH: poisoned-chalice/p1-03-lumia-hs-runtime-50-v1-20260909
          SUPERSEDED_BRANCH: poisoned-chalice/p1-03-sersem-cache-readout-20260909
          SUPERSEDED_PR: '184'
          SUPERSEDED_SHA: 5879eb04a03cac81f6e86c5dfe3e28ab645132c7
        run: |
          set -euo pipefail

          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          git -C "${workdir}" init -q
          git -C "${workdir}" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "${workdir}" config credential.helper '!f() { echo username=x-access-token; echo password=$GH_TOKEN; }; f'
          git -C "${workdir}" fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'

          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls?state=open&per_page=100" \
            --jq '.[].head.ref' | sort -u > /tmp/open-pr-heads.txt
          printf '%s\n' main "${ACTIVE_BRANCH}" > /tmp/explicit-preserve.txt
          cat /tmp/open-pr-heads.txt >> /tmp/explicit-preserve.txt
          sort -u -o /tmp/explicit-preserve.txt /tmp/explicit-preserve.txt

          if grep -Fxq "${SUPERSEDED_BRANCH}" /tmp/open-pr-heads.txt; then
            echo "BRANCH_CLEANUP_REFUSED superseded_branch_reopened=${SUPERSEDED_BRANCH}"
            exit 1
          fi
          current_sha="$(git -C "${workdir}" rev-parse "refs/remotes/origin/${SUPERSEDED_BRANCH}")"
          [[ "${current_sha}" == "${SUPERSEDED_SHA}" ]] || {
            echo "BRANCH_CLEANUP_REFUSED superseded_branch_tip_changed=${SUPERSEDED_BRANCH}"
            exit 1
          }
          pr_state="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SUPERSEDED_PR}" --jq '.state')"
          pr_merged="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SUPERSEDED_PR}" --jq '.merged')"
          pr_head="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SUPERSEDED_PR}" --jq '.head.ref')"
          pr_sha="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${SUPERSEDED_PR}" --jq '.head.sha')"
          [[ "${pr_state}" == "closed" && "${pr_merged}" == "false" && "${pr_head}" == "${SUPERSEDED_BRANCH}" && "${pr_sha}" == "${SUPERSEDED_SHA}" ]] || {
            echo "BRANCH_CLEANUP_REFUSED superseded_pr_contract_failed=${SUPERSEDED_PR}"
            exit 1
          }
          git -C "${workdir}" push --quiet origin --delete "${SUPERSEDED_BRANCH}"
          echo "BRANCH_DELETE superseded=${SUPERSEDED_BRANCH} pr=${SUPERSEDED_PR}"

          git -C "${workdir}" fetch -q --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git -C "${workdir}" for-each-ref --format='%(refname:strip=3)' refs/remotes/origin \
            | grep -v '^HEAD$' | sort -u > /tmp/branches.txt

          ancestor_deleted=0
          unmerged_count=0
          while IFS= read -r branch; do
            if grep -Fxq "${branch}" /tmp/explicit-preserve.txt; then
              echo "BRANCH_PRESERVE explicit=${branch}"
              continue
            fi
            if git -C "${workdir}" merge-base --is-ancestor \
              "refs/remotes/origin/${branch}" refs/remotes/origin/main; then
              git -C "${workdir}" push --quiet origin --delete "${branch}"
              echo "BRANCH_DELETE ancestor=${branch}"
              ancestor_deleted=$((ancestor_deleted + 1))
            else
              echo "BRANCH_PRESERVE unmerged=${branch}"
              unmerged_count=$((unmerged_count + 1))
            fi
          done < /tmp/branches.txt

          git -C "${workdir}" ls-remote --heads origin \
            | awk '{sub("refs/heads/", "", $2); print $2}' | sort > /tmp/final-branches.txt
          while IFS= read -r branch; do
            [[ -z "${branch}" ]] && continue
            grep -Fxq "${branch}" /tmp/final-branches.txt || {
              echo "BRANCH_CLEANUP_REFUSED preserved_branch_missing=${branch}"
              exit 1
            }
          done < /tmp/explicit-preserve.txt
          if grep -Fxq "${SUPERSEDED_BRANCH}" /tmp/final-branches.txt; then
            echo "BRANCH_CLEANUP_REFUSED superseded_branch_still_present=${SUPERSEDED_BRANCH}"
            exit 1
          fi

          echo "BRANCH_CLEANUP_COMPLETE superseded_deleted=1 ancestor_deleted=${ancestor_deleted} unmerged_preserved=${unmerged_count} remaining=$(wc -l < /tmp/final-branches.txt | tr -d ' ')"
