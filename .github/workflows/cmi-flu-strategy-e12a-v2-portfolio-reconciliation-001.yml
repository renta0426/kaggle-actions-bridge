name: CMI-Flu Strategy-v2 E12a-v2 portfolio reconciliation CPU 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.yml
      - requests/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.json
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_synthetic.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_portfolio_reconciliation.json
      - scripts/cmi_flu_strategy_e12a_v2_prepare.py
      - scripts/cmi_flu_strategy_e12a_v2_execute.py
      - scripts/cmi_flu_strategy_e12a_v2_sanitize.py
      - docs/cmi-flu-e12a-v2-portfolio-reconciliation-001.md
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.yml
      - requests/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.json
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_synthetic.py
      - payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_portfolio_reconciliation.json
      - scripts/cmi_flu_strategy_e12a_v2_prepare.py
      - scripts/cmi_flu_strategy_e12a_v2_execute.py
      - scripts/cmi_flu_strategy_e12a_v2_sanitize.py
      - docs/cmi-flu-e12a-v2-portfolio-reconciliation-001.md

permissions: {}

concurrency:
  group: cmi-flu-e12a-v2-portfolio-reconciliation-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260911-cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001
  TARGET_KERNEL: renta0426/cmi-flu-e12a-v2-portfolio-reconcile-20260911-001
  SCIENCE_COMMIT: e6e05e578f172ce710bc0f1da55acdf290e83dd9
  E12A_V2_BLOB: 0c4c970c8bacfed61bfbb9587e0a0bfdec7903d9
  E12A_V2_SYNTH_BLOB: 6477076d9c5aba7d37d816147e4443b5c94ad2d4
  E12A_V2_CONTRACT_BLOB: 6b40ac35a3b43c3bafcdd08fcc49fc9fe22960c1
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E12a-v2 reconciliation without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a-v2/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split("/",1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip("/").endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or ".." in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Verify exact science relay request and frozen runtime ancestry
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import ast,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          expected={
            'requests/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.json':'a5b799f059fce856fb4d23277f41c6e29a55b57d',
            'payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2.py':'0c4c970c8bacfed61bfbb9587e0a0bfdec7903d9',
            'payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_synthetic.py':'6477076d9c5aba7d37d816147e4443b5c94ad2d4',
            'payloads/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001/strategy_e12a_v2_portfolio_reconciliation.json':'6b40ac35a3b43c3bafcdd08fcc49fc9fe22960c1',
            'scripts/cmi_flu_strategy_e12a_v2_prepare.py':'1b9c32153eeb0b069bb8daab018beb07664e0014',
            'scripts/cmi_flu_strategy_e12a_v2_execute.py':'8dbf44a1fbb574eacc0ca99801fb1359b30066d9',
            'scripts/cmi_flu_strategy_e12a_v2_sanitize.py':'7056a580d1c9e157936b896dbdc829a87a11f2cb',
            'scripts/cmi_flu_strategy_e12a_execute.py':'46bfb2c29002775c57abcef024f239276470fd9e',
            'scripts/cmi_flu_strategy_e01_prepare_v2.py':'7a0a3484778afd0f7372f8182dd65c76b0b0e071',
            'scripts/cmi_flu_strategy_e01_prepare.py':'692cf1f521f5a377eebb7a85f8f6aae3821e5007',
            'scripts/cmi_flu_task11_prior_immunity_prepare_v2.py':'12fb52988e365b9c4e215c884b5ca724cb32ae5b',
            'scripts/kaggle_current_output_read.py':'37caa4dbbd42f2970b5d950ab6adbc08c6a6097d',
            'scripts/kaggle_exact_identity.py':'d4b9ab1199aa21977bbc14541a6b7456b5984331',
            'requirements/kaggle-2.2.4.lock':'1b85d07980c34d32b63de4da61f0b94e89ca2474',
          }
          def blob(data): return hashlib.sha1(b'blob '+str(len(data)).encode('ascii')+b'\0'+data).hexdigest()
          for rel,want in expected.items():
              got=blob((root/rel).read_bytes())
              if got!=want: raise SystemExit(f'frozen dependency changed:{rel}:{got}')
          request=json.loads((root/'requests/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.json').read_text())
          assert request['request_id']=='20260911-cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001'
          assert request['target']=='renta0426/cmi-flu-e12a-v2-portfolio-reconcile-20260911-001'
          assert request['science_source_commit']=='e6e05e578f172ce710bc0f1da55acdf290e83dd9'
          assert request['strategy_e12a_v2_blob_sha']=='0c4c970c8bacfed61bfbb9587e0a0bfdec7903d9'
          assert request['resource']=={'accelerator':'cpu','expected_runtime_minutes':30,'hard_timeout_minutes':60,'max_active_runs':1}
          assert request['automatic_compute_retries']==0
          assert request['competition_submission_attempted'] is False
          assert request['leaderboard_used_for_selection'] is False
          parent=request['parent_e12a_v1']
          assert parent['target']=='renta0426/cmi-flu-e12a-final-reproduction-20260910-001'
          assert parent['kernel_version_consumed'] is True and parent['same_version_rerun_forbidden'] is True
          assert request['experiment_contract']['final_task13_incumbent']=='strict_asc_anchor'
          assert request['experiment_contract']['stale_task13_e01_control']=='b21_pls_1'
          base_tree=ast.parse((root/'scripts/cmi_flu_strategy_e12a_execute.py').read_text())
          base_calls=[n.func.attr for n in ast.walk(base_tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)]
          assert base_calls.count('kernels_push')==1
          wrapper_tree=ast.parse((root/'scripts/cmi_flu_strategy_e12a_v2_execute.py').read_text())
          wrapper_calls=[n.func.attr for n in ast.walk(wrapper_tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)]
          assert wrapper_calls.count('kernels_push')==0
          assert 'competition_submit' not in base_calls+wrapper_calls and 'competition_submit_new' not in base_calls+wrapper_calls
          print('CMI_FLU_E12A_V2_EXACT_RELAY PASS science=true base_write_calls=1 wrapper_write_calls=0 submission=false')
          PY
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_sanitize.py"

      - name: Build runtime and regression-test terminal success path
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_prepare.py" \
            --repository-root "${WORKDIR}/bridge" \
            --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${WORKDIR}/runtime.py")" -lt 900000 ]]
          grep -F 'REQUEST_ID = "20260911-cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'TARGET_KERNEL = "renta0426/cmi-flu-e12a-v2-portfolio-reconcile-20260911-001"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'SCIENCE_COMMIT = "e6e05e578f172ce710bc0f1da55acdf290e83dd9"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'E12A_V2_BLOB = "0c4c970c8bacfed61bfbb9587e0a0bfdec7903d9"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F '"Task1.3": "strict_asc_anchor"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F '"final_portfolio_member": False' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'def terminal_success_line(' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'CMI_FLU_E12A_V2_COMPLETE' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F "len(result['tasks'])" "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'renta0426/cmi-flu-e12a-final-reproduction-20260910-001' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'kaggle competitions submit' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'competition_submit' "${WORKDIR}/runtime.py" >/dev/null
          echo 'CMI_FLU_E12A_V2_TERMINAL_REGRESSION PASS tasks_key_absent=true terminal_fixture_executed=true'

      - name: Exercise generated runtime validator summary and aggregate sanitizer
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/runtime.py" "${WORKDIR}/fixture" <<'PY'
          import copy,hashlib,importlib.util,json,pathlib,sys
          runtime_path=pathlib.Path(sys.argv[1]); root=pathlib.Path(sys.argv[2]); root.mkdir()
          spec=importlib.util.spec_from_file_location('e12a_v2_generated_runtime',runtime_path)
          module=importlib.util.module_from_spec(spec); spec.loader.exec_module(module)
          portfolio={
            'Task1.1':'b21_pls_2',
            'Task1.2':'task12_anchor_residual_et_d5_l5_sqrt_lambda0.5',
            'Task1.3':'strict_asc_anchor',
            'Task1.4':'raw_pre_vacc_conserved_anchor',
            'Task2.1':'b21_et_subtype_d3_l5',
            'Task2.2':'b21_et_subtype_d5_l10',
            'Task2.3':'b21_ridge_exact_a100',
          }
          scores={
            'Task1.1':0.09970718035376519,
            'Task1.2':0.5271033295423541,
            'Task1.3':0.38158872734833993,
            'Task2.1':0.623449034547404,
            'Task2.2':0.576505972340535,
            'Task2.3':0.6957305642219944,
          }
          rows=[]
          for task,value in scores.items():
              row={'task':task,'incumbent':portfolio[task],'expected_study_equal_spearman':value,'observed_study_equal_spearman':value,'deviation':0.0,'absolute_deviation':0.0,'reproduced':True}
              if task=='Task1.3': row.update({'source':'E04/E04b retained strict ASC anchor','predictor_feature':'flow_rank__Antibody-secreting_cells_(ASC)','challenge_rows':40,'challenge_anchor_complete':True,'challenge_anchor_unique_values':17})
              else: row.update({'source':'accepted_e01_reproduction_harness','undefined_fold_count':0,'constant_fold_count':0})
              rows.append(row)
          metrics={
            'schema_version':1,
            'experiment':'strategy_v2_e12a_v2_portfolio_reconciliation',
            'comparison_contract':'paired_subject_purged_v2',
            'reproduction_absolute_tolerance':2e-6,
            'source_e12a_v1_experiment':'strategy_v2_e12a_final_system_reproduction',
            'source_e12a_v1_disposition':'reproduction_harness_passed_final_portfolio_invalid_stale_task13_identity',
            'source_e01_experiment':'strategy_v2_e01_paired_evaluation',
            'portfolio_manifest_corrected':True,
            'corrected_task':'Task1.3',
            'stale_task13_e01_control':{'incumbent':'b21_pls_1','study_equal_spearman':0.10630410834652516,'final_portfolio_member':False},
            'task13_strict_anchor_gain_vs_e01_control':0.38158872734833993-0.10630410834652516,
            'supervised_reproduction':sorted(rows,key=lambda r:r['task']),
            'all_supervised_tasks_reproduced':True,
            'task14_contract':{'task':'Task1.4','incumbent':'raw_pre_vacc_conserved_anchor','source_experiment':'strategy_v2_e07_task14_formal_closure','supervised_cv_available':False,'outcomes_accessed':False,'challenge_subjects_expected':40,'incumbent_changed':False},
            'e11_task11_candidates_carried':[],
            'frozen_portfolio':portfolio,
            'portfolio_provenance':{},
            'portfolio_task_count':7,
            'new_model_selection_performed':False,
            'competition_incumbent_changed':False,
            'public_probe_authorized':False,
            'competition_submission_authorized':False,
            'leaderboard_used_for_selection':False,
            'competition_submission_attempted':False,
            'contains_participant_identifiers':False,
            'contains_row_level_predictions':False,
            'next_step':'proceed_to_E12b_challenge_prediction_freeze',
          }
          module.validate_result(metrics)
          terminal=module.terminal_success_line(metrics,28)
          assert 'portfolio_tasks=7' in terminal and 'all_reproduced=true' in terminal and 'tasks=' not in terminal
          summary=module.render_summary(metrics)
          bad=copy.deepcopy(metrics); bad['frozen_portfolio']['Task1.3']='b21_pls_1'
          try: module.validate_result(bad)
          except module.BridgeContractError: pass
          else: raise SystemExit('stale Task1.3 final portfolio unexpectedly accepted')
          (root/'metrics.json').write_text(json.dumps(metrics,indent=2,sort_keys=True)+'\n')
          (root/'summary.md').write_text(summary)
          sha=lambda path:hashlib.sha256(path.read_bytes()).hexdigest()
          bridge={
            'schema_version':1,
            'request_id':'20260911-cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001',
            'competition':'cmi-flu-first-prediction-challenge',
            'target_kernel':'renta0426/cmi-flu-e12a-v2-portfolio-reconcile-20260911-001',
            'science_commit':'e6e05e578f172ce710bc0f1da55acdf290e83dd9',
            'strategy_e01_blob_sha':'dd27aea0cf97d41bad3cec64819c4c4269d94cbd',
            'strategy_e01_v2_blob_sha':'8cc64dc5ab9483d5957cfada18d445188566c56c',
            'config_blob_sha':'170d3211e2795c0730e481056c7bb068accf97c9',
            'package_sha256':'fixture',
            'python_version':sys.version.split()[0],
            'md5_verified_count':28,
            'metrics_sha256':sha(root/'metrics.json'),
            'summary_sha256':sha(root/'summary.md'),
            'frozen_portfolio':portfolio,
            'all_supervised_tasks_reproduced':True,
            'portfolio_manifest_corrected':True,
            'corrected_task':'Task1.3',
            'next_step':'proceed_to_E12b_challenge_prediction_freeze',
            'strategy_e12a_v2_blob_sha':'0c4c970c8bacfed61bfbb9587e0a0bfdec7903d9',
            'strategy_e12a_v2_contract_blob_sha':'6b40ac35a3b43c3bafcdd08fcc49fc9fe22960c1',
            'competition_submission_attempted':False,
            'leaderboard_used_for_selection':False,
            'contains_participant_identifiers':False,
            'contains_row_level_predictions':False,
          }
          (root/'bridge-result.json').write_text(json.dumps(bridge,indent=2,sort_keys=True)+'\n')
          print('CMI_FLU_E12A_V2_GENERATED_RUNTIME_FIXTURE PASS validator=true terminal=true stale_task13_rejected=true')
          PY
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_sanitize.py" --input-dir "${WORKDIR}/fixture"

      - name: Validate locked Kaggle client without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one private CPU E12a-v2 reconciliation and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Enforce protected E12a-v2 execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e12a-v2-portfolio-reconciliation-001.yml@refs/heads/main" ]]

      - name: Materialize exact approved bridge commit and E12a-v2 runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a-v2-run/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split("/",1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip("/").endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or ".." in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e12a_v2_prepare.py" \
            --repository-root "${workdir}/bridge" \
            --output "${workdir}/runtime.py"
          python3 "${workdir}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${workdir}/runtime.py")" -lt 900000 ]]
          ! grep -F "len(result['tasks'])" "${workdir}/runtime.py" >/dev/null
          ! grep -F 'renta0426/cmi-flu-e12a-final-reproduction-20260910-001' "${workdir}/runtime.py" >/dev/null
          echo 'CMI_FLU_E12A_V2_PROTECTED_MATERIALIZATION PASS write=false compute=false terminal_path=true'

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Run one approved E12a-v2 CPU operation and recover current aggregate output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --output-dir "${WORKDIR}/result"

      - name: Validate and print aggregate-safe E12a-v2 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_v2_sanitize.py" --input-dir "${WORKDIR}/result"
          python3 - "${WORKDIR}/result/metrics.json" <<'PY'
          import json,sys
          result=json.load(open(sys.argv[1],encoding='utf-8'))
          print('CMI_FLU_E12A_V2_RESULT '+json.dumps({
              'experiment':result['experiment'],
              'all_supervised_tasks_reproduced':result['all_supervised_tasks_reproduced'],
              'corrected_task':result['corrected_task'],
              'final_task13':result['frozen_portfolio']['Task1.3'],
              'task13_gain_vs_stale_e01_control':result['task13_strict_anchor_gain_vs_e01_control'],
              'next_step':result['next_step'],
              'competition_submission_attempted':result['competition_submission_attempted'],
          },sort_keys=True))
          for row in result['supervised_reproduction']:
              print('CMI_FLU_E12A_V2_TASK '+json.dumps({
                  'task':row['task'],
                  'incumbent':row['incumbent'],
                  'observed':row['observed_study_equal_spearman'],
                  'absolute_deviation':row['absolute_deviation'],
                  'reproduced':row['reproduced'],
              },sort_keys=True))
          PY

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
