name: CMI-Flu B1 request 003 submission score verification

on:
  push:
    branches:
      - main
    paths:
      - requests/cmi-flu-b1-score-v3.json

permissions: {}

concurrency:
  group: kaggle-read-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b1-score-v3.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge

jobs:
  verify:
    name: Read exactly one request-003 submission status
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/93-cmi-flu-b1-score-v3.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "PROTECTED_CMI_B1_SCORE_003 PASS"

      - name: Validate score request and prepare locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import json, os, pathlib, re, ssl, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA_VALUE']}/"

          def read(path: str, limit: int) -> bytes:
              with urllib.request.urlopen(base + path, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          raw = read(os.environ["REQUEST_PATH"], 8192)
          request = json.loads(raw)
          expected_keys = {
              "schema_version", "request_id", "parent_request_id", "competition",
              "operation", "submission_ref", "api_budget", "side_effects",
              "rules_checked_at_utc",
          }
          if set(request) != expected_keys:
              raise SystemExit("score request fields differ from v3 schema")
          if request.get("schema_version") != 3:
              raise SystemExit("score schema mismatch")
          if not re.fullmatch(r"20260902-cmi-flu-b1-score-003-00[1-3]", str(request.get("request_id", ""))):
              raise SystemExit("score request id outside bounded allowlist")
          if request.get("parent_request_id") != "20260902-cmi-flu-b1-submit-003":
              raise SystemExit("score parent request mismatch")
          if request.get("competition") != "cmi-flu-first-prediction-challenge" or request.get("operation") != "submission_status":
              raise SystemExit("score competition/operation mismatch")
          ref = request.get("submission_ref")
          if not isinstance(ref, int) or ref <= 0:
              raise SystemExit("submission_ref must be a positive integer")
          if request.get("api_budget") != {"max_calls": 5, "max_pages": 1} or request.get("side_effects") != []:
              raise SystemExit("score budget/side-effect contract mismatch")
          if not re.fullmatch(r"2026-09-\d{2}T\d{2}:\d{2}:\d{2}Z", str(request.get("rules_checked_at_utc", ""))):
              raise SystemExit("rules_checked_at_utc is invalid")
          (root / "request.json").write_bytes(raw)

          lock = read(os.environ["LOCK_RELATIVE_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          print("CMI_B1_SCORE_REQUEST_003_STATIC PASS")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Fetch live rules and exactly one submission record
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import json, math, os, re
          from kaggle.api.kaggle_api_extended import KaggleApi

          request = json.load(open(os.path.join(os.environ["WORKDIR"], "request.json"), encoding="utf-8"))
          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(request["competition"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition rules/evaluation unavailable")
          plain = lambda text: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", text)).casefold()
          if "maximum of five (5) submissions per day" not in plain(content["rules"]):
              raise SystemExit("live submission limit differs from approved assumption")
          if "mean spearman correlation" not in plain(content["evaluation"]):
              raise SystemExit("live evaluation differs from approved assumption")

          ref = int(request["submission_ref"])
          submission = api.get_submission(str(ref))
          actual_ref = int(getattr(submission, "ref", 0) or 0)
          if actual_ref != ref:
              raise SystemExit("Kaggle returned unexpected submission ref")
          status_obj = getattr(submission, "status", None)
          status = str(getattr(status_obj, "name", status_obj or "UNKNOWN")).upper()
          if "ERROR" in status:
              raise SystemExit("B1 request-003 submission reached ERROR")
          if "COMPLETE" not in status:
              print(f"CMI_B1_SUBMISSION_STATUS request_id={request['request_id']} submission_ref={ref} status={status} public_score=pending")
              raise SystemExit(0)
          try:
              score = float(getattr(submission, "public_score", None))
          except (TypeError, ValueError) as exc:
              raise SystemExit("completed submission has no numeric Public score") from exc
          if not math.isfinite(score) or not -1.0 <= score <= 1.0:
              raise SystemExit("Public score outside expected Spearman bounds")
          print(f"CMI_B1_SUBMISSION_STATUS request_id={request['request_id']} submission_ref={ref} status=COMPLETE public_score={score:.10g}")
          PY

      - name: Cleanup runner-local score request
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "Runner-local CMI-Flu B1 score-v3 content removed"
