name: CMI-Flu Strategy-v2 E12a final reproduction repair 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-final-reproduction-repair-001.yml
      - docs/incidents/cmi-flu-e12a-001-materialization-workdir.md
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e12a-final-reproduction-repair-001.yml
      - docs/incidents/cmi-flu-e12a-001-materialization-workdir.md

permissions: {}

concurrency:
  group: cmi-flu-e12a-final-reproduction-repair-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260910-cmi-flu-strategy-e12a-final-reproduction-001
  TARGET_KERNEL: renta0426/cmi-flu-e12a-final-reproduction-20260910-001
  SCIENCE_COMMIT: f227694aee240a05de1b4e318a8c17acc2db5651
  E12A_BLOB: 84c9368d520b2b7f88f189d9d9a92a3306e54b0e
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate single E12a materialization repair without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit and exercise repaired same-step runtime build
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a-repair/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split("/",1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip("/").endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or ".." in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          # Regression for run 34494784507/job 102930444158: use the shell-local
          # variable in this same step. GITHUB_ENV is only for later steps.
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e12a_prepare.py" \
            --repository-root "${workdir}/bridge" \
            --output "${workdir}/runtime.py"
          python3 "${workdir}/runtime.py" --self-test
          [[ -s "${workdir}/runtime.py" ]]
          echo 'CMI_FLU_E12A_WORKDIR_REPAIR_REGRESSION PASS same_step_local_workdir=true write=false compute=false'

      - name: Prove frozen request and runtime dependency identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import ast,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          expected={
            'requests/cmi-flu-strategy-e12a-final-reproduction-001.json':'91a9fac4ab6d51ad80d63d8c80b5c79df28abf0e',
            'payloads/cmi-flu-strategy-e12a-final-reproduction-001/strategy_e12a.py':'84c9368d520b2b7f88f189d9d9a92a3306e54b0e',
            'scripts/cmi_flu_strategy_e12a_prepare.py':'8bd3baedc752c98ed279c0488be0332bf894a1a7',
            'scripts/cmi_flu_strategy_e12a_execute.py':'46bfb2c29002775c57abcef024f239276470fd9e',
            'scripts/cmi_flu_strategy_e12a_sanitize.py':'5ff7a2e651d979e41c31badcb6ac54dbd6f28c48',
            'scripts/cmi_flu_strategy_e01_prepare_v2.py':'7a0a3484778afd0f7372f8182dd65c76b0b0e071',
            'scripts/cmi_flu_strategy_e01_prepare.py':'692cf1f521f5a377eebb7a85f8f6aae3821e5007',
            'scripts/cmi_flu_task11_prior_immunity_prepare_v2.py':'12fb52988e365b9c4e215c884b5ca724cb32ae5b',
            'scripts/kaggle_current_output_read.py':'37caa4dbbd42f2970b5d950ab6adbc08c6a6097d',
            'scripts/kaggle_exact_identity.py':'d4b9ab1199aa21977bbc14541a6b7456b5984331',
            'requirements/kaggle-2.2.4.lock':'1b85d07980c34d32b63de4da61f0b94e89ca2474',
          }
          def git_blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode('ascii')+b'\0'+data).hexdigest()
          for rel,want in expected.items():
              data=(root/rel).read_bytes(); got=git_blob(data)
              if got!=want: raise SystemExit(f'frozen dependency changed:{rel}:{got}')
          request=json.loads((root/'requests/cmi-flu-strategy-e12a-final-reproduction-001.json').read_text())
          assert request['request_id']=='20260910-cmi-flu-strategy-e12a-final-reproduction-001'
          assert request['target']=='renta0426/cmi-flu-e12a-final-reproduction-20260910-001'
          assert request['science_source_commit']=='f227694aee240a05de1b4e318a8c17acc2db5651'
          assert request['strategy_e12a_blob_sha']=='84c9368d520b2b7f88f189d9d9a92a3306e54b0e'
          assert request['expected_kernel_version']==1
          assert request['enable_internet'] is False
          assert request['resource']['accelerator']=='cpu' and request['resource']['max_active_runs']==1
          assert request['automatic_compute_retries']==0
          assert request['competition_submission_attempted'] is False
          execute=ast.parse((root/'scripts/cmi_flu_strategy_e12a_execute.py').read_text())
          calls=[n.func.attr for n in ast.walk(execute) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)]
          assert calls.count('kernels_push')==1
          assert 'competition_submit' not in calls and 'competition_submit_new' not in calls
          print('CMI_FLU_E12A_FROZEN_DEPENDENCIES PASS exact=true science_changed=false target_changed=false')
          PY
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_sanitize.py"
          [[ "$(stat -c '%s' "${WORKDIR}/runtime.py")" -lt 900000 ]]
          grep -F 'SCIENCE_COMMIT = "f227694aee240a05de1b4e318a8c17acc2db5651"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'E12A_BLOB = "84c9368d520b2b7f88f189d9d9a92a3306e54b0e"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F '# CMI-Flu Strategy-v2 E12a final-system reproduction audit' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'kaggle competitions submit' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'competition_submit' "${WORKDIR}/runtime.py" >/dev/null

      - name: Validate locked Kaggle client without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one repaired private CPU E12a reproduction and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Enforce protected repaired execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e12a-final-reproduction-repair-001.yml@refs/heads/main" ]]

      - name: Materialize exact approved bridge commit and runtime with local workdir
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12a-repair-run/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split("/",1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip("/").endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or ".." in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e12a_prepare.py" \
            --repository-root "${workdir}/bridge" \
            --output "${workdir}/runtime.py"
          python3 "${workdir}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${workdir}/runtime.py")" -lt 900000 ]]
          echo 'CMI_FLU_E12A_REPAIRED_MATERIALIZATION PASS write=false compute=false'

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Run exactly one approved E12a operation and recover current aggregate output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --output-dir "${WORKDIR}/result"

      - name: Validate and print aggregate-safe E12a result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e12a_sanitize.py" --input-dir "${WORKDIR}/result"
          python3 - "${WORKDIR}/result" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          metrics=json.loads((root/'metrics.json').read_text())
          bridge=json.loads((root/'bridge-result.json').read_text())
          projection={
            'experiment':metrics['experiment'],
            'comparison_contract':metrics['comparison_contract'],
            'supervised_reproduction':metrics['supervised_reproduction'],
            'all_supervised_tasks_reproduced':metrics['all_supervised_tasks_reproduced'],
            'task14_contract':metrics['task14_contract'],
            'e11_task11_candidates_carried':metrics['e11_task11_candidates_carried'],
            'frozen_portfolio':metrics['frozen_portfolio'],
            'portfolio_task_count':metrics['portfolio_task_count'],
            'new_model_selection_performed':metrics['new_model_selection_performed'],
            'incumbent_changed':metrics['incumbent_changed'],
            'next_step':metrics['next_step'],
            'provenance':{
              'request_id':bridge['request_id'],
              'target_kernel':bridge['target_kernel'],
              'science_commit':bridge['science_commit'],
              'strategy_e12a_blob_sha':bridge['strategy_e12a_blob_sha'],
              'metrics_sha256':bridge['metrics_sha256'],
              'summary_sha256':bridge['summary_sha256'],
            },
          }
          print('CMI_FLU_E12A_RESULT '+json.dumps(projection,sort_keys=True,separators=(',',':')))
          PY

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
