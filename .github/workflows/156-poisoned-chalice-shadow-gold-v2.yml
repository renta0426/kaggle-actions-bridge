          def git_blob(data):
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          if git_blob(launcher_data) != request.get("launcher_blob_sha"):
              raise SystemExit("Gold v2 launcher blob mismatch")
