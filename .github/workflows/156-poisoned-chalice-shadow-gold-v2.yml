          python3 - "${workdir}/kernel" <<'PY'
          import ast, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          notebook = json.loads((root / "shadow-gold-architecture-transfer-v2.ipynb").read_text())
          metadata = json.loads((root / "kernel-metadata.json").read_text())
          code = "".join(notebook["cells"][1]["source"])
          compile(code, "shadow-gold-architecture-transfer-v2.ipynb", "exec")
          tree = ast.parse(code)
          required = (
              "shadow-gold-architecture-transfer-v2",
              "f8678f3d5d0a99763e02906f24c7a34e09e12f5e",
              "shadow-gold-jsonl-column-order-v2",
              "from poisoned_chalice.shadow_gold_kaggle_v2 import run_gold_benchmark",
              "persistence_readback_repair",
              "scientific_protocol_changed",
              "timeout_seconds=3000",
          )
          for marker in required:
              assert marker in code
          assert "from poisoned_chalice.shadow_gold_kaggle import run_gold_benchmark" not in code
          calls = [n for n in ast.walk(tree) if isinstance(n, ast.Call) and isinstance(n.func, ast.Name) and n.func.id == "run_gold_benchmark"]
