name: Poisoned Chalice Gold controlled architecture transfer v2

on:
  push:
    branches: [main]
    paths:
      - requests/poisoned-chalice-shadow-gold-v2.json
      - scripts/poisoned_chalice_shadow_gold_v2.py
      - materialized/poisoned-chalice-shadow-gold-v2/**
      - .github/workflows/156-poisoned-chalice-shadow-gold-v2.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-shadow-gold-v2.json
      - scripts/poisoned_chalice_shadow_gold_v2.py
      - materialized/poisoned-chalice-shadow-gold-v2/**
      - .github/workflows/156-poisoned-chalice-shadow-gold-v2.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-shadow-gold-v2.json
  LAUNCHER_PATH: scripts/poisoned_chalice_shadow_gold_v2.py
  BASE_LAUNCHER_PATH: scripts/poisoned_chalice_shadow_gold_v1.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_KERNEL: renta0426/shadow-gold-architecture-transfer-v2
  TARGET_COMPETITION: poisoned-chalice-icse27
  MAX_ACTIVE_REMOTE_RUNS: "2"

jobs:
  validate:
    name: Validate repaired Gold T4 x2 bundle without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate exact v1 science plus v2 repair and generated Notebook
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
