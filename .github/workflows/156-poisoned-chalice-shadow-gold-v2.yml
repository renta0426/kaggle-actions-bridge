          resource = request.get("resource") or {}
          if resource.get("accelerator") != "gpu" or resource.get("machine_shape") != "NvidiaTeslaT4":
              raise SystemExit("Gold v2 GPU resource contract changed")
          if resource.get("expected_visible_gpu_count") != 2 or resource.get("max_active_runs") != 2:
              raise SystemExit("Gold v2 concurrency contract changed")
          if float(resource.get("min_remaining_quota_hours", -1)) != 1.0:
