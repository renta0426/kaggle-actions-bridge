name: CMI-Flu E11b 005 source metadata read-only audit 002

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-e11b-005-source-metadata-audit-002.yml
      - requests/cmi-flu-e11b-005-source-metadata-audit-002.json
      - scripts/cmi_flu_e11b_005_source_metadata_audit_v2.py
      - scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize_v2.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-e11b-005-source-metadata-audit-002.yml
      - requests/cmi-flu-e11b-005-source-metadata-audit-002.json
      - scripts/cmi_flu_e11b_005_source_metadata_audit_v2.py
      - scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize_v2.py

permissions: {}

concurrency:
  group: cmi-flu-e11b-005-source-metadata-audit-002-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260910-cmi-flu-e11b-005-source-metadata-audit-002
  TARGET_KERNEL: renta0426/cmi-flu-e11b-tabpfn3-20260910-005
  EXPECTED_VERSION: "1"
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate exact read-only metadata repair without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY TABPFN_TOKEN HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11b-metadata-audit-002/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1: raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts: raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Validate repair provenance and one-read contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import ast,hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          manifest=json.loads((root/'requests/cmi-flu-e11b-005-source-metadata-audit-002.json').read_text())
          assert manifest['request_id']=='20260910-cmi-flu-e11b-005-source-metadata-audit-002'
          assert manifest['parent_request_id']=='20260910-cmi-flu-e11b-005-source-metadata-audit-001'
          assert manifest['target']=='renta0426/cmi-flu-e11b-tabpfn3-20260910-005'
          assert manifest['expected_kernel_version']==1
          assert manifest['repair_from']['failed_bridge_run_id']==34458275946
          assert manifest['repair_from']['failed_bridge_job_id']==102809839733
          assert manifest['repair_from']['exception_type']=='AttributeError'
          assert manifest['repair_from']['kaggle_exact_metadata_http_request_attempted'] is False
          assert manifest['repair_scope']['method']=='reuse existing scripts/kaggle_exact_identity.py exact_metadata'
          assert manifest['repair_scope']['exact_read_calls']==1
          assert manifest['repair_scope']['fallback_to_search_or_list'] is False
          assert manifest['repair_scope']['retry_exact_read'] is False
          assert manifest['repair_scope']['validator_repair_authorized_by_this_request'] is False
          assert manifest['new_write_attempted'] is False and manifest['new_compute_requested'] is False
          assert manifest['competition_submission_attempted'] is False and manifest['output_download_requested'] is False
          assert manifest['consumed_target_rerun_authorized'] is False and manifest['automatic_compute_retries']==0

          def blob_sha(path):
            data=path.read_bytes(); return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          assert blob_sha(root/'scripts/cmi_flu_e11b_005_source_metadata_audit.py')==manifest['source_audit_base_blob_sha']
          assert blob_sha(root/'scripts/kaggle_exact_identity.py')==manifest['exact_identity_helper_blob_sha']

          source=(root/'scripts/cmi_flu_e11b_005_source_metadata_audit_v2.py').read_text()
          tree=ast.parse(source)
          attrs=[n.func.attr for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)]
          names=[n.func.id for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Name)]
          assert attrs.count('authenticate')==1
          assert 'kernel_metadata' not in attrs
          assert names.count('exact_metadata')==1
          assert 'kernels_list' not in attrs and 'kernels_status' not in attrs
          forbidden={'kernels_push','kernels_output','kernel_output','competition_submit','competition_submit_new','kernel_pull','kernels_pull','save_kernel'}
          assert forbidden.isdisjoint(attrs), sorted(forbidden.intersection(attrs))
          assert not any(isinstance(n,ast.Import) and any(a.name=='subprocess' for a in n.names) for n in ast.walk(tree))
          assert not any(isinstance(n,ast.ImportFrom) and n.module=='subprocess' for n in ast.walk(tree))

          helper=ast.parse((root/'scripts/kaggle_exact_identity.py').read_text())
          exact=[n for n in helper.body if isinstance(n,ast.FunctionDef) and n.name=='exact_metadata']
          assert len(exact)==1
          helper_attrs=[n.func.attr for n in ast.walk(exact[0]) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)]
          assert helper_attrs.count('get_kernel')==1
          assert forbidden.isdisjoint(helper_attrs)
          PY
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize_v2.py"

      - name: Test inherited projection and sanitizer with locked Kaggle API
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_v2.py" --self-test
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" - "${WORKDIR}/synthetic-output" <<'PY'
          import pathlib,sys
          import cmi_flu_e11b_005_source_metadata_audit_v2 as audit
          class Source:
              ref='prior-labsai/tabpfn-3/pytorch/default/1'; source_type='MODEL'; version_number=1
          class Metadata:
              ref=audit.TARGET; current_version_number=1; is_private=True
              enable_gpu=False; enable_tpu=False; enable_internet=True
              model_data_sources=[Source()]
              competition_data_sources=[{'ref':'cmi-flu-first-prediction-challenge'}]
          payload=audit.base.build_audit(Metadata())
          payload['operation']='kernel_exact_metadata_source_projection_read'
          audit.base.validate_audit(payload)
          audit.base.write_audit(payload,pathlib.Path(sys.argv[1]))
          PY
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize_v2.py" --output-dir "${WORKDIR}/synthetic-output"

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  audit:
    name: Read consumed E11b-005 metadata once via exact GetKernel
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce protected read-only execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
          RUNNER_OS_VALUE: ${{ runner.os }}
          RUNNER_ARCH_VALUE: ${{ runner.arch }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-e11b-005-source-metadata-audit-002.yml@refs/heads/main" ]]
          [[ "$RUNNER_ENVIRONMENT_VALUE" == "github-hosted" && "$RUNNER_OS_VALUE" == "Linux" && "$RUNNER_ARCH_VALUE" == "X64" ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"

      - name: Materialize exact approved bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e11b-metadata-audit-002/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1: raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts: raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Install locked Kaggle API 2.2.4
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Read exact consumed target metadata once with no write or compute
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_v2.py" --output-dir "${WORKDIR}/output"
          unset KAGGLE_API_TOKEN

      - name: Sanitize and expose only the bounded metadata projection
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e11b_005_source_metadata_audit_sanitize_v2.py" --output-dir "${WORKDIR}/output"
          python3 - "${WORKDIR}/output/source-metadata-audit.json" <<'PY'
          import json,pathlib,sys
          payload=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print('CMI_FLU_E11B_005_SOURCE_METADATA_RESULT_002 '+json.dumps(payload,sort_keys=True,separators=(',',':')))
          PY

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
