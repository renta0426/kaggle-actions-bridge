name: CMI-Flu strategy E11a failed output recovery 002

on:
  pull_request:
    branches: [main]
    paths:
      - requests/cmi-flu-strategy-e11a-failed-output-recovery-002.json
      - .github/workflows/cmi-flu-strategy-e11a-failed-output-recovery-002.yml
  push:
    branches: [main]
    paths:
      - requests/cmi-flu-strategy-e11a-failed-output-recovery-002.json
      - .github/workflows/cmi-flu-strategy-e11a-failed-output-recovery-002.yml

permissions: {}

concurrency:
  group: kaggle-readonly-cmi-flu-e11a-failed-output-recovery-002
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-strategy-e11a-failed-output-recovery-002.json
  SANITIZER_PATH: scripts/cmi_flu_strategy_e11a_sanitize.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  POLICY_PATH: scripts/kaggle_policy_preflight.py
  TARGET_OWNER: renta0426
  TARGET_SLUG: cmi-flu-e11a-task11-pairwise-20260910-001
  TARGET_KERNEL: renta0426/cmi-flu-e11a-task11-pairwise-20260910-001
  OUTPUT_PATTERN: '^(bridge-result\.json|metrics\.json|summary\.md)$'

jobs:
  validate:
    name: Validate secret-free E11a filtered recovery
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate fixed read-only request, CLI option, and sanitizer
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"; trap 'rm -rf "${workdir}"' EXIT
          for path in "${REQUEST_PATH}" "${SANITIZER_PATH}" "${POLICY_PATH}"; do
            curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
              "https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${source_sha}/${path}" \
              -o "${workdir}/$(basename "${path}")"
          done
          python3 "${workdir}/kaggle_policy_preflight.py"
          python3 -m py_compile "${workdir}/cmi_flu_strategy_e11a_sanitize.py"
          python3 - "${workdir}/$(basename "${REQUEST_PATH}")" <<'PY'
          import json,sys
          request=json.load(open(sys.argv[1],encoding='utf-8'))
          assert request['schema_version']==1
          assert request['request_id']=='20260910-cmi-flu-strategy-e11a-failed-output-recovery-002'
          assert request['parent_request_id']=='20260910-cmi-flu-strategy-e11a-task11-pairwise-001'
          assert request['prior_recovery_request_id']=='20260910-cmi-flu-strategy-e11a-failed-output-recovery-001'
          assert request['target']=='renta0426/cmi-flu-e11a-task11-pairwise-20260910-001'
          assert request['expected_current_version']==1
          assert request['failure_stage']=='write_outputs'
          assert request['failure_exception_type']=='KeyError'
          assert request['failure_error_code']=='6d98aeb26dde4e8134ee'
          assert request['failure_exact_message']=="'tasks'"
          assert request['output_file_pattern']==r'^(bridge-result\.json|metrics\.json|summary\.md)$'
          assert request['expected_output_paths']==['bridge-result.json','metrics.json','summary.md']
          assert request['side_effects']==[] and request['automatic_compute_retries']==0
          assert request['competition_submission'] is False and request['raw_output_persisted'] is False
          assert request['publish_only_sanitized_aggregate'] is True
          print('CMI_FLU_E11A_FILTERED_RECOVERY_VALIDATE PASS side_effects=0 retries=0')
          PY

  recover:
    name: Read only declared E11a aggregate files from failed version 1
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e11a-failed-output-recovery-002.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${EVENT_SHA}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          python3 "${workdir}/repo/${POLICY_PATH}"
          echo 'CMI_FLU_E11A_FILTERED_RECOVERY_BOUNDARY PASS write=false compute=false raw_output_persisted=false'

      - name: Prepare locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/repo/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" kernels output --help | grep -F -- '--file-pattern' >/dev/null
          echo 'CMI_FLU_E11A_FILTERED_RECOVERY_CLIENT PASS kaggle_cli=2.2.4 file_pattern=true'

      - name: Fetch only aggregate allowlist and sanitize once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          api=KaggleApi(); api.authenticate(); target=os.environ['TARGET_KERNEL']
          discovered=api.kernels_list(user=os.environ['TARGET_OWNER'],search=os.environ['TARGET_SLUG'],page_size=10) or []
          refs=[str(getattr(item,'ref','') or '') for item in discovered]
          if refs.count(target)!=1: raise SystemExit(f'exact target mismatch count={refs.count(target)}')
          status=str(getattr(api.kernels_status(target),'status','') or '').upper()
          with api.build_kaggle_client() as client:
              req=ApiGetKernelRequest(); req.user_name=os.environ['TARGET_OWNER']; req.kernel_slug=os.environ['TARGET_SLUG']
              metadata=client.kernels.kernels_api_client.get_kernel(req).metadata
          current=int(getattr(metadata,'current_version_number',0) or 0)
          if str(metadata.ref)!=target or not bool(metadata.is_private) or current!=1:
              raise SystemExit(f'exact current identity mismatch current={current}')
          if 'ERROR' not in status and 'FAIL' not in status:
              raise SystemExit(f'expected failed terminal status, got {status}')
          print(f'CMI_FLU_E11A_FILTERED_RECOVERY_STATUS state=error version={current}')
          PY
          mkdir -p "${WORKDIR}/output"
          set +e
          "${WORKDIR}/kaggle-venv/bin/kaggle" kernels output "${TARGET_KERNEL}" -p "${WORKDIR}/output" --file-pattern "${OUTPUT_PATTERN}" >"${WORKDIR}/output.stdout" 2>"${WORKDIR}/output.stderr"
          rc=$?
          set -e
          stdout_bytes=$(wc -c <"${WORKDIR}/output.stdout"); stderr_bytes=$(wc -c <"${WORKDIR}/output.stderr")
          rm -f "${WORKDIR}/output.stdout" "${WORKDIR}/output.stderr"
          echo "CMI_FLU_E11A_FILTERED_RECOVERY_FETCH rc=${rc} stdout_bytes=${stdout_bytes} stderr_bytes=${stderr_bytes}"
          [[ "${rc}" -eq 0 ]]
          "${WORKDIR}/kaggle-venv/bin/python" - "${WORKDIR}/output" <<'PY'
          import pathlib,sys
          root=pathlib.Path(sys.argv[1]); files=sorted(p for p in root.rglob('*') if p.is_file())
          rel=[p.relative_to(root).as_posix() for p in files]
          if rel!=['bridge-result.json','metrics.json','summary.md']:
              raise SystemExit(f'filtered-output file set mismatch count={len(rel)}')
          total=sum(p.stat().st_size for p in files)
          if total<=0 or total>2_000_000: raise SystemExit(f'filtered-output byte contract total={total}')
          print(f'CMI_FLU_E11A_FILTERED_RECOVERY_FILES count=3 total_bytes={total}')
          PY
          python3 "${WORKDIR}/repo/${SANITIZER_PATH}" --input-dir "${WORKDIR}/output"
          "${WORKDIR}/kaggle-venv/bin/python" - "${WORKDIR}/output" <<'PY'
          import hashlib,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          for name in ('bridge-result.json','metrics.json','summary.md'):
              p=root/name; data=p.read_bytes()
              print(f'CMI_FLU_E11A_FILTERED_RECOVERY_HASH name={name} bytes={len(data)} sha256={hashlib.sha256(data).hexdigest()}')
          PY
          rm -rf "${WORKDIR}/output"
          unset KAGGLE_API_TOKEN
          echo 'CMI_FLU_E11A_FILTERED_RECOVERY_COMPLETE aggregate_only=true compute_replayed=false'

      - name: Cleanup all recovery material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'CMI_FLU_E11A_FILTERED_RECOVERY_CLEANUP PASS retention_days=0'
