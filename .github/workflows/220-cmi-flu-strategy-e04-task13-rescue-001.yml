name: CMI-Flu strategy E04 Task1.3 rescue CPU 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/220-cmi-flu-strategy-e04-task13-rescue-001.yml
      - requests/cmi-flu-strategy-e04-task13-rescue-001.json
      - scripts/cmi_flu_strategy_e04_prepare.py
      - scripts/cmi_flu_strategy_e04_prepare_v2.py
      - scripts/cmi_flu_strategy_e04_execute.py
      - scripts/cmi_flu_strategy_e04_sanitize.py
      - payloads/cmi-flu-strategy-e04-task13-rescue-001/**
  pull_request:
    paths:
      - .github/workflows/220-cmi-flu-strategy-e04-task13-rescue-001.yml
      - requests/cmi-flu-strategy-e04-task13-rescue-001.json
      - scripts/cmi_flu_strategy_e04_prepare.py
      - scripts/cmi_flu_strategy_e04_prepare_v2.py
      - scripts/cmi_flu_strategy_e04_execute.py
      - scripts/cmi_flu_strategy_e04_sanitize.py
      - payloads/cmi-flu-strategy-e04-task13-rescue-001/**

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260908-cmi-flu-strategy-e04-task13-rescue-001
  SCIENCE_COMMIT: 6e4d786cddc7b2d02dc4671d1c005db551d19ad6
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate exact E04 runtime on synthetic data
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done
      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e04-bridge/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
      - name: Install E04 synthetic modeling dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
      - name: Build exact science runtime and execute synthetic contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_prepare.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_prepare_v2.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_execute.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_sanitize.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_prepare_v2.py" --repository-root "${WORKDIR}/bridge" --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          mkdir "${WORKDIR}/synthetic"
          python3 "${WORKDIR}/runtime.py" --synthetic --output-dir "${WORKDIR}/synthetic"
          python3 - "${WORKDIR}/synthetic" <<'PY'
          import json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); assert sorted(p.name for p in root.iterdir())==['bridge-result.json','metrics.json','summary.md']
          b=json.loads((root/'bridge-result.json').read_text()); m=json.loads((root/'metrics.json').read_text())
          assert b['synthetic'] is True and b['science_commit']=='6e4d786cddc7b2d02dc4671d1c005db551d19ad6'
          assert b['strategy_e04_blob_sha']=='73c112a8bb3b1ee7a6dd5bfbd5645a945bea6ebb'
          assert m['experiment']=='strategy_v2_e04_task13_anchor_preserving_rescue' and m['task']=='Task1.3'
          assert m['frozen_conditions']['residual_alpha']==10.0 and m['frozen_conditions']['proxy_weights']==[0.25,1.0]
          assert m['frozen_control_reproduction']['status']=='synthetic_not_real_data'
          text=(root/'metrics.json').read_text(); assert '"participant_id"' not in text and '"subject_group"' not in text
          PY
          ! grep -R -E 'kaggle[[:space:]]+competitions[[:space:]]+submit|competition_submit\(' "${WORKDIR}/runtime.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_"* >/dev/null
          echo CMI_FLU_E04_VALIDATE_PASS
      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  launch:
    name: Run one private CPU E04 and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/220-cmi-flu-strategy-e04-task13-rescue-001.yml@refs/heads/main" ]]
      - name: Materialize exact bridge commit and build runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e04-bridge/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(40_000_001)
          if len(data)>40_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              if not m.name.startswith(prefix):raise SystemExit('archive prefix')
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e04_prepare_v2.py" --repository-root "${workdir}/bridge" --output "${workdir}/runtime.py"
          python3 "${workdir}/runtime.py" --self-test
      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"
      - name: Run one approved E04 CPU kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_execute.py" --runtime "${WORKDIR}/runtime.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"
      - name: Validate aggregate-only E04 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e04_sanitize.py" --input-dir "${WORKDIR}/output"
      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
