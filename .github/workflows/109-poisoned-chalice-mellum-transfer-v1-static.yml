name: Poisoned Chalice Mellum transfer v1 static validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/109-poisoned-chalice-mellum-transfer-v1-static.yml
      - .github/workflows/110-poisoned-chalice-mellum-transfer-v1-launch.yml
      - requests/poisoned-chalice-mellum-transfer-v1-launch.json
      - scripts/materialize_poisoned_chalice_mellum_v1.py
      - scripts/materialize_poisoned_chalice_mellum_v1_private.py
      - scripts/validate_poisoned_chalice_mellum_v1.py
  pull_request:
    paths:
      - .github/workflows/109-poisoned-chalice-mellum-transfer-v1-static.yml
      - .github/workflows/110-poisoned-chalice-mellum-transfer-v1-launch.yml
      - requests/poisoned-chalice-mellum-transfer-v1-launch.json
      - scripts/materialize_poisoned_chalice_mellum_v1.py
      - scripts/materialize_poisoned_chalice_mellum_v1_private.py
      - scripts/validate_poisoned_chalice_mellum_v1.py

permissions: {}

concurrency:
  group: poisoned-chalice-mellum-transfer-v1-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Validate request and separated credential boundaries
    if: github.repository == 'renta0426/kaggle-actions-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact event files without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "1354356687" ]]
          [[ "${EVENT_ACTOR}" == "renta0426" ]]
          [[ "${EVENT_ACTOR_ID}" == "71638068" ]]
          [[ "${EVENT_SENDER_ID}" == "71638068" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${PR_HEAD_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
            [[ "${PR_AUTHOR}" == "renta0426" ]]
          elif [[ "${EVENT_NAME}" != "push" ]]; then
            echo "unexpected event: ${EVENT_NAME}"
            exit 1
          fi
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - "${SOURCE_SHA}" <<'PY'
          from __future__ import annotations
          import pathlib, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha = sys.argv[1]
          root = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"
          paths = {
              ".github/workflows/110-poisoned-chalice-mellum-transfer-v1-launch.yml": 131072,
              "requests/poisoned-chalice-mellum-transfer-v1-launch.json": 32768,
              "scripts/materialize_poisoned_chalice_mellum_v1.py": 131072,
              "scripts/materialize_poisoned_chalice_mellum_v1_private.py": 131072,
              "scripts/validate_poisoned_chalice_mellum_v1.py": 131072,
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )
          for path, limit in paths.items():
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = pathlib.Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
          print("MELLUM_STATIC_SOURCE PASS files=5 credentials=absent")
          PY

      - name: Validate immutable request and separated secret steps
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_poisoned_chalice_mellum_v1.py

      - name: Cleanup fetched validation files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github requests scripts
          echo "MELLUM_STATIC_TEMPORARY_MATERIAL_REMOVED"
