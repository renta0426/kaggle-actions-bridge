name: Poisoned Chalice Mellum transfer v1 static validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/109-poisoned-chalice-mellum-transfer-v1-static.yml
      - .github/workflows/110-poisoned-chalice-mellum-transfer-v1-launch.yml
      - requests/poisoned-chalice-mellum-transfer-v1-launch.json
      - scripts/materialize_poisoned_chalice_mellum_v1.py
      - scripts/validate_poisoned_chalice_mellum_v1.py
  pull_request:
    paths:
      - .github/workflows/109-poisoned-chalice-mellum-transfer-v1-static.yml
      - .github/workflows/110-poisoned-chalice-mellum-transfer-v1-launch.yml
      - requests/poisoned-chalice-mellum-transfer-v1-launch.json
      - scripts/materialize_poisoned_chalice_mellum_v1.py
      - scripts/validate_poisoned_chalice_mellum_v1.py

permissions:
  contents: read

concurrency:
  group: poisoned-chalice-mellum-transfer-v1-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Validate request, materializer, bundle, and protected launch
    if: github.repository == 'renta0426/kaggle-actions-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the exact event revision without retaining credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Enforce credential-free source boundary
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_ID}" == "1354356687" ]]
          [[ "${EVENT_ACTOR}" == "renta0426" ]]
          [[ "${EVENT_ACTOR_ID}" == "71638068" ]]
          [[ "${EVENT_SENDER_ID}" == "71638068" ]]
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${PR_HEAD_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
            [[ "${PR_AUTHOR}" == "renta0426" ]]
          elif [[ "${EVENT_NAME}" != "push" ]]; then
            echo "unexpected event: ${EVENT_NAME}"
            exit 1
          fi
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected Kaggle credential: ${name}"; exit 1; }
          done
          echo "MELLUM_STATIC_BOUNDARY PASS event=${EVENT_NAME} credentials=absent"

      - name: Install pinned credential-free validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .static-venv
          .static-venv/bin/python -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            pandas==2.3.2 pyarrow==21.0.0 nbformat==5.10.4 >/dev/null
          .static-venv/bin/python -m pip check >/dev/null

      - name: Run full credential-free Mellum materialization
        shell: bash
        run: |
          set -euo pipefail
          .static-venv/bin/python scripts/validate_poisoned_chalice_mellum_v1.py

      - name: Cleanup validation environment
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .static-venv
          echo "MELLUM_STATIC_TEMPORARY_MATERIAL_REMOVED"
