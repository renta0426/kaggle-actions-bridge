name: CodeParrot fresh frozen 4k full v1 normalized v3 source

on:
  pull_request:
    paths:
      - scripts/normalize_codeparrot_pilot_v3_for_full.py
      - .github/workflows/210-codeparrot-fresh-full-v1-v3-normalized.yml
  push:
    branches: [main]
    paths:
      - scripts/normalize_codeparrot_pilot_v3_for_full.py
      - .github/workflows/210-codeparrot-fresh-full-v1-v3-normalized.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET_COMPETITION: poisoned-chalice-icse27
  PILOT_KERNEL: renta0426/codeparrot-fresh-pilot-v1
  COHORT_KERNEL: renta0426/codeparrot-fresh-cohort-v1
  TARGET_KERNEL: renta0426/codeparrot-fresh-full-v1
  TARGET_SLUG: codeparrot-fresh-full-v1
  NORMALIZER_PATH: scripts/normalize_codeparrot_pilot_v3_for_full.py
  PATCH_PATH: scripts/patch_codeparrot_full_v1.py
  POLICY_PATH: scripts/kaggle_policy_preflight.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  AUDITED_COHORT_SHA256: b664e368f9380e230c9cfc0616327d829424749c5473f87575678525db1998fc

jobs:
  validate:
    name: Validate normalized v3-to-full chain without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate normalizer, transformer, and chained regression
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"; if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"; trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value); ctx=ssl.create_default_context()
          for remote,maximum,local in (
              ("scripts/normalize_codeparrot_pilot_v3_for_full.py",65536,"normalizer.py"),
              ("scripts/patch_codeparrot_full_v1.py",65536,"patch.py"),
              ("scripts/kaggle_policy_preflight.py",65536,"policy.py"),
          ):
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{remote}"
              req=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
              if not data or len(data)>maximum: raise SystemExit(f"public source byte budget failed: {remote}")
              path=root/local; path.write_bytes(data); compile(data,str(path),"exec")
          PY
          python3 "${workdir}/policy.py"
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input -q 'nbformat==5.10.4'
          "${workdir}/venv/bin/python" "${workdir}/normalizer.py" --self-test
          "${workdir}/venv/bin/python" "${workdir}/patch.py" --self-test
          "${workdir}/venv/bin/python" - "${workdir}" <<'PY'
          import importlib.util,pathlib,sys,tempfile
          import nbformat
          root=pathlib.Path(sys.argv[1])
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path); mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod); return mod
          norm=load("norm",root/"normalizer.py"); patch=load("patch",root/"patch.py")
          with tempfile.TemporaryDirectory() as temp:
              bundle=pathlib.Path(temp); patch._synthetic_bundle(bundle)
              nb=nbformat.read(bundle/"codeparrot-fresh-pilot-v1.ipynb",as_version=4)
              nb.cells[1].source += "\n# CODEPARROT_MEAN_LOG_RANK_REPAIR_V2\nsummary={}\nrank_integer=np.array([1])\nsummary[\"mean_log_rank\"] = float(np.log1p(rank_integer).mean())\n"
              old='"selection":\n                "first_200_sample_ids_from_label_free_4000_prediction_input"'
              new='"selection" : "first_200_sample_ids_from_label_free_4000_prediction_input"'
              changed=0
              for cell in nb.cells:
                  if cell.cell_type=="code" and old in cell.source:
                      cell.source=cell.source.replace(old,new,1); changed+=1
              assert changed==1
              nbformat.write(nb,bundle/"codeparrot-fresh-pilot-v1.ipynb")
              norm.normalize_notebook(bundle)
              target=patch.patch_bundle(bundle)
              out=nbformat.read(target,as_version=4)
              code="\n".join(cell.source for cell in out.cells if cell.cell_type=="code")
              assert "CODEPARROT_MEAN_LOG_RANK_REPAIR_V2" in code
              assert 'summary["mean_log_rank"] = float(np.log1p(rank_integer).mean())' in code
              assert 'private_input = scorer_frame(full)' in code
              assert '"full_4000_scoring_authorized": True' in code
              assert 'all_4000_sample_ids_from_frozen_label_free_prediction_input' in code
          print("CODEPARROT_FULL_CHAIN_REGRESSION PASS normalized_v3_shape=1 full_transform=1 repair_preserved=1")
          PY

  launch:
    name: Launch normalized sealed CodeParrot v3 to frozen 4k exactly once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce protected normalized-v3 boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/210-codeparrot-fresh-full-v1-v3-normalized.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "forbidden credential variable: ${name}"; exit 1; }
          done
          echo "CODEPARROT_FULL_NORMALIZED_V3_BOUNDARY PASS rows=4000 gpu=t4x1 retries=0 submissions=0 label_join=0"

      - name: Prepare normalizer, transformer, policy, and locked Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value); ctx=ssl.create_default_context()
          for remote,maximum,local in (
              ("scripts/normalize_codeparrot_pilot_v3_for_full.py",65536,"normalizer.py"),
              ("scripts/patch_codeparrot_full_v1.py",65536,"patch.py"),
              ("scripts/kaggle_policy_preflight.py",65536,"policy.py"),
              ("requirements/kaggle-2.2.4.lock",262144,"kaggle.lock"),
          ):
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{remote}"
              req=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response: data=response.read(maximum+1)
              if not data or len(data)>maximum: raise SystemExit(f"public material byte budget failed: {remote}")
              path=root/local; path.write_bytes(data)
              if path.suffix==".py": compile(data,str(path),"exec")
          PY
          python3 "${workdir}/policy.py"
          python3 -m venv "${workdir}/patch-venv"
          "${workdir}/patch-venv/bin/python" -m pip install --disable-pip-version-check --no-input -q 'nbformat==5.10.4'
          "${workdir}/patch-venv/bin/python" "${workdir}/normalizer.py" --self-test
          "${workdir}/patch-venv/bin/python" "${workdir}/patch.py" --self-test
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "CODEPARROT_FULL_NORMALIZED_V3_PREP PASS locked_cli=2.2.4"

      - name: Authenticate and admit exact sealed pilot v3 full run
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          mkdir -p "${HOME}/.kaggle"; umask 077
          printf '%s' "${KAGGLE_API_TOKEN}" > "${HOME}/.kaggle/access_token"; unset KAGGLE_API_TOKEN
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os,re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          api=KaggleApi(); api.authenticate()
          pages=api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []; content={}
          for page in pages:
              data=page.to_dict() if hasattr(page,"to_dict") else dict(page); name=str(data.get("name") or "").strip().lower()
              if name: content[name]=str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content): raise SystemExit("live Poisoned Chalice Rules/Evaluation/Data pages unavailable")
          evaluation=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",content["evaluation"].replace(r"\%","%"))).casefold()
          if not all(token in evaluation for token in ("auc","novelty","1%","false-positive")): raise SystemExit("live Poisoned Chalice evaluation contract changed")
          pilot=os.environ["PILOT_KERNEL"]; owner,slug=pilot.split("/",1)
          status=str(getattr(api.kernels_status(pilot),"status","") or "").upper()
          if "COMPLETE" not in status: raise SystemExit(f"sealed pilot v3 source is not complete: {status}")
          with api.build_kaggle_client() as client:
              req=ApiGetKernelRequest(); req.user_name=owner; req.kernel_slug=slug; metadata=client.kernels.kernels_api_client.get_kernel(req).metadata
          version=int(getattr(metadata,"current_version_number",0) or 0)
          if version != 3: raise SystemExit(f"sealed pilot source is not exact version 3: {version}")
          if not bool(getattr(metadata,"enable_gpu",False)) or bool(getattr(metadata,"enable_tpu",False)): raise SystemExit("sealed pilot v3 accelerator metadata changed")
          cohort_status=str(getattr(api.kernels_status(os.environ["COHORT_KERNEL"]),"status","") or "").upper()
          if "COMPLETE" not in cohort_status: raise SystemExit(f"frozen cohort source is not complete: {cohort_status}")
          target=os.environ["TARGET_KERNEL"]; target_slug=os.environ["TARGET_SLUG"]
          visible=api.kernels_list(user="renta0426",search=target_slug,page_size=20) or []
          if any(str(getattr(item,"ref","") or "")==target for item in visible): raise SystemExit("full target already exists; refusing overwrite/re-run")
          quota=api.quota_view(); gpu=getattr(quota,"gpu_quota",None); used=getattr(gpu,"time_used",None); total=getattr(gpu,"total_time_allowed",None)
          if used is None or total is None: raise SystemExit("GPU quota unavailable")
          remaining=max(0.0,(total-used).total_seconds()/3600.0)
          if remaining < 0.75: raise SystemExit(f"insufficient GPU quota: {remaining:.2f}h")
          active_refs=[]; unknown=0
          for item in (api.kernels_list(user="renta0426",sort_by="dateRun",page_size=25) or [])[:25]:
              ref=str(getattr(item,"ref","") or "")
              if not ref: continue
              try: item_status=str(getattr(api.kernels_status(ref),"status","") or "").upper()
              except Exception: unknown+=1; continue
              if any(token in item_status for token in ("RUNNING","QUEUED","PENDING")): active_refs.append(ref)
          active_gpu=0; active_unknown=unknown
          with api.build_kaggle_client() as client:
              for ref in active_refs:
                  try:
                      ref_owner,ref_slug=ref.split("/",1); req=ApiGetKernelRequest(); req.user_name=ref_owner; req.kernel_slug=ref_slug
                      if bool(getattr(client.kernels.kernels_api_client.get_kernel(req).metadata,"enable_gpu",False)): active_gpu+=1
                  except Exception: active_unknown+=1
          if active_unknown: raise SystemExit(f"GPU admission unknown resource state: {active_unknown}")
          if active_gpu: raise SystemExit(f"GPU admission refused: active_gpu={active_gpu}")
          print(f"CODEPARROT_FULL_NORMALIZED_V3_LIVE_PREFLIGHT PASS pilot_version=3 cohort_status=COMPLETE quota={remaining:.2f}h active_gpu=0 target_absent=1")
          PY

      - name: Pull v3, normalize semantically, transform, recheck, and push once
        shell: bash
        run: |
          set -euo pipefail
          kaggle_bin="${WORKDIR}/kaggle-venv/bin/kaggle"; target_dir="${WORKDIR}/private-target"; mkdir -p "${target_dir}"
          if ! "${kaggle_bin}" kernels pull "${PILOT_KERNEL}" -m -p "${target_dir}" >/dev/null 2>&1; then echo "sealed private pilot v3 source pull failed"; exit 1; fi
          "${WORKDIR}/patch-venv/bin/python" - "${target_dir}" "${AUDITED_COHORT_SHA256}" <<'PY'
          import json,pathlib,sys,nbformat
          root=pathlib.Path(sys.argv[1]); audited=sys.argv[2]
          meta=json.loads((root/"kernel-metadata.json").read_text()); assert meta["id"]=="renta0426/codeparrot-fresh-pilot-v1"; assert meta["machine_shape"]=="NvidiaTeslaT4"; assert meta["kernel_sources"]==["renta0426/codeparrot-fresh-cohort-v1"]
          nb=nbformat.read(next(root.glob("*.ipynb")),as_version=4); nbformat.validate(nb); code="\n".join(c.source for c in nb.cells if c.cell_type=="code")
          required=("CODEPARROT_PRIVATE_SNAPSHOT_COMPAT_V3","CODEPARROT_MEAN_LOG_RANK_REPAIR_V2",audited,'summary["mean_log_rank"] = float(np.log1p(rank_integer).mean())','first8_compare["mean_log_rank"]','"neg_mean_log_rank": float(-group.mean_log_rank.mean())','"performance_metrics_computed": False','"membership_join_performed": False','"full_4000_scoring_authorized": False')
          missing=[x for x in required if x not in code]
          if missing: raise SystemExit(f"sealed pilot-v3 scientific contract incomplete: {missing}")
          forbidden=("competitions submit","submission.csv","RESEARCH_REPO_READ_TOKEN","GH_TOKEN","GITHUB_PAT","SSH_PRIVATE_KEY")
          if any(x in code for x in forbidden): raise SystemExit("sealed pilot-v3 contains forbidden transport/side effect")
          print("CODEPARROT_FULL_NORMALIZED_V3_SOURCE PASS repair=1 labels=0 metrics=0")
          PY
          "${WORKDIR}/patch-venv/bin/python" "${WORKDIR}/normalizer.py" --notebook-dir "${target_dir}"
          "${WORKDIR}/patch-venv/bin/python" "${WORKDIR}/patch.py" --notebook-dir "${target_dir}"
          "${WORKDIR}/patch-venv/bin/python" - "${target_dir}" "${AUDITED_COHORT_SHA256}" <<'PY'
          import json,pathlib,sys,nbformat
          root=pathlib.Path(sys.argv[1]); audited=sys.argv[2]
          meta=json.loads((root/"kernel-metadata.json").read_text()); assert meta["id"]=="renta0426/codeparrot-fresh-full-v1"; assert meta["is_private"] is True and meta["enable_gpu"] is True and meta["enable_tpu"] is False; assert meta["machine_shape"]=="NvidiaTeslaT4"; assert meta["kernel_sources"]==["renta0426/codeparrot-fresh-cohort-v1"]
          nb=nbformat.read(next(root.glob("*.ipynb")),as_version=4); nbformat.validate(nb); code="\n".join(c.source for c in nb.cells if c.cell_type=="code")
          required=("CODEPARROT_PRIVATE_SNAPSHOT_COMPAT_V3","CODEPARROT_MEAN_LOG_RANK_REPAIR_V2",audited,'summary["mean_log_rank"] = float(np.log1p(rank_integer).mean())','first8_compare["mean_log_rank"]','EXPERIMENT_ID = "codeparrot-fresh-full-v1"','private_input = scorer_frame(full)','aggregate_private_features(window_features, 4000)','OUTPUT / "full_predictions.parquet"','all_4000_sample_ids_from_frozen_label_free_prediction_input','"full_4000_scoring_authorized": True','"performance_metrics_computed": False','"membership_join_performed": False','"competition_submission": False')
          missing=[x for x in required if x not in code]
          if missing: raise SystemExit(f"normalized full-v3 bundle contract incomplete: {missing}")
          forbidden=("competitions submit","submission.csv","RESEARCH_REPO_READ_TOKEN","GH_TOKEN","GITHUB_PAT","SSH_PRIVATE_KEY",'private_input = scorer_frame(pilot)','OUTPUT / "pilot_predictions.parquet"')
          if any(x in code for x in forbidden): raise SystemExit("normalized full-v3 bundle contains forbidden transport/side effect")
          print("CODEPARROT_FULL_NORMALIZED_V3_BUNDLE PASS rows=4000 repair=1 labels=0 metrics=0 submission=0")
          PY
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi
          api=KaggleApi(); api.authenticate(); target=os.environ["TARGET_KERNEL"]; slug=os.environ["TARGET_SLUG"]
          visible=api.kernels_list(user="renta0426",search=slug,page_size=20) or []
          if any(str(getattr(item,"ref","") or "")==target for item in visible): raise SystemExit("pre-write target recheck failed: target now exists")
          print("CODEPARROT_FULL_NORMALIZED_V3_PREWRITE PASS target_absent=1")
          PY
          set +e
          "${kaggle_bin}" kernels push -p "${target_dir}" >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"; rc=$?
          set -e
          stdout_bytes="$(wc -c <"${WORKDIR}/push.stdout")"; stderr_bytes="$(wc -c <"${WORKDIR}/push.stderr")"; stdout_sha="$(sha256sum "${WORKDIR}/push.stdout" | awk '{print $1}')"; stderr_sha="$(sha256sum "${WORKDIR}/push.stderr" | awk '{print $1}')"; rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then echo "CODEPARROT_FULL_NORMALIZED_V3_PUSH_FAILED rc=${rc} stdout_bytes=${stdout_bytes} stderr_bytes=${stderr_bytes} stdout_sha256=${stdout_sha} stderr_sha256=${stderr_sha} ambiguous_write=1 retry=0"; exit 1; fi
          echo "CODEPARROT_FULL_NORMALIZED_V3_KERNEL_PUSH PASS requested_version=1 count=1 retry=0 submission=0"

      - name: Cleanup credentials and private runner-local source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${HOME}/.kaggle/access_token" "${HOME}/.kaggle/kaggle.json"
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "CODEPARROT_FULL_NORMALIZED_V3_CLEANUP PASS private_source_persisted=0"
