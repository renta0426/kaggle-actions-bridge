name: Poisoned Chalice Stage1 frozen length audit v1

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-stage1-length-audit-v1.json
  pull_request:
    paths:
      - .github/workflows/128-poisoned-chalice-stage1-length-audit-v1.yml
      - requests/poisoned-chalice-stage1-length-audit-v1.json
      - scripts/poisoned_chalice_stage1_length_audit_v1.py

permissions: {}

concurrency:
  group: poisoned-chalice-stage1-length-audit-readonly-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-length-audit-v1.json
  ANALYSIS_PATH: scripts/poisoned_chalice_stage1_length_audit_v1.py
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  SOURCE_DATASET: renta0426/stage1-raw-fim-submission-v1-output

jobs:
  validate:
    name: Validate immutable Stage1 length-audit request without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce secret-free GitHub-hosted boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          [[ "${EVENT_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${PR_HEAD_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
            [[ "${PR_AUTHOR}" == "${EXPECTED_ACTOR}" ]]
          elif [[ "${EVENT_NAME}" != "push" ]]; then
            echo "unexpected event: ${EVENT_NAME}"
            exit 1
          fi
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY RESEARCH_REPO_READ_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          echo "STAGE1_LENGTH_AUDIT_SECRET_FREE_BOUNDARY PASS"

      - name: Fetch exact request and analysis source and validate contracts
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 - "${SOURCE_SHA}" <<'PY'
          from __future__ import annotations
          import hashlib, json, re, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha = sys.argv[1]
          root = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(path: str, limit: int) -> bytes:
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              return data

          request = json.loads(read(
              "requests/poisoned-chalice-stage1-length-audit-v1.json", 32768
          ))
          expected = {
              "schema_version": 1,
              "request_id": "20260903-poisoned-chalice-stage1-length-audit-001",
              "competition": "poisoned-chalice-icse27",
              "operation": "private_dataset_readonly_cpu_analysis",
              "source_dataset": "renta0426/stage1-raw-fim-submission-v1-output",
              "source_dataset_version": 1,
              "expected_feature_shards": {
                  "train_10k": 40, "validation_5k": 20, "rows_per_shard": 250,
              },
              "analysis_script_path": "scripts/poisoned_chalice_stage1_length_audit_v1.py",
              "analysis_script_blob_sha": "96c326cc432bab17b800735da059e2368e95d47a",
              "research_source": {
                  "repository": "renta0426/The-Poisoned-Chalice-of-LLM-Evaluation",
                  "branch": "analysis/stage1-length-audit-v1",
                  "commit": "faeac269c7a5f332e4991f540260a290563e35b6",
                  "path": "scripts/run_stage1_length_audit.py",
                  "git_blob_sha": "08ad7cb7832ff87713c396e0b602a100483cdd3b",
              },
              "analysis_contract": {
                  "rows": 10000,
                  "base_features": 113,
                  "structure_features": 50,
                  "fim_features": 11,
                  "baseline": "raw_plus_fim",
                  "expected_baseline_auc": 0.664524,
                  "baseline_auc_tolerance": 0.002,
                  "seeds": list(range(2027, 2037)),
                  "candidates": [
                      "raw_plus_fim", "no_explicit_length",
                      "replace_raw_length_with_log", "plus_log_length",
                      "plus_length_interactions",
                  ],
                  "diagnostics": ["length_only_raw", "length_only_log"],
                  "selection_uses_public_lb": False,
                  "mellum_labels_used": False,
                  "model_forward_pass": False,
              },
              "resource": {
                  "execution": "github_hosted_cpu", "kaggle_compute": False,
                  "accelerator": "none", "expected_runtime_minutes": 20,
                  "hard_timeout_minutes": 60,
              },
              "download_budget": {
                  "max_dataset_files": 150, "max_dataset_bytes": 1073741824,
                  "max_api_calls": 12, "max_pages": 2,
              },
              "output_policy": {
                  "row_level_outputs_logged": False, "actions_artifact": False,
                  "actions_cache": False, "retain_private_dataset_on_runner": False,
                  "aggregate_outputs_logged": True,
              },
              "side_effects": [], "automatic_retries": 0,
              "competition_submission": False,
          }
          if request != expected:
              raise SystemExit("Stage1 length-audit request differs from exact allowlist")

          script = read(request["analysis_script_path"], 65536)
          blob = hashlib.sha1(
              b"blob " + str(len(script)).encode("ascii") + b"\0" + script
          ).hexdigest()
          if blob != request["analysis_script_blob_sha"]:
              raise SystemExit("analysis script Git blob mismatch")
          compile(script, request["analysis_script_path"], "exec")
          text = script.decode("utf-8")
          for required in (
              'EXPECTED_BASELINE_AUC = 0.664524',
              '"plus_length_interactions"',
              '"mellum_labels_used": False',
              '"public_leaderboard_used_for_selection": False',
              '"model_forward_pass": False',
          ):
              if required not in text:
                  raise SystemExit(f"analysis invariant missing: {required}")
          for forbidden in (
              "competitions submit", "kernels push", "KAGGLE_API_TOKEN",
              "mellum-transfer-v1-output",
          ):
              if forbidden in text:
                  raise SystemExit(f"analysis gained forbidden capability: {forbidden}")
          print("STAGE1_LENGTH_AUDIT_STATIC PASS request=exact script_blob=exact")
          PY

  audit:
    name: Download private cache and run aggregate-only CPU audit
    needs: validate
    if: github.event_name == 'push'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Enforce protected read-only execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/128-poisoned-chalice-stage1-length-audit-v1.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_STAGE1_LENGTH_AUDIT_BOUNDARY PASS kaggle_compute=false"

      - name: Prepare exact analysis source and isolated clients before secret exposure
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "DATASET_DIR=${workdir}/dataset" >> "${GITHUB_ENV}"
          echo "RESULT_DIR=${workdir}/result" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, workdir_value = sys.argv[1:]
          root = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"
          workdir = pathlib.Path(workdir_value)

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(path: str, limit: int) -> bytes:
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              return data

          request_data = read(
              "requests/poisoned-chalice-stage1-length-audit-v1.json", 32768
          )
          request = json.loads(request_data)
          script = read(request["analysis_script_path"], 65536)
          blob = hashlib.sha1(
              b"blob " + str(len(script)).encode("ascii") + b"\0" + script
          ).hexdigest()
          if blob != "96c326cc432bab17b800735da059e2368e95d47a":
              raise SystemExit("analysis script blob mismatch")
          compile(script, request["analysis_script_path"], "exec")
          (workdir / "request.json").write_bytes(request_data)
          (workdir / "analysis.py").write_bytes(script)

          lock = read("requirements/kaggle-2.2.4.lock", 65536)
          text = lock.decode("utf-8")
          pattern = re.compile(
              r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* "
              r"--hash=sha256:[0-9a-f]{64}$"
          )
          lines = [
              line.strip() for line in text.splitlines()
              if line.strip() and not line.lstrip().startswith("#")
          ]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          (workdir / "kaggle.lock").write_bytes(lock)
          PY

          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F "2.2.4" >/dev/null

          python3 -m venv "${workdir}/analysis-venv"
          "${workdir}/analysis-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --only-binary=:all: \
            numpy==2.3.2 pandas==2.3.2 pyarrow==21.0.0 scikit-learn==1.7.1 >/dev/null
          "${workdir}/analysis-venv/bin/python" -m pip check >/dev/null
          echo "STAGE1_LENGTH_AUDIT_CLIENTS PASS kaggle=2.2.4 analysis_env=pinned"

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(
                  url, headers={"User-Agent": "kaggle-actions-bridge/1"}
              )
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Verify live competition, inspect sessions, and download exact private dataset
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          mkdir -p "${DATASET_DIR}"

          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition rules/evaluation unavailable")
          evaluation = re.sub(
              r"\s+", " ",
              re.sub(r"<[^>]+>", " ", content["evaluation"].replace(r"\%", "%")),
          ).casefold()
          if not all(term in evaluation for term in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("live evaluation contract mismatch")

          active = 0
          for item in (api.kernels_list(user="renta0426", sort_by="dateRun", page_size=5) or [])[:5]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              state = str(getattr(api.kernels_status(ref), "status", "")).upper()
              if any(token in state for token in ("RUNNING", "QUEUED", "PENDING")):
                  active += 1
          print(f"STAGE1_LENGTH_AUDIT_LIVE_PREFLIGHT PASS active_recent_sessions={active} remote_compute_requested=false")
          PY

          set +e
          "${WORKDIR}/kaggle-venv/bin/kaggle" datasets status "${SOURCE_DATASET}" \
            --format 'json(current_version_number)' \
            >"${WORKDIR}/dataset-status.json" 2>"${WORKDIR}/dataset-status.err"
          status_rc=$?
          "${WORKDIR}/kaggle-venv/bin/kaggle" datasets files "${SOURCE_DATASET}" \
            --page-size 150 -v \
            >"${WORKDIR}/dataset-files.csv" 2>"${WORKDIR}/dataset-files.err"
          files_rc=$?
          set -e
          rm -f "${WORKDIR}/dataset-status.err" "${WORKDIR}/dataset-files.err"
          if [[ "${status_rc}" -ne 0 || "${files_rc}" -ne 0 ]]; then
            echo "STAGE1_LENGTH_AUDIT_DATASET_PREFLIGHT FAIL response_logged=false"
            exit 1
          fi

          python3 - "${WORKDIR}/dataset-status.json" "${WORKDIR}/dataset-files.csv" <<'PY'
          from __future__ import annotations
          import csv, json, pathlib, re, sys

          status_path, files_path = map(pathlib.Path, sys.argv[1:])
          text = status_path.read_text(encoding="utf-8-sig").strip()
          try:
              payload = json.loads(text)
          except json.JSONDecodeError:
              payload = text
          if isinstance(payload, dict):
              version = payload.get("current_version_number")
          elif isinstance(payload, (int, float)):
              version = payload
          else:
              match = re.search(r"\b(\d+)\b", str(payload))
              version = int(match.group(1)) if match else None
          if int(version or -1) != 1:
              raise SystemExit(f"source dataset version changed: {version}")

          with files_path.open(newline="", encoding="utf-8-sig") as handle:
              rows = list(csv.reader(handle))
          if len(rows) < 2 or len(rows) > 151:
              raise SystemExit(f"unexpected dataset file inventory rows: {len(rows)}")
          cells = [cell.replace("\\", "/") for row in rows for cell in row]
          paths = set()
          pattern = re.compile(
              r"(?P<path>(?:[^,\s]+/)*(?:train_10k|validation_5k)/parts/"
              r"features\.part\d{3}\.parquet)"
          )
          for cell in cells:
              match = pattern.search(cell)
              if match:
                  paths.add(match.group("path").lstrip("./"))
          train = {
              path for path in paths
              if re.search(r"(?:^|/)train_10k/parts/features\.part\d{3}\.parquet$", path)
          }
          validation = {
              path for path in paths
              if re.search(r"(?:^|/)validation_5k/parts/features\.part\d{3}\.parquet$", path)
          }
          if len(train) != 40 or len(validation) != 20 or len(paths) != 60:
              raise SystemExit(
                  f"feature inventory mismatch: train={len(train)} validation={len(validation)} total={len(paths)}"
              )
          print("STAGE1_LENGTH_AUDIT_DATASET_INVENTORY PASS version=1 train_shards=40 validation_shards=20")
          PY

          set +e
          "${WORKDIR}/kaggle-venv/bin/kaggle" datasets download "${SOURCE_DATASET}" \
            -p "${DATASET_DIR}" --unzip -o -q \
            >"${WORKDIR}/dataset-download.out" 2>"${WORKDIR}/dataset-download.err"
          download_rc=$?
          set -e
          rm -f "${WORKDIR}/dataset-download.out" "${WORKDIR}/dataset-download.err" \
            "${WORKDIR}/dataset-status.json" "${WORKDIR}/dataset-files.csv"
          unset KAGGLE_API_TOKEN
          if [[ "${download_rc}" -ne 0 ]]; then
            echo "STAGE1_LENGTH_AUDIT_DATASET_DOWNLOAD FAIL response_logged=false"
            exit 1
          fi

          python3 - "${DATASET_DIR}" <<'PY'
          from __future__ import annotations
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          files = [path for path in root.rglob("*") if path.is_file()]
          total_bytes = sum(path.stat().st_size for path in files)
          if len(files) > 150 or total_bytes > 1_073_741_824:
              raise SystemExit(
                  f"download budget exceeded: files={len(files)} bytes={total_bytes}"
              )
          normalized = [path.relative_to(root).as_posix() for path in files]
          train = [
              path for path in normalized
              if re.search(r"(?:^|/)train_10k/parts/features\.part\d{3}\.parquet$", path)
          ]
          validation = [
              path for path in normalized
              if re.search(r"(?:^|/)validation_5k/parts/features\.part\d{3}\.parquet$", path)
          ]
          if len(train) != 40 or len(validation) != 20:
              raise SystemExit(
                  f"downloaded feature inventory mismatch: train={len(train)} validation={len(validation)}"
              )
          print(
              "STAGE1_LENGTH_AUDIT_PRIVATE_DATASET_READY "
              f"files={len(files)} bytes={total_bytes} train_shards=40 validation_shards=20"
          )
          PY

      - name: Run frozen CPU audit without credentials
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT; do
            [[ -z "${!name-}" ]] || { echo "credential remained after download: ${name}"; exit 1; }
          done
          mkdir -p "${RESULT_DIR}"
          "${WORKDIR}/analysis-venv/bin/python" "${WORKDIR}/analysis.py" \
            --dataset-root "${DATASET_DIR}" \
            --output-dir "${RESULT_DIR}"

      - name: Verify aggregate-only result boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${RESULT_DIR}" <<'PY'
          from __future__ import annotations
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected = {
              "split_metrics.csv", "language_metrics.csv", "repeated_cv.csv",
              "repeated_cv_summary.csv", "candidate_selection.csv",
              "unique_true_positives.csv", "evaluation_summary.json",
          }
          observed = {path.name for path in root.iterdir() if path.is_file()}
          if observed != expected:
              raise SystemExit(f"aggregate output allowlist mismatch: {sorted(observed)}")
          summary = json.loads((root / "evaluation_summary.json").read_text(encoding="utf-8"))
          required_false = (
              "mellum_artifacts_read", "mellum_labels_used",
              "hidden_stage1_validation_labels_used", "sample_id_used_as_feature",
              "public_leaderboard_used_for_selection", "model_forward_pass",
          )
          if any(summary.get(key) is not False for key in required_false):
              raise SystemExit("clean-room boundary changed")
          if summary.get("baseline_reproduced") is not True:
              raise SystemExit("Stage1 baseline reproduction gate did not pass")
          print(
              "STAGE1_LENGTH_AUDIT_COMPLETE "
              f"baseline_auc={float(summary['baseline_auc']):.6f} "
              f"selected={summary['score_candidate']['selected']} "
              "private_rows_retained=false submission=false"
          )
          PY

      - name: Cleanup all private runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "STAGE1_LENGTH_AUDIT_PRIVATE_MATERIAL_REMOVED"
