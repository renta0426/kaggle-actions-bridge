name: Poisoned Chalice SmolLM2 public-source frozen launch 003

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-smollm2-transfer-v1-public-003.json
      - scripts/poisoned_chalice_smollm2_public_builder_v3.py
      - scripts/poisoned_chalice_smollm2_public_launch_v3.py
      - .github/workflows/137-poisoned-chalice-smollm2-public-source-v3-launch.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-smollm2-transfer-v1-public-003.json
      - scripts/poisoned_chalice_smollm2_public_builder_v3.py
      - scripts/poisoned_chalice_smollm2_public_launch_v3.py
      - .github/workflows/137-poisoned-chalice-smollm2-public-source-v3-launch.yml

permissions:
  contents: read

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-smollm2-transfer-v1-public-003.json
  BUILDER_PATH: scripts/poisoned_chalice_smollm2_public_builder_v3.py
  BUILDER_BLOB_SHA: ca2d92cd3afa27ac4c3150c983207fa7c7685168
  LAUNCHER_PATH: scripts/poisoned_chalice_smollm2_public_launch_v3.py
  LAUNCHER_BLOB_SHA: f950041e17ae2f3820e2e15be8adbae8f1c11dfa
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Reconstruct and validate frozen SmolLM2 request 003 without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free source boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          echo 'SMOLLM2_PUBLIC_V3_SECRET_FREE_BOUNDARY PASS private_repo_reads=0 kaggle_calls=0'

      - name: Checkout exact event source without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify immutable builder and launcher blobs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git hash-object "${BUILDER_PATH}")" == "${BUILDER_BLOB_SHA}" ]]
          [[ "$(git hash-object "${LAUNCHER_PATH}")" == "${LAUNCHER_BLOB_SHA}" ]]
          python3 -m py_compile "${BUILDER_PATH}" "${LAUNCHER_PATH}"
          python3 "${LAUNCHER_PATH}" \
            --static \
            --request "${REQUEST_PATH}" \
            --launcher "${LAUNCHER_PATH}" \
            --builder "${BUILDER_PATH}"

      - name: Verify immutable official SmolLM2 revision without downloading weights
        shell: bash
        run: |
          set -euo pipefail
          expected='effd688a12921b4cc83e3312b6feb579f70f9c71'
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          git init -q "${tmp}"
          git -C "${tmp}" -c credential.helper= fetch -q --depth=1 \
            https://huggingface.co/HuggingFaceTB/SmolLM2-1.7B "${expected}"
          [[ "$(git -C "${tmp}" rev-parse FETCH_HEAD)" == "${expected}" ]]
          echo "SMOLLM2_PUBLIC_V3_MODEL_REVISION PASS revision=${expected}"

      - name: Install public reconstruction dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input \
            datasets==4.0.0 pandas==2.3.2 pyarrow==21.0.0 nbformat==5.10.4 numpy==2.3.2 >/dev/null
          python3 -m pip check >/dev/null

      - name: Reconstruct the exact public cohort and build label-free Notebook
        shell: bash
        run: |
          set -euo pipefail
          out="$(mktemp -d)/kernel"
          python3 "${BUILDER_PATH}" --output-dir "${out}"
          python3 "${LAUNCHER_PATH}" \
            --validate-bundle \
            --request "${REQUEST_PATH}" \
            --launcher "${LAUNCHER_PATH}" \
            --builder "${BUILDER_PATH}" \
            --bundle-root "${out}"
          rm -rf "$(dirname "${out}")"
          echo 'SMOLLM2_PUBLIC_V3_RECONSTRUCTION PASS rows=2000 labels_embedded=false private_repo_reads=0'

  launch:
    name: Build public-source bundle and launch one frozen SmolLM2 T4 run
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/137-poisoned-chalice-smollm2-public-source-v3-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${workdir}/kernel" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${EVENT_SHA}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          echo 'PROTECTED_SMOLLM2_PUBLIC_V3_BOUNDARY PASS request=003 write_calls=1 retries=0'

      - name: Prepare pinned sources and build dependencies without credentials
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          [[ "$(git -C "${repo}" hash-object "${BUILDER_PATH}")" == "${BUILDER_BLOB_SHA}" ]]
          [[ "$(git -C "${repo}" hash-object "${LAUNCHER_PATH}")" == "${LAUNCHER_BLOB_SHA}" ]]
          python3 -m venv "${WORKDIR}/build-venv"
          "${WORKDIR}/build-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input \
            datasets==4.0.0 pandas==2.3.2 pyarrow==21.0.0 nbformat==5.10.4 numpy==2.3.2 >/dev/null
          "${WORKDIR}/build-venv/bin/python" -m pip check >/dev/null
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${repo}/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'SMOLLM2_PUBLIC_V3_ISOLATED_CLIENTS PASS'

      - name: Reconstruct public cohort and validate label-free bundle before Kaggle credentials
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          "${WORKDIR}/build-venv/bin/python" "${repo}/${BUILDER_PATH}" --output-dir "${KERNEL_DIR}"
          "${WORKDIR}/build-venv/bin/python" "${repo}/${LAUNCHER_PATH}" \
            --validate-bundle \
            --request "${repo}/${REQUEST_PATH}" \
            --launcher "${repo}/${LAUNCHER_PATH}" \
            --builder "${repo}/${BUILDER_PATH}" \
            --bundle-root "${KERNEL_DIR}"
          echo 'SMOLLM2_PUBLIC_V3_PRIVATE_SOURCE_BYPASS PASS private_repo_reads=0 target_labels_embedded=false'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Live-preflight and launch frozen request 003 exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          repo="${WORKDIR}/repo"
          "${WORKDIR}/kaggle-venv/bin/python" "${repo}/${LAUNCHER_PATH}" \
            --execute \
            --request "${repo}/${REQUEST_PATH}" \
            --launcher "${repo}/${LAUNCHER_PATH}" \
            --builder "${repo}/${BUILDER_PATH}" \
            --bundle-root "${KERNEL_DIR}" \
            --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle"

      - name: Cleanup runner-local generated bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'SMOLLM2_PUBLIC_V3_RUNNER_LOCAL_MATERIAL_REMOVED retention_days=0'
