name: CMI-Flu B2 exact Competition submission

on:
  push:
    branches:
      - main
    paths:
      - requests/cmi-flu-b2-submit-v1.json

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false
  queue: max

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b2-submit-v1.json
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_OWNER: renta0426
  TARGET_SLUG: cmi-flu-b2-taskwise-compact-20260903-001
  TARGET_KERNEL: renta0426/cmi-flu-b2-taskwise-compact-20260903-001
  EXPECTED_SOURCE_COMMIT: 1596ba5b7ab2369c0b70c9da178aec1d71c80658
  EXPECTED_PACKAGE_SHA256: 390a84bfc4393960ad1dfeab6a92a56cc8db57b1ae7c8063d8c2bf8b072b8ce0

jobs:
  submit:
    name: Verify exact B2 output and create one Competition submission
    if: >-
      github.event_name == 'push' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected submission boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == 'push' ]]
          [[ "${EVENT_REF}" == 'refs/heads/main' ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == 'renta0426/kaggle-actions-bridge/.github/workflows/102-cmi-flu-b2-submit.yml@refs/heads/main' ]]
          [[ "${RUNNER_ENVIRONMENT}" == 'github-hosted' ]]
          echo 'PROTECTED_CMI_FLU_B2_SUBMISSION_BOUNDARY PASS'

      - name: Validate exact request and prepare locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import json, os, pathlib, re, ssl, sys, urllib.request

          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"

          def read(path: str, limit: int) -> bytes:
              request = urllib.request.Request(base + path, headers={'User-Agent': 'kaggle-actions-bridge/1'})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f'input exceeds byte budget: {path}')
              return data

          request = json.loads(read(os.environ['REQUEST_PATH'], 16384))
          expected_keys = {
              'schema_version', 'request_id', 'parent_request_id', 'competition', 'operation',
              'source_kernel', 'source_commit', 'package_zip_sha256', 'submission_sha256',
              'message', 'api_budget', 'side_effects', 'automatic_submission_retries',
              'rules_checked_at_utc',
          }
          if set(request) != expected_keys:
              raise SystemExit('B2 submission request schema mismatch')
          expected = {
              'schema_version': 1,
              'request_id': '20260903-cmi-flu-b2-submit-001',
              'parent_request_id': '20260903-cmi-flu-b2-001',
              'competition': os.environ['TARGET_COMPETITION'],
              'operation': 'competition_submission',
              'source_kernel': os.environ['TARGET_KERNEL'],
              'source_commit': os.environ['EXPECTED_SOURCE_COMMIT'],
              'package_zip_sha256': os.environ['EXPECTED_PACKAGE_SHA256'],
              'api_budget': {'max_calls': 15, 'max_pages': 1},
              'side_effects': ['create exactly one Competition submission'],
              'automatic_submission_retries': 0,
          }
          for key, value in expected.items():
              if request.get(key) != value:
                  raise SystemExit(f'B2 submission request mismatch: {key}')
          digest = str(request.get('submission_sha256', ''))
          if not re.fullmatch(r'[0-9a-f]{64}', digest):
              raise SystemExit('B2 submission SHA-256 is malformed')
          message = str(request.get('message', ''))
          expected_message = f'CMI-Flu B2 taskwise compact sha={digest[:12]}'
          if message != expected_message:
              raise SystemExit('B2 submission message does not bind the file SHA')
          checked = str(request.get('rules_checked_at_utc', ''))
          if not re.fullmatch(r'2026-09-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z', checked):
              raise SystemExit('B2 rules_checked_at_utc is malformed')
          (root / 'request.json').write_text(json.dumps(request, sort_keys=True), encoding='utf-8')

          lock = read(os.environ['LOCK_PATH'], 65536).decode('utf-8')
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith('#')]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit('Kaggle CLI lock validation failed')
          if not any(line.startswith('kaggle==2.2.4 ') for line in lines):
              raise SystemExit('Kaggle CLI 2.2.4 pin missing')
          (root / 'kaggle.lock').write_text(lock, encoding='utf-8')
          print(f'CMI_FLU_B2_SUBMISSION_REQUEST PASS sha256={digest}')
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Verify live Rules, exact private output, and submission file
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations

          import csv
          import hashlib
          import json
          import math
          import os
          import pathlib
          import re
          from collections import defaultdict
          from urllib.parse import urlparse

          import requests
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import (
              ApiGetKernelRequest,
              ApiListKernelSessionOutputRequest,
          )

          root = pathlib.Path(os.environ['WORKDIR'])
          request = json.loads((root / 'request.json').read_text(encoding='utf-8'))
          expected_digest = request['submission_sha256']
          message = request['message']

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ['TARGET_COMPETITION']) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, 'to_dict') else dict(page)
              name = str(data.get('name') or '').strip().lower()
              if name:
                  content[name] = str(data.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in name for name in content):
              raise SystemExit('live Competition policy pages unavailable')
          plain = lambda value: re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', value)).casefold()
          rules = plain(content['rules'])
          evaluation = plain(content['evaluation'])
          if not all(term in rules for term in (
              'maximum of five (5) submissions per day',
              'maximum team size is five (5)',
              'data security',
              'external data and tools',
          )):
              raise SystemExit('live Competition rules differ from approved guardrails')
          if not all(term in evaluation for term in ('mean spearman correlation', '40 donors', '-99')):
              raise SystemExit('live Competition evaluation differs from approved guardrails')

          owner = os.environ['TARGET_OWNER']
          slug = os.environ['TARGET_SLUG']
          target = os.environ['TARGET_KERNEL']
          discovered = api.kernels_list(user=owner, search=slug, page_size=5) or []
          refs = [str(getattr(item, 'ref', '')) for item in discovered]
          if refs.count(target) != 1:
              raise SystemExit('exact private B2 source kernel was not discoverable once')

          with api.build_kaggle_client() as client:
              get_request = ApiGetKernelRequest()
              get_request.user_name = owner
              get_request.kernel_slug = slug
              kernel = client.kernels.kernels_api_client.get_kernel(get_request)
              metadata = kernel.metadata
              if str(metadata.ref) != target or not bool(metadata.is_private):
                  raise SystemExit('private B2 source kernel identity mismatch')
              if bool(getattr(metadata, 'enable_gpu', False)) or bool(getattr(metadata, 'enable_tpu', False)):
                  raise SystemExit('B2 source kernel used an unexpected accelerator')
              if bool(getattr(metadata, 'enable_internet', False)):
                  raise SystemExit('B2 source kernel unexpectedly enabled Internet')
              version = int(metadata.current_version_number or 0)
              if version <= 0:
                  raise SystemExit('private B2 source kernel has no current version')
              output_request = ApiListKernelSessionOutputRequest()
              output_request.user_name = owner
              output_request.kernel_slug = slug
              output_request.version_label = str(version)
              output_request.page_size = 1000
              response = client.kernels.kernels_api_client.list_kernel_session_output(output_request)

          log = str(response.log or '')
          if 'CMI_FLU_B2_COMPLETE' not in log or 'CMI_FLU_B2_FAILED' in log:
              raise SystemExit('B2 source kernel lacks a unique successful terminal marker')

          allowed = {'bridge-result.json', 'submission.csv'}
          candidates = defaultdict(list)
          for item in list(response.files or []):
              raw_name = str(item.file_name or '').replace('\\', '/')
              base_name = pathlib.PurePosixPath(raw_name).name
              if base_name in allowed:
                  candidates[base_name].append((raw_name, str(item.url or '')))
          chosen = {}
          for base_name in sorted(allowed):
              items = candidates.get(base_name, [])
              preferred = [
                  item for item in items
                  if item[0] == base_name
                  or item[0] == f'cmi-flu-b2/{base_name}'
                  or item[0].endswith(f'/cmi-flu-b2/{base_name}')
              ]
              pool = preferred or items
              if len(pool) != 1:
                  raise SystemExit(f'exact B2 output was not uniquely available: {base_name}')
              chosen[base_name] = pool[0][1]

          output_dir = root / 'submission-source'
          output_dir.mkdir()
          limits = {'bridge-result.json': 262144, 'submission.csv': 131072}
          session = requests.Session(); session.trust_env = False
          for name, url in chosen.items():
              parsed = urlparse(url)
              host = (parsed.hostname or '').casefold()
              host_ok = (
                  host == 'storage.googleapis.com'
                  or host.endswith('.storage.googleapis.com')
                  or host.endswith('.googleusercontent.com')
                  or host.endswith('.kaggleusercontent.com')
              )
              if parsed.scheme != 'https' or not host_ok:
                  raise SystemExit(f'unexpected signed-output host for {name}')
              response_file = session.get(url, stream=True, timeout=60, allow_redirects=False)
              if response_file.status_code != 200:
                  raise SystemExit(f'signed-output download failed for {name}: status={response_file.status_code}')
              data = response_file.content
              if len(data) > limits[name]:
                  raise SystemExit(f'B2 output exceeds byte budget: {name}')
              (output_dir / name).write_bytes(data)

          result = json.loads((output_dir / 'bridge-result.json').read_text(encoding='utf-8'))
          if result.get('request_id') != '20260903-cmi-flu-b2-001':
              raise SystemExit('B2 result request mismatch')
          if result.get('source_commit') != os.environ['EXPECTED_SOURCE_COMMIT']:
              raise SystemExit('B2 result source commit mismatch')
          if result.get('package_zip_sha256') != os.environ['EXPECTED_PACKAGE_SHA256']:
              raise SystemExit('B2 result package SHA mismatch')
          if int(result.get('submission_rows', 0)) != 40:
              raise SystemExit('B2 result submission row count mismatch')
          proxy = float(result.get('supervised_public_proxy_macro_spearman'))
          if not math.isfinite(proxy):
              raise SystemExit('B2 local proxy metric is not finite')

          submission_path = output_dir / 'submission.csv'
          digest = hashlib.sha256(submission_path.read_bytes()).hexdigest()
          if digest != expected_digest or digest != result.get('submission_sha256'):
              raise SystemExit('B2 submission SHA binding mismatch')
          with submission_path.open(newline='', encoding='utf-8') as handle:
              rows = list(csv.reader(handle))
          expected_header = ['participant_id', 'Task1.1', 'Task1.2', 'Task1.3', 'Task1.4', 'Task2.1', 'Task2.2', 'Task2.3']
          if len(rows) != 41 or rows[0] != expected_header:
              raise SystemExit('B2 submission shape/header mismatch')
          for column_index, task in enumerate(expected_header[1:], start=1):
              values = [float(row[column_index]) for row in rows[1:]]
              if not all(math.isfinite(value) for value in values):
                  raise SystemExit(f'B2 non-finite values: {task}')
              if any(value == -99 for value in values):
                  raise SystemExit(f'B2 unexpected -99 values: {task}')
              if len(set(values)) < 2:
                  raise SystemExit(f'B2 constant task: {task}')

          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as handle:
              handle.write(f'SUBMISSION_FILE={submission_path}\n')
              handle.write(f'SUBMISSION_MESSAGE={message}\n')
              handle.write(f'SUBMISSION_SHA256={digest}\n')
          print(
              'CMI_FLU_B2_SUBMISSION_SOURCE_VERIFIED '
              f'version={version} rows=40 sha256={digest} proxy_macro={proxy:.12g}'
          )
          PY

          "${WORKDIR}/venv/bin/kaggle" competitions submissions \
            -c "${TARGET_COMPETITION}" --csv >"${WORKDIR}/before.csv"
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import csv, datetime as dt, os, pathlib

          path = pathlib.Path(os.environ['WORKDIR']) / 'before.csv'
          rows = list(csv.DictReader(path.open(newline='', encoding='utf-8-sig')))
          message = os.environ['SUBMISSION_MESSAGE']
          descriptions = [str(row.get('description') or row.get('message') or '') for row in rows]
          if descriptions.count(message) != 0:
              raise SystemExit('B2 submission message already exists; duplicate refused')

          now = dt.datetime.now(dt.timezone.utc)
          recent = 0
          for row in rows:
              raw = str(row.get('date') or row.get('submittedAt') or '').strip()
              if not raw:
                  continue
              parsed = None
              for candidate in (raw, raw.replace('Z', '+00:00')):
                  try:
                      parsed = dt.datetime.fromisoformat(candidate)
                      break
                  except ValueError:
                      pass
              if parsed is None:
                  continue
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=dt.timezone.utc)
              if now - parsed.astimezone(dt.timezone.utc) <= dt.timedelta(hours=24):
                  recent += 1
          if recent >= 5:
              raise SystemExit(f'five or more submissions detected in the last 24 hours: {recent}')
          print(f'CMI_FLU_B2_DAILY_LIMIT_CHECK PASS recent_24h={recent}')
          PY

          set +e
          "${WORKDIR}/venv/bin/kaggle" competitions submit \
            -c "${TARGET_COMPETITION}" \
            -f "${SUBMISSION_FILE}" \
            -m "${SUBMISSION_MESSAGE}" \
            >"${WORKDIR}/submit.stdout" 2>"${WORKDIR}/submit.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/submit.stdout" "${WORKDIR}/submit.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo 'ERROR: B2 Competition submission command failed; response suppressed and no retry was attempted'
            exit 1
          fi

          "${WORKDIR}/venv/bin/kaggle" competitions submissions \
            -c "${TARGET_COMPETITION}" --csv >"${WORKDIR}/after.csv"
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import csv, os, pathlib

          rows = list(csv.DictReader((pathlib.Path(os.environ['WORKDIR']) / 'after.csv').open(newline='', encoding='utf-8-sig')))
          message = os.environ['SUBMISSION_MESSAGE']
          matches = [row for row in rows if str(row.get('description') or row.get('message') or '') == message]
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one new B2 submission record, found {len(matches)}')
          row = matches[0]
          submitted = str(row.get('date') or row.get('submittedAt') or 'unknown')
          status = str(row.get('status') or 'unknown')
          reference = str(row.get('ref') or row.get('id') or row.get('fileName') or 'unknown')
          print(
              'CMI_FLU_B2_SUBMISSION_CREATED '
              f'reference={reference} status={status} submitted_at={submitted} '
              f'sha256={os.environ["SUBMISSION_SHA256"]} automatic_submission_retries=0'
          )
          PY

      - name: Cleanup runner-local private output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'Runner-local B2 submission source and credential-adjacent files removed'
