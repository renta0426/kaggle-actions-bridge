name: Poisoned Chalice Stage1 resume003 post-run static validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/117-poisoned-chalice-stage1-resume003-postrun-static.yml
      - .github/workflows/118-poisoned-chalice-stage1-resume003-status.yml
      - .github/workflows/119-poisoned-chalice-stage1-resume003-submit.yml
      - requests/poisoned-chalice-stage1-resume003-status-v1.json
      - requests/poisoned-chalice-stage1-resume003-submit-v1.json
      - scripts/validate_poisoned_chalice_stage1_resume_output.py
      - scripts/validate_poisoned_chalice_stage1_resume003_output.py
      - scripts/validate_poisoned_chalice_stage1_resume003_postrun.py
  pull_request:
    paths:
      - .github/workflows/117-poisoned-chalice-stage1-resume003-postrun-static.yml
      - .github/workflows/118-poisoned-chalice-stage1-resume003-status.yml
      - .github/workflows/119-poisoned-chalice-stage1-resume003-submit.yml
      - requests/poisoned-chalice-stage1-resume003-status-v1.json
      - requests/poisoned-chalice-stage1-resume003-submit-v1.json
      - scripts/validate_poisoned_chalice_stage1_resume_output.py
      - scripts/validate_poisoned_chalice_stage1_resume003_output.py
      - scripts/validate_poisoned_chalice_stage1_resume003_postrun.py

permissions: {}

concurrency:
  group: poisoned-chalice-stage1-resume003-postrun-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Validate read-only output and SHA-bound submission boundaries
    if: github.repository == 'renta0426/kaggle-actions-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact event files without credentials
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "1354356687" ]]
          [[ "${EVENT_ACTOR}" == "renta0426" ]]
          [[ "${EVENT_ACTOR_ID}" == "71638068" ]]
          [[ "${EVENT_SENDER_ID}" == "71638068" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${PR_HEAD_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
            [[ "${PR_AUTHOR}" == "renta0426" ]]
          elif [[ "${EVENT_NAME}" != "push" ]]; then
            echo "unexpected event: ${EVENT_NAME}"
            exit 1
          fi
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - "${SOURCE_SHA}" <<'PY'
          from __future__ import annotations
          import hashlib
          import pathlib
          import ssl
          import sys
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          sha = sys.argv[1]
          required = {
              ".github/workflows/118-poisoned-chalice-stage1-resume003-status.yml": 131072,
              ".github/workflows/119-poisoned-chalice-stage1-resume003-submit.yml": 131072,
              "requests/poisoned-chalice-stage1-resume003-status-v1.json": 16384,
              "scripts/validate_poisoned_chalice_stage1_resume_output.py": 131072,
              "scripts/validate_poisoned_chalice_stage1_resume003_output.py": 131072,
              "scripts/validate_poisoned_chalice_stage1_resume003_postrun.py": 131072,
          }
          optional = {
              "requests/poisoned-chalice-stage1-resume003-submit-v1.json": 16384,
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def fetch(path: str, limit: int, *, missing_ok: bool) -> bytes | None:
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              try:
                  with opener.open(url, timeout=30) as response:
                      data = response.read(limit + 1)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              destination = pathlib.Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              return data

          fetched = {path: fetch(path, limit, missing_ok=False) for path, limit in required.items()}
          optional_count = sum(
              fetch(path, limit, missing_ok=True) is not None
              for path, limit in optional.items()
          )
          validator = fetched["scripts/validate_poisoned_chalice_stage1_resume003_postrun.py"]
          if validator is None:
              raise SystemExit("post-run validator missing")
          blob = hashlib.sha1(
              b"blob " + str(len(validator)).encode("ascii") + b"\0" + validator
          ).hexdigest()
          if blob != "5df90d63dc4789a9738017a910afa6d078dba2c0":
              raise SystemExit("post-run validator Git blob changed")
          compile(validator, "validate_poisoned_chalice_stage1_resume003_postrun.py", "exec")
          print(
              "STAGE1_RESUME003_POSTRUN_STATIC_SOURCE PASS "
              f"required_files={len(required)} optional_submit_request={optional_count} credentials=absent"
          )
          PY

      - name: Run shared request, verifier, and workflow validation
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_poisoned_chalice_stage1_resume003_postrun.py --root .
          echo "STAGE1_RESUME003_POSTRUN_STATIC PASS"

      - name: Cleanup fetched validation files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github requests scripts
          echo "STAGE1_RESUME003_POSTRUN_STATIC_TEMPORARY_MATERIAL_REMOVED"
