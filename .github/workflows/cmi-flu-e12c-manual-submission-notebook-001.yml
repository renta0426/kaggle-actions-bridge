name: CMI-Flu E12c manual submission Notebook 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-e12c-manual-submission-notebook-001.yml
      - requests/cmi-flu-e12c-manual-submission-notebook-001.json
      - payloads/cmi-flu-e12c-manual-submission-notebook-001/strategy_e12c.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_prepare.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_execute.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_sanitize.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_ci.py
      - docs/cmi-flu-e12c-manual-submission-notebook-001.md
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-e12c-manual-submission-notebook-001.yml
      - requests/cmi-flu-e12c-manual-submission-notebook-001.json
      - payloads/cmi-flu-e12c-manual-submission-notebook-001/strategy_e12c.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_prepare.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_execute.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_sanitize.py
      - scripts/cmi_flu_e12c_manual_submission_notebook_ci.py
      - docs/cmi-flu-e12c-manual-submission-notebook-001.md

permissions: {}

concurrency:
  group: cmi-flu-e12c-manual-submission-notebook-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260911-cmi-flu-e12c-manual-submission-notebook-001
  TARGET_KERNEL: renta0426/cmi-flu-e12c-manual-submission-20260911-001
  SCIENCE_COMMIT: bb6f41ed81b0bbd4ecdc397c6abb9df671c6ebf8
  E12C_BLOB: a495584a7e461478bd1a41d01d2536c4435a8f7f
  PREPARE_BLOB: 45d5c791401320f566f058487a767c149b0df12b
  EXECUTOR_BLOB: 37bace7e2c912c10fea1603bc46e6717a128a9d9
  SANITIZER_BLOB: d5381f53ee1c3272220b77e2cfef513394629d1d
  CI_BLOB: e1e5c8e9c89e594b561c5181a77d653d4f98b33d
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E12c manual Notebook without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable:${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12c-manual-ci/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(80_000_001)
          if not data or len(data)>80_000_000: raise SystemExit("bridge archive byte budget failed")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Verify exact relay and run deterministic Notebook build regression
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import hashlib,os,pathlib
          root=pathlib.Path(os.environ['WORKDIR'])/'bridge'
          expected={
            'payloads/cmi-flu-e12c-manual-submission-notebook-001/strategy_e12c.py':os.environ['E12C_BLOB'],
            'scripts/cmi_flu_e12c_manual_submission_notebook_prepare.py':os.environ['PREPARE_BLOB'],
            'scripts/cmi_flu_e12c_manual_submission_notebook_execute.py':os.environ['EXECUTOR_BLOB'],
            'scripts/cmi_flu_e12c_manual_submission_notebook_sanitize.py':os.environ['SANITIZER_BLOB'],
            'scripts/cmi_flu_e12c_manual_submission_notebook_ci.py':os.environ['CI_BLOB'],
          }
          for rel,want in expected.items():
              data=(root/rel).read_bytes(); got=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              if got!=want: raise SystemExit(f'E12c exact blob mismatch:{rel}:{got}')
          print('CMI_FLU_E12C_EXACT_RELAY PASS auth=false write=false compute=false')
          PY
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e12c_manual_submission_notebook_ci.py" \
            --repository-root "${WORKDIR}/bridge" \
            --workdir "${WORKDIR}/e12c-ci"

      - name: Enforce Kaggle execution policy v2
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/kaggle_launch_policy_v2.py" request \
            "${WORKDIR}/bridge/requests/cmi-flu-e12c-manual-submission-notebook-001.json" --require-v2
          python3 "${WORKDIR}/bridge/scripts/kaggle_launch_policy_v2.py" workflow \
            "${WORKDIR}/bridge/.github/workflows/cmi-flu-e12c-manual-submission-notebook-001.yml"

      - name: Validate locked Kaggle client and output-reader PATH without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e12c_manual_submission_notebook_execute.py" --path-self-test

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"

  run:
    name: Create one private E12c manual-submission Notebook
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-e12c-manual-submission-notebook-001.yml@refs/heads/main" ]]

      - name: Materialize approved commit and exact runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e12c-manual-protected/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(80_000_001)
          if not data or len(data)>80_000_000: raise SystemExit("bridge archive byte budget failed")
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_e12c_manual_submission_notebook_prepare.py" \
            --repository-root "${workdir}/bridge" --output "${workdir}/runtime.py"
          python3 "${workdir}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${workdir}/runtime.py")" -lt 900000 ]]
          ! grep -F 'kaggle competitions submit' "${workdir}/runtime.py" >/dev/null
          ! grep -F 'competition_submit(' "${workdir}/runtime.py" >/dev/null
          echo 'CMI_FLU_E12C_PROTECTED_STATIC PASS write=false compute=false submission=false'

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e12c_manual_submission_notebook_execute.py" --path-self-test

      - name: Create and run the approved private E12c Notebook once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e12c_manual_submission_notebook_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --output-dir "${WORKDIR}/result"

      - name: Validate recovered file without exposing predictions
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e12c_manual_submission_notebook_sanitize.py" \
            --input-dir "${WORKDIR}/result"
          python3 - "${WORKDIR}/result/manual-submission-manifest.json" <<'PY'
          import json,sys
          m=json.load(open(sys.argv[1],encoding='utf-8'))
          safe={
            'request_id':m['request_id'],
            'submission_sha256':m['submission_sha256'],
            'submission_bytes':m['submission_bytes'],
            'submission_rows':m['submission_rows'],
            'historical_task12_only_sha256':m['historical_task12_only_sha256'],
            'changed_tasks_vs_historical_task12_only':m['changed_tasks_vs_historical_task12_only'],
            'task13_only_intervention_proven':m['task13_only_intervention_proven'],
            'manual_submission_ready':m['manual_submission_ready'],
            'competition_submission_attempted':m['competition_submission_attempted'],
          }
          print('CMI_FLU_E12C_MANUAL_RESULT '+json.dumps(safe,sort_keys=True))
          PY

      - name: Cleanup runner-local private content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
