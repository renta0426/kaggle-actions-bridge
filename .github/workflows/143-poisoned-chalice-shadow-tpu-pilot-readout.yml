name: Poisoned Chalice shadow TPU pilot readout

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-shadow-tpu-pilot-readout-v1.json
      - .github/workflows/143-poisoned-chalice-shadow-tpu-pilot-readout.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-shadow-tpu-pilot-readout-v1.json
      - .github/workflows/143-poisoned-chalice-shadow-tpu-pilot-readout.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-shadow-tpu-pilot-readout-v1.json
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_KERNEL: renta0426/shadow-tpu-pilot-v1
  TARGET_COMPETITION: poisoned-chalice-icse27
  MANIFEST_NAME: shadow_tpu_pilot_manifest.json

jobs:
  validate:
    name: Validate read-only shadow TPU readout request
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Enforce secret-free exact request
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          python3 - "${source_sha}" <<'PY'
          import json, ssl, sys, urllib.request
          from urllib.parse import urlparse
          sha = sys.argv[1]
          expected = {
              "schema_version": 1,
              "request_id": "20260904-poisoned-chalice-shadow-tpu-pilot-readout-v1-001",
              "parent_request_id": "20260904-poisoned-chalice-shadow-tpu-pilot-v1-001",
              "competition": "poisoned-chalice-icse27",
              "operation": "kernel_status_output",
              "target": "renta0426/shadow-tpu-pilot-v1",
              "expected_kernel_version": 1,
              "output_allowlist": ["shadow_tpu_pilot_manifest.json"],
              "api_budget": {"max_calls": 8, "max_pages": 1, "max_matches": 20},
              "side_effects": [],
              "automatic_compute_retries": 0,
              "protected_job_private_repository_access": False,
          }
          url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/requests/poisoned-chalice-shadow-tpu-pilot-readout-v1.json"
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
              raise SystemExit("unexpected bridge origin")
          req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as response:
              data = response.read(16385)
          if len(data) > 16384:
              raise SystemExit("readout request exceeds byte budget")
          if json.loads(data) != expected:
              raise SystemExit("shadow TPU readout request differs from exact contract")
          print("SHADOW_TPU_READOUT_REQUEST PASS side_effects=none private_repo_access=0")
          PY

  readout:
    name: Read current shadow TPU pilot without side effects
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/143-poisoned-chalice-shadow-tpu-pilot-readout.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          [[ -z "${RESEARCH_REPO_READ_TOKEN-}" ]]
          echo "SHADOW_TPU_READOUT_BOUNDARY PASS side_effects=none private_repo_access=0"

      - name: Prepare exact request and SHA-locked Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import json, pathlib, re, ssl, sys, urllib.request
          from urllib.parse import urlparse
          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-shadow-tpu-pilot-readout-v1.json": 16384,
              "requirements/kaggle-2.2.4.lock": 65536,
          }
          context = ssl.create_default_context()
          for path, maximum in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge origin")
              req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=context) as response:
                  data = response.read(maximum + 1)
              if len(data) > maximum:
                  raise SystemExit(f"bridge file exceeds byte budget: {path}")
              dst = root / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)
          request = json.loads((root / "requests/poisoned-chalice-shadow-tpu-pilot-readout-v1.json").read_text())
          if request.get("side_effects") != [] or request.get("automatic_compute_retries") != 0:
              raise SystemExit("readout side-effect contract changed")
          if request.get("protected_job_private_repository_access") is not False:
              raise SystemExit("private-repository boundary changed")
          lock = (root / "requirements/kaggle-2.2.4.lock").read_text()
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/${LOCK_PATH}" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "SHADOW_TPU_READOUT_CLIENT PASS"

      - name: Confirm current Kaggle policy pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("SHADOW_TPU_READOUT_POLICY PASS")
          PY

      - name: Read exact target state without GetKernel
        id: state
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -z "${RESEARCH_REPO_READ_TOKEN-}" ]]
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi
          target = os.environ["TARGET_KERNEL"]
          api = KaggleApi(); api.authenticate()
          matches = api.kernels_list(user="renta0426", search="shadow-tpu-pilot-v1", page_size=20) or []
          exact = [item for item in matches if str(getattr(item, "ref", "")) == target]
          if len(exact) != 1:
              raise SystemExit(f"exact target presence ambiguous: matches={len(exact)}")
          status_obj = api.kernels_status(target)
          status = str(getattr(status_obj, "status", "")).upper()
          if not status:
              raise SystemExit("target status unavailable")
          data = status_obj.to_dict() if hasattr(status_obj, "to_dict") else {}
          version = None
          for key in ("version_number", "kernel_version_number", "current_version_number", "versionNumber", "kernelVersionNumber", "currentVersionNumber"):
              value = getattr(status_obj, key, None)
              if value is None and isinstance(data, dict): value = data.get(key)
              if value is not None:
                  version = int(value)
                  break
          if version is not None and version != 1:
              raise SystemExit(f"unexpected target version: {version}")
          terminal = any(token in status for token in ("COMPLETE", "ERROR", "FAILED", "CANCELLED"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"status={status}\n")
              handle.write(f"terminal={'true' if terminal else 'false'}\n")
              handle.write(f"version_observed={version if version is not None else 'unavailable'}\n")
          print(f"SHADOW_TPU_READOUT_STATUS target_found=1 status={status} version={version if version is not None else 'unavailable'}")
          PY

      - name: Read only allowlisted terminal output
        if: steps.state.outputs.terminal == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          OBSERVED_STATUS: ${{ steps.state.outputs.status }}
        run: |
          set -euo pipefail
          output_dir="${WORKDIR}/output"
          mkdir -p "${output_dir}"
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels output "${TARGET_KERNEL}" \
            -p "${output_dir}" -q -o --page-size 20 \
            --file-pattern '^shadow_tpu_pilot_manifest\.json$' \
            >"${WORKDIR}/output.stdout" 2>"${WORKDIR}/output.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/output.stdout" "${WORKDIR}/output.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            if [[ "${OBSERVED_STATUS}" == *COMPLETE* ]]; then
              echo "SHADOW_TPU_READOUT_OUTPUT FAIL complete_but_manifest_unavailable=true"
              exit 1
            fi
            echo "SHADOW_TPU_READOUT_OUTPUT terminal_status=${OBSERVED_STATUS} manifest_available=false"
            exit 0
          fi
          "${WORKDIR}/venv/bin/python" - "${output_dir}" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = [path for path in root.rglob("*") if path.is_file()]
          if len(files) != 1 or files[0].name != "shadow_tpu_pilot_manifest.json":
              raise SystemExit(f"output allowlist violated: {[p.name for p in files]}")
          path = files[0]
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = {
              "schema_version": 1,
              "experiment_id": "shadow-tpu-pilot-v1",
              "research_commit": "4e221829e37af88553e780488b27730cf167d6f8",
              "backend": "xla",
              "machine_shape": "Tpu1VmV38",
              "expected_world_size": 8,
              "synthetic_training_rows": 128,
              "max_sequence_tokens": 256,
              "global_batch_size": 64,
              "max_steps_per_architecture": 2,
              "evaluation_inputs_read": False,
              "evaluation_labels_read": False,
              "smollm2_labels_used": False,
              "competition_train_rows_used": 0,
              "stage2_v3_selection_allowed": False,
              "automatic_compute_retries": 0,
              "protected_job_private_repository_access": False,
              "persistent_outputs": ["shadow_tpu_pilot_manifest.json"],
          }
          for key, value in expected.items():
              if data.get(key) != value:
                  raise SystemExit(f"manifest contract mismatch: {key}")
          acceptance = data.get("acceptance") or {}
          if set(acceptance) != {"left", "right"}:
              raise SystemExit("manifest acceptance slots changed")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          print(f"SHADOW_TPU_MANIFEST status={data.get('status')} left={acceptance['left']} right={acceptance['right']} sha256={digest} runtime_seconds={data.get('total_runtime_seconds')}")
          for slot in ("left", "right"):
              record = (data.get("architecture_results") or {}).get(slot) or {}
              manifest = record.get("training_manifest") or {}
              print(
                  f"SHADOW_TPU_ARCH slot={slot} returncode={record.get('returncode')} "
                  f"world_size={manifest.get('world_size')} steps={manifest.get('completed_steps')} "
                  f"initial_loss={manifest.get('initial_loss')} final_loss={manifest.get('final_loss')} "
                  f"checksum_spread={manifest.get('parameter_checksum_spread')} "
                  f"reload_passed={manifest.get('checkpoint_reload_passed')} "
                  f"reload_diff={manifest.get('checkpoint_reload_max_absolute_logit_difference')}"
              )
              if data.get("status") != "pass" and record.get("stderr_tail"):
                  tail = str(record.get("stderr_tail"))[-3000:].replace("\r", "")
                  print(f"SHADOW_TPU_ARCH_STDERR slot={slot}\n{tail}")
          PY
          rm -rf "${output_dir}"
          echo "SHADOW_TPU_READOUT_OUTPUT PASS side_effects=none"

      - name: Record non-terminal state
        if: steps.state.outputs.terminal != 'true'
        shell: bash
        run: |
          set -euo pipefail
          echo "SHADOW_TPU_READOUT_NONTERMINAL status=${{ steps.state.outputs.status }} no_output_download=true"

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "SHADOW_TPU_READOUT_CLEANUP PASS retention_days=0"
