name: CMI-Flu Strategy v3 batch1 Task1.2 audit repair 003

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-v3-batch1-task12-audit-repair-003.yml
      - requests/cmi-flu-v3-batch1-task12-audit-repair-003.json
      - payloads/cmi-flu-v3-batch1-task12-audit-repair-003/**
      - scripts/cmi_flu_v3_batch1_task12_audit_repair_prepare.py
      - scripts/cmi_flu_v3_batch1_task12_audit_repair_execute.py
      - scripts/cmi_flu_v3_batch1_task12_audit_repair_ci.py
      - scripts/cmi_flu_v3_batch1_runtime_repair_prepare.py
      - scripts/cmi_flu_v3_batch1_prepare.py
      - scripts/cmi_flu_v3_batch1_execute.py
      - scripts/cmi_flu_v3_batch1_sanitize.py
      - scripts/v3_runtime_smoke_stubs/**
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-v3-batch1-task12-audit-repair-003.yml
      - requests/cmi-flu-v3-batch1-task12-audit-repair-003.json
      - payloads/cmi-flu-v3-batch1-task12-audit-repair-003/**
      - scripts/cmi_flu_v3_batch1_task12_audit_repair_prepare.py
      - scripts/cmi_flu_v3_batch1_task12_audit_repair_execute.py
      - scripts/cmi_flu_v3_batch1_task12_audit_repair_ci.py
      - scripts/cmi_flu_v3_batch1_runtime_repair_prepare.py
      - scripts/cmi_flu_v3_batch1_prepare.py
      - scripts/cmi_flu_v3_batch1_execute.py
      - scripts/cmi_flu_v3_batch1_sanitize.py
      - scripts/v3_runtime_smoke_stubs/**

permissions: {}

concurrency:
  group: cmi-flu-v3-batch1-task12-audit-repair-003-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260912-cmi-flu-strategy-v3-batch1-task12-audit-repair-003
  TARGET_KERNEL: renta0426/cmi-flu-v3-batch1-audit-diagnostics-20260912-003
  SCIENCE_REPAIR_COMMIT: 06d29b1c2317b9bfb66b5d4364213d3ca6de3d7b
  SCIENCE_REPAIR_BLOB: 6ed220226c7dda80391f1c4700e6acf07d2d9fee
  SOURCE_B_KERNEL: renta0426/cmi-flu-e12c-manual-submission-20260911-002
  SOURCE_B_VERSION: "1"
  SOURCE_B_SHA256: 0f9df53c3aa8c6e4ac693f6a42dbd2633b4b61d1462df798a9bd767c220be3a5
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate V3 Task1.2 audit repair without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-v3-task12-repair-ci/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(80_000_001)
          if not data or len(data)>80_000_000: raise SystemExit("bridge archive byte budget failed")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Run exact credential-free Task1.2 audit-repair regression
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 \
            "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_task12_audit_repair_ci.py" \
            --repository-root "${WORKDIR}/bridge" \
            --workdir "${WORKDIR}/v3-task12-repair-ci"

      - name: Enforce Kaggle execution policy v2
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/kaggle_launch_policy_v2.py" request \
            "${WORKDIR}/bridge/requests/cmi-flu-v3-batch1-task12-audit-repair-003.json" --require-v2
          python3 "${WORKDIR}/bridge/scripts/kaggle_launch_policy_v2.py" workflow \
            "${WORKDIR}/bridge/.github/workflows/cmi-flu-v3-batch1-task12-audit-repair-003.yml"

      - name: Validate locked Kaggle client and successor executor PATH without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_task12_audit_repair_execute.py" --path-self-test

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"

  run:
    name: Run one private V3 Task1.2 audit-repair successor Notebook
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-v3-batch1-task12-audit-repair-003.yml@refs/heads/main" ]]

      - name: Materialize approved commit and exact repaired runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-v3-task12-repair-protected/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(80_000_001)
          if not data or len(data)>80_000_000: raise SystemExit("bridge archive byte budget failed")
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          PYTHONPATH="${workdir}/bridge/scripts" python3 \
            "${workdir}/bridge/scripts/cmi_flu_v3_batch1_task12_audit_repair_prepare.py" \
            --repository-root "${workdir}/bridge" --output "${workdir}/runtime.py"
          PYTHONPATH="${workdir}/bridge/scripts/v3_runtime_smoke_stubs" python3 "${workdir}/runtime.py" --self-test
          echo 'CMI_FLU_V3_BATCH1_TASK12_AUDIT_REPAIR_PROTECTED_STATIC PASS write=false compute=false model_fit=false competition_submit=false'

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Execute the one approved fresh successor Kaggle operation
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_task12_audit_repair_execute.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --output-dir "${WORKDIR}/safe-result"

      - name: Validate and emit aggregate-safe result only
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_sanitize.py" \
            --input-dir "${WORKDIR}/safe-result"

      - name: Cleanup runner-local private content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
          echo 'Runner-local V3 Task1.2 audit-repair content removed; private diagnostic CSVs remain only in private Kaggle output'
