          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_v3_v07_prepare.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --condition task23_retention --output "${WORKDIR}/runtime.py"
          echo "$H2_RUNTIME_SHA256  ${WORKDIR}/runtime.py" | sha256sum --check --status
          [[ "$(wc -c < "${WORKDIR}/runtime.py" | tr -d ' ')" == "$H2_RUNTIME_BYTES" ]]
