          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_v3_v07_execute.py" --condition task23_retention --runtime "${WORKDIR}/runtime.py" --approved-runtime-sha256 "$H2_RUNTIME_SHA256" --bridge-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output-dir "${WORKDIR}/safe-result"

