name: CMI-Flu strategy E06b Task2.3 two-head CPU 001 corrected

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/200-cmi-flu-strategy-e06b-task23-two-head-001.yml
      - .github/workflows/199-cmi-flu-strategy-e06b-task23-two-head-001.yml
      - .github/workflows/191-cmi-flu-e06a-003-readonly-recovery-001.yml
      - requests/cmi-flu-strategy-e06b-task23-two-head-001.json
      - payloads/cmi-flu-strategy-e06b-task23-two-head-001/strategy_e06b.py
      - payloads/cmi-flu-strategy-e06b-task23-two-head-001/strategy_e06b_v2.py
      - scripts/cmi_flu_strategy_e06b_prepare.py
      - scripts/cmi_flu_strategy_e06b_execute.py
      - scripts/cmi_flu_strategy_e06b_sanitize.py
      - scripts/cmi_flu_strategy_e06b_sanitize_v2.py
      - scripts/cmi_flu_e06b_metric_schema_patch.py
      - scripts/cmi_flu_e06b_safe_failure_site.py
      - scripts/test_cmi_e06b_frozen_runtime.py
      - scripts/test_cmi_e06b_execute_completion.py
      - scripts/test_cmi_e06b_real_reference.py
      - scripts/test_cmi_e06b_runtime_contract.py
      - scripts/test_cmi_e06b_executor_contract.py
      - scripts/cmi_flu_e06a_completion_marker.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_current_output_read.py
      - scripts/test_kaggle_exact_identity_eventual.py
      - scripts/cmi_flu_inspect_locked_hai_reference_schema.py
  pull_request:
    paths:
      - .github/workflows/200-cmi-flu-strategy-e06b-task23-two-head-001.yml
      - .github/workflows/199-cmi-flu-strategy-e06b-task23-two-head-001.yml
      - .github/workflows/191-cmi-flu-e06a-003-readonly-recovery-001.yml
      - requests/cmi-flu-strategy-e06b-task23-two-head-001.json
      - payloads/cmi-flu-strategy-e06b-task23-two-head-001/strategy_e06b.py
      - payloads/cmi-flu-strategy-e06b-task23-two-head-001/strategy_e06b_v2.py
      - scripts/cmi_flu_strategy_e06b_prepare.py
      - scripts/cmi_flu_strategy_e06b_execute.py
      - scripts/cmi_flu_strategy_e06b_sanitize.py
      - scripts/cmi_flu_strategy_e06b_sanitize_v2.py
      - scripts/cmi_flu_e06b_metric_schema_patch.py
      - scripts/cmi_flu_e06b_safe_failure_site.py
      - scripts/test_cmi_e06b_frozen_runtime.py
      - scripts/test_cmi_e06b_execute_completion.py
      - scripts/test_cmi_e06b_real_reference.py
      - scripts/test_cmi_e06b_runtime_contract.py
      - scripts/test_cmi_e06b_executor_contract.py
      - scripts/cmi_flu_e06a_completion_marker.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_current_output_read.py
      - scripts/test_kaggle_exact_identity_eventual.py
      - scripts/cmi_flu_inspect_locked_hai_reference_schema.py

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260908-cmi-flu-strategy-e06b-task23-two-head-001
  SCIENCE_COMMIT: d172adc2778f3e4fea7692d2a2129db402a994c4
  E06B_BLOB: 5b27abb1bb515e9388e63e7dd4c350aebea90574
  E06B_V2_BLOB: fe05fd9497f5a80b56b96fbf5f2971a9d43f4e10
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate corrected E06b full prewrite lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e06b/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Install modeling dependencies and fetch locked references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"

      - name: Execute corrected exact E06b preflight ladder
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_prepare.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e06b_metric_schema_patch.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e06b_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_runtime_contract.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_real_reference.py" --runtime "${WORKDIR}/script.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_frozen_runtime.py" --runtime "${WORKDIR}/script.py" --output-dir "${WORKDIR}/synthetic-model"
          test -f "${WORKDIR}/synthetic-model/receipt/release-receipt.json"
          grep -F '"model_executed": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"two_head_executed": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"result_validated": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"all_final_files_saved": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"completion_schema_checked": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          grep -F '"cleanup_completed": true' "${WORKDIR}/synthetic-model/receipt/release-receipt.json" >/dev/null
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_execute_completion.py" --runtime "${WORKDIR}/script.py" --metrics "${WORKDIR}/synthetic-model/metrics.json"
          mkdir "${WORKDIR}/synthetic-safe"
          cp "${WORKDIR}/synthetic-model/bridge-result.json" "${WORKDIR}/synthetic-model/metrics.json" "${WORKDIR}/synthetic-model/summary.md" "${WORKDIR}/synthetic-safe/"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_sanitize_v2.py" --input-dir "${WORKDIR}/synthetic-safe"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_executor_contract.py"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/test_kaggle_exact_identity_eventual.py"
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_prepare.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_execute.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_sanitize.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_sanitize_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e06b_metric_schema_patch.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_e06b_safe_failure_site.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06b_frozen_runtime.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06b_execute_completion.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06b_real_reference.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06b_runtime_contract.py" \
            "${WORKDIR}/bridge/scripts/test_cmi_e06b_executor_contract.py"
          ! grep -F 'kaggle competitions submit' "${WORKDIR}/script.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_execute.py" >/dev/null
          echo CMI_FLU_E06B_CORRECTED_PREFLIGHT_PASS

      - name: Validate request and retired predecessor workflows
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/requests/cmi-flu-strategy-e06b-task23-two-head-001.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          expected={
            'schema_version':1,'request_id':'20260908-cmi-flu-strategy-e06b-task23-two-head-001',
            'competition':'cmi-flu-first-prediction-challenge','operation':'kernel_run_and_current_output_read',
            'target':'renta0426/cmi-flu-e06b-task23-two-head-20260908-001',
            'science_source_commit':'d172adc2778f3e4fea7692d2a2129db402a994c4',
            'science_transport':'agent_relay_exact_blobs',
            'strategy_e06b_blob_sha':'5b27abb1bb515e9388e63e7dd4c350aebea90574',
            'strategy_e06b_v2_blob_sha':'fe05fd9497f5a80b56b96fbf5f2971a9d43f4e10',
            'expected_kernel_version':1,'enable_internet':False,
            'competition_submission_attempted':False,'leaderboard_used_for_selection':False,'automatic_compute_retries':0,
          }
          for k,v in expected.items():
            if r.get(k)!=v:raise SystemExit(f'E06b request mismatch:{k}')
          c=r['experiment_contract']
          assert c['primary_day']==365 and c['auxiliary_day']==28
          assert c['observed_d28_used_as_d365_feature'] is False
          assert c['held_study_and_subjects_purged_from_both_days'] is True
          assert c['minimum_equal_study_mean_rmse_reduction']==0.02 and c['maximum_worst_study_rmse_ratio']==1.05
          assert r['runtime_regression_contract']=={
            'production_execute_path_tested_before_write':True,
            'completion_marker_uses_conditions_not_tasks':True,
            'result_tasks_subscript_forbidden':True,
            'candidate_nonpromotion_is_valid_result':True,
          }
          assert r['resource']=={'accelerator':'cpu','expected_runtime_minutes':90,'hard_timeout_minutes':120,'max_active_runs':1}
          assert r['api_budget']=={'max_calls':150,'poll_interval_seconds':120,'max_polls':65,'max_pages':2}
          assert r['watcher_contract']=={'watch_horizon_minutes':130,'actions_job_timeout_minutes':150,'poll_exhaustion_is_remote_failure':False,'write_retry_on_watch_expiry':False,'recovery_after_watch_expiry':'current_version_read_only'}
          assert r['allowed_output_paths']==['bridge-result.json','metrics.json','summary.md']
          PY
          for n in 163 164 174 175 176 177 178 179 180 181 182 183 184 186 187 188 189 190 191 199; do
            f=$(find "${WORKDIR}/bridge/.github/workflows" -maxdepth 1 -type f -name "${n}-*" | head -1)
            [[ -n "$f" ]]
            ! grep -Eq '^[[:space:]]+push:|^[[:space:]]+pull_request:|environment:|KAGGLE_API_TOKEN|group:[[:space:]]+kaggle-resource' "$f"
            grep -Eq 'Retired|RETIRED|retired' "$f"
          done

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  launch:
    name: Run one corrected private CPU E06b Task2.3 two-head experiment
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/200-cmi-flu-strategy-e06b-task23-two-head-001.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"cmi-flu-e06b/2"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Rebuild exact runtime and repeat full lifecycle before write
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_prepare.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e06b_metric_schema_patch.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e06b_safe_failure_site.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_runtime_contract.py" --runtime "${WORKDIR}/script.py"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_real_reference.py" --runtime "${WORKDIR}/script.py" --reference-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_frozen_runtime.py" --runtime "${WORKDIR}/script.py" --output-dir "${WORKDIR}/protected-synthetic"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_execute_completion.py" --runtime "${WORKDIR}/script.py" --metrics "${WORKDIR}/protected-synthetic/metrics.json"
          mkdir "${WORKDIR}/protected-safe"
          cp "${WORKDIR}/protected-synthetic/bridge-result.json" "${WORKDIR}/protected-synthetic/metrics.json" "${WORKDIR}/protected-synthetic/summary.md" "${WORKDIR}/protected-safe/"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_sanitize_v2.py" --input-dir "${WORKDIR}/protected-safe"
          grep -F '"completion_schema_checked": true' "${WORKDIR}/protected-synthetic/receipt/release-receipt.json" >/dev/null
          rm -rf "${WORKDIR}/protected-synthetic" "${WORKDIR}/protected-safe"
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e06b_executor_contract.py"
          echo "E06B_RUNTIME_SHA256=$(sha256sum "${WORKDIR}/script.py" | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run approved E06b CPU kernel and read aggregate output
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "CMI_FLU_E06B_APPROVED_RUNTIME sha256=${E06B_RUNTIME_SHA256}"
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_execute.py" --runtime "${WORKDIR}/script.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"

      - name: Validate aggregate-only E06b result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e06b_sanitize_v2.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
