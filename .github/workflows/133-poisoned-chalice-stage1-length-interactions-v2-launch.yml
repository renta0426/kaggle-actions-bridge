name: Poisoned Chalice Stage1 length-interaction mount repair v2

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-stage1-length-interactions-run-002.json
      - scripts/poisoned_chalice_stage1_length_interaction_builder_v2.py
      - .github/workflows/133-poisoned-chalice-stage1-length-interactions-v2-launch.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-stage1-length-interactions-run-002.json
      - scripts/poisoned_chalice_stage1_length_interaction_builder_v2.py
      - .github/workflows/133-poisoned-chalice-stage1-length-interactions-v2-launch.yml

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-length-interactions-run-002.json
  BASE_BUILDER_PATH: scripts/poisoned_chalice_stage1_length_interaction_builder.py
  BUILDER_PATH: scripts/poisoned_chalice_stage1_length_interaction_builder_v2.py
  BASE_BUILDER_BLOB_SHA: a10c7a76be1a4d700d7b1d9846e42348c5711651
  BUILDER_BLOB_SHA: 8f2cd12ecbad8160e86bbd42cf9b70649e1aa56b
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  TARGET_KERNEL: renta0426/stage1-length-interactions-v2
  FAILED_KERNEL: renta0426/stage1-length-interactions-v1
  SOURCE_DATASET: renta0426/stage1-raw-fim-submission-v1-output

jobs:
  validate:
    name: Validate repaired frozen Stage1 request without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free boundary and fetch exact commit
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY RESEARCH_REPO_READ_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${source_sha}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          echo 'STAGE1_LENGTH_V2_SECRET_FREE_BOUNDARY PASS'

      - name: Validate request, pinned builders, and generated bundle
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          python3 - "${repo}" <<'PY'
          import hashlib, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          request = json.loads((root / "requests/poisoned-chalice-stage1-length-interactions-run-002.json").read_text())
          expected = {
              "schema_version": 1,
              "request_id": "20260904-poisoned-chalice-stage1-length-interactions-run-002",
              "parent_request_id": "20260903-poisoned-chalice-stage1-length-interactions-run-001",
              "competition": "poisoned-chalice-icse27",
              "operation": "kernel_run",
              "target": "renta0426/stage1-length-interactions-v2",
              "source_dataset": "renta0426/stage1-raw-fim-submission-v1-output",
              "source_dataset_version": 1,
              "base_builder_path": "scripts/poisoned_chalice_stage1_length_interaction_builder.py",
              "base_builder_blob_sha": "a10c7a76be1a4d700d7b1d9846e42348c5711651",
              "builder_script_path": "scripts/poisoned_chalice_stage1_length_interaction_builder_v2.py",
              "builder_blob_sha": "8f2cd12ecbad8160e86bbd42cf9b70649e1aa56b",
              "repair": {
                  "failed_target": "renta0426/stage1-length-interactions-v1",
                  "failed_version": 1,
                  "failed_status": "ERROR",
                  "failure_class": "kaggle_dataset_mount_path_compatibility",
                  "scientific_candidate_changed": False,
                  "source_dataset_changed": False,
                  "expected_oof_auc": 0.68013844,
                  "expected_tpr_at_0.01_fpr": 0.0682,
              },
              "resource": {
                  "execution": "kaggle_notebook", "accelerator": "cpu",
                  "expected_runtime_minutes": 12, "hard_timeout_minutes": 45,
                  "max_active_runs": 2, "enable_internet": False,
              },
              "api_budget": {
                  "max_calls": 24, "max_recent_kernels_inspected": 25,
                  "max_pages": 2, "poll_interval_seconds": 0,
              },
              "input_budget": {
                  "expected_train_shards": 40, "expected_validation_shards": 20,
                  "expected_rows_per_shard": 250, "max_dataset_files": 150,
                  "max_dataset_bytes": 1073741824,
              },
              "side_effects": [
                  "create exactly one private CPU Kaggle Notebook at renta0426/stage1-length-interactions-v2"
              ],
              "automatic_compute_retries": 0,
              "competition_submission": False,
              "submission_inside_notebook": False,
          }
          if request != expected:
              raise SystemExit("Stage1 length v2 request differs from exact contract")

          def blob(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
          for rel, expected_sha in (
              (request["base_builder_path"], request["base_builder_blob_sha"]),
              (request["builder_script_path"], request["builder_blob_sha"]),
          ):
              path = root / rel
              if blob(path) != expected_sha:
                  raise SystemExit(f"builder Git blob mismatch: {rel}")
              compile(path.read_bytes(), rel, "exec")
          print('STAGE1_LENGTH_V2_REQUEST_STATIC PASS candidate_changed=false mount_fix=true')
          PY

          mkdir -p "${WORKDIR}/kernel"
          python3 "${repo}/${BUILDER_PATH}" \
            --output-dir "${WORKDIR}/kernel" \
            --builder-blob-sha "${BUILDER_BLOB_SHA}" >/dev/null
          python3 - "${WORKDIR}/kernel" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          expected_files = ["kernel-metadata.json", "stage1-length-interactions-v2.ipynb"]
          if sorted(path.name for path in root.iterdir()) != expected_files:
              raise SystemExit("repaired bundle allowlist changed")
          metadata = json.loads((root / "kernel-metadata.json").read_text())
          expected = {
              "id": "renta0426/stage1-length-interactions-v2",
              "code_file": "stage1-length-interactions-v2.ipynb",
              "is_private": True, "enable_gpu": False, "enable_tpu": False,
              "enable_internet": False,
              "dataset_sources": ["renta0426/stage1-raw-fim-submission-v1-output"],
              "kernel_sources": [], "competition_sources": [], "model_sources": [],
          }
          for key, value in expected.items():
              if metadata.get(key) != value:
                  raise SystemExit(f"repaired metadata changed: {key}")
          notebook = json.loads((root / "stage1-length-interactions-v2.ipynb").read_text())
          code = "\n".join(
              "".join(cell.get("source", "")) if isinstance(cell.get("source", ""), list)
              else str(cell.get("source", ""))
              for cell in notebook.get("cells", []) if cell.get("cell_type") == "code"
          )
          for marker in (
              'REQUEST_ID = "20260904-poisoned-chalice-stage1-length-interactions-run-002"',
              'METHOD = "plus_length_interactions_v1"',
              "EXPECTED_MODEL_FEATURES = 523", "EXPECTED_OOF_AUC = 0.68013844",
              'root / "datasets" / "renta0426" / "stage1-raw-fim-submission-v1-output"',
              '"validation_labels_read": False',
              '"competition_submission_performed_inside_notebook": False',
          ):
              if marker not in code:
                  raise SystemExit(f"repaired notebook invariant missing: {marker}")
          for forbidden in ("KAGGLE_API_TOKEN", "competitions submit", "kernels push"):
              if forbidden in code:
                  raise SystemExit(f"repaired notebook gained forbidden capability: {forbidden}")
          compile(code, "stage1-length-interactions-v2.ipynb", "exec")
          print('STAGE1_LENGTH_V2_BUNDLE_STATIC PASS model_features=523 mount_compatibility=true')
          PY
          rm -rf "${WORKDIR}"

  launch:
    name: Launch exactly one repaired frozen Stage1 CPU Notebook
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    concurrency:
      group: poisoned-chalice-stage1-length-interaction-run-002
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected boundary and fetch exact main commit
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/133-poisoned-chalice-stage1-length-interactions-v2-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${workdir}/kernel" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${EVENT_SHA}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          echo 'PROTECTED_STAGE1_LENGTH_V2_BOUNDARY PASS request=002 write_calls=1 retries=0'

      - name: Build exact repaired private CPU Notebook and isolated Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          repo="${WORKDIR}/repo"
          mkdir -p "${KERNEL_DIR}"
          python3 "${repo}/${BUILDER_PATH}" \
            --output-dir "${KERNEL_DIR}" \
            --builder-blob-sha "${BUILDER_BLOB_SHA}" >/dev/null
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: \
            --require-hashes -r "${repo}/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'STAGE1_LENGTH_V2_CLIENT PASS kaggle=2.2.4'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms", "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines", "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Live-preflight exact source and CPU admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from __future__ import annotations
          import csv, os, re, subprocess
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in key for key in content):
              raise SystemExit("live Competition rules/evaluation/data unavailable")
          evaluation = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["evaluation"].replace(r"\%", "%"))).casefold()
          if not all(term in evaluation for term in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("live Poisoned Chalice evaluation contract changed")

          failed_status = str(getattr(api.kernels_status(os.environ["FAILED_KERNEL"]), "status", "")).upper()
          if "ERROR" not in failed_status and "FAILED" not in failed_status:
              raise SystemExit(f"expected diagnosed v1 failure, got {failed_status}")
          existing = {
              str(getattr(item, "ref", ""))
              for item in (api.kernels_list(user="renta0426", search="stage1-length-interactions-v2", page_size=20) or [])
          }
          if os.environ["TARGET_KERNEL"] in existing:
              raise SystemExit("repaired target already exists")

          kaggle = os.path.join(os.environ["WORKDIR"], "kaggle-venv", "bin", "kaggle")
          status = subprocess.run(
              [kaggle, "datasets", "status", os.environ["SOURCE_DATASET"], "--format", "json(current_version_number)"],
              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, check=False,
          )
          if status.returncode != 0 or not re.search(r"\b1\b", status.stdout):
              raise SystemExit("source Dataset version 1 is unavailable")
          files = subprocess.run(
              [kaggle, "datasets", "files", os.environ["SOURCE_DATASET"], "--page-size", "150", "-v"],
              stdout=subprocess.PIPE, stderr=subprocess.DEVNULL, text=True, check=False,
          )
          if files.returncode != 0:
              raise SystemExit("source Dataset inventory lookup failed")
          rows = list(csv.reader(files.stdout.splitlines()))
          text = "\n".join(",".join(row).replace("\\", "/") for row in rows)
          train = set(re.findall(r"(?:[^,\s]+/)*train_10k/parts/features\.part\d{3}\.parquet", text))
          validation = set(re.findall(r"(?:[^,\s]+/)*validation_5k/parts/features\.part\d{3}\.parquet", text))
          if len(train) != 40 or len(validation) != 20:
              raise SystemExit(f"source Dataset shard inventory changed: train={len(train)} validation={len(validation)}")

          counts = {"cpu": 0, "gpu": 0, "tpu": 0, "unknown": 0}
          recent = (api.kernels_list(user="renta0426", sort_by="dateRun", page_size=25) or [])[:25]
          active = []
          for item in recent:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              try:
                  state = str(getattr(api.kernels_status(ref), "status", "")).upper()
              except Exception:
                  counts["unknown"] += 1
                  continue
              if any(token in state for token in ("RUNNING", "QUEUED", "PENDING")):
                  active.append(ref)
          with api.build_kaggle_client() as client:
              for ref in active:
                  try:
                      owner, slug = ref.split("/", 1)
                      req = ApiGetKernelRequest(); req.user_name = owner; req.kernel_slug = slug
                      metadata = client.kernels.kernels_api_client.get_kernel(req).metadata
                      if bool(getattr(metadata, "enable_tpu", False)):
                          counts["tpu"] += 1
                      elif bool(getattr(metadata, "enable_gpu", False)):
                          counts["gpu"] += 1
                      else:
                          counts["cpu"] += 1
                  except Exception:
                      counts["unknown"] += 1
          if counts["unknown"] or counts["cpu"] >= 2:
              raise SystemExit(f"CPU admission refused: {counts}")
          print(
              "STAGE1_LENGTH_V2_LIVE_PREFLIGHT PASS "
              f"failed_v1={failed_status} source_dataset_version=1 train_shards=40 validation_shards=20 "
              f"active_cpu={counts['cpu']} active_gpu={counts['gpu']} active_tpu={counts['tpu']}"
          )
          PY

      - name: Push repaired request 002 exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          kaggle="${WORKDIR}/kaggle-venv/bin/kaggle"
          set +e
          "${kaggle}" kernels push -p "${KERNEL_DIR}" --timeout 2700 \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          if [[ ${rc} -ne 0 ]]; then
            sed -n '1,120p' "${WORKDIR}/push.stderr" >&2
            exit ${rc}
          fi
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          api = KaggleApi(); api.authenticate()
          target = "renta0426/stage1-length-interactions-v2"
          refs = {str(getattr(item, "ref", "")) for item in (api.kernels_list(user="renta0426", search="stage1-length-interactions-v2", page_size=20) or [])}
          if target not in refs:
              raise SystemExit("repaired target was not created after the one permitted push")
          with api.build_kaggle_client() as client:
              request = ApiGetKernelRequest(); request.user_name = "renta0426"; request.kernel_slug = "stage1-length-interactions-v2"
              metadata = client.kernels.kernels_api_client.get_kernel(request).metadata
          if int(metadata.current_version_number) != 1 or not bool(metadata.is_private):
              raise SystemExit("repaired target identity/version/privacy mismatch")
          if bool(metadata.enable_gpu) or bool(metadata.enable_tpu) or bool(metadata.enable_internet):
              raise SystemExit("repaired target resource contract mismatch")
          print("STAGE1_LENGTH_V2_EXECUTION PASS request=002 target=renta0426/stage1-length-interactions-v2 version=1 accelerator=cpu retries=0 submissions=0")
          PY

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'STAGE1_LENGTH_V2_RUNNER_MATERIAL_REMOVED'
