name: Poisoned Chalice P1-02 start-boundary read-only recovery v2

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2.yml
      - requests/poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2.json
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v2.py
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v1.py
      - scripts/poisoned_chalice_shadow_gold_start_boundary_attribution_v1.py
      - scripts/kaggle_exact_identity.py
  pull_request:
    paths:
      - .github/workflows/poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2.yml
      - requests/poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2.json
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v2.py
      - scripts/poisoned_chalice_p1_02_start_boundary_recover_v1.py
      - scripts/poisoned_chalice_shadow_gold_start_boundary_attribution_v1.py
      - scripts/kaggle_exact_identity.py

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260912-poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2-001
  TARGET: renta0426/shadow-gold-start-boundary-attribution-v1
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate P1-02 recovery v2 without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || exit 1
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(
              f"https://api.github.com/repos/{repo}/tarball/{ref}",
              headers={"User-Agent":"poisoned-chalice-p1-02-recovery-v2/1"},
          )
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(25_000_001)
          if len(data)>25_000_000:
              raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[member for member in archive.getmembers() if member.isfile()]
              prefixes={member.name.split("/",1)[0] for member in files}
              if len(prefixes)!=1:
                  raise SystemExit("archive layout")
              prefix=next(iter(prefixes))+"/"
              for member in files:
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if not member.name.startswith(prefix) or ".." in rel.parts:
                      raise SystemExit("unsafe archive")
                  out=target.joinpath(*rel.parts)
                  out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(member).read())
          PY

      - name: Validate request, serializer and bounded read contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/requests/poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2.json" <<'PY'
          import json,sys
          request=json.load(open(sys.argv[1],encoding="utf-8"))
          assert request["request_id"]=="20260912-poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2-001"
          assert request["predecessor_request_id"]=="20260908-poisoned-chalice-p1-02-start-boundary-readonly-recovery-v1-001"
          assert request["predecessor_run_id"]==34240887808
          assert request["operation"]=="kernel_current_completed_recovery_read"
          assert request["execution_policy"]=="kaggle_native_capacity_v2"
          assert request["target"]=="renta0426/shadow-gold-start-boundary-attribution-v1"
          assert request["expected_kernel_version"]==1
          assert request["research_commit"]=="6b6f388627dfcf16ab0140337cabe7e93f4a8891"
          assert request["original_launcher_blob_sha"]=="16cf5028a6d09f2aed4c590b69c42c248365a265"
          assert request["expected_prediction_rows"]==2560
          assert request["new_write_attempted"] is False
          assert request["new_compute_requested"] is False
          assert request["competition_submission_attempted"] is False
          assert request["automatic_compute_retries"]==0
          assert request["bounded_read_reconciliation"]=={
              "exact_get_kernel_attempts":6,
              "kernel_status_attempts":6,
              "delay_seconds":2.0,
              "retry_http_statuses":[403,404],
          }
          assert request["fail_closed"]["require_current_version_exactly_1"] is True
          assert request["fail_closed"]["require_original_notebook_source_identity"] is True
          assert request["fail_closed"]["require_scientific_outputs_complete"] is True
          assert request["fail_closed"]["require_frozen_clean_room_guards"] is True
          assert request["fail_closed"]["refuse_any_write_or_compute_retry"] is True
          assert request["fail_closed"]["refuse_target_or_version_substitution"] is True
          PY
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v2.py" \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v1.py" \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_shadow_gold_start_boundary_attribution_v1.py" \
            "${WORKDIR}/bridge/scripts/kaggle_exact_identity.py"
          grep -F 'exact_metadata_eventually' "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v2.py" >/dev/null
          grep -F 'automatic_compute_retries": 0' "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v2.py" >/dev/null
          ! grep -Eq 'kernels_push|kernel_push|competition_submit|"kernels"[[:space:]]*,[[:space:]]*"push"|"competitions"[[:space:]]*,[[:space:]]*"submit"' \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v2.py"

          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 - <<'PY'
          import poisoned_chalice_p1_02_start_boundary_recover_v2 as m

          class Meta:
              ref=m.TARGET
              is_private=True
              current_version_number=1
              enable_gpu=True
              enable_tpu=False
              enable_internet=False
          class Status:
              status="COMPLETE"
          class API:
              def kernels_status(self, target):
                  assert target==m.TARGET
                  return Status()

          calls=[]
          def fake_metadata(api,kernel,*,attempts,delay_seconds):
              calls.append((kernel,attempts,delay_seconds))
              return Meta()
          m.exact_metadata_eventually=fake_metadata
          assert m.validate_remote_identity(API())=="COMPLETE"
          assert calls==[(m.TARGET,6,2.0)]

          class E403(Exception):
              status=403
          class FlakyAPI:
              def __init__(self): self.calls=0
              def kernels_status(self,target):
                  self.calls+=1
                  if self.calls<3: raise E403("redacted")
                  return Status()
          old_sleep=m.time.sleep
          m.time.sleep=lambda _:None
          try:
              api=FlakyAPI()
              assert m.kernels_status_eventually(api)=="COMPLETE"
              assert api.calls==3
          finally:
              m.time.sleep=old_sleep
          PY

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  recover:
    name: Read existing P1-02 version 1 outputs only via recovery v2
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected recovery boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-p1-02-start-boundary-readonly-recovery-v2.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"poisoned-chalice-p1-02-recovery-v2/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(25_000_001)
          if len(data)>25_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[member for member in archive.getmembers() if member.isfile()]
              prefixes={member.name.split("/",1)[0] for member in files}
              if len(prefixes)!=1: raise SystemExit("archive layout")
              prefix=next(iter(prefixes))+"/"
              for member in files:
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if not member.name.startswith(prefix) or ".." in rel.parts: raise SystemExit("unsafe archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(member).read())
          PY

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Recover and validate existing version 1 only
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" \
            "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/bridge/scripts/poisoned_chalice_p1_02_start_boundary_recover_v2.py" \
            --bridge-root "${WORKDIR}/bridge" \
            --output-dir "${WORKDIR}/recovery"
          test -f "${WORKDIR}/recovery/recovery.json"
          grep -F '"new_write_attempted": false' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"new_compute_requested": false' "${WORKDIR}/recovery/recovery.json" >/dev/null
          grep -F '"scientific_outputs_validated": true' "${WORKDIR}/recovery/recovery.json" >/dev/null

      - name: Cleanup runner-local recovery content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
