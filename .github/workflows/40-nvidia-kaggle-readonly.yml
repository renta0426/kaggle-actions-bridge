name: NVIDIA Kaggle skill read-only smoke test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/40-nvidia-kaggle-readonly.yml

permissions: {}

concurrency:
  group: nvidia-kaggle-readonly
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  NVIDIA_KAGGLE_COMMIT: 2b78cf29f5f30680764292a6592de8d53d4147a8
  NVIDIA_SKILL_BLOB: 33a3e641da5af24edcee1398a26f1a1b058c3dc5
  NVIDIA_RUNTIME_BLOB: 7b46f7a702b2f82d5c1777011c1369f0ba88e00b
  NVIDIA_OVERVIEW_BLOB: 8a75ea865e51636426c0efaaae44c3b3c96ec171
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock

jobs:
  verify-source:
    name: Verify and materialize pinned NVIDIA skill without secrets
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Enforce secret-free execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]

          forbidden=(
            KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY
            GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY
            AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AZURE_CLIENT_SECRET
            GOOGLE_APPLICATION_CREDENTIALS
          )
          for name in "${forbidden[@]}"; do
            [[ -z "${!name-}" ]] || {
              echo "ERROR: unexpected credential variable present: ${name}"
              exit 1
            }
          done
          echo "NVIDIA probe secret-free boundary: PASS"

      - name: Fetch exact NVIDIA commit and materialize Agent Skill
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT

          git init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/NVIDIA/nvidia-kaggle.git
          git -C "${workdir}/repo" -c protocol.version=2 fetch -q --depth=1 origin "${NVIDIA_KAGGLE_COMMIT}"
          [[ "$(git -C "${workdir}/repo" rev-parse FETCH_HEAD)" == "${NVIDIA_KAGGLE_COMMIT}" ]]
          git -C "${workdir}/repo" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD

          skill_rel="skills/nvidia-kaggle-skill"
          [[ "$(git -C "${workdir}/repo" rev-parse "HEAD:${skill_rel}/SKILL.md")" == "${NVIDIA_SKILL_BLOB}" ]]
          [[ "$(git -C "${workdir}/repo" rev-parse "HEAD:${skill_rel}/scripts/runtime.py")" == "${NVIDIA_RUNTIME_BLOB}" ]]
          [[ "$(git -C "${workdir}/repo" rev-parse "HEAD:${skill_rel}/scripts/fetch_competition_info.py")" == "${NVIDIA_OVERVIEW_BLOB}" ]]

          mkdir -p "${workdir}/installed-skills"
          cp -R "${workdir}/repo/${skill_rel}" "${workdir}/installed-skills/nvidia-kaggle-skill"
          skill="${workdir}/installed-skills/nvidia-kaggle-skill"
          test -f "${skill}/SKILL.md"
          test -f "${skill}/scripts/runtime.py"
          test -f "${skill}/scripts/fetch_competition_info.py"
          python3 -m py_compile "${skill}/scripts/runtime.py" "${skill}/scripts/fetch_competition_info.py"
          python3 "${skill}/scripts/fetch_competition_info.py" --help >/dev/null

          echo "Pinned NVIDIA Agent Skill materialization: PASS"

  run-readonly:
    name: Run pinned NVIDIA skill against Kaggle read-only API
    needs: verify-source
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/40-nvidia-kaggle-readonly.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "Protected NVIDIA skill boundary: PASS"

      - name: Prepare pinned skill and hashed Kaggle runtime before secret exposure
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"

          git init -q "${workdir}/nvidia-repo"
          git -C "${workdir}/nvidia-repo" remote add origin https://github.com/NVIDIA/nvidia-kaggle.git
          git -C "${workdir}/nvidia-repo" -c protocol.version=2 fetch -q --depth=1 origin "${NVIDIA_KAGGLE_COMMIT}"
          [[ "$(git -C "${workdir}/nvidia-repo" rev-parse FETCH_HEAD)" == "${NVIDIA_KAGGLE_COMMIT}" ]]
          git -C "${workdir}/nvidia-repo" -c core.hooksPath=/dev/null checkout -q --detach FETCH_HEAD

          skill_rel="skills/nvidia-kaggle-skill"
          [[ "$(git -C "${workdir}/nvidia-repo" rev-parse "HEAD:${skill_rel}/SKILL.md")" == "${NVIDIA_SKILL_BLOB}" ]]
          [[ "$(git -C "${workdir}/nvidia-repo" rev-parse "HEAD:${skill_rel}/scripts/runtime.py")" == "${NVIDIA_RUNTIME_BLOB}" ]]
          [[ "$(git -C "${workdir}/nvidia-repo" rev-parse "HEAD:${skill_rel}/scripts/fetch_competition_info.py")" == "${NVIDIA_OVERVIEW_BLOB}" ]]
          mkdir -p "${workdir}/skills"
          cp -R "${workdir}/nvidia-repo/${skill_rel}" "${workdir}/skills/nvidia-kaggle-skill"

          lock_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA_VALUE}/${LOCK_RELATIVE_PATH}"
          python3 - "${lock_url}" "${workdir}/kaggle.lock" <<'PY'
          import re
          import ssl
          import sys
          import urllib.request
          from urllib.parse import urlparse

          url, output = sys.argv[1:]
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
              raise SystemExit("unexpected lock origin")

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )
          with opener.open(url, timeout=30) as response:
              data = response.read(65537)
          if len(data) > 65536:
              raise SystemExit("lock too large")
          text = data.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI pin missing")
          with open(output, "w", encoding="utf-8", newline="\n") as handle:
              handle.write(text)
          PY

          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-input \
            --no-deps \
            --only-binary=:all: \
            --require-hashes \
            -r "${workdir}/kaggle.lock" \
            >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null

          skill="${workdir}/skills/nvidia-kaggle-skill"
          "${workdir}/venv/bin/python" -m py_compile "${skill}/scripts/runtime.py" "${skill}/scripts/fetch_competition_info.py"
          "${workdir}/venv/bin/python" "${skill}/scripts/fetch_competition_info.py" --help >/dev/null
          mkdir -p "${workdir}/project-root"
          echo "Pinned NVIDIA skill and hashed Kaggle runtime prepared: PASS"

      - name: Execute one NVIDIA skill read-only workflow
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PROJECT_ROOT: ${{ env.WORKDIR }}/project-root
        run: |
          set -euo pipefail
          if [[ -z "${KAGGLE_API_TOKEN}" ]] || [[ "${KAGGLE_API_TOKEN}" != KGAT_* ]]; then
            echo "ERROR: protected Kaggle token is unavailable or malformed"
            exit 1
          fi

          output="${WORKDIR}/nvidia-output.txt"
          errors="${WORKDIR}/nvidia-stderr.txt"
          set +e
          "${WORKDIR}/venv/bin/python" \
            "${WORKDIR}/skills/nvidia-kaggle-skill/scripts/fetch_competition_info.py" \
            titanic \
            >"${output}" 2>"${errors}"
          rc=$?
          set -e

          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: NVIDIA Kaggle read-only script failed; output suppressed"
            rm -f "${output}" "${errors}"
            exit 1
          fi

          bytes="$(wc -c < "${output}")"
          if [[ "${bytes}" -lt 100 ]] || [[ "${bytes}" -gt 2000000 ]]; then
            echo "ERROR: NVIDIA Kaggle output size outside expected boundary"
            rm -f "${output}" "${errors}"
            exit 1
          fi

          rm -f "${output}" "${errors}"
          echo "NVIDIA nvidia-kaggle bundled competition overview workflow: PASS"
          echo "Output content and credential values were not logged"

      - name: Cleanup and complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" ]] && [[ -d "${WORKDIR}" ]]; then
            rm -rf "${WORKDIR}"
          fi
          echo "NVIDIA Kaggle read-only smoke test complete"
