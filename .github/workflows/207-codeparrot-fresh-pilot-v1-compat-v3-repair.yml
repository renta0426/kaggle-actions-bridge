name: CodeParrot fresh 200-row T4 pilot compat v3 repair

on:
  pull_request:
    paths:
      - scripts/compose_private_codeparrot_pilot_v2.py
      - scripts/patch_codeparrot_pilot_config_compat_v3.py
      - scripts/kaggle_policy_preflight.py
      - requirements/kaggle-2.2.4.lock
      - .github/workflows/207-codeparrot-fresh-pilot-v1-compat-v3-repair.yml
  push:
    branches: [main]
    paths:
      - scripts/patch_codeparrot_pilot_config_compat_v3.py
      - .github/workflows/207-codeparrot-fresh-pilot-v1-compat-v3-repair.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET_COMPETITION: poisoned-chalice-icse27
  MINKPP_SOURCE_KERNEL: renta0426/poisoned-chalice-minkpp-paper-10k-v1
  COHORT_KERNEL: renta0426/codeparrot-fresh-cohort-v1
  TARGET_KERNEL: renta0426/codeparrot-fresh-pilot-v1
  TARGET_SLUG: codeparrot-fresh-pilot-v1
  BASE_COMPOSER_PATH: scripts/compose_private_codeparrot_pilot_v2.py
  COMPAT_PATCH_PATH: scripts/patch_codeparrot_pilot_config_compat_v3.py
  POLICY_PATH: scripts/kaggle_policy_preflight.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  AUDITED_COHORT_SHA256: b664e368f9380e230c9cfc0616327d829424749c5473f87575678525db1998fc
  STALE_COHORT_SHA256: 994276dc4ae9e5cf8cc17e66ddcb46ffa500b3236ec3d1ccbda10d2670466446

jobs:
  validate:
    name: Validate CodeParrot compat-v3 repair without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Validate public repair boundary and regression tests
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"; trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value); ctx=ssl.create_default_context()
          files=(
              ("scripts/compose_private_codeparrot_pilot_v2.py",65536,"composer.py"),
              ("scripts/patch_codeparrot_pilot_config_compat_v3.py",65536,"compat.py"),
              ("scripts/kaggle_policy_preflight.py",65536,"policy.py"),
          )
          for remote,maximum,local in files:
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{remote}"
              req=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response:
                  data=response.read(maximum+1)
              if not data or len(data)>maximum:
                  raise SystemExit(f"public source byte budget failed: {remote}")
              path=root/local; path.write_bytes(data); compile(data,str(path),"exec")
          compat=(root/"compat.py").read_text(encoding="utf-8")
          required=(
              "CODEPARROT_PRIVATE_SNAPSHOT_COMPAT_V3",
              "jupyter_cell_compile_regression",
              "b664e368f9380e230c9cfc0616327d829424749c5473f87575678525db1998fc",
              "object.__setattr__(CONFIG",
              "def _chunk_statistics(logits, targets, rank_vocab_block_size=8192):",
          )
          if not all(token in compat for token in required):
              raise SystemExit("compat-v3 static contract marker missing")
          print("CODEPARROT_COMPAT_V3_STATIC PASS credentials=0 labels=0 submissions=0")
          PY
          python3 "${workdir}/policy.py"
          python3 -m venv "${workdir}/compose-venv"
          "${workdir}/compose-venv/bin/python" -m pip install --disable-pip-version-check --no-input -q 'nbformat==5.10.4'
          "${workdir}/compose-venv/bin/python" "${workdir}/composer.py" --self-test
          "${workdir}/compose-venv/bin/python" "${workdir}/compat.py" --self-test

  repair:
    name: Repair existing CodeParrot pilot v1 as version 2 with compat v3 exactly once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-gpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce protected compat-v3 repair boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/207-codeparrot-fresh-pilot-v1-compat-v3-repair.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "forbidden credential variable: ${name}"; exit 1; }
          done
          echo "CODEPARROT_COMPAT_V3_BOUNDARY PASS target_version_before=1 target_version_after_requested=2 gpu=t4x1 rows=200 retries=0 submissions=0"

      - name: Prepare composer, compat-v3 patch, policy, and locked Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value); ctx=ssl.create_default_context()
          files=(
              ("scripts/compose_private_codeparrot_pilot_v2.py",65536,"composer.py"),
              ("scripts/patch_codeparrot_pilot_config_compat_v3.py",65536,"compat.py"),
              ("scripts/kaggle_policy_preflight.py",65536,"policy.py"),
              ("requirements/kaggle-2.2.4.lock",262144,"kaggle.lock"),
          )
          for remote,maximum,local in files:
              url=f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{remote}"
              req=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response:
                  data=response.read(maximum+1)
              if not data or len(data)>maximum:
                  raise SystemExit(f"public material byte budget failed: {remote}")
              path=root/local; path.write_bytes(data)
              if path.suffix==".py": compile(data,str(path),"exec")
          PY
          python3 "${workdir}/policy.py"
          python3 -m venv "${workdir}/compose-venv"
          "${workdir}/compose-venv/bin/python" -m pip install --disable-pip-version-check --no-input -q 'nbformat==5.10.4'
          "${workdir}/compose-venv/bin/python" "${workdir}/composer.py" --self-test
          "${workdir}/compose-venv/bin/python" "${workdir}/compat.py" --self-test
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "CODEPARROT_COMPAT_V3_PREP PASS locked_cli=2.2.4"

      - name: Authenticate and admit exact failed version-1 repair
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          mkdir -p "${HOME}/.kaggle"; umask 077
          printf '%s' "${KAGGLE_API_TOKEN}" > "${HOME}/.kaggle/access_token"
          unset KAGGLE_API_TOKEN
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os,re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api=KaggleApi(); api.authenticate()
          pages=api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content={}
          for page in pages:
              data=page.to_dict() if hasattr(page,"to_dict") else dict(page)
              name=str(data.get("name") or "").strip().lower()
              if name: content[name]=str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live Poisoned Chalice Rules/Evaluation/Data pages unavailable")
          evaluation=re.sub(r"\s+"," ",re.sub(r"<[^>]+>"," ",content["evaluation"].replace(r"\%","%"))).casefold()
          if not all(token in evaluation for token in ("auc","novelty","1%","false-positive")):
              raise SystemExit("live Poisoned Chalice evaluation contract changed")

          target=os.environ["TARGET_KERNEL"]; owner,slug=target.split("/",1)
          status=str(getattr(api.kernels_status(target),"status","") or "").upper()
          if "ERROR" not in status:
              raise SystemExit(f"repair target is no longer the approved failed state: status={status}")
          with api.build_kaggle_client() as client:
              req=ApiGetKernelRequest(); req.user_name=owner; req.kernel_slug=slug
              metadata=client.kernels.kernels_api_client.get_kernel(req).metadata
          version=getattr(metadata,"current_version_number",None)
          if int(version or -1) != 1:
              raise SystemExit(f"repair target current version changed: {version}")
          if not bool(getattr(metadata,"enable_gpu",False)) or bool(getattr(metadata,"enable_tpu",False)):
              raise SystemExit("repair target accelerator metadata changed")

          for source in (os.environ["MINKPP_SOURCE_KERNEL"],os.environ["COHORT_KERNEL"]):
              source_status=str(getattr(api.kernels_status(source),"status","") or "").upper()
              if "COMPLETE" not in source_status:
                  raise SystemExit(f"required source is not complete: {source}")

          quota=api.quota_view(); gpu=getattr(quota,"gpu_quota",None)
          used=getattr(gpu,"time_used",None); total=getattr(gpu,"total_time_allowed",None)
          if used is None or total is None: raise SystemExit("GPU quota unavailable")
          remaining=max(0.0,(total-used).total_seconds()/3600.0)
          if remaining < 0.5: raise SystemExit(f"insufficient GPU quota: {remaining:.2f}h")

          active_refs=[]; unknown=0
          for item in (api.kernels_list(user="renta0426",sort_by="dateRun",page_size=25) or [])[:25]:
              ref=str(getattr(item,"ref","") or "")
              if not ref: continue
              try: item_status=str(getattr(api.kernels_status(ref),"status","") or "").upper()
              except Exception: unknown+=1; continue
              if any(token in item_status for token in ("RUNNING","QUEUED","PENDING")): active_refs.append(ref)
          active_gpu=0; active_unknown=unknown
          with api.build_kaggle_client() as client:
              for ref in active_refs:
                  try:
                      ref_owner,ref_slug=ref.split("/",1); req=ApiGetKernelRequest(); req.user_name=ref_owner; req.kernel_slug=ref_slug
                      ref_meta=client.kernels.kernels_api_client.get_kernel(req).metadata
                      if bool(getattr(ref_meta,"enable_gpu",False)): active_gpu+=1
                  except Exception: active_unknown+=1
          if active_unknown: raise SystemExit(f"GPU admission unknown resource state: {active_unknown}")
          if active_gpu: raise SystemExit(f"GPU admission refused: active_gpu={active_gpu}")
          print(f"CODEPARROT_COMPAT_V3_LIVE_PREFLIGHT PASS version=1 status=ERROR gpu=1 tpu=0 quota={remaining:.2f}h active_gpu=0")
          PY

      - name: Compose audited compatible version 2 and push exactly once
        shell: bash
        run: |
          set -euo pipefail
          kaggle_bin="${WORKDIR}/kaggle-venv/bin/kaggle"
          source_dir="${WORKDIR}/private-minkpp"; target_dir="${WORKDIR}/private-target"
          mkdir -p "${source_dir}" "${target_dir}"
          if ! "${kaggle_bin}" kernels pull "${MINKPP_SOURCE_KERNEL}" -m -p "${source_dir}" >/dev/null 2>&1; then
            echo "private Min-K++ source pull failed"; exit 1
          fi
          "${WORKDIR}/compose-venv/bin/python" "${WORKDIR}/composer.py" \
            --minkpp-dir "${source_dir}" \
            --output-dir "${target_dir}" \
            --target "${TARGET_KERNEL}" \
            --title "CodeParrot Fresh Pilot V1"
          "${WORKDIR}/compose-venv/bin/python" "${WORKDIR}/compat.py" --notebook-dir "${target_dir}"
          "${WORKDIR}/compose-venv/bin/python" - "${target_dir}" "${AUDITED_COHORT_SHA256}" "${STALE_COHORT_SHA256}" <<'PY'
          import json,pathlib,sys
          import nbformat
          root=pathlib.Path(sys.argv[1]); audited=sys.argv[2]; stale=sys.argv[3]
          metadata=json.loads((root/"kernel-metadata.json").read_text())
          assert metadata["id"]=="renta0426/codeparrot-fresh-pilot-v1"
          assert metadata["is_private"] is True and metadata["enable_gpu"] is True and metadata["enable_tpu"] is False
          assert metadata["machine_shape"]=="NvidiaTeslaT4"
          assert metadata["kernel_sources"]==["renta0426/codeparrot-fresh-cohort-v1"]
          notebook=nbformat.read(next(root.glob("*.ipynb")),as_version=4); nbformat.validate(notebook)
          code="\n".join(cell.source for cell in notebook.cells if cell.cell_type=="code")
          required=(
              "CODEPARROT_PRIVATE_SNAPSHOT_COMPAT_V3",
              'object.__setattr__(CONFIG, "rank_vocab_block_size", 8192)',
              "def _chunk_statistics(logits, targets, rank_vocab_block_size=8192):",
              audited,
              "run_private_paper_records",
              "performance_metrics_computed",
              "membership_join_performed",
              "full_4000_scoring_authorized",
          )
          if not all(token in code for token in required):
              raise SystemExit("compat-v3 private bundle contract incomplete")
          if stale in code:
              raise SystemExit("stale cohort SHA remains in private bundle")
          forbidden=("raw.githubusercontent.com","api.github.com/repos/","RESEARCH_REPO_READ_TOKEN","GH_TOKEN","GITHUB_PAT","SSH_PRIVATE_KEY","competitions submit","submission.csv")
          if any(token in code for token in forbidden):
              raise SystemExit("compat-v3 private bundle contains forbidden transport/side effect")
          print("CODEPARROT_COMPAT_V3_PRIVATE_BUNDLE PASS labels=0 metrics=0 submission=0 audited_cohort_sha=1")
          PY

          set +e
          "${kaggle_bin}" kernels push -p "${target_dir}" >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          stdout_bytes="$(wc -c <"${WORKDIR}/push.stdout")"; stderr_bytes="$(wc -c <"${WORKDIR}/push.stderr")"
          stdout_sha="$(sha256sum "${WORKDIR}/push.stdout" | awk '{print $1}')"; stderr_sha="$(sha256sum "${WORKDIR}/push.stderr" | awk '{print $1}')"
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "CODEPARROT_COMPAT_V3_PUSH_FAILED rc=${rc} stdout_bytes=${stdout_bytes} stderr_bytes=${stderr_bytes} stdout_sha256=${stdout_sha} stderr_sha256=${stderr_sha} ambiguous_write=1 retry=0"; exit 1
          fi
          echo "CODEPARROT_COMPAT_V3_KERNEL_PUSH PASS requested_version=2 count=1 retry=0 submission=0"
          echo "Post-write visibility is non-gating; no automatic re-push is permitted."

      - name: Cleanup credentials and private runner-local source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -f "${HOME}/.kaggle/access_token" "${HOME}/.kaggle/kaggle.json"
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "CODEPARROT_COMPAT_V3_CLEANUP PASS private_source_persisted=0"
