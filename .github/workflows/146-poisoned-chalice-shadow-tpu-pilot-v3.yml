name: Poisoned Chalice spawn-safe shadow TPU pilot v3

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-shadow-tpu-pilot-v3.json
      - scripts/poisoned_chalice_shadow_tpu_pilot_v4.py
      - materialized/poisoned-chalice-shadow-tpu-pilot-v3/**
      - .github/workflows/146-poisoned-chalice-shadow-tpu-pilot-v3.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-shadow-tpu-pilot-v3.json
      - scripts/poisoned_chalice_shadow_tpu_pilot_v4.py
      - materialized/poisoned-chalice-shadow-tpu-pilot-v3/**
      - .github/workflows/146-poisoned-chalice-shadow-tpu-pilot-v3.yml

permissions: {}

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-shadow-tpu-pilot-v3.json
  LAUNCHER_PATH: scripts/poisoned_chalice_shadow_tpu_pilot_v4.py
  BASE_LAUNCHER_PATH: scripts/poisoned_chalice_shadow_tpu_pilot_v3.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_KERNEL: renta0426/shadow-tpu-pilot-v3
  TARGET_COMPETITION: poisoned-chalice-icse27

jobs:
  validate:
    name: Validate spawn-safe shadow TPU pilot v3 without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free exact bundle
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN RESEARCH_REPO_READ_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${source_sha}" "${workdir}" <<'PY'
          import hashlib, json, pathlib, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-shadow-tpu-pilot-v3.json": 32768,
              "scripts/poisoned_chalice_shadow_tpu_pilot_v4.py": 262144,
              "scripts/poisoned_chalice_shadow_tpu_pilot_v3.py": 262144,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_protocol.py": 131072,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_training.py": 131072,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v2/poisoned_chalice/shadow_xla_compat.py": 32768,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v3/poisoned_chalice/shadow_training_spawn.py": 32768,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v3/shadow_tpu_pilot_v3.json": 32768,
          }
          context = ssl.create_default_context()
          for path, maximum in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge origin")
              req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=context) as response:
                  data = response.read(maximum + 1)
              if len(data) > maximum:
                  raise SystemExit(f"bridge file exceeds byte budget: {path}")
              dst = root / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)

          request = json.loads((root / "requests/poisoned-chalice-shadow-tpu-pilot-v3.json").read_text())
          exact = {
              "schema_version": 1,
              "request_id": "20260904-poisoned-chalice-shadow-tpu-pilot-v3-001",
              "parent_request_id": "20260904-poisoned-chalice-shadow-tpu-pilot-v2-001",
              "competition": "poisoned-chalice-icse27",
              "operation": "kernel_run",
              "target": "renta0426/shadow-tpu-pilot-v3",
              "launcher_path": "scripts/poisoned_chalice_shadow_tpu_pilot_v4.py",
              "base_launcher_path": "scripts/poisoned_chalice_shadow_tpu_pilot_v3.py",
              "research_repository": "renta0426/The-Poisoned-Chalice-of-LLM-Evaluation",
              "research_commit": "e5c98015d455b2a81cce155d7ac502971565806f",
              "automatic_compute_retries": 0,
              "enable_internet": False,
              "competition_submission": False,
              "select_as_final": False,
              "runner_local_public_material_retention_days": 0,
          }
          for key, value in exact.items():
              if request.get(key) != value:
                  raise SystemExit(f"request contract changed: {key}")
          if request.get("resource") != {
              "accelerator": "tpu",
              "machine_shape": "Tpu1VmV38",
              "expected_runtime_minutes": 20,
              "hard_timeout_minutes": 60,
              "max_active_runs": 1,
              "min_remaining_quota_hours": 1.0,
          }:
              raise SystemExit("resource contract changed")
          if request.get("pilot_contract") != {
              "repair_from": "shadow-tpu-pilot-v2",
              "compatibility_layer": "shadow-xla-compat-v1",
              "spawn_layer": "shadow-xla-spawn-safe-v1",
              "synthetic_training_rows": 128,
              "max_sequence_tokens": 256,
              "seed": 2027,
              "global_batch_size": 64,
              "architecture_slots": ["left", "right"],
              "max_steps_per_architecture": 2,
              "expected_world_size": 8,
              "persistent_outputs": ["shadow_tpu_pilot_manifest.json"],
              "persist_checkpoints": False,
              "persist_training_protocol": False,
              "stage2_v3_selection_allowed": False,
          }:
              raise SystemExit("pilot contract changed")
          if request.get("clean_room", {}).get("protected_job_private_repository_access") is not False:
              raise SystemExit("private-repository access guard changed")
          if request.get("side_effects") != [
              "consume five exact source snapshots already materialized in the approved bridge commit",
              "create one private Kaggle TPU Notebook version at renta0426/shadow-tpu-pilot-v3 and start exactly one TPU run",
          ]:
              raise SystemExit("side-effect contract changed")

          def git_blob(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          launcher = root / request["launcher_path"]
          if git_blob(launcher) != request.get("launcher_blob_sha"):
              raise SystemExit("launcher blob mismatch")
          compile(launcher.read_bytes(), request["launcher_path"], "exec")
          base_launcher = root / request["base_launcher_path"]
          if git_blob(base_launcher) != request.get("base_launcher_blob_sha"):
              raise SystemExit("base launcher blob mismatch")
          for item in request.get("materialized_files", []):
              path = root / item["bridge_path"]
              if git_blob(path) != item["git_blob_sha"] or path.stat().st_size > int(item["max_bytes"]):
                  raise SystemExit(f"snapshot identity mismatch: {item['bridge_path']}")
          if len(request.get("materialized_files", [])) != 5:
              raise SystemExit("snapshot count changed")
          print("SHADOW_TPU_V3_SNAPSHOT PASS snapshots=5 private_repo_access=0 spawn_safe=1")
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --base-launcher "${workdir}/${BASE_LAUNCHER_PATH}"
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --materialize \
            --snapshot-root "${workdir}" \
            --base-launcher "${workdir}/${BASE_LAUNCHER_PATH}" \
            --kernel-dir "${workdir}/kernel"
          python3 - "${workdir}/kernel" <<'PY'
          import json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          if sorted(path.name for path in root.iterdir()) != ["kernel-metadata.json", "shadow-tpu-pilot-v3.ipynb"]:
              raise SystemExit("kernel bundle allowlist changed")
          notebook = json.loads((root / "shadow-tpu-pilot-v3.ipynb").read_text())
          code = "".join(notebook["cells"][1]["source"])
          compile(code, "shadow-tpu-pilot-v3.ipynb", "exec")
          for marker in ("shadow-xla-spawn-safe-v1", "train_shadow_model_spawn_safe", "if __name__ == '__main__':"):
              if marker not in code:
                  raise SystemExit(f"spawn-safe notebook marker missing: {marker}")
          print("SHADOW_TPU_V3_NOTEBOOK_COMPILE PASS spawn_safe=1")
          PY

  launch:
    name: Launch exactly one spawn-safe shadow TPU pilot v3
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    concurrency:
      group: kaggle-resource-tpu-global
      cancel-in-progress: false
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/146-poisoned-chalice-shadow-tpu-pilot-v3.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          [[ -z "${RESEARCH_REPO_READ_TOKEN-}" ]]
          echo "SHADOW_TPU_V3_PROTECTED_BOUNDARY PASS private_repo_access=0"

      - name: Materialize approved bridge snapshot and isolated Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          kernel_dir="${workdir}/kernel"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          echo "KERNEL_DIR=${kernel_dir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import hashlib, json, pathlib, re, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          files = {
              "requests/poisoned-chalice-shadow-tpu-pilot-v3.json": 32768,
              "scripts/poisoned_chalice_shadow_tpu_pilot_v4.py": 262144,
              "scripts/poisoned_chalice_shadow_tpu_pilot_v3.py": 262144,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_protocol.py": 131072,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v1/poisoned_chalice/shadow_training.py": 131072,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v2/poisoned_chalice/shadow_xla_compat.py": 32768,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v3/poisoned_chalice/shadow_training_spawn.py": 32768,
              "materialized/poisoned-chalice-shadow-tpu-pilot-v3/shadow_tpu_pilot_v3.json": 32768,
              "requirements/kaggle-2.2.4.lock": 65536,
          }
          context = ssl.create_default_context()
          for path, maximum in files.items():
              url = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}"
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge origin")
              req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=context) as response:
                  data = response.read(maximum + 1)
              if len(data) > maximum:
                  raise SystemExit(f"bridge file exceeds byte budget: {path}")
              dst = root / path
              dst.parent.mkdir(parents=True, exist_ok=True)
              dst.write_bytes(data)

          request = json.loads((root / "requests/poisoned-chalice-shadow-tpu-pilot-v3.json").read_text())
          def git_blob(path):
              data = path.read_bytes()
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
          launcher = root / request["launcher_path"]
          base_launcher = root / request["base_launcher_path"]
          if git_blob(launcher) != request["launcher_blob_sha"]:
              raise SystemExit("launcher blob mismatch")
          if git_blob(base_launcher) != request["base_launcher_blob_sha"]:
              raise SystemExit("base launcher blob mismatch")
          for item in request["materialized_files"]:
              path = root / item["bridge_path"]
              if git_blob(path) != item["git_blob_sha"]:
                  raise SystemExit(f"snapshot blob mismatch: {item['bridge_path']}")
          lock = (root / "requirements/kaggle-2.2.4.lock").read_text()
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          PY
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --static \
            --launcher "${workdir}/${LAUNCHER_PATH}" \
            --base-launcher "${workdir}/${BASE_LAUNCHER_PATH}"
          python3 "${workdir}/${LAUNCHER_PATH}" \
            --materialize \
            --snapshot-root "${workdir}" \
            --base-launcher "${workdir}/${BASE_LAUNCHER_PATH}" \
            --kernel-dir "${kernel_dir}"
          python3 -m venv "${workdir}/kaggle-venv"
          "${workdir}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/${LOCK_PATH}" >/dev/null
          "${workdir}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${workdir}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "SHADOW_TPU_V3_CLIENT PASS private_repo_access=0"

      - name: Confirm current Kaggle policy pages
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("SHADOW_TPU_V3_POLICY PASS")
          PY

      - name: Live preflight and launch once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -z "${RESEARCH_REPO_READ_TOKEN-}" ]]
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          target = os.environ["TARGET_KERNEL"]
          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live Competition rules/evaluation/data unavailable")
          plain_eval = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["evaluation"].replace(r"\%", "%"))).casefold()
          if not all(term in plain_eval for term in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("evaluation contract changed")
          rules = re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", content["rules"])).casefold()
          if "tpu use is prohibited" in rules or "tpu is prohibited" in rules:
              raise SystemExit("live Competition rule prohibits TPU")

          visible = api.kernels_list(user="renta0426", search="shadow-tpu-pilot-v3", page_size=20) or []
          if any(str(getattr(item, "ref", "")) == target for item in visible):
              raise SystemExit("target kernel already exists in visible kernel list")

          quota = api.quota_view(); tpu = getattr(quota, "tpu_quota", None)
          used = getattr(tpu, "time_used", None) if tpu is not None else None
          total = getattr(tpu, "total_time_allowed", None) if tpu is not None else None
          if used is None or total is None:
              raise SystemExit("TPU quota unavailable")
          remaining = max(0.0, (total - used).total_seconds() / 3600.0)
          if remaining < 1.0:
              raise SystemExit(f"insufficient TPU quota: remaining={remaining:.2f}h")

          consumed_terminal = {
              "renta0426/shadow-tpu-pilot-v1",
              "renta0426/shadow-tpu-pilot-v2",
          }
          recent = (api.kernels_list(user="renta0426", sort_by="dateRun", page_size=25) or [])[:25]
          active_refs = []
          unknown = 0
          for item in recent:
              ref = str(getattr(item, "ref", ""))
              if not ref or ref in consumed_terminal:
                  continue
              try:
                  status = str(getattr(api.kernels_status(ref), "status", "")).upper()
              except Exception:
                  unknown += 1
                  continue
              if any(token in status for token in ("RUNNING", "QUEUED", "PENDING")):
                  active_refs.append(ref)
          active_tpu = 0
          if active_refs:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      try:
                          owner, slug = ref.split("/", 1)
                          req = ApiGetKernelRequest(); req.user_name = owner; req.kernel_slug = slug
                          metadata = client.kernels.kernels_api_client.get_kernel(req).metadata
                          gpu = getattr(metadata, "enable_gpu", None)
                          tpu_enabled = getattr(metadata, "enable_tpu", None)
                          if tpu_enabled is True:
                              active_tpu += 1
                          elif gpu is not True and tpu_enabled is not False:
                              unknown += 1
                      except Exception:
                          unknown += 1
          if active_tpu >= 1 or unknown:
              raise SystemExit(f"TPU admission refused: active_tpu={active_tpu} unknown={unknown}")
          print(f"SHADOW_TPU_V3_LIVE_PREFLIGHT PASS quota={remaining:.2f} active_tpu={active_tpu} private_repo_access=0")
          PY
          "${WORKDIR}/kaggle-venv/bin/python" "${WORKDIR}/${LAUNCHER_PATH}" \
            --execute \
            --kaggle-bin "${WORKDIR}/kaggle-venv/bin/kaggle" \
            --kernel-dir "${KERNEL_DIR}"

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "SHADOW_TPU_V3_CLEANUP PASS retention_days=0"
