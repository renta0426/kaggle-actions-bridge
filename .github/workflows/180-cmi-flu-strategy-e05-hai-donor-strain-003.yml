name: CMI-Flu strategy E05 HAI donor strain CPU 003

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/180-cmi-flu-strategy-e05-hai-donor-strain-003.yml
      - requests/cmi-flu-strategy-e05-hai-donor-strain-003.json
      - scripts/cmi_flu_strategy_e05_prepare_v3.py
      - scripts/cmi_flu_strategy_e05_execute_v3.py
      - scripts/cmi_flu_strategy_e05_sanitize_v3.py
  pull_request:
    paths:
      - .github/workflows/180-cmi-flu-strategy-e05-hai-donor-strain-003.yml
      - requests/cmi-flu-strategy-e05-hai-donor-strain-003.json
      - scripts/cmi_flu_strategy_e05_prepare_v3.py
      - scripts/cmi_flu_strategy_e05_execute_v3.py
      - scripts/cmi_flu_strategy_e05_sanitize_v3.py
      - .github/workflows/178-cmi-flu-strategy-e05-hai-donor-strain-002.yml
      - .github/workflows/179-cmi-flu-e05-nameerror-diagnostic.yml

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260907-cmi-flu-strategy-e05-hai-donor-strain-003
  SCIENCE_COMMIT: e02a601f38250480b526e548a48cf7f2526c00ca
  E05_BLOB: 78cde9e3a6b6e3b332352218c4b4545f769aa6c4
  HAI_TRANSFER_BLOB: b671d8bf7f10bebbd65aca2a5bad42e267ee78d5
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E05 003 full repaired runtime contract
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Install modeling dependencies and fetch locked public references
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"

      - name: Build runtime and prove repaired binding plus scientific model execution
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_prepare_v3.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          python3 - "${WORKDIR}/script.py" "${WORKDIR}/synthetic-lifecycle" <<'PY'
          import hashlib,json,pathlib,runpy,sys
          runtime,out=sys.argv[1],pathlib.Path(sys.argv[2]); ns=runpy.run_path(runtime,run_name='e05_v3_binding_probe')
          assert ns['REQUEST_ID']=='20260907-cmi-flu-strategy-e05-hai-donor-strain-003'
          assert ns['TARGET_KERNEL']=='renta0426/cmi-flu-e05-hai-donor-strain-20260907-003'
          assert callable(ns.get('json_safe'))
          for name,digest in ns['LOCKED_REFERENCE_SHA256'].items():
            assert hashlib.sha256(ns['locked_reference_bytes'](name)).hexdigest()==digest
          result={
            'experiment':'strategy_v2_e05_hai_donor_strain',
            'tasks':{'Task2.1':{},'Task2.2':{}},
            'feature_contract':{'ridge_alpha':10.0,'interaction_count':8,'free_participant_embedding':False,'raw_strain_id_one_hot':False},
            'split_contract':{'fixed_subject_strain_simultaneous_holdouts':4,'simultaneous_selection_uses_outcomes':False},
            'weight_contract':{'study_total_weight':'equal','subject_total_weight_within_study':'equal','strain_total_weight_within_subject':'equal','rows_are_not_counted_as_independent_donors':True},
            'leaderboard_used_for_selection':False,'competition_submission_attempted':False,
          }
          safe=ns['json_safe'](dict(result)); ns['validate_result'](safe); summary=ns['render_summary'](safe)
          out.mkdir(); metrics=out/'metrics.json'; sm=out/'summary.md'; bridge=out/'bridge-result.json'
          metrics.write_text(json.dumps(safe,sort_keys=True)+'\n'); sm.write_text(summary)
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          bridge.write_text(json.dumps({'request_id':ns['REQUEST_ID'],'science_commit':ns['SCIENCE_COMMIT'],'strategy_e05_blob_sha':ns['E05_BLOB'],'competition_submission_attempted':False,'leaderboard_used_for_selection':False,'contains_participant_identifiers':False,'contains_row_level_predictions':False,'metrics_sha256':sha(metrics),'summary_sha256':sha(sm)},sort_keys=True)+'\n')
          print('CMI_FLU_E05_V3_BINDING_LIFECYCLE_PASS json_safe=true references=true validation=true files=true')
          PY
          python3 "${WORKDIR}/bridge/scripts/test_cmi_e05_frozen_runtime.py" --runtime "${WORKDIR}/script.py" --output-dir "${WORKDIR}/synthetic-model"
          test -f "${WORKDIR}/synthetic-model/release-receipt.json"
          grep -F '"model_executed": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          grep -F '"result_validated": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          grep -F '"all_final_files_saved": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          grep -F '"cleanup_completed": true' "${WORKDIR}/synthetic-model/release-receipt.json" >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_sanitize_v3.py" --input-dir "${WORKDIR}/synthetic-lifecycle"
          ! grep -R -F 'kaggle competitions submit' "${WORKDIR}/script.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_"* >/dev/null
          python3 -m py_compile "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_execute_v3.py" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_sanitize_v3.py"
          echo CMI_FLU_E05_V3_VALIDATE_PASS

      - name: Validate request and retired one-shot guards
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/requests/cmi-flu-strategy-e05-hai-donor-strain-003.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          expected={
            'request_id':'20260907-cmi-flu-strategy-e05-hai-donor-strain-003',
            'target':'renta0426/cmi-flu-e05-hai-donor-strain-20260907-003',
            'science_source_commit':'e02a601f38250480b526e548a48cf7f2526c00ca',
            'strategy_e05_blob_sha':'78cde9e3a6b6e3b332352218c4b4545f769aa6c4',
            'hai_transfer_blob_sha':'b671d8bf7f10bebbd65aca2a5bad42e267ee78d5',
            'locked_reference_transport':'runtime_embedded_base64_hash_verified_ast_scoped',
            'expected_kernel_version':1,'enable_internet':False,
            'competition_submission_attempted':False,'leaderboard_used_for_selection':False,'automatic_compute_retries':0,
          }
          for k,v in expected.items():
            if r.get(k)!=v:raise SystemExit(f'request mismatch:{k}')
          e=r.get('repair_evidence',{})
          if e.get('error_code')!='9e7109433066cad3a1c8' or e.get('decoded_contract')!="name 'json_safe' is not defined":raise SystemExit('002 repair evidence mismatch')
          PY
          for n in 163 164 174 175 176 177 178 179; do
            f=$(find "${WORKDIR}/bridge/.github/workflows" -maxdepth 1 -type f -name "${n}-*" | head -1)
            [[ -n "$f" ]]
            ! grep -Eq '^[[:space:]]+push:|^[[:space:]]+pull_request:|environment:|KAGGLE_API_TOKEN|group:[[:space:]]+kaggle-resource' "$f"
            grep -Eq 'Retired|RETIRED|retired' "$f"
          done

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  launch:
    name: Run one repaired private CPU E05 003 and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/180-cmi-flu-strategy-e05-hai-donor-strain-003.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefix=next(iter({m.name.split('/',1)[0] for m in files}))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):]); out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Fetch organizer HAI references and build exact repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_prepare_v3.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          echo "E05_V3_RUNTIME_SHA256=$(sha256sum "${WORKDIR}/script.py" | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run one approved E05 003 CPU kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "CMI_FLU_E05_V3_APPROVED_RUNTIME sha256=${E05_V3_RUNTIME_SHA256}"
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_execute_v3.py" --runtime "${WORKDIR}/script.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"

      - name: Validate aggregate-only result
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e05_sanitize_v3.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
