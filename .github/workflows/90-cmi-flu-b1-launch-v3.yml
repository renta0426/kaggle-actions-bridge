name: CMI-Flu B1 bridge-contained CPU launch v3

on:
  push:
    branches:
      - main
    paths:
      - requests/cmi-flu-b1-launch-v3.json

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b1-launch-v3.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-b1-anchor-20260902-003

jobs:
  validate:
    name: Validate immutable request 003 without secrets
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate owner boundary, request, and bridge-contained source blobs
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT PERSONAL_ACCESS_TOKEN SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AZURE_CLIENT_SECRET GOOGLE_APPLICATION_CREDENTIALS; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

          python3 - <<'PY'
          from __future__ import annotations
          import ast, hashlib, json, os, re, ssl, urllib.request
          from urllib.parse import urlparse

          repo = os.environ["EXPECTED_REPOSITORY"]
          sha = os.environ["EVENT_SHA_VALUE"]
          base = f"https://raw.githubusercontent.com/{repo}/{sha}/"
          def read(path: str, limit: int) -> bytes:
              url = base + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected source origin")
              with urllib.request.urlopen(url, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"source exceeds byte budget: {path}")
              return data

          request = json.loads(read(os.environ["REQUEST_PATH"], 32768))
          expected = {
              "schema_version": 3,
              "request_id": "20260902-cmi-flu-b1-003",
              "parent_request_id": "20260902-cmi-flu-b1-002",
              "competition": "cmi-flu-first-prediction-challenge",
              "operation": "kernel_run",
              "target": "renta0426/cmi-flu-b1-anchor-20260902-003",
              "kernel_files": {
                  "implementation": {"path": "scripts/cmi_flu_b1_kernel_impl.py", "blob_sha": "5ef01cf2a7c4a4140bce0210151d407972b9e7f3"},
                  "entrypoint": {"path": "scripts/cmi_flu_b1_kernel_v3.py", "blob_sha": "15394a4bc6fdc3e0750d1b496c50d1974efdbcad"},
              },
              "cmi_contract_commit": "6362cd8596cd996d13f66615eb1833ad26af1b39",
              "cmi_standalone_runner_blob": "7e28ed606f63883f9c2e230dfea1382389dce23b",
              "resource": {"accelerator": "cpu", "expected_runtime_minutes": 15, "hard_timeout_minutes": 30, "max_active_runs": 1},
              "api_budget": {"max_calls": 20, "poll_interval_seconds": 300, "max_pages": 2},
              "side_effects": ["create one private notebook version and start one CPU run"],
              "automatic_compute_retries": 0,
              "enable_internet": False,
              "rules_checked_at_utc": "2026-09-02T13:40:00Z",
          }
          if request != expected:
              raise SystemExit("B1 request 003 differs from fixed allowlist")
          for item in request["kernel_files"].values():
              data = read(item["path"], 100000)
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != item["blob_sha"]:
                  raise SystemExit(f"source blob mismatch: {item['path']}")
              ast.parse(data.decode("utf-8"), filename=item["path"])
          print("CMI-Flu B1 request 003 immutable validation: PASS")
          PY

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("Current Kaggle policy/API page reachability: PASS")
          PY

  launch:
    name: Live preflight and launch exactly one CPU run 003
    needs: validate
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/90-cmi-flu-b1-launch-v3.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "Protected CMI-Flu B1 request 003 boundary: PASS"

      - name: Prepare SHA-256 locked Kaggle CLI and source files
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib, re, ssl, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA_VALUE']}/"
          def read(path: str, limit: int) -> bytes:
              with urllib.request.urlopen(base + path, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"source exceeds byte budget: {path}")
              return data
          request = json.loads(read(os.environ["REQUEST_PATH"], 32768))
          for key, item in request["kernel_files"].items():
              data = read(item["path"], 100000)
              blob = hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()
              if blob != item["blob_sha"]:
                  raise SystemExit(f"source blob mismatch: {key}")
              (root / ("implementation.py" if key == "implementation" else "entrypoint.py")).write_bytes(data)
          lock = read(os.environ["LOCK_RELATIVE_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines) or not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version >/dev/null
          echo "Locked Kaggle CLI and request-003 source prepared: PASS"

      - name: Fetch live Competition rules and enforce run guardrails
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live Competition policy pages unavailable")
          plain = lambda value: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", value)).casefold()
          rules = plain(content["rules"])
          evaluation = plain(content["evaluation"])
          data_text = " ".join(plain(content[name]) for name in content if "data" in name)
          if not all(term in rules for term in ("maximum of five (5) submissions per day", "maximum team size is five (5)", "data security", "external data and tools")):
              raise SystemExit("live Competition rules differ from approved guardrails")
          if not all(term in evaluation for term in ("mean spearman correlation", "40 donors", "-99")):
              raise SystemExit("live Competition evaluation differs from approved guardrails")
          if "sample_submission_part1.csv" not in data_text or "investigations_260821.tsv" not in data_text:
              raise SystemExit("live Competition data description differs from expected inputs")
          target = os.environ["TARGET_KERNEL"]
          existing = api.kernels_list(user="renta0426", search="cmi-flu-b1-anchor-20260902-003", page_size=5) or []
          if target in {str(getattr(item, "ref", "")) for item in existing}:
              raise SystemExit("target kernel already exists; duplicate request refused")
          recent = api.kernels_list(user="renta0426", sort_by="dateRun", page_size=5) or []
          active = []
          for item in recent[:5]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              value = str(getattr(api.kernels_status(ref), "status", "")).upper()
              if "RUNNING" in value or "QUEUED" in value:
                  active.append(ref)
          if active:
              raise SystemExit(f"another Kaggle kernel is active; count={len(active)}")
          print(f"LIVE_RULE_PREFLIGHT PASS pages={len(content)} active=0 accelerator=cpu internet=false")
          PY

      - name: Materialize private no-internet CPU kernel and push exactly once
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"
          mkdir -p "${kernel_dir}"
          cp "${WORKDIR}/implementation.py" "${kernel_dir}/cmi_flu_b1_kernel_impl.py"
          cp "${WORKDIR}/entrypoint.py" "${kernel_dir}/cmi_flu_b1_kernel_v3.py"
          "${WORKDIR}/venv/bin/python" - "${kernel_dir}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = {
              "id": os.environ["TARGET_KERNEL"],
              "title": "CMI Flu B1 Anchor Bridge Contained 20260902 003",
              "code_file": "cmi_flu_b1_kernel_v3.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "",
              "dataset_sources": [],
              "competition_sources": [os.environ["TARGET_COMPETITION"]],
              "kernel_sources": [],
              "model_sources": [],
          }
          (root / "kernel-metadata.json").write_text(json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 1800 \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "ERROR: Kaggle kernel push/run failed; response suppressed"
            exit 1
          fi
          echo "KERNEL_LAUNCH PASS request_id=20260902-cmi-flu-b1-003 target=${TARGET_KERNEL} accelerator=cpu internet=false automatic_retries=0 timeout=1800"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "Runner-local CMI-Flu request-003 content removed"
