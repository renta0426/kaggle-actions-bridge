name: Private notebook direct session retrieval

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/52-private-notebook-direct-session.yml

permissions: {}

concurrency:
  group: private-notebook-direct-session
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_KERNEL_OWNER: renta0426
  TARGET_KERNEL_SLUG: rsna-knee-public0033-meniscus-10-percent-residual
  TARGET_SCRIPT_VERSION_ID: "346645650"

jobs:
  direct-session:
    name: Retrieve private notebook directly by scriptVersionId
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 8

    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY_VALUE: ${{ github.repository }}
          EVENT_REPOSITORY_ID_VALUE: ${{ github.event.repository.id }}
          EVENT_ACTOR_VALUE: ${{ github.actor }}
          EVENT_ACTOR_ID_VALUE: ${{ github.actor_id }}
          EVENT_SENDER_ID_VALUE: ${{ github.event.sender.id }}
          EVENT_NAME_VALUE: ${{ github.event_name }}
          EVENT_REF_VALUE: ${{ github.ref }}
          EVENT_SHA_VALUE: ${{ github.sha }}
          WORKFLOW_REF_VALUE: ${{ github.workflow_ref }}
          WORKFLOW_SHA_VALUE: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT_VALUE: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY_VALUE}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID_VALUE}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR_VALUE}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID_VALUE}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME_VALUE}" == "push" ]]
          [[ "${EVENT_REF_VALUE}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA_VALUE}" == "${EVENT_SHA_VALUE}" ]]
          [[ "${WORKFLOW_REF_VALUE}" == "renta0426/kaggle-actions-bridge/.github/workflows/52-private-notebook-direct-session.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT_VALUE}" == "github-hosted" ]]
          echo "Protected direct-session boundary: PASS"

      - name: Prepare hash-locked Kaggle CLI before secret exposure
        shell: bash
        env:
          EVENT_SHA_VALUE: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          lock_path="${workdir}/kaggle.lock"
          lock_url="https://raw.githubusercontent.com/${EXPECTED_REPOSITORY}/${EVENT_SHA_VALUE}/${LOCK_RELATIVE_PATH}"
          python3 - "${lock_url}" "${lock_path}" <<'PY'
          import re, ssl, sys, urllib.request
          from urllib.parse import urlparse
          url, output = sys.argv[1:]
          parsed = urlparse(url)
          if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
              raise SystemExit("unexpected lock origin")
          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )
          with opener.open(url, timeout=30) as response:
              data = response.read(65537)
          if len(data) > 65536:
              raise SystemExit("lock too large")
          text = data.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle pin missing")
          open(output, "w", encoding="utf-8").write(text)
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps \
            --only-binary=:all: --require-hashes \
            -r "${lock_path}" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          echo "Locked runtime prepared: PASS"

      - name: Test exact session endpoint and official private pulls
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import requests

          token = os.environ["KAGGLE_API_TOKEN"]
          target = int(os.environ["TARGET_SCRIPT_VERSION_ID"])
          owner = os.environ["TARGET_KERNEL_OWNER"]
          slug = os.environ["TARGET_KERNEL_SLUG"]
          workdir = pathlib.Path(os.environ["WORKDIR"])
          kaggle = str(workdir / "venv" / "bin" / "kaggle")

          if not token.startswith("KGAT_"):
              raise SystemExit("protected Kaggle token unavailable or malformed")

          exact_ok = False

          # Path A: use the URL's scriptVersionId directly as kernelSessionId.
          session = requests.Session()
          session.trust_env = False
          session.headers.update({
              "Authorization": f"Bearer {token}",
              "User-Agent": "kaggle-actions-bridge-direct-session/1.0",
          })
          seed = session.get("https://www.kaggle.com", timeout=30)
          seed.raise_for_status()
          xsrf = session.cookies.get("XSRF-TOKEN")
          if not xsrf:
              raise SystemExit("missing Kaggle XSRF cookie")

          endpoint = "https://www.kaggle.com/api/i/kernels.KernelsService/GetKernelSessionSource"
          response = session.post(
              endpoint,
              json={"kernelSessionId": target, "includeOutputIfAvailable": False},
              headers={"Content-Type": "application/json", "X-XSRF-TOKEN": xsrf},
              timeout=60,
              allow_redirects=False,
          )
          if response.status_code == 200 and 32 <= len(response.content) <= 100_000_000:
              source = response.content
              digest = hashlib.sha256(source).hexdigest()
              exact_dir = workdir / "exact-direct"
              exact_dir.mkdir(parents=True, exist_ok=True)
              (exact_dir / "source.bin").write_bytes(source)
              print(f"DIRECT_SCRIPT_VERSION_SOURCE PASS scriptVersionId={target} bytes={len(source)} sha256={digest}")
              exact_ok = True
          else:
              print(f"DIRECT_SCRIPT_VERSION_SOURCE FAIL http={response.status_code} bytes={len(response.content)}")

          # Path B: prove the official CLI can access the private notebook at all.
          latest_dir = workdir / "cli-latest"
          latest_dir.mkdir(parents=True, exist_ok=True)
          latest = subprocess.run(
              [kaggle, "kernels", "pull", f"{owner}/{slug}", "-p", str(latest_dir), "-m"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              env=os.environ.copy(),
              timeout=180,
              check=False,
          )
          latest_files = [p for p in latest_dir.rglob("*") if p.is_file()]
          print(f"OFFICIAL_CLI_PRIVATE_LATEST {'PASS' if latest.returncode == 0 and latest_files else 'FAIL'} rc={latest.returncode} files={len(latest_files)}")

          # Path C: test whether the CLI accepts scriptVersionId as its version segment.
          target_dir = workdir / "cli-target"
          target_dir.mkdir(parents=True, exist_ok=True)
          target_pull = subprocess.run(
              [kaggle, "kernels", "pull", f"{owner}/{slug}/{target}", "-p", str(target_dir), "-m"],
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              env=os.environ.copy(),
              timeout=180,
              check=False,
          )
          target_files = [p for p in target_dir.rglob("*") if p.is_file()]
          target_ok = target_pull.returncode == 0 and bool(target_files)
          print(f"OFFICIAL_CLI_SCRIPT_VERSION_SEGMENT {'PASS' if target_ok else 'FAIL'} rc={target_pull.returncode} files={len(target_files)}")
          exact_ok = exact_ok or target_ok

          if not exact_ok:
              raise SystemExit("Exact scriptVersionId retrieval failed through both direct session and official CLI version-segment paths")

          print("Private notebook content was not logged")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" ]] && [[ -d "${WORKDIR}" ]]; then
            rm -rf "${WORKDIR}"
          fi
          echo "Private notebook temporary content removed"
