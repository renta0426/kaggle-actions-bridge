name: CMI-Flu B2 broad request 004 CPU launch

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/114-cmi-flu-b2-broad-v4-launch.yml
      - requests/cmi-flu-b2-launch-v4.json
      - scripts/cmi_flu_b2_patch_v4.py
      - payloads/cmi-flu-b2-broad-004/**
      - requirements/kaggle-2.2.4.lock
  workflow_dispatch:

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false
  queue: max

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b2-launch-v4.json
  PATCHER_PATH: scripts/cmi_flu_b2_patch_v4.py
  PAYLOAD_DIR: payloads/cmi-flu-b2-broad-004
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-b2-taskwise-compact-broad-20260903-004
  TARGET_SLUG: cmi-flu-b2-taskwise-compact-broad-20260903-004
  EXPECTED_SOURCE_SHA256: 7894a9232e7372950f70a36d35de41bcc8bda90ec4d0320187e82c3b8c76f2db
  EXPECTED_SOURCE_SIZE: "93363"
  REQUESTED_ACCELERATOR: cpu

jobs:
  validate:
    name: Validate immutable broad B2 request 004
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Reconstruct and validate exact broad B2 script
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          trap 'rm -rf "${workdir}"' EXIT
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, os, pathlib, ssl, sys, urllib.request

          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"
          def read(path: str, limit: int) -> bytes:
              request = urllib.request.Request(base + path, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          source = b"".join(
              read(f"{os.environ['PAYLOAD_DIR']}/part-{index:02d}", 5000)
              for index in range(20)
          )
          digest = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["EXPECTED_SOURCE_SIZE"]) or digest != os.environ["EXPECTED_SOURCE_SHA256"]:
              raise SystemExit(f"B2 request 004 payload mismatch: bytes={len(source)} sha256={digest}")
          sums = read(f"{os.environ['PAYLOAD_DIR']}/SHA256SUMS", 512).decode("utf-8")
          size = read(f"{os.environ['PAYLOAD_DIR']}/SIZE", 64).decode("utf-8")
          if sums != f"{digest}  run_b2_kaggle_bundle.py\n" or size != f"{len(source)}\n":
              raise SystemExit("B2 request 004 transfer manifest mismatch")
          (root / "source.py").write_bytes(source)
          (root / "request.json").write_bytes(read(os.environ["REQUEST_PATH"], 32768))
          (root / "patch.py").write_bytes(read(os.environ["PATCHER_PATH"], 32768))
          PY
          python3 "${workdir}/patch.py" --source "${workdir}/source.py" --request "${workdir}/request.json" --output "${workdir}/script.py"
          python3 -W error::SyntaxWarning -m py_compile "${workdir}/patch.py" "${workdir}/script.py"
          python3 "${workdir}/script.py" --self-test
          echo 'CMI_FLU_B2_004_VALIDATE PASS'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

  launch:
    name: Admit or launch exactly one broad B2 request 004 CPU run
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" || "${EVENT_NAME}" == "workflow_dispatch" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/114-cmi-flu-b2-broad-v4-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_CMI_FLU_B2_004_BOUNDARY PASS"

      - name: Prepare locked Kaggle CLI and exact broad B2 script
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, os, pathlib, re, ssl, sys, urllib.request

          root = pathlib.Path(sys.argv[1])
          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"
          def read(path: str, limit: int) -> bytes:
              request = urllib.request.Request(base + path, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          source = b"".join(
              read(f"{os.environ['PAYLOAD_DIR']}/part-{index:02d}", 5000)
              for index in range(20)
          )
          digest = hashlib.sha256(source).hexdigest()
          if len(source) != int(os.environ["EXPECTED_SOURCE_SIZE"]) or digest != os.environ["EXPECTED_SOURCE_SHA256"]:
              raise SystemExit("B2 request 004 source reconstruction mismatch")
          (root / "source.py").write_bytes(source)
          (root / "request.json").write_bytes(read(os.environ["REQUEST_PATH"], 32768))
          (root / "patch.py").write_bytes(read(os.environ["PATCHER_PATH"], 32768))

          lock = read(os.environ["LOCK_PATH"], 65536).decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          PY

          python3 "${workdir}/patch.py" --source "${workdir}/source.py" --request "${workdir}/request.json" --output "${workdir}/script.py"
          python3 -W error::SyntaxWarning -m py_compile "${workdir}/script.py"
          python3 "${workdir}/script.py" --self-test
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Fetch live Competition rules and determine CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content or not any("data" in name for name in content):
              raise SystemExit("live Competition policy pages unavailable")
          plain = lambda value: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", value)).casefold()
          rules = plain(content["rules"])
          evaluation = plain(content["evaluation"])
          data_text = " ".join(plain(content[name]) for name in content if "data" in name)
          if not all(term in rules for term in (
              "maximum of five (5) submissions per day",
              "maximum team size is five (5)",
              "data security",
              "external data and tools",
          )):
              raise SystemExit("live Competition rules differ from approved guardrails")
          if not all(term in evaluation for term in ("mean spearman correlation", "40 donors", "-99")):
              raise SystemExit("live Competition evaluation differs from approved guardrails")
          if "sample_submission_part1.csv" not in data_text or "investigations_260821.tsv" not in data_text:
              raise SystemExit("live Competition data description differs from expected inputs")

          target = os.environ["TARGET_KERNEL"]
          existing = api.kernels_list(user="renta0426", search=os.environ["TARGET_SLUG"], page_size=5) or []
          if target in {str(getattr(item, "ref", "")) for item in existing}:
              raise SystemExit("target kernel already exists; duplicate refused")

          active_refs = []
          recent = api.kernels_list(user="renta0426", sort_by="dateRun", page_size=15) or []
          for item in recent[:15]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              try:
                  status = str(getattr(api.kernels_status(ref), "status", "")).upper()
              except Exception:
                  continue
              if any(token in status for token in ("RUNNING", "QUEUED", "PENDING")):
                  active_refs.append(ref)

          active = {"cpu": [], "gpu": [], "tpu": [], "unknown": []}
          if len(active_refs) > 5:
              active["unknown"].extend(active_refs)
          else:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      resource = "unknown"
                      try:
                          owner, slug = ref.split("/", 1)
                          request = ApiGetKernelRequest()
                          request.user_name = owner
                          request.kernel_slug = slug
                          metadata = client.kernels.kernels_api_client.get_kernel(request).metadata
                          if bool(getattr(metadata, "enable_tpu", False)):
                              resource = "tpu"
                          elif bool(getattr(metadata, "enable_gpu", False)):
                              resource = "gpu"
                          else:
                              resource = "cpu"
                      except Exception:
                          resource = "unknown"
                      active[resource].append(ref)

          can_launch = len(active["cpu"]) + len(active["unknown"]) < 1
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"can_launch={'true' if can_launch else 'false'}\n")
          counts = {key: len(value) for key, value in active.items()}
          if can_launch:
              print(
                  "LIVE_RULE_PREFLIGHT PASS "
                  f"pages={len(content)} requested=cpu active_cpu={counts['cpu']} "
                  f"active_gpu={counts['gpu']} active_tpu={counts['tpu']} "
                  f"active_unknown={counts['unknown']} internet=false"
              )
          else:
              print(
                  "CMI_FLU_B2_004_DEFERRED "
                  f"active_cpu={counts['cpu']} active_unknown={counts['unknown']} "
                  f"nonblocking_gpu={counts['gpu']} nonblocking_tpu={counts['tpu']} "
                  "side_effect=false request_unexecuted=true"
              )
          PY

      - name: Record deferred admission
        if: steps.admission.outputs.can_launch != 'true'
        shell: bash
        run: echo 'B2 request 004 deferred before Kaggle write; manually re-dispatch the same immutable workflow after blocking CPU/unknown work ends.'

      - name: Materialize one Python file and push one private CPU run
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"
          mkdir -p "${kernel_dir}"
          cp "${WORKDIR}/script.py" "${kernel_dir}/script.py"
          "${WORKDIR}/venv/bin/python" - "${kernel_dir}" <<'PY'
          import json, os, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          metadata = {
              "id": os.environ["TARGET_KERNEL"],
              "title": "CMI Flu B2 Taskwise Compact Broad 20260903 004",
              "code_file": "script.py",
              "language": "python",
              "kernel_type": "script",
              "is_private": True,
              "enable_gpu": False,
              "enable_tpu": False,
              "enable_internet": False,
              "machine_shape": "",
              "dataset_sources": [],
              "competition_sources": [os.environ["TARGET_COMPETITION"]],
              "kernel_sources": [],
              "model_sources": [],
          }
          (root / "kernel-metadata.json").write_text(
              json.dumps(metadata, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          [[ "$(find "${kernel_dir}" -maxdepth 1 -type f -name '*.py' | wc -l)" -eq 1 ]]
          [[ -f "${kernel_dir}/script.py" && ! -L "${kernel_dir}/script.py" ]]
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 14400 \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo 'ERROR: Kaggle B2 request 004 kernel push/run failed; response suppressed and no retry attempted'
            exit 1
          fi
          echo "KERNEL_LAUNCH PASS request_id=20260903-cmi-flu-b2-004 target=${TARGET_KERNEL} accelerator=cpu internet=false automatic_compute_retries=0 timeout=14400"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'Runner-local CMI-Flu B2 request 004 content removed'
