name: Retired CMI-Flu E02 launch 001 - use current recovery

# Version 1 was already pushed by run 34079658937. No automatic push trigger
# remains at this path. Historical code is retained in commit 2010e1cec.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Refuse a duplicate compute request
        run: |
          echo 'E02_LAUNCH_001_RETIRED: version 1 may already contain completed science outputs.'
          echo 'Use workflow 175 current recovery; do not rerun the historical compute workflow.'
          exit 1
