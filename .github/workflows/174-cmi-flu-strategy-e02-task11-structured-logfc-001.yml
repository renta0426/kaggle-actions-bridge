name: CMI-Flu strategy E02 Task1.1 structured logFC CPU 001

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/174-cmi-flu-strategy-e02-task11-structured-logfc-001.yml
      - requests/cmi-flu-strategy-e02-task11-structured-logfc-001.json
      - scripts/cmi_flu_strategy_e02_prepare.py
      - scripts/cmi_flu_strategy_e02_execute.py
      - scripts/cmi_flu_strategy_e02_sanitize.py
      - payloads/cmi-flu-strategy-e02-task11-structured-logfc-001/**
  pull_request:
    paths:
      - .github/workflows/174-cmi-flu-strategy-e02-task11-structured-logfc-001.yml
      - requests/cmi-flu-strategy-e02-task11-structured-logfc-001.json
      - scripts/cmi_flu_strategy_e02_prepare.py
      - scripts/cmi_flu_strategy_e02_execute.py
      - scripts/cmi_flu_strategy_e02_sanitize.py
      - payloads/cmi-flu-strategy-e02-task11-structured-logfc-001/**

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-e02-task11-structured-logfc-20260907-001
  TARGET_SLUG: cmi-flu-e02-task11-structured-logfc-20260907-001
  EXPECTED_KERNEL_VERSION: "1"
  REQUEST_ID: 20260907-cmi-flu-strategy-e02-task11-structured-logfc-001
  SCIENCE_COMMIT: 0d399f89f35145e99fafd10d3061d9295cd749bb
  E02_BLOB: e6aaba7450a527de1e75ad6e7c0d9ef7e0031d7e
  E02_V2_BLOB: afdfe373a64444ef10dffcc6f7d9d65a8dd7b27c
  CONFIG_BLOB: 170d3211e2795c0730e481056c7bb068accf97c9
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate E02 runtime without secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "VALIDATE_WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response: data=response.read(25_000_001)
          if len(data)>25_000_000: raise SystemExit("bridge archive exceeds byte budget")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as tf:
              files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout invalid")
              prefix=next(iter(prefixes))+'/'
              for member in files:
                  if not member.name.startswith(prefix): raise SystemExit("bridge archive path invalid")
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive path")
                  payload=tf.extractfile(member).read(); out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(payload)
          PY

      - name: Build exact E02 runtime and validate public contract
        shell: bash
        run: |
          set -euo pipefail
          python3 "${VALIDATE_WORKDIR}/bridge/scripts/cmi_flu_strategy_e02_prepare.py" --repository-root "${VALIDATE_WORKDIR}/bridge" --output "${VALIDATE_WORKDIR}/script.py"
          python3 "${VALIDATE_WORKDIR}/script.py" --self-test
          python3 -m py_compile "${VALIDATE_WORKDIR}/bridge/scripts/cmi_flu_strategy_e02_prepare.py" "${VALIDATE_WORKDIR}/bridge/scripts/cmi_flu_strategy_e02_execute.py" "${VALIDATE_WORKDIR}/bridge/scripts/cmi_flu_strategy_e02_sanitize.py" "${VALIDATE_WORKDIR}/script.py"
          grep -F "SCIENCE_COMMIT = \"${SCIENCE_COMMIT}\"" "${VALIDATE_WORKDIR}/script.py" >/dev/null
          grep -F "E02_BLOB = \"${E02_BLOB}\"" "${VALIDATE_WORKDIR}/script.py" >/dev/null
          grep -F "E02_V2_BLOB = \"${E02_V2_BLOB}\"" "${VALIDATE_WORKDIR}/script.py" >/dev/null
          grep -F '_e02_evaluation.run_compact_task = _e02_compact_compat' "${VALIDATE_WORKDIR}/script.py" >/dev/null
          ! grep -F 'kaggle competitions submit' "${VALIDATE_WORKDIR}/script.py" >/dev/null
          ! grep -F 'competition_submit' "${VALIDATE_WORKDIR}/script.py" >/dev/null
          echo 'CMI_FLU_E02_VALIDATE PASS'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl,urllib.request
          for url in ("https://www.kaggle.com/terms","https://www.kaggle.com/aup","https://www.kaggle.com/community-guidelines","https://www.kaggle.com/docs/api"):
              req=urllib.request.Request(url,headers={"User-Agent":"kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as response:
                  if response.status!=200 or not response.read(65536): raise SystemExit("official Kaggle policy page unavailable")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          if [[ -n "${VALIDATE_WORKDIR-}" && -d "${VALIDATE_WORKDIR}" ]]; then rm -rf "${VALIDATE_WORKDIR}"; fi

  launch:
    name: Run one private CPU E02 and read aggregate-safe result
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/174-cmi-flu-strategy-e02-task11-structured-logfc-001.yml@refs/heads/main" ]]
          echo 'PROTECTED_CMI_FLU_E02_BOUNDARY PASS'

      - name: Materialize approved bridge commit and E02 runtime
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response: data=response.read(25_000_001)
          if len(data)>25_000_000: raise SystemExit("bridge archive exceeds byte budget")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as tf:
              files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout invalid")
              prefix=next(iter(prefixes))+'/'
              for member in files:
                  rel=pathlib.PurePosixPath(member.name[len(prefix):])
                  if not member.name.startswith(prefix) or not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  payload=tf.extractfile(member).read(); out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(payload)
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e02_prepare.py" --repository-root "${workdir}/bridge" --output "${workdir}/script.py"
          python3 "${workdir}/script.py" --self-test

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/${LOCK_PATH}" <<'PY'
          import pathlib,re,sys
          lock=pathlib.Path(sys.argv[1]).read_text(encoding='utf-8'); pattern=re.compile(r'^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$')
          lines=[x.strip() for x in lock.splitlines() if x.strip() and not x.lstrip().startswith('#')]
          if len(lines)!=33 or not all(pattern.fullmatch(x) for x in lines) or not any(x.startswith('kaggle==2.2.4 ') for x in lines): raise SystemExit('Kaggle CLI lock validation failed')
          PY
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run exactly one approved E02 CPU notebook and read aggregate outputs
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e02_execute.py" --runtime "${WORKDIR}/script.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"

      - name: Validate and render aggregate-only E02 result
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e02_sanitize.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
