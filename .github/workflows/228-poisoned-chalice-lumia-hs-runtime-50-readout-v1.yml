name: Poisoned Chalice LUMIA runtime 50 readout v1

on:
  push:
    branches: [main]
    paths:
      - requests/poisoned-chalice-lumia-hs-runtime-50-readout-v1.json
      - scripts/poisoned_chalice_lumia_runtime_readout_v1.py
      - .github/workflows/228-poisoned-chalice-lumia-hs-runtime-50-readout-v1.yml
  pull_request:
    branches: [main]
    paths:
      - requests/poisoned-chalice-lumia-hs-runtime-50-readout-v1.json
      - scripts/poisoned_chalice_lumia_runtime_readout_v1.py
      - .github/workflows/228-poisoned-chalice-lumia-hs-runtime-50-readout-v1.yml

permissions: {}

concurrency:
  group: kaggle-readonly-poisoned-chalice-lumia-runtime-50-readout-v1
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-lumia-hs-runtime-50-readout-v1.json
  SCRIPT_PATH: scripts/poisoned_chalice_lumia_runtime_readout_v1.py
  SCRIPT_BLOB_SHA: 1ac9fac42ba589aac26bb96917ba91b27b24a7ea
  POLICY_PATH: scripts/kaggle_policy_preflight.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_OWNER: renta0426
  TARGET_SLUG: poisoned-chalice-lumia-hs-runtime-50-v1
  TARGET_KERNEL: renta0426/poisoned-chalice-lumia-hs-runtime-50-v1
  TARGET_COMPETITION: poisoned-chalice-icse27

jobs:
  validate:
    name: Validate secret-free LUMIA runtime readout
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Validate immutable request and aggregate-only evaluator
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"; trap 'rm -rf "${workdir}"' EXIT
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${source_sha}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "${workdir}/repo" hash-object "${SCRIPT_PATH}")" == "${SCRIPT_BLOB_SHA}" ]]
          python3 -W error::SyntaxWarning -m py_compile "${workdir}/repo/${SCRIPT_PATH}"
          python3 "${workdir}/repo/${POLICY_PATH}"
          python3 "${workdir}/repo/${SCRIPT_PATH}" --static --request "${workdir}/repo/${REQUEST_PATH}"
          echo 'LUMIA_RUNTIME_READOUT_VALIDATE PASS kaggle_calls=0 side_effects=0'

  readout:
    name: Read exact LUMIA runtime output and evaluate 105-minute gate
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/228-poisoned-chalice-lumia-hs-runtime-50-readout-v1.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          git -c credential.helper= init -q "${workdir}/repo"
          git -C "${workdir}/repo" remote add origin https://github.com/renta0426/kaggle-actions-bridge.git
          git -C "${workdir}/repo" -c credential.helper= fetch -q --depth=1 origin "${EVENT_SHA}"
          git -C "${workdir}/repo" checkout -q --detach FETCH_HEAD
          [[ "$(git -C "${workdir}/repo" hash-object "${SCRIPT_PATH}")" == "${SCRIPT_BLOB_SHA}" ]]
          python3 "${workdir}/repo/${POLICY_PATH}"
          echo 'LUMIA_RUNTIME_READOUT_BOUNDARY PASS side_effects=0 aggregate_only=true'

      - name: Prepare locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/kaggle-venv"
          "${WORKDIR}/kaggle-venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/repo/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/kaggle-venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/kaggle-venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo 'LUMIA_RUNTIME_READOUT_CLIENT PASS kaggle_cli=2.2.4'

      - name: Read exact current version 1 outputs
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          mkdir -p "${WORKDIR}/readout"
          "${WORKDIR}/kaggle-venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, pathlib, re
          from urllib.parse import urlparse
          import requests
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest, ApiListKernelSessionOutputRequest

          api = KaggleApi(); api.authenticate()
          target = os.environ['TARGET_KERNEL']
          pages = api.competition_list_pages(os.environ['TARGET_COMPETITION']) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, 'to_dict') else dict(page)
              name = str(data.get('name') or '').strip().lower()
              if name:
                  content[name] = str(data.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in name for name in content):
              raise SystemExit('live competition pages unavailable')
          plain = re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', content['evaluation'].replace(r'\%', '%'))).casefold()
          if not all(token in plain for token in ('auc', 'novelty', '1%', 'false-positive')):
              raise SystemExit('evaluation contract changed')

          discovered = api.kernels_list(user=os.environ['TARGET_OWNER'], search=os.environ['TARGET_SLUG'], page_size=10) or []
          refs = [str(getattr(item, 'ref', '') or '') for item in discovered]
          if refs.count(target) != 1:
              raise SystemExit(f'exact LUMIA kernel discoverability mismatch count={refs.count(target)}')
          status = str(getattr(api.kernels_status(target), 'status', '') or '').upper()
          if any(token in status for token in ('RUNNING', 'QUEUED', 'PENDING')):
              raise SystemExit(f'LUMIA kernel is not terminal: {status}')
          if 'COMPLETE' not in status:
              raise SystemExit(f'LUMIA kernel did not complete successfully: {status}')

          with api.build_kaggle_client() as client:
              meta_req = ApiGetKernelRequest(); meta_req.user_name = os.environ['TARGET_OWNER']; meta_req.kernel_slug = os.environ['TARGET_SLUG']
              metadata = client.kernels.kernels_api_client.get_kernel(meta_req).metadata
              if str(metadata.ref) != target or not bool(metadata.is_private):
                  raise SystemExit('LUMIA private kernel identity mismatch')
              current = int(getattr(metadata, 'current_version_number', 0) or 0)
              if current != 1:
                  raise SystemExit(f'LUMIA current version mismatch: {current}')
              out_req = ApiListKernelSessionOutputRequest(); out_req.user_name = os.environ['TARGET_OWNER']; out_req.kernel_slug = os.environ['TARGET_SLUG']; out_req.version_label = '1'; out_req.page_size = 100
              output = client.kernels.kernels_api_client.list_kernel_session_output(out_req)

          files = list(getattr(output, 'files', None) or [])
          allow = {'runtime.json': 262144, 'run_manifest.json': 131072}
          found = {name: [] for name in allow}
          for item in files:
              raw = str(getattr(item, 'file_name', '') or '').replace('\\', '/')
              name = pathlib.PurePosixPath(raw).name
              if name in found:
                  found[name].append((raw, str(getattr(item, 'url', '') or '')))
          selected = {}
          for name, candidates in found.items():
              preferred = [x for x in candidates if x[0].endswith(f'/lumia_hidden_state_runtime_pilot_50/{name}')]
              pool = preferred or candidates
              if len(pool) != 1:
                  raise SystemExit(f'allowlisted output missing/ambiguous: {name} candidates={len(candidates)}')
              selected[name] = pool[0][1]

          session = requests.Session(); session.trust_env = False
          root = pathlib.Path(os.environ['WORKDIR']) / 'readout'
          for name, url in selected.items():
              parsed = urlparse(url); host = (parsed.hostname or '').casefold()
              host_ok = host == 'storage.googleapis.com' or host.endswith('.storage.googleapis.com') or host.endswith('.googleusercontent.com') or host.endswith('.kaggleusercontent.com')
              if parsed.scheme != 'https' or not host_ok:
                  raise SystemExit(f'unexpected signed output host for {name}')
              response = session.get(url, timeout=90, allow_redirects=False)
              if response.status_code != 200 or not response.content or len(response.content) > allow[name]:
                  raise SystemExit(f'output download failed for {name}: status={response.status_code} bytes={len(response.content)}')
              (root / name).write_bytes(response.content)
          print(f'LUMIA_RUNTIME_READOUT_OUTPUT PASS status={status} version=1 files=2')
          PY
          unset KAGGLE_API_TOKEN

      - name: Evaluate frozen runtime gate
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/repo/${SCRIPT_PATH}" \
            --request "${WORKDIR}/repo/${REQUEST_PATH}" \
            --runtime "${WORKDIR}/readout/runtime.json" \
            --manifest "${WORKDIR}/readout/run_manifest.json"

      - name: Cleanup downloaded private outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'LUMIA_RUNTIME_READOUT_CLEANUP PASS retention_days=0'
