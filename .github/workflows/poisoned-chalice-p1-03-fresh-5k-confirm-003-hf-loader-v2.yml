name: Poisoned Chalice P1-03 fresh 5k confirm-003 HF loader repair v2

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2.yml
      - requests/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2.json
      - payloads/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2/**
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2.yml
      - requests/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2.json
      - payloads/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2/**

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET: renta0426/poisoned-chalice-p1-03-fresh-5k-confirm-003
  TITLE: Poisoned Chalice P1-03 Fresh 5K Confirm 003
  HISTORICAL_CONFIRM_COMMIT: 708ed2026c18556c745e020e2b59046c2c46e764
  V1_NOTEBOOK_SHA256: 4236585b0dbc1ea54309a91cbc72bfd226467b2209c34cb428cfdd7328c09daa
  V2_NOTEBOOK_SHA256: b639ddb944d0b88ded392c053c183725aaaec09127bb15d1264e3d09ef83d43e

jobs:
  validate:
    name: Validate exact HF-loader repair without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce secret-free repair boundary and fetch exact bundle
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable:$name"; exit 1; }
          done
          source_sha="$EVENT_SHA"; [[ "$EVENT_NAME" != "pull_request" ]] || source_sha="$PR_HEAD_SHA"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=$workdir" >> "$GITHUB_ENV"; echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          mkdir -p "$workdir/payload"
          python3 - "$source_sha" "$HISTORICAL_CONFIRM_COMMIT" "$workdir" <<'PY'
          import pathlib,ssl,sys,urllib.request
          current_sha,historical_sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value)
          items=[
            (current_sha,'requests/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2.json',root/'request.json'),
            (current_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2/materialize_v2.py',root/'materialize_v2.py'),
            (historical_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirmation-v1/materialize.py',root/'payload/materialize_v1.py'),
            (historical_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirmation-v1/fresh_audit.py',root/'payload/fresh_audit.py'),
            (historical_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirmation-v1/builder.py',root/'payload/builder.py'),
          ]
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for sha,path,out in items:
              req=urllib.request.Request(f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}',headers={'User-Agent':'p1-03-fresh-confirm-hf-v2-pr/1'})
              with opener.open(req,timeout=30) as response:data=response.read(512001)
              if not data or len(data)>512000:raise SystemExit(f'source byte budget failed:{path}')
              out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
              if path.endswith('.py'):compile(data,path,'exec')
          PY

      - name: Validate repair provenance and unchanged scientific contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$WORKDIR/request.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['request_id']=='20260911-poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2'
          assert r['parent_request_id']=='20260911-poisoned-chalice-p1-03-fresh-5k-confirmation-003'
          assert r['operation']=='save_kernel_once'
          assert r['target']=='renta0426/poisoned-chalice-p1-03-fresh-5k-confirm-003'
          assert r['title']=='Poisoned Chalice P1-03 Fresh 5K Confirm 003'
          assert r['expected_current_version_before_write']==1 and r['expected_version_after_write']==2
          assert r['science_commit']=='99831efad540c49737dc02cce3d5d76bbacbf687'
          assert r['science_files']['scripts/build_p1_03_fresh_5k_confirmation_evaluation_notebook_v2.py']=='c487708510e97f652687859a26522d0c18799ca5'
          assert r['science_files']['docs/P1_03_FRESH_5K_CONFIRMATION_HF_LOADER_REPAIR_20260911.md']=='46b5ae6e26b6e8f8617c742f440b24b5b740e5ce'
          assert r['frozen_v1_notebook_sha256']=='4236585b0dbc1ea54309a91cbc72bfd226467b2209c34cb428cfdd7328c09daa'
          assert r['repaired_v2_notebook_sha256']=='b639ddb944d0b88ded392c053c183725aaaec09127bb15d1264e3d09ef83d43e'
          assert r['notebook_serializer']=='nbformat==5.11.1'
          assert r['historical_payload_bridge_commit']=='708ed2026c18556c745e020e2b59046c2c46e764'
          assert r['inputs']['fresh_hidden_cache']['version']==1 and r['inputs']['stage1_features']['version']==1
          assert r['resource']['accelerator']=='gpu' and r['resource']['machine_shape']=='NvidiaTeslaT4'
          assert r['resource']['max_active_runs']==1 and r['resource']['min_remaining_quota_hours']==3.0
          assert r['automatic_compute_retries']==0 and r['competition_submission'] is False
          assert r['scientific_contract']['fusion_hidden_rank_weights']==[0.75,0.5]
          assert r['scientific_contract']['fusion_formula_count']==2
          assert r['scientific_contract']['portable_primary']=='mean pooling 96-feature scalar'
          repair=r['runtime_repair']
          assert repair['failed_target_version']==1 and repair['required_failed_status_before_write']=='ERROR'
          assert repair['previous_launch_workflow_run']==34552122021 and repair['previous_launch_job']==103117069577
          assert repair['previous_write_observed'] is True and repair['previous_compute_started'] is True
          assert repair['previous_result_valid'] is False and repair['fresh_membership_metrics_opened'] is False
          assert repair['uploaded_log_sha256']=='a4f0a3c0207cefa0389c8d494b2d28360c758fc0c6e42e060e91732b0d094436'
          assert repair['uploaded_log_bytes']==25369
          assert repair['failure_class']=='ValueError' and repair['failed_library']=='datasets==4.6.1'
          assert repair['science_formulas_changed'] is False and repair['cohort_changed'] is False and repair['labels_changed'] is False
          assert repair['clean_room_changed'] is False and repair['automatic_retry'] is False
          print('P1_03_FRESH_CONFIRM_HF_V2_REQUEST PASS write_calls=0 formulas_changed=0')
          PY

      - name: Materialize byte-exact science v2 Notebook
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORKDIR/serializer-venv"
          "$WORKDIR/serializer-venv/bin/python" -m pip install --disable-pip-version-check --no-input nbformat==5.11.1 >/dev/null
          "$WORKDIR/serializer-venv/bin/python" "$WORKDIR/materialize_v2.py" --payload-dir "$WORKDIR/payload" --kernel-dir "$WORKDIR/kernel"
          python3 - "$WORKDIR/request.json" "$WORKDIR/kernel" <<'PY'
          import hashlib,json,pathlib,re,sys
          r=json.load(open(sys.argv[1])); root=pathlib.Path(sys.argv[2]); mp=root/'kernel-metadata.json'; meta=json.loads(mp.read_text())
          nb=root/meta['code_file']; sha=hashlib.sha256(nb.read_bytes()).hexdigest(); assert sha==r['repaired_v2_notebook_sha256']
          assert meta['id']=='renta0426/poisoned-chalice-p1-03-fresh-5k-confirmation-v1'
          assert meta['title']=='Poisoned Chalice P1-03 Fresh 5K Confirmation V1'
          before=dict(meta); meta['id']=r['target']; meta['title']=r['title']; changed={k for k in before if before[k]!=meta[k]}; assert changed=={'id','title'}
          slug=re.sub(r'-+','-',re.sub(r'[^a-z0-9]+','-',r['title'].lower())).strip('-'); assert slug==r['target'].split('/',1)[1]
          mp.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          assert hashlib.sha256(nb.read_bytes()).hexdigest()==sha
          assert meta['dataset_sources']==['renta0426/stage1-raw-fim-submission-v1-output']
          assert meta['kernel_sources']==['renta0426/poisoned-chalice-lumia-fresh-cache-5000-v1']
          print('P1_03_FRESH_CONFIRM_HF_V2_MATERIALIZE PASS notebook_sha256='+sha+' transport_delta=id,title write_calls=0')
          PY

      - name: Cleanup validation material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"

  launch:
    name: Launch approved HF-loader repair as version 2 exactly once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce protected boundary and fetch exact repair bundle
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$EVENT_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2.yml@refs/heads/main" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=$workdir" >> "$GITHUB_ENV"; mkdir -p "$workdir/payload"
          python3 - "$EVENT_SHA" "$HISTORICAL_CONFIRM_COMMIT" "$workdir" <<'PY'
          import pathlib,ssl,sys,urllib.request
          current_sha,historical_sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value)
          items=[
            (current_sha,'requests/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2.json',root/'request.json'),
            (current_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirm-003-hf-loader-v2/materialize_v2.py',root/'materialize_v2.py'),
            (historical_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirmation-v1/materialize.py',root/'payload/materialize_v1.py'),
            (historical_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirmation-v1/fresh_audit.py',root/'payload/fresh_audit.py'),
            (historical_sha,'payloads/poisoned-chalice-p1-03-fresh-5k-confirmation-v1/builder.py',root/'payload/builder.py'),
            (current_sha,'scripts/kaggle_exact_identity.py',root/'kaggle_exact_identity.py'),
            (current_sha,'requirements/kaggle-2.2.4.lock',root/'kaggle-2.2.4.lock'),
          ]
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for sha,path,out in items:
              req=urllib.request.Request(f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}',headers={'User-Agent':'p1-03-fresh-confirm-hf-v2-launch/1'})
              with opener.open(req,timeout=30) as response:data=response.read(512001)
              if not data or len(data)>512000:raise SystemExit(f'source byte budget failed:{path}')
              out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(data)
              if path.endswith('.py'):compile(data,path,'exec')
          PY
          echo "P1_03_FRESH_CONFIRM_HF_V2_BOUNDARY PASS retries=0 submissions=0 expected_before=1 expected_after=2"

      - name: Reconstruct exact repaired Notebook and locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$WORKDIR/serializer-venv"
          "$WORKDIR/serializer-venv/bin/python" -m pip install --disable-pip-version-check --no-input nbformat==5.11.1 >/dev/null
          "$WORKDIR/serializer-venv/bin/python" "$WORKDIR/materialize_v2.py" --payload-dir "$WORKDIR/payload" --kernel-dir "$WORKDIR/kernel"
          python3 - "$WORKDIR/request.json" "$WORKDIR/kernel" <<'PY'
          import hashlib,json,pathlib,re,sys
          r=json.load(open(sys.argv[1])); root=pathlib.Path(sys.argv[2]); mp=root/'kernel-metadata.json'; meta=json.loads(mp.read_text()); nb=root/meta['code_file']
          sha=hashlib.sha256(nb.read_bytes()).hexdigest(); assert sha==r['repaired_v2_notebook_sha256']
          before=dict(meta); meta['id']=r['target']; meta['title']=r['title']; assert {k for k in before if before[k]!=meta[k]}=={'id','title'}
          slug=re.sub(r'-+','-',re.sub(r'[^a-z0-9]+','-',r['title'].lower())).strip('-'); assert slug==r['target'].split('/',1)[1]
          mp.write_text(json.dumps(meta,indent=2,sort_keys=True)+'\n',encoding='utf-8'); assert hashlib.sha256(nb.read_bytes()).hexdigest()==sha
          print('P1_03_FRESH_CONFIRM_HF_V2_KERNEL PASS notebook_sha256='+sha+' science_formula_changes=0')
          PY
          python3 -m venv "$WORKDIR/venv"
          "$WORKDIR/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "$WORKDIR/kaggle-2.2.4.lock" >/dev/null
          "$WORKDIR/venv/bin/python" -m pip check >/dev/null
          "$WORKDIR/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Live exact failed-v1 input quota and GPU-admission preflight
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/request.json" <<'PY'
          import hashlib,json,re,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,status_name,verify_current
          r=json.load(open(sys.argv[1])); api=KaggleApi(); api.authenticate(); target=r['target']; owner,_=target.split('/',1)
          pages=api.competition_list_pages(r['competition']) or []; content={}
          for page in pages:
              d=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(d.get('name') or '').strip().lower()
              if name:content[name]=str(d.get('content') or '')
          if 'evaluation' not in content:raise SystemExit('live evaluation page unavailable')
          plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',content['evaluation'].replace(r'\%','%'))).casefold()
          if not all(x in plain for x in ('auc','novelty','1%','false-positive')):raise SystemExit('live evaluation contract changed')
          src=r['inputs']['fresh_hidden_cache']
          if verify_current(api,src['ref'],1,allow_failed=False,cpu=False)!='COMPLETE':raise SystemExit('fresh cache input not COMPLETE')
          sm=exact_metadata(api,src['ref'])
          if int(getattr(sm,'current_version_number',0))!=1 or getattr(sm,'enable_gpu',None) is not True or getattr(sm,'enable_tpu',None) is not False:raise SystemExit('fresh cache source identity changed')
          ds=r['inputs']['stage1_features']; p=json.loads(api.dataset_status(ds['ref'],format='json(current_version_number)')); dv=p.get('current_version_number')
          if dv is None or int(dv)!=1:raise SystemExit(f'Stage1 dataset version mismatch:{dv!r}')
          meta=exact_metadata(api,target); state=status_name(getattr(api.kernels_status(target),'status',None))
          if getattr(meta,'ref',None)!=target or int(getattr(meta,'current_version_number',0))!=1:raise SystemExit('failed target/version identity changed')
          if state!='ERROR':raise SystemExit(f'failed target is not ERROR:{state}')
          if getattr(meta,'is_private',None) is not True or getattr(meta,'enable_gpu',None) is not True or getattr(meta,'enable_tpu',None) is not False or getattr(meta,'enable_internet',None) is not True:raise SystemExit('failed target metadata changed')
          quota=api.quota_view(); gpu=getattr(quota,'gpu_quota',None)
          if gpu is None:raise SystemExit('GPU quota unavailable')
          remaining=(gpu.total_time_allowed-gpu.time_used).total_seconds()/3600.0
          if remaining<float(r['resource']['min_remaining_quota_hours']):raise SystemExit(f'GPU quota refused:{remaining:.3f}h')
          recent=(api.kernels_list(user=owner,sort_by='dateRun',page_size=25) or [])[:25]; gpu_active=0; unknown=0; active_hashes=[]; active_total=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:ks=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if ks not in ACTIVE:continue
              active_total+=1
              try:
                  m=exact_metadata(api,ref); eg=getattr(m,'enable_gpu',None); et=getattr(m,'enable_tpu',None)
                  if type(eg) is not bool or type(et) is not bool:raise RuntimeError('accelerator unknown')
              except Exception:unknown+=1;continue
              if eg is True and et is False:
                  gpu_active+=1; active_hashes.append(hashlib.sha256(ref.encode()).hexdigest()[:16])
          if unknown:raise SystemExit(f'GPU admission unknown={unknown}')
          if gpu_active>=int(r['resource']['max_active_runs']):raise SystemExit(f'GPU concurrency refused:{gpu_active} active_ref_sha16={",".join(sorted(active_hashes))}')
          print(f'P1_03_FRESH_CONFIRM_HF_V2_PREFLIGHT PASS current_version=1 state=ERROR gpu_active={gpu_active} active_total={active_total} quota_remaining_h={remaining:.3f} stage1_version=1 fresh_cache_version=1 write_calls=0')
          PY

      - name: Immediate recheck and perform exactly one SaveKernel version-2 call
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/request.json" "$WORKDIR/kernel" <<'PY'
          import hashlib,json,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,exact_metadata_eventually,safe_exception,status_name
          r=json.load(open(sys.argv[1])); target=r['target']; owner,_=target.split('/',1); api=KaggleApi(); api.authenticate()
          meta=exact_metadata(api,target); state=status_name(getattr(api.kernels_status(target),'status',None))
          if int(getattr(meta,'current_version_number',0))!=1 or state!='ERROR':raise SystemExit(f'pre-write failed-v1 contract changed:version={getattr(meta,"current_version_number",None)} state={state}')
          quota=api.quota_view(); gpu=getattr(quota,'gpu_quota',None)
          if gpu is None:raise SystemExit('pre-write GPU quota unavailable')
          remaining=(gpu.total_time_allowed-gpu.time_used).total_seconds()/3600.0
          if remaining<float(r['resource']['min_remaining_quota_hours']):raise SystemExit(f'pre-write quota refused:{remaining:.3f}h')
          recent=(api.kernels_list(user=owner,sort_by='dateRun',page_size=25) or [])[:25]; gpu_active=0; unknown=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:ks=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if ks not in ACTIVE:continue
              try:
                  m=exact_metadata(api,ref); eg=getattr(m,'enable_gpu',None); et=getattr(m,'enable_tpu',None)
                  if type(eg) is not bool or type(et) is not bool:raise RuntimeError('accelerator unknown')
              except Exception:unknown+=1;continue
              if eg is True and et is False:gpu_active+=1
          if unknown or gpu_active>=int(r['resource']['max_active_runs']):raise SystemExit(f'pre-write GPU admission refused:gpu_active={gpu_active} unknown={unknown}')
          response=None; failure=None
          try:response=api.kernels_push(sys.argv[2])
          except Exception as exc:failure=('exception',safe_exception(exc))
          else:
              error=str(getattr(response,'error','') or '')
              if error:failure=('response_error',{'http_status':None,'error_sha256':hashlib.sha256(error.encode()).hexdigest()})
          try:post=exact_metadata_eventually(api,target,attempts=6,delay_seconds=2.0)
          except Exception as exc:
              info=safe_exception(exc);raise SystemExit(f'post-write exact metadata unavailable:http={info.get("http_status")} error_sha256={info.get("error_sha256")} write_calls=1')
          observed_version=int(getattr(post,'current_version_number',0))
          if failure and observed_version<2:
              kind,info=failure;raise SystemExit(f'one-shot SaveKernel v2 failed without observed version2:kind={kind} http={info.get("http_status")} error_sha256={info.get("error_sha256")} write_calls=1 observed_version={observed_version}')
          if getattr(post,'ref',None)!=target or observed_version!=2:raise SystemExit(f'post-write target/version mismatch:version={observed_version}')
          if getattr(post,'is_private',None) is not True or getattr(post,'enable_gpu',None) is not True or getattr(post,'enable_tpu',None) is not False or getattr(post,'enable_internet',None) is not True:raise SystemExit('post-write metadata mismatch')
          final_state=status_name(getattr(api.kernels_status(target),'status',None))
          if final_state not in ACTIVE|{'COMPLETE','ERROR','CANCELLED','CANCELED'}:raise SystemExit(f'post-write state unknown:{final_state}')
          print(f'P1_03_FRESH_CONFIRM_HF_V2_SAVE PASS target={target} version=2 gpu=1 private=1 state={final_state} quota_remaining_h={remaining:.3f} write_calls=1 failure_return={failure[0] if failure else "none"}')
          PY

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
          echo "P1_03_FRESH_CONFIRM_HF_V2_CLEANUP PASS retention_days=0"
