name: Retired CMI-Flu Public probe request 002

# A shared-reader update is not authorization to repeat a historical experiment.
# Original implementation is retained at commit 2010e1cec8f9bfa4810a97bb7e35b76319abef96.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Refuse replay of the historical one-shot request
        run: |
          echo 'PUBLIC_PROBE_002_RETIRED: create a fresh reviewed request for a new experiment.'
          echo 'No Kaggle write, compute or submission is performed by this workflow.'
          exit 1
