name: Poisoned Chalice Stage1 raw+FIM version 2 output verification

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-stage1-raw-fim-status-v2.json

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-raw-fim-status-v2.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  TARGET_KERNEL: renta0426/stage1-raw-fim-submission-v1

jobs:
  status:
    name: Verify completed version 2 and exact submission output
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/112-poisoned-chalice-stage1-raw-fim-status-v2.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_STAGE1_STATUS_V2_BOUNDARY PASS"

      - name: Validate immutable status request and prepare locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          from __future__ import annotations
          import json, pathlib, re, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, workdir_value = sys.argv[1:]
          root = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"
          workdir = pathlib.Path(workdir_value)

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(path: str, limit: int) -> bytes:
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              return data

          request = json.loads(read(
              "requests/poisoned-chalice-stage1-raw-fim-status-v2.json", 16384
          ))
          expected = {
              "schema_version": 1,
              "request_id": "20260903-poisoned-chalice-stage1-raw-fim-status-002",
              "parent_request_id": "20260902-poisoned-chalice-stage1-raw-fim-005",
              "competition": "poisoned-chalice-icse27",
              "operation": "kernel_status_output",
              "target": "renta0426/stage1-raw-fim-submission-v1",
              "expected_kernel_version": 2,
              "output_allowlist": ["run_manifest.json", "submission.csv"],
              "api_budget": {"max_calls": 8, "max_pages": 1},
              "side_effects": [],
          }
          if request != expected:
              raise SystemExit("Stage1 status-v2 request differs from exact allowlist")
          lock = read("requirements/kaggle-2.2.4.lock", 65536)
          text = lock.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          (workdir / "kaggle.lock").write_bytes(lock)
          print("STAGE1_STATUS_V2_REQUEST PASS side_effects=none")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps \
            --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F "2.2.4" >/dev/null

      - name: Confirm current Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
          ):
              request = urllib.request.Request(
                  url, headers={"User-Agent": "kaggle-actions-bridge/1"}
              )
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Verify live Competition pages and completed private version 2
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          names = {
              str((page.to_dict() if hasattr(page, "to_dict") else dict(page)).get("name") or "").strip().lower()
              for page in pages
          }
          if "rules" not in names or "evaluation" not in names:
              raise SystemExit("live Competition policy pages unavailable")
          status = str(getattr(api.kernels_status(os.environ["TARGET_KERNEL"]), "status", "")).upper()
          if "COMPLETE" not in status:
              raise SystemExit(f"Stage1 target is not complete: {status}")
          with api.build_kaggle_client() as client:
              request = ApiGetKernelRequest()
              request.user_name = "renta0426"
              request.kernel_slug = "stage1-raw-fim-submission-v1"
              details = client.kernels.kernels_api_client.get_kernel(request)
          version = int(details.metadata.current_version_number)
          if version != 2 or not bool(details.metadata.is_private):
              raise SystemExit(f"unexpected Stage1 version/privacy: version={version}")
          print("STAGE1_KERNEL_V2_COMPLETE PASS version=2 private=true")
          PY

      - name: Download only final manifest and submission, then verify
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          output_dir="${WORKDIR}/output"
          mkdir -p "${output_dir}"
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels output "${TARGET_KERNEL}" \
            -p "${output_dir}" -q -o --page-size 50 \
            --file-pattern '^(run_manifest\.json|submission\.csv)$' \
            >"${WORKDIR}/output.stdout" 2>"${WORKDIR}/output.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/output.stdout" "${WORKDIR}/output.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "STAGE1_OUTPUT_DOWNLOAD FAIL response_logged=false"
            exit 1
          fi
          "${WORKDIR}/venv/bin/python" - "${output_dir}" <<'PY'
          from __future__ import annotations
          import csv, hashlib, json, math, pathlib, sys

          root = pathlib.Path(sys.argv[1])
          files = [path for path in root.rglob("*") if path.is_file()]
          if {path.name for path in files} != {"run_manifest.json", "submission.csv"}:
              raise SystemExit("Stage1 output file allowlist mismatch")
          manifest_path = next(path for path in files if path.name == "run_manifest.json")
          submission_path = next(path for path in files if path.name == "submission.csv")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          expected = {
              "status": "complete",
              "method": "raw_plus_fim",
              "core_commit": "bcf6d44db86fdda4ac9dd07b2d0172de471ab67a",
              "source_commit": "28c34307c71db733dab2744ec9ec46549e54d424",
              "model_id": "bigcode/starcoder2-3b",
              "model_revision": "733247c55e3f73af49ce8e9c7949bf14af205928",
              "dataset_id": "Poisoned-Chalice/ICSE-2027-public",
              "dataset_revision": "2ed5468723efa5457a3665782c6979ea4dbac7c2",
              "train_rows": 10000,
              "validation_rows": 5000,
              "submission_rows": 5000,
              "hidden_validation_labels_used": False,
              "public_leaderboard_tuning_used": False,
              "validation_labels_used_for_fit_or_feature_selection": False,
              "assembled_from_private_kaggle_sources": True,
          }
          for key, value in expected.items():
              if manifest.get(key) != value:
                  raise SystemExit(f"Stage1 manifest mismatch: {key}")
          counts = manifest.get("feature_counts") or {}
          if counts != {
              "base": 113, "structure_raw": 50, "fim": 11,
              "total": 174, "cdf_added_at_fit": 3,
          }:
              raise SystemExit("Stage1 feature-count contract mismatch")
          oof = manifest.get("reproduced_oof") or {}
          auc = float(oof.get("auc", float("nan")))
          tpr = float(oof.get("tpr_at_0.01_fpr", float("nan")))
          if not math.isfinite(auc) or abs(auc - 0.664524) > 0.002:
              raise SystemExit(f"Stage1 frozen OOF AUC mismatch: {auc}")
          if not math.isfinite(tpr):
              raise SystemExit("Stage1 OOF TPR@1% missing")
          digest = hashlib.sha256(submission_path.read_bytes()).hexdigest()
          if digest != manifest.get("submission_sha256"):
              raise SystemExit("submission SHA-256 differs from manifest")
          with submission_path.open(newline="", encoding="utf-8") as handle:
              reader = csv.DictReader(handle)
              if reader.fieldnames != ["sample_id", "membership_score"]:
                  raise SystemExit("submission header mismatch")
              rows = list(reader)
          if len(rows) != 5000 or len({row["sample_id"] for row in rows}) != 5000:
              raise SystemExit("submission sample_id coverage mismatch")
          scores = [float(row["membership_score"]) for row in rows]
          if not all(math.isfinite(value) and 0.0 <= value <= 1.0 for value in scores):
              raise SystemExit("submission score range/finite check failed")
          visible = manifest.get("visible_validation_diagnostic_only") or {}
          visible_auc = float(visible.get("auc", float("nan")))
          print(
              "POISONED_CHALICE_STAGE1_V2_OUTPUT_VERIFIED "
              f"submission_sha256={digest} rows=5000 oof_auc={auc:.6f} "
              f"oof_tpr_1pct={tpr:.4f} visible_auc={visible_auc:.6f}"
          )
          PY

      - name: Cleanup runner-local output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "STAGE1_STATUS_V2_LOCAL_OUTPUT_REMOVED"
