name: CMI-Flu B2 004 aggregate readout

on:
  push:
    branches:
      - ops/cmi-flu-b2-004-readout
      - main
    paths:
      - .github/workflows/115-cmi-flu-b2-004-readout.yml
      - requests/cmi-flu-b2-readout-004.json
      - requirements/kaggle-2.2.4.lock
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/115-cmi-flu-b2-004-readout.yml
      - requests/cmi-flu-b2-readout-004.json
      - requirements/kaggle-2.2.4.lock

permissions: {}

concurrency:
  group: kaggle-readonly-cmi-flu-b2-004
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-b2-readout-004.json
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_OWNER: renta0426
  TARGET_SLUG: cmi-flu-b2-taskwise-compact-broad-20260903-004
  TARGET_KERNEL: renta0426/cmi-flu-b2-taskwise-compact-broad-20260903-004
  EXPECTED_LAUNCH_REQUEST_ID: 20260903-cmi-flu-b2-004
  EXPECTED_SOURCE_COMMIT: d6297c36366ab5c3ef49b9077c2357277f82a708
  EXPECTED_PACKAGE_SHA256: 48ff4ed2eadec8b059b8d37fb677af1f249b6486bccfbd55dca2274cfc6f3dc3

jobs:
  validate:
    name: Validate secret-free B2 004 readout contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Validate immutable readout request and workflow capability
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import json, os, pathlib, ssl, urllib.request

          base = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/"
          def read(path: str, limit: int) -> bytes:
              req = urllib.request.Request(base + path, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"input exceeds byte budget: {path}")
              return data

          request = json.loads(read(os.environ["REQUEST_PATH"], 16384))
          expected = {
              "schema_version": 1,
              "request_id": "20260903-cmi-flu-b2-readout-004",
              "competition": os.environ["TARGET_COMPETITION"],
              "operation": "kernel_output_read",
              "target_kernel": os.environ["TARGET_KERNEL"],
              "kernel_version": 1,
              "expected_launch_request_id": os.environ["EXPECTED_LAUNCH_REQUEST_ID"],
              "expected_source_commit": os.environ["EXPECTED_SOURCE_COMMIT"],
              "expected_package_zip_sha256": os.environ["EXPECTED_PACKAGE_SHA256"],
              "allowed_outputs": ["bridge-result.json", "b2-metrics-safe.json"],
              "api_budget": {"max_calls": 12, "max_pages": 1, "poll_attempts": 1},
              "side_effects": [],
              "publish_private_outputs": False,
              "rules_checked_at_utc": "2026-09-03T09:15:00Z",
          }
          if request != expected:
              raise SystemExit("B2 004 readout request differs from exact allowlist")

          workflow = read(".github/workflows/115-cmi-flu-b2-004-readout.yml", 65536).decode("utf-8")
          forbidden = (
              "kernels push",
              "competitions submit",
              "datasets create",
              "datasets version",
              "models create",
              "artifacts/upload-artifact",
              "actions/cache",
          )
          if any(token in workflow for token in forbidden):
              raise SystemExit("B2 004 readout workflow contains a forbidden write/publish capability")
          print("CMI_FLU_B2_004_READOUT_STATIC PASS side_effects=0 poll_attempts=1")
          PY

  readout:
    name: Read and validate aggregate B2 004 metrics once
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/115-cmi-flu-b2-004-readout.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_CMI_FLU_B2_004_READOUT_BOUNDARY PASS"

      - name: Prepare SHA-locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          from __future__ import annotations
          import os, pathlib, re, ssl, sys, urllib.request
          root = pathlib.Path(sys.argv[1])
          url = f"https://raw.githubusercontent.com/{os.environ['EXPECTED_REPOSITORY']}/{os.environ['EVENT_SHA']}/{os.environ['LOCK_PATH']}"
          req = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
          with urllib.request.urlopen(req, timeout=30, context=ssl.create_default_context()) as response:
              data = response.read(65537)
          if len(data) > 65536:
              raise SystemExit("Kaggle CLI lock exceeds byte budget")
          lock = data.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in lock.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle CLI lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle CLI 2.2.4 pin missing")
          (root / "kaggle.lock").write_text(lock, encoding="utf-8")
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Live rule preflight and one-shot aggregate output read
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import hashlib, json, math, os, pathlib, re
          from urllib.parse import urlparse
          import requests
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest, ApiListKernelSessionOutputRequest

          api = KaggleApi(); api.authenticate()

          # Live Competition preflight: one bounded page-list request.
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          plain = lambda value: re.sub(r"\s+", " ", re.sub(r"<[^>]+>", " ", value)).casefold()
          if "rules" not in content or "evaluation" not in content or not any("data" in key for key in content):
              raise SystemExit("live Competition pages unavailable")
          rules = plain(content["rules"]); evaluation = plain(content["evaluation"])
          if "maximum of five (5) submissions per day" not in rules or "mean spearman correlation" not in evaluation:
              raise SystemExit("live Competition rules/evaluation differ from approved guardrails")

          # Exact private kernel metadata and terminal status.
          discovered = api.kernels_list(user=os.environ["TARGET_OWNER"], search=os.environ["TARGET_SLUG"], page_size=5) or []
          refs = [str(getattr(item, "ref", "")) for item in discovered]
          if refs.count(os.environ["TARGET_KERNEL"]) != 1:
              raise SystemExit("exact B2 004 kernel was not discoverable once")
          status = str(getattr(api.kernels_status(os.environ["TARGET_KERNEL"]), "status", "")).upper()
          if any(token in status for token in ("RUNNING", "QUEUED", "PENDING")):
              raise SystemExit(f"B2 004 kernel is not terminal: status={status}")

          with api.build_kaggle_client() as client:
              meta_req = ApiGetKernelRequest(); meta_req.user_name = os.environ["TARGET_OWNER"]; meta_req.kernel_slug = os.environ["TARGET_SLUG"]
              metadata = client.kernels.kernels_api_client.get_kernel(meta_req).metadata
              if str(metadata.ref) != os.environ["TARGET_KERNEL"] or not bool(metadata.is_private):
                  raise SystemExit("B2 004 private kernel identity mismatch")
              if int(metadata.current_version_number or 0) != 1:
                  raise SystemExit("B2 004 kernel version mismatch")
              if bool(getattr(metadata, "enable_gpu", False)) or bool(getattr(metadata, "enable_tpu", False)) or bool(getattr(metadata, "enable_internet", False)):
                  raise SystemExit("B2 004 kernel resource settings differ from approved request")

              out_req = ApiListKernelSessionOutputRequest()
              out_req.user_name = os.environ["TARGET_OWNER"]
              out_req.kernel_slug = os.environ["TARGET_SLUG"]
              out_req.version_label = "1"
              out_req.page_size = 1000
              output = client.kernels.kernels_api_client.list_kernel_session_output(out_req)

          log = str(getattr(output, "log", "") or "")
          if "CMI_FLU_B2_COMPLETE" not in log or "CMI_FLU_B2_FAILED" in log:
              raise SystemExit("B2 004 terminal output marker is not uniquely successful")

          allowed = {"bridge-result.json": 262144, "b2-metrics-safe.json": 524288}
          found = {}
          for item in list(getattr(output, "files", None) or []):
              raw = str(getattr(item, "file_name", "") or "").replace("\\", "/")
              name = pathlib.PurePosixPath(raw).name
              if name in allowed:
                  found.setdefault(name, []).append((raw, str(getattr(item, "url", "") or "")))
          chosen = {}
          for name in allowed:
              items = found.get(name, [])
              preferred = [x for x in items if x[0] == name or x[0].endswith(f"/cmi-flu-b2/{name}")]
              pool = preferred or items
              if len(pool) != 1:
                  raise SystemExit(f"allowlisted output is missing or ambiguous: {name}")
              chosen[name] = pool[0][1]

          session = requests.Session(); session.trust_env = False
          downloaded = {}
          for name, url in chosen.items():
              parsed = urlparse(url); host = (parsed.hostname or "").casefold()
              if parsed.scheme != "https" or not (host == "storage.googleapis.com" or host.endswith(".storage.googleapis.com") or host.endswith(".googleusercontent.com") or host.endswith(".kaggleusercontent.com")):
                  raise SystemExit(f"unexpected signed output host for {name}")
              response = session.get(url, timeout=60, allow_redirects=False)
              if response.status_code != 200 or len(response.content) > allowed[name]:
                  raise SystemExit(f"signed output download failed for {name}")
              downloaded[name] = response.content

          result = json.loads(downloaded["bridge-result.json"])
          metrics = json.loads(downloaded["b2-metrics-safe.json"])
          tasks = ("Task1.1", "Task1.2", "Task1.3", "Task1.4", "Task2.1", "Task2.2", "Task2.3")
          if result.get("request_id") != os.environ["EXPECTED_LAUNCH_REQUEST_ID"]:
              raise SystemExit("B2 004 result request identity mismatch")
          if result.get("competition") != os.environ["TARGET_COMPETITION"] or result.get("kernel_stage") != "b2_taskwise_compact":
              raise SystemExit("B2 004 result competition/stage mismatch")
          if result.get("source_commit") != os.environ["EXPECTED_SOURCE_COMMIT"] or result.get("package_zip_sha256") != os.environ["EXPECTED_PACKAGE_SHA256"]:
              raise SystemExit("B2 004 result provenance mismatch")
          if int(result.get("submission_rows", 0)) != 40 or result.get("derived_panel_sizes") != {"vaccine": 3, "challenge": 12}:
              raise SystemExit("B2 004 submission/panel contract mismatch")
          if set(result.get("selected_models", {})) != set(tasks) or set(result.get("task_cv", {})) != set(tasks):
              raise SystemExit("B2 004 seven-task aggregate contract mismatch")
          if metrics.get("selected_models") != result.get("selected_models") or set(metrics.get("tasks", {})) != set(tasks):
              raise SystemExit("B2 004 metrics/result mismatch")
          checksum = result.get("checksum") or {}
          if len(checksum.get("verified", [])) != 28 or checksum.get("skipped") != ["md5sum"]:
              raise SystemExit("B2 004 MD5 summary mismatch")
          if set(result.get("hai_stress_tests", {})) != {"Task2.1", "Task2.2", "Task2.3"}:
              raise SystemExit("B2 004 HAI stress-test contract mismatch")

          def finite_or_none(value):
              try:
                  x = float(value)
              except (TypeError, ValueError):
                  return None
              return x if math.isfinite(x) else None

          compact = {
              "request_id": result["request_id"],
              "kernel_status": status,
              "source_commit": result["source_commit"],
              "package_zip_sha256": result["package_zip_sha256"],
              "submission_sha256": result.get("submission_sha256"),
              "metrics_sha256": result.get("metrics_sha256"),
              "supervised_public_proxy_macro_spearman": finite_or_none(result.get("supervised_public_proxy_macro_spearman")),
              "supervised_public_proxy_finite_tasks": int(result.get("supervised_public_proxy_finite_tasks", 0)),
              "selected_models": result["selected_models"],
              "task_cv": result["task_cv"],
              "hai_stress_tests": result["hai_stress_tests"],
              "checksum_verified_count": len(checksum.get("verified", [])),
              "checksum_skipped": checksum.get("skipped"),
          }
          print("CMI_FLU_B2_004_AGGREGATE " + json.dumps(compact, sort_keys=True, separators=(",", ":"), ensure_ascii=False))
          print("CMI_FLU_B2_004_READOUT PASS outputs=2 side_effects=0 poll_attempts=1")
          PY

      - name: Cleanup runner-local private output
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "Runner-local B2 004 readout content removed"
