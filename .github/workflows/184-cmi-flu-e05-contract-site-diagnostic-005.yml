name: CMI-Flu E05 contract-site diagnostic 005

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/184-cmi-flu-e05-contract-site-diagnostic-005.yml
      - requests/cmi-flu-e05-contract-site-diagnostic-005.json
      - scripts/cmi_flu_e05_contract_site_prepare.py
      - scripts/cmi_flu_e05_contract_site_execute.py
      - .github/workflows/183-cmi-flu-strategy-e05-hai-donor-strain-004.yml
  pull_request:
    paths:
      - .github/workflows/184-cmi-flu-e05-contract-site-diagnostic-005.yml
      - requests/cmi-flu-e05-contract-site-diagnostic-005.json
      - scripts/cmi_flu_e05_contract_site_prepare.py
      - scripts/cmi_flu_e05_contract_site_execute.py
      - .github/workflows/183-cmi-flu-strategy-e05-hai-donor-strain-004.yml

permissions: {}
concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260907-cmi-flu-e05-contract-site-005
  TARGET: renta0426/cmi-flu-e05-contract-site-20260907-005
  SCIENCE_COMMIT: 3bcddeaf4b028795363a6e12f8af06dd23b3bbdf
  EXPECTED_ERROR_CODE: 74bf25be40ca17429601
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate safe E05 005 contract-site diagnostic
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do [[ -z "${!name-}" ]] || exit 1; done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"e05-contract-site-diagnostic/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Fetch locked references and build exact diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e05_contract_site_prepare.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          python3 - "${WORKDIR}/script.py" <<'PY'
          import runpy,sys
          ns=runpy.run_path(sys.argv[1],run_name='e05_contract_site_probe')
          probe={}
          exec(compile("def boom():\n    raise RuntimeError('probe')\n",'cmi_flu/strategy_e05.py','exec'),probe,probe)
          try: probe['boom']()
          except RuntimeError as exc:
            sites,digest=ns['_e05_contract_site'](exc)
          assert 'cmi_flu/strategy_e05.py:boom:2' in sites, sites
          assert len(digest)==20
          print('CMI_FLU_E05_CONTRACT_SITE_PREFLIGHT helper=true traceback_site=true')
          PY
          python3 -m py_compile "${WORKDIR}/bridge/scripts/cmi_flu_e05_contract_site_prepare.py" "${WORKDIR}/bridge/scripts/cmi_flu_e05_contract_site_execute.py"
          ! grep -F 'kaggle competitions submit' "${WORKDIR}/script.py" "${WORKDIR}/bridge/scripts/cmi_flu_e05_contract_site_execute.py" >/dev/null

      - name: Validate request and retired 004 guard
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge/requests/cmi-flu-e05-contract-site-diagnostic-005.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          expected={
            'request_id':'20260907-cmi-flu-e05-contract-site-005',
            'target':'renta0426/cmi-flu-e05-contract-site-20260907-005',
            'science_source_commit':'3bcddeaf4b028795363a6e12f8af06dd23b3bbdf',
            'parent_failed_target':'renta0426/cmi-flu-e05-hai-donor-strain-20260907-004',
            'parent_failed_runtime_sha256':'836307e872f29062c2e898ebe3647438c40568a034e8c2e7252286dd966ef135',
            'expected_exception_type':'DataContractError',
            'expected_error_code':'74bf25be40ca17429601',
            'expected_kernel_version':1,
            'enable_internet':False,
            'competition_submission_attempted':False,
            'leaderboard_used_for_selection':False,
            'automatic_compute_retries':0,
          }
          for k,v in expected.items():
            if r.get(k)!=v:raise SystemExit(f'request mismatch:{k}')
          PY
          f="${WORKDIR}/bridge/.github/workflows/183-cmi-flu-strategy-e05-hai-donor-strain-004.yml"
          ! grep -Eq '^[[:space:]]+push:|^[[:space:]]+pull_request:|environment:|KAGGLE_API_TOKEN|group:[[:space:]]+kaggle-resource' "$f"
          grep -Eq 'Retired|RETIRED|retired' "$f"

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  launch:
    name: Run one private CPU E05 005 diagnostic and recover safe site marker
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/184-cmi-flu-e05-contract-site-diagnostic-005.yml@refs/heads/main" ]]

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/{repo}/tarball/{ref}",headers={"User-Agent":"e05-contract-site-diagnostic/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as r:data=r.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit('bridge archive too large')
          with tarfile.open(fileobj=io.BytesIO(data),mode='r:gz') as tf:
            files=[m for m in tf.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit('archive layout')
            prefix=next(iter(prefixes))+'/'
            for m in files:
              rel=pathlib.PurePosixPath(m.name[len(prefix):])
              if not m.name.startswith(prefix) or '..' in rel.parts:raise SystemExit('unsafe archive')
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(tf.extractfile(m).read())
          PY

      - name: Fetch references and build instrumented E05 005 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_e05_contract_site_prepare.py" --repository-root "${WORKDIR}/bridge" --reference-dir "${WORKDIR}/references" --output "${WORKDIR}/script.py"
          echo "E05_DIAG_RUNTIME_SHA256=$(sha256sum "${WORKDIR}/script.py" | awk '{print $1}')" >> "${GITHUB_ENV}"

      - name: Install locked Kaggle CLI
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run diagnostic and recover only safe traceback-site marker
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          echo "CMI_FLU_E05_DIAGNOSTIC_APPROVED_RUNTIME sha256=${E05_DIAG_RUNTIME_SHA256}"
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_e05_contract_site_execute.py" --runtime "${WORKDIR}/script.py" --bridge-root "${WORKDIR}/bridge" --output-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
