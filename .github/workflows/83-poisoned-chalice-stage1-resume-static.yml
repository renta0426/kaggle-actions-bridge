name: Poisoned Chalice Stage1 cached continuation static validation

on:
  pull_request:
    paths:
      - .github/workflows/83-poisoned-chalice-stage1-resume-static.yml
      - .github/workflows/84-poisoned-chalice-stage1-resume-launch.yml
      - scripts/poisoned_chalice_stage1_resume_builder.py
      - requests/poisoned-chalice-stage1-resume-v1.json
  push:
    branches:
      - main
    paths:
      - .github/workflows/83-poisoned-chalice-stage1-resume-static.yml
      - .github/workflows/84-poisoned-chalice-stage1-resume-launch.yml
      - scripts/poisoned_chalice_stage1_resume_builder.py
      - requests/poisoned-chalice-stage1-resume-v1.json

permissions: {}

concurrency:
  group: poisoned-chalice-stage1-resume-static-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static:
    name: Validate CPU-only cached continuation boundary
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact event files without credentials and validate
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "1354356687" ]]
          [[ "${EVENT_ACTOR}" == "renta0426" ]]
          [[ "${EVENT_ACTOR_ID}" == "71638068" ]]
          [[ "${EVENT_SENDER_ID}" == "71638068" ]]
          [[ "${SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            [[ "${PR_HEAD_REPOSITORY}" == "renta0426/kaggle-actions-bridge" ]]
            [[ "${PR_AUTHOR}" == "renta0426" ]]
          elif [[ "${EVENT_NAME}" != "push" ]]; then
            echo "unexpected event: ${EVENT_NAME}"
            exit 1
          fi
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - "${SOURCE_SHA}" <<'PY'
          from __future__ import annotations
          import ast
          import hashlib
          import json
          import pathlib
          import ssl
          import subprocess
          import sys
          import tempfile
          import urllib.request
          from urllib.parse import urlparse

          sha = sys.argv[1]
          root = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"
          paths = {
              ".github/workflows/84-poisoned-chalice-stage1-resume-launch.yml": 131072,
              "scripts/poisoned_chalice_stage1_resume_builder.py": 131072,
              "requests/poisoned-chalice-stage1-resume-v1.json": 32768,
          }

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(path: str) -> bytes:
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(paths[path] + 1)
              if len(data) > paths[path]:
                  raise SystemExit(f"source exceeds byte budget: {path}")
              destination = pathlib.Path(path)
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(data)
              return data

          launch = read(".github/workflows/84-poisoned-chalice-stage1-resume-launch.yml").decode()
          builder = read("scripts/poisoned_chalice_stage1_resume_builder.py")
          request = json.loads(read("requests/poisoned-chalice-stage1-resume-v1.json"))
          expected = {
              "schema_version": 1,
              "request_id": "20260903-poisoned-chalice-stage1-resume-001",
              "parent_failed_request_id": "20260902-poisoned-chalice-stage1-raw-fim-005",
              "competition": "poisoned-chalice-icse27",
              "operation": "kernel_run",
              "target": "renta0426/stage1-raw-fim-resume-v1",
              "source_kernel": "renta0426/stage1-raw-fim-submission-v1",
              "source_kernel_version": 2,
              "source_kernel_expected_status": "error",
              "source_failure": "Expected 113 base features, got 111",
              "source_dataset": "renta0426/stage1-raw-fim-submission-v1-output",
              "source_dataset_version": 1,
              "builder_path": "scripts/poisoned_chalice_stage1_resume_builder.py",
              "builder_blob_sha": "d4be3a7c523558ca3a99feefb6a9bcbb0a0a86ef",
              "resource": {
                  "accelerator": "cpu", "expected_runtime_minutes": 5,
                  "hard_timeout_minutes": 30, "max_active_runs": 1,
              },
              "api_budget": {
                  "max_calls": 20, "poll_interval_seconds": 300, "max_pages": 2,
              },
              "side_effects": [
                  "create one private notebook version and start one CPU run"
              ],
              "automatic_compute_retries": 0,
              "enable_internet": False,
              "competition_submission": False,
          }
          if request != expected:
              raise SystemExit("resume request differs from exact allowlist")
          blob = hashlib.sha1(
              b"blob " + str(len(builder)).encode() + b"\0" + builder
          ).hexdigest()
          if blob != request["builder_blob_sha"]:
              raise SystemExit("resume builder blob mismatch")
          ast.parse(builder.decode(), filename=request["builder_path"])

          with tempfile.TemporaryDirectory() as temporary:
              output = pathlib.Path(temporary) / "kernel"
              subprocess.run(
                  [sys.executable, request["builder_path"], "--output-dir", str(output),
                   "--builder-blob-sha", request["builder_blob_sha"]],
                  check=True, timeout=30, stdout=subprocess.DEVNULL,
              )
              files = sorted(path.name for path in output.iterdir() if path.is_file())
              if files != ["kernel-metadata.json", "stage1-raw-fim-resume-v1.ipynb"]:
                  raise SystemExit(f"unexpected built kernel files: {files}")
              metadata = json.loads((output / "kernel-metadata.json").read_text())
              if metadata != {
                  "id": "renta0426/stage1-raw-fim-resume-v1",
                  "title": "Stage1 Raw FIM Resume V1",
                  "code_file": "stage1-raw-fim-resume-v1.ipynb",
                  "language": "python",
                  "kernel_type": "notebook",
                  "is_private": True,
                  "enable_gpu": False,
                  "enable_tpu": False,
                  "enable_internet": False,
                  "dataset_sources": ["renta0426/stage1-raw-fim-submission-v1-output"],
                  "kernel_sources": [], "competition_sources": [], "model_sources": [],
                  "keywords": ["cpu", "membership-inference", "resume", "cached-features"],
              }:
                  raise SystemExit("built kernel metadata mismatch")
              notebook = json.loads(
                  (output / "stage1-raw-fim-resume-v1.ipynb").read_text()
              )
              if notebook.get("nbformat") != 4 or len(notebook.get("cells", [])) != 2:
                  raise SystemExit("built notebook structure mismatch")
              if [cell.get("id") for cell in notebook["cells"]] != [
                  "pc-stage1-resume-00", "pc-stage1-resume-01"
              ]:
                  raise SystemExit("stable cell IDs missing")
              code = "".join(notebook["cells"][1].get("source", []))
              ast.parse(code, filename="stage1-raw-fim-resume-v1.ipynb")
              for marker in (
                  '"token_count", "window_count"',
                  "EXPECTED_BASE_FEATURES = 113",
                  "EXPECTED_STRUCTURE_FEATURES = 50",
                  "EXPECTED_FIM_FEATURES = 11",
                  "EXPECTED_OOF_AUC = 0.664524",
                  "source_extraction_reused",
                  '"gpu_forward_passes": 0',
                  '"public_leaderboard_tuning_used": False',
                  '"hidden_validation_labels_used": False',
                  '"validation_labels_used_for_fit_or_feature_selection": False',
              ):
                  if marker not in code:
                      raise SystemExit(f"resume notebook invariant missing: {marker}")
              for forbidden in (
                  "torch", "transformers", "load_dataset", "requests.", "urllib.",
                  "subprocess.", "kaggle competitions submit", "kernels push",
                  "KAGGLE_API_TOKEN", "KAGGLE_KEY",
              ):
                  if forbidden in code:
                      raise SystemExit(f"resume notebook contains forbidden capability: {forbidden}")

          for marker in (
              "permissions: {}", "group: kaggle-resource-global",
              "environment: kaggle-readonry", "REQUESTED_ACCELERATOR: cpu",
              "SOURCE_DATASET: renta0426/stage1-raw-fim-submission-v1-output",
              "SOURCE_KERNEL: renta0426/stage1-raw-fim-submission-v1",
              "EXPECTED_SOURCE_VERSION: \"2\"",
              "RESUME_LIVE_PREFLIGHT PASS", "RESUME_KERNEL_LAUNCH PASS",
              "automatic_retries=0 submission=false",
          ):
              if marker not in launch:
                  raise SystemExit(f"launch invariant missing: {marker}")
          if launch.count('"${WORKDIR}/venv/bin/kaggle" kernels push') != 1:
              raise SystemExit("launch must contain exactly one executable kernels push")
          for forbidden in (
              "workflow_dispatch", "continue-on-error: true", "actions/checkout",
              "actions/upload-artifact", "actions/cache", "competitions submit",
              "kernels delete", "kernels cancel", "datasets create", "datasets version",
          ):
              if forbidden in launch:
                  raise SystemExit(f"launch contains forbidden operation: {forbidden}")
          print("STAGE1_RESUME_STATIC PASS cpu=true gpu=false cached_shards=true")
          PY

      - name: Cleanup fetched source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .github requests scripts
          echo "STAGE1_RESUME_STATIC_TEMPORARY_MATERIAL_REMOVED"
