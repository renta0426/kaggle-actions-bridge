name: CMI-Flu Phase A rank transfer CPU launch

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/129-cmi-flu-rank-transfer-launch.yml
      - requests/cmi-flu-rank-transfer-001.json
      - scripts/cmi_flu_rank_transfer_materialize.py
  pull_request:
    paths:
      - .github/workflows/129-cmi-flu-rank-transfer-launch.yml
      - requests/cmi-flu-rank-transfer-001.json
      - scripts/cmi_flu_rank_transfer_materialize.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  MATERIALIZER_PATH: scripts/cmi_flu_rank_transfer_materialize.py
  EXPECTED_MATERIALIZER_BLOB: f71d6b9f36df9dc41fa0237632a5cc94621b78b9
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-phase-a-rank-transfer-20260904-001
  TARGET_SLUG: cmi-flu-phase-a-rank-transfer-20260904-001

jobs:
  validate:
    name: Validate immutable rank-transfer request 001
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce Kaggle-secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Bootstrap exact bounded materializer
        shell: bash
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/materializer.py" <<'PY'
          import base64,hashlib,json,os,pathlib,ssl,sys,urllib.parse,urllib.request
          path=pathlib.Path(sys.argv[1]); quoted=urllib.parse.quote(os.environ['MATERIALIZER_PATH'],safe='/')
          url=f"https://api.github.com/repos/{os.environ['EXPECTED_REPOSITORY']}/contents/{quoted}?ref={os.environ['EVENT_SHA']}"
          headers={'Authorization':f"Bearer {os.environ['GITHUB_READ_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'kaggle-actions-bridge/1'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45,context=ssl.create_default_context()) as response:
              payload=json.loads(response.read())
          if payload.get('encoding')!='base64': raise SystemExit('materializer encoding mismatch')
          data=base64.b64decode(payload['content'])
          blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if blob!=os.environ['EXPECTED_MATERIALIZER_BLOB']: raise SystemExit(f'materializer blob mismatch: {blob}')
          path.write_bytes(data)
          PY
          python3 -W error::SyntaxWarning -m py_compile "${workdir}/materializer.py"
          GITHUB_READ_TOKEN="${GITHUB_READ_TOKEN}" python3 "${workdir}/materializer.py" --bridge-ref "${EVENT_SHA}" --output-root "${workdir}/materialized"
          [[ -f "${workdir}/materialized/runner-a.py" ]]
          [[ -f "${workdir}/materialized/bridge/${LOCK_PATH}" ]]
          echo 'CMI_FLU_RANK_TRANSFER_001_VALIDATE PASS'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl,urllib.request
          for url in ('https://www.kaggle.com/terms','https://www.kaggle.com/aup','https://www.kaggle.com/community-guidelines','https://www.kaggle.com/docs/api'):
              request=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge/1'})
              with urllib.request.urlopen(request,timeout=30,context=ssl.create_default_context()) as response:
                  if response.status!=200 or not response.read(65536): raise SystemExit(f'official Kaggle page unavailable: {url}')
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

      - name: Cleanup validation content
        if: always()
        run: |
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi

  launch:
    name: Admit or launch exactly one rank-transfer CPU run 001
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/129-cmi-flu-rank-transfer-launch.yml@refs/heads/main" ]]
          echo 'PROTECTED_CMI_FLU_RANK_TRANSFER_001_BOUNDARY PASS'

      - name: Materialize exact approved native runner
        shell: bash
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/materializer.py" <<'PY'
          import base64,hashlib,json,os,pathlib,ssl,sys,urllib.parse,urllib.request
          path=pathlib.Path(sys.argv[1]); quoted=urllib.parse.quote(os.environ['MATERIALIZER_PATH'],safe='/')
          url=f"https://api.github.com/repos/{os.environ['EXPECTED_REPOSITORY']}/contents/{quoted}?ref={os.environ['EVENT_SHA']}"
          headers={'Authorization':f"Bearer {os.environ['GITHUB_READ_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'kaggle-actions-bridge/1'}
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=45,context=ssl.create_default_context()) as response:
              payload=json.loads(response.read())
          data=base64.b64decode(payload['content']); blob=hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          if payload.get('encoding')!='base64' or blob!=os.environ['EXPECTED_MATERIALIZER_BLOB']: raise SystemExit('approved materializer mismatch')
          path.write_bytes(data)
          PY
          GITHUB_READ_TOKEN="${GITHUB_READ_TOKEN}" python3 "${workdir}/materializer.py" --bridge-ref "${EVENT_SHA}" --output-root "${workdir}/materialized"
          cp "${workdir}/materialized/runner-a.py" "${workdir}/runner.py"
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/materialized/bridge/${LOCK_PATH}" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Fetch live Competition rules and determine CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os,re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          api=KaggleApi(); api.authenticate(); pages=api.competition_list_pages(os.environ['TARGET_COMPETITION']) or []; content={}
          for page in pages:
              data=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(data.get('name') or '').strip().lower()
              if name: content[name]=str(data.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in key for key in content): raise SystemExit('live Competition pages unavailable')
          plain=lambda value: re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',value)).casefold()
          rules=plain(content['rules']); evaluation=plain(content['evaluation']); data=' '.join(plain(content[key]) for key in content if 'data' in key)
          if not all(token in rules for token in ('data security','external data and tools')): raise SystemExit('live rules differ from guardrails')
          if not all(token in evaluation for token in ('mean spearman correlation','40 donors','-99')): raise SystemExit('live evaluation differs from guardrails')
          if 'sample_submission_part1.csv' not in data or 'investigations_260821.tsv' not in data: raise SystemExit('live data description differs from guardrails')
          existing=api.kernels_list(user='renta0426',search=os.environ['TARGET_SLUG'],page_size=5) or []
          if os.environ['TARGET_KERNEL'] in {str(getattr(item,'ref','')) for item in existing}: raise SystemExit('target kernel already exists; duplicate refused')
          active_refs=[]
          for item in (api.kernels_list(user='renta0426',sort_by='dateRun',page_size=15) or [])[:15]:
              ref=str(getattr(item,'ref',''))
              if not ref: continue
              try: status=str(getattr(api.kernels_status(ref),'status','')).upper()
              except Exception: continue
              if any(token in status for token in ('RUNNING','QUEUED','PENDING')): active_refs.append(ref)
          active={'cpu':[],'gpu':[],'tpu':[],'unknown':[]}
          if len(active_refs)>5: active['unknown'].extend(active_refs)
          else:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      resource='unknown'
                      try:
                          owner,slug=ref.split('/',1); request=ApiGetKernelRequest(); request.user_name=owner; request.kernel_slug=slug; metadata=client.kernels.kernels_api_client.get_kernel(request).metadata
                          resource='tpu' if bool(getattr(metadata,'enable_tpu',False)) else ('gpu' if bool(getattr(metadata,'enable_gpu',False)) else 'cpu')
                      except Exception: pass
                      active[resource].append(ref)
          can_launch=len(active['cpu'])+len(active['unknown'])<1
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle: handle.write(f"can_launch={'true' if can_launch else 'false'}\n")
          print(f"RANK_TRANSFER_ADMISSION requested=cpu active_cpu={len(active['cpu'])} active_gpu={len(active['gpu'])} active_tpu={len(active['tpu'])} active_unknown={len(active['unknown'])} can_launch={can_launch}")
          PY

      - name: Record deferred admission
        if: steps.admission.outputs.can_launch != 'true'
        run: echo 'Rank-transfer request deferred before Kaggle write; fresh approval required on manual redispatch.'

      - name: Push one private CPU rank-transfer run
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"; mkdir -p "${kernel_dir}"; cp "${WORKDIR}/runner.py" "${kernel_dir}/script.py"
          python3 - "${kernel_dir}" <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1]); metadata={"id":os.environ['TARGET_KERNEL'],"title":"CMI Flu Phase A Rank Transfer 20260904 001","code_file":"script.py","language":"python","kernel_type":"script","is_private":True,"enable_gpu":False,"enable_tpu":False,"enable_internet":False,"machine_shape":"","dataset_sources":[],"competition_sources":[os.environ['TARGET_COMPETITION']],"kernel_sources":[],"model_sources":[]}
          (root/'kernel-metadata.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 10800 >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?; set -e; rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then echo 'ERROR: rank-transfer kernel push failed; response suppressed; no retry'; exit 1; fi
          echo "CMI_FLU_RANK_TRANSFER_LAUNCH PASS request_id=20260904-cmi-flu-rank-transfer-001 target=${TARGET_KERNEL} accelerator=cpu internet=false submission=false automatic_compute_retries=0"

      - name: Cleanup runner-local content
        if: always()
        run: |
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'Runner-local rank-transfer content removed'
