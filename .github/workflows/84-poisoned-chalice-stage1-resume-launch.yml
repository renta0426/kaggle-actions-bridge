name: Poisoned Chalice Stage1 cached continuation CPU launch

on:
  push:
    branches:
      - main
    paths:
      - requests/poisoned-chalice-stage1-resume-v1.json

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-stage1-resume-v1.json
  LOCK_RELATIVE_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: poisoned-chalice-icse27
  TARGET_KERNEL: renta0426/stage1-raw-fim-resume-v1
  SOURCE_KERNEL: renta0426/stage1-raw-fim-submission-v1
  EXPECTED_SOURCE_VERSION: "2"
  SOURCE_DATASET: renta0426/stage1-raw-fim-submission-v1-output
  REQUESTED_ACCELERATOR: cpu

jobs:
  validate:
    name: Validate immutable cached-continuation request without credentials
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Validate request and pinned builder
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          python3 - "${EVENT_SHA}" <<'PY'
          from __future__ import annotations
          import hashlib, json, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha = sys.argv[1]
          root = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(path: str, limit: int) -> bytes:
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              return data

          request = json.loads(read(
              "requests/poisoned-chalice-stage1-resume-v1.json", 32768
          ))
          expected = {
              "schema_version": 1,
              "request_id": "20260903-poisoned-chalice-stage1-resume-001",
              "parent_failed_request_id": "20260902-poisoned-chalice-stage1-raw-fim-005",
              "competition": "poisoned-chalice-icse27",
              "operation": "kernel_run",
              "target": "renta0426/stage1-raw-fim-resume-v1",
              "source_kernel": "renta0426/stage1-raw-fim-submission-v1",
              "source_kernel_version": 2,
              "source_kernel_expected_status": "error",
              "source_failure": "Expected 113 base features, got 111",
              "source_dataset": "renta0426/stage1-raw-fim-submission-v1-output",
              "source_dataset_version": 1,
              "builder_path": "scripts/poisoned_chalice_stage1_resume_builder.py",
              "builder_blob_sha": "d4be3a7c523558ca3a99feefb6a9bcbb0a0a86ef",
              "resource": {
                  "accelerator": "cpu", "expected_runtime_minutes": 5,
                  "hard_timeout_minutes": 30, "max_active_runs": 1,
              },
              "api_budget": {
                  "max_calls": 20, "poll_interval_seconds": 300, "max_pages": 2,
              },
              "side_effects": [
                  "create one private notebook version and start one CPU run"
              ],
              "automatic_compute_retries": 0,
              "enable_internet": False,
              "competition_submission": False,
          }
          if request != expected:
              raise SystemExit("resume request differs from exact allowlist")
          builder = read(request["builder_path"], 131072)
          blob = hashlib.sha1(
              b"blob " + str(len(builder)).encode() + b"\0" + builder
          ).hexdigest()
          if blob != request["builder_blob_sha"]:
              raise SystemExit("resume builder Git blob mismatch")
          compile(builder, request["builder_path"], "exec")
          print("STAGE1_RESUME_REQUEST_STATIC PASS credentials=absent")
          PY

  launch:
    name: Push one private CPU continuation notebook
    needs: validate
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" ]]
          [[ "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_NAME}" == "push" ]]
          [[ "${EVENT_REF}" == "refs/heads/main" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/84-poisoned-chalice-stage1-resume-launch.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          echo "PROTECTED_STAGE1_RESUME_BOUNDARY PASS"

      - name: Prepare pinned builder and SHA-locked Kaggle CLI
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          from __future__ import annotations
          import hashlib, json, pathlib, re, ssl, sys, urllib.request
          from urllib.parse import urlparse

          sha, workdir_value = sys.argv[1:]
          root = f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/"
          workdir = pathlib.Path(workdir_value)

          class RejectRedirects(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              RejectRedirects(),
          )

          def read(path: str, limit: int) -> bytes:
              url = root + path
              parsed = urlparse(url)
              if parsed.scheme != "https" or parsed.hostname != "raw.githubusercontent.com":
                  raise SystemExit("unexpected bridge source origin")
              with opener.open(url, timeout=30) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit(f"bridge source exceeds byte budget: {path}")
              return data

          request_data = read(
              "requests/poisoned-chalice-stage1-resume-v1.json", 32768
          )
          request = json.loads(request_data)
          builder = read(request["builder_path"], 131072)
          blob = hashlib.sha1(
              b"blob " + str(len(builder)).encode() + b"\0" + builder
          ).hexdigest()
          if blob != request["builder_blob_sha"]:
              raise SystemExit("resume builder Git blob mismatch")
          compile(builder, request["builder_path"], "exec")
          (workdir / "request.json").write_bytes(request_data)
          (workdir / "builder.py").write_bytes(builder)

          lock = read("requirements/kaggle-2.2.4.lock", 65536)
          text = lock.decode("utf-8")
          pattern = re.compile(r"^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$")
          lines = [line.strip() for line in text.splitlines() if line.strip() and not line.lstrip().startswith("#")]
          if len(lines) != 33 or not all(pattern.fullmatch(line) for line in lines):
              raise SystemExit("Kaggle lock validation failed")
          if not any(line.startswith("kaggle==2.2.4 ") for line in lines):
              raise SystemExit("Kaggle 2.2.4 pin missing")
          (workdir / "kaggle.lock").write_bytes(lock)
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install \
            --disable-pip-version-check --no-input --no-deps \
            --only-binary=:all: --require-hashes \
            -r "${workdir}/kaggle.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          "${workdir}/venv/bin/kaggle" --version | grep -F "2.2.4" >/dev/null
          echo "STAGE1_RESUME_LOCKED_CLIENT PASS"

      - name: Confirm current Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          context = ssl.create_default_context()
          for url in (
              "https://www.kaggle.com/terms",
              "https://www.kaggle.com/aup",
              "https://www.kaggle.com/community-guidelines",
              "https://www.kaggle.com/docs/api",
              "https://www.kaggle.com/docs/notebooks",
          ):
              request = urllib.request.Request(
                  url, headers={"User-Agent": "kaggle-actions-bridge/1"}
              )
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  if response.status != 200 or not response.read(65536):
                      raise SystemExit(f"official Kaggle page unavailable: {url}")
          print("CURRENT_KAGGLE_POLICY_REACHABILITY PASS")
          PY

      - name: Recheck live rules, failed source, dataset, target, and CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os, re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest

          api = KaggleApi(); api.authenticate()
          pages = api.competition_list_pages(os.environ["TARGET_COMPETITION"]) or []
          content = {}
          for page in pages:
              data = page.to_dict() if hasattr(page, "to_dict") else dict(page)
              name = str(data.get("name") or "").strip().lower()
              if name:
                  content[name] = str(data.get("content") or "")
          if "rules" not in content or "evaluation" not in content:
              raise SystemExit("live Competition rules/evaluation unavailable")

          def plain(text: str) -> str:
              return re.sub(
                  r"\s+", " ", re.sub(r"<[^>]+>", " ", text.replace(r"\%", "%"))
              ).casefold()

          evaluation = plain(content["evaluation"])
          if not all(term in evaluation for term in ("auc", "novelty", "1%", "false-positive")):
              raise SystemExit("live evaluation contract mismatch")
          rules = plain(content["rules"])
          for phrase in (
              "external data is not allowed", "external data are not allowed",
              "pretrained models are not allowed", "pre-trained models are not allowed",
          ):
              if phrase in rules:
                  raise SystemExit(f"live rule conflict: {phrase}")

          source_state = str(
              getattr(api.kernels_status(os.environ["SOURCE_KERNEL"]), "status", "")
          ).upper()
          if "ERROR" not in source_state and "FAILED" not in source_state:
              raise SystemExit(f"source kernel is no longer failed: {source_state}")
          with api.build_kaggle_client() as client:
              request = ApiGetKernelRequest()
              request.user_name = "renta0426"
              request.kernel_slug = "stage1-raw-fim-submission-v1"
              source = client.kernels.kernels_api_client.get_kernel(request)
          source_version = int(source.metadata.current_version_number)
          if source_version != int(os.environ["EXPECTED_SOURCE_VERSION"]):
              raise SystemExit(f"source kernel version changed: {source_version}")
          if not bool(source.metadata.is_private):
              raise SystemExit("source kernel unexpectedly public")

          existing = api.kernels_list(
              user="renta0426", search="stage1-raw-fim-resume-v1", page_size=5
          ) or []
          if os.environ["TARGET_KERNEL"] in {
              str(getattr(item, "ref", "")) for item in existing
          }:
              raise SystemExit("target continuation kernel already exists")

          active_refs = []
          for item in (api.kernels_list(user="renta0426", sort_by="dateRun", page_size=10) or [])[:10]:
              ref = str(getattr(item, "ref", ""))
              if not ref:
                  continue
              state = str(getattr(api.kernels_status(ref), "status", "")).upper()
              if any(token in state for token in ("RUNNING", "QUEUED", "PENDING")):
                  active_refs.append(ref)

          active_by_resource = {"cpu": [], "gpu": [], "tpu": [], "unknown": []}
          if len(active_refs) > 5:
              active_by_resource["unknown"].extend(active_refs)
          else:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      resource = "unknown"
                      try:
                          owner, slug = ref.split("/", 1)
                          request = ApiGetKernelRequest()
                          request.user_name = owner
                          request.kernel_slug = slug
                          details = client.kernels.kernels_api_client.get_kernel(request)
                          metadata = getattr(details, "metadata", None)
                          if metadata is not None:
                              if bool(getattr(metadata, "enable_tpu", False)):
                                  resource = "tpu"
                              elif bool(getattr(metadata, "enable_gpu", False)):
                                  resource = "gpu"
                              else:
                                  resource = "cpu"
                      except Exception:
                          resource = "unknown"
                      active_by_resource[resource].append(ref)

          same_class = len(active_by_resource[os.environ["REQUESTED_ACCELERATOR"]])
          unknown = len(active_by_resource["unknown"])
          can_launch = same_class + unknown < 1
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"can_launch={'true' if can_launch else 'false'}\n")
          counts = {key: len(value) for key, value in active_by_resource.items()}
          if can_launch:
              print(
                  "RESUME_LIVE_PREFLIGHT PASS source_version=2 source_state=error "
                  f"active_cpu={counts['cpu']} active_gpu={counts['gpu']} "
                  f"active_tpu={counts['tpu']} active_unknown={counts['unknown']}"
              )
          else:
              print(
                  "RESUME_LAUNCH_DEFERRED "
                  f"same_class={same_class} unknown={unknown} "
                  f"nonblocking_gpu={counts['gpu']} nonblocking_tpu={counts['tpu']} "
                  "side_effect=false request_unexecuted=true"
              )
          PY

      - name: Verify the frozen source dataset exposes all 60 feature shards
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          "${WORKDIR}/venv/bin/kaggle" datasets files \
            -d "${SOURCE_DATASET}" -v \
            >"${WORKDIR}/dataset-files.csv" 2>"${WORKDIR}/dataset-files.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/dataset-files.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            rm -f "${WORKDIR}/dataset-files.csv"
            echo "SOURCE_DATASET_LIST FAIL response_logged=false"
            exit 1
          fi
          python3 - "${WORKDIR}/dataset-files.csv" <<'PY'
          import csv, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          rows = list(csv.reader(path.open(newline="", encoding="utf-8-sig")))
          occurrences = sum(
              1 for row in rows[1:]
              if row and "features.part" in row[0] and row[0].endswith(".parquet")
          )
          if occurrences != 60:
              raise SystemExit(f"source dataset feature-shard count changed: {occurrences}")
          print("SOURCE_DATASET_SCHEMA PASS feature_shards=60")
          PY
          rm -f "${WORKDIR}/dataset-files.csv"

      - name: Record deferred CPU admission
        if: steps.admission.outputs.can_launch == 'false'
        shell: bash
        run: |
          set -euo pipefail
          echo "RESUME_LAUNCH_DEFERRED no Kaggle write occurred; request remains unexecuted."
          printf '%s\n' \
            '## Stage1 cached continuation deferred' '' \
            '- A CPU or unclassified active kernel blocked this CPU request.' \
            '- No `kernels push` call was made.' \
            '- A fresh protected-Environment approval is required for a later request.' \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Build and revalidate the CPU-only continuation kernel
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        run: |
          set -euo pipefail
          builder_blob="$(python3 -c 'import json; print(json.load(open("'"${WORKDIR}"'/request.json"))["builder_blob_sha"])')"
          kernel_dir="${WORKDIR}/kernel"
          python3 "${WORKDIR}/builder.py" \
            --output-dir "${kernel_dir}" \
            --builder-blob-sha "${builder_blob}" >/dev/null
          python3 - "${kernel_dir}" <<'PY'
          import ast, json, pathlib, sys
          root = pathlib.Path(sys.argv[1])
          files = sorted(path.name for path in root.iterdir() if path.is_file())
          if files != ["kernel-metadata.json", "stage1-raw-fim-resume-v1.ipynb"]:
              raise SystemExit(f"kernel file allowlist mismatch: {files}")
          metadata = json.loads((root / "kernel-metadata.json").read_text())
          if metadata.get("id") != "renta0426/stage1-raw-fim-resume-v1":
              raise SystemExit("target metadata mismatch")
          if metadata.get("dataset_sources") != [
              "renta0426/stage1-raw-fim-submission-v1-output"
          ]:
              raise SystemExit("source dataset metadata mismatch")
          if metadata.get("enable_gpu") or metadata.get("enable_tpu") or metadata.get("enable_internet"):
              raise SystemExit("continuation kernel must be CPU-only and offline")
          notebook = json.loads((root / "stage1-raw-fim-resume-v1.ipynb").read_text())
          code = "".join(notebook["cells"][1]["source"])
          ast.parse(code)
          if '"token_count", "window_count"' not in code:
              raise SystemExit("length-feature regression fix missing")
          if "EXPECTED_OOF_AUC = 0.664524" not in code:
              raise SystemExit("frozen OOF gate missing")
          print("STAGE1_RESUME_KERNEL_BUILD PASS accelerator=cpu internet=false")
          PY

      - name: Push the audited private CPU notebook exactly once
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push \
            -p "${WORKDIR}/kernel" --timeout 1800 \
            >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?
          set -e
          rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then
            echo "RESUME_KERNEL_LAUNCH FAIL response_logged=false automatic_retries=0"
            exit 1
          fi
          echo "RESUME_KERNEL_LAUNCH PASS request_id=20260903-poisoned-chalice-stage1-resume-001 target=${TARGET_KERNEL} accelerator=cpu internet=false automatic_retries=0 submission=false"

      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo "STAGE1_RESUME_RUNNER_LOCAL_MATERIAL_REMOVED"
