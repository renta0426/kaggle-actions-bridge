name: Poisoned Chalice Stage2 analysis read-only reconciliation

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-stage2-analysis-reconcile.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-stage2-analysis-reconcile.yml

permissions: {}

concurrency:
  group: poisoned-chalice-stage2-analysis-reconcile-${{ github.ref }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET: renta0426/poisoned-chalice-stage2-deployment-analysis-v1
  EXPECTED_VERSION: "1"
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  IDENTITY_PATH: scripts/kaggle_exact_identity.py

jobs:
  validate:
    name: Validate reconciliation is read-only
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Validate triggering workflow without credentials
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          python3 - "${source_sha}" <<'PY'
          import ssl, sys, urllib.request
          sha=sys.argv[1]
          path='.github/workflows/poisoned-chalice-stage2-analysis-reconcile.yml'
          req=urllib.request.Request(f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}',headers={'User-Agent':'kaggle-actions-bridge/1'})
          with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as response:
              text=response.read(32769).decode('utf-8')
          if len(text.encode())>32768: raise SystemExit('workflow byte budget failed')
          forbidden=(
              'kernels_'+'push(',
              'kaggle kernels'+' push',
              'competitions'+' submit',
              'competition_'+'submit(',
          )
          lowered=text.casefold()
          for token in forbidden:
              if token in lowered: raise SystemExit('write marker present')
          required=('environment: kaggle-readonry','exact_metadata_eventually','kernels_status','EXPECTED_VERSION')
          for token in required:
              if token not in text: raise SystemExit('required marker missing')
          print('STAGE2_ANALYSIS_RECONCILE_STATIC PASS writes=0')
          PY

  reconcile:
    name: Reconcile exact Kaggle target without writes
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Read exact target identity, status, and sanitized failure log
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" && "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SHA}" == "${WORKFLOW_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-stage2-analysis-reconcile.yml@refs/heads/main" ]]
          [[ "${RUNNER_ENVIRONMENT}" == "github-hosted" && -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          workdir="${RUNNER_TEMP}/stage2-analysis-reconcile"; rm -rf "${workdir}"; mkdir -p "${workdir}"
          python3 - "${EVENT_SHA}" "${workdir}" <<'PY'
          import pathlib,re,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:];root=pathlib.Path(root_value);ctx=ssl.create_default_context()
          for path,limit in (("requirements/kaggle-2.2.4.lock",65536),("scripts/kaggle_exact_identity.py",32768)):
              req=urllib.request.Request(f"https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}",headers={"User-Agent":"kaggle-actions-bridge/1"})
              with urllib.request.urlopen(req,timeout=30,context=ctx) as response:data=response.read(limit+1)
              if not data or len(data)>limit:raise SystemExit(f"source byte budget failed: {path}")
              dest=root/pathlib.Path(path).name;dest.write_bytes(data)
          lock=(root/'kaggle-2.2.4.lock').read_text()
          pattern=re.compile(r'^[a-z0-9][a-z0-9._-]*==[A-Za-z0-9][A-Za-z0-9._+-]* --hash=sha256:[0-9a-f]{64}$')
          lines=[x.strip() for x in lock.splitlines() if x.strip() and not x.lstrip().startswith('#')]
          if len(lines)!=33 or not all(pattern.fullmatch(x) for x in lines):raise SystemExit('lock validation failed')
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/kaggle-2.2.4.lock" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
          state="$(${workdir}/venv/bin/python - "${workdir}" "${TARGET}" "${EXPECTED_VERSION}" <<'PY'
          import importlib.util,pathlib,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          root=pathlib.Path(sys.argv[1]);target=sys.argv[2];expected=int(sys.argv[3])
          spec=importlib.util.spec_from_file_location('identity',root/'kaggle_exact_identity.py');m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          api=KaggleApi();api.authenticate()
          meta=m.exact_metadata_eventually(api,target,attempts=6,delay_seconds=2.0)
          if getattr(meta,'ref',None)!=target:raise SystemExit('exact ref mismatch')
          version=int(getattr(meta,'current_version_number',0) or 0)
          if version!=expected:raise SystemExit(f'unexpected current version: {version}')
          if getattr(meta,'is_private',None) is not True:raise SystemExit('private flag mismatch')
          if getattr(meta,'enable_gpu',None) is not False or getattr(meta,'enable_tpu',None) is not False:raise SystemExit('CPU resource contract mismatch')
          state=m.status_name(getattr(api.kernels_status(target),'status',None))
          print(state)
          print(f'STAGE2_ANALYSIS_RECONCILE_PRESENT version={version} private=true gpu=false tpu=false state={state}',file=sys.stderr)
          PY
          )"
          echo "STAGE2_ANALYSIS_RECONCILE_STATUS state=${state} writes=0"
          case "${state}" in
            ERROR|CANCELLED|CANCELED)
              diag="${workdir}/diag"; mkdir -p "${diag}"
              set +e
              "${workdir}/venv/bin/kaggle" kernels output "${TARGET}" -p "${diag}" -o --file-pattern '.*\.log$' >/dev/null 2>&1
              out_rc=$?
              set -e
              python3 - "${diag}" "${out_rc}" <<'PY'
          import pathlib,re,sys
          root=pathlib.Path(sys.argv[1]);rc=int(sys.argv[2])
          logs=sorted(root.rglob('*.log'))
          print(f'STAGE2_ANALYSIS_LOG_FETCH rc={rc} log_files={len(logs)}')
          if not logs: raise SystemExit(0)
          text='\n'.join(p.read_text(encoding='utf-8',errors='replace') for p in logs)
          lines=text.splitlines();tokens=('traceback','error','exception','failed','assertion','filenotfound','keyerror','valueerror','runtimeerror')
          hits=[i for i,line in enumerate(lines) if any(t in line.casefold() for t in tokens)]
          if not hits: raise SystemExit(0)
          i=hits[-1];window=lines[max(0,i-12):min(len(lines),i+8)]
          for line in window:
              line=re.sub(r'KGAT_[A-Za-z0-9._-]+','[REDACTED_TOKEN]',line)
              line=re.sub(r'https?://\S+','[REDACTED_URL]',line)
              print('STAGE2_ANALYSIS_LOG_DIAG '+line[:600])
          PY
              ;;
            COMPLETE|RUNNING|QUEUED|PENDING)
              :
              ;;
            *)
              echo "unknown reconciled state" >&2; exit 1
              ;;
          esac
          rm -rf "${workdir}"
