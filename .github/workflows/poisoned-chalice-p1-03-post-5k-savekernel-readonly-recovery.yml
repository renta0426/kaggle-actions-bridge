name: Poisoned Chalice P1-03 SaveKernel read-only recovery

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-post-5k-savekernel-readonly-recovery.yml
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-post-5k-savekernel-readonly-recovery.yml

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/poisoned-chalice-p1-03-post-5k-development-audit-v1.json
  IDENTITY_PATH: scripts/kaggle_exact_identity.py
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET: renta0426/poisoned-chalice-p1-03-post-5k-development-audit-v1

jobs:
  validate:
    name: Validate recovery is read-only without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free recovery boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: $name"; exit 1; }
          done
          echo "P1_03_SAVEKERNEL_RECOVERY_VALIDATE PASS write_calls=0 compute_calls=0"

  recover:
    name: Reconcile failed SaveKernel attempt read-only
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$EVENT_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-p1-03-post-5k-savekernel-readonly-recovery.yml@refs/heads/main" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          echo "P1_03_SAVEKERNEL_RECOVERY_BOUNDARY PASS read_only=1 write_calls=0"

      - name: Fetch frozen request, identity helper, and locked Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=$workdir" >> "$GITHUB_ENV"
          python3 - "$EVENT_SHA" "$workdir" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]
          root=pathlib.Path(root_value)
          files={
            'requests/poisoned-chalice-p1-03-post-5k-development-audit-v1.json':65536,
            'scripts/kaggle_exact_identity.py':65536,
            'requirements/kaggle-2.2.4.lock':65536,
          }
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for path,maximum in files.items():
              url=f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}'
              req=urllib.request.Request(url,headers={'User-Agent':'p1-03-savekernel-recovery/1'})
              with opener.open(req,timeout=30) as response:data=response.read(maximum+1)
              if not data or len(data)>maximum:raise SystemExit(f'bridge source byte budget failed:{path}')
              out=root/pathlib.Path(path).name
              out.write_bytes(data)
              if path.endswith('.py'):compile(data,path,'exec')
          PY
          python3 -m venv "$workdir/venv"
          "$workdir/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "$workdir/kaggle-2.2.4.lock" >/dev/null
          "$workdir/venv/bin/python" -m pip check >/dev/null
          "$workdir/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Reconcile target identity and execution state without writes
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/poisoned-chalice-p1-03-post-5k-development-audit-v1.json" <<'PY'
          import json,sys,time
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import exact_metadata, safe_exception, status_name

          request=json.load(open(sys.argv[1]))
          target='renta0426/poisoned-chalice-p1-03-post-5k-development-audit-v1'
          if request.get('request_id')!='20260910-poisoned-chalice-p1-03-post-5k-development-audit-v1-001':raise SystemExit('request id changed')
          if request.get('target')!=target:raise SystemExit('target changed')
          if request.get('automatic_compute_retries')!=0 or request.get('competition_submission') is not False:raise SystemExit('write contract changed')
          api=KaggleApi(); api.authenticate()
          owner,slug=target.split('/',1)

          exact_meta=None; exact_http=None
          try:
              exact_meta=exact_metadata(api,target)
          except Exception as exc:
              exact_http=safe_exception(exc).get('http_status')
              if exact_http not in (403,404):raise SystemExit(f'exact target reconciliation failed: http={exact_http}')

          visible=None
          for attempt in range(3):
              visible=api.kernels_list(user=owner,search=slug,page_size=100) or []
              if any(str(getattr(item,'ref','') or '')==target for item in visible):break
              if attempt<2:time.sleep(2)
          if len(visible)>=100:raise SystemExit('owner target search saturated; reconciliation ambiguous')
          matches=[item for item in visible if str(getattr(item,'ref','') or '')==target]

          if not matches and exact_meta is None:
              recent=api.kernels_list(user=owner,sort_by='dateRun',page_size=25) or []
              exact_recent=[str(getattr(item,'ref','') or '') for item in recent if str(getattr(item,'ref','') or '')==target]
              if exact_recent:raise SystemExit('target appeared in recent list but not exact slug search')
              print(f'P1_03_SAVEKERNEL_RECOVERY RESULT target_exists=0 version=0 status=ABSENT cpu_run_started=0 write_observed=0 exact_http={exact_http} search_rows={len(visible)}')
              raise SystemExit(0)

          if len(matches)>1:raise SystemExit('duplicate exact target refs observed')
          discovered=matches[0] if matches else None
          if exact_meta is None:
              # One final exact read after authenticated owner discovery.
              try: exact_meta=exact_metadata(api,target)
              except Exception as exc:
                  exact_http=safe_exception(exc).get('http_status')

          status_raw=getattr(api.kernels_status(target),'status',None)
          try: status=status_name(status_raw)
          except Exception: status=str(getattr(status_raw,'name',status_raw) or 'UNKNOWN').upper()

          def first_value(*names):
              for obj in (exact_meta,discovered):
                  if obj is None:continue
                  for name in names:
                      value=getattr(obj,name,None)
                      if value is not None:return value
              return None
          version=first_value('current_version_number','currentVersionNumber','version_number','versionNumber')
          private=first_value('is_private','isPrivate')
          gpu=first_value('enable_gpu','enableGpu')
          tpu=first_value('enable_tpu','enableTpu')
          internet=first_value('enable_internet','enableInternet')
          cpu=(gpu is False and tpu is False)
          started=status in {'QUEUED','RUNNING','PENDING','COMPLETE','ERROR','CANCELLED','CANCELED'}
          print('P1_03_SAVEKERNEL_RECOVERY RESULT '
                f'target_exists=1 version={version} status={status} cpu_run_started={int(bool(started and cpu))} '
                f'write_observed=1 private={private} gpu={gpu} tpu={tpu} internet={internet} exact_http={exact_http}')
          PY

      - name: Cleanup read-only recovery material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
          echo "P1_03_SAVEKERNEL_RECOVERY_CLEANUP PASS write_calls=0"
