name: CMI-Flu strategy E06a Task2.3 calibration CPU 002

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/189-cmi-flu-strategy-e06a-task23-calibration-002.yml
      - .github/workflows/188-cmi-flu-strategy-e06a-task23-calibration-001.yml
      - requests/cmi-flu-strategy-e06a-task23-calibration-002.json
      - payloads/cmi-flu-strategy-e06a-task23-calibration-001/strategy_e06.py
      - payloads/cmi-flu-strategy-e06a-task23-calibration-002/strategy_e06_v2.py
      - scripts/cmi_flu_strategy_e06a_prepare.py
      - scripts/cmi_flu_strategy_e06a_prepare_v2.py
      - scripts/cmi_flu_strategy_e06a_execute.py
      - scripts/cmi_flu_strategy_e06a_execute_v2.py
      - scripts/cmi_flu_strategy_e06a_sanitize_v2.py
      - scripts/cmi_flu_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_frozen_runtime_v2.py
      - scripts/test_cmi_e06a_real_reference.py
      - scripts/test_cmi_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_watcher_contract.py
      - scripts/test_cmi_e06a_v2_executor_contract.py
      - scripts/kaggle_exact_identity.py
      - scripts/kaggle_current_output_read.py
      - scripts/test_kaggle_exact_identity_eventual.py
      - scripts/cmi_flu_inspect_locked_hai_reference_schema.py
  pull_request:
    paths:
      - .github/workflows/189-cmi-flu-strategy-e06a-task23-calibration-002.yml
      - .github/workflows/188-cmi-flu-strategy-e06a-task23-calibration-001.yml
      - requests/cmi-flu-strategy-e06a-task23-calibration-002.json
      - payloads/cmi-flu-strategy-e06a-task23-calibration-001/strategy_e06.py
      - payloads/cmi-flu-strategy-e06a-task23-calibration-002/strategy_e06_v2.py
      - scripts/cmi_flu_strategy_e06a_prepare.py
      - scripts/cmi_flu_strategy_e06a_prepare_v2.py
      - scripts/cmi_flu_strategy_e06a_execute.py
      - scripts/cmi_flu_strategy_e06a_execute_v2.py
      - scripts/cmi_flu_strategy_e06a_sanitize_v2.py
      - scripts/cmi_flu_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_frozen_runtime_v2.py
      - scripts/test_cmi_e06a_real_reference.py
      - scripts/test_cmi_e06a_safe_failure_site.py
      - scripts/test_cmi_e06a_watcher_contract.py
      - scripts/test_cmi_e06a_v2_executor_contract.py
      - scripts/kaggle_exact_identity.py
