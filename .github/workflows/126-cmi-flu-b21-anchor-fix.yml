name: repair-cmi-flu-b21-anchor

on:
  push:
    branches: [feat/cmi-flu-b21-eval-001]
    paths: [.github/workflows/126-cmi-flu-b21-anchor-fix.yml]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/cmi-flu-b21-eval-001
          persist-credentials: true
          fetch-depth: 1
      - name: Replace exactly one incorrect function-boundary anchor
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/cmi_flu_b21_scientific_patch.py')
          text = path.read_text(encoding='utf-8')
          old = 'replace_between(path, "def run_compact_task(\\n", "def _post_hai_metrics(\\n", compact)'
          new = 'replace_between(path, "def run_compact_task(\\n", "def _resolve_hai_panel(\\n", compact)'
          if text.count(old) != 1:
              raise SystemExit(f'old anchor count={text.count(old)}')
          text = text.replace(old, new, 1)
          if old in text or text.count(new) != 1:
              raise SystemExit('anchor replacement verification failed')
          compile(text, str(path), 'exec')
          path.write_text(text, encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/cmi_flu_b21_scientific_patch.py
          git commit -m "fix: use actual post-compact evaluation boundary"
          git push origin HEAD:feat/cmi-flu-b21-eval-001
