name: Poisoned Chalice Mellum transfer v1 request003 source-contract static

on:
  push:
    branches:
      - fix/poisoned-chalice-mellum-request003
    paths:
      - requests/poisoned-chalice-mellum-transfer-v1-launch-v3.json
      - scripts/poisoned_chalice_mellum_launch_v3.py
      - scripts/poisoned_chalice_mellum_transfer_builder_v2.py
      - .github/workflows/123-poisoned-chalice-mellum-transfer-v1-v3-static.yml
  pull_request:
    paths:
      - requests/poisoned-chalice-mellum-transfer-v1-launch-v3.json
      - scripts/poisoned_chalice_mellum_launch_v3.py
      - scripts/poisoned_chalice_mellum_transfer_builder_v2.py
      - .github/workflows/123-poisoned-chalice-mellum-transfer-v1-v3-static.yml

permissions: {}

jobs:
  source-contract-static:
    name: Build from exact-structure clean-room source fixture
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free boundary
        shell: bash
        run: |
          set -euo pipefail
          [[ "${{ runner.environment }}" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY RESEARCH_REPO_READ_TOKEN AWS_ACCESS_KEY_ID AZURE_CLIENT_SECRET; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Fetch exact bridge code and create clean-room structural fixture
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          source_sha="${EVENT_SHA}"
          if [[ "${EVENT_NAME}" == "pull_request" ]]; then source_sha="${PR_HEAD_SHA}"; fi
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${source_sha}" "${workdir}" <<'PY'
          from __future__ import annotations
          import json
          import pathlib
          import ssl
          import sys
          import urllib.request

          sha, root_value = sys.argv[1:]
          root = pathlib.Path(root_value)
          context = ssl.create_default_context()

          def read(url: str, limit: int) -> bytes:
              request = urllib.request.Request(url, headers={"User-Agent": "kaggle-actions-bridge/1"})
              with urllib.request.urlopen(request, timeout=30, context=context) as response:
                  data = response.read(limit + 1)
              if len(data) > limit:
                  raise SystemExit("bridge source exceeds byte budget")
              return data

          bridge = "https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/" + sha + "/"
          files = {
              "scripts/poisoned_chalice_mellum_transfer_builder_v2.py": 32768,
              "scripts/poisoned_chalice_mellum_transfer_builder.py": 131072,
              "scripts/poisoned_chalice_nbformat_minimal.py": 32768,
              "scripts/poisoned_chalice_mellum_launch_v3.py": 131072,
          }
          for path, limit in files.items():
              destination = root / path
              destination.parent.mkdir(parents=True, exist_ok=True)
              destination.write_bytes(read(bridge + path, limit))

          languages = ("Go", "Java", "Python", "Ruby", "Rust")
          records = []
          ordinal = 0
          for language in languages:
              for label in (0, 1):
                  membership = "member" if label else "non-member"
                  for _ in range(200):
                      digest = f"{ordinal:064x}"
                      records.append({
                          "sample_id": f"fixture-{ordinal:04d}",
                          "content_sha256": digest,
                          "source_row_index": ordinal,
                          "language": language,
                          "membership": membership,
                          "label": label,
                          "split_role": "eval",
                      })
                      ordinal += 1

          starter = '''
class StarterPlusConfig:
    pass

def make_window_records(*args, **kwargs):
    pass

def aggregate_windows(*args, **kwargs):
    pass

def extract_window_features(*args, **kwargs):
    pass

def helper():
    best_local_64 = 64
'''
          feature_cache = '''
class FeatureCacheV2Config:
    pass

def extract_window_features_optimized(*args, **kwargs):
    pass

def compare_feature_frames(*args, **kwargs):
    pass

def frozen_summary(correct_z, percent, summary):
    rank_vocab_block_size = 8192
    summary[f"min_kpp_zselect_{percent:02d}"] = 0.0
'''
          setup = (
              "MODEL_ID = 'bigcode/starcoder2-7b'\n"
              "MODEL_REVISION = 'bb9afde76d7945da5745592525db122d4d729eb1'\n"
              "TRANSFER_MANIFEST = pd.DataFrame(" + repr(records) + ")\n"
          )
          notebook = {
              "nbformat": 4,
              "nbformat_minor": 5,
              "metadata": {},
              "cells": [
                  {"cell_type": "code", "metadata": {}, "source": starter, "outputs": [], "execution_count": None},
                  {"cell_type": "code", "metadata": {}, "source": feature_cache, "outputs": [], "execution_count": None},
                  {"cell_type": "code", "metadata": {}, "source": setup, "outputs": [], "execution_count": None},
              ],
          }
          (root / "source.ipynb").write_text(json.dumps(notebook), encoding="utf-8")
          PY

      - name: Exercise corrected builder on the exact-structure fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORKDIR}/tool" "${WORKDIR}/out"
          cp "${WORKDIR}/scripts/poisoned_chalice_nbformat_minimal.py" "${WORKDIR}/tool/nbformat.py"
          PYTHONPATH="${WORKDIR}/tool" python3 \
            "${WORKDIR}/scripts/poisoned_chalice_mellum_transfer_builder_v2.py" \
            --source-notebook "${WORKDIR}/source.ipynb" \
            --output-dir "${WORKDIR}/out" \
            --base-builder "${WORKDIR}/scripts/poisoned_chalice_mellum_transfer_builder.py" \
            >"${WORKDIR}/builder.stdout" 2>"${WORKDIR}/builder.stderr"
          python3 - "${WORKDIR}" <<'PY'
          from __future__ import annotations
          import ast
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          stdout = (root / "builder.stdout").read_text(encoding="utf-8")
          if "MELLUM_BUILDER_V2 PASS correction=generated_fstring_marker_only" not in stdout:
              raise SystemExit("corrected builder success marker missing")
          notebook_path = root / "out/mellum-transfer-v1.ipynb"
          metadata_path = root / "out/kernel-metadata.json"
          if not notebook_path.is_file() or not metadata_path.is_file():
              raise SystemExit("corrected builder did not produce target bundle")
          notebook = json.loads(notebook_path.read_text(encoding="utf-8"))
          metadata = json.loads(metadata_path.read_text(encoding="utf-8"))
          if len(notebook.get("cells", [])) != 9:
              raise SystemExit("target Notebook cell count changed")
          if metadata.get("id") != "renta0426/mellum-transfer-v1":
              raise SystemExit("target id changed")
          if metadata.get("machine_shape") != "NvidiaTeslaT4" or not metadata.get("enable_gpu") or metadata.get("enable_tpu"):
              raise SystemExit("target accelerator metadata changed")
          records = None
          joined = []
          for cell in notebook["cells"]:
              if cell.get("cell_type") != "code":
                  continue
              source = cell.get("source", "")
              source = "".join(source) if isinstance(source, list) else str(source)
              joined.append(source)
              if "PREDICTION_MANIFEST = pd.DataFrame(" not in source:
                  continue
              for node in ast.parse(source).body:
                  if isinstance(node, ast.Assign) and any(
                      isinstance(target, ast.Name) and target.id == "PREDICTION_MANIFEST"
                      for target in node.targets
                  ):
                      records = ast.literal_eval(node.value.args[0])
          allowed = {"sample_id", "content_sha256", "language", "sample_index"}
          if not isinstance(records, list) or len(records) != 2000:
              raise SystemExit("prediction manifest row count changed")
          if any(set(row) != allowed for row in records):
              raise SystemExit("label or unexpected field crossed prediction boundary")
          text = "\n".join(joined)
          for marker in (
              "JetBrains/Mellum-4b-base",
              "83cce2605fbdf6a3868627e9b0a5924e0072b94d",
              "min_kpp_zselect_10__max",
              "best_local_64__max",
          ):
              if marker not in text:
                  raise SystemExit(f"target scientific marker missing: {marker}")
          print("MELLUM_V3_SOURCE_CONTRACT_FIXTURE PASS rows=2000 labels_embedded=false")
          PY

      - name: Unit-check resource-class admission primitives
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/scripts/poisoned_chalice_mellum_launch_v3.py" <<'PY'
          from __future__ import annotations
          import importlib.util
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          spec = importlib.util.spec_from_file_location("mellum_v3", path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          assert module.classify_kernel_resource({"enable_gpu": True, "enable_tpu": False, "machine_shape": "NvidiaTeslaT4"}) == "gpu"
          assert module.classify_kernel_resource({"enable_gpu": False, "enable_tpu": True, "machine_shape": "TpuV6E8"}) == "tpu"
          assert module.classify_kernel_resource({"enable_gpu": False, "enable_tpu": False, "machine_shape": ""}) == "cpu"
          try:
              module.classify_kernel_resource({})
          except RuntimeError:
              pass
          else:
              raise SystemExit("unknown resource metadata must fail closed")
          commands = module.literal_commands(path.read_text(encoding="utf-8"))
          pushes = sum(module.has_pair(command, "kernels", "push") for command in commands)
          if pushes != 1:
              raise SystemExit(f"expected one kernels push, got {pushes}")
          print("MELLUM_V3_RESOURCE_CLASS_STATIC PASS gpu_block cpu_tpu_allow unknown_fail_closed")
          PY

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
