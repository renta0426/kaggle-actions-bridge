name: Dispatch CMI-Flu V3-07 consumed readout once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/268-cmi-flu-v3-v07-consumed-readout-dispatch-once.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    if: >-
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.actor == 'renta0426' &&
      startsWith(github.event.head_commit.message, 'Dispatch CMI-Flu V3-07 consumed readout once')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Dispatch one protected exact-title read-only inspection
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh api --method POST "/repos/${REPOSITORY}/actions/workflows/267-cmi-flu-v3-v07-consumed-readout.yml/dispatches" -f ref=main
          echo 'V3-07 exact-title successor readout dispatch accepted. The protected job is read-only and requires kaggle-readonry approval.'
