name: CMI-Flu V3 batch1 read-only reconciliation 001

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-v3-batch1-readonly-reconcile-001.yml
      - requests/cmi-flu-v3-batch1-readonly-reconcile-001.json
      - scripts/cmi_flu_v3_batch1_readonly_reconcile.py
      - scripts/cmi_flu_v3_batch1_readonly_reconcile_ci.py
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-v3-batch1-readonly-reconcile-001.yml
      - requests/cmi-flu-v3-batch1-readonly-reconcile-001.json
      - scripts/cmi_flu_v3_batch1_readonly_reconcile.py
      - scripts/cmi_flu_v3_batch1_readonly_reconcile_ci.py

permissions: {}

concurrency:
  group: cmi-flu-v3-batch1-readonly-reconcile-001-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260912-cmi-flu-v3-batch1-readonly-reconcile-001
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate V3 reconciliation without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-v3-reconcile-ci/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(80_000_001)
          if not data or len(data)>80_000_000: raise SystemExit("bridge archive byte budget failed")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Run credential-free reconciliation regression
        shell: bash
        run: |
          set -euo pipefail
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_readonly_reconcile_ci.py" --repository-root "${WORKDIR}/bridge"
          python3 "${WORKDIR}/bridge/scripts/kaggle_launch_policy_v2.py" request "${WORKDIR}/bridge/requests/cmi-flu-v3-batch1-readonly-reconcile-001.json" --require-v2
          python3 "${WORKDIR}/bridge/scripts/kaggle_launch_policy_v2.py" workflow "${WORKDIR}/bridge/.github/workflows/cmi-flu-v3-batch1-readonly-reconcile-001.yml"

      - name: Validate locked client and reconciliation self-test without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_readonly_reconcile.py" --self-test
          echo 'CMI_FLU_V3_BATCH1_RECONCILE_VALIDATION PASS auth=false read_only=true writes=0 competition_submit=false'

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"

  reconcile:
    name: Reconcile ambiguous V3 batch1 write read-only
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-v3-batch1-readonly-reconcile-001.yml@refs/heads/main" ]]
          echo 'CMI_FLU_V3_BATCH1_RECONCILE_PROTECTED PASS read_only=true writes=0 competition_submit=false'

      - name: Materialize exact bridge commit
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "$GITHUB_ENV"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-v3-reconcile-protected/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(80_000_001)
          if not data or len(data)>80_000_000: raise SystemExit("bridge archive byte budget failed")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split('/',1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip('/').endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if not rel.parts or '..' in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Reconcile candidate kernels without writes
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_readonly_reconcile.py" --output-dir "${WORKDIR}/safe-result"

      - name: Emit aggregate-safe recovered result when present
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d "${WORKDIR}/safe-result" ]]; then
            python3 "${WORKDIR}/bridge/scripts/cmi_flu_v3_batch1_sanitize.py" --input-dir "${WORKDIR}/safe-result"
          else
            echo 'CMI_FLU_V3_BATCH1_RECONCILE_SANITIZE SKIP recovered=false'
          fi

      - name: Cleanup runner-local reconciliation content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
          echo 'CMI_FLU_V3_BATCH1_RECONCILE_CLEANUP PASS private_output_not_persisted=true writes=0'
