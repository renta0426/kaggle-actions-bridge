name: CMI-Flu Phase A B1 vs B2.1 CPU launch v3

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/128-cmi-flu-phase-a-launch-v3.yml
      - requests/cmi-flu-phase-a-launch-v3.json
      - scripts/cmi_flu_phase_a_patch_v3.py
  pull_request:
    paths:
      - .github/workflows/128-cmi-flu-phase-a-launch-v3.yml
      - requests/cmi-flu-phase-a-launch-v3.json
      - scripts/cmi_flu_phase_a_patch_v3.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-phase-a-launch-v3.json
  B21_REQUEST_PATH: requests/cmi-flu-b21-launch-v1.json
  BASE_REQUEST_PATH: requests/cmi-flu-b2-launch-v4.json
  BASE_PATCHER_PATH: scripts/cmi_flu_b2_patch_v4.py
  B21_PATCHER_PATH: scripts/cmi_flu_b21_patch.py
  B21_ADAPTER_PATH: scripts/cmi_flu_b21_runtime_adapter.py
  PHASE_A_PATCHER_V1_PATH: scripts/cmi_flu_phase_a_patch.py
  PHASE_A_PATCHER_V2_PATH: scripts/cmi_flu_phase_a_patch_v2.py
  PHASE_A_PATCHER_V3_PATH: scripts/cmi_flu_phase_a_patch_v3.py
  BASE_PAYLOAD_DIR: payloads/cmi-flu-b2-broad-004
  PHASE_A_PAYLOAD_DIR: payloads/cmi-flu-phase-a-001
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_COMPETITION: cmi-flu-first-prediction-challenge
  TARGET_KERNEL: renta0426/cmi-flu-phase-a-b1-vs-b2-1-20260904-003
  TARGET_SLUG: cmi-flu-phase-a-b1-vs-b2-1-20260904-003
  EXPECTED_PHASE_A_BLOB: bd9351a2857bc0964309ca117f60c766354066a0
  EXPECTED_PHASE_A_PACKAGE_SHA256: e656f6cd355d4065c8340007e5493d80d38e6fca0e300cfd2b781096dfa6b1fd
  EXPECTED_B21_ADAPTER_BLOB: de71dea0e335bdcd79325c0de926bf8848d0979f
  EXPECTED_BASE_SHA256: 7894a9232e7372950f70a36d35de41bcc8bda90ec4d0320187e82c3b8c76f2db
  EXPECTED_BASE_SIZE: "93363"

jobs:
  validate:
    name: Validate immutable Phase A request 003
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce secret-free validation boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Validate manifest and immutable inputs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, pathlib
          root=pathlib.Path('.')
          request=json.loads((root/os.environ['REQUEST_PATH']).read_text(encoding='utf-8'))
          allowed={
              'schema_version','request_id','competition','operation','target','purpose',
              'science_source_commit','phase_a_source_blob_sha','phase_a_package_zip_sha256',
              'b21_base_request_id','failed_request_id','failed_request_error','resource',
              'api_budget','side_effects','competition_submission_attempted',
              'automatic_compute_retries','enable_internet','rules_checked_at_utc'
          }
          if set(request) != allowed: raise SystemExit(f'Phase A 003 manifest fields mismatch: {sorted(set(request)^allowed)}')
          if request['schema_version'] != 1 or request['request_id'] != '20260904-cmi-flu-phase-a-003': raise SystemExit('Phase A 003 identity mismatch')
          if request['competition'] != os.environ['TARGET_COMPETITION'] or request['target'] != os.environ['TARGET_KERNEL'] or request['operation'] != 'kernel_run': raise SystemExit('Phase A 003 target mismatch')
          if request['science_source_commit'] != '0282262e049683135ec01a56f71b44a46356b194': raise SystemExit('Phase A 003 science provenance mismatch')
          if request['phase_a_source_blob_sha'] != os.environ['EXPECTED_PHASE_A_BLOB'] or request['phase_a_package_zip_sha256'] != os.environ['EXPECTED_PHASE_A_PACKAGE_SHA256']: raise SystemExit('Phase A 003 source/package mismatch')
          if request['b21_base_request_id'] != '20260903-cmi-flu-b21-001' or request['failed_request_id'] != '20260904-cmi-flu-phase-a-002': raise SystemExit('Phase A 003 lineage mismatch')
          if request['competition_submission_attempted'] is not False or request['automatic_compute_retries'] != 0 or request['enable_internet'] is not False: raise SystemExit('Phase A 003 safety mismatch')
          if request['resource'] != {'accelerator':'cpu','expected_runtime_minutes':120,'hard_timeout_minutes':240,'max_active_runs':1}: raise SystemExit('Phase A 003 resource mismatch')
          if request['api_budget'] != {'max_calls':20,'poll_interval_seconds':900,'max_pages':2}: raise SystemExit('Phase A 003 API budget mismatch')
          adapter=(root/os.environ['B21_ADAPTER_PATH']).read_bytes()
          adapter_blob=hashlib.sha1(b'blob '+str(len(adapter)).encode()+b'\0'+adapter).hexdigest()
          if adapter_blob != os.environ['EXPECTED_B21_ADAPTER_BLOB']: raise SystemExit('B2.1 adapter blob mismatch')
          phase=(root/f"{os.environ['PHASE_A_PAYLOAD_DIR']}/part-00").read_bytes().rstrip(b'\n')+b'\n'+(root/f"{os.environ['PHASE_A_PAYLOAD_DIR']}/part-01").read_bytes().lstrip(b'\n').rstrip(b'\n')+b'\n'
          phase_blob=hashlib.sha1(b'blob '+str(len(phase)).encode()+b'\0'+phase).hexdigest()
          if phase_blob != os.environ['EXPECTED_PHASE_A_BLOB']: raise SystemExit('staged Phase A source blob mismatch')
          base=b''.join((root/f"{os.environ['BASE_PAYLOAD_DIR']}/part-{i:02d}").read_bytes() for i in range(20))
          if len(base) != int(os.environ['EXPECTED_BASE_SIZE']) or hashlib.sha256(base).hexdigest() != os.environ['EXPECTED_BASE_SHA256']: raise SystemExit('B2 004 base payload mismatch')
          pathlib.Path('/tmp/base-source.py').write_bytes(base)
          PY

      - name: Build and statically smoke-test Phase A v3 runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 "${BASE_PATCHER_PATH}" --source /tmp/base-source.py --request "${BASE_REQUEST_PATH}" --output /tmp/base004.py
          python3 "${B21_PATCHER_PATH}" --source /tmp/base004.py --adapter "${B21_ADAPTER_PATH}" --request "${B21_REQUEST_PATH}" --output /tmp/b21.py
          python3 "${PHASE_A_PATCHER_V3_PATH}" --source /tmp/b21.py --parts-dir "${PHASE_A_PAYLOAD_DIR}" --request "${REQUEST_PATH}" --output /tmp/script.py
          python3 -W error::SyntaxWarning -m py_compile "${PHASE_A_PATCHER_V1_PATH}" "${PHASE_A_PATCHER_V2_PATH}" "${PHASE_A_PATCHER_V3_PATH}" /tmp/script.py
          python3 /tmp/script.py --self-test
          grep -F 'REQUEST_ID = "20260904-cmi-flu-phase-a-003"' /tmp/script.py >/dev/null
          grep -F 'models.summarize_metric_frame = metric_summary' /tmp/script.py >/dev/null
          grep -F 'def json_safe(value: Any) -> Any:' /tmp/script.py >/dev/null
          grep -F 'TARGET_STAGE = "phase_a_b1_vs_b21_same_contract"' /tmp/script.py >/dev/null
          python3 - <<'PY'
          import pathlib
          ns={'__name__':'phase_a_static_preflight'}
          exec(compile(pathlib.Path('/tmp/script.py').read_text(encoding='utf-8'),'/tmp/script.py','exec'),ns,ns)
          helper=ns.get('json_safe')
          if not callable(helper): raise SystemExit('json_safe missing after module load')
          import numpy as np
          out=helper({'nan':float('nan'),'integer':np.int64(7),'values':(np.float64(1.5),)})
          if out != {'nan':None,'integer':7,'values':[1.5]}: raise SystemExit(f'json_safe smoke mismatch: {out!r}')
          print('PHASE_A_JSON_SAFE_PREFLIGHT PASS')
          PY
          echo 'CMI_FLU_PHASE_A_003_VALIDATE PASS'

      - name: Confirm current public Kaggle policy pages are reachable
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import ssl, urllib.request
          for url in ('https://www.kaggle.com/terms','https://www.kaggle.com/aup','https://www.kaggle.com/community-guidelines','https://www.kaggle.com/docs/api'):
              req=urllib.request.Request(url,headers={'User-Agent':'kaggle-actions-bridge/1'})
              with urllib.request.urlopen(req,timeout=30,context=ssl.create_default_context()) as response:
                  if response.status != 200 or not response.read(65536): raise SystemExit(f'official Kaggle page unavailable: {url}')
          print('CURRENT_KAGGLE_POLICY_REACHABILITY PASS')
          PY

  launch:
    name: Admit or launch exactly one Phase A CPU run 003
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact approved commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_REPOSITORY_ID}" == "${EXPECTED_REPOSITORY_ID}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/128-cmi-flu-phase-a-launch-v3.yml@refs/heads/main" ]]
          [[ "$(git rev-parse HEAD)" == "${EVENT_SHA}" ]]
          echo 'PROTECTED_CMI_FLU_PHASE_A_003_BOUNDARY PASS'

      - name: Prepare locked Kaggle CLI and exact Phase A v3 script
        shell: bash
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}" <<'PY'
          import hashlib,os,pathlib,sys
          root=pathlib.Path('.')
          out=pathlib.Path(sys.argv[1])
          base=b''.join((root/f"{os.environ['BASE_PAYLOAD_DIR']}/part-{i:02d}").read_bytes() for i in range(20))
          if len(base)!=int(os.environ['EXPECTED_BASE_SIZE']) or hashlib.sha256(base).hexdigest()!=os.environ['EXPECTED_BASE_SHA256']: raise SystemExit('B2 004 base payload mismatch')
          (out/'base-source.py').write_bytes(base)
          phase=(root/f"{os.environ['PHASE_A_PAYLOAD_DIR']}/part-00").read_bytes().rstrip(b'\n')+b'\n'+(root/f"{os.environ['PHASE_A_PAYLOAD_DIR']}/part-01").read_bytes().lstrip(b'\n').rstrip(b'\n')+b'\n'
          phase_blob=hashlib.sha1(b'blob '+str(len(phase)).encode()+b'\0'+phase).hexdigest()
          if phase_blob!=os.environ['EXPECTED_PHASE_A_BLOB']: raise SystemExit('Phase A source blob mismatch')
          PY
          python3 "${BASE_PATCHER_PATH}" --source "${WORKDIR}/base-source.py" --request "${BASE_REQUEST_PATH}" --output "${WORKDIR}/base004.py"
          python3 "${B21_PATCHER_PATH}" --source "${WORKDIR}/base004.py" --adapter "${B21_ADAPTER_PATH}" --request "${B21_REQUEST_PATH}" --output "${WORKDIR}/b21.py"
          python3 "${PHASE_A_PATCHER_V3_PATH}" --source "${WORKDIR}/b21.py" --parts-dir "${PHASE_A_PAYLOAD_DIR}" --request "${REQUEST_PATH}" --output "${WORKDIR}/script.py"
          python3 -W error::SyntaxWarning -m py_compile "${WORKDIR}/script.py"
          python3 "${WORKDIR}/script.py" --self-test
          grep -F 'def json_safe(value: Any) -> Any:' "${WORKDIR}/script.py" >/dev/null
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null

      - name: Fetch live Competition rules and determine CPU admission
        id: admission
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os,re
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          api=KaggleApi(); api.authenticate()
          pages=api.competition_list_pages(os.environ['TARGET_COMPETITION']) or []
          content={}
          for page in pages:
              d=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(d.get('name') or '').strip().lower()
              if name: content[name]=str(d.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in k for k in content): raise SystemExit('live Competition pages unavailable')
          plain=lambda s: re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',s)).casefold()
          rules=plain(content['rules']); evaluation=plain(content['evaluation']); data=' '.join(plain(content[k]) for k in content if 'data' in k)
          if not all(x in rules for x in ('maximum of five (5) submissions per day','maximum team size is five (5)','data security','external data and tools')): raise SystemExit('live rules differ from guardrails')
          if not all(x in evaluation for x in ('mean spearman correlation','40 donors','-99')): raise SystemExit('live evaluation differs from guardrails')
          if 'sample_submission_part1.csv' not in data or 'investigations_260821.tsv' not in data: raise SystemExit('live data description differs')
          existing=api.kernels_list(user='renta0426',search=os.environ['TARGET_SLUG'],page_size=5) or []
          if os.environ['TARGET_KERNEL'] in {str(getattr(x,'ref','')) for x in existing}: raise SystemExit('target kernel already exists; duplicate refused')
          active_refs=[]
          for item in (api.kernels_list(user='renta0426',sort_by='dateRun',page_size=15) or [])[:15]:
              ref=str(getattr(item,'ref',''))
              if not ref: continue
              try: status=str(getattr(api.kernels_status(ref),'status','')).upper()
              except Exception: continue
              if any(t in status for t in ('RUNNING','QUEUED','PENDING')): active_refs.append(ref)
          active={'cpu':[],'gpu':[],'tpu':[],'unknown':[]}
          if len(active_refs)>5: active['unknown'].extend(active_refs)
          else:
              with api.build_kaggle_client() as client:
                  for ref in active_refs:
                      resource='unknown'
                      try:
                          owner,slug=ref.split('/',1); req=ApiGetKernelRequest(); req.user_name=owner; req.kernel_slug=slug
                          meta=client.kernels.kernels_api_client.get_kernel(req).metadata
                          resource='tpu' if bool(getattr(meta,'enable_tpu',False)) else ('gpu' if bool(getattr(meta,'enable_gpu',False)) else 'cpu')
                      except Exception: pass
                      active[resource].append(ref)
          can=len(active['cpu'])+len(active['unknown'])<1
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f: f.write(f"can_launch={'true' if can else 'false'}\n")
          print(f"PHASE_A_003_ADMISSION requested=cpu active_cpu={len(active['cpu'])} active_gpu={len(active['gpu'])} active_tpu={len(active['tpu'])} active_unknown={len(active['unknown'])} can_launch={can}")
          PY

      - name: Record deferred admission
        if: steps.admission.outputs.can_launch != 'true'
        run: echo 'Phase A 003 request deferred before Kaggle write; fresh approval required on manual redispatch.'

      - name: Push one private CPU Phase A v3 run
        if: steps.admission.outputs.can_launch == 'true'
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          kernel_dir="${WORKDIR}/kernel"; mkdir -p "${kernel_dir}"; cp "${WORKDIR}/script.py" "${kernel_dir}/script.py"
          python3 - "${kernel_dir}" <<'PY'
          import json,os,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          metadata={"id":os.environ['TARGET_KERNEL'],"title":"CMI Flu Phase A B1 vs B2.1 20260904 003","code_file":"script.py","language":"python","kernel_type":"script","is_private":True,"enable_gpu":False,"enable_tpu":False,"enable_internet":False,"machine_shape":"","dataset_sources":[],"competition_sources":[os.environ['TARGET_COMPETITION']],"kernel_sources":[],"model_sources":[]}
          (root/'kernel-metadata.json').write_text(json.dumps(metadata,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
          set +e
          "${WORKDIR}/venv/bin/kaggle" kernels push -p "${kernel_dir}" --timeout 14400 >"${WORKDIR}/push.stdout" 2>"${WORKDIR}/push.stderr"
          rc=$?; set -e; rm -f "${WORKDIR}/push.stdout" "${WORKDIR}/push.stderr"
          if [[ "${rc}" -ne 0 ]]; then echo 'ERROR: Phase A 003 kernel push failed; response suppressed; no retry'; exit 1; fi
          echo "CMI_FLU_PHASE_A_003_LAUNCH PASS request_id=20260904-cmi-flu-phase-a-003 target=${TARGET_KERNEL} accelerator=cpu internet=false submission=false automatic_compute_retries=0"

      - name: Cleanup runner-local content
        if: always()
        run: |
          if [[ -n "${WORKDIR-}" && -d "${WORKDIR}" ]]; then rm -rf "${WORKDIR}"; fi
          echo 'Runner-local Phase A v3 content removed'
