name: CMI-Flu strategy E11c Task1.1 robust TabPFN CPU 002

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e11c-robust-tabpfn-002.yml
      - requests/cmi-flu-strategy-e11c-robust-tabpfn-002.json
      - scripts/cmi_flu_strategy_e11c_prepare_v3.py
      - scripts/cmi_flu_strategy_e11c_execute_v2.py
      - scripts/cmi_flu_strategy_e11c_sanitize_v2.py
      - docs/cmi-flu-e11c-robust-tabpfn-002.md
  push:
    branches: [main]
    paths:
      - .github/workflows/cmi-flu-strategy-e11c-robust-tabpfn-002.yml
      - requests/cmi-flu-strategy-e11c-robust-tabpfn-002.json
      - scripts/cmi_flu_strategy_e11c_prepare_v3.py
      - scripts/cmi_flu_strategy_e11c_execute_v2.py
      - scripts/cmi_flu_strategy_e11c_sanitize_v2.py
      - docs/cmi-flu-e11c-robust-tabpfn-002.md

permissions: {}

concurrency:
  group: cmi-flu-e11c-robust-tabpfn-002-${{ github.event_name }}
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_ID: 20260910-cmi-flu-strategy-e11c-robust-tabpfn-002
  PARENT_REQUEST_ID: 20260910-cmi-flu-strategy-e11c-robust-tabpfn-001
  TARGET_KERNEL: renta0426/cmi-flu-e11c-robust-tabpfn-20260910-002
  PARENT_TARGET: renta0426/cmi-flu-e11c-robust-tabpfn-20260910-001
  SCIENCE_COMMIT: 0815f4517345e127dbcbcae0f380a54f3a3d15bd
  E11C_BLOB: acf876996b5849f7ba794999d45ecb862d1be507
  E11C_SYNTH_BLOB: 9b94633192b5254a7d1debe8db10606b48104076
  TABPFN_WHEEL_FILENAME: tabpfn-8.5.0-py3-none-any.whl
  TABPFN_WHEEL_BYTES: "771167"
  TABPFN_WHEEL_SHA256: 4c076a019cfa5520e9c41405cecda845bdd09d909ede4a60c43839bbc83bf7a0
  LOCK_PATH: requirements/kaggle-2.2.4.lock

jobs:
  validate:
    name: Validate manual E11c-002 successor without credentials
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Enforce secret-free validation boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY TABPFN_TOKEN HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done

      - name: Materialize exact bridge commit and pinned science relay
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e11c-002/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split("/",1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip("/").endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if ".." in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 "${workdir}/bridge/scripts/cmi_flu_strategy_e11c_materialize_payload.py" \
            --repository-root "${workdir}/bridge" \
            --output "${workdir}/science"

      - name: Prove successor changes identity/provenance only
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" <<'PY'
          import ast,json,pathlib,sys
          root=pathlib.Path(sys.argv[1])
          parent=json.loads((root/"requests/cmi-flu-strategy-e11c-robust-tabpfn-001.json").read_text())
          request=json.loads((root/"requests/cmi-flu-strategy-e11c-robust-tabpfn-002.json").read_text())
          assert request["request_id"]=="20260910-cmi-flu-strategy-e11c-robust-tabpfn-002"
          assert request["parent_request_id"]=="20260910-cmi-flu-strategy-e11c-robust-tabpfn-001"
          assert request["target"]=="renta0426/cmi-flu-e11c-robust-tabpfn-20260910-002"
          assert request["science_source_commit"]=="0815f4517345e127dbcbcae0f380a54f3a3d15bd"
          p=request["manual_successor_provenance"]
          assert p=={
            "prior_request_id":"20260910-cmi-flu-strategy-e11c-robust-tabpfn-001",
            "prior_actions_run":34474957373,
            "prior_actions_job":102863653370,
            "failure_classification":"resource_concurrency_admission_prewrite",
            "model_access_preflight_succeeded":True,
            "fresh_target_absence_confirmed":True,
            "savekernel_attempted":False,
            "kernel_version_consumed":False,
            "compute_started":False,
            "scientific_result_produced":False,
            "automatic_retry":False,
            "science_changed":False,
          }
          normalized=dict(request); normalized.pop("manual_successor_provenance")
          normalized["request_id"]=parent["request_id"]
          normalized["parent_request_id"]=parent["parent_request_id"]
          normalized["target"]=parent["target"]
          assert normalized==parent
          assert request["resource"]["accelerator"]=="cpu"
          assert request["resource"]["max_active_runs"]==1
          assert request["resource"]["max_real_tabpfn_fits"]==21
          assert request["automatic_compute_retries"]==0
          assert request["competition_submission_attempted"] is False
          assert request["leaderboard_used_for_selection"] is False
          assert request["source_attachment_validator_repair"]["successful_audit_002_actions_run"]==34460007561
          assert request["source_attachment_validator_repair"]["successful_audit_002_actions_job"]==102815418161
          assert request["source_attachment_validator_repair"]["rerun_e11b_005"] is False
          for path in (
            "scripts/cmi_flu_strategy_e11c_prepare_v3.py",
            "scripts/cmi_flu_strategy_e11c_execute_v2.py",
            "scripts/cmi_flu_strategy_e11c_sanitize_v2.py",
          ):
              source=(root/path).read_text(); compile(source,path,"exec")
              tree=ast.parse(source)
              attrs=[n.func.attr for n in ast.walk(tree) if isinstance(n,ast.Call) and isinstance(n.func,ast.Attribute)]
              if path.endswith("execute_v2.py"):
                  assert "kernels_push" not in attrs
                  assert "kernels_list" not in attrs
          PY
          python3 -m py_compile \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_prepare_v3.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_execute_v2.py" \
            "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_sanitize_v2.py"

      - name: Build exact E11c-002 runtime and run synthetic regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORKDIR}/wheel"
          python3 -m pip download --disable-pip-version-check --no-input --no-deps --only-binary=:all: --dest "${WORKDIR}/wheel" 'tabpfn==8.5.0' >/dev/null
          echo "${TABPFN_WHEEL_SHA256}  ${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" | sha256sum -c -
          [[ "$(stat -c '%s' "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}")" == "${TABPFN_WHEEL_BYTES}" ]]
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_prepare_v3.py" \
            --repository-root "${WORKDIR}/bridge" \
            --science-root "${WORKDIR}/science" \
            --reference-dir "${WORKDIR}/references" \
            --tabpfn-wheel "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" \
            --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${WORKDIR}/runtime.py")" -lt 900000 ]]
          grep -F 'REQUEST_ID = "20260910-cmi-flu-strategy-e11c-robust-tabpfn-002"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'TARGET_KERNEL = "renta0426/cmi-flu-e11c-robust-tabpfn-20260910-002"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'SCIENCE_COMMIT = "0815f4517345e127dbcbcae0f380a54f3a3d15bd"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'E11C_BLOB = "acf876996b5849f7ba794999d45ecb862d1be507"' "${WORKDIR}/runtime.py" >/dev/null
          grep -F 'TABPFN_WHEEL_B64 = ""' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F '20260910-cmi-flu-strategy-e11c-robust-tabpfn-001' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'renta0426/cmi-flu-e11c-robust-tabpfn-20260910-001' "${WORKDIR}/runtime.py" >/dev/null
          python3 "${WORKDIR}/runtime.py" --synthetic --output-dir "${WORKDIR}/synthetic"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_sanitize_v2.py" --input-dir "${WORKDIR}/synthetic" --allow-synthetic

      - name: Validate frozen transport and fresh-target guard without credentials
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" - <<'PY'
          import inspect
          import cmi_flu_source_attachment_identity as identity
          import cmi_flu_strategy_e11c_execute_v2 as execute
          assert execute.REQUEST_ID=="20260910-cmi-flu-strategy-e11c-robust-tabpfn-002"
          assert execute.TARGET=="renta0426/cmi-flu-e11c-robust-tabpfn-20260910-002"
          assert execute.PARENT_ACTIONS_RUN==34474957373 and execute.PARENT_ACTIONS_JOB==102863653370
          assert execute.base.CONSUMED_E11B_TARGET=="renta0426/cmi-flu-e11b-tabpfn3-20260910-005"
          assert execute.base.prewrite_guard.__module__=="cmi_flu_strategy_e11c_execute"
          assert execute.base.push.__module__=="cmi_flu_strategy_e11c_execute"
          assert "kernels_push" in inspect.getsource(execute.base.push)
          assert "require_exact_source_attachments" in inspect.getsource(execute.base.push)
          identity.self_test()
          class Item:
              def __init__(self,ref): self.ref=ref
          class EmptyApi:
              def __init__(self): self.calls=[]
              def kernels_list(self,**kwargs): self.calls.append(dict(kwargs)); return []
          empty=EmptyApi(); execute.base.prewrite_guard(empty)
          assert len(empty.calls)==1
          assert empty.calls[0]["search"]=="cmi-flu-e11c-robust-tabpfn-20260910-002"
          class ExistingApi:
              def kernels_list(self,**kwargs): return [Item(execute.TARGET)]
          try:
              execute.base.prewrite_guard(ExistingApi())
          except RuntimeError as exc:
              assert "write refused" in str(exc)
          else:
              raise AssertionError("existing E11c-002 target did not fail closed")
          print("CMI_FLU_E11C_002_SECRET_FREE_PASS science_unchanged=true target=fresh retry=manual write=false compute=false")
          PY

      - name: Cleanup validation content
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  run:
    name: Run one private CPU E11c 002 and read aggregate result
    needs: validate
    if: github.event_name == 'push' && github.repository == 'renta0426/kaggle-actions-bridge' && github.ref == 'refs/heads/main' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    concurrency:
      group: kaggle-resource-global
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Enforce protected execution boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$WORKFLOW_SHA" == "$EVENT_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/cmi-flu-strategy-e11c-robust-tabpfn-002.yml@refs/heads/main" ]]
          workdir="$(mktemp -d)"
          echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"

      - name: Materialize exact approved bridge commit and pinned science relay
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - "${WORKDIR}/bridge" "${EXPECTED_REPOSITORY}" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target,repo,ref=pathlib.Path(sys.argv[1]),sys.argv[2],sys.argv[3]
          target.mkdir(parents=True)
          req=urllib.request.Request(f"https://codeload.github.com/{repo}/tar.gz/{ref}",headers={"User-Agent":"cmi-flu-e11c-002-run/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:
              data=response.read(70_000_001)
          if len(data)>70_000_000: raise SystemExit("bridge archive too large")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
              files=[item for item in archive.getmembers() if item.isfile()]
              prefixes={item.name.split("/",1)[0] for item in files}
              if len(prefixes)!=1: raise SystemExit("bridge archive layout")
              prefix=next(iter(prefixes))+"/"
              if not prefix.rstrip("/").endswith(ref): raise SystemExit("bridge codeload commit mismatch")
              for item in files:
                  rel=pathlib.PurePosixPath(item.name[len(prefix):])
                  if ".." in rel.parts: raise SystemExit("unsafe bridge archive")
                  out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True)
                  out.write_bytes(archive.extractfile(item).read())
          PY
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_materialize_payload.py" \
            --repository-root "${WORKDIR}/bridge" \
            --output "${WORKDIR}/science"

      - name: Build exact E11c-002 runtime from pinned relay
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${WORKDIR}/wheel"
          python3 -m pip download --disable-pip-version-check --no-input --no-deps --only-binary=:all: --dest "${WORKDIR}/wheel" 'tabpfn==8.5.0' >/dev/null
          echo "${TABPFN_WHEEL_SHA256}  ${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" | sha256sum -c -
          [[ "$(stat -c '%s' "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}")" == "${TABPFN_WHEEL_BYTES}" ]]
          python3 -m pip install --disable-pip-version-check --no-input numpy==2.3.5 pandas==2.2.3 scipy==1.17.0 scikit-learn==1.8.0 PyYAML==6.0.3 >/dev/null
          python3 -m venv "${WORKDIR}/refs-venv"
          "${WORKDIR}/refs-venv/bin/pip" install --disable-pip-version-check --no-input gdown==5.2.0 >/dev/null
          "${WORKDIR}/refs-venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_fetch_locked_hai_references.py" --output-dir "${WORKDIR}/references"
          python3 "${WORKDIR}/bridge/scripts/cmi_flu_inspect_locked_hai_reference_schema.py" --reference-dir "${WORKDIR}/references"
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_prepare_v3.py" \
            --repository-root "${WORKDIR}/bridge" \
            --science-root "${WORKDIR}/science" \
            --reference-dir "${WORKDIR}/references" \
            --tabpfn-wheel "${WORKDIR}/wheel/${TABPFN_WHEEL_FILENAME}" \
            --output "${WORKDIR}/runtime.py"
          python3 "${WORKDIR}/runtime.py" --self-test
          [[ "$(stat -c '%s' "${WORKDIR}/runtime.py")" -lt 900000 ]]
          ! grep -F '20260910-cmi-flu-strategy-e11c-robust-tabpfn-001' "${WORKDIR}/runtime.py" >/dev/null
          ! grep -F 'renta0426/cmi-flu-e11c-robust-tabpfn-20260910-001' "${WORKDIR}/runtime.py" >/dev/null

      - name: Install locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "${WORKDIR}/venv"
          "${WORKDIR}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${WORKDIR}/bridge/${LOCK_PATH}" >/dev/null
          "${WORKDIR}/venv/bin/python" -m pip check >/dev/null
          "${WORKDIR}/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
          echo "${WORKDIR}/venv/bin" >> "${GITHUB_PATH}"

      - name: Run one approved E11c-002 CPU kernel
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" "${WORKDIR}/venv/bin/python" "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_execute_v2.py" \
            --runtime "${WORKDIR}/runtime.py" \
            --bridge-root "${WORKDIR}/bridge" \
            --output-dir "${WORKDIR}/output"
          unset KAGGLE_API_TOKEN

      - name: Validate aggregate-only E11c-002 result
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH="${WORKDIR}/bridge/scripts" python3 "${WORKDIR}/bridge/scripts/cmi_flu_strategy_e11c_sanitize_v2.py" --input-dir "${WORKDIR}/output"

      - name: Cleanup runner-local content
        if: always()
        shell: bash
        run: |
          unset KAGGLE_API_TOKEN || true
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
