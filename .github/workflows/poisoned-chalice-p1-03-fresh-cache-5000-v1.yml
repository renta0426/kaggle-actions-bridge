name: Poisoned Chalice P1-03 fresh-disjoint 5k cache v1

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-fresh-cache-5000-v1.yml
      - requests/poisoned-chalice-p1-03-fresh-cache-5000-v1.json
      - payloads/poisoned-chalice-p1-03-fresh-cache-5000-v1/**
  push:
    branches: [main]
    paths:
      - .github/workflows/poisoned-chalice-p1-03-fresh-cache-5000-v1.yml
      - requests/poisoned-chalice-p1-03-fresh-cache-5000-v1.json
      - payloads/poisoned-chalice-p1-03-fresh-cache-5000-v1/**

permissions: {}

concurrency:
  group: kaggle-api-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_REPOSITORY_ID: "1354356687"
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  TARGET: renta0426/poisoned-chalice-lumia-fresh-cache-5000-v1

jobs:
  validate:
    name: Validate frozen fresh-cache materialization without credentials
    if: github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce secret-free boundary and fetch exact current bundle
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]]
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY HF_TOKEN; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable:$name"; exit 1; }
          done
          source_sha="$EVENT_SHA"; [[ "$EVENT_NAME" != "pull_request" ]] || source_sha="$PR_HEAD_SHA"
          [[ "$source_sha" =~ ^[0-9a-f]{40}$ ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=$workdir" >> "$GITHUB_ENV"; echo "SOURCE_SHA=$source_sha" >> "$GITHUB_ENV"
          python3 - "$source_sha" "$workdir" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value)
          files={
            'requests/poisoned-chalice-p1-03-fresh-cache-5000-v1.json':131072,
            'payloads/poisoned-chalice-p1-03-fresh-cache-5000-v1/fetch_historical_material.py':32768,
            'payloads/poisoned-chalice-p1-03-fresh-cache-5000-v1/materialize_fresh_cache.py':131072,
          }
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for path,maximum in files.items():
              req=urllib.request.Request(f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}',headers={'User-Agent':'p1-03-fresh-cache-pr/1'})
              with opener.open(req,timeout=30) as response:data=response.read(maximum+1)
              if not data or len(data)>maximum:raise SystemExit(f'current source byte budget failed:{path}')
              out=root/pathlib.Path(path).name; out.write_bytes(data)
              if path.endswith('.py'):compile(data,path,'exec')
          PY
      - name: Validate frozen request and materialize Notebook
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$WORKDIR/poisoned-chalice-p1-03-fresh-cache-5000-v1.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1]))
          assert r['request_id']=='20260910-poisoned-chalice-p1-03-fresh-cache-5000-v1-001'
          assert r['operation']=='save_kernel_once' and r['expected_target_version']==1
          assert r['target']=='renta0426/poisoned-chalice-lumia-fresh-cache-5000-v1' and r['title']=='Poisoned Chalice Lumia Fresh Cache 5000 V1'
          assert r['science_commit']=='01549b06596bb328e4c25ee0d984a039a11a306d'
          assert r['science_freeze_files']=={
            'docs/P1_03_FRESH_DISJOINT_5K_CONFIRMATION_FREEZE_20260910.md':'3b2c7ca07df645648f12c3a96c42ab5ce5d09fb7',
            'configs/p1_03_fresh_disjoint_5k_confirmation_v1_20260910.json':'6fba79aadefd044e5f698c430a19788f03943173',
            'scripts/build_lumia_hidden_state_fresh_disjoint_5000_notebook_v1.py':'4f593ac671440cf341de2c575576031f7642b1f9'}
          assert r['historical_materialized_source']['bridge_commit']=='ac70f67bda548c8d0e2f29fe25f430cae9b2ff54'
          assert r['resource']['accelerator']=='gpu' and r['resource']['machine_shape']=='NvidiaTeslaT4' and r['resource']['expected_visible_gpu_count']==2
          assert r['automatic_compute_retries']==0 and r['competition_submission'] is False
          assert r['clean_room']['fresh_hidden_confirmation_cohort'] is True and r['clean_room']['fresh_for_stage1_branch'] is False
          assert r['clean_room']['membership_physically_absent_during_target_model_scoring'] is True
          assert r['scientific_contract']['frozen_future_fusion_hidden_weights']==[0.75,0.5]
          assert r['scientific_contract']['frozen_future_portable_scalar']=='mean_96_feature_scalar' and r['scientific_contract']['no_formula_added_after_fresh_result'] is True
          assert len(r['persistent_outputs'])==26 and len(set(r['persistent_outputs']))==26
          print('P1_03_FRESH_CACHE_REQUEST_GATE PASS rows=5000 gpu=T4x2 retries=0 submission=0')
          PY
          python3 "$WORKDIR/fetch_historical_material.py" --output "$WORKDIR/research"
          python3 "$WORKDIR/materialize_fresh_cache.py" --research-root "$WORKDIR/research" --kernel-dir "$WORKDIR/kernel"
          python3 - "$WORKDIR/kernel" <<'PY'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); meta=json.loads((root/'kernel-metadata.json').read_text()); nb=root/meta['code_file']
          assert meta['id']=='renta0426/poisoned-chalice-lumia-fresh-cache-5000-v1'
          assert meta['is_private'] is True and meta['enable_gpu'] is True and meta['enable_tpu'] is False and meta['enable_internet'] is True
          assert meta['machine_shape']=='NvidiaTeslaT4'
          assert meta['dataset_sources']==['renta0426/stage1-raw-fim-submission-v1-output']
          assert meta['kernel_sources']==['renta0426/poisoned-chalice-lumia-hidden-state-cache-5000-v1']
          print('P1_03_FRESH_CACHE_PR_VALIDATE PASS write_calls=0 notebook_sha256='+hashlib.sha256(nb.read_bytes()).hexdigest())
          PY
      - name: Cleanup validation material
        if: always()
        shell: bash
        run: '[[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"'

  launch:
    name: Launch approved fresh-disjoint 5k T4 cache exactly once
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'renta0426/kaggle-actions-bridge' && github.actor == 'renta0426' && github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Enforce protected boundary and fetch exact bundle
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_REPOSITORY_ID: ${{ github.event.repository.id }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$EVENT_REPOSITORY" == "$EXPECTED_REPOSITORY" && "$EVENT_REPOSITORY_ID" == "$EXPECTED_REPOSITORY_ID" ]]
          [[ "$EVENT_ACTOR" == "$EXPECTED_ACTOR" && "$EVENT_ACTOR_ID" == "$EXPECTED_ACTOR_ID" && "$EVENT_SENDER_ID" == "$EXPECTED_ACTOR_ID" ]]
          [[ "$EVENT_SHA" == "$WORKFLOW_SHA" ]]
          [[ "$WORKFLOW_REF" == "renta0426/kaggle-actions-bridge/.github/workflows/poisoned-chalice-p1-03-fresh-cache-5000-v1.yml@refs/heads/main" ]]
          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" && -n "$KAGGLE_API_TOKEN" && "$KAGGLE_API_TOKEN" == KGAT_* ]]
          workdir="$(mktemp -d)"; echo "WORKDIR=$workdir" >> "$GITHUB_ENV"; echo "KERNEL_DIR=$workdir/kernel" >> "$GITHUB_ENV"
          python3 - "$EVENT_SHA" "$workdir" <<'PY'
          import pathlib,ssl,sys,urllib.request
          sha,root_value=sys.argv[1:]; root=pathlib.Path(root_value)
          files={
            'requests/poisoned-chalice-p1-03-fresh-cache-5000-v1.json':131072,
            'payloads/poisoned-chalice-p1-03-fresh-cache-5000-v1/fetch_historical_material.py':32768,
            'payloads/poisoned-chalice-p1-03-fresh-cache-5000-v1/materialize_fresh_cache.py':131072,
            'scripts/kaggle_exact_identity.py':65536,
            'requirements/kaggle-2.2.4.lock':65536,
          }
          ctx=ssl.create_default_context()
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl): return None
          opener=urllib.request.build_opener(urllib.request.HTTPSHandler(context=ctx),NoRedirect())
          for path,maximum in files.items():
              req=urllib.request.Request(f'https://raw.githubusercontent.com/renta0426/kaggle-actions-bridge/{sha}/{path}',headers={'User-Agent':'p1-03-fresh-cache-launch/1'})
              with opener.open(req,timeout=30) as response:data=response.read(maximum+1)
              if not data or len(data)>maximum:raise SystemExit(f'current source byte budget failed:{path}')
              out=root/pathlib.Path(path).name; out.write_bytes(data)
              if path.endswith('.py'):compile(data,path,'exec')
          PY
          echo "P1_03_FRESH_CACHE_BOUNDARY PASS gpu=T4x2 retries=0 submissions=0"
      - name: Reconstruct Notebook and locked Kaggle client
        shell: bash
        run: |
          set -euo pipefail
          python3 "$WORKDIR/fetch_historical_material.py" --output "$WORKDIR/research"
          python3 "$WORKDIR/materialize_fresh_cache.py" --research-root "$WORKDIR/research" --kernel-dir "$KERNEL_DIR"
          python3 -m venv "$WORKDIR/venv"
          "$WORKDIR/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "$WORKDIR/kaggle-2.2.4.lock" >/dev/null
          "$WORKDIR/venv/bin/python" -m pip check >/dev/null
          "$WORKDIR/venv/bin/kaggle" --version | grep -F '2.2.4' >/dev/null
      - name: Live contract quota and GPU preflight
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/poisoned-chalice-p1-03-fresh-cache-5000-v1.json" <<'PY'
          import json,re,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,safe_exception,status_name,verify_current
          r=json.load(open(sys.argv[1])); api=KaggleApi(); api.authenticate(); target=r['target']; owner,slug=target.split('/',1)
          assert r['request_id']=='20260910-poisoned-chalice-p1-03-fresh-cache-5000-v1-001' and r['automatic_compute_retries']==0 and r['competition_submission'] is False
          pages=api.competition_list_pages(r['competition']) or []; content={}
          for page in pages:
              d=page.to_dict() if hasattr(page,'to_dict') else dict(page); name=str(d.get('name') or '').strip().lower()
              if name:content[name]=str(d.get('content') or '')
          if 'rules' not in content or 'evaluation' not in content or not any('data' in name for name in content):raise SystemExit('live competition contract pages unavailable')
          plain=re.sub(r'\s+',' ',re.sub(r'<[^>]+>',' ',content['evaluation'].replace(r'\%','%'))).casefold()
          if not all(x in plain for x in ('auc','novelty','1%','false-positive')):raise SystemExit('live evaluation contract changed')
          src=r['inputs']['kernels'][0]
          if verify_current(api,src['ref'],1,allow_failed=False,cpu=False)!='COMPLETE':raise SystemExit('consumed hidden input not complete')
          sm=exact_metadata(api,src['ref'])
          if int(getattr(sm,'current_version_number',0))!=1 or getattr(sm,'enable_gpu',None) is not True:raise SystemExit('consumed hidden source identity changed')
          ds=r['inputs']['dataset']; p=json.loads(api.dataset_status(ds['ref'],format='json(current_version_number)')); dv=p.get('current_version_number')
          if dv is None or int(dv)!=1:raise SystemExit(f'Stage1 dataset version mismatch:{dv!r}')
          try:exact_metadata(api,target)
          except Exception as exc:
              http=safe_exception(exc).get('http_status')
              if http not in (403,404):raise SystemExit(f'target exact absence failed:http={http}')
          else:raise SystemExit('fresh target already exists')
          visible=api.kernels_list(user=owner,search=slug,page_size=100) or []
          if len(visible)>=100 or any(str(getattr(x,'ref','') or '')==target for x in visible):raise SystemExit('fresh target exact-ref discovered')
          quota=api.quota_view(); gpu=getattr(quota,'gpu_quota',None)
          if gpu is None:raise SystemExit('GPU quota unavailable')
          remaining=(gpu.total_time_allowed-gpu.time_used).total_seconds()/3600.0
          if remaining<float(r['resource']['min_remaining_quota_hours']):raise SystemExit(f'GPU quota refused:{remaining:.3f}h')
          recent=(api.kernels_list(user=owner,sort_by='dateRun',page_size=25) or [])[:25]; gpu_active=0; unknown=0; active_total=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:state=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if state not in ACTIVE:continue
              active_total+=1
              try:
                  m=exact_metadata(api,ref); eg=getattr(m,'enable_gpu',None); et=getattr(m,'enable_tpu',None)
                  if type(eg) is not bool or type(et) is not bool:raise RuntimeError('accelerator unknown')
              except Exception:unknown+=1;continue
              if eg is True and et is False:gpu_active+=1
          if unknown:raise SystemExit(f'GPU admission unknown={unknown}')
          if gpu_active>=int(r['resource']['max_active_runs']):raise SystemExit(f'GPU concurrency refused:{gpu_active}')
          print(f'P1_03_FRESH_CACHE_PREFLIGHT PASS gpu_active={gpu_active} active_total={active_total} quota_remaining_h={remaining:.3f} stage1_version=1 consumed_hidden_version=1 target_absent=1 write_calls=0')
          PY
      - name: Recheck and perform exactly one SaveKernel call
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          set -euo pipefail
          PYTHONPATH="$WORKDIR" "$WORKDIR/venv/bin/python" - "$WORKDIR/poisoned-chalice-p1-03-fresh-cache-5000-v1.json" "$KERNEL_DIR" <<'PY'
          import hashlib,json,sys
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kaggle_exact_identity import ACTIVE,exact_metadata,exact_metadata_eventually,safe_exception,status_name
          r=json.load(open(sys.argv[1])); target=r['target']; owner,slug=target.split('/',1); api=KaggleApi(); api.authenticate()
          try:exact_metadata(api,target)
          except Exception as exc:
              http=safe_exception(exc).get('http_status')
              if http not in (403,404):raise SystemExit(f'pre-write target check failed:http={http}')
          else:raise SystemExit('pre-write target exists')
          visible=api.kernels_list(user=owner,search=slug,page_size=100) or []
          if len(visible)>=100 or any(str(getattr(x,'ref','') or '')==target for x in visible):raise SystemExit('pre-write target absence not proven')
          quota=api.quota_view(); gpu=getattr(quota,'gpu_quota',None)
          if gpu is None:raise SystemExit('pre-write GPU quota unavailable')
          remaining=(gpu.total_time_allowed-gpu.time_used).total_seconds()/3600.0
          if remaining<float(r['resource']['min_remaining_quota_hours']):raise SystemExit(f'pre-write quota refused:{remaining:.3f}h')
          recent=(api.kernels_list(user=owner,sort_by='dateRun',page_size=25) or [])[:25]; gpu_active=0; unknown=0
          for item in recent:
              ref=str(getattr(item,'ref','') or '')
              if not ref:continue
              try:state=status_name(getattr(api.kernels_status(ref),'status',None))
              except Exception:unknown+=1;continue
              if state not in ACTIVE:continue
              try:
                  m=exact_metadata(api,ref); eg=getattr(m,'enable_gpu',None); et=getattr(m,'enable_tpu',None)
                  if type(eg) is not bool or type(et) is not bool:raise RuntimeError('accelerator unknown')
              except Exception:unknown+=1;continue
              if eg is True and et is False:gpu_active+=1
          if unknown or gpu_active>=int(r['resource']['max_active_runs']):raise SystemExit(f'pre-write GPU admission refused:gpu_active={gpu_active} unknown={unknown}')
          response=None; failure=None
          try:response=api.kernels_push(sys.argv[2])
          except Exception as exc:failure=('exception',safe_exception(exc))
          else:
              error=str(getattr(response,'error','') or '')
              if error:failure=('response_error',{'http_status':None,'error_sha256':hashlib.sha256(error.encode()).hexdigest()})
          discovered=api.kernels_list(user=owner,search=slug,page_size=100) or []; exact_visible=any(str(getattr(x,'ref','') or '')==target for x in discovered)
          if failure and not exact_visible:
              kind,info=failure;raise SystemExit(f"one-shot SaveKernel failed with no target:kind={kind} http={info.get('http_status')} error_sha256={info.get('error_sha256')} write_calls=1 write_observed=0")
          try:meta=exact_metadata_eventually(api,target,attempts=6,delay_seconds=2.0)
          except Exception as exc:
              info=safe_exception(exc);raise SystemExit(f"post-write exact metadata unavailable:visible={int(exact_visible)} http={info.get('http_status')} error_sha256={info.get('error_sha256')} write_calls=1")
          if getattr(meta,'ref',None)!=target or int(getattr(meta,'current_version_number',0))!=1:raise SystemExit('post-write target/version mismatch')
          if getattr(meta,'is_private',None) is not True or getattr(meta,'enable_gpu',None) is not True or getattr(meta,'enable_tpu',None) is not False or getattr(meta,'enable_internet',None) is not True:raise SystemExit('post-write metadata mismatch')
          state=status_name(getattr(api.kernels_status(target),'status',None))
          if state not in ACTIVE|{'COMPLETE','ERROR','CANCELLED','CANCELED'}:raise SystemExit(f'post-write state unknown:{state}')
          print(f'P1_03_FRESH_CACHE_SAVE PASS target={target} version=1 gpu=1 private=1 state={state} quota_remaining_h={remaining:.3f} write_calls=1 failure_return={failure[0] if failure else "none"}')
          PY
      - name: Cleanup runner-local material
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "$WORKDIR" ]] || rm -rf "$WORKDIR"
          echo "P1_03_FRESH_CACHE_CLEANUP PASS retention_days=0"
