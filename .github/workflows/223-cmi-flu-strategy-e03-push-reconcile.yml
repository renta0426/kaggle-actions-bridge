name: CMI-Flu E03 ambiguous-push read-only reconcile

on:
  pull_request:
    paths:
      - .github/workflows/223-cmi-flu-strategy-e03-push-reconcile.yml
      - requests/cmi-flu-strategy-e03-push-reconcile-001.json
      - requirements/kaggle-2.2.4.lock
      - scripts/kaggle_exact_identity.py
  push:
    branches: [main]
    paths:
      - .github/workflows/223-cmi-flu-strategy-e03-push-reconcile.yml
      - requests/cmi-flu-strategy-e03-push-reconcile-001.json

permissions: {}

concurrency:
  group: kaggle-resource-global
  cancel-in-progress: false

env:
  EXPECTED_REPOSITORY: renta0426/kaggle-actions-bridge
  EXPECTED_ACTOR: renta0426
  EXPECTED_ACTOR_ID: "71638068"
  REQUEST_PATH: requests/cmi-flu-strategy-e03-push-reconcile-001.json
  LOCK_PATH: requirements/kaggle-2.2.4.lock
  TARGET_KERNEL: renta0426/cmi-flu-e03-task11-optional-view-fusion-20260908-001
  TARGET_SLUG: cmi-flu-e03-task11-optional-view-fusion-20260908-001
  EXPECTED_VERSION: "1"

jobs:
  validate:
    name: Validate read-only reconciliation request without secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Enforce secret-free boundary
        shell: bash
        run: |
          set -euo pipefail
          for name in KAGGLE_API_TOKEN KAGGLE_USERNAME KAGGLE_KEY GH_TOKEN GITHUB_PAT RESEARCH_REPO_READ_TOKEN SSH_PRIVATE_KEY; do
            [[ -z "${!name-}" ]] || { echo "unexpected credential variable: ${name}"; exit 1; }
          done
      - name: Materialize exact event commit and validate manifest
        shell: bash
        env:
          EVENT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EVENT_SHA}" <<'PY'
          import io,json,pathlib,ssl,sys,tarfile,urllib.request
          target=pathlib.Path(sys.argv[1]); ref=sys.argv[2]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/renta0426/kaggle-actions-bridge/tarball/{ref}",headers={"User-Agent":"cmi-flu-e03-reconcile/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:data=response.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit("bridge archive exceeds byte budget")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
            files=[m for m in archive.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit("bridge archive layout invalid")
            prefix=next(iter(prefixes))+'/'
            for member in files:
              rel=pathlib.PurePosixPath(member.name[len(prefix):])
              if not member.name.startswith(prefix) or not rel.parts or '..' in rel.parts:raise SystemExit("unsafe bridge archive")
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.extractfile(member).read())
          manifest=json.loads((target/'requests/cmi-flu-strategy-e03-push-reconcile-001.json').read_text(encoding='utf-8'))
          expected={
            'schema_version':1,
            'request_id':'20260908-cmi-flu-strategy-e03-push-reconcile-001',
            'competition':'cmi-flu-first-prediction-challenge',
            'operation':'exact_private_kernel_reconcile_read_only',
            'target':'renta0426/cmi-flu-e03-task11-optional-view-fusion-20260908-001',
            'expected_version_if_present':1,
            'prior_bridge_commit':'197ae4dea652bda8d3fb74cbbc2d5824cba7dadd',
            'prior_workflow_run_id':34193867697,
            'side_effects':[],
            'competition_submission_attempted':False,
            'kaggle_write_attempted':False,
            'automatic_compute_retries':0,
          }
          for key,value in expected.items():
            if manifest.get(key)!=value:raise SystemExit(f'reconcile request mismatch:{key}')
          if manifest.get('api_budget')!={'exact_metadata_attempts':6,'exact_metadata_delay_seconds':5,'list_page_size':10,'max_total_calls':10}:raise SystemExit('reconcile api budget mismatch')
          prior=manifest.get('prior_push_result') or {}
          if prior.get('return_code')!=1 or prior.get('stdout_bytes')!=0 or prior.get('stderr_bytes')!=102:raise SystemExit('prior push receipt mismatch')
          print('CMI_FLU_E03_RECONCILE_REQUEST PASS read_only=true')
          PY
      - name: Verify workflow has no Kaggle write or submission command
        shell: bash
        run: |
          set -euo pipefail
          f="${WORKDIR}/bridge/.github/workflows/223-cmi-flu-strategy-e03-push-reconcile.yml"
          ! grep -Eq 'kernels[[:space:]]+push|save_kernel|competitions[[:space:]]+submit|competition_submit|delete_kernel' "$f"
          echo 'CMI_FLU_E03_RECONCILE_STATIC_SAFETY PASS'
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"

  reconcile:
    name: Reconcile exact private E03 target after ambiguous push
    needs: validate
    if: >-
      github.event_name == 'push' &&
      github.repository == 'renta0426/kaggle-actions-bridge' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'renta0426' &&
      github.actor_id == '71638068'
    environment: kaggle-readonry
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Enforce protected read-only boundary
        shell: bash
        env:
          EVENT_REPOSITORY: ${{ github.repository }}
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_ACTOR_ID: ${{ github.actor_id }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
          EVENT_SHA: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${EVENT_REPOSITORY}" == "${EXPECTED_REPOSITORY}" ]]
          [[ "${EVENT_ACTOR}" == "${EXPECTED_ACTOR}" && "${EVENT_ACTOR_ID}" == "${EXPECTED_ACTOR_ID}" && "${EVENT_SENDER_ID}" == "${EXPECTED_ACTOR_ID}" ]]
          [[ "${WORKFLOW_SHA}" == "${EVENT_SHA}" ]]
          [[ "${WORKFLOW_REF}" == "renta0426/kaggle-actions-bridge/.github/workflows/223-cmi-flu-strategy-e03-push-reconcile.yml@refs/heads/main" ]]
      - name: Materialize approved bridge commit and install locked Kaggle client
        shell: bash
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"; echo "WORKDIR=${workdir}" >> "${GITHUB_ENV}"
          python3 - "${workdir}/bridge" "${EVENT_SHA}" <<'PY'
          import io,pathlib,ssl,sys,tarfile,urllib.request
          target=pathlib.Path(sys.argv[1]); ref=sys.argv[2]; target.mkdir(parents=True)
          req=urllib.request.Request(f"https://api.github.com/repos/renta0426/kaggle-actions-bridge/tarball/{ref}",headers={"User-Agent":"cmi-flu-e03-reconcile/1"})
          with urllib.request.urlopen(req,timeout=45,context=ssl.create_default_context()) as response:data=response.read(25_000_001)
          if len(data)>25_000_000:raise SystemExit("bridge archive exceeds byte budget")
          with tarfile.open(fileobj=io.BytesIO(data),mode="r:gz") as archive:
            files=[m for m in archive.getmembers() if m.isfile()]; prefixes={m.name.split('/',1)[0] for m in files}
            if len(prefixes)!=1:raise SystemExit("bridge archive layout invalid")
            prefix=next(iter(prefixes))+'/'
            for member in files:
              rel=pathlib.PurePosixPath(member.name[len(prefix):])
              if not member.name.startswith(prefix) or not rel.parts or '..' in rel.parts:raise SystemExit("unsafe bridge archive")
              out=target.joinpath(*rel.parts); out.parent.mkdir(parents=True,exist_ok=True); out.write_bytes(archive.extractfile(member).read())
          PY
          python3 -m venv "${workdir}/venv"
          "${workdir}/venv/bin/python" -m pip install --disable-pip-version-check --no-input --no-deps --only-binary=:all: --require-hashes -r "${workdir}/bridge/${LOCK_PATH}" >/dev/null
          "${workdir}/venv/bin/python" -m pip check >/dev/null
      - name: Perform bounded exact target reconciliation only
        shell: bash
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          PYTHONPATH: ${{ env.WORKDIR }}/bridge/scripts
        run: |
          set -euo pipefail
          [[ -n "${KAGGLE_API_TOKEN}" && "${KAGGLE_API_TOKEN}" == KGAT_* ]]
          "${WORKDIR}/venv/bin/python" - <<'PY'
          from __future__ import annotations
          import os,time
          from kaggle.api.kaggle_api_extended import KaggleApi
          from kagglesdk.kernels.types.kernels_api_service import ApiGetKernelRequest
          from kaggle_exact_identity import _http_status, status_name, validate_metadata
          target=os.environ['TARGET_KERNEL']; expected=int(os.environ['EXPECTED_VERSION'])
          owner,slug=target.split('/',1); api=KaggleApi(); api.authenticate(); observed=[]; metadata=None
          for attempt in range(1,7):
              request=ApiGetKernelRequest(); request.user_name=owner; request.kernel_slug=slug
              try:
                  with api.build_kaggle_client() as client:
                      metadata=client.kernels.kernels_api_client.get_kernel(request).metadata
                  break
              except Exception as exc:
                  code=_http_status(exc); observed.append(code)
                  if code==429:raise SystemExit('E03_RECONCILE rate_limit_stop')
                  if code not in {403,404}:raise SystemExit('E03_RECONCILE nontransient_exact_failure')
                  if attempt<6:time.sleep(5)
          if metadata is not None:
              validate_metadata(metadata,target,expected,cpu=True)
              state=status_name(getattr(api.kernels_status(target),'status',None))
              print(f'E03_RECONCILE_RESULT exists=true exact_identity=true version={expected} status={state} cpu_offline=true attempts={len(observed)+1}')
              raise SystemExit(0)
          listed=api.kernels_list(user=owner,search=slug,page_size=10) or []
          list_present=target in {str(getattr(item,'ref','')) for item in listed}
          if observed and all(code==404 for code in observed) and not list_present:
              print(f'E03_RECONCILE_RESULT exists=false exact_404_attempts={len(observed)} list_consistent_absent=true write_consumption_not_observed=true')
              raise SystemExit(0)
          if list_present:raise SystemExit('E03_RECONCILE exact_list_conflict')
          raise SystemExit('E03_RECONCILE unresolved_after_bounded_exact_reads')
          PY
      - name: Cleanup
        if: always()
        shell: bash
        run: |
          [[ -z "${WORKDIR-}" || ! -d "${WORKDIR}" ]] || rm -rf "${WORKDIR}"
