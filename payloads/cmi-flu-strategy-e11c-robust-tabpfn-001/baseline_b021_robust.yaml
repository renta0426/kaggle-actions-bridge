    - {name: enet_a0.01_l0.5, family: elastic_net, params: {alpha: 0.01, l1_ratio: 0.5}, target_transform: log1p, clip_min: 0.0}
    - {name: enet_a0.1_l0.5, family: elastic_net, params: {alpha: 0.1, l1_ratio: 0.5}, target_transform: log1p, clip_min: 0.0}
    - {name: pls_1, family: pls, params: {n_components: 1}, target_transform: log1p, clip_min: 0.0}
    - {name: pls_2, family: pls, params: {n_components: 2}, target_transform: log1p, clip_min: 0.0}
    - {name: pls_3, family: pls, params: {n_components: 3}, target_transform: log1p, clip_min: 0.0}
    - {name: pls_5, family: pls, params: {n_components: 5}, target_transform: log1p, clip_min: 0.0}
  hai:
    - {name: ridge_subtype_a0.1, family: ridge, params: {alpha: 0.1}, drop_columns: [virus_strain, strain_substrate, strain_isolation_year]}
    - {name: ridge_subtype_a1, family: ridge, params: {alpha: 1.0}, drop_columns: [virus_strain, strain_substrate, strain_isolation_year]}
    - {name: ridge_subtype_a10, family: ridge, params: {alpha: 10.0}, drop_columns: [virus_strain, strain_substrate, strain_isolation_year]}
    - {name: ridge_subtype_a100, family: ridge, params: {alpha: 100.0}, drop_columns: [virus_strain, strain_substrate, strain_isolation_year]}
    - {name: ridge_exact_a0.1, family: ridge, params: {alpha: 0.1}}
    - {name: ridge_exact_a1, family: ridge, params: {alpha: 1.0}}
    - {name: ridge_exact_a10, family: ridge, params: {alpha: 10.0}}
    - {name: ridge_exact_a100, family: ridge, params: {alpha: 100.0}}
