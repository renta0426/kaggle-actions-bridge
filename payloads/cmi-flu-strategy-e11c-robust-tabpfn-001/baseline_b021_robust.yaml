    - {name: enet_a0.001_l0.5, family: elastic_net, params: {alpha: 0.001, l1_ratio: 0.5}, target_transform: log1p, clip_min: 0.0}
    - {name: enet_a0.01_l0.5, family: elastic_net, params: {alpha: 0.01, l1_ratio: 0.5}, target_transform: log1p, clip_min: 0.0}
    - {name: enet_a0.1_l0.5, family: elastic_net, params: {alpha: 0.1, l1_ratio: 0.5}, target_transform: log1p, clip_min: 0.0}
    - {name: pls_1, family: pls, params: {n_components: 1}, target_transform: log1p, clip_min: 0.0}
