schema_version: 1
baseline: b021_taskwise_robust
competition_slug: cmi-flu-first-prediction-challenge
random_state: 42
verify_md5: true
paths:
  data_dir: data/raw
  external_dir: external
  artifacts_dir: artifacts
submission:
  filename: b021_taskwise_robust.csv
  require_nonconstant_public_tasks: true
flow:
  task_12_mode: broad
  task_13_mode: broad
  include_sdy272_asc_proxy: false
hai:
  target_representation: residual
  run_stress_tests: true
selection:
  policy: robust_v1
model_sets:
  task_11:
    - {name: ridge_a0.1, family: ridge, params: {alpha: 0.1}, target_transform: log, clip_min: 0.0}
    - {name: ridge_a1, family: ridge, params: {alpha: 1.0}, target_transform: log, clip_min: 0.0}
    - {name: ridge_a10, family: ridge, params: {alpha: 10.0}, target_transform: log, clip_min: 0.0}
    - {name: ridge_a100, family: ridge, params: {alpha: 100.0}, target_transform: log, clip_min: 0.0}
    - {name: enet_a0.001_l0.1, family: elastic_net, params: {alpha: 0.001, l1_ratio: 0.1}, target_transform: log, clip_min: 0.0}
    - {name: enet_a0.01_l0.1, family: elastic_net, params: {alpha: 0.01, l1_ratio: 0.1}, target_transform: log, clip_min: 0.0}
    - {name: enet_a0.1_l0.1, family: elastic_net, params: {alpha: 0.1, l1_ratio: 0.1}, target_transform: log, clip_min: 0.0}
    - {name: enet_a0.001_l0.5, family: elastic_net, params: {alpha: 0.001, l1_ratio: 0.5}, target_transform: log, clip_min: 0.0}
    - {name: enet_a0.01_l0.5, family: elastic_net, params: {alpha: 0.01, l1_ratio: 0.5}, target_transform: log, clip_min: 0.0}
    - {name: enet_a0.1_l0.5, family: elastic_net, params: {alpha: 0.1, l1_ratio: 0.5}, target_transform: log, clip_min: 0.0}
    - {name: pls_1, family: pls, params: {n_components: 1}, target_transform: log, clip_min: 0.0}
    - {name: pls_2, family: pls, params: {n_components: 2}, target_transform: log, clip_min: 0.0}
    - {name: pls_3, family: pls, params: {n_components: 3}, target_transform: log, clip_min: 0.0}
    - {name: pls_5, family: pls, params: {n_components: 5}, target_transform: log, clip_min: 0.0}
    - {name: et_d3_l5_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 3, min_samples_leaf: 5, max_features: sqrt}, target_transform: log, clip_min: 0.0}
    - {name: et_d3_l10_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 3, min_samples_leaf: 10, max_features: sqrt}, target_transform: log, clip_min: 0.0}
    - {name: et_d5_l5_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 5, min_samples_leaf: 5, max_features: sqrt}, target_transform: log, clip_min: 0.0}
    - {name: et_d5_l10_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 5, min_samples_leaf: 10, max_features: sqrt}, target_transform: log, clip_min: 0.0}
  task_12:
