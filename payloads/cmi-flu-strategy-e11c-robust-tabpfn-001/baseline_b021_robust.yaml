    - {name: pls_5, family: pls, params: {n_components: 5}, target_transform: log1p, clip_min: 0.0}
    - {name: et_d3_l5_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 3, min_samples_leaf: 5, max_features: sqrt}, target_transform: log1p, clip_min: 0.0}
    - {name: et_d3_l10_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 3, min_samples_leaf: 10, max_features: sqrt}, target_transform: log1p, clip_min: 0.0}
    - {name: et_d5_l5_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 5, min_samples_leaf: 5, max_features: sqrt}, target_transform: log1p, clip_min: 0.0}
    - {name: et_d5_l10_sqrt, family: extra_trees, params: {n_estimators: 500, max_depth: 5, min_samples_leaf: 10, max_features: sqrt}, target_transform: log1p, clip_min: 0.0}
  task_13:
    - {name: ridge_a0.1, family: ridge, params: {alpha: 0.1}, target_transform: log1p, clip_min: 0.0}
    - {name: ridge_a1, family: ridge, params: {alpha: 1.0}, target_transform: log1p, clip_min: 0.0}
    - {name: ridge_a10, family: ridge, params: {alpha: 10.0}, target_transform: log1p, clip_min: 0.0}
    - {name: ridge_a100, family: ridge, params: {alpha: 100.0}, target_transform: log1p, clip_min: 0.0}
    - {name: enet_a0.001_l0.1, family: elastic_net, params: {alpha: 0.001, l1_ratio: 0.1}, target_transform: log1p, clip_min: 0.0}
    - {name: enet_a0.01_l0.1, family: elastic_net, params: {alpha: 0.01, l1_ratio: 0.1}, target_transform: log1p, clip_min: 0.0}
    - {name: enet_a0.1_l0.1, family: elastic_net, params: {alpha: 0.1, l1_ratio: 0.1}, target_transform: log1p, clip_min: 0.0}
