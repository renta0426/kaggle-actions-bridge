    - {name: ridge_a1, family: ridge, params: {alpha: 1.0}, target_transform: log1p, clip_min: 0.0}
    - {name: ridge_a10, family: ridge, params: {alpha: 10.0}, target_transform: log1p, clip_min: 0.0}
